<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Engagement cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Generated by generate_cockpit_v2.py from data/*.json. Do not edit the output by hand. */
:root{
  --navy:#0F2B52;--green:#006843;--bg:#F4F3F0;--sidebar:var(--nrs-w);
  --surface:#FFFFFF;--surface-2:#F8F7F4;--line:#E4E2DC;--ink:#1B2230;--ink-2:#5B6270;--ink-3:#8C919A;
  --ok:#1E7A4C;--ok-bg:#E6F2EB;--watch:#A86A00;--watch-bg:#FBF0DA;--late:#B3261E;--late-bg:#FBE7E5;
  --info:#0F2B52;--info-bg:#E5EBF5;--none:#6B7280;--none-bg:#EEEEEC;
  --track:#E9E7E1;--today:#0F2B52;--link:#006843;
  --fh:'Hanken Grotesk',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif;
  --fs-11:10.5px;--fs-12:11.5px;--fs-13:12.5px;--fs-14:13px;--fs-16:14.5px;--fs-20:18px;--fs-26:22px;
  --r:10px;
}
@media (max-width:900px){:root{--fs-11:11px;--fs-12:12px;--fs-13:13px;--fs-14:13.5px;--fs-20:18px;--fs-26:21px}}
html.dark{
  --bg:#0E131B;--surface:#171E29;--surface-2:#1C2431;--line:#2A3342;--ink:#E8EAEE;--ink-2:#A8AEB9;--ink-3:#7A818D;
  --ok:#5CC08C;--ok-bg:#16301F;--watch:#E8B34A;--watch-bg:#33280F;--late:#F07A70;--late-bg:#3A1A18;
  --info:#9DB7E0;--info-bg:#1F2B40;--none:#A8AEB9;--none-bg:#232B38;
  --track:#262F3D;--today:#9DB7E0;--link:#6FCB9C;color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);font-size:var(--fs-13);color:var(--ink);background:var(--bg);line-height:1.45}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:var(--link);text-decoration:none;font-weight:600;cursor:pointer}

.who-btn{width:100%;display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;text-align:left;font-size:var(--fs-13)}
.who-btn .chev{margin-left:auto;opacity:.7}
.who-pop{display:none;position:absolute;left:14px;right:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.25);padding:6px;z-index:50;max-height:60vh;overflow:auto}
.who-pop.open{display:block}
.who-pop .g{font:600 10px/1 var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:8px 8px 4px}
.who-pop button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:6px;font-size:var(--fs-13)}
.who-pop button:hover,.who-pop button.on{background:var(--surface-2)}
.who-pop .r{margin-left:auto;font-size:var(--fs-11);color:var(--ink-3)}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font:700 9.5px/1 var(--fh);background:#DDE5F0;color:var(--navy);flex:none}
.av.c{background:#EDE7DA;color:#6B5320}

.main{margin-left:var(--sidebar);min-height:100vh}
.tbr{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.stale{background:var(--watch-bg);color:var(--watch);font-size:var(--fs-12);padding:8px 28px;border-bottom:1px solid var(--line)}
.page{padding:18px 24px 56px;max-width:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec h2{font:700 var(--fs-11)/1 var(--fh);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.sec .r{font-size:var(--fs-12);color:var(--ink-3);display:flex;gap:12px;align-items:center}
.grid{display:grid;gap:12px}
.g-main{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.stack>.card:last-child{flex:1}
.eg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.eg .s2{grid-column:span 2} .eg .s3{grid-column:span 3} .eg .s5{grid-column:1/-1}
.et{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;min-width:0}
.ecol{display:flex;flex-direction:column;gap:12px;min-width:0}
.ecol>.card{margin:0} .ecol>.card:last-child{flex:1}
.eg .s5>.card{margin:0}
.empty{color:var(--ink-3);font-size:var(--fs-12)}
.lead{font-size:var(--fs-13);color:var(--ink-2);margin-bottom:14px;max-width:760px}

/* band */
.band{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}

.say{font:600 var(--fs-14)/1.4 var(--fh);color:var(--ink);margin-top:6px}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.clamp3.open{-webkit-line-clamp:unset}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.num{font:800 var(--fs-26)/1 var(--fh);color:var(--ink);margin-top:8px}
.sub{font-size:var(--fs-12);color:var(--ink-2);margin-top:5px}

/* rows */
.row{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:2px}
.row .t{font-weight:600;font-size:var(--fs-13)}
.row .w{font-size:var(--fs-12);color:var(--ink-2);margin-top:2px}
.row .o{margin-left:auto;flex:none;display:flex;align-items:center;gap:6px;font-size:var(--fs-12);color:var(--ink-3);white-space:nowrap}
.row .grow{min-width:0;flex:1}
.ic{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:700 12px/1 var(--fh)}
.k-late{background:var(--late-bg);color:var(--late)} .k-dec{background:var(--info-bg);color:var(--info)}
.k-ppl{background:var(--watch-bg);color:var(--watch)} .k-mine{background:var(--ok-bg);color:var(--ok)} .k-wait{background:var(--none-bg);color:var(--none)}
.foot{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:var(--fs-12);color:var(--ink-2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.st{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-11);font-weight:600;border-radius:20px;padding:2px 8px;white-space:nowrap}
.st::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.st.ok{background:var(--ok-bg);color:var(--ok)} .st.watch{background:var(--watch-bg);color:var(--watch)}
.st.late{background:var(--late-bg);color:var(--late)} .st.none{background:var(--none-bg);color:var(--none)} .st.info{background:var(--info-bg);color:var(--info)}
.tag{font-size:var(--fs-11);color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;white-space:nowrap}
.cleanup{display:flex;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:var(--fs-12);color:var(--ink-2)}
.cleanup b{color:var(--ink)}

/* phase strip + plan */
.strip{position:relative;margin:4px 0 16px}
.strip .ph{display:flex;gap:3px}
.strip .ph div{flex:1;min-width:0;font:600 10.5px/1 var(--fh);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .ph div.cur{background:var(--info-bg);color:var(--info);border-color:transparent}
.strip .mk{position:relative;height:16px;margin:3px 0 12px}
.dl{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid var(--navy);background:var(--surface)}
html.dark .dl{border-color:#9DB7E0}
.dl.done{background:var(--navy)} html.dark .dl.done{background:#9DB7E0}
.dl.late{border-color:var(--late);background:var(--late-bg)}
.dl.ms{border-radius:2px;transform:rotate(45deg);width:10px;height:10px;margin:-5px 0 0 -5px;border-color:var(--green);background:var(--green)}
.dl.gate{border-color:var(--late);background:var(--late)}
.dl[data-t]:hover::after{content:attr(data-t);position:absolute;bottom:16px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--surface);font:500 11.5px/1.3 var(--fb);padding:5px 8px;border-radius:6px;z-index:5;pointer-events:none}
.dl.ms[data-t]:hover::after,.dl.gate[data-t]:hover::after{transform:translateX(-50%) rotate(-45deg)}
.todayline{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--today);opacity:.6}
.todaylab{position:absolute;top:18px;font:700 10px/1 var(--fh);color:var(--today);transform:translateX(-50%);letter-spacing:.05em}

.ws{display:grid;grid-template-columns:minmax(0,1.3fr) 150px minmax(0,1fr);gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ws:first-of-type{border-top:0}
.ws .nm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.ws .nm{flex-wrap:wrap;row-gap:4px}
.ws .nm span.x{min-width:0}
.ws .nx{font-size:var(--fs-12);color:var(--ink-2);min-width:0}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--track);gap:2px}
.bar i{display:block;height:100%}
.bar-l{font-size:var(--fs-11);color:var(--ink-3);margin-top:4px}
.ws.lk{grid-template-columns:minmax(0,.8fr) 160px minmax(0,1.7fr)}
@media (max-width:760px){ .ws.lk{grid-template-columns:minmax(0,1fr)} }
.ws .al{font-size:var(--fs-12);color:var(--ink-2)}
.ws .al b{color:var(--ink)}
.dchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;align-items:center}
.dchip{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:2px 7px;border:1px solid var(--line);border-radius:999px;font-size:var(--fs-11);color:var(--ink-2);background:var(--bg-2,transparent);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dchip i{font-style:normal;font-weight:700;color:var(--ink)}
.dchip i.r{color:var(--late)}
.dchip.run{border-style:dashed}
.ws.run{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(15,43,82,.03) 6px 12px)}
.svc{display:inline-block;max-width:100%;padding:1px 7px;border-radius:4px;font-size:var(--fs-11);font-weight:600;background:rgba(0,104,67,.09);color:var(--green);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.svc.run{background:rgba(15,43,82,.07);color:var(--navy)}
.svc.none{background:transparent;color:var(--ink-3);font-weight:400}
html.dark .svc{background:rgba(80,200,150,.14);color:#7fd8b0}
html.dark .svc.run{background:rgba(150,180,230,.12);color:#b8c8e8}
.svt{color:var(--green);font-weight:600}
html.dark .svt{color:#7fd8b0}
.tp{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;padding:12px 16px;margin-bottom:12px}
.tpl{display:flex;gap:10px;align-items:flex-start;min-width:0;border-right:1px solid var(--line);padding-right:14px}

.tpl-a{font-size:var(--fs-12);font-weight:600;cursor:pointer}

.tpt th{font:700 var(--fs-11)/1 var(--fh);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:0 8px 6px 0;border-bottom:1px solid var(--line)}
.tpt td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top;min-width:0}
.tpt tr:last-child td{border-bottom:0}
.tpd{font-weight:700;color:var(--ink);cursor:pointer;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpd:hover{color:var(--green)}
.tpd.run{color:var(--navy)}
.tpd.q{color:var(--ink-3);font-weight:600;cursor:default}
html.dark .tpd.run{color:#b8c8e8}
.tpw,.tpm{font-size:var(--fs-11);color:var(--ink-3);margin-top:2px}
.tpc{white-space:nowrap}
.tpdue{white-space:nowrap}
.tpav .av{margin-right:2px}
.tpmore{font-size:var(--fs-11);color:var(--ink-3);margin-top:6px}
.tptoday{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:8px;padding:6px 8px;background:rgba(0,104,67,.06);border-radius:6px;font-size:var(--fs-12)}
.tpti b{color:var(--green)}
.tbd .grp td{padding:16px 0 0;border-bottom:0;font-size:var(--fs-13)}
.grph{padding-bottom:6px;border-bottom:2px solid var(--navy);font-family:var(--fh)}

.tpo{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tbd tbody:first-of-type .grp td{padding-top:4px}

@media (max-width:760px){ .tp{grid-template-columns:minmax(0,1fr);gap:8px} .tpl{border-right:0;padding-right:0}
  .tpt thead,.tpt colgroup{display:none} .tpt,.tpt tbody{display:block}
  .tpt tr{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .tpt tr:last-child{border-bottom:0} .tpt td{border:0;padding:0}
  .tpt td:not(:first-child):not(.tpn):not(.tpdue){display:none}
  .tpt .tpdue{grid-column:2;grid-row:1;text-align:right} .tpt .tpn{grid-column:1/-1;margin-top:3px}
  .tpt .tpw{display:none}
  .tbd tr.grp{display:block;border:0;padding:0} .tbd tr.grp td{display:block!important} }
.tctx{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px;margin-bottom:12px;align-items:stretch}
.tctx>.card{display:flex;flex-direction:column}
.agd .plan{flex:1}

.plan>div.re{border-right:0} .plan>div.lb{border-bottom:0}
.plan .ph0{font:700 var(--fs-11)/1 var(--fh);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--bg,#f6f5f1);padding:7px 8px}
.plan .pwk{font:700 var(--fs-11)/1.2 var(--fh);color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;background:var(--bg,#f6f5f1)}
.plan .pdn{font-size:var(--fs-11);color:var(--ink-3);margin-bottom:5px;display:flex;gap:5px;align-items:center}
.plan .pdn b{font:700 var(--fs-13)/1 var(--fh);color:var(--ink)}
.plan .pmore{margin-left:auto;font-size:10.5px;color:var(--ink-3);cursor:pointer}
.plan .past{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.025) 6px 12px)}
.plan .past .pdn b{color:var(--ink-3)}
.plan .tdy{box-shadow:inset 0 3px 0 var(--navy);background:rgba(15,43,82,.03)}
.plan .tdy .pdn b{color:var(--navy)}
.pit{font-size:var(--fs-11);line-height:1.3;padding:2px 0 2px 7px;border-left:2px solid var(--navy);margin-bottom:6px;cursor:pointer}
.pit:hover{background:rgba(15,43,82,.05)}
.pit b{font:700 10.5px/1.2 var(--fh);color:var(--navy);display:block}
.pit .x{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
.pit.done{opacity:.55} .pit.done .x{text-decoration:line-through;text-decoration-color:rgba(0,0,0,.3)}
.pit.r{border-left-style:dashed;border-left-color:var(--ink-3);cursor:default} .pit.r .x{color:var(--ink-2)} .pit.r:hover{background:none}
.pit.d{border-left-color:var(--green);cursor:default} .pit.d b{color:var(--green)}
.pit .agi em{font-style:normal;font-size:10px;color:var(--ink-3);align-self:center}
.pplus{display:block;font-size:var(--fs-11);font-weight:600;margin:-2px 0 6px 9px;cursor:pointer}
html.dark .pit b,html.dark .plan .tdy .pdn b{color:#b8c8e8}
@media (max-width:760px){ .plan{grid-template-columns:minmax(0,1fr);grid-template-rows:none} .plan .ph0,.plan .past{display:none} .plan>div{border-right:0} .plan .pwk{border-bottom:1px solid var(--line)} .plan .pc{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:8px} .plan .pc>*:not(.pdn){grid-column:2} .plan .pdn{grid-row:1/span 8;flex-direction:column;align-items:flex-start} .plan .pc.past{display:none} }
.wkcal{margin:0 0 12px}
.tctx .card{margin:0}
.wgrid{display:grid;column-gap:10px}
.wbrk{border-left:1px dashed var(--line);margin:0 6px}
.wc{min-width:0}

.wc .dh b{font:700 var(--fs-13)/1 var(--fh);color:var(--ink)}
.wc.today .dh{border-bottom:2px solid var(--navy)}
.wc.today .dh b{color:var(--navy)}

.wc .it{border-left:2px solid var(--navy);padding:1px 0 1px 8px;margin-bottom:10px;font-size:var(--fs-12);line-height:1.3;cursor:pointer;border-radius:0 4px 4px 0}
.wc .it:hover{background:rgba(15,43,82,.05)}

.wc .it.d .t{color:var(--green)}

.mm-cal{flex:none;width:52px;border:1px solid var(--line);border-radius:8px;text-align:center;padding:4px 0;font-size:var(--fs-11);color:var(--ink-3);line-height:1.15}

<style id="nrs-css">

<script id="nrs-js">
/* The frame: brand block, the Cockpit | Findings switch, the menu, the dark-mode switch and the

   {screen, client, name, where, built, switch}. Without it (the standalone file, the public site)
   there is no switch and no built line. The theme is one key for all three screens: nr_dark. */

try{ var sv=JSON.parse(localStorage.getItem('nr_cockpit_v2')||'{}'); if(sv.who && (sv.who==='team' || D.people.some(function(p){return p.id===sv.who}))) S.who=sv.who; if(sv.page) S.page=sv.page; }catch(e){}
function save(){ try{ localStorage.setItem('nr_cockpit_v2', JSON.stringify({who:S.who,page:S.page})); }catch(e){} }
var LASTSEEN = (function(){ try{ return JSON.parse(localStorage.getItem('nr_cockpit_seen')||'{}'); }catch(e){ return {}; } })();
var VIEWED = {};
function markSeen(){ try{ var m=JSON.parse(localStorage.getItem('nr_cockpit_seen')||'{}'); Object.keys(VIEWED).forEach(function(k){ m[k]=D.eng.as_of; }); localStorage.setItem('nr_cockpit_seen',JSON.stringify(m)); }catch(e){} }
window.addEventListener('pagehide',markSeen);
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') markSeen(); });

/* ---------------- helpers ---------------- */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function P(id){ return D.people.find(function(p){return p.id===id}) || {name:'?',ini:'?'}; }
function av(id){ var p=P(id); return '<span class="av'+(p.nr?'':' c')+'" title="'+esc(p.full||p.name)+'">'+esc(p.ini)+'</span>'; }
function first(n){ return String(n||'').split(' ')[0]; }
function plural(n,w,ws){ return n+' '+(n===1?w:(ws||w+'s')); }
function isLead(){ return S.who===D.lead || S.who==='team'; }
function isTeam(){ return S.who==='team'; }
function mine(list){ return list.filter(function(x){ return (x.owners||[]).indexOf(S.who)>=0; }); }
function openActs(){ return D.actions.filter(function(a){return !a.done}); }
function match(o){ if(!S.q) return true; return JSON.stringify(o).toLowerCase().indexOf(S.q.toLowerCase())>=0; }
var STAGE = {not_started:'Not started',in_progress:'In progress',in_review:'In review',with_client:'With the client',done:'Done',dropped:'Dropped'};
var STATUS = {ok:'On track',watch:'Watch',late:'Behind',none:'No update yet'};
/* action -> deliverable links */
var LK = D.links||{on:false}, DEL={}, WSN={}, ABYID={};
D.deliverables.forEach(function(d){DEL[d.id]=d}); D.workstreams.forEach(function(w){WSN[w.id]=w.name}); D.actions.forEach(function(a){ABYID[String(a.id)]=a});
var RUN=/\bwave\b/i.test(D.eng.name||'')?'Running the wave':'Running the engagement';
function serves(a){ return a.deliverable&&DEL[a.deliverable]? DEL[a.deliverable].name : a.lead_work? RUN : 'Not linked'; }
function servesWs(a){ return a.dws? (WSN[a.dws]||a.dws) : a.lead_work? RUN : 'Not linked'; }
function servesTag(a){ if(!LK.on) return ''; return '<span class="svc'+(a.lead_work?' run':a.deliverable?'':' none')+'">'+esc(serves(a))+'</span>'; }
function goDel(name){ var s=rs('actions'); s.f={del:name}; s.st=(REG.actions.def||[]).slice(); s.lim=50; go('actions'); }

/* ---------------- sidebar ---------------- */
function nav(){
  var hasAnalysis = D.hypotheses || D.assumptions.length;
  var items = [['eng','Engagement'],['week','This week']];
  var ov = [['plan','Plan & deliverables'],['people','Stakeholders'],['risks','Risks'],['actions','Actions']];
  if(hasAnalysis) ov.push(['analysis','Hypotheses & assumptions']);
  if(D.insights.length) ov.push(['findings','Insights']);
  ov.push(['questions','Open questions']); ov.push(['decisions','Decisions']);
  var nr = D.people.filter(function(p){return p.nr}), cl = D.people.filter(function(p){return !p.nr});
  var me = P(S.who);
  function btn(k,l){ return '<button class="'+(S.page===k?'on':'')+'" onclick="go(\''+k+'\')">'+l+'</button>'; }
  function pbtn(p){ return '<button class="'+(S.who===p.id?'on':'')+'" onclick="pick(\''+p.id+'\')">'+av(p.id)+'<span>'+esc(p.full||p.name)+'</span><span class="r">'+(p.lead?'Case lead':'')+'</span></button>'; }
  $('#sb').innerHTML =
    '<div><div class="sb-brand">Nova Reperta</div><div class="sb-eng">'+esc(D.eng.name)+'<small>'+esc(D.eng.client||'')+(D.eng.phase?' · '+esc(shortPhase(D.eng.phase)):'')+'</small></div></div>'+
    '<div style="position:relative"><div class="sb-h">Whose week</div><button class="who-btn" onclick="togWho(event)">'+(isTeam()?'<span class="av">★</span><span>Whole team</span>':av(S.who)+'<span>'+esc(me.full||me.name)+'</span>')+'<span class="chev">▾</span></button>'+
      '<div class="who-pop" id="whopop"><button class="'+(isTeam()?'on':'')+'" onclick="pick(\'team\')"><span class="av">★</span><span>Whole team</span><span class="r">Daily check-in</span></button><div class="g">Nova Reperta</div>'+nr.map(pbtn).join('')+(cl.length?'<div class="g">Client team</div>'+cl.map(pbtn).join(''):'')+'</div></div>'+
    '<nav class="sb-nav">'+items.map(function(i){return btn(i[0],i[1])}).join('')+'</nav>'+
    '<div><div class="sb-h">Overviews</div><nav class="sb-nav">'+ov.map(function(i){return btn(i[0],i[1])}).join('')+'</nav></div>'+
    '<div class="sb-foot"><span>'+esc(D.eng.classification||'')+'</span><button onclick="dark()">Dark</button></div>';
}
function shortPhase(s){ s=String(s); return s.length>40 ? s.split(/[—–,-]/)[0].trim() : s; }
function togWho(e){ e.stopPropagation(); $('#whopop').classList.toggle('open'); }
document.addEventListener('click',function(){ var p=$('#whopop'); if(p) p.classList.remove('open'); });
function pick(id){ S.who=id; S.page='week'; save(); render(); }
function go(p){ S.page=p; S.q=''; save(); render(); window.scrollTo(0,0); }
function dark(){ NRShell.toggle(); }

/* ---------------- shared blocks ---------------- */
function strip(){
  var T=D.timeline; if(!T.phases.length) return T.note?'<p class="empty" style="margin-bottom:12px">'+esc(T.note)+'</p>':'';
  var end=T.end||1, pc=function(v){return (v/end*100).toFixed(2)+'%'};
  var ph = T.phases.map(function(p,i){ return '<div class="'+(i===T.current?'cur':'')+'" style="flex:'+(p.e-p.s)+'" title="'+esc(p.desc)+'">'+esc(p.name)+'</div>'; }).join('');
  var mk = T.marks.map(function(m){ return '<span class="dl '+(m.kind==='gate'?'gate':'ms')+'" style="left:'+pc(m.pos)+'" data-t="'+esc(m.label)+'"></span>'; }).join('');
  var today = T.today!=null && T.today>=0 && T.today<=end ? '<div class="todayline" style="left:'+pc(T.today)+'"></div><div class="todaylab" style="left:'+pc(T.today)+'">TODAY</div>' : '';
  return '<div class="strip"><div class="ph">'+ph+'</div><div class="mk">'+mk+today+'</div></div>'+(T.note?'<p class="empty" style="margin:-6px 0 10px">'+esc(T.note)+'</p>':'');
}
function wsBlock(list){
  if(!list.length) return '';
  return list.map(function(w){
    var c=w.counts, tot=w.total||0, late=D.deliverables.filter(function(d){return w.dels.indexOf(d.id)>=0 && d.late}).length;
    var mov=D.deliverables.filter(function(d){return w.dels.indexOf(d.id)>=0 && d.moving}).length;
    var done=c.done+c.with_client, prog=c.in_review+c.in_progress+mov-late;
    var bar = tot? '<div class="bar">'+(done?'<i class="c-done" style="flex:'+done+'"></i>':'')+(late?'<i class="c-late" style="flex:'+late+'"></i>':'')+(prog>0?'<i class="c-prog" style="flex:'+prog+'"></i>':'')+'<i style="flex:'+Math.max(0,tot-done-late-Math.max(prog,0))+'"></i></div><div class="bar-l">'+done+' of '+tot+' delivered'+(late?' · '+late+' late':'')+(mov?' · '+mov+' with work under way':'')+'</div>' : '<div class="bar-l">No deliverables</div>';
    return '<div class="ws'+(LK.on?' lk':'')+'"><div class="nm">'+(w.owners[0]?av(w.owners[0]):'')+'<span class="x" title="'+esc(w.full||w.name)+'">'+esc(w.name)+'</span><span class="st '+w.status+'" title="'+esc(w.status_from)+'">'+STATUS[w.status]+'</span></div>'+
      '<div>'+bar+'</div><div class="nx">'+(LK.on? wsActs(w) : (w.next?'Next: '+esc(w.next.name)+(w.next.due?' · <span style="'+(w.next.late?'color:var(--late)':'')+'">'+esc(w.next.due)+'</span>':' · no date'):'Nothing left to deliver'))+'</div></div>';
  }).join('') + (LK.on && LK.lead ? runRow() : '');
}
function actLine(c){ return '<b>'+c.open+'</b> open'+(c.late?' · <span style="color:var(--late)">'+c.late+' late</span>':'')+(c.blocking?' · <span style="color:var(--late)">'+c.blocking+' holding up work</span>':''); }
function wsActs(w){
  var ds=D.deliverables.filter(function(d){return w.dels.indexOf(d.id)>=0 && d.acts && d.acts.open})
    .sort(function(a,b){return (b.acts.blocking-a.acts.blocking)||(b.acts.late-a.acts.late)||(b.acts.open-a.acts.open)});
  return '<div class="al">'+actLine(w.acts)+' actions</div>'+(ds.length?'<div class="dchips">'+ds.slice(0,3).map(function(d){
    return '<a class="dchip" onclick="goDel('+esc(JSON.stringify(d.name))+')" title="Show the actions behind '+esc(d.name)+'">'+esc(d.name)+' <i'+(d.acts.late?' class="r"':'')+'>'+d.acts.open+'</i></a>'; }).join('')+(ds.length>3?'<span class="mut">+'+(ds.length-3)+'</span>':'')+'</div>':'');
}
function runRow(){
  var c=LK.lead;
  return '<div class="ws lk run"><div class="nm">'+av(D.lead)+'<span class="x">'+RUN+'</span><span class="st none" title="Case-lead work that serves the whole wave, not one deliverable">Case lead</span></div>'+
    '<div class="bar-l" style="margin:0">Governance, stakeholders, set-up and team: work that serves no single deliverable</div>'+
    '<div class="nx"><div class="al">'+actLine(c)+' actions</div><div class="dchips"><a class="dchip" onclick="goDel(RUN)">Show them →</a></div></div></div>';
}
function topicsBlock(){
  var t=D.topics; if(!t.length) return '';
  return '<table class="tbl"><thead><tr><th>Topic</th><th>Open</th><th>Late</th><th class="hide-m">Mostly with</th><th class="hide-m">Next due</th></tr></thead><tbody>'+
    t.slice(0,8).map(function(x){ return '<tr class="x" onclick="goActs(\''+esc(x.name).replace(/'/g,"\\'")+'\')"><td><b>'+esc(x.name)+'</b>'+(x.blocking?' <span class="st late">'+x.blocking+' holding up work</span>':'')+'</td><td>'+x.open+'</td><td style="'+(x.late?'color:var(--late);font-weight:600':'')+'">'+(x.late||'—')+'</td><td class="hide-m">'+x.owners.map(av).join(' ')+'</td><td class="hide-m muted">'+(x.next?esc(x.next.due):'—')+'</td></tr>'; }).join('')+
    '</tbody></table>'+(t.length>8?'<div class="showall"><a onclick="go(\'actions\')">'+(t.length-8)+' more topics →</a></div>':'');
}
function goActs(topic){ S.page='actions'; S.q=topic; save(); render(); }

function needsBlock(items){
  var cap=D.cap, shown=items.slice(0,cap);
  var icon={late:'!',dec:'?',ppl:'↓',mine:'→',wait:'…'};
  var rows = shown.map(function(n){ return '<div class="row"><span class="ic k-'+n.kind+'">'+icon[n.kind]+'</span><div class="grow"><div class="t clamp2" title="'+esc(n.text)+'">'+esc(n.text)+'</div><div class="w">'+esc(n.why)+(LK.on&&n.ref.charAt(0)==='a'&&ABYID[n.ref.slice(1)]?' · <span class="svt">'+esc(serves(ABYID[n.ref.slice(1)]))+'</span>':'')+'</div></div><span class="o">'+(n.who[0]&&isLead()?av(n.who[0]):'')+'</span></div>'; }).join('');
  var oa = isLead()? openActs() : mine(openActs());
  var rest = oa.length - shown.filter(function(n){return n.ref.charAt(0)==='a'}).length;
  var lateRest = oa.filter(function(a){return a.late_days}).length - shown.filter(function(n){return n.ref.charAt(0)==='a' && /late/.test(n.why)}).length;
  var foot = '<div class="foot"><span>'+plural(rest,'other open action')+(lateRest>0?', '+lateRest+' of them late.':'.')+'</span><a onclick="go(\'actions\')">All actions →</a></div>';
  var cl = D.cleanup && isLead() ? '<div class="cleanup"><span class="ic k-wait">⟳</span><span><b>'+D.cleanup.count+' actions are more than '+D.cleanup.days+' days late.</b> Take them through the next sync in one go: push, drop or escalate each one.</span></div>' : '';
  return '<section class="card"><div class="sec"><h2>Needs '+(isLead()?'you':first(P(S.who).name))+' this week</h2><span class="r">'+cap+' at most</span></div>'+(rows||'<p class="empty">Nothing needs '+(isLead()?'you':'them')+' right now.</p>')+foot+cl+'</section>';
}
function meetingsBlock(list){
  var now=D.eng.as_of, wk=addDays(now,7);
  var up=list.filter(function(m){return m.date>=now && m.date<=wk});
  var body = up.length? up.map(function(m){ return '<div class="row"><div style="flex:none;width:56px;font:600 var(--fs-12)/1.35 var(--fh);color:var(--ink-2)">'+m.dow+'<b style="display:block;font-size:var(--fs-14);color:var(--ink)">'+m.day+(m.approx?'~':'')+'</b></div><div class="grow"><div class="t">'+esc(m.title)+'</div><div class="w">'+esc(m.who||'')+'</div></div><span class="o" style="color:'+(m.prep_ready?'var(--ok)':'var(--watch)')+';font-weight:600">'+(m.prep?(m.prep_ready?'Prep ready':'Prep open'):'')+'</span></div>'; }).join('')
    : '<p class="empty">'+(D.meetings.length?'Nothing in the next 7 days.':'No meetings are recorded in meetings.json yet.')+'</p>';
  var rh = D.rhythm.length? '<div class="foot"><span>Standing rhythm: '+D.rhythm.map(function(r){return esc(r.title)+' ('+esc(String(r.when).toLowerCase())+')'}).join(' · ')+'</span></div>':'';
  return '<section class="card"><div class="sec"><h2>Next 7 days</h2></div>'+body+rh+'</section>';
}
function addDays(iso,n){ var d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function stepPill(s){ return '<span class="step s-'+(s||'none')+'">'+(s||'Not read yet')+'</span>'; }
function distBlock(list){
  var steps=D.steps, c={}; steps.forEach(function(s){c[s]=0}); var none=0;
  list.forEach(function(s){ if(s.step) c[s.step]++; else none++; });
  return '<div class="dist">'+steps.map(function(s){return c[s]?'<i class="s-'+s+'" style="flex:'+c[s]+'" title="'+s+': '+c[s]+'"></i>':''}).join('')+(none?'<i class="s-none" style="flex:'+none+'" title="Not read yet: '+none+'"></i>':'')+'</div>'+
    '<div class="dist-l">'+steps.map(function(s){return '<span>'+s+(c[s]?' '+c[s]:'')+'</span>'}).join('')+(none?'<span>Not read '+none+'</span>':'')+'</div>';
}
function watchList(){
  var w=[];
  D.stakeholders.filter(function(s){return !s.nr}).forEach(function(s){
    if(s.down) w.push({s:s,why:'Moved down to '+(s.step||'a lower step'),r:4});
    else if(s.below) w.push({s:s,why:(s.step||'Not read yet')+' · need them '+s.target,r:3});
    else if(s.key && !s.step) w.push({s:s,why:'Key person, no read yet',r:2});
    else if(s.key && s.days!=null && s.days>14) w.push({s:s,why:'No contact in '+s.days+' days',r:1});
    else if(s.step==='Resistant') w.push({s:s,why:'Resistant',r:1.5});
  });
  return w.sort(function(a,b){return b.r-a.r});
}
function peopleBlock(){
  var w=watchList(), L=D.stakeholders.filter(function(s){return !s.nr});
  return '<section class="card"><div class="sec"><h2>People to watch</h2><a onclick="go(\'people\')">All '+D.stakeholders.length+' →</a></div>'+distBlock(L)+
    (w.length? w.slice(0,4).map(function(x){ return '<div class="row x" onclick="openM('+D.stakeholders.indexOf(x.s)+')"><div class="grow"><div class="t">'+esc(x.s.name)+'</div><div class="w clamp2">'+esc(x.s.role)+'</div></div><span class="o" style="color:'+(x.r>=4?'var(--late)':x.r>=3?'var(--watch)':'var(--ink-2)')+';font-weight:600;white-space:normal;text-align:right;max-width:45%">'+esc(x.why)+'</span></div>'; }).join('') : '<p class="empty">Nobody moved down, and every key person has been read recently.</p>')+
    (w.length>4?'<div class="foot"><span>'+plural(w.length-4,'more person','more people')+' to keep an eye on.</span><a onclick="SV.attn=true;go(\'people\')">Show them →</a></div>':'')+'</section>';
}
function riskBlock(){
  var R=D.risks.filter(function(r){return r.status!=='closed'});
  var d=R.filter(function(r){return r.decide}).slice(0,3);
  var body = d.length? d.map(function(r){ return '<div class="row"><span class="st late" style="margin-top:2px">'+(r.up?'Rising':'High')+'</span><div class="grow"><div class="t clamp2">'+esc(r.title)+'</div><div class="w">'+esc(r.owner_text||'No owner')+'</div></div></div>'; }).join('') : '<p class="empty">No risk is high on both counts or rising.</p>';
  var rest = R.length-d.length, moreDec = R.filter(function(r){return r.decide}).length-d.length;
  return '<section class="card"><div class="sec"><h2>Risks that need a decision</h2><a onclick="go(\'risks\')">All '+R.length+' →</a></div>'+body+
    '<div class="foot"><span>'+(moreDec>0? moreDec+' more are high or rising. ':'')+rest+' watched in the register.</span></div></section>';
}

/* ---------------- pages ---------------- */
function pageWeek(){
  var b=D.band, E=D.eng;
  if(isTeam()) return pageTeam();
  if(!isLead()) return pagePerson();
  var budgetMeter = b.budget.pct!=null ? '<div class="meter"><i style="width:'+Math.min(100,b.budget.pct)+'%"></i>'+(b.budget.time!=null?'<b style="left:'+Math.min(100,b.budget.time)+'%"></b>':'')+'</div>' : '';
  var band = '<div class="band">'+
    '<div><div class="lab">Biggest open issue</div><div class="say clamp3" onclick="this.classList.toggle(\'open\')" title="Click to read it all">'+esc(E.issue||'None recorded')+'</div></div>'+
    '<div><div class="lab">What’s at stake</div><div class="num">'+esc(b.stake.num)+'</div><div class="sub">'+esc(b.stake.sub)+'</div></div>'+
    '<div><div class="lab">Budget</div><div class="num">'+esc(b.budget.num)+'</div>'+budgetMeter+'<div class="sub">'+esc(b.budget.sub)+'</div></div>'+
    '<div><div class="lab">'+esc(b.next.label)+'</div><div class="num">'+esc(b.next.num)+'</div><div class="sub clamp2" title="'+esc(b.next.sub)+'">'+esc(b.next.sub)+'</div></div></div>';
  var work = D.workstreams.length
    ? '<section class="card"><div class="sec"><h2>Workstreams and deliverables</h2><a onclick="go(\'plan\')">Full plan →</a></div>'+strip()+wsBlock(D.workstreams)+'</section>'
    : '<section class="card"><div class="sec"><h2>Where the work sits</h2><a onclick="go(\'actions\')">All actions →</a></div>'+strip()+topicsBlock()+'</section>';
  return dayBlock()+'<div class="wkcal">'+agendaStrip()+'</div><div class="grid g-main"><div class="stack">'+needsBlock((D.needs[S.who]||[]).filter(function(n){return !inDay(n.ref)}))+'</div><div class="stack">'+peopleBlock()+'</div></div>';
}

function inDay(ref){ var d=D.day; if(!d||!d.set) return false; return d.items.concat(d.carried).some(function(i){return i.action!=null && ref==='a'+i.action}); }
function dayRow(i,n,kind){
  var meta=[]; if(i.action!=null) meta.push('#'+esc(i.action)); if(i.owner_text) meta.push(esc(i.owner_text)); if(i.blocking) meta.push('<span style="color:var(--late)">holds up work</span>'); if(i.late_days) meta.push('<span style="color:var(--late)">'+i.late_days+' days late</span>');
  if(LK.on && i.action!=null && ABYID[String(i.action)]) meta.push('<span class="svt">'+esc(serves(ABYID[String(i.action)]))+'</span>');
  return '<div class="drow'+(i.done?' done':'')+'"><span class="dn '+kind+'">'+(i.done?'✓':kind==='carry'?'↺':n)+'</span><div class="grow">'+(i.time?'<span class="dtime">'+esc(i.time)+'</span>':'')+'<span class="dt">'+esc(i.text)+'</span>'+(i.why?'<div class="dw">'+esc(i.why)+'</div>':'')+(meta.length?'<div class="dm">'+meta.join(' · ')+'</div>':'')+'</div></div>';
}
function dayBlock(){
  var d=D.day; if(!d||!d.exists) return '';
  var date=new Date(d.date+'T12:00:00Z'), lab=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][date.getUTCDay()]+' '+dmyIso(d.date);
  var h='<section class="card day"><div class="sec"><h2>Your day · '+lab+'</h2><span class="r">'+(d.set?'Set'+(d.set_at?' at '+esc(d.set_at):'')+(d.by?' · '+esc(d.by):''):'Not set yet')+'</span></div>';
  if(d.set){
    h+=d.items.filter(function(i){return !i.person||i.person===D.lead}).map(function(i,k){return dayRow(i,k+1,'n')}).join('');
  } else {
    h+='<p class="dask">Nothing set for today yet. Ask Claude <b>“What are my key actions today?”</b> and the answer lands here for the rest of the day. Until then, “Needs you this week” below is the list worked out from the data.</p>';
  }
  if(d.carried&&d.carried.length) h+='<div class="dcarry"><div class="dch">Still open from '+esc(d.prev_date)+'</div>'+d.carried.map(function(i){return dayRow(i,0,'carry')}).join('')+'</div>';
  return h+'</section>';
}

/* ================= whole team: the daily check-in ================= */
function teamPeople(){
  var open=openActs();
  return D.people.filter(function(p){ return p.id===D.lead || open.some(function(a){return a.owners.indexOf(p.id)>=0}); })
    .map(function(p){ var mineA=open.filter(function(a){return a.owners.indexOf(p.id)>=0});
      return {p:p, open:mineA.length, late:mineA.filter(function(a){return a.late_days}).length, blk:mineA.filter(function(a){return a.blocking}).length,
        next:mineA.slice().sort(function(a,b){ return (b.blocking-a.blocking) || ((a.due||'9999')<(b.due||'9999')?-1:(a.due||'9999')>(b.due||'9999')?1:0); }).slice(0,3),
        today:(D.day&&D.day.set?D.day.items.filter(function(i){return (i.person||D.lead)===p.id}):[]),

<script id="nr-public-tour">
(function(){
  var STEPS = /*PT_STEPS*/[{"title": "What you are looking at", "text": "Northwind Assurance is an insurer we invented. Every name, figure and quote was written for this site, so you can click anything. An engagement has two views: the Cockpit, to run it, and Findings, for what we found. Switch between them at the top of the menu.", "img": "../assets/tour-1.jpg"}, {"title": "The Cockpit: how the engagement is going", "text": "Deliverables, actions, stakeholders, risks and decisions in one place, with anything late flagged on the first page. Nobody types into it: it updates from what the team hands Claude after each meeting.", "img": "../assets/tour-2.jpg"}, {"title": "Findings: where the potential sits", "text": "Every team on the value chain, with the time we found that could be freed. A dashed card is a team we have not assessed yet, so nothing is scored before the analysis is done. Click a team to see its six dimensions and its improvements.", "img": "../assets/tour-3.jpg"}, {"title": "Every conclusion has its evidence", "text": "The hypothesis tree breaks the client's question into parts we can test. Each part says whether it held, and Exhibits shows the analysis behind it.", "img": "../assets/tour-4.jpg"}, {"title": "Open any analysis", "text": "All outputs lists every analysis of the wave. Open shows the version the team works in, Client build the one the client receives. For the process map, that working version is the process twin: the whole process on one zoomable map.", "img": "../assets/tour-5.jpg"}, {"title": "How the pages get filled", "text": "You do not fill these pages in by hand. The engagement is set up with Claude, here in Engagement setup, and every interview, note or analysis you give Claude updates both views.", "img": "../assets/tour-6.jpg"}]/*END_PT_STEPS*/;
  var KEY='nr_public_tour_seen', i=0, $=function(id){ return document.getElementById(id); };

    $('pt-k').textContent='Step '+(i+1)+' of '+STEPS.length;
    $('pt-h').textContent=s.title; $('pt-p').textContent=s.text;
    $('pt-dots').innerHTML=STEPS.map(function(_,n){ return '<i class="'+(n===i?'on':'')+'"></i>'; }).join('');

  function close(){ $('pt-scrim').classList.remove('open'); try{ localStorage.setItem(KEY,'1'); }catch(e){} }
