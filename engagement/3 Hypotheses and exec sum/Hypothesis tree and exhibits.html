<!-- The findings screen for any engagement that has no practice view of its own (an OpEx engagement uses

     from the engagement folder, replaces the frame (@@NR-SHELL) with the cockpit template's copy, and
     writes 0. Project management/Findings dashboard.html. Opened on its own, it shows the built-in sample. -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style id="cockpit-css">
/* @@COCKPIT-CSS: the cockpit's own styles, taken as they render (static and injected), so the two screens are one product.
   Refresh this block when the cockpit's look changes. */
/* style */

/* Generated by generate_cockpit_v2.py from data/*.json. Do not edit the output by hand. */
:root{
  --navy:#0F2B52;--green:#006843;--bg:#F4F3F0;--sidebar:var(--nrs-w);
  --surface:#FFFFFF;--surface-2:#F8F7F4;--line:#E4E2DC;--ink:#1B2230;--ink-2:#5B6270;--ink-3:#8C919A;
  --ok:#1E7A4C;--ok-bg:#E6F2EB;--watch:#A86A00;--watch-bg:#FBF0DA;--late:#B3261E;--late-bg:#FBE7E5;
  --info:#0F2B52;--info-bg:#E5EBF5;--none:#6B7280;--none-bg:#EEEEEC;
  --track:#E9E7E1;--today:#0F2B52;--link:#006843;
  --fh:'Hanken Grotesk',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif;
  --fs-11:10.5px;--fs-12:11.5px;--fs-13:12.5px;--fs-14:13px;--fs-16:14.5px;--fs-20:18px;--fs-26:22px;
  --r:10px;
}
@media (max-width:900px){:root{--fs-11:11px;--fs-12:12px;--fs-13:13px;--fs-14:13.5px;--fs-20:18px;--fs-26:21px}}
html.dark{
  --bg:#0E131B;--surface:#171E29;--surface-2:#1C2431;--line:#2A3342;--ink:#E8EAEE;--ink-2:#A8AEB9;--ink-3:#7A818D;
  --ok:#5CC08C;--ok-bg:#16301F;--watch:#E8B34A;--watch-bg:#33280F;--late:#F07A70;--late-bg:#3A1A18;
  --info:#9DB7E0;--info-bg:#1F2B40;--none:#A8AEB9;--none-bg:#232B38;
  --track:#262F3D;--today:#9DB7E0;--link:#6FCB9C;color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);font-size:var(--fs-13);color:var(--ink);background:var(--bg);line-height:1.45}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:var(--link);text-decoration:none;font-weight:600;cursor:pointer}

.who-btn{width:100%;display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;text-align:left;font-size:var(--fs-13)}
.who-btn .chev{margin-left:auto;opacity:.7}
.who-pop{display:none;position:absolute;left:14px;right:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.25);padding:6px;z-index:50;max-height:60vh;overflow:auto}
.who-pop.open{display:block}
.who-pop .g{font:600 10px/1 var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:8px 8px 4px}
.who-pop button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:6px;font-size:var(--fs-13)}
.who-pop button:hover,.who-pop button.on{background:var(--surface-2)}
.who-pop .r{margin-left:auto;font-size:var(--fs-11);color:var(--ink-3)}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font:700 9.5px/1 var(--fh);background:#DDE5F0;color:var(--navy);flex:none}
.av.c{background:#EDE7DA;color:#6B5320}

.main{margin-left:var(--sidebar);min-height:100vh}
.tbr{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.stale{background:var(--watch-bg);color:var(--watch);font-size:var(--fs-12);padding:8px 28px;border-bottom:1px solid var(--line)}
.page{padding:18px 24px 56px;max-width:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec h2{font:700 var(--fs-11)/1 var(--fh);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.sec .r{font-size:var(--fs-12);color:var(--ink-3);display:flex;gap:12px;align-items:center}
.grid{display:grid;gap:12px}
.g-main{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.stack>.card:last-child{flex:1}
.eg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.eg .s2{grid-column:span 2} .eg .s3{grid-column:span 3} .eg .s5{grid-column:1/-1}
.et{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;min-width:0}
.ecol{display:flex;flex-direction:column;gap:12px;min-width:0}
.ecol>.card{margin:0} .ecol>.card:last-child{flex:1}

.empty{color:var(--ink-3);font-size:var(--fs-12)}
.lead{font-size:var(--fs-13);color:var(--ink-2);margin-bottom:14px;max-width:760px}

/* band */
.band{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}

/* rows */
.row{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:2px}

.row .grow{min-width:0;flex:1}
.ic{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:700 12px/1 var(--fh)}
.k-late{background:var(--late-bg);color:var(--late)} .k-dec{background:var(--info-bg);color:var(--info)}
.k-ppl{background:var(--watch-bg);color:var(--watch)} .k-mine{background:var(--ok-bg);color:var(--ok)} .k-wait{background:var(--none-bg);color:var(--none)}
.foot{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:var(--fs-12);color:var(--ink-2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.st{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-11);font-weight:600;border-radius:20px;padding:2px 8px;white-space:nowrap}
.st::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.st.ok{background:var(--ok-bg);color:var(--ok)} .st.watch{background:var(--watch-bg);color:var(--watch)}
.st.late{background:var(--late-bg);color:var(--late)} .st.none{background:var(--none-bg);color:var(--none)} .st.info{background:var(--info-bg);color:var(--info)}

.cleanup{display:flex;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:var(--fs-12);color:var(--ink-2)}
.cleanup b{color:var(--ink)}

/* phase strip + plan */
.strip{position:relative;margin:4px 0 16px}
.strip .ph{display:flex;gap:3px}
.strip .ph div{flex:1;min-width:0;font:600 10.5px/1 var(--fh);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.strip .mk{position:relative;height:16px;margin:3px 0 12px}
.dl{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid var(--navy);background:var(--surface)}
html.dark .dl{border-color:#9DB7E0}
.dl.done{background:var(--navy)} html.dark .dl.done{background:#9DB7E0}
.dl.late{border-color:var(--late);background:var(--late-bg)}
.dl.ms{border-radius:2px;transform:rotate(45deg);width:10px;height:10px;margin:-5px 0 0 -5px;border-color:var(--green);background:var(--green)}
.dl.gate{border-color:var(--late);background:var(--late)}
.dl[data-t]:hover::after{content:attr(data-t);position:absolute;bottom:16px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--surface);font:500 11.5px/1.3 var(--fb);padding:5px 8px;border-radius:6px;z-index:5;pointer-events:none}
.dl.ms[data-t]:hover::after,.dl.gate[data-t]:hover::after{transform:translateX(-50%) rotate(-45deg)}
.todayline{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--today);opacity:.6}
.todaylab{position:absolute;top:18px;font:700 10px/1 var(--fh);color:var(--today);transform:translateX(-50%);letter-spacing:.05em}

.ws{display:grid;grid-template-columns:minmax(0,1.3fr) 150px minmax(0,1fr);gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ws:first-of-type{border-top:0}
.ws .nm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.ws .nm{flex-wrap:wrap;row-gap:4px}

.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--track);gap:2px}

@media (max-width:760px){ .ws.lk{grid-template-columns:minmax(0,1fr)} }
.ws .al{font-size:var(--fs-12);color:var(--ink-2)}
.ws .al b{color:var(--ink)}
.dchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;align-items:center}
.dchip{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:2px 7px;border:1px solid var(--line);border-radius:999px;font-size:var(--fs-11);color:var(--ink-2);background:var(--bg-2,transparent);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ws.run{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(15,43,82,.03) 6px 12px)}
.svc{display:inline-block;max-width:100%;padding:1px 7px;border-radius:4px;font-size:var(--fs-11);font-weight:600;background:rgba(0,104,67,.09);color:var(--green);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.svc.run{background:rgba(15,43,82,.07);color:var(--navy)}

.svt{color:var(--green);font-weight:600}

.tp{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;padding:12px 16px;margin-bottom:12px}
.tpl{display:flex;gap:10px;align-items:flex-start;min-width:0;border-right:1px solid var(--line);padding-right:14px}

.tpc{white-space:nowrap}

@media (max-width:760px){ .tp{grid-template-columns:minmax(0,1fr);gap:8px} .tpl{border-right:0;padding-right:0}
  .tpt thead,.tpt colgroup{display:none} .tpt,.tpt tbody{display:block}

.tctx{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px;margin-bottom:12px;align-items:stretch}
.tctx>.card{display:flex;flex-direction:column}

<style id="nrs-css">
/* Sizes: responsive, one place. They lift on a narrow screen like the pages' own --fs-* do. */
:root{
  --nrs-w:236px;
  --nrs-sb:#0F2B52; --nrs-sb-ink:rgba(255,255,255,.72); --nrs-sb-dim:rgba(255,255,255,.52); --nrs-sb-faint:rgba(255,255,255,.44);

}

html.dark{ --nrs-sb:#0B1A31; --nrs-chip-bg:#24324D; --nrs-chip-ink:#DCE5F5; --nrs-alert:#F07A70; }

/* the sidebar */
.nrs-sb{position:fixed;left:0;top:0;bottom:0;width:var(--nrs-w);z-index:100;background:var(--nrs-sb);color:#DCE3EE;display:flex;flex-direction:column;padding:20px 14px 16px;overflow-y:auto;overscroll-behavior:contain;font-family:var(--fb);box-sizing:border-box}

.nrs-bt b{font:700 var(--nrs-fs-l)/1.25 var(--fh);color:#fff;overflow-wrap:anywhere}
.nrs-bt span{font-size:var(--nrs-fs-s);line-height:1.35;color:var(--nrs-sb-ink);margin-top:2px;overflow-wrap:anywhere}

.nrs-nav{margin-top:14px;display:flex;flex-direction:column;flex:1 0 auto}

.nrs-i:hover{background:rgba(255,255,255,.06);color:#fff}

.nrs-built{margin:8px 10px 0;font-size:var(--nrs-fs-xs);line-height:1.45;color:rgba(255,255,255,.48)}

/* the page header: title and one line on the left, the page's key numbers as chips on the right */
.nrs-hd{display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap;min-height:64px;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--line,var(--divider));box-sizing:border-box}
.nrs-hd-l{flex:1 1 240px;min-width:0}

.nrs-hd-s{font-size:var(--nrs-fs-m);line-height:1.35;color:var(--ink-2,var(--muted));margin:3px 0 0}
.nrs-hd-s:empty{display:none}
.nrs-hd-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;min-width:0;margin-left:auto}
.nrs-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.nrs-chips:empty{display:none}
.nrs-chip{display:inline-flex;align-items:baseline;gap:4px;background:var(--nrs-chip-bg);color:var(--nrs-chip-ink);border:1px solid transparent;border-radius:999px;padding:5px 12px;margin:0;font:500 var(--nrs-fs-s)/1.25 var(--fb);white-space:nowrap}
.nrs-chip b{font-weight:700}
.nrs-chip.alert b{color:var(--nrs-alert)}
.nrs-chip.dim{opacity:.78}
button.nrs-chip{cursor:pointer}
button.nrs-chip:hover{border-color:var(--nrs-chip-ink)}
button.nrs-chip.on{border-color:var(--nrs-chip-ink);box-shadow:inset 0 0 0 1px var(--nrs-chip-ink)}
.nrs-burger{display:none;flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line,var(--divider));background:var(--surface);color:var(--ink,var(--text));align-items:center;justify-content:center;cursor:pointer;padding:0}
.nrs-burger svg{width:19px;height:19px}
.nrs-scrim{display:none;position:fixed;inset:0;background:rgba(15,43,82,.42);z-index:99}

/* phones and small tablets: the sidebar slides in behind the menu button */
@media (max-width:900px){
  .nrs-sb{transform:translateX(-100%);transition:transform .26s cubic-bezier(.16,1,.3,1);box-shadow:none}
  .nrs-sb.open{transform:none;box-shadow:0 0 44px rgba(15,43,82,.35)}

  .nrs-hd-r:empty{display:none}

@media print{ .nrs-sb,.nrs-scrim,.nrs-burger{display:none!important} }
</style>
<script id="nrs-js">
/* The frame: brand block, the Cockpit | Findings switch, the menu, the dark-mode switch and the

   {screen, client, name, where, built, switch}. Without it (the standalone file, the public site)
   there is no switch and no built line. The theme is one key for all three screens: nr_dark. */
(function(){
  var KEY='nr_dark', root=document.documentElement;
  function read(){ try{ var v=localStorage.getItem(KEY);
      if(v==null){ var o=localStorage.getItem('nr_eng_theme'); if(o) v=(o==='dark')?'1':'0'; }
      return v; }catch(e){ return null; } }
  if(read()==='1') root.classList.add('dark');
  var P={moon:'<path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/>', menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
    gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.6M12 18.4V21M3 12h2.6M18.4 12H21M5.6 5.6l1.9 1.9M16.5 16.5l1.9 1.9M5.6 18.4l1.9-1.9M16.5 7.5l1.9-1.9"/>',
    back:'<path d="M15 5l-7 7 7 7"/>'};

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  var SCREENS=[['cockpit','Cockpit','../Cockpit.html'],['findings','Findings','../Findings dashboard.html']];
  var SETUP_HREF='../Engagement setup.html';   /* build_artifact.py points it at setup.html in the artifact */
  var GO=null;
  var S={
    svg:svg,
    cfg:function(){ return window.__NR_SHELL__||null; },
    isDark:function(){ return root.classList.contains('dark'); },
    toggle:function(){ var d=root.classList.toggle('dark');
      try{ localStorage.setItem(KEY,d?'1':'0'); }catch(e){}

      try{ document.dispatchEvent(new CustomEvent('nr-theme',{detail:{dark:d}})); }catch(e){} },
    /* where we are, from an engagement.json, for a file that was not built in a folder */
    where:function(E){ if(!E) return '';
      var a=E.assignment||{}, ph=((E.structure||{}).phases||[]).filter(function(p){return p&&p.status==='active';})[0];
      var name=ph?(ph.name||String(ph.id||'').replace(/^./,function(c){return c.toUpperCase();})):'', wk='';
      var s=Date.parse(a.start), t=Date.parse(a.target), n=new Date(); n=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());
      if(!isNaN(s)&&!isNaN(t)&&t>s){ var N=Math.floor((t-s)/6048e5)+1, w=Math.floor((n-s)/6048e5)+1; if(w>=1&&w<=N) wk='week '+w+' of '+N; }

    brand:function(b){ b=b||{};

        (b.name?'<span>'+esc(b.name)+'</span>':'')+(b.where?'<span class="nrs-ph">'+esc(b.where)+'</span>':'')+'</div></div>'; },
    /* switch: true on an OpEx engagement; "opex-only" on the cockpit of any other engagement,

    switcher:function(screen){ var c=S.cfg(); if(!c||!c.switch) return '';

      return '<div class="nrs-sw" role="group" aria-label="Screen">'+SCREENS.map(function(x){
        if(x[0]===screen) return '<span class="nrs-sw-b on" aria-current="page">'+x[1]+'</span>';
        if(only) return '<span class="nrs-sw-b off" aria-disabled="true" title="The findings dashboard is built for OpEx engagements only">'+x[1]+'</span>';
        return '<a class="nrs-sw-b" href="'+encodeURI(x[2])+'">'+x[1]+'</a>'; }).join('')+'</div>'
        +(only?'<p class="nrs-sw-note">Findings is for OpEx engagements only.</p>':''); },
    /* Engagement setup is opened from the menu of the cockpit and the findings dashboard, and leads back

(function(){

   return '<div class="x-tile">'+preview(o)+'<div class="x-tb"><b>'+esc(o.t)+'</b><span class="mut">'+esc([an(o.a).n,o.folder,o.upd].filter(Boolean).join(' · '))+'</span>'
    +'<div class="x-uses">'+(f.uses.length?f.uses.map(function(u){return '<span class="x-use" data-leaf="'+esc(u.l.id)+'" title="'+esc(u.l.t)+'"><i class="x-e-'+u.e+'"></i>'+esc(u.l.no)+(u.scope?' · '+esc(u.scope):'')+' <em class="x-e-'+u.e+'">'+EFF[u.e][0].toLowerCase()+'</em></span>'}).join(''):'<span class="x-use"><em style="color:var(--watch)">Not tied to a hypothesis yet</em></span>')+'</div>'
    +'<div class="x-tf"><span class="f-sp" style="'+SP[o.where]+'">'+esc(o.where)+'</span>'+openLink(o)+'</div></div></div>'}).join('')+'</div>':'';
 var loose=[];LEAVES.forEach(function(l){if(XB!=='all'&&l.parentB.id!==XB)return;results(l).forEach(function(r){if(!r.o||!built(r.o))loose.push(r)})});
 if(EF!=='all')loose=[];
 var rest=loose.length?'<section class="card f-grp" style="margin-top:14px"><div class="f-gh"><h2>Results with no file behind them</h2><span class="mut" style="margin-left:auto">'+loose.length+'</span></div>'+loose.map(function(r){return xrow(r,true)}).join('')+'</section>':'';
 return (files.length||rest)?chips+grid+rest:'';
}
function byLensRows(){
 var LN=D.lenses, R=allResults().filter(keep);
 D.outputs.forEach(function(o){if(!o.hyp&&built(o)&&(EF==='all'||o.where===EF))R.push({l:null,k:o.a,n:an(o.a).n,scope:o.scope||null,e:null,note:'',o:o})});
 var groups=(LN.dims||[]).map(function(d){return {k:d.k,label:d.label,rs:[]}}).concat([{k:'_base',label:'Baseline, read by every lens',rs:[]},{k:'_none',label:'Not tied to a lens',rs:[]}]);
 R.forEach(function(r){var lk=(LN.inst||{})[r.k], g=groups.filter(function(x){return x.k===(lk||(LN.baseline&&LN.baseline.indexOf(r.k)>=0?'_base':'_none'))})[0]||groups[groups.length-1];g.rs.push(r)});
 return groups.map(function(g){
  if(!g.rs.length){if(g.k==='_base'||g.k==='_none'||EF!=='all')return '';
   return '<section class="card f-grp" style="border-style:dashed;background:transparent"><div class="f-gh"><h2 style="color:var(--ink-3)">'+esc(g.label)+'</h2><span class="mut" style="margin-left:auto">Nothing run for this lens</span></div></section>'}
  var na={};g.rs.forEach(function(r){na[r.k]=1});
  return '<section class="card f-grp"><div class="f-gh"><h2>'+esc(g.label)+'</h2><span class="mut" style="margin-left:auto">'+Object.keys(na).length+' '+(Object.keys(na).length===1?'analysis':'analyses')+' · '+g.rs.length+' '+(g.rs.length===1?'result':'results')+'</span></div>'+g.rs.map(function(r){return xrow(r,true)}).join('')+'</section>'}).join('');
}

/* ─── the window for one hypothesis (the cockpit's window) ─── */
function openLeaf(id){var nd=node(id);if(!nd)return;var l=nd.leaf;
 if(!l){go('tree');return}
 var ins=D.insights.filter(function(i){return i.hyp===id}), ex=D.outputs.filter(function(o){return o.hyp===id&&built(o)}), tb=l.test?an(l.test):null;
 document.getElementById('modal').innerHTML='<div class="mh"><i class="ci '+st(l.status)[1]+'" style="width:40px;height:40px;line-height:40px;font-size:11.5px">'+esc(l.no)+'</i><div style="min-width:0;flex:1"><p style="margin:0 0 4px">'+esc(l.parentB.no)+' · '+esc(l.parentB.t)+(l.parent?' · '+esc(l.parent):'')+'</p><h2>'+esc(l.t)+'</h2><div class="meta">'+pill(l.status||'To investigate')+(l.at?'<span>Since '+esc(l.at)+(l.by?', set by '+esc(l.by):'')+'</span>':'')+'</div></div><button class="x" data-close aria-label="Close">×</button></div>'
  +'<div class="mb"><div class="f-grid2"><div><div class="h3">Why we thought so</div><p>'+(l.rationale?esc(l.rationale):'<span class="mut">Not written down.</span>')+'</p></div><div><div class="h3">Tested by</div><p>'+(tb?esc(tb.n)+(tb.s?' <span class="mut">· '+esc(tb.s)+'</span>':''):'<span class="mut">No analysis named yet.</span>')+'</p></div></div>'
  +'<div class="h3" style="margin-top:18px">What it showed</div><p class="f-det">'+(l.findings?esc(l.findings):'<span class="mut">Not tested yet.</span>')+'</p>'
  +'<div class="h3" style="margin-top:18px">Insights on this hypothesis</div>'+(ins.length?'<div class="lst">'+ins.map(function(i){return '<div class="lr"><i class="ci '+(i.e==='s'?'f-c-conf':i.e==='c'?'f-c-rej':'f-c-inv')+'">'+(i.e==='s'?'+':i.e==='c'?'−':'·')+'</i><span class="t"><b style="white-space:normal">'+esc(i.t)+'</b><span>'+esc(i.from||'')+'</span></span><span class="s" style="color:var(--ink-3)">'+esc(i.w||'')+'</span></div>'}).join('')+'</div>':'<p class="mut">None yet.</p>')
  +'<div class="h3" style="margin-top:18px">Exhibits</div>'+(ex.length?ex.map(function(o){return '<div class="lr"><i class="ci f-c-inv">'+esc(an(o.a).n.split(/\s+/).map(function(w){return w[0]}).join('').slice(0,2).toUpperCase())+'</i><span class="t"><b style="white-space:normal">'+esc(o.t)+'</b><span>'+esc([o.scope,o.where,o.folder].filter(Boolean).join(' · '))+'</span></span><span class="s">'+openLink(o)+'</span></div>'}).join(''):'<p class="mut">None yet.</p>')+'</div>';
 document.getElementById('scrim').classList.add('open'); document.body.style.overflow='hidden';
}
function closeW(){document.getElementById('scrim').classList.remove('open');document.body.style.overflow=''}

/* ─── one listener for the whole screen ─── */
document.addEventListener('click',function(e){
 var t=e.target;if(!t.closest)return;
 if(t.id==='scrim'||t.closest('[data-close]')){closeW();return}
 if(t.closest('a[href]'))return;
 var lf=t.closest('[data-leaf]'); if(lf){openLeaf(lf.getAttribute('data-leaf'));return}
 if(t.closest('#modal'))return;
 var g=t.closest('[data-go]'); if(g){TV='tree';go(g.getAttribute('data-go'));return}
 var tv=t.closest('[data-tv]'); if(tv){TV=tv.getAttribute('data-tv');draw();return}
 var s=t.closest('[data-set]'); if(s){F.set=s.getAttribute('data-set');draw();return}
 var h=t.closest('[data-h]'); if(h){F.h=h.getAttribute('data-h');draw();return}
 var ef=t.closest('[data-ef]'); if(ef){EF=ef.getAttribute('data-ef');draw();return}
 var gb=t.closest('[data-gb]'); if(gb){GB=gb.getAttribute('data-gb');draw();return}
 var xb=t.closest('[data-xb]'); if(xb){XB=xb.getAttribute('data-xb');draw();return}
 var r=t.closest('[data-row]'); if(r){var i=D.insights[+r.getAttribute('data-row')];OPEN=OPEN===i?null:i;draw();return}
});
document.addEventListener('input',function(e){if(e.target.id==='q'){F.q=e.target.value;var p=e.target.selectionStart;draw();var q=document.getElementById('q');q.focus();q.setSelectionRange(p,p)}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeW()});
document.addEventListener('nr-theme',draw);
window.NRFindings={go:go,open:openLeaf,draw:draw,data:D};
draw();
})();

</script>
