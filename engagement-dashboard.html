/* ═══════════════════════════════════════════════════════════════════════════
   THE FINDINGS — four pages that hold the client story
   Every one of them draws from day one. Before an analysis has landed they show
   the frame the configurator built, and say plainly what will fill it. Nothing
   here is invented: an empty engagement looks empty.
   ═══════════════════════════════════════════════════════════════════════════ */
const narr=(label,html)=>`<div class="narr"><span class="nl">${label}</span><p>${html}</p></div>`;
function fempty(title,body,btn){
  return `<div class="fempty"><h3>${title}</h3><p>${body}</p>${btn||''}</div>`;
}
/* how much of the plan has actually been run — the honest progress line */
function progressLine(){
  const a=assessed().length, n=inScopeTeams().length;
  return a?`<b>${a} of ${n} teams</b> assessed so far`:`no team assessed yet`;
}
function weakest(){
  if(!assessed().length) return null;
  const s=DIMK.map(k=>({k,v:dimAvg(k)})).sort((a,b)=>a.v-b.v)[0];
  return {dim:dimOf(s.k),v:s.v};
}

/* ── findings · executive summary ─────────────────────────────────────── */
PAGES.exec=()=>{
  const teams=inScopeTeams(), divs=divisionsOf(), a=assessed(), w=weakest(), o=opps();
  const head=a.length
    ? narr('What we found', `${progressLine()}. ${o.length?`<b>${o.length} opportunities</b> found so far, worth <b>~${totalFte().toFixed(0)} FTE</b> of releasable capacity.`:'No opportunities logged yet.'}
        ${w?` The weakest dimension across the organisation is <b>${esc(w.dim.label)}</b> at ${w.v.toFixed(1)}/5 — fix that and several teams move at once.`:''}`)
    : narr('Not yet found', `Nothing has been assessed yet. <b>${planCount()} analyses</b> are planned across <b>${teams.length} teams</b>${scopeFte()?` and ${scopeFte()} FTE`:''}.
        This page fills in as they run — one card per team, coloured by how it scores.`);

  const tree=`<div class="tree-root"><span>${esc(E.client||E.id||'Client')}${scopeFte()?' · '+scopeFte()+' FTE':''}</span></div>
    <div class="tree-stem"><i></i></div>
    ${divs.length>1?`<div class="tree-bar" style="margin:0 ${(100/(Math.min(divs.length,5)*2)).toFixed(2)}%"></div>`:''}
    <div class="tree-cols ${divs.length>1?'branched':''}" style="grid-template-columns:repeat(${Math.min(divs.length||1,5)},minmax(0,1fr))">
      ${divs.map(d=>{
        const sc=d.teams.filter(t=>scored(t.id));
        const avg=sc.length?sc.reduce((x,t)=>x+overall(t.id),0)/sc.length:0;
        return `<div><div class="tree-div"><b>${esc(d.name)}</b>
          <small>${d.teams.length} team${d.teams.length>1?'s':''}${avg?' · avg '+avg.toFixed(1):' · not assessed'}</small></div>
          ${d.teams.map(t=>{
            if(!scored(t.id)) return `<div class="tcard pend" onclick="go('teams')" title="${esc(t.name)} — no assessment yet">
              <div class="tn">${esc(t.name)}</div><div class="tpend">Assessment ongoing${t.fte?' · '+t.fte+' FTE':''}</div></div>`;
            const v=overall(t.id), f=teamFte(t.id);
            return `<div class="tcard" style="background:${scoreBg(v)};color:${scoreColor(v)}" onclick="go('teams')" title="${esc(t.name)}">
              <div class="tn">${esc(t.name)}</div>
              <div class="tb"><span class="tsc">${v.toFixed(1)}<s>/5</s></span>${f?`<span class="tft">~${f.toFixed(0)} FTE</span>`:t.fte?`<span class="tft">${t.fte} FTE</span>`:''}</div></div>`;
          }).join('')}</div>`;
      }).join('')}
    </div>`;

  const dims=DIMK.map(k=>{
    const v=dimAvg(k), d=dimOf(k);
    return `<div class="dimbar"><span class="dl">${esc(d.label)}</span>
      <span class="dt"><i style="width:${v/5*100}%;background:${v?scoreColor(v):'var(--divider)'}"></i></span>
      <span class="dv" style="color:${v?scoreColor(v):'var(--muted-2)'}">${v?v.toFixed(1):'—'}</span></div>`;
  }).join('');

  /* The scope numbers belong to the Engagement overview and are context here, not a
     second copy of that KPI row — this page is only ever about what we found. */
  const ctx=`<div class="ctxline">${teams.length} team${teams.length===1?'':'s'} &middot; ${divs.length} division${divs.length===1?'':'s'}${scopeFte()?' &middot; '+scopeFte()+' FTE in scope':''}
    ${(E.results||{}).updatedAt?` &middot; last updated ${esc(dmy(E.results.updatedAt))}`:''}</div>`;
  return head+ctx+`<div class="kpi-row one">
    <div class="kpi-grp pot"><div class="kpi-grp-label">What we found</div><div class="kpi-boxes">
      ${kpi('Teams assessed',a.length+'<span style="font-size:15px;font-weight:700;color:var(--muted)">/'+teams.length+'</span>',a.length?'scored on six dimensions':'nothing scored yet','check')}
      ${kpi('Opportunities',o.length||'—',o.length?'across the assessed teams':'none logged yet','bolt')}
      ${kpi('FTE potential',totalFte()?'~'+totalFte().toFixed(0):'—',totalFte()?'releasable capacity':'quantified as we go','spark')}
      ${kpi('Worth a year',totalFte()?eur(valueCase().annual):'—',totalFte()?'at full ramp, gross':'valued once we find it','euro')}
    </div></div>
  </div>

  <div style="display:grid;grid-template-columns:1.45fr 1fr;gap:18px" class="ovsplit">
    <div><span class="eyebrow" style="display:block;margin-bottom:9px">Maturity by team and division</span>
      <div class="card" style="height:calc(100% - 26px)">
        <div class="legend">
          <span class="lgd" style="font-weight:800;color:var(--text)">Maturity</span>
          ${[[1,'var(--s1)'],[2,'var(--s2)'],[3,'var(--s3)'],[4,'var(--s4)'],[5,'var(--s5)']]
            .map(([n,c])=>`<span class="lgd"><i style="background:${c};border:1px solid rgba(15,43,82,.10)"></i>${n}</span>`).join('')}
          <span class="lgd"><i style="border:1.5px dashed var(--border-heavy);background:transparent"></i>Assessment ongoing</span>
        </div>
        ${divs.length?tree:`<p style="font-size:12.5px;color:var(--muted-2)">No teams in scope yet — add them in the configurator.</p>`}
      </div></div>
    <div><span class="eyebrow" style="display:block;margin-bottom:9px">Where the six dimensions stand</span>
      <div class="card" style="height:calc(100% - 26px)">
        <p style="font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:10px">
          ${a.length?`The average across the ${a.length} team${a.length>1?'s':''} assessed so far. The lowest bar is usually the thing to fix first — it holds the others back.`
                    :`These fill in as teams are scored. The lowest bar will be the organisation-level priority.`}</p>
        ${dims}
        ${w?`<div class="callout"><div class="cl">Organisation-level priority</div>
          <p><b>${esc(w.dim.label)}</b> is the weakest dimension at ${w.v.toFixed(1)}/5. Fixing it centrally is worth more than
          fixing it team by team — it is what unblocks the rest.</p></div>`:''}
      </div></div>
  </div>`;
};

/* ── findings · value chain ───────────────────────────────────────────── */
PAGES.chain=()=>{
  const chains=VCS();
  if(!chains.length) return narr('Not set up yet',
      `This engagement has no value chain yet, so there is nothing to draw it along.`)+
    fempty('Set the client&rsquo;s value chain first',
      `The org chart says who reports to whom. The value chain says how the client actually earns its money — distribution, underwriting, servicing, claims, and so on. It is the frame the findings get told in, and it cannot be worked out from the team list, so it is asked for in setup. Pick a standard chain, adjust the names, and place each team on a stage. A client that sells more than one thing gets one chain per product or service.`,
      `<button class="fchip go" onclick="MODE='setup';go('s2')">Set the value chain &rarr;</button>`);

  const dataDim=dimOf('data'), dataAvg=dimAvg('data');
  const shared=inScopeTeams().filter(t=>placementsOf(t).length>1);

  const board=c=>{
    const stages=stagesOf(c.id);
    if(!stages.length) return '';
    const cols=stages.length, rows=Math.max(...stages.map(x=>x.teams.length),1);
    let cells='';
    stages.forEach((x,i)=>{
      const sc=x.teams.filter(t=>scored(t.id));
      const avg=sc.length?sc.reduce((a,t)=>a+overall(t.id),0)/sc.length:0;
      cells+=`<div class="vc-chev${i===0?' first':''}${x.orphan?' orphan':''}"><b>${esc(x.name)}</b>
        <span>${avg?avg.toFixed(1)+' /5 avg':x.teams.length?x.teams.length+' team'+(x.teams.length===1?'':'s')+' · not assessed':'no team here'}</span></div>`;
    });
    for(let r=0;r<rows;r++) for(let i=0;i<cols;i++){
      const t=stages[i].teams[r];
      if(!t){ cells+='<div class="vc-void"></div>'; continue; }
      const multi=placementsOf(t).length>1?`<span class="vc-multi" title="Also on ${esc(placementsOf(t).filter(p=>p.chain!==c.id).map(p=>(chainOf(p.chain)||{}).name).join(', '))}">shared</span>`:'';
      if(!scored(t.id)){
        cells+=`<div class="vc-card pend" onclick="openTeam('${t.id}')"><div class="vn">${esc(t.name)}${multi}</div>
          <span class="vc-st" style="background:var(--surface-2);color:var(--muted-2)">Assessment ongoing</span>
          ${t.fte?`<div class="vc-row"><span class="vf" style="margin-left:0">${t.fte} FTE in the team</span></div>`:''}</div>`;
        continue;
      }
      const v=overall(t.id), rd=readiness(v), L=lev(tRes(t.id).lever||dominantLever(oppsOf(t.id))), f=teamFte(t.id);
      cells+=`<div class="vc-card" onclick="openTeam('${t.id}')"><div class="vn">${esc(t.name)}${multi}</div>
        <span class="vc-st" style="background:${rd[2]};color:${rd[1]}">${rd[0]}</span>
        <div class="vc-row"><span class="vs" style="color:${scoreColor(v)}">${v.toFixed(1)}<s>/5</s></span>
          ${f?`<span class="vf">~${f.toFixed(1)} FTE</span>`:''}</div>
        <div class="vc-bar"><i style="width:${v/5*100}%;background:${scoreColor(v)}"></i></div>
        <div class="vc-lead"><i style="background:${L.dot}"></i>${esc(L.label)}</div></div>`;
    }
    const tm=[...new Set(stages.flatMap(x=>x.teams.map(t=>t.id)))].length;
    return `<div class="dd-section">${sec(esc(c.name||'Value chain')+' · '+cols+' stage'+(cols>1?'s':'')+' · '+tm+' team'+(tm===1?'':'s'),
        chains.length>1?'':`<button class="fchip" onclick="MODE='setup';go('s2')">Edit the chain</button>`)}
      <div class="card"><div class="vc-grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${cells}</div></div></div>`;
  };

  const head=assessed().length
    ? narr('Along the chain', `The ${inScopeTeams().length} teams placed on ${chains.length>1?`the client's ${chains.length} value chains`:"the client's own value chain"}. ${progressLine()}.
        ${dataAvg?`<b>${esc(dataDim.label)}</b> sits at ${dataAvg.toFixed(1)}/5 across the organisation — a constraint that shows up at every stage, not just one.`:''}`)
    : narr('Along the chain', `The ${inScopeTeams().length} teams placed on ${chains.length>1?`the client's ${chains.length} value chains`:"the client's own value chain"}. Each card fills with a
        maturity score, the capacity it can release and the verdict on how to fix it as the analyses run.`);

  return head+
    (chains.length>1?`<p class="pagelead">One board per product or service line. A team that serves more than one appears on each,
      marked <span class="vc-multi" style="position:static">shared</span> — its capacity is counted once, not once per chain.
      <button class="addlink" style="padding:1px 7px" onclick="MODE='setup';go('s2')">Edit the chains</button></p>`:'')+
    chains.map(board).join('')+
    (stagesOf((chains[0]||{}).id).some(x=>x.orphan)?`<p style="font-size:11.5px;color:var(--s2-t);margin-top:-10px">The last column holds teams that have not been placed on any chain yet — place them in <button class="addlink" style="padding:1px 7px" onclick="MODE='setup';go('s3')">Step 3 · Teams</button>.</p>`:'')+
    (shared.length?`<p style="font-size:11.5px;color:var(--muted);margin-top:-8px">${shared.length} team${shared.length>1?'s serve':' serves'} more than one chain: ${esc(shared.map(t=>t.name).join(', '))}.</p>`:'');
};

/* ── findings · transformation roadmap ────────────────────────────────── */
var RM_OPEN=null;
function rmSet(){ if(RM_OPEN===null) RM_OPEN=new Set(); return RM_OPEN; }
function rmToggle(n){ const s=rmSet(); s.has(n)?s.delete(n):s.add(n); go('roadmap'); }
function rmAll(on){ RM_OPEN = on ? new Set(divisionsOf().map(d=>d.name)) : new Set(); go('roadmap'); }
PAGES.roadmap=()=>{
  const H=M.horizons, divs=divisionsOf(), open=rmSet(), o=opps();
  const gt=`grid-template-columns:1.5fr repeat(${H.length},1fr)`;
  const head=o.length
    ? narr('The sequence', `<b>~${totalFte().toFixed(0)} FTE</b> of potential across <b>${o.length} initiatives</b>, sequenced over two years.
        ${(()=>{const n=opps(x=>horizonOf(x)==='0-6m').reduce((a,x)=>a+fteOf(x),0);
          return totalFte()?`About ${Math.round(n/totalFte()*100)}% of the value can start in the first six months; the rest waits on a foundation being fixed first.`:'';})()}`)
    : narr('The sequence', `Nothing to sequence yet. Once opportunities are found they land in one of the three horizons below —
        by <b>when the client can actually start</b>, not by how attractive they look.`);

  const cell=(list,h)=>{
    const sub=list.filter(x=>horizonOf(x)===h.k);
    if(!sub.length) return `<div class="rm-cell"><span class="rm-none">—</span></div>`;
    const L=lev(dominantLever(sub)), f=sub.reduce((a,x)=>a+fteOf(x),0);
    return `<div class="rm-cell"><span class="rm-blk" style="background:${L.bg};color:${L.t}" title="${sub.length} initiative${sub.length>1?'s':''} · ~${f.toFixed(1)} FTE">${esc(L.label)}</span></div>`;
  };
  const rows=divs.map(d=>{
    const ids=d.teams.map(t=>t.id), list=o.filter(x=>ids.includes(x.team));
    const f=list.reduce((a,x)=>a+fteOf(x),0), on=open.has(d.name);
    const inits=on?`<div class="rm-sub">${
      (list.length?list:[]).map(x=>{
        const L=lev(x.lever), tn=(inScopeTeams().find(t=>t.id===x.team)||{}).name||x.team;
        return `<div class="rm-init" style="${gt}"><div>${esc(x.title||'Untitled')} <span style="color:var(--muted-2);font-weight:500">· ${esc(tn)}</span></div>
          ${H.map(h=>horizonOf(x)===h.k
            ? `<div class="rm-cell"><span class="rm-tag" style="background:${L.bg};color:${L.t}">~${fteOf(x).toFixed(1)} FTE</span></div>`
            : `<div class="rm-cell"></div>`).join('')}</div>`;
      }).join('') || `<div style="padding:11px 36px;font-size:11.5px;color:var(--muted-2)">No initiatives yet for the ${d.teams.length} team${d.teams.length>1?'s':''} in this division.</div>`
    }</div>`:'';
    return `<div class="rm-row" style="${gt}">
      <div class="rm-lbl ${on?'open':''}" onclick="rmToggle('${esc(d.name).replace(/'/g,"&#39;")}')">
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
        <span><b>${esc(d.name)}</b><small>${d.teams.length} team${d.teams.length>1?'s':''}${f?` · ~${f.toFixed(1)} FTE potential`:' · nothing found yet'}</small></span></div>
      ${H.map(h=>cell(list,h)).join('')}
      ${inits}</div>`;
  }).join('');

  const used=[...new Set(o.map(x=>x.lever).filter(Boolean))];
  return head+
  `<div class="dd-section">${sec('Two-year roadmap · what happens when',
      `<button class="fchip" onclick="rmAll(true)">Expand all</button><button class="fchip" onclick="rmAll(false)">Collapse all</button>`)}
    <p class="lead-in" style="margin:0 0 12px">Each row is a division, each column a horizon. The block shows the main kind of change
      planned in that window — the pace is set by readiness, not ambition. Open a row for the initiatives behind it.</p>
  ${used.length?`<div class="legend">${used.map(k=>`<span class="lgd"><i style="background:${lev(k).dot}"></i>${esc(lev(k).label)}</span>`).join('')}</div>`:''}
  <div class="rm">
    <div class="rm-head" style="${gt}">
      <div><span class="w">Division</span><b>Where</b></div>
      ${H.map((h,i)=>{ const sub=opps(x=>horizonOf(x)===h.k), f=sub.reduce((a,x)=>a+fteOf(x),0);
        return `<div class="rm-h${i}"><span class="w">${esc(h.when)}</span><b>${esc(h.label)}</b>
          <span class="m">${sub.length?`${sub.length} initiative${sub.length>1?'s':''} · ~${f.toFixed(1)} FTE`:'nothing here yet'} · ${esc(horizonWhen(h))}</span></div>`;}).join('')}
    </div>
    ${rows||`<div style="padding:22px 16px;font-size:12.5px;color:var(--muted-2)">No teams in scope yet.</div>`}
  </div></div>`;
};

/* ── findings · benefits overview ─────────────────────────────────────── */
PAGES.benefits=()=>{
  const v=valueCase(), H=M.horizons, divs=divisionsOf(), o=opps();
  const head=o.length
    ? narr('Value potential', `Releasing <b>~${v.fte.toFixed(0)} FTE</b> of capacity is worth <b>${eur(v.annual)} a year</b> at full ramp —
        an estimated <b>~${Math.round(v.payback)} months</b> payback on ${eur(v.invest)} of implementation, and ${eur(v.cum)} of cumulative value over three years.`)
    : narr('Value potential', `Nothing quantified yet. The numbers below are the assumptions this engagement runs on —
        <b>${eur(v.cost)} per FTE</b> a year, <b>${eur(v.impl)} per FTE</b> to implement. Every opportunity found gets valued against them,
        so the case builds itself as the work lands.`);

  const box=(eyebrow,val,sub,icon)=>kpi(eyebrow,val,sub,icon);
  const byH=H.map(h=>({h, fte:opps(x=>horizonOf(x)===h.k).reduce((a,x)=>a+fteOf(x),0)}));
  let run=0; const cumSeries=byH.map(x=>{ run+=x.fte*v.cost*v.real; return run; });
  const peak=Math.max(...cumSeries,1);
  const chart=`<div class="chart">
    ${byH.map((x,i)=>{ const add=x.fte*v.cost*v.real;
      return `<div class="cb">
        <div class="cbar" style="height:${o.length?Math.max(add/peak*100,add?3:0):0}%;opacity:${add?1:.15}">${add?`<em>+${eur(add)}</em>`:''}</div>
        <div class="cl"><b style="display:block;color:var(--text);font-size:11px">${esc(x.h.label)}</b>${esc(x.h.when)}<br>
          <span style="color:${cumSeries[i]?'var(--green-2)':'var(--muted-2)'};font-weight:800">${cumSeries[i]?eur(cumSeries[i]):'—'} run-rate</span></div>
      </div>`; }).join('')}
  </div>`;

  const rows=divs.map(d=>{
    const ids=d.teams.map(t=>t.id), list=o.filter(x=>ids.includes(x.team));
    const f=list.reduce((a,x)=>a+fteOf(x),0), val=f*v.cost*v.real;
    return {name:d.name,f,val};
  }).sort((a,b)=>b.val-a.val);
  const top=Math.max(...rows.map(r=>r.val),1);

  return head+`<div class="kpi-row">
    <div class="kpi-grp pot"><div class="kpi-grp-label">Value released · gross cost-out</div><div class="kpi-boxes">
      ${box('Annual run-rate',o.length?eur(v.annual):'—','at full ramp','euro')}
      ${box('Releasable FTE',o.length?'~'+v.fte.toFixed(0):'—','capacity freed','users')}
      ${box('3-year value',o.length?eur(v.cum):'—','phased by horizon','spark')}
    </div></div>
    <div class="kpi-grp"><div class="kpi-grp-label">Investment &amp; return</div><div class="kpi-boxes">
      ${box('Implementation',o.length?eur(v.invest):'—','one-off, indicative','bolt')}
      ${box('Payback',o.length?'~'+Math.round(v.payback)+' mo':'—','to recover the build','check')}
      ${box('Cost per FTE',eur(v.cost),'fully-loaded assumption','grid')}
    </div></div>
  </div>

  <div class="vsplit">
    <div><span class="eyebrow" style="display:block;margin-bottom:9px">Value build-up · by horizon</span>
      <div class="card">
        <div class="ch"><span class="ct">Savings build-up</span><span style="font-size:10.5px;color:var(--muted)">bars = value added in that window</span></div>
        ${chart}
        ${o.length?'':`<p style="font-size:12px;color:var(--muted-2);text-align:center;margin-top:-96px;position:relative">Empty until opportunities are found and placed in a horizon.</p>`}
      </div></div>
    <div><span class="eyebrow" style="display:block;margin-bottom:9px">Where the value sits</span>
      <div class="card" style="height:calc(100% - 26px)">
        ${rows.length?rows.map(r=>`<div class="vrow"><div class="vt"><b>${esc(r.name)}</b><span>${r.val?eur(r.val):'—'}</span></div>
          <small>${r.f?'~'+r.f.toFixed(1)+' FTE':'nothing found yet'}</small>
          <div class="vb"><i style="width:${r.val/top*100}%"></i></div></div>`).join('')
          :`<p style="font-size:12.5px;color:var(--muted-2)">No divisions yet.</p>`}
      </div></div>
  </div>

  <div class="dd-section" style="margin-top:22px"><span class="eyebrow">How to read this</span>
    <div class="card"><p style="font-size:12.5px;line-height:1.75;color:var(--muted)">
      Pure cost-out basis — every releasable FTE is valued at the fully-loaded cost of <b style="color:var(--text)">${eur(v.cost)}</b> a year${v.real!==1?`, of which <b style="color:var(--text)">${Math.round(v.real*100)}%</b> is assumed to actually be realised`:''}.
      Implementation is estimated at <b style="color:var(--text)">${eur(v.impl)}</b> per releasable FTE. The three-year figure phases each horizon by when it starts paying:
      ${H.map((h,i)=>i?`${h.label.toLowerCase()} for ${h.ramp}`:`${h.label.toLowerCase()} counts for ${h.ramp} of the three years`).join(', ')}.
      These three numbers are set in <button class="addlink" style="padding:1px 7px" onclick="go('config')">Settings</button> and are assumptions until the client confirms them —
      the FTE behind them is what the analyses measure.</p></div>
  </div>`;
};

/* ── live · teams ─────────────────────────────────────────────────────── */
/* Teams, the analysis plan and the per-team results were three views of the same rows.
   One list now: every team, click through to what runs on it, what came back, and what
   that turned into. The collapsed row carries the six-dimension strip, so the cross-team
   scan the matrix used to give still works without a second table. */
var OPEN_TEAM_LIVE=null;
function liveOpen(){ if(OPEN_TEAM_LIVE===null) OPEN_TEAM_LIVE=new Set(); return OPEN_TEAM_LIVE; }
function openTeam(id){ liveOpen().add(id); PAGE='teams'; go('teams');
  setTimeout(()=>{ const el=document.getElementById('t-'+id); if(el) el.scrollIntoView({block:'center'}); },60); }
function toggleLiveTeam(id){ const s=liveOpen(); s.has(id)?s.delete(id):s.add(id); go('teams'); }
function expandLive(all){ OPEN_TEAM_LIVE = all ? new Set(inScopeTeams().map(t=>t.id)) : new Set(); go('teams'); }

function teamPanel(t){
  const pt=(E.plan.perTeam||{})[t.id]||{lenses:{},baseline:[],registers:[],ai:[]};
  const r=tRes(t.id), o=oppsOf(t.id);
  /* one line per analysis: what it is, whether it can run today, and the sentence to say —
     tucked behind the copy button so six dimensions still fit on a screen */
  const runLine=i=>{
    const x=M.inst[i]; if(!x) return '';
    const trig=x.trig.replace('{team}',t.name);
    const tip=esc((x.note?x.note+'  ':'')+(x.status==='envisioned'?'':'Say: "'+trig+'"'));
    return `<div class="tp-an" title="${tip}">
      <b>${esc(x.label)}</b>${stat(x.status)}
      ${x.status==='envisioned'?'<span class="tp-man">by hand</span>'
        :`<button class="tp-copy" title="Copy: ${esc(trig)}" onclick="event.stopPropagation();copy(${JSON.stringify(trig).replace(/"/g,'&quot;')},'Trigger copied')">${ico('copy')}</button>`}
    </div>`;
  };
  const dims=DIMK.map(k=>{
    const instr=pt.lenses[k]||[], lvl=depthOf(instr,k), d=dimOf(k), sc=r&&r.scores?+r.scores[k]||0:0;
    return `<div class="tp-dim">
      <div class="tp-dim-h">
        <span class="tp-dot" style="background:${d.col}"></span>
        <b>${esc(d.label)}</b>
        <span class="tp-cov" style="background:${DEPTH[lvl].bg};color:${DEPTH[lvl].fg}">${DEPTH[lvl].label}</span>
        <span class="tp-sc">${sc?`<b style="color:${scoreColor(sc)}">${sc}</b><span>/5</span>`:'<span class="tp-none">not scored yet</span>'}</span>
      </div>
      ${instr.length?`<div class="tp-ans">${instr.map(runLine).join('')}</div>`
        :`<p class="tp-none" style="padding:4px 0 2px">Nothing planned on this dimension — it will carry no score.</p>`}
      ${r&&r.rationale&&r.rationale[k]?`<p class="tp-rat">${esc(r.rationale[k])}</p>`:''}
    </div>`;
  }).join('');
  const first=`<div class="tp-first">
    <div class="tp-first-l">Run these first</div>
    <div class="tp-ans">${(pt.baseline||[]).concat(pt.registers||[]).map(runLine).join('')||'<span class="tp-none">Nothing set.</span>'}</div></div>`;
  const ai=(pt.ai||[]).length?`<div class="tp-first ai">
    <div class="tp-first-l">Redesign · once the diagnosis lands</div>
    <div class="tp-ans">${(pt.ai||[]).map(k=>{
      const x=M.aiWork[k], trig=x.trig.replace('{team}',t.name);
      return `<div class="tp-an" title="${esc(x.note+'  Say: \"'+trig+'\"')}"><b>${esc(x.label)}</b>${stat(x.status)}
        <button class="tp-copy" title="Copy: ${esc(trig)}" onclick="event.stopPropagation();copy(${JSON.stringify(trig).replace(/"/g,'&quot;')},'Trigger copied')">${ico('copy')}</button></div>`;
    }).join('')}</div></div>`:'';
  const opps=o.length?`<div class="tp-opps">
    <div class="tp-first-l">What we found &mdash; ${o.length} opportunit${o.length===1?'y':'ies'} · ~${teamFte(t.id).toFixed(1)} FTE</div>
    <table class="tbl"><thead><tr><th>Opportunity</th><th>How to fix it</th><th>When</th><th>FTE</th></tr></thead><tbody>
      ${o.map(x=>{const L=lev(x.lever), h=M.horizons.find(y=>y.k===horizonOf(x))||M.horizons[0];
        return `<tr><td class="tnm">${esc(x.title||'Untitled')}</td>
          <td><span class="rm-tag" style="background:${L.bg};color:${L.t}">${esc(L.label)}</span></td>
          <td>${esc(h.label)} · ${esc(h.when)}</td>
          <td style="font-weight:700">~${fteOf(x).toFixed(1)}</td></tr>`;}).join('')}
    </tbody></table></div>`:'';
  return `<div class="tp">
    ${r&&r.finding?`<div class="tp-find"><span>The finding</span><p>${esc(r.finding)}</p></div>`:''}
    ${first}${ai}
    <div class="tp-first-l" style="margin:18px 0 10px">The six dimensions</div>
    <div class="tp-dims">${dims}</div>
    ${opps}
  </div>`;
}

PAGES.teams=()=>{
  const teams=(E.teams||[]).filter(t=>t.name), open=liveOpen(), st=cellStats();
  const mem={}; (E.nrMembers||[]).forEach(m=>mem[m.id]=m.name||m.id);
  const row=t=>{
    const pt=(E.plan.perTeam||{})[t.id]||{lenses:{}};
    const on=open.has(t.id), out=t.inScope===false;
    const n=Object.values(pt.lenses||{}).reduce((a,l)=>a+l.length,0)+(pt.baseline||[]).length+(pt.registers||[]).length;
    const sc=scored(t.id)?overall(t.id):0, f=teamFte(t.id);
    const strip=DIMK.map(k=>{const l=depthOf(pt.lenses[k]||[],k);
      return `<i style="background:${DEPTH[l].bg}" title="${esc(dimOf(k).label)} — ${DEPTH[l].label}"></i>`;}).join('');
    return `<div class="tl ${on?'open':''} ${out?'out':''}" id="t-${esc(t.id)}">
      <div class="tl-h" onclick="toggleLiveTeam('${t.id}')">
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
        <div class="tl-nm"><b>${esc(t.name)}</b><small>${esc(t.division||'no division')}${t.dept?' · '+esc(t.dept):''}${
          placementText(t)?' &nbsp;›&nbsp; '+placementText(t):''}</small></div>
        <div class="tl-meta">
          ${t.lead?`<span class="tl-x" title="Team lead">${esc(t.lead)}</span>`:''}
          ${mem[(E.teamAssign||{})[t.id]]?`<span class="tl-x" title="NR owner">${esc(mem[(E.teamAssign||{})[t.id]])}</span>`:''}
          <span class="tl-fte">${t.fte==null?'— FTE':t.fte+' FTE'}</span>
          ${out?'<span class="badge-soft">out of scope</span>'
            :`<span class="badge-soft">${esc((M.approaches[pt.depth||E.assignment.depth]||{}).label||'—')}</span>`}
        </div>
        ${out?'':`<div class="tl-strip" title="How much of each of the six dimensions we cover">${strip}</div>
        <span class="tl-n">${n} analyses</span>
        <span class="tl-sc">${sc?`<b style="color:${scoreColor(sc)}">${sc.toFixed(1)}</b><span>/5</span>${f?`<em>~${f.toFixed(0)} FTE</em>`:''}`
          :'<span class="tp-none">not assessed</span>'}</span>`}
      </div>
      ${on&&!out?teamPanel(t):''}</div>`;
  };
  return `<p class="pagelead">Every team in scope. Open one to see what runs on it, what each analysis needs,
      what came back, and what that turned into. The six blocks on each row are the six dimensions,
      shaded by how much of each we cover &mdash; <b>${st.deep} in full</b> · ${st.diag} the scored analyses ·
      ${st.light} the maturity scan alone · ${st.off} nothing.</p>
    ${sec('Teams &amp; analyses',
      `<button class="fchip" onclick="expandLive(true)">Expand all</button>
       <button class="fchip" onclick="expandLive(false)">Collapse all</button>
       <button class="fchip" onclick="MODE='setup';go('s3')">Edit the team list</button>
       <button class="fchip" onclick="MODE='setup';go('s5')">Edit the plan</button>`)}
    <div class="tlist">${teams.map(row).join('')||'<div class="card"><p style="font-size:12.5px;color:var(--muted-2)">No teams yet.</p></div>'}</div>`;
};

/* ── live · how to run ────────────────────────────────────────────────── */
PAGES.run=()=>{
  const teams=inScopeTeams(), name=id=>(teams.find(t=>t.id===id)||{}).name||id;
  /* naming all five teams on all fourteen cards is noise — say "every team" when it is */
  const teamList=l=> l.length>=teams.length&&teams.length>1
    ? `All ${teams.length} teams`
    : `${l.length} team${l.length>1?'s':''} \u00b7 ${l.map(t=>esc(name(t))).join(', ')}`;
  const map={};
  Object.entries(E.plan.perTeam||{}).forEach(([tid,pt])=>{
    Object.values(pt.lenses||{}).flat().concat(pt.baseline||[],pt.registers||[])
      .forEach(i=>{ (map[i]=map[i]||new Set()).add(tid); });
  });
  const order=['org-baseline','mae','ote-waterfall','lma','process-map','performance-wheel','skills-wheel',
    'team-barometer','data-maturity','wilo-analysis','nps-analysis','kano-analysis','inefficiency-register','opportunity-register'];
  const rank=i=>{const x=order.indexOf(i);return x<0?99:x;};
  const card=(i,list)=>{
    const x=M.inst[i], first=list&&list[0], trig=x.trig.replace('{team}',first?name(first):'the team');
    return `<div class="run">
      <div class="run-h"><b>${esc(x.label)}</b>
        ${stat(x.status)}</div>
      ${x.note?`<div class="run-d">${esc(x.note)}</div>`:''}
      ${list?`<div class="run-teams">${teamList(list)}</div>`:''}
      ${x.status==='envisioned'
        ? `<div class="trig na"><span>No guided version yet — run this one the usual way, or ask Claude to build it first.</span></div>`
        : `<div class="trig"><code>${esc(trig)}</code>
            <button class="fchip" onclick="copy(${JSON.stringify(trig).replace(/"/g,'&quot;')},'Trigger copied')">Copy</button></div>`}
    </div>`;
  };
  return `<div class="dd-section"><span class="eyebrow">In the order to run them</span>
    <p class="lead-in" style="margin:0 0 14px">Say the sentence to Claude and it takes it from there — it prepares the session, walks the interview with you, and writes up the result.
      Start at the top: the first three establish who the team is and what it does, and everything below leans on them.
      Each sentence names one team, so say it once per team, swapping the name.</p>
    ${Object.keys(map).sort((a,b)=>rank(a)-rank(b)).map(i=>card(i,[...map[i]])).join('')||'<div class="card"><p style="font-size:12.5px;color:var(--muted)">Nothing planned yet.</p></div>'}</div>
  ${(()=>{
    const aiMap={};
    Object.entries(E.plan.perTeam||{}).forEach(([tid,pt])=>(pt.ai||[]).forEach(k=>{(aiMap[k]=aiMap[k]||new Set()).add(tid);}));
    const keys=Object.keys(aiMap); if(!keys.length) return '';
    return `<div class="dd-section"><span class="eyebrow">Redesign · once the diagnosis lands</span>
      <p class="lead-in" style="margin-top:-2px">Only for teams you set to Redesign. These design what the work should look like afterwards, so they need the diagnosis finished first.</p>
      ${keys.map(k=>{const x=M.aiWork[k], list=[...aiMap[k]], trig=x.trig.replace('{team}',name(list[0]));
        return `<div class="run">
          <div class="run-h"><b>${esc(x.label)}</b>${stat('live')}</div>
          <div class="run-d">${esc(x.note)}</div>
          <div class="run-teams">${teamList(list)}</div>
          <div class="trig"><code>${esc(trig)}</code>
            <button class="fchip" onclick="copy(${JSON.stringify(trig).replace(/"/g,'&quot;')},'Trigger copied')">Copy</button></div>
        </div>`;}).join('')}</div>`;
  })()}
  ${(E.plan.crossCutting||[]).length?`<div class="dd-section"><span class="eyebrow">Across the whole engagement</span>
    <p class="lead-in" style="margin-top:-2px">Not tied to one team. Use the advisor as a second pair of eyes before anything reaches the client.</p>
    ${E.plan.crossCutting.map(i=>card(i,null)).join('')}</div>`:''}
  <div class="dd-section"><span class="eyebrow">If you are not sure what to do next</span>
    <div class="run"><div class="run-h"><b>Just ask</b>${stat('live')}</div>
      <div class="run-d">Claude looks at what has been captured, what is still open and what is out of scope, and tells you what the next sensible move is. It suggests — you decide.</div>
      <div class="trig"><code>what is next on this engagement</code>
        <button class="fchip" onclick="copy('what is next on this engagement','Trigger copied')">Copy</button></div></div>
  </div>`;
};

/* ── live · configuration & export ────────────────────────────────────── */

  `<div class="dd-section"><span class="eyebrow">Turning saved time into money</span>
    <div class="card">

      ${field('What one FTE costs a year (€)','valueInputs.costPerFte',{type:'num',hint:'Fully loaded, as the client books it.'})}
      ${field('How much we expect to actually land (%)','valueInputs.realise',{type:'num',hint:'100 means we count the full theoretical saving.'})}
      ${field('What it costs to get there, per FTE (€)','valueInputs.implPerFte',{type:'num',hint:'Tooling, build and change effort.'})}
    </div></div>
  </div>
  <div class="dd-section"><span class="eyebrow">How the six dimensions weigh against each other</span>
    <div class="card">
      <p class="lead-in">Equal by default. Only change one when you can say out loud why this client's process score should count for more than its data score.</p>
