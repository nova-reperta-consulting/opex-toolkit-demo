// build a SPECIFIC, team-tailored insight per sub-dimension from the team's real artifacts
function subInsight(t, dim, name, score){
  const lo=score<=2, hi=score>=4, mid=score===3;
  const acts=t.activities||[];
  const top=[...acts].sort((a,b)=>b.fte-a.fte)[0]||{};
  const Ks=acts.filter(a=>a.nature==='K'), Ss=acts.filter(a=>a.nature==='S'), Rs=acts.filter(a=>a.nature==='R');
  const judg=Ks[0]||Ss[0]||top;                                  // judgment-heavy step
  const rote=[...Rs].sort((a,b)=>b.fte-a.fte)[0]||top;           // most rote step
  const first=acts[0]||{}, last=acts[acts.length-1]||{};
  const q=s=>'“'+(s||'the core step')+'”';
  const ir=d=>(t.inefficiency||[]).filter(x=>x.dim===d);
  const e=(arr,i)=>arr&&arr[i]?`${arr[i].ind.toLowerCase()} (${arr[i].val})`:'';   // "re-contact / rework rate (19%)"
  const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
  const dn=t.dataNeeds||[];
  const bad=dn.filter(x=>x[2]!=='reliable'), unavail=dn.filter(x=>x[2]==='unavailable'), good=dn.filter(x=>x[2]==='reliable');
  const tools=t.tools||[];
  const shadow=tools.filter(x=>x[2]==='shadow'), gap=tools.filter(x=>x[2]==='gap'), core=tools.filter(x=>x[2]==='core');
  const j2=arr=>{const a=(arr||[]).slice(0,2); return a.length>1?a[0]+' and '+a[1]:(a[0]||'');};
  const shadowList=j2([...shadow,...gap].map(x=>x[0]))||'manual spreadsheets';
  const coreList=j2(core.map(x=>x[0]))||'the core system';
  const badList=j2(bad.map(x=>x[0])).toLowerCase()||'key inputs';
  const ep=e(ir('proc'),1)||e(ir('proc'),0), ed=e(ir('data'),0), emg=e(ir('mgmt'),0);
  const wait=ir('mgmt').find(x=>/wait|queue|capacity/i.test(x.ind));

  const M={
    // PROCESSES
    'Process clarity & standardisation':[
      `${lo?'No documented standard for':hi?'Documented playbooks govern':'Only partial standards for'} ${q(judg.name)} — ${lo?'routing rules live with individual operators':hi?'applied consistently across operators':'edge cases still rely on personal know-how'}`,
      `Variation spans ${acts.length} mapped activities${ep?`, surfacing as ${ep}`:''}`,
      hi?`Standard work is maintained and used to onboard`:lo?`No owner keeps the standard current`:`Standardisation is uneven between steps`],
    'Value-adding ratio':[
      `${q(rote.name)} takes ${rote.pct?rote.pct+'% of team effort':'a large share of effort'} on low-value admin`,
      `${lo?'Rework and chasing crowd out core work':hi?'Waste is actively identified and removed':'Recurring admin still drains capacity'}${ep&&!hi?`; ${ep}`:''}`,
      hi?`Most hours land on value-adding work`:`Automating ${q(rote.name)} would free time for ${q(judg.name)}`],
    'E2E handoff quality':[
      `Work moves between ${coreList}${gap[0]?` and ${gap[0][0]}`:''} with ${lo?'manual re-keying at each step':hi?'context carried cleanly':'partial context loss'}`,
      `${lo?`Handoffs into ${q(judg.name)} drop context`:hi?`Ownership of the ${q(first.name)}→${q(last.name)} flow is clear`:`Handoffs add delay around ${q(judg.name)}`}`,
      lo?`No single owner of the end-to-end flow`:(mid?`Ownership thins where work crosses teams`:'')],
    'Volume & demand variability':[
      `${q(top.name)} runs at ${top.volume||'high, variable volume'}`,
      `${lo?'Unpredictable peaks overwhelm capacity and stretch cycle times':hi?'Peaks are forecast and capacity planned against them':'Peaks still trigger reactive firefighting'}`,
      (wait&&!hi)?`Visible as ${wait.ind.toLowerCase()} (${wait.val})`:''],
    'Exception & error rate':[
      `${cap(ep||'recurring exceptions')} ${lo?'drives constant rework':hi?'is kept low and root-caused':'still consumes avoidable effort'}`,
      `Concentrated in ${q(judg.name)}`,
      lo?`Errors escalate downstream rather than being caught early`:''],
    // CUSTOMER
    'Understanding of customer (segments) & expectations':[
      `${lo?'Segments barely influence':hi?'Clear segments drive':'Segments loosely influence'} how ${q(top.name)} is prioritised`,
      lo?`Service is largely one-size-fits-all regardless of customer value`:hi?`Differentiated service by segment is deliberate`:`Differentiation is inconsistent across segments`],
    'Client satisfaction & quality of customer touchpoints':[
      `${lo?`No closed-loop measurement around ${q((Ss[0]||top).name)}`:hi?`Experience tracked end-to-end across ${q((Ss[0]||top).name)}`:`Experience metrics on ${q((Ss[0]||top).name)} are collected but seldom acted on`}`,
      (()=>{const x=bad.find(y=>/sentiment|reason|nps|experience|behav/i.test(y[0])); return x?`${cap(x[0])} is ${x[2]} (${x[1]})`:(lo?`Outcomes are inferred, not measured`:'');})()],
    'Demand understanding':[
      bad.length?`Demand signals such as ${badList} are ${unavail.length?'unavailable':'unreliable'}`:`Demand signals are only partially captured`,
      `${lo?'Reasons for contact stay guesswork':hi?'Drivers are well understood and used proactively':'Demand is only partly understood'}`],
    'Customer centricity in decisions':[
      `Decisions on ${q(top.name)} ${lo?'favour internal convenience':hi?'lead with customer impact':'weigh customer impact, but cost often wins'}`,
      hi?`Customer impact is an explicit decision criterion`:lo?`Customer impact is an afterthought`:''],
    // MANAGEMENT SYSTEMS
    'KPI relevance & alignment':[
      `${lo?'KPIs track activity/cost, not outcomes':hi?'Outcome-focused KPIs in place':'KPIs tilt toward activity over outcomes'} for ${q(top.name)}`,
      emg?`${cap(emg)} ${lo?'is not on the dashboard':'is tracked'}`:(hi?`Aligned from team to leadership`:'')],
    'Performance management routines':[
      `${hi?'Disciplined review cadence with clear actions':lo?'No regular cadence — issues surface late':'Routines exist but follow-through is uneven'}`,
      emg&&!hi?`e.g. ${emg} goes unaddressed`:''],
    'Capacity & workload management':[
      `Capacity for ${q(top.name)} (${top.volume||'variable demand'}) is ${lo?'managed ad hoc':hi?'planned against forecast':'reactive to volume swings'}`,
      wait?`${cap(wait.ind.toLowerCase())} (${wait.val})`:(lo?`Spikes absorbed through overtime`:'')],
    'Decision rights & accountability':[
      `${lo?'Unclear decision rights stall escalations':hi?'Clear decision rights speed escalations':'Escalation paths add some delay'} from ${q(judg.name)}`,
      lo?`Ownership of outcomes is diffuse`:hi?`Accountability is explicit and respected`:''],
    'Continuous improvement structure':[
      `${hi?'A standing improvement structure sustains change':lo?'No structured improvement mechanism':'Improvement happens in pockets'}`,
      lo?`Fixes are one-off and rarely sustained`:hi?`Changes are captured, prioritised and tracked`:`Lacks a consistent cadence`],
    // DATA, SYSTEMS & INTEGRATIONS
    'Data availability & completeness':[
      unavail.length?`${cap(unavail[0][0])} is not captured at all`:`${cap((bad[0]||good[0]||['Key data'])[0])} has gaps`,
      `${lo?'Manual collection needed before work can start':hi?'Most inputs available at the point of use':'Some inputs need manual supplementation'}`,
      good[0]?`${cap(good[0][0])} (from ${good[0][1]}) is reliable`:''],
    'Data quality & consistency':[
      bad[0]?`${cap(bad[0][0])} from ${bad[0][1]} is ${bad[0][2]}`:`Core data is consistent`,
      ed?`Drives ${ed}`:(lo?`Teams keep shadow copies to compensate`:hi?`Trusted as a single source of truth`:'')],
    'System integration maturity':[
      gap[0]?`${gap[0][0]} is not integrated`:lo?`Systems are siloed`:hi?`Systems well integrated; data flows automatically`:`Integration is partial`,
      (lo||mid)?`Data is re-keyed across ${coreList}`:''],
    'Tooling fit':[
      (shadow[0]||gap[0])?`Staff fall back on ${shadowList}`:hi?`Tools fit the work and are used as intended`:`Core tools mostly fit`,
      shadow[0]?`Shadow tooling (${shadow.map(x=>x[0]).slice(0,2).join(', ')}) plugs the gaps`:gap[0]?`${gap[0][0]} is a known gap`:''],
    'Analytics & reporting maturity':[
      `${lo?'Reporting is manual and backward-looking':hi?'Mature analytics support forward-looking decisions':'Standard reporting; limited deeper analytics'}`,
      ed&&lo?`${cap(ed)}`:(core[0]?`Built on ${coreList}`:'')],
    // MINDSET & BEHAVIORS
    'Change openness':[
      `${hi?'The team engages change constructively':lo?'Change is met with scepticism':'Openness is tempered by change fatigue'}`,
      lo?`Shaped by past tool roll-outs that added work`:hi?`Willing to pilot new ways of working`:''],
    'AI & digital appetite':[
      `${hi?`Strong appetite — informal pilots run alongside ${coreList}`:lo?`Low appetite; reliance on ${shadowList}`:`Curiosity present; adoption beyond ${coreList} is early`}`,
      hi?`Early adopters already experimenting`:lo?`AI seen with suspicion or disinterest`:''],
    'Empowerment & initiative':[
      `${hi?`Staff own and improve ${q(top.name)}`:lo?`Staff await instruction on ${q(top.name)}`:'Initiative varies by manager'}`,
      lo?`Little autonomy to change the work`:hi?`Local improvements are encouraged`:''],
    'Leadership modeling':[
      `${hi?'Leaders visibly model the target behaviours':lo?'Leaders talk change but rarely model it':'Leader modelling is inconsistent'}`,
      lo?`Mixed signals slow adoption on the floor`:''],
    'Learning culture':[
      `${hi?'Knowledge is shared and skills built continuously':lo?`Know-how stays locked in individuals (e.g. ${q(judg.name)})`:'Learning happens, but informally'}`,
      lo?`Little time or structure for learning`:hi?`Structured sharing across the team`:`Limited cross-team sharing`],
    // ORGANISATION
    'Structural fit':[
      `${hi?'Structure aligns to':lo?'Structure fragments':'Structure mostly fits'} the ${q(first.name)}→${q(last.name)} flow`,
      lo?`Boundaries cut across the workflow, duplicating effort`:''],
    'E2E ownership':[
      `${hi?'Clear end-to-end ownership of':lo?'No single owner of':'Partial ownership of'} ${q(first.name)}→${q(last.name)}`,
      lo?`Accountability fragments at handoffs`:hi?`Outcomes are owned across team boundaries`:''],
    'Spans & layers':[
      `${hi?'Spans and layers balanced for fast decisions':lo?'Imbalanced spans/layers slow decisions':'Workable spans/layers with some pinch points'} across ${acts.length} activities`],
    'Role clarity & specialisation':[
      `${hi?'Roles are clear and specialised':lo?'Roles overlap and blur':'Roles are mostly clear'} across ${q(top.name)} and ${q(judg.name)}`,
      lo?`Overlap duplicates work and drops responsibilities`:''],
    'Capacity & skills mix':[
      `${hi?'Capacity and skills match the work':lo?`Skills gaps leave ${q(judg.name)} reliant on a few people`:'Skills mix is broadly adequate'}`,
      hi?`Resilient to absence and demand peaks`:lo?`Key-person risk on critical steps`:`Some key-person dependencies remain`],
  };
  const out=(M[name]||[]).filter(x=>x&&x.trim());
  return out.length?out:[t.rationale[dim]||'—'];
}

function progStats(){
  const total=TEAMS.length;
  const cnt={none:0,baseline:0,diagnostic:0,estimation:0,feasibility:0,validated:0};
  TEAMS.forEach(t=>{ cnt[t.status]=(cnt[t.status]||0)+1; });
  const scored=TEAMS.filter(t=>!isOngoing(t)).length;   // reached opportunity estimation or beyond → feeds client views
  const open=total-scored;
  const totFte=TEAMS.reduce((s,t)=>s+t.fte,0);

  const overall=Math.round(TEAMS.reduce((s,t)=>s+stageIdx(t.status)/PSTAGE_MAX,0)/total*100);

  return {total,cnt,scored,open,totFte,scoredFte,overall,ftePct};

function renderProgPlanning(s){
  const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmt=d=>d.getDate()+' '+MONTHS[d.getMonth()];
  const ABBR={ baseline:'Baseline', diagnostic:'Diagnostic', estimation:'Estimation', feasibility:'Feasibility', validated:'Validated' };
  const base=new Date(2026,5,22); // Mon 22 Jun 2026
  const remaining = t => PSTAGE_MAX - stageIdx(t.status);
  const W = Math.max(1, ...TEAMS.map(remaining));
  const cols = `220px repeat(${W},minmax(78px,1fr))`;

  // header
  let head=`<div class="gantt-row gantt-head" style="grid-template-columns:${cols};"><div class="gantt-lbl">Team</div>`;
  for(let w=0;w<W;w++){ const d=new Date(base); d.setDate(d.getDate()+w*7); head+=`<div class="gantt-wk">w/ ${fmt(d)}</div>`; }
  head+=`</div>`;

  const teamRow = t => {
    const idx=stageIdx(t.status), rem=PSTAGE_MAX-idx;
    let cells='';
    for(let w=0;w<W;w++){
      if(rem===0){ cells+=`<div class="gantt-cell">${w===0?'<span class="gantt-done">✓ Validated</span>':''}</div>`; }
      else if(w<rem){ const st=PSTAGES[idx+1+w]; cells+=`<div class="gantt-cell"><span class="gantt-bar" style="background:${resolveCol(st.col)};" title="${fmt(addW(base,w))}: → ${st.label}">${ABBR[st.key]}</span></div>`; }
      else cells+=`<div class="gantt-cell"></div>`;
    }
    return `<div class="gantt-row" style="grid-template-columns:${cols};"><div class="gantt-lbl"><b>${t.name}</b><span class="gantt-dept">${t.dept} · ${STATUS_LABEL[t.status]}</span></div>${cells}</div>`;
  };
  function addW(d,w){ const x=new Date(d); x.setDate(x.getDate()+w*7); return x; }

  // owner swimlanes
  let body='';
  NR_MEMBERS.forEach(m=>{
    const tms=TEAMS.filter(t=>TEAM_ASSIGN[t.id]===m.id).sort((a,b)=>remaining(b)-remaining(a)||a.priority-b.priority);
    if(!tms.length) return;
    const openN=tms.filter(t=>remaining(t)>0).length;
    body+=`<div class="gantt-lane"><span class="kc-ava" style="width:22px;height:22px;font-size:var(--fs-9);">${initialsOf(m.name)}</span>${m.name}<span class="gantt-lane-cnt">${tms.length} ${tms.length===1?'team':'teams'} · ${openN} open</span></div>`;
    tms.forEach(t=>{ body+=teamRow(t); });
  });
  const un=TEAMS.filter(t=>!TEAM_ASSIGN[t.id]||!memberById(TEAM_ASSIGN[t.id]));
  if(un.length){ body+=`<div class="gantt-lane" style="color:var(--muted-2);"><span class="kc-ava cl" style="width:22px;height:22px;font-size:var(--fs-9);background:var(--muted-2);">—</span>Unassigned<span class="gantt-lane-cnt">${un.length}</span></div>`;
    un.sort((a,b)=>a.priority-b.priority).forEach(t=>{ body+=teamRow(t); }); }

  const legend=PSTAGES.filter(p=>p.key!=='none').map(st=>`<span style="display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-11);color:var(--muted);"><span style="width:10px;height:10px;border-radius:3px;background:${st.col};display:inline-block;"></span>${st.label}</span>`).join('');

  $('#prog-body').innerHTML=`
    <div class="dd-section">
      <div class="eyebrow">Forward plan · who does what, when</div>
      <div style="font-size:var(--fs-115);color:var(--muted);margin:-2px 0 14px;">Each team's remaining stages laid out from the week of ${fmt(base)}, one stage per week, grouped by the responsible NR consultant. Each bar segment is the stage that team reaches that week; validated teams need no further work.</div>
      <div class="gantt"><div class="gantt-inner">${head}${body}</div></div>
      <div style="display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;">${legend}</div>
    </div>`;
}

/* ===================== AI OPPORTUNITY HEATMAP ===================== */
// sequential "improvement potential" scale: pale neutral -> deep NR green
function potColor(p){ const a=[236,242,239], b=[0,104,67]; p=Math.min(1,Math.max(0,p));
  const c=a.map((x,i)=>Math.round(x+(b[i]-x)*p)); return `rgb(${c[0]},${c[1]},${c[2]})`; }
function potText(p){ return p>=0.42?'#fff':'#0F2B52'; }
const NATURE_LABEL=window.__QS_DATA__?.model?.natureLabel||{ R:'Rule-based', S:'Semi-structured', K:'Knowledge-driven' };
const natureLever={ R:'auto', S:'aiacc', K:'aienh' };
function actIneff(t,i){ const map=INEFF_ACT[t.id]||[]; return t.inefficiency.filter((x,j)=>map[j]===i); }
function actOpp(t,name){ return t.opps.find(o=>o.activity===name)||null; }

function renderHeatmap(){
  const el=$('#page-heatmap');
  let cells=[];
  TEAMS.forEach(t=>{ if(isOngoing(t)) return; t.activities.forEach((a,i)=>{ const p=curOpt(t,i); cells.push({t,i,a,p,est:a.fte*p}); }); });
  const totAct=cells.length;
  const totFte=cells.reduce((s,c)=>s+c.est,0);
  const hot=cells.filter(c=>c.p>=0.5).length;
  const aiAct=cells.filter(c=>['S','K'].includes(c.a.nature)&&c.p>0).length;
  // hottest division (by optimisable FTE)
  const divEst={};
  DIVISIONS.forEach(g=>{ divEst[g.name]=cells.filter(c=>g.teams.includes(c.t.id)).reduce((s,c)=>s+c.est,0); });
  const topDiv=Object.entries(divEst).sort((a,b)=>b[1]-a[1])[0];
  const ic={
    grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
    hot:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3c1 4-2 5-2 8a4 4 0 0 0 8 0c0-2-1-3-1-3 2 1 3 3 3 6a8 8 0 0 1-16 0c0-5 5-7 6-11z"/></svg>',
    fte:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="3.2"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>',
    ai:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8z"/><path d="M18 14l.9 2.1L21 17l-2.1.9L18 20l-.9-2.1L15 17l2.1-.9z"/></svg>',
  };
  const kpi=(label,v,sub,icon,pot)=>`<div class="kpi-box${pot?' pot-box':''}">
    <div><div class="kpi-eyebrow">${label}</div><div class="kpi-v">${v}</div><div class="kpi-sub">${sub}</div></div>
    <div class="kpi-icon">${icon}</div></div>`;

  let grid='';
  DIVISIONS.forEach(g=>{
    const dcells=cells.filter(c=>g.teams.includes(c.t.id)).sort((a,b)=>b.est-a.est);
    if(!dcells.length) return;
    const dfte=dcells.reduce((s,c)=>s+c.est,0);
    grid+=`<div class="heat-divrow"><div class="heat-div"><span class="heat-div-n">${g.name}</span>
      <span class="heat-div-m">${dcells.length} activities · ~${dfte.toFixed(1)} FTE optimisable</span></div>
      <div class="heat-grid">`;
    dcells.forEach(c=>{ const p=c.p, col=potColor(p), txt=potText(p);
      grid+=`<div class="heat-cell" style="background:${col};color:${txt};" onclick="QS.heatDetail('${c.t.id}',${c.i})" title="Click for activity detail">
        <div class="heat-top"><span class="heat-team">${c.t.name}</span><span class="heat-nat">${c.a.nature}</span></div>
        <div class="heat-name">${c.a.name}</div>
        <div class="heat-bot"><span class="heat-pct-wrap"><span class="heat-pct">${Math.round(p*100)}%</span><span class="heat-cap">potential</span></span><span class="heat-fte">${c.a.fte} FTE · up to <b>${c.est.toFixed(1)}</b> freed</span></div>
      </div>`; });

const eur=n=>{ n=Math.round(n); const s=n<0?'-':''; n=Math.abs(n);
  if(n>=1e6) return s+'€'+(n/1e6).toFixed(n%1e6===0?0:1)+'M';
  if(n>=1e3) return s+'€'+Math.round(n/1e3)+'k'; return s+'€'+n; };

function vsCompute(){
  const totOptFte=TEAMS.reduce((s,t)=>s+teamOptTotal(t),0);
  const realise=Math.max(0,Math.min(1,(VS.realise||0)/100));
  const released=totOptFte*realise;
  const annual=released*VS.costPerFte;
  const impl=totOptFte*VS.implPerFte;
  const payback=annual>0?impl/(annual/12):0;
  const opps=allOpps(); const hz={'0-6m':0,'6-12m':0,'12-24m':0};
  opps.forEach(o=>{ hz[o.horizon]=(hz[o.horizon]||0)+(o.fte[0]+o.fte[1])/2; });
  const hzTot=(hz['0-6m']+hz['6-12m']+hz['12-24m'])||1;
  const phFte={'0-6m':released*hz['0-6m']/hzTot,'6-12m':released*hz['6-12m']/hzTot,'12-24m':released*hz['12-24m']/hzTot};
  const c6=phFte['0-6m'], c12=c6+phFte['6-12m'], c24=c12+phFte['12-24m'];
  const rate=m=>{ if(m<=6) return c6*(m/6); if(m<=12) return c6+(c12-c6)*((m-6)/6); if(m<=24) return c12+(c24-c12)*((m-12)/12); return c24; };
  let cum=0; for(let m=1;m<=36;m++){ cum+=rate(m-0.5)*VS.costPerFte/12; }
  return {totOptFte,released,annual,impl,payback,phFte,c6,c12,c24,cum,realise};
}
