function opps(filter){ return RES().opportunities.filter(o=>o&&(!filter||filter(o))); }
function oppsOf(tid){ return opps(o=>o.team===tid); }
function fteOf(o){ const f=o.fte||[0,0]; return (( +f[0]||0)+(+f[1]||0))/2; }
function teamFte(tid){ return oppsOf(tid).reduce((a,o)=>a+fteOf(o),0); }
function totalFte(){ return opps().reduce((a,o)=>a+fteOf(o),0); }
function anyFindings(){ return assessed().length>0 || opps().length>0; }
/* the score bands, identical to the quickscan's stops */
function scoreColor(v){ return v>=4.2?'var(--s5-t)':v>=3.4?'var(--s4-t)':v>=2.6?'var(--s3-t)':v>=1.8?'var(--s2-t)':'var(--s1-t)'; }
function scoreBg(v){ return v>=4.2?'var(--s5)':v>=3.4?'var(--s4)':v>=2.6?'var(--s3)':v>=1.8?'var(--s2)':'var(--s1)'; }
function readiness(v){ return v>=3.3?['Ready','var(--s5-t)','var(--s5)']:v>=2.8?['Developing','var(--s2-t)','var(--s2)']:['Foundation','var(--s1-t)','var(--s1)']; }
function lev(k){ return M.levers[k]||{label:'Not decided yet',bg:'var(--surface-2)',t:'var(--muted)',dot:'var(--muted-2)'}; }
/* the dominant verdict in a set of opportunities — the one carrying the most FTE */
function dominantLever(list){
  const by={}; (list||[]).forEach(o=>{ if(o.lever) by[o.lever]=(by[o.lever]||0)+fteOf(o); });
  const e=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
  return e?e[0]:null;
}
function divisionsOf(){
  const seen=[], by={};
  inScopeTeams().forEach(t=>{ const d=t.division||'Unassigned';
    if(!by[d]){ by[d]=[]; seen.push(d); } by[d].push(t); });
  return seen.map(name=>({name,teams:by[name]}));
}
/* One chain's stages, with the teams standing on each. A team can appear on more than
   one chain (a shared claims desk serving two products) but only once per chain. */
function stagesOf(chainId){
  const c=chainOf(chainId); if(!c) return [];
  const st=(c.stages||[]).filter(Boolean); if(!st.length) return [];
  const teams=inScopeTeams();
  const list=st.map(name=>({name,teams:teams.filter(t=>placedOn(t,c.id)===name)}));
  const rest=teams.filter(t=>!placementsOf(t).length);
  if(rest.length && chainId===(VCS()[0]||{}).id) list.push({name:'Not placed yet',teams:rest,orphan:true});
  return list;
}
function chainOf(id){ return VCS().find(c=>c.id===id)||null; }
function placementsOf(t){ return (t.placements||[]).filter(p=>p&&p.stage&&chainOf(p.chain)); }
function placedOn(t,chainId){ const p=(t.placements||[]).find(x=>x&&x.chain===chainId); return p?p.stage:''; }
function setPlacement(t,chainId,stage){
  t.placements=(t.placements||[]).filter(p=>p&&p.chain!==chainId);
  if(stage) t.placements.push({chain:chainId,stage});
}
function horizonOf(o){ return (M.horizons.find(h=>h.k===o.horizon)||M.horizons[0]).k; }
/* the real months behind a horizon, once the engagement window is set */
function horizonWhen(h){
  const s=E.assignment.start; if(!s) return h.when;
  const d=x=>{ const t=new Date(s); if(isNaN(t)) return null; t.setMonth(t.getMonth()+x); return t; };
  const a=d(h.from), b=d(h.to); if(!a||!b) return h.when;
  const f=t=>MON[t.getMonth()]+' '+t.getFullYear();
  return f(a)+' – '+f(b);
}
/* ── the value case, from the numbers in Settings ── */
function valueCase(){
  const v=E.valueInputs||{}, cost=+v.costPerFte||0, real=(+v.realise||100)/100, impl=+v.implPerFte||0;
  const fte=totalFte(), annual=fte*cost*real, invest=fte*impl;
  const cum=M.horizons.reduce((a,h)=>a+opps(o=>horizonOf(o)===h.k).reduce((x,o)=>x+fteOf(o),0)*cost*real*h.ramp,0);
  return {fte, annual, invest, cum, payback: annual>0 ? invest/(annual/12) : 0, cost, real, impl};
}
const eur=n=> n>=1e6?'€'+(n/1e6).toFixed(1)+'M' : n>=1e3?'€'+Math.round(n/1e3)+'k' : '€'+Math.round(n);

/* ── validation ── */
function issues(){
  const out=[];
  if(!E.client.trim())          out.push({k:'client',s:'The client name is empty.'});
  if(!E.id.trim())              out.push({k:'id',s:'No engagement id — that is the folder name and the baseline join key.'});
  if(!E.scope.statement.trim()) out.push({k:'scope',s:'No scope statement. Claude will ask for one before it sets anything up.'});
  if(!inScopeTeams().length)    out.push({k:'teams',s:'No teams in scope.'});
  const dup=E.teams.map(t=>t.id).filter((v,i,a)=>v&&a.indexOf(v)!==i);
  if(dup.length)                out.push({k:'dup',s:'Duplicate team ids: '+[...new Set(dup)].join(', ')+'. Ids are the baseline join key and must be unique.'});
  const noFte=inScopeTeams().filter(t=>!(+t.fte));
  if(noFte.length)              out.push({k:'fte',soft:1,s:noFte.length+' team'+(noFte.length>1?'s have':' has')+' no FTE estimate. Allowed — the org baseline sets the factual number — but the value case stays unquantified until it runs.'});
  const deepTeams=inScopeTeams().filter(t=>teamDepth(t)==='full-diagnostic').length;
  if(E.assignment.type==='opex-quickscan'&&deepTeams)
    out.push({k:'mix',soft:1,s:deepTeams+' team'+(deepTeams>1?'s are':' is')+' set to full-diagnostic depth inside a quickscan. Deliberate is fine — the plan is what counts — but check the timeline.'});
  const offCells=cellStats().off;
  if(offCells) out.push({k:'off',soft:1,s:offCells+' team-and-dimension combination'+(offCells>1?'s have':' has')+' nothing planned. Those dimensions will carry no score for that team.'});
  return out;
}

/* ── export ── */
function buildExport(){
  derivePlan();
  const o=JSON.parse(JSON.stringify(E));
  delete o._planTouched;
  o.teams=o.teams.filter(t=>t.name&&t.id).map(t=>({
    id:t.id,name:t.name,dept:t.dept||'',division:t.division||'',placements:placementsOf(t),
    fte:(+t.fte||null),hc:(+t.hc||null),lead:t.lead||'',email:t.email||'',
    priority:+t.priority||null,inScope:t.inScope!==false,depth:t.depth||null,note:t.note||''
  }));
  o.divisions=[...new Set(o.teams.map(t=>t.division).filter(Boolean))]
    .map(n=>({name:n,teams:o.teams.filter(t=>t.division===n).map(t=>t.id)}));
  o.createdAt=o.createdAt||todayISO();
  return o;
}
function PROMPT(){ return `Set up this NR engagement from the configurator export below.

Before you build anything:
1. Challenge the scope. If it is too vague to defend in a steering committee, say what you would need.
2. Flag any team set deeper or lighter than the assignment warrants, and any team with no FTE estimate.
3. Answer the open questions at the bottom of the export, or tell me who has to answer them.

Then:
4. Set the engagement up for "${E.id||'<id>'}" and register every team in scope so the later analyses can find them.
5. Save the engagement as active, with the open questions cleared.
6. Come back with a one-page plan — which analysis, on which team, in which week.

As the work then runs, write what you find back into the "results" block of this same file, and
give it back to me so the dashboard can show it:
- results.teams[<team id>] = { scores: {proc,cust,mgmt,data,mind,org — each 1 to 5},
    lever: <how to fix it>, fteImpact: [low,high], finding: <one sentence>, status: "validated" }
- results.opportunities[] = { id, team: <team id>, title, lever, horizon: "0-6m" | "6-12m" | "12-24m",
    fte: [low,high] }
Never invent a score or an opportunity. A team with nothing in results simply shows as still being
assessed, which is the truth.

Propose first. Do not write anything until I approve it.

--- the setup ---
`; }
function download(){
  const b=new Blob([JSON.stringify(buildExport(),null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='engagement.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast('Setup file saved');
}

/* ── load ── */
function loadFile(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ adopt(JSON.parse(r.result)); }catch(e){ toast('That file is not valid JSON.'); } };
  r.readAsText(f); inp.value='';
}
function adopt(o){
  E=normalise(o); derivePlan(); save();
  MODE='live'; go('overview'); toast('Engagement loaded — '+(E.client||E.id));
}
/* older files used five types plus a separate AI toggle; fold them into the three */
const OLD_TYPES={'ai-enabled-opex':'ai-first-redesign','future-state':'ai-first-redesign'};
const OLD_DEPTHS={'ai-enabled':'redesign'};
function mapType(a){
  if(OLD_TYPES[a.type]) return OLD_TYPES[a.type];
  if(M.types[a.type]) return a.type;
  if(a.aiEnabled) return 'ai-first-redesign';
  if(a.depth==='light-quickscan') return 'opex-quickscan';
  return 'opex-diagnostic';
}
function mapDepth(d){ return OLD_DEPTHS[d] || (M.approaches[d] ? d : 'full-diagnostic'); }
function normalise(o){
  if(o.schemaVersion===2||o.contract){
    o.plan=o.plan||{}; o.methodology=o.methodology||{ref:M.ref,version:M.version,approach:'full-diagnostic',overrides:{}};
    o.methodology.overrides=o.methodology.overrides||{};
    o.handoff=o.handoff||{assumptions:[],questions:[]};
    o.assignment=Object.assign(blank().assignment,o.assignment||{});
    o.assignment.type=mapType(o.assignment);
    o.assignment.depth=mapDepth(o.assignment.depth);
    o.scope=Object.assign(blank().scope,o.scope||{});
    /* 2026.10 shipped a single scope.valueChain; a client can have several */
    if(o.scope.valueChain && !(o.scope.valueChains||[]).length){
      const v=o.scope.valueChain;
      o.scope.valueChains=(v.stages||[]).filter(Boolean).length
        ? [{id:'vc1',name:v.label||'Value chain',stages:v.stages}] : [];
    }
    delete o.scope.valueChain;
    o.scope.valueChains=(o.scope.valueChains||[]).map((c,i)=>Object.assign({id:'vc'+(i+1),name:'Value chain',stages:[]},c));
    o.results=Object.assign({updatedAt:'',teams:{},opportunities:[]},o.results||{});
    (o.teams||[]).forEach(t=>{
      if(t.depth) t.depth=mapDepth(t.depth);
      if(!t.placements) t.placements = t.stage ? [{chain:'vc1',stage:t.stage}] : [];
      delete t.stage;
    });
    o.nrMembers=(o.nrMembers||[]).map(m=>Object.assign({skills:[]},m));
    o._planTouched=!!(o.plan.baseline||o.plan.registers);
    return Object.assign(blank(),o);
  }
  /* legacy schemaVersion 1 (the first-generation engagement file) */
  const c=blank(), e=o.engagement||{};
  c.id=o.id||slug(o.client||''); c.client=o.client||e.client||''; c.status=o.status||'active';
  c.assignment={type:'opex-diagnostic',aiEnabled:false,depth:(o.methodology&&o.methodology.approach)||'full-diagnostic',
    partner:'',lead:e.lead||'',sponsor:'',start:e.start||'',target:e.target||'',language:'en'};
  c.assignment.type=mapType(c.assignment);
  c.scope={statement:e.scope||'',entity:'',processes:[],objectives:[],outOfScope:[],constraints:e.notes?[e.notes]:[]};
  const div={}; (o.divisions||[]).forEach(d=>d.teams.forEach(t=>div[t]=d.name));
  const rich=(o.teams||[]).filter(t=>t&&t.id&&t.name);
  if(rich.length){
    c.teams=rich.map((t,i)=>({id:t.id,name:t.name,dept:t.dept||'',division:div[t.id]||t.division||'',placements:[],
      fte:(+t.fte||null),hc:null,lead:t.lead||'',email:t.email||'',priority:+t.priority||i+1,inScope:true,depth:null,note:''}));
    /* carry any findings the old file already held, so the summaries are not blank */
    rich.forEach(t=>{
      if(!t.scores) return;
      c.results.teams[t.id]={scores:t.scores,lever:t.lever||null,readiness:t.readiness||null,
        fteImpact:t.fteImpact||null,finding:t.finding||'',status:t.status||'validated'};
      (t.opps||[]).forEach((op,i)=>c.results.opportunities.push({
        id:t.id+'-'+(i+1), team:t.id, title:op.title||op.name||('Opportunity '+(i+1)),
        lever:op.lever||t.lever||null, horizon:op.horizon||'0-6m', fte:op.fte||[0,0]}));
    });
    c.results.updatedAt=todayISO();
  } else {
    const ids=[...new Set([].concat(...(o.divisions||[]).map(d=>d.teams),Object.keys(o.teamAssign||{})))];
    c.teams=ids.map((id,i)=>({id,name:id.toUpperCase(),dept:'',division:div[id]||'',placements:[],fte:null,hc:null,lead:'',email:'',priority:i+1,inScope:true,depth:null,note:''}));
  }
  c.divisions=o.divisions||[]; c.nrMembers=o.nrMembers||[]; c.teamAssign=o.teamAssign||{};
  c.methodology=Object.assign(c.methodology,o.methodology||{}); c.methodology.overrides=c.methodology.overrides||{};
  c.weights=o.weights||c.weights; c.valueInputs=o.valueInputs||c.valueInputs;
  c._legacy=true;
  return c;
}
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   NAVIGATION + SHELL
   ═══════════════════════════════════════════════════════════════════════════ */
const SETUP_NAV=[
  {sec:'Configure'},
  {k:'s1',n:1,l:'Client & assignment'},
  {k:'s2',n:2,l:'Scope'},
  {k:'s3',n:3,l:'Teams in scope'},
  {k:'s4',n:4,l:'NR project team'},
  {k:'s5',n:5,l:'Analysis plan'},
  {k:'s6',n:6,l:'Review & hand over'},
  {sec:'Guide'},
  {k:'how',i:'help',l:'How this works'}
];
const LIVE_NAV=[
  {k:'overview',i:'grid',l:'Engagement overview'},
  {sec:'The findings'},
  {k:'exec',i:'book',l:'Executive summary'},
  {k:'chain',i:'chain',l:'Value chain'},
  {k:'roadmap',i:'route',l:'Transformation roadmap'},
  {k:'benefits',i:'euro',l:'Benefits overview'},
  {sec:'Deep dives'},
  {k:'teams',i:'users',l:'Teams & analyses',num:()=>inScopeTeams().length},
  {sec:'Workspace'},
  {k:'run',i:'play',l:'How to run'},
  {k:'config',i:'sliders',l:'Settings'},
  {k:'export',i:'down',l:'Hand over'},
  {sec:'Guide'},
  {k:'how',i:'help',l:'How this works'}
];
const START_NAV=[{sec:'Start'},{k:'start',i:'folder',l:'New or open'},{sec:'Guide'},{k:'how',i:'help',l:'How it works'}];

const TITLES={
  start:['Engagement setup','Start a new engagement, or open one you already have'],
  s1:['Client & assignment','Who the client is, and what kind of work this is'],
  s2:['Scope','What is in, what is out, and what it is for'],
  s3:['Teams in scope','The teams we will assess'],
  s4:['NR project team','Who from NR is on this'],
  s5:['Analysis plan','What we actually run, team by team'],
  s6:['Review & hand over','A last look, then over to Claude'],
  overview:['Engagement overview','What we agreed, and what we are doing about it'],
  exec:['Executive summary','What we found, one page, for the steering committee'],
  chain:['Value chain','The teams on the chain the client earns its money along'],
  roadmap:['Transformation roadmap','What happens when, and what has to come first'],
  benefits:['Benefits overview','What the potential is worth, and what it costs to get'],
  teams:['Teams & analyses','Every team in scope, and exactly what runs on it'],
  run:['How to run an analysis','What to say to Claude, for each one'],
  config:['Settings','The numbers this engagement uses'],
  export:['Hand over','Send it to Claude, or save the file'],
  how:['How this works','The whole thing, in three steps']
};

function navFor(){ return MODE==='setup'?SETUP_NAV:MODE==='live'?LIVE_NAV:START_NAV; }
function stepDone(k){
  if(!E) return false;
  return ({s1:()=>!!(E.client&&E.id), s2:()=>!!E.scope.statement.trim(), s3:()=>inScopeTeams().length>0,
           s4:()=>E.nrMembers.length>0, s5:()=>planCount()>0, s6:()=>E.status!=='configuring'}[k]||(()=>false))();
}

function renderShell(){
  const nav=navFor();
  $('#sb-nav').innerHTML=nav.map(it=>{
    if(it.sec) return `<div class="sb-sec">${it.sec}</div>`;
    const on=PAGE===it.k, done=it.n?stepDone(it.k):false;
    const badge=it.num?`<span class="num">${it.num()}</span>`:'';
    const glyph=it.n?`<span class="stepn">${done?'&#10003;':it.n}</span>`:ico(it.i);
    return `<div class="sb-link ${on?'active':''} ${done?'done':''}" onclick="go('${it.k}')">${glyph}${it.l}${badge}</div>`;
  }).join('');
  $('#sb-mode').textContent = MODE==='live'?((M.types[E.assignment.type]||{}).label||'Engagement'):'Engagement setup';
  const cn=$('#sb-client');
  cn.textContent = (E&&E.client)||'Not configured';
  cn.className='sb-client-n'+((E&&E.client)?'':' empty');
  $('#sb-foot').innerHTML = E&&inScopeTeams().length
    ? `<b>${esc(E.client||E.id)}</b><br>${inScopeTeams().length} teams · ${scopeFte()||'—'} FTE in scope<br>${esc((M.types[E.assignment.type]||{}).label||'')}`
    : 'No engagement loaded';

  const t=(TITLES[PAGE]||['','']).slice();
  if(PAGE==='chain'&&VCS().length>1){ t[0]='Value chains'; t[1]='The teams on the chains the client earns its money along'; }
  const step=(SETUP_NAV.find(x=>x.k===PAGE)||{}).n;
  $('#tb-title').textContent=t[0];
  $('#tb-sub').innerHTML=(step?`<span class="tb-step">Step ${step} of 6</span>`:'')+esc(t[1]);
  const st=E?E.status:'';
  $('#tb-right').innerHTML=[
    (ACTIONS[PAGE]||(()=>''))(),
    MODE==='live'&&st?`<span class="tb-pill ${st==='active'?'green':'amber'}">${esc(st)}</span>`:'',
    MODE==='setup'&&PAGE!=='s6'?`<button class="fchip" onclick="finishSetup()">Open the dashboard</button>`:'',
    MODE==='live'?`<button class="fchip" title="Go back to the six setup steps" onclick="MODE='setup';go('s1')">Change the setup</button>`:'',
    E?`<button class="icon-btn" title="Close engagement" onclick="closeEng()">${ico('folder')}</button>`:'',
    `<button class="icon-btn" title="Open an engagement you already have" onclick="document.getElementById('loadfile').click()">${ico('up')}</button>`
  ].join('');
}

/* Each page's own action, in the topbar next to its title — so no page has to draw a
   second header just to hang a button on. */
const ACTIONS={
  s1:()=>nextBtn('s2'), s2:()=>nextBtn('s3'), s3:()=>nextBtn('s4'), s4:()=>nextBtn('s5'), s5:()=>nextBtn('s6')
};
/* a section header, with its own controls on the right */
const sec=(label,right)=>`<div class="sec2"><span class="eyebrow">${label}</span>${right?`<div class="sec2-a">${right}</div>`:''}</div>`;

function go(k){
  /* an unknown key used to render a silent blank page — land somewhere real instead.
     'scope' arrives here from older bookmarks: it was folded into the overview. */
  if(!PAGES[k]) k = MODE==='live'?'overview' : MODE==='setup'?'s1' : 'start';
  PAGE=k;
  if(!E && k!=='start' && k!=='how'){ k=PAGE='start'; }
  renderShell();
  const el=$('#page'); el.innerHTML=(PAGES[k]||(()=>''))(); el.scrollTop=0;
  el.classList.remove('active'); void el.offsetWidth; el.classList.add('active');
}
function startNew(){ E=blank(); addTeam(true); derivePlan(); save(); MODE='setup'; go('s1'); }
function finishSetup(){ if(!E) return; MODE='live'; go('overview'); }
function closeEng(){ if(!confirm('Close this engagement? The draft stays in this browser until you start a new one.')) return; E=null; save(); MODE='start'; go('start'); }

/* field binder — writes state without re-rendering, so typing keeps focus */
function upd(path,v){
  set(E,path,v); save();
  if(path==='client'&&!E._idTouched){ E.id=slug(v); const el=$('#f-id'); if(el) el.value=E.id; $('#sb-client').textContent=v||'Not configured'; $('#sb-client').className='sb-client-n'+(v?'':' empty'); }
  if(path==='client'){ $('#sb-client').textContent=v||'Not configured'; $('#sb-client').className='sb-client-n'+(v?'':' empty'); }
}
function updId(v){ E._idTouched=true; E.id=slug(v); save(); }
function field(label,path,o){
  o=o||{}; const v=get(E,path), t=o.type||'text';
  const bind=`oninput="upd('${path}',this.value${t==='num'?'===\'\'?null:+this.value':''})"`;
  return `<div class="field"><label>${label}</label>${
    t==='textarea'?`<textarea rows="${o.rows||3}" placeholder="${esc(o.ph||'')}" ${bind}>${esc(v||'')}</textarea>`
    :`<input type="${t==='num'?'number':t}" value="${esc(v==null?'':v)}" placeholder="${esc(o.ph||'')}" ${bind}>`}
    ${o.hint?`<span class="hint">${o.hint}</span>`:''}</div>`;
}
function bullets(path,ph){
  const arr=get(E,path)||[];
  return `<div>${arr.map((v,i)=>`<div class="bl-row"><span class="bd"></span>
    <input class="tinp" type="text" value="${esc(v)}" placeholder="${esc(ph||'')}" oninput="blSet('${path}',${i},this.value)">
    <button class="xb" onclick="blDel('${path}',${i})">&times;</button></div>`).join('')}
    <button class="addlink" onclick="blAdd('${path}')">+ add</button></div>`;
}
function blSet(p,i,v){ get(E,p)[i]=v; save(); }
function blDel(p,i){ get(E,p).splice(i,1); go(PAGE); }
function blAdd(p){ get(E,p).push(''); go(PAGE); }

/* side panel */
function openPanel(html,title,sub){ $('#panel-t').textContent=title; $('#panel-s').textContent=sub||''; $('#panel-b').innerHTML=html; $('#panel').classList.add('open'); $('#scrim').classList.add('open'); }
function closePanel(){ $('#panel').classList.remove('open'); $('#scrim').classList.remove('open'); }
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   PAGES
   ═══════════════════════════════════════════════════════════════════════════ */
const nextBtn=(k,label)=>`<button class="fchip go" onclick="go('${k}')">${label||'Continue'} &rarr;</button>`;
/* The topbar already names the page and says what it is for. A page adds a lead sentence
   only when it has something to teach — never a second copy of its own title. */
const lead=t=>t?`<p class="pagelead">${t}</p>`:'';

/* ── ready-made content, so nothing has to be typed from scratch ──────────── */
const OBJECTIVE_SUGGESTIONS=[
  'Quantify the operational potential in FTE',
  'Build a defensible business case for next year\u2019s budget',
  'Rank AI use cases by feasibility and impact',
  'Find the binding constraint on AI readiness',
  'Design the target operating model for the value chain',
  'Set a baseline we can measure improvement against',

/* ── the client's value chain ─────────────────────────────────────────────
   Teams tell you how the client is organised. The value chain tells you how the
   client actually earns its money — and it is the frame the findings get told in.
   It cannot be derived from the org chart, so it is asked for here. */
function vcEditor(){
  const chains=(E.scope.valueChains||[]);
  const live=VCS(), all=inScopeTeams().length, placed=inScopeTeams().filter(t=>placementsOf(t).length).length;
  const block=(c,ci)=>{
    const st=(c.stages||[]).filter(Boolean);
    const chips=(c.stages||[]).map((x,i)=>`<span class="vcs">
      <button class="vcs-mv" title="Move earlier" ${i===0?'disabled':''} onclick="vcMove(${ci},${i},-1)">&#8249;</button>
      <input class="vcs-in" size="${Math.max(9,Math.min(String(x||'').length+1,26))}" value="${esc(x)}" placeholder="Stage"
        oninput="vcSet(${ci},${i},this.value);this.size=Math.max(9,Math.min(this.value.length+1,26))">
      <button class="vcs-mv" title="Move later" ${i===(c.stages||[]).length-1?'disabled':''} onclick="vcMove(${ci},${i},1)">&#8250;</button>
      <button class="vcs-x" title="Remove" onclick="vcDelStage(${ci},${i})">&times;</button></span>`).join('');
    return `<div class="vcblock">
      <div class="vcblock-h">
        <input class="vcname" value="${esc(c.name||'')}" placeholder="Name this chain — the product or service it delivers"
          oninput="vcName(${ci},this.value)">
        ${st.length?`<span class="badge-soft">${st.length} stage${st.length>1?'s':''}</span>`:''}
        ${chains.length>1?`<button class="xb" title="Remove this chain" onclick="vcDelChain(${ci})">&times;</button>`:''}
      </div>
      ${st.length?'':`<div class="sugg-l" style="margin-top:0">Start from a standard chain — rename anything that does not fit</div>
        <div class="sugg" style="margin-bottom:12px">${Object.keys(M.chains).map(k=>
          `<button onclick="vcLoad(${ci},'${k}')">+ ${k}</button>`).join('')}</div>`}
      <div class="vcs-row">${chips}<button class="addlink" onclick="vcAddStage(${ci})">+ Add stage</button>${
        st.length?`<button class="addlink" style="color:var(--muted)" onclick="vcClear(${ci})">Start over</button>`:''}</div>
      ${st.length?`<div class="vcflow">${st.map((x,i)=>`<span class="vcf${i===0?' first':''}">${esc(x)}</span>`).join('')}</div>`:''}
    </div>`;
  };
  return `<div class="card" style="margin:0 0 16px">
    <div class="ch"><span class="ct">The client&rsquo;s value chain${chains.length>1?'s':''}</span>
      <span class="badge-soft">${live.length?live.length+' chain'+(live.length>1?'s':'')+' · '+placed+' of '+all+' teams placed':'not set'}</span></div>
    <p style="font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:13px;max-width:780px">
      The handful of steps the client&rsquo;s business runs through, start to finish. The findings get told along
      this chain rather than along the org chart &mdash; it is how a board sees the company, and it is what shows
      where a weak team actually hurts. Order the stages the way the work flows.
      <b>A client that sells more than one thing has more than one chain</b> &mdash; add one per product or service
      line, and place each team on every chain it serves. You do the placing in the next step.</p>
    ${chains.map(block).join('')}
    <div style="margin-top:${chains.length?'6px':'0'}">
      <button class="addlink" onclick="vcAddChain()">+ ${chains.length?'Add another value chain':'Add a value chain'}</button></div>
    <span class="hint" style="display:block;margin-top:12px">Leave it empty and everything still works &mdash; the value chain page simply stays closed.</span>
  </div>`;
}
function vcArrC(){ const s=E.scope; s.valueChains=s.valueChains||[]; return s.valueChains; }
function vcNewId(){ const a=vcArrC(); let n=1; while(a.some(c=>c.id==='vc'+n)) n++; return 'vc'+n; }
function vcAddChain(){ vcArrC().push({id:vcNewId(),name:'',stages:[]}); save(); go('s2'); }
function vcDelChain(ci){
  const c=vcArrC()[ci]; if(!c) return;
  (E.teams||[]).forEach(t=>{ t.placements=(t.placements||[]).filter(p=>p.chain!==c.id); });
  vcArrC().splice(ci,1); save(); go('s2');
}
function vcName(ci,v){ const c=vcArrC()[ci]; if(c){ c.name=v; save(); } }
function vcStages(ci){ const c=vcArrC()[ci]; if(!c) return []; c.stages=c.stages||[]; return c.stages; }
function vcAddStage(ci){ vcStages(ci).push(''); save(); go('s2'); }
function vcSet(ci,i,v){
  const c=vcArrC()[ci], a=vcStages(ci), old=a[i]; a[i]=v;
  (E.teams||[]).forEach(t=>(t.placements||[]).forEach(p=>{ if(p.chain===c.id&&p.stage===old) p.stage=v; }));
  save();
}
function vcDelStage(ci,i){
  const c=vcArrC()[ci], a=vcStages(ci), old=a[i]; a.splice(i,1);
  (E.teams||[]).forEach(t=>{ t.placements=(t.placements||[]).filter(p=>!(p.chain===c.id&&p.stage===old)); });
  save(); go('s2');
}
function vcMove(ci,i,d){ const a=vcStages(ci), j=i+d; if(j<0||j>=a.length) return; const x=a[i]; a[i]=a[j]; a[j]=x; save(); go('s2'); }
function vcClear(ci){
  const c=vcArrC()[ci]; if(!c) return; c.stages=[];
  (E.teams||[]).forEach(t=>{ t.placements=(t.placements||[]).filter(p=>p.chain!==c.id); });
  save(); go('s2');
}
function vcLoad(ci,k){
  const c=vcArrC()[ci]; if(!c) return;
  if(!c.name) c.name=k; c.stages=(M.chains[k]||[]).slice(); save(); go('s2');
}

      <div class="sugg" style="margin-bottom:14px">${Object.keys(TEAM_EXAMPLES).map(k=>
        `<button onclick="loadExampleTeams('${k}')">+ ${k} · ${TEAM_EXAMPLES[k].length} teams</button>`).join('')}</div>`}
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th></th><th>Team</th><th>Id</th><th>Division</th><th>Department</th>${
        VCS().map(c=>`<th>${VCS().length>1?esc(c.name||'Chain'):'Value-chain stage'}</th>`).join('')
      }<th>FTE</th><th>Lead</th><th>Depth</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    ${VCS().length?(unplaced().length?`<p style="font-size:11.5px;color:var(--s2-t);margin-top:11px">

      :`<p style="font-size:11.5px;color:var(--muted-2);margin-top:11px">Set the client's value chain in <button class="addlink" style="padding:1px 7px" onclick="go('s2')">Step 2 · Scope</button> and a stage column appears here.</p>`}
    <p style="font-size:11px;color:var(--muted-2);margin-top:12px;line-height:1.5">Depth defaults to the assignment (<b>${esc((M.approaches[E.assignment.depth]||{}).label)}</b>) — the inherited option shows greyed. Click another to run that team deeper or lighter; click an active override to hand it back. <b>Redesign</b> adds the design work on top of the diagnostic: the verdict on each opportunity, the blueprint, and the target operating model.</p>

/* three-state coloured pill: the inherited depth shows greyed, an explicit choice fills */
function depthPill(i){
  const t=E.teams[i], inh=E.assignment.depth, exp=t.depth;
  const btn=k=>{
    const a=M.approaches[k], on=exp===k, inherited=!exp&&inh===k;
    return `<button class="${on?'on '+a.tone:inherited?'inh':''}" title="${on?'Overridden — click to inherit again':'Run this team at '+a.label+' depth'}"
      onclick="tDepth(${i},'${k}')">${a.short}</button>`;
  };
  return `<span class="dpill ${exp?'set':''}">${Object.keys(M.approaches).map(btn).join('')}</span>`;
}
function VCS(){ return (((E&&E.scope)||{}).valueChains||[]).filter(c=>c&&(c.stages||[]).filter(Boolean).length); }
function unplaced(){ return VCS().length?inScopeTeams().filter(t=>!placementsOf(t).length):[]; }
/* how a team's placements read on one line */
function placementText(t){
  const p=placementsOf(t); if(!p.length) return '';
  return VCS().length>1
    ? p.map(x=>`${esc((chainOf(x.chain)||{}).name||'')} · ${esc(x.stage)}`).join(' &nbsp;·&nbsp; ')
    : esc(p[0].stage);
}
function tDepth(i,k){ E.teams[i].depth = E.teams[i].depth===k ? null : k; derivePlan(); save(); go('s3'); }
function addTeam(silent){
  E.teams.push({id:'',name:'',dept:'',division:'',placements:[],fte:null,hc:null,lead:'',email:'',priority:E.teams.length+1,inScope:true,depth:null,note:''});
  if(!silent) go('s3');
}
function tSet(i,k,v){ E.teams[i][k]=v; derivePlan(); save(); if(k==='id'||k==='inScope'||k==='depth') go('s3'); }
function tPlace(i,chainId,stage){ setPlacement(E.teams[i],chainId,stage); save(); go('s3'); }
function tName(i,v){ const t=E.teams[i], auto=!t.id||t.id===autoId(t.name); t.name=v; if(auto) t.id=autoId(v); derivePlan(); save(); go('s3'); }
function autoId(n){ const s=slug(n); return s.split('-').map(x=>x[0]).join('').slice(0,4)||s.slice(0,4); }
function tDel(i){ E.teams.splice(i,1); derivePlan(); save(); go('s3'); }
function pasteTeams(){
  openPanel(`<div class="psec"><div class="psec-l">One team per line</div>
    <p style="font-size:11.5px;color:var(--muted);line-height:1.55;margin-bottom:12px">Optional extra columns separated by a tab, semicolon or comma:<br><code>Name ; Division ; FTE ; Lead</code></p>
    <textarea id="pt" rows="10" style="width:100%;font-family:var(--fb);font-size:12.5px;padding:10px;border:1px solid var(--divider);border-radius:9px;background:var(--surface-2);color:var(--text)" placeholder="Customer Service ; Indemnity &amp; Service ; 62 ; Marie Lefèvre&#10;Claims Handling ; Indemnity &amp; Service ; 48 ; Tom Peeters"></textarea></div>
    <div class="psec"><button class="fchip go" onclick="doPaste()">Add teams</button></div>`,'Paste a team list','Step 3 · Teams in scope');
}
function doPaste(){
  ($('#pt').value||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(line=>{
    const p=line.split(/\t|;|,/).map(s=>s.trim()); const name=p[0]; if(!name) return;
    E.teams.push({id:autoId(name),name,dept:'',division:p[1]||'',placements:[],fte:p[2]?(+p[2]||null):null,hc:null,
      lead:p[3]||'',email:'',priority:E.teams.length+1,inScope:true,depth:null,note:''});
  });
  E.teams=E.teams.filter(t=>t.name);
  closePanel(); derivePlan(); save(); go('s3'); toast('Teams added — check the ids are unique.');
}

/* ── step 4 · NR team ─────────────────────────────────────────────────── */
const initials=n=>(n||'?').trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
PAGES.s4=()=>{
  const taken=E.nrMembers.map(m=>m.name);
  const avail=NR_PEOPLE.filter(p=>!taken.includes(p.name));
  return lead('Who is on this engagement, and what each of them brings. Skills come from the roster and are editable per engagement — they are what you scan when you decide who takes which team.')+
  `<div class="setup-grid top">
    <div>
      <div class="ch" style="margin-bottom:11px"><span class="ct">On this engagement · ${E.nrMembers.length}</span></div>
      ${E.nrMembers.length?E.nrMembers.map((m,i)=>`<div class="mcard">
        <div class="mrow">
          <span class="mava">${esc(initials(m.name))}</span>
          <input class="tinp" list="dl-people" value="${esc(m.name)}" placeholder="Name" oninput="mSet(${i},'name',this.value)">
          <select class="tinp" onchange="mSet(${i},'role',this.value);go('s4')">
            ${NR_ROLES.map(r=>`<option value="${r}" ${m.role===r?'selected':''}>${r}</option>`).join('')}
            ${m.role&&!NR_ROLES.includes(m.role)?`<option value="${esc(m.role)}" selected>${esc(m.role)}</option>`:''}
          </select>
          <button class="xb" onclick="mDel(${i})" title="Remove">&times;</button>
        </div>
        <div class="skills" style="padding-left:43px">
          ${(m.skills||[]).map(s=>`<span class="skp">${esc(s)}</span>`).join('')}
          <span class="skp add" onclick="pickSkills(${i})">${(m.skills||[]).length?'edit skills':'+ add skills'}</span>
        </div>
      </div>`).join(''):`<div class="card"><p style="font-size:12.5px;color:var(--muted-2);line-height:1.6">No one on the engagement yet. Add from the roster on the right — the export works either way.</p></div>`}
      <datalist id="dl-people">${NR_PEOPLE.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>
    </div>
    <div class="card">
      <div class="ch"><span class="ct">NR roster</span><button class="fchip" onclick="mAdd()">+ Blank</button></div>
      ${avail.length?avail.map(p=>`<div class="mrow" style="grid-template-columns:34px 1fr auto;cursor:pointer" onclick="mAddFrom('${esc(p.name)}')">
        <span class="mava" style="background:var(--surface-2);color:var(--muted)">${esc(initials(p.name))}</span>
        <span><b style="font-size:12.5px;font-family:var(--fh)">${esc(p.name)}</b>
          <span style="display:block;font-size:10.5px;color:var(--muted-2)">${esc(p.role)}</span></span>
        <span class="fchip" style="pointer-events:none">Add</span></div>`).join('')
        :`<p style="font-size:12px;color:var(--muted-2);line-height:1.6">Everyone on the roster is on this engagement.</p>`}
      <span class="hint" style="margin-top:12px">The roster lives at the top of this file. Set each person's default skills there once and every engagement inherits them.</span>
    </div>
  </div>`;
};
function mAdd(){ E.nrMembers.push({id:'m'+(Date.now()%100000),name:'',role:'Consultant',skills:[]}); save(); go('s4'); }
function mAddFrom(name){
  const p=NR_PEOPLE.find(x=>x.name===name); if(!p) return;
  E.nrMembers.push({id:'m'+(Date.now()%100000),name:p.name,role:p.role,skills:(p.skills||[]).slice()});
  save(); go('s4');
}
function mSet(i,k,v){ E.nrMembers[i][k]=v; save(); }
function mDel(i){ const id=E.nrMembers[i].id; E.nrMembers.splice(i,1);
  Object.keys(E.teamAssign).forEach(t=>{ if(E.teamAssign[t]===id) delete E.teamAssign[t]; }); save(); go('s4'); }
function pickSkills(i){
  const m=E.nrMembers[i], cur=m.skills||[];
  openPanel(`<div class="psec"><div class="psec-l">Key skills — tick what this person brings</div>
    <div class="skills" style="gap:7px">${NR_SKILLS.map(s=>
      `<span class="skp pick ${cur.includes(s)?'on':''}" onclick="togSkill(${i},'${esc(s)}')">${esc(s)}</span>`).join('')}</div></div>
    <div class="psec"><div class="psec-l">Add your own</div>
      <div style="display:flex;gap:8px">
        <input id="sk-new" class="tinp" placeholder="e.g. Banking expertise" onkeydown="if(event.key==='Enter')addSkill(${i})">
        <button class="fchip go" onclick="addSkill(${i})">Add</button></div></div>`,
    m.name||'Consultant', 'Key skills');
}
function togSkill(i,s){
  const m=E.nrMembers[i]; m.skills=m.skills||[];
  const x=m.skills.indexOf(s); x<0?m.skills.push(s):m.skills.splice(x,1);
  save(); pickSkills(i); go('s4');
}
function addSkill(i){
  const v=($('#sk-new').value||'').trim(); if(!v) return;
  const m=E.nrMembers[i]; m.skills=m.skills||[];
  if(!m.skills.includes(v)) m.skills.push(v);
  if(!NR_SKILLS.includes(v)) NR_SKILLS.push(v);
  save(); pickSkills(i); go('s4');
}
function assign(t,m){ if(m) E.teamAssign[t]=m; else delete E.teamAssign[t]; save(); }

/* ── the depth matrix (shared by step 5 and the live plan page) ───────── */
function matrixHTML(editable){
  const teams=inScopeTeams();
  if(!teams.length) return `<div class="card"><p style="font-size:12.5px;color:var(--muted)">No teams in scope yet — the plan is derived from them.</p></div>`;
  const setOpts=`<option value="">Set…</option>`+DEPTH.map((d,i)=>`<option value="${i}">${d.label}</option>`).join('');
  const colHead=M.dims.map(d=>`<th><div style="color:${d.col}">${esc(d.short)}</div>${
    editable?`<select class="cfg-set" onchange="if(this.value!=='')setColDepth('${d.k}',+this.value);this.value='';">${setOpts}</select>`:''}</th>`).join('');
  const divs=[...new Set(teams.map(t=>t.division).filter(Boolean))];
  const row=t=>`<tr>
    <td class="cfg-team">${esc(t.name)}<small>${esc(t.dept||t.division||'—')} · ${t.fte==null?'FTE not set':t.fte+' FTE'}</small></td>
    ${editable?`<td style="width:92px"><select class="cfg-set" onchange="if(this.value!=='')setRowDepth('${t.id}',+this.value);this.value='';">${setOpts}</select></td>`:''}
    ${M.dims.map(d=>{
      const e=effInstruments(t.id,d.k), D=DEPTH[depthOf(e,d.k)], N=(M.offers[d.k]||[]).length;
      return `<td><button class="cfg-cell" style="background:${D.bg};color:${D.fg};${editable?'':'cursor:default'}"
        ${editable?`onclick="openCell('${t.id}','${d.k}')"`:''}>${D.label}<small>${e.length}/${N}</small>${
        isOverridden(t.id,d.k)?'<span class="cfg-ov"></span>':''}</button></td>`;
    }).join('')}</tr>`;
  let body='';
  if(divs.length){
    divs.forEach(dv=>{ body+=`<tr class="divrow"><td colspan="${(editable?2:1)+6}">${esc(dv)}</td></tr>`;
      teams.filter(t=>t.division===dv).forEach(t=>body+=row(t)); });
    const rest=teams.filter(t=>!t.division);
    if(rest.length){ body+=`<tr class="divrow"><td colspan="${(editable?2:1)+6}">Unassigned</td></tr>`; rest.forEach(t=>body+=row(t)); }
  } else teams.forEach(t=>body+=row(t));
  const s=cellStats();
  return `<div class="cfg-bar">
      <div class="cfg-legend">
        ${DEPTH.map(d=>`<span class="cfg-leg"><i style="background:${d.bg}"></i>${d.label}</span>`).join('')}
        <span class="cfg-leg"><i style="background:var(--navy);border-radius:50%;width:8px;height:8px;border:none"></i>changed by hand</span>
      </div>
      ${editable?`<div style="margin-left:auto;display:flex;gap:8px">
        ${s.ov?`<button class="fchip" onclick="clearOverrides()">Clear ${s.ov} override${s.ov===1?'':'s'}</button>`:''}
        <button class="fchip" onclick="resetDefault()">Reset to engagement default</button></div>`:''}
    </div>
    <div class="cfg-wrap"><table class="cfg-tbl">
      <thead><tr><th class="cfg-team">Team</th>${editable?'<th></th>':''}${colHead}</tr></thead>
      <tbody>${body}</tbody></table></div>`;
}
function resetDefault(){ E.methodology.overrides={}; E._planTouched=false; derivePlan(); save(); go(PAGE); }
function openCell(tid,lens){
  const t=E.teams.find(x=>x.id===tid); if(!t) return;
  const d=dimOf(lens), off=M.offers[lens]||[], eff=effInstruments(tid,lens);
  const def=approachInstruments(lens,teamDepth(t)), lvl=depthOf(eff,lens);
  const quick=DEPTH.map((D,i)=>`<button class="fchip ${lvl===i?'active':''}" onclick="setCellDepth('${tid}','${lens}',${i});openCell('${tid}','${lens}');go(PAGE)">${D.label}</button>`).join('');
  const rows=off.map(ik=>{ const ins=M.inst[ik]||{}, on=eff.includes(ik), inDef=def.includes(ik);
    return `<div class="ce-row ${on?'on':''}" onclick="togInstrumentPanel('${tid}','${lens}','${ik}')">
      <span class="ce-ck">${on?'&#10003;':''}</span>
      <span class="ce-main"><b>${esc(ins.label||ik)}</b>
      <span class="ce-meta">${ins.scoreSource?'Sets the score':'Evidence'}${inDef?' · in the default':''} · ${stat(ins.status)}</span></span></div>`;
  }).join('');
  openPanel(`<div class="psec"><div class="psec-l">How deep do we go here?</div><div style="display:flex;gap:6px;flex-wrap:wrap">${quick}</div></div>
    <div class="psec"><div class="psec-l">Or tick exactly what runs</div>${rows}</div>
    <div class="psec">${isOverridden(tid,lens)
      ? `<button class="fchip" onclick="setOverride('${tid}','${lens}',null);openCell('${tid}','${lens}');go(PAGE)">&#8634; Back to what this team does by default (${DEPTH[depthOf(def,lens)].label})</button>`
      : `<span class="badge-soft">Following the team default · ${DEPTH[depthOf(def,lens)].label}</span>`}</div>`,
    d.label+' — '+t.name, (M.approaches[teamDepth(t)]||{}).label||'');
}
/* plain toggle — used by the lens board, must never open the side panel */
function togInstrument(tid,lens,ik){
  const cur=effInstruments(tid,lens).slice(), i=cur.indexOf(ik);
  if(i>=0) cur.splice(i,1); else cur.push(ik);
  setOverride(tid,lens,(M.offers[lens]||[]).filter(x=>cur.includes(x)));
  go(PAGE);
}
/* same toggle, but keeps the cell-editor panel in sync (live matrix only) */
function togInstrumentPanel(tid,lens,ik){ togInstrument(tid,lens,ik); openCell(tid,lens); }

/* ── step 5 · analysis plan ─────────────────────────────────────────────────
   Two levels, in the order you decide them:
   1. Engagement-wide — baselining and the team-wide registers, once for everyone.
   2. Per team — the six lenses, each showing the analyses it offers.
   ───────────────────────────────────────────────────────────────────────────── */
function togSet(key,i){
  E._planTouched=true;
  const a=E.plan[key]=E.plan[key]||[], x=a.indexOf(i);
  x<0?a.push(i):a.splice(x,1);
  derivePlan(); save(); go(PAGE);
}
function analysisRow(i,on,onclick){
  const x=M.inst[i]||{};
  return `<div class="arow ${on?'on':'off'}" onclick="${onclick}">
    <span class="ck">${on?'&#10003;':''}</span>
    <span><span class="an">${esc(x.label||i)}${x.scoreSource?'<span class="sc" title="This is the analysis that produces the dimension score — the others are evidence behind it.">score</span>':''}</span>
      <span class="am">${stat(x.status,'padding:0 5px')}</span></span></div>`;
}
function engSet(title,key,list,note){
  const p=E.plan, n=(p[key]||[]).length;
  return `<div class="card">
    <div class="ch" style="margin-bottom:7px"><span class="ct">${title}</span><span class="badge-soft">${n} of ${list.length}</span></div>
    <p class="lead-in">${note}</p>
    <div class="elist">${list.map(i=>analysisRow(i,(p[key]||[]).includes(i),`togSet('${key}','${i}')`)).join('')}</div></div>`;
}
/* Accordion state. `null` means "not initialised yet" — an explicitly emptied Set must
   NOT be re-seeded, which is what made a team impossible to collapse. */
var OPEN_TEAMS=null;
var RAW_OPEN=false;
function toggleRaw(){ RAW_OPEN=!RAW_OPEN; go(PAGE); }
function openSet(teams){
  if(OPEN_TEAMS===null) OPEN_TEAMS=new Set(teams.length?[teams[0].id]:[]);
  return OPEN_TEAMS;
}
function toggleTeam(id){ OPEN_TEAMS.has(id)?OPEN_TEAMS.delete(id):OPEN_TEAMS.add(id); go('s5'); }
function expandTeams(all){ OPEN_TEAMS = all ? new Set(inScopeTeams().map(t=>t.id)) : new Set(); go('s5'); }
/* The lens board is a real matrix: one row per lens, one column per analysis slot.
   Rows are uniform height and empty slots stay empty, so nothing stretches and no card
   carries dead space just because its neighbour offers more analyses. */
const MX_SLOTS = Math.max(...DIMK.map(k=>(M.offers[k]||[]).length), 3);
function mxCell(i,on,onclick){
  const x=M.inst[i]||{};
  return `<button class="lmx-cell ${on?'on':'off'}" onclick="${onclick}">
    <span class="ck">${on?'&#10003;':''}</span>
    <span class="lmx-t">${esc(x.label||i)}${x.scoreSource?'<span class="sc" title="This is the analysis that produces the dimension score — the others are evidence behind it.">score</span>':''}
      <small>${stat(x.status,'padding:0 5px')}</small></span>
  </button>`;
}
function mxRow(labelCell,cells){
  const pad=MX_SLOTS-cells.length;
  return labelCell + cells.join('') + '<span class="lmx-void"></span>'.repeat(pad<0?0:pad);
}
function aiRow(t){
  const list=((E.plan.perTeam||{})[t.id]||{}).ai||[];
  if(!list.length) return '';
  const label=`<div class="lmx-lens ai"><span class="lmx-dot" style="background:var(--green-soft)"></span>
    <span class="lmx-nm">Redesign<small class="lmx-d">On</small></span></div>`;
  const cells=list.map(k=>{const x=M.aiWork[k];
    return `<span class="lmx-cell on" style="cursor:default">
      <span class="ck">&#10003;</span>
      <span class="lmx-t">${esc(x.label)}<small>${stat('live','padding:0 5px')}</small></span>
    </span>`;});
  return mxRow(label,cells);
}
function teamLensBoard(t){
  const pt=(E.plan.perTeam||{})[t.id]||{lenses:{}};
  const n=Object.values(pt.lenses||{}).reduce((a,l)=>a+l.length,0);
  const nAi=(pt.ai||[]).length;
  const open=OPEN_TEAMS.has(t.id);
  /* collapsed rows stay readable: one swatch per lens, coloured by its depth */
  const strip=M.dims.map(d=>{
    const D=DEPTH[depthOf(pt.lenses[d.k]||[],d.k)];
    return `<i title="${esc(d.label)} · ${D.label}" style="background:${D.bg}"></i>`;
  }).join('');
  const rows=M.dims.map(d=>{
    const eff=effInstruments(t.id,d.k), D=DEPTH[depthOf(eff,d.k)];
    /* short lens names on purpose: they keep every row one line high, so the matrix
       stays rectangular — and they are the same labels the live matrix header uses. */
    const label=`<div class="lmx-lens" title="${esc(d.label)}"><span class="lmx-dot" style="background:${d.col}"></span>
      <span class="lmx-nm">${esc(d.short)}
        <small class="lmx-d" style="background:${D.bg};color:${D.fg}">${D.label}</small></span></div>`;
    const cells=(M.offers[d.k]||[]).map(i=>mxCell(i,eff.includes(i),`togInstrument('${t.id}','${d.k}','${i}')`));
    return mxRow(label,cells);
  }).join('');
  return `<div class="acc ${open?'open':''}">
    <button class="acc-h" onclick="toggleTeam('${t.id}')" aria-expanded="${open}">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      <span class="acc-nm">${esc(t.name)}<small>${esc(t.division||t.dept||'—')} · ${t.fte==null?'FTE not set':t.fte+' FTE'} · ${esc((M.approaches[teamDepth(t)]||{}).label)}</small></span>
      <span class="acc-sp"></span>
      <span class="acc-strip">${strip}</span>
      ${nAi?`<span class="acc-cnt ai" title="Design work on top of the diagnostic">+${nAi} redesign</span>`:''}
      <span class="acc-cnt">${n}</span>
    </button>
    <div class="acc-b"><div class="lensmx" style="--mx:${MX_SLOTS}">${aiRow(t)}${rows}</div></div>
  </div>`;
}
PAGES.s5=()=>{
  const s=cellStats(), teams=inScopeTeams();
  openSet(teams);
  const nOpen=teams.filter(t=>OPEN_TEAMS.has(t.id)).length;
  return lead(`Which analyses we run, for whom. ${planCount()} in total across ${teams.length} team${teams.length===1?'':'s'}; ${s.deep} of the ${s.cells} squares get everything on offer${s.off?`, ${s.off} nothing at all`:''}.`)+
  `<div class="dd-section"><span class="eyebrow">For every team</span>
    <div class="setup-grid">
      ${engSet('Getting the facts straight','baseline',['org-baseline','mae','ote-waterfall'],
        'Who the team is and what it spends its time on. Run these first — every later analysis leans on them.')}
      ${engSet('Collecting the findings','registers',['inefficiency-register','opportunity-register'],
        'The two running lists you build up as you go: what hurts, and what you would do about it.')}
    </div>
  </div>

  ${teams.length?`<div class="dd-section">${sec('Every team at a glance',
      `<button class="fchip" onclick="resetDefault()">Reset to engagement default</button>`)}
    <p class="lead-in" style="margin:0 0 12px">Click a square to change what runs there, or use a <b>Set…</b> dropdown to
      change a whole team or a whole dimension in one go. Open a team below to tick the individual analyses.</p>
    ${matrixHTML(true)}</div>`:''}

  <div class="dd-section">
    <div class="sec-h"><span class="eyebrow">Per team, per dimension</span>
      ${teams.length>1?`<div class="sec-a">
        <button class="fchip" onclick="expandTeams(true)" ${nOpen===teams.length?'disabled':''}>Expand all</button>
        <button class="fchip" onclick="expandTeams(false)" ${nOpen===0?'disabled':''}>Collapse all</button>
      </div>`:''}
    </div>
    <p class="lead-in" style="margin-top:-2px">Open a team to tick exactly what runs on each of the six dimensions. The badge on the left of every row is how much of that dimension we cover: <b>Deep</b> is everything on offer, <b>Diagnostic</b> the scored analyses, <b>Light</b> the maturity scan alone, <b>Off</b> nothing — and that dimension then carries no score.</p>
    ${teams.length?teams.map(teamLensBoard).join('')
      :`<div class="card"><p class="empty">No teams in scope yet — add them in step 3 and they appear here.</p></div>`}
  </div>`;
};

/* ── step 6 · review & export ─────────────────────────────────────────── */

      ${row('Team',E.nrMembers.length?E.nrMembers.length+' consultant'+(E.nrMembers.length===1?'':'s'):'—')}
      ${row('Facts first',(E.plan.baseline||[]).length+' of 3')}
      ${row('Running lists',(E.plan.registers||[]).length+' of 2')}

      <div class="ch"><span class="ct" style="color:${hard.length?'var(--s2-t)':'var(--s4-t)'}">${hard.length?'Worth fixing first':'Nothing missing'}</span>
        ${soft.length?`<span class="badge-soft">${soft.length} flagged</span>`:''}</div>
      ${hard.length?`<ul class="blist">${hard.map(i=>`<li>${esc(i.s)}</li>`).join('')}</ul>`
        :`<p style="font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:${soft.length?'12px':'0'}">Everything a setup needs is here. Claude will still push back on the scope — that is what the handover is for.</p>`}
      ${soft.length?`<ul class="blist mut" style="margin-top:${hard.length?'12px':'0'};padding-top:${hard.length?'12px':'0'};border-top:${hard.length?'1px solid var(--divider)':'none'}">${soft.map(i=>`<li>${esc(i.s)}</li>`).join('')}</ul>`:''}
    </div>
  </div>

  <div class="setup-grid" style="margin-bottom:16px">
    <div class="card"><div class="ch"><span class="ct">Things you could not answer yet</span>
      <span class="badge-soft">${(E.handoff.questions||[]).filter(Boolean).length}</span></div>
      ${bullets('handoff.questions','Is Claims Support one team or two?')}
      <span class="hint" style="margin-top:auto;padding-top:10px">Claude picks these up first, before it sets anything up.</span></div>
    <div class="card"><div class="ch"><span class="ct">Things you are assuming</span>
      <span class="badge-soft">${(E.handoff.assumptions||[]).filter(Boolean).length}</span></div>
      ${bullets('handoff.assumptions','The FTE numbers are my estimate, not HR data')}
      <span class="hint" style="margin-top:auto;padding-top:10px">So whoever reads this in six weeks knows what was a guess.</span></div>
  </div>

  <div class="dd-section"><span class="eyebrow">Hand it over</span>
    <div class="card">
      <p class="lead-in">Press the green button. It copies your setup <i>and</i> the instructions for what to do with it — paste the lot into Claude in this project and it takes over from there: it challenges what is thin, sets the engagement up, and comes back with a proposed order of work before running anything.</p>
      <div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">
        <button class="fchip go" onclick="copy(PROMPT()+JSON.stringify(buildExport(),null,2),'Copied — paste it into Claude')">Copy everything for Claude</button>
        <span style="font-size:11.5px;color:var(--muted-2)">or</span>
        <button class="fchip" onclick="download()">Save the setup file</button>
        <button class="fchip" onclick="toggleRaw()">${RAW_OPEN?'Hide':'Show'} the file</button>
      </div>
      ${RAW_OPEN?`<div class="pre" style="margin-top:14px">${esc(JSON.stringify(o,null,2))}</div>`:''}
    </div>
  </div>`;
};

/* ── live · overview ──────────────────────────────────────────────────── */
const kpi=(eyebrow,val,sub,icon)=>`<div class="kpi-box"><div>
  <div class="kpi-eyebrow">${eyebrow}</div><div class="kpi-v">${val}</div><div class="kpi-sub">${sub}</div></div>
  <div class="kpi-icon">${ico(icon)}</div></div>`;

/* ONE overview, not two. It used to be split into "Engagement overview" and
   "Scope & approach", which repeated the statement, the objectives and the depth on
   both pages. Everything a case lead needs to answer "what did we agree, and what are
   we doing about it" now lives here, in that order. */
PAGES.overview=()=>{
  const teams=inScopeTeams(), s=cellStats(), sc=E.scope||{}, a=E.assignment;
  const divs=[...new Set(teams.map(t=>t.division).filter(Boolean))].length;
  const chain=VCS();
  const list=(t,arr,mut,empty)=>`<div class="card"><div class="ch"><span class="ct">${t}</span>
      ${(arr||[]).filter(Boolean).length?`<span class="badge-soft">${arr.filter(Boolean).length}</span>`:''}</div>
    ${(arr||[]).filter(Boolean).length?`<ul class="blist ${mut?'mut':''}">${arr.filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`

    <span style="font-weight:500">${esc(v)}${hint?`<span style="color:var(--muted);font-weight:400"> · ${esc(hint)}</span>`:''}</span></div>`;

    <div class="kpi-grp"><div class="kpi-grp-label">What we are looking at</div><div class="kpi-boxes">

      ${kpi('FTE in scope',scopeFte()||'—',scopeFte()?'your estimate for now':'set by the org baseline','grid')}
    </div></div>
    <div class="kpi-grp pot"><div class="kpi-grp-label">What we will do about it</div><div class="kpi-boxes">
      ${kpi('Analyses to run',planCount(),'counting each team separately','layers')}
      ${kpi('Covered in full',s.deep+'<span style="font-size:15px;font-weight:700;color:var(--muted)">/'+s.cells+'</span>','dimensions, six per team','target')}
      ${kpi('Ready to run',liveCount(),'have a guided version today','bolt')}

  </div>

  <div style="display:grid;grid-template-columns:1.35fr 1fr;gap:18px;margin-bottom:22px" class="ovsplit">
    <div>
      <span class="eyebrow" style="display:block;margin-bottom:9px">What we promised</span>
      <div class="card" style="height:calc(100% - 26px)">
        ${sc.statement?`<p style="font-size:14px;line-height:1.65;font-family:var(--fh);font-weight:500">${esc(sc.statement)}</p>`
          :`<p style="font-size:12.5px;color:var(--muted-2)">No scope statement yet — add one in the configurator.</p>`}
        ${sc.entity?`<p style="font-size:11.5px;color:var(--muted);margin-top:12px">Perimeter &middot; ${esc(sc.entity)}</p>`:''}
        ${(sc.objectives||[]).filter(Boolean).length?`<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--divider)">
          <div class="ct" style="margin-bottom:8px">What the client gets out of it</div>
          <ul class="blist">${sc.objectives.filter(Boolean).map(o=>`<li>${esc(o)}</li>`).join('')}</ul></div>`:''}
        ${chain.length?`<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--divider)">
          <div class="ct" style="margin-bottom:9px">The value chain we tell it along</div>
          <div class="vcflow">${chain.map((x,i)=>`<span class="vcf${i===0?' first':''}">${esc(x)}</span>`).join('')}</div></div>`:''}

    <div class="g3">
      ${list('Out of scope',sc.outOfScope,1,'Nothing written down. Anything not excluded here can be asked for later.')}

      <span><b>Questions from setup that nobody has answered yet.</b><ul class="blist" style="margin-top:7px">${E.handoff.questions.filter(Boolean).map(q=>`<li>${esc(q)}</li>`).join('')}</ul></span></div>
