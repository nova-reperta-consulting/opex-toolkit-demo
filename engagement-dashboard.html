PAGES.run=()=>{
  const teams=inScopeTeams(), name=id=>(teams.find(t=>t.id===id)||{}).name||id;
  /* naming all five teams on all fourteen cards is noise — say "every team" when it is */
  const teamList=l=> l.length>=teams.length&&teams.length>1
    ? `All ${teams.length} teams`
    : `${l.length} team${l.length>1?'s':''} \u00b7 ${l.map(t=>esc(name(t))).join(', ')}`;
  const L=planLedger(), map=L.map, done=L.done;
  const progress=(i,list)=>{
    const n=list?list.length:1;
    const d=done[i] ? (list?list.filter(t=>done[i].has(t)).length:done[i].size) : 0;
    return {n, d, pct:n?Math.round(d/n*100):0, all:n>0&&d>=n};
  };
  const progBar=pr=>`<span class="run-prog ${pr.all?'all':pr.d?'some':'none'}">
      ${pr.all?'All done':pr.d?`${pr.d} of ${pr.n} done`:'Not started'}</span>
    <span class="run-track"><i style="width:${pr.pct}%"></i></span>`;
  const order=['org-baseline','mae','ote-waterfall','lma','process-map','performance-wheel','skills-wheel',
    'team-barometer','data-maturity','wilo-analysis','nps-analysis','kano-analysis','inefficiency-register','opportunity-register'];
  const rank=i=>{const x=order.indexOf(i);return x<0?99:x;};
  const card=(i,list)=>{
    const x=M.inst[i], pr=progress(i,list);
    /* point the trigger at a team that still needs it, not one that is already done */
    const todo=list?list.filter(t=>!(done[i]&&done[i].has(t))):null;
    const first=(todo&&todo[0])||(list&&list[0]);
    const trig=x.trig.replace('{team}',first?name(first):'the team');
    return `<div class="run${pr.all?' is-done':''}">
      <div class="run-h"><b>${esc(x.label)}</b>
        ${stat(x.status)}${pr.all?'<span class="run-tick">\u2713</span>':''}</div>
      ${x.note?`<div class="run-d">${esc(x.note)}</div>`:''}
      <div class="run-teams">${list?teamList(list):'Across the engagement'}${progBar(pr)}</div>
      ${x.status==='envisioned'
        ? `<div class="trig na"><span>No guided version yet — run this one the usual way, or ask Claude to build it first.</span></div>`
        : `<div class="trig"><code>${esc(trig)}</code>
            <button class="fchip" onclick="copy(${JSON.stringify(trig).replace(/"/g,'&quot;')},'Trigger copied')">Copy</button></div>`}
    </div>`;
  };
  return `<div class="dd-section"><span class="eyebrow">In the order to run them</span>
    <p class="lead-in" style="margin:0 0 14px"><b>${L.run} of ${L.plan} done so far.</b> Say the sentence to Claude and it takes it from there — it prepares the session, walks the interview with you, and writes up the result.
      Start at the top: the first three establish who the team is and what it does, and everything below leans on them.
      Each sentence names one team, so say it once per team, swapping the name.</p>
    ${Object.keys(map).sort((a,b)=>rank(a)-rank(b)).map(i=>card(i,[...map[i]])).join('')||'<div class="card"><p style="font-size:12.5px;color:var(--muted)">Nothing planned yet.</p></div>'}</div>
  ${(()=>{
    const aiMap={};
    Object.entries(E.plan.perTeam||{}).forEach(([tid,pt])=>(pt.ai||[]).forEach(k=>{(aiMap[k]=aiMap[k]||new Set()).add(tid);}));
    const keys=Object.keys(aiMap); if(!keys.length) return '';
    return `<div class="dd-section"><span class="eyebrow">Redesign · once the diagnosis lands</span>
      <p class="lead-in" style="margin-top:-2px">Only for teams you set to Redesign. These design what the work should look like afterwards, so they need the diagnosis finished first.</p>
      ${keys.map(k=>{const x=M.aiWork[k], list=[...aiMap[k]], trig=x.trig.replace('{team}',name(list[0]));
        const pr=progress(k,list);
        return `<div class="run${pr.all?' is-done':''}">
          <div class="run-h"><b>${esc(x.label)}</b>${stat('live')}${pr.all?'<span class="run-tick">\u2713</span>':''}</div>
          <div class="run-d">${esc(x.note)}</div>
          <div class="run-teams">${teamList(list)}${progBar(pr)}</div>
          <div class="trig"><code>${esc(trig)}</code>
            <button class="fchip" onclick="copy(${JSON.stringify(trig).replace(/"/g,'&quot;')},'Trigger copied')">Copy</button></div>
        </div>`;}).join('')}</div>`;
  })()}
  ${(E.plan.crossCutting||[]).length?`<div class="dd-section"><span class="eyebrow">Across the whole engagement</span>
    <p class="lead-in" style="margin-top:-2px">Not tied to one team. Use the advisor as a second pair of eyes before anything reaches the client.</p>
    ${E.plan.crossCutting.map(i=>card(i,null)).join('')}</div>`:''}
  <div class="dd-section"><span class="eyebrow">If you are not sure what to do next</span>
    <div class="run"><div class="run-h"><b>Just ask</b>${stat('live')}</div>
      <div class="run-d">Claude looks at what has been captured, what is still open and what is out of scope, and tells you what the next sensible move is. It suggests — you decide.</div>
      <div class="trig"><code>what is next on this engagement</code>
        <button class="fchip" onclick="copy('what is next on this engagement','Trigger copied')">Copy</button></div></div>
  </div>`;
};

    <tr><td class="tnm">Teams &amp; analyses</td><td>One row per team. Open one for its whole story: what runs on each of the six dimensions, whether each analysis can run today, what came back, and the opportunities that followed.</td></tr>
    <tr><td class="tnm">Which analyses run</td><td>Every team against every dimension, and how deep each square goes. The one place to compare the plan across all teams at once.</td></tr>
    <tr><td class="tnm">Run an analysis</td><td>What do I say to Claude to start one? The exact sentence, per analysis.</td></tr>
    <tr><td class="tnm">Value assumptions</td><td>What one FTE costs, how much of the saving we expect to land, what it costs to get there — and how the six dimensions weigh in a team's overall score.</td></tr>
    <tr><td class="tnm">Hand over</td><td>Sending the engagement to Claude, or saving the file to share it.</td></tr>
    </tbody></table></div>
    <p class="lead-in" style="margin:11px 0 0">The four findings pages stay empty until analyses land, and say so — they never show a number nobody has measured.</p></div>
</div>

<div class="dd-section"><span class="eyebrow">The words you will keep seeing</span>
  <div class="card"><div class="tbl-wrap"><table class="tbl">
    <thead><tr><th style="width:180px">Word</th><th>What it means here</th></tr></thead><tbody>
    <tr><td class="tnm">Dimension</td><td>One of the six angles we assess every team from: process, customer, management, data, mindset, organisation.</td></tr>
    <tr><td class="tnm">Analysis</td><td>One concrete piece of work on one dimension — a maturity scan, a process map, a survey. Each has a guided version you trigger by talking to Claude.</td></tr>
    <tr><td class="tnm">Depth</td><td>How hard the whole engagement runs: <b>Quickscan</b>, <b>Diagnostic</b> or <b>Redesign</b>. Set once for the assignment, overridable per team — different words from coverage on purpose, because the two are not the same setting.</td></tr>
    <tr><td class="tnm">Coverage</td><td>How much of <i>one</i> dimension you do for <i>one</i> team — the six blocks on each team row, and each square in the configurator's plan. Three levels, below. Not the same thing as depth: depth is set once for the whole assignment, coverage is what one team actually gets on one dimension.</td></tr>
    <tr><td class="tnm">Maturity scan</td><td>The one analysis that produces the score for a dimension. Everything else is evidence that makes that score hold up.</td></tr>
    <tr><td class="tnm">FTE</td><td>Full-time equivalents. Your estimate at setup; the org structure analysis replaces it with the real number.</td></tr>
    </tbody></table></div></div>
</div>

<div class="dd-section"><span class="eyebrow">How deep a single dimension goes</span>
  <div class="card"><div class="tbl-wrap"><table class="tbl">
    <thead><tr><th style="width:130px">Coverage</th><th>What you actually do</th></tr></thead><tbody>
    ${DEPTH.map((d,i)=>`<tr><td><span class="cfg-cell" style="display:inline-block;width:auto;min-width:78px;background:${d.bg};color:${d.fg};text-align:center">${d.label}</span></td>
      <td>${['Skip this dimension for this team. It will carry no score.',
            'The maturity scan on its own — a quick read, lower confidence. Nothing else runs.',
            'The maturity scan plus whatever else you tick on that dimension — the process map, the wheels, the registers. Covering a dimension in full does not oblige you to run everything on offer; you choose.'][i]||''}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="lead-in" style="margin:11px 0 0">Coverage is never set directly — it follows from the analyses you tick, either in step 5 of the configurator or from the gear on a team. Tick anything beyond the maturity scan and it reads as Full; tick nothing and it reads as Not assessed.</p></div>
</div>

<div class="dd-section"><span class="eyebrow">Can I run it today?</span>

</div>

<div class="dd-section"><span class="eyebrow">Where your answers end up</span>

</div>`;

<script>
window.QS=(function(){
'use strict';
/* ===================== DATA ===================== */
/* Each data const below reads from window.__QS_DATA__ (the JSON, via qs-data.js)
   when present, and otherwise falls back to its baked literal. */
const DIMS = window.__QS_DATA__?.model?.dimensions || [
  { key:'proc', label:'Processes',        icon:'P', color:'#2A4D8F',
    subs:['Process clarity & standardisation','Value-adding ratio','E2E handoff quality','Volume & demand variability','Exception & error rate'] },
  { key:'cust', label:'Customer',         icon:'C', color:'#C0392B',
    subs:['Understanding of customer (segments) & expectations','Client satisfaction & quality of customer touchpoints','Demand understanding','Customer centricity in decisions'] },
  { key:'mgmt', label:'Management systems',icon:'M', color:'#145530',
    subs:['KPI relevance & alignment','Performance management routines','Capacity & workload management','Decision rights & accountability','Continuous improvement structure'] },
  { key:'data', label:'Data, digital & AI', icon:'D', color:'#B8620A',
    subs:['Data availability & completeness','Data quality & consistency','System integration maturity','Tooling fit','Analytics & reporting maturity'] },
  { key:'mind', label:'Mindset & behaviors', icon:'Mi', color:'#6B4E9E',
    subs:['Change openness','AI & digital appetite','Empowerment & initiative','Leadership modeling','Learning culture'] },
  { key:'org',  label:'Organisation',     icon:'O', color:'#2A8C82',
    subs:['Structural fit','E2E ownership','Spans & layers','Role clarity & specialisation','Capacity & skills mix'] },
];
const DIM_SHORT = window.__QS_DATA__?.model?.dimShort || { proc:'Process', cust:'Customer', mgmt:'Mgmt sys', data:'Data', mind:'Mindset', org:'Org' };
const DIM_RADAR = window.__QS_DATA__?.model?.dimRadar || { proc:'Processes', cust:'Customer', mgmt:['Management','systems'], data:['Data, digital','& AI'], mind:['Mindset &','behaviors'], org:'Organisation' };

const LEVERS = window.__QS_DATA__?.model?.levers || {
  process:{ label:'Process redesign',     bg:'#E8EDF5', t:'#2A4D8F', dot:'#2A4D8F', kind:'single' },
  journey:{ label:'Journey redesign',     bg:'#FBE9E8', t:'#C0392B', dot:'#C0392B', kind:'single' },
  lean:   { label:'Lean management',      bg:'#DCEDE3', t:'#145530', dot:'#145530', kind:'single' },
  data:   { label:'Data & tech foundation',bg:'#FCEFD9', t:'#B8620A', dot:'#B8620A', kind:'single' },
  change: { label:'Change program',       bg:'#EFE9F7', t:'#6B4E9E', dot:'#6B4E9E', kind:'single' },
  org:    { label:'Org redesign',         bg:'#DAF0ED', t:'#1F6F66', dot:'#2A8C82', kind:'single' },
  auto:   { label:'Automation',           bg:'#E8F0FB', t:'#3B6FBF', dot:'#5B8ACB', kind:'combo' },
  aiacc:  { label:'AI acceleration',      bg:'#E3F0EA', t:'#1D7044', dot:'#1D7044', kind:'combo' },
  aienh:  { label:'AI enhancement',       bg:'#CDE8D8', t:'#0C5132', dot:'#006843', kind:'combo', star:true },
};

// readiness: 'act' | 'fix' | 'deprio' ; potential 0-100 ; readinessScore 0-100
const TEAMS = (window.__QS_DATA__ && window.__QS_DATA__.teams) || [];

const ENGAGEMENT = window.__QS_DATA__?.engagement?.engagement || {
  client:'Northwind Assurance', lead:'Nova Reperta — engagement team (illustrative)',
  start:'5 May 2026', target:'30 June 2026',
  scope:'Inside-out quickscan across 16 operational teams (468 FTE) in the Belgian P&C entity, covering both lean maturity and AI readiness.',
  notes:'Client strategic priority: AI readiness. ExCom decision on 2027 transformation budget expected early July.',
};

/* ===================== HELPERS ===================== */
const $ = s => document.querySelector(s);
const overall = t => { const v=Object.values(t.scores); return v.reduce((a,b)=>a+b,0)/v.length; };
const sClass = n => 's'+Math.min(5,Math.max(1,Math.round(n)));
const bClass = n => 'bar'+Math.min(5,Math.max(1,Math.round(n)));
const SCORE_STOPS=window.__QS_DATA__?.model?.scoreStops||[[1,[214,69,65]],[2,[232,140,58]],[3,[232,191,73]],[4,[126,184,96]],[5,[38,128,79]]];
function scoreRGB(v){
  v=Math.max(1,Math.min(5,v));
  for(let i=0;i<SCORE_STOPS.length-1;i++){ const a=SCORE_STOPS[i], b=SCORE_STOPS[i+1];
    if(v<=b[0]){ const f=(v-a[0])/(b[0]-a[0]); return a[1].map((x,j)=>Math.round(x+(b[1][j]-x)*f)); } }
  return [38,128,79];
}
function scoreColor(v){ const c=scoreRGB(v); return `rgb(${c[0]},${c[1]},${c[2]})`; }
function scoreText(v){ const c=scoreRGB(v); return (0.299*c[0]+0.587*c[1]+0.114*c[2])>150?'#0F2B52':'#fff'; }
const sLabel = n => ['—','Critical','Weak','Adequate','Good','Excellent'][Math.min(5,Math.max(1,Math.round(n)))];
const lev = k => LEVERS[k] || {label:'Not decided yet', t:'var(--muted)', bg:'var(--surface-2)', dot:'var(--muted-2)', d:'var(--muted-2)'};
const fmtFte = r => r[0]+'–'+r[1];
const teamById = id => TEAMS.find(t=>t.id===id);
const allOpps = () => TEAMS.flatMap(t => t.opps.map(o => { const dh=deriveHorizon(o,t); return {...o, team:t.name, teamId:t.id, horizon:dh.key, horizonWhy:dh.why}; }));
let WEIGHTS = window.__QS_DATA__?.engagement?.weights || { proc:1, cust:1, mgmt:1, data:1, mind:1, org:1 };
function weightedOverall(t){ let s=0,w=0; for(const d of DIMS){ s+=t.scores[d.key]*WEIGHTS[d.key]; w+=WEIGHTS[d.key]; } return s/w; }
function leverChip(k){ const L=lev(k); return `<span class="lever-chip" style="background:${L.bg};color:${L.t}">${L.star?'★ ':''}${L.label}</span>`; }
const isOngoing = t => (t.status==='none' || t.status==='baseline' || t.status==='diagnostic');
function dimAverages(){ const a={}; DIMS.forEach(d=>{ a[d.key]= TEAMS.reduce((s,t)=>s+t.scores[d.key],0)/TEAMS.length; }); return a; }
function subAvg(dk,i){ return TEAMS.reduce((s,t)=>s+t.subs[dk][i][1],0)/TEAMS.length; }
function positionTip(x,y){ const tip=document.getElementById('tooltip'); if(!tip) return;
  const pad=14, w=tip.offsetWidth, h=tip.offsetHeight; let lx=x+pad, ly=y-h/2;
  if(lx+w>window.innerWidth-10) lx=x-w-pad;
  if(ly+h>window.innerHeight-10) ly=window.innerHeight-h-10; if(ly<10) ly=10;
  tip.style.left=lx+'px'; tip.style.top=ly+'px'; }
// custom HTML radar tooltip: 6-dim comparison + that dimension's sub-dimension bars
function radarExternal(getTeam){ return (ctx)=>{
  const tip=ensureTip(); const tt=ctx.tooltip;
  if(!tt||tt.opacity===0){ tip.classList.remove('show','rt'); return; }
  const idx=tt.dataPoints && tt.dataPoints[0] && tt.dataPoints[0].dataIndex; if(idx==null) return;
  const d=DIMS[idx]; const t=getTeam&&getTeam(); const avg=dimAverages()[d.key];
  const teamSc=t? t.scores[d.key] : avg;
  tip.innerHTML=`
    <div class="tip-h"><b>${d.label}</b><span style="color:${scoreColor(teamSc)};">${t? t.scores[d.key] : avg.toFixed(1)}/5</span></div>
    <div class="rt-cmp">
      ${t?`<span class="rt-team"><i style="background:#006843;"></i>${t.name}: ${t.scores[d.key]}</span>`:''}
      <span class="rt-avg">Company avg ${avg.toFixed(1)}</span>
    </div>
    <div class="rt-subs-l">Sub-dimensions${t?'':' · company avg'}</div>
    ${d.subs.map((nm,i)=>{ const v=t? t.subs[d.key][i][1] : subAvg(d.key,i); const vr=Math.round(v);
      return `<div class="rt-sub"><span class="rt-nm">${nm}</span>
        <span class="rt-track"><i style="width:${v/5*100}%;background:${scoreColor(v)};"></i></span>
        <span class="rt-sc" style="background:${scoreColor(vr)};color:${scoreText(vr)};">${t? v : v.toFixed(1)}</span></div>`; }).join('')}`;
  tip.classList.add('show','rt');
  const r=ctx.chart.canvas.getBoundingClientRect();
  positionTip(r.left+tt.caretX, r.top+tt.caretY);
}; }

1dwtAO3VzLucoQ6rO/lMSW/Rygz8IsSB9Rr/wcS5txQy6GnOwAAAABJRU5ErkJggg==\"><b id=\"ctx\">OPEX QUICKSCAN</b></div>\n      <div class=\"nr-track\" id=\"lens\">PERFORMANCE WHEEL</div>\n    </div>\n    <div class=\"ctrls\">\n      <div class=\"seg\" id=\"views\"><button data-v=\"cycle\" class=\"on\">Cycle</button><button data-v=\"flow\">Flow</button><button data-v=\"classic\">Classic</button></div>\n      <div class=\"seg\" id=\"theme\"><button data-s=\"light\" class=\"on\">Light</button><button data-s=\"dark\">Dark</button></div>\n    </div>\n  </div>\n  <h1 id=\"title\"></h1>\n  <div class=\"subrow\"><div class=\"subt\" id=\"subt\"></div></div>\n  <div id=\"view\"><div id=\"vinner\"></div></div>\n  <div id=\"ft\">\n    <div class=\"l\"><span id=\"src\"></span><div class=\"legend\" id=\"lg\"></div></div>\n    <span class=\"conf\">Sample data \u00b7 Northwind Assurance is fictional</span>\n  </div>\n</div>\n\n<script>\n";
const PW_TPL_SUFFIX="(function(){\n  var C={green:'#2F8F6B',amber:'#D49A3A',red:'#D2645A',na:'#9AA4B0'};\n  var PILL={green:['rgba(47,143,107,.15)','#2F8F6B','Good'],amber:['rgba(212,154,58,.18)','#B07A1E','Fair'],red:['rgba(210,100,90,.16)','#C2483D','Weak'],na:['rgba(154,164,176,.16)','#6B7480','n/a']};\n  var SEQ=['vision','metrics','tracking','dialogues','consequences'];\n  var QMAP={vision:'Is the mission & vision clear?',metrics:'Translated into metrics & targets?',tracking:'Do we measure & visualise them?',dialogues:'Do we discuss performance?',consequences:'Do we act, reward & recognise?'};\n  function esc(t){return String(t==null?'':t).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}\n  function hl(t){return esc(t).replace(/\\*\\*(.+?)\\*\\*/g,'<span class=\"hl\">$1</span>');}\n  function mean(a){var f=a.filter(function(x){return x!=null;});return f.length?f.reduce(function(x,y){return x+y;},0)/f.length:null;}\n  function fx(v){return v==null?'n/a':v.toFixed(1);}\n  function segRag(s){return s==null?'na':(s<=2?'red':(s===3?'amber':'green'));}\n  function aggRag(v){return v==null?'na':(v<2.5?'red':(v<3.5?'amber':'green'));}\n  function verdict(v){return v==null?'n/a':v>=3.5?'Strong':v>=2.5?'Developing':v>=1.5?'Emerging':'At risk';}\n  function tline(){return getComputedStyle(document.getElementById('pw')).getPropertyValue('--line').trim();}\n\n  var byKey={}; DATA.aspects.forEach(function(a){byKey[a.key]=a;});\n  var steps=SEQ.filter(function(k){return byKey[k];}).map(function(k,i){var a=byKey[k],v=mean(a.segments.map(function(x){return x.score;}));\n    return {k:k,n:i+1,label:a.label,q:QMAP[k]||'',avg:v,rag:aggRag(v),segs:a.segments};});\n  var overall=mean(DATA.aspects.reduce(function(acc,a){return acc.concat(a.segments.map(function(x){return x.score;}));},[]));\n\n  function polar(cx,cy,r,d){var a=(d-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}\n  function sect(cx,cy,ri,ro,a0,a1){var p0=polar(cx,cy,ro,a0),p1=polar(cx,cy,ro,a1),p2=polar(cx,cy,ri,a1),p3=polar(cx,cy,ri,a0),la=(a1-a0)>180?1:0;\n    return 'M'+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A'+ro+' '+ro+' 0 '+la+' 1 '+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' L'+p2[0].toFixed(1)+' '+p2[1].toFixed(1)+' A'+ri+' '+ri+' 0 '+la+' 0 '+p3[0].toFixed(1)+' '+p3[1].toFixed(1)+' Z';}\n  function donut(active,color,size){var ri=16,ro=29,n=steps.length,slot=360/n,gp=7,g=tline(),s=[];\n    steps.forEach(function(st,i){var a0=i*slot+gp/2,a1=(i+1)*slot-gp/2;s.push('<path d=\"'+sect(30,30,ri,ro,a0,a1)+'\" fill=\"'+(i===active?color:g)+'\"/>');});\n    return '<svg width=\"'+size+'\" height=\"'+size+'\" viewBox=\"0 0 60 60\">'+s.join('')+'</svg>';}\n  function ladder(st){var f=st.avg==null?0:Math.round(st.avg),c='';for(var i=1;i<=5;i++){c+='<span class=\"lc\" style=\"background:'+(i<=f?C[st.rag]:'var(--slate-10)')+'\"></span>';}return '<div class=\"ladd\">'+c+'</div>';}\n  function scoreTag(s){var r=segRag(s);return '<span class=\"sub-sc\" style=\"color:'+C[r]+'\">'+(s==null?'n/a':s+'/5')+'</span>';}\n  function subItem(sg){var r=sg.rag||segRag(sg.score);\n    var body=sg.score==null?'<div class=\"na\">Not assessed this round (to probe)</div>'\n      :'<ul class=\"ins\">'+(sg.points||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';\n    return '<div class=\"sub\"><div class=\"sub-h\"><span class=\"dot\" style=\"background:'+C[r]+'\"></span><span class=\"sub-nm\">'+esc(sg.name)+'</span>'+scoreTag(sg.score)+'</div>'+body+'</div>';}\n  function dimPill(st){var p=PILL[st.rag];return '<span class=\"chpill\" style=\"background:'+p[0]+';color:'+p[1]+'\">'+p[2]+(st.avg!=null?' \u00b7 '+st.avg.toFixed(1)+'/5':'')+'</span>';}\n  function card(st,lead){return '<div class=\"card\"><div class=\"step\">'+st.n+'</div>'+\n    '<div class=\"chd\">'+lead+'<div class=\"cnm\">'+esc(st.label)+'</div>'+dimPill(st)+'</div>'+\n    '<div class=\"cq\">'+esc(st.q)+'</div>'+ladder(st)+'<div class=\"subs\">'+st.segs.map(subItem).join('')+'</div></div>';}\n  function renderCycle(){return '<div class=\"grid\">'+steps.map(function(st){return card(st,donut(st.n-1,C[st.rag],60));}).join('')+'</div>';}\n  function renderFlow(){var p,cp;\n    var ribbon='<div class=\"ribbon\">'+steps.map(function(st,i){p=PILL[st.rag];\n      cp=i===0?'polygon(0 0,calc(100% - 15px) 0,100% 50%,calc(100% - 15px) 100%,0 100%)':'polygon(0 0,calc(100% - 15px) 0,100% 50%,calc(100% - 15px) 100%,0 100%,15px 50%)';\n      return '<div class=\"chev\" style=\"background:'+p[0]+';clip-path:'+cp+';padding-left:'+(i===0?'16':'26')+'px\"><div class=\"ct\"><span class=\"nb\" style=\"background:'+C[st.rag]+'\">'+st.n+'</span>'+esc(st.label)+'</div><div class=\"cq2\">'+esc(st.q)+'</div><span class=\"chpill\" style=\"background:'+p[0]+';color:'+p[1]+'\">'+p[2]+'</span></div>';\n    }).join('')+'</div>';\n    var cards='<div class=\"grid\">'+steps.map(function(st){return card(st,'<div class=\"lead-n\" style=\"background:'+C[st.rag]+'\">'+st.n+'</div>');}).join('')+'</div>';\n    return ribbon+cards;}\n\n  function clWrap(t){var w=String(t).split(' '),L=[],c='';w.forEach(function(x){if((c+' '+x).trim().length>13){L.push(c.trim());c=x;}else{c=(c+' '+x).trim();}});if(c)L.push(c);return L.slice(0,2);}\n  function clPath(cx,cy,ri,ro,a0,a1,pa){var mid=(ri+ro)/2,o0=polar(cx,cy,ro,a0),o1=polar(cx,cy,ro,a1),i1=polar(cx,cy,ri,a1),i0=polar(cx,cy,ri,a0),tip=polar(cx,cy,mid,a1+pa),nt=polar(cx,cy,mid,a0+pa),la=(a1-a0)>180?1:0;function f(q){return q[0].toFixed(1)+' '+q[1].toFixed(1);}\n    return 'M'+f(o0)+' A'+ro+' '+ro+' 0 '+la+' 1 '+f(o1)+' L'+f(tip)+' L'+f(i1)+' A'+ri+' '+ri+' 0 '+la+' 0 '+f(i0)+' L'+f(nt)+' Z';}\n  function clText(x,y,lines,color,fs){var dy=lines.length>1?-2:4;return '<text x=\"'+x.toFixed(1)+'\" y=\"'+y.toFixed(1)+'\" fill=\"'+color+'\" font-size=\"'+fs+'\" font-weight=\"700\" text-anchor=\"middle\">'+lines.map(function(t,i){return '<tspan x=\"'+x.toFixed(1)+'\" dy=\"'+(i===0?dy:12.5)+'\">'+esc(t)+'</tspan>';}).join('')+'</text>';}\n  function clBadge(x,y,n,bg,fg){return '<circle cx=\"'+x.toFixed(1)+'\" cy=\"'+y.toFixed(1)+'\" r=\"12\" fill=\"'+bg+'\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"'+x.toFixed(1)+'\" y=\"'+(y+4.5).toFixed(1)+'\" fill=\"'+fg+'\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">'+n+'</text>';}\n  function renderClassic(){\n    var cx=290,cy=280,ri=80,ro=156,pa=12,mid=(ri+ro)/2,n=steps.length,slot=360/n,start=-slot/2,g=[];\n    steps.forEach(function(z,i){var fill=z.k==='vision'?'var(--green)':'var(--navy)';g.push('<path d=\"'+clPath(cx,cy,ri,ro,start+i*slot,start+(i+1)*slot,pa)+'\" fill=\"'+fill+'\" stroke=\"#fff\" stroke-width=\"3\"/>');});\n    steps.forEach(function(z,i){var ac=start+(i+0.5)*slot,lp=polar(cx,cy,mid,ac);g.push(clText(lp[0],lp[1],clWrap(z.label),'#fff',10.5));});\n    steps.forEach(function(z,i){var bp=polar(cx,cy,mid,start+(i+0.8)*slot);g.push(clBadge(bp[0],bp[1],z.n,'#fff','var(--navy)'));});\n    var ring='<svg viewBox=\"0 0 580 560\" width=\"100%\" style=\"max-width:520px;display:block;margin:0 auto\">'+g.join('')+'</svg>';\n    function blk(st){var pl=PILL[st.rag];return '<div class=\"cl-blk\"><div class=\"cl-h\"><span class=\"cl-num\">'+st.n+'</span><span class=\"cl-n\">'+esc(st.label)+'</span><span class=\"chpill\" style=\"background:'+pl[0]+';color:'+pl[1]+'\">'+(st.avg!=null?st.avg.toFixed(1)+'/5':'n/a')+'</span></div><div class=\"cl-q\">'+esc(st.q)+'</div>'+ladder(st)+'<ul class=\"ins\">'+st.segs.map(function(sg){var nm='<b>'+esc(sg.name)+'</b>',r=sg.rag||segRag(sg.score),sc=sg.score==null?'<span style=\"color:var(--mut);font-style:italic\">n/a</span>':'<span style=\"color:'+C[r]+';font-weight:700\">'+sg.score+'/5</span>';return sg.score==null?'<li style=\"--bc:'+C[r]+'\">'+nm+' '+sc+'</li>':'<li style=\"--bc:'+C[r]+'\">'+nm+' '+sc+': '+esc((sg.points||[]).map(function(x){x=(''+x).trim();return /[.!?:;]$/.test(x)?x:x+'.';}).join(' '))+'</li>';}).join('')+'</ul></div>';}\n    function col(keys){return '<div class=\"cl-col\">'+keys.ma function artifactCard(r){
  const on=r.status==='produced';
  const pstat=r.pstat||((METHODOLOGY.instruments[r.instrument]||{}).producer||{}).status||'';
  const hasAp = typeof AP_ARTIFACTS!=='undefined' && r.team==='ch' && AP_ARTIFACTS[r.instrument];
  const hasWheel = r.instrument==='performance-wheel' && typeof PW_WHEELS!=='undefined' && PW_WHEELS[r.team];
  const hasBaro = r.instrument==='team-barometer' && typeof TB_SRCDOC!=='undefined' && TB_SRCDOC[r.team];
  const hasDM = r.instrument==='data-maturity' && typeof DM_SRCDOC!=='undefined' && DM_SRCDOC[r.team];
  const open=on
    ? (hasAp
        ? `<button class="artf-open" onclick="QS.openApArtifact('${r.instrument}')">Open analysis →</button>`
        : hasWheel
        ? `<button class="artf-open" onclick="QS.openPerfWheel('${r.team}')">Open analysis →</button>`
        : hasBaro
        ? `<button class="artf-open" onclick="QS.openTeamBarometer('${r.team}')">Open analysis →</button>`
        : hasDM
        ? `<button class="artf-open" onclick="QS.openDataMaturity('${r.team}')">Open analysis →</button>`
        : r.openTab
          ? `<button class="artf-open" onclick="QS.setTeamSub('${r.openTab}')">Open analysis →</button>`
          : `<a class="artf-open" href="${r.path}" target="_blank" rel="noopener">Open analysis →</a>`)
    : `<span class="artf-plan">Not yet produced${pstat?` · skill ${pstat}`:''}</span>`;
  return `<div class="artf-card ${on?'is-on':'is-off'}">
    <div class="artf-top"><span class="artf-badge ${on?'b-on':'b-off'}">${on?'Produced':'Planned'}</span></div>
    <div class="artf-name">${r.label}</div>
    <div class="artf-meta">via ${r.producedBy}${on&&r.producedAt?` · ${r.producedAt}`:''}</div>
    ${open}
  </div>`;
}

  {label:'Scan only',    bg:'rgba(224,169,59,.20)', fg:'var(--text)',    sw:'#E0A93B'},
  {label:'Full',         bg:'var(--green)',         fg:'#ffffff',        sw:'var(--green)'}
];
let CFG_APPROACH='full-diagnostic';
let CFG_OVERRIDES={};
function applyMethodology(){
  const m=(window.__QS_DATA__&&window.__QS_DATA__.engagement&&window.__QS_DATA__.engagement.methodology)||{};
  CFG_APPROACH=m.approach||'full-diagnostic';
  CFG_OVERRIDES=m.overrides?JSON.parse(JSON.stringify(m.overrides)):{};
  try{ const s=JSON.parse(localStorage.getItem('nr_methodology')||'null'); if(s){ if(s.approach) CFG_APPROACH=s.approach; if(s.overrides&&typeof s.overrides==='object') CFG_OVERRIDES=s.overrides; } }catch(e){}
}
function saveMethodology(){ try{ localStorage.setItem('nr_methodology',JSON.stringify({approach:CFG_APPROACH,overrides:CFG_OVERRIDES})); }catch(e){} }
const lensOffers = lk => ((METHODOLOGY.lenses.find(l=>l.key===lk)||{}).offers)||[];
function approachInstruments(lk){
  const act=(METHODOLOGY.approaches[CFG_APPROACH]||{}).activate||{};
  const base=act[lk]||act['*']||[];
  const off=lensOffers(lk);
  return base.filter(i=>off.includes(i));
}
function effInstruments(tid,lk){
  const ov=CFG_OVERRIDES[tid]&&CFG_OVERRIDES[tid][lk];
  if(ov) return ov.filter(i=>lensOffers(lk).includes(i));
  return approachInstruments(lk);
}
const isOverridden = (tid,lk) => !!(CFG_OVERRIDES[tid]&&CFG_OVERRIDES[tid][lk]);
/* The maturity assessment on its own IS the quickscan. Add a map, a register or a
   second wheel and the lens is a diagnostic. Nothing sits in between. */
const QUICK_INST=['lma','lens-questions','maturity-wheel'];
function depthOf(instr){
  if(!instr||!instr.length) return {lvl:0};
  return {lvl: instr.every(i=>QUICK_INST.includes(i)) ? 1 : 2};
}
function setOverride(tid,lk,instr){
  if(!instr){ if(CFG_OVERRIDES[tid]){ delete CFG_OVERRIDES[tid][lk]; if(!Object.keys(CFG_OVERRIDES[tid]).length) delete CFG_OVERRIDES[tid]; } }
  else {
    const def=approachInstruments(lk);
    const same=instr.length===def.length && instr.every(i=>def.includes(i));
    if(same){ if(CFG_OVERRIDES[tid]){ delete CFG_OVERRIDES[tid][lk]; if(!Object.keys(CFG_OVERRIDES[tid]).length) delete CFG_OVERRIDES[tid]; } }
    else { CFG_OVERRIDES[tid]=CFG_OVERRIDES[tid]||{}; CFG_OVERRIDES[tid][lk]=instr; }
  }
  saveMethodology();
}
function setCellDepth(tid,lk,lvl){
  const off=lensOffers(lk);
  const instr = lvl===0 ? [] : lvl===1 ? off.filter(i=>QUICK_INST.includes(i)) : off.slice();
  setOverride(tid,lk,instr);
}
function cfgActive(){ return document.getElementById('page-configurator')?.classList.contains('active'); }
function setApproach(a){ CFG_APPROACH=a; saveMethodology(); if(cfgActive()) renderConfigurator(); }
function setRowDepth(tid,lvl){ METHODOLOGY.lenses.forEach(l=>setCellDepth(tid,l.key,lvl)); if(cfgActive()) renderConfigurator(); }
function setColDepth(lk,lvl){ TEAMS.forEach(t=>setCellDepth(t.id,lk,lvl)); if(cfgActive()) renderConfigurator(); }
function clearAllOverrides(){ CFG_OVERRIDES={}; saveMethodology(); if(cfgActive()) renderConfigurator(); }
function resetApproachDefault(){ const m=(window.__QS_DATA__&&window.__QS_DATA__.engagement&&window.__QS_DATA__.engagement.methodology)||{}; CFG_APPROACH=m.approach||'full-diagnostic'; CFG_OVERRIDES=m.overrides?JSON.parse(JSON.stringify(m.overrides)):{}; saveMethodology(); if(cfgActive()) renderConfigurator(); }
function toggleInstrument(tid,lk,ik){
  const cur=effInstruments(tid,lk).slice();
  const i=cur.indexOf(ik);
  if(i>=0) cur.splice(i,1); else cur.push(ik);
  const off=lensOffers(lk);
  setOverride(tid,lk,off.filter(x=>cur.includes(x)));
  openCellEditor(tid,lk); if(cfgActive()) renderConfigurator();
}

  </style>
    <div class="psec"><div class="psec-l">Preset \u2014 a starting point for this lens</div><div style="display:flex;gap:6px;flex-wrap:wrap;">${quick}</div></div>
    <div class="psec"><div class="psec-l">What actually runs \u2014 tick exactly the analyses you want</div>${rows}</div>
    <div class="psec">${ov
      ? `<button class="fchip" onclick="QS.setOverride('${tid}','${lk}',null);openCellEditor('${tid}','${lk}');renderConfigurator();">↺ Reset to engagement default (${DEPTH[depthOf(def).lvl].label})</button>`
      : `<span class="badge-soft">Inheriting engagement default · ${DEPTH[depthOf(def).lvl].label}</span>`}</div>`;
  openPanel(html, dim.label+' — '+t.name, (METHODOLOGY.approaches[CFG_APPROACH]||{}).label||CFG_APPROACH);
}

  const aiPct=fte?Math.round(aiFte/fte*100):0;

    +`<div class="vct-lead"><span class="vct-dot" style="background:${L.dot}"></span>Lead move: <b>${L.label}</b></div>`

function vcWireTips(el){
  const tip=el.querySelector('#vc-tip'), grid=el.querySelector('.vc-grid');
  if(!tip||!grid) return;
  function place(card){ const t=teamById(card.getAttribute('data-team')); if(!t){tip.style.display='none';return;} tip.innerHTML=vcTipHtml(t); tip.style.display='block';
    const r=card.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight;
    let left=r.right+10; if(left+tw>window.innerWidth-8) left=r.left-tw-10; if(left<8) left=8;
    let top=r.top; if(top+th>window.innerHeight-8) top=window.innerHeight-th-8; if(top<8) top=8;
    tip.style.left=left+'px'; tip.style.top=top+'px';
  }
  grid.addEventListener('mouseover',e=>{ const c=e.target.closest('.vc-card'); if(c&&grid.contains(c)) place(c); });
  grid.addEventListener('mouseout',e=>{ const c=e.target.closest('.vc-card'); const to=e.relatedTarget; if(c&&(!to||!c.contains(to))) tip.style.display='none'; });
}

// ===== AI READINESS — ONE derivation, shared by the value chain and the team AI-readiness tab =====
// Readiness is a weakest-link read on the same five dimensions the lean maturity scan uses; it answers a
// different question ("can this team put AI to work?") and it picks the LEVER — the improvement potential
// sizes it. A readiness score never produces an FTE figure.
function aiReadinessVerdict(t){
  const s=Math.round(t.readinessScore||0);
  if(t.readiness==='act')  return { tier:'act',   label:'Ready',           color:'#1D7044', bg:'#E3F4EC', score:s };
  if(t.readiness==='deprio') return { tier:'dep', label:'Deprioritise',    color:'#C0392B', bg:'#FBE7E4', score:s };
  return s>=40 ? { tier:'near',  label:'Nearly ready',     color:'#B8620A', bg:'#FBEEDB', score:s }
               : { tier:'found', label:'Foundation-first', color:'#C0392B', bg:'#FBE7E4', score:s };
}
// The three gates. Same dimensions as the lean maturity scan — a different bar, and a different question.
const RDY_GATES=[
  { key:'run',   dims:['data'],        role:'Hard gate',  q:'Can AI run at all?',
    yes:'Data is available, joined and trustworthy enough for a model to act on.',
    no:'Automation and predictive AI are not deployable here yet — the data foundation comes first, whatever the appetite.' },
  { key:'land',  dims:['org','mgmt'],  role:'Value gate', q:'Can the saving be materialised?',
    yes:'Roles, KPIs and capacity management are clear enough to turn freed hours into capacity.',
    no:'Hours freed by AI get reabsorbed — the benefit never shows up where it can be counted.' },
  { key:'scale', dims:['proc','mind'], role:'Embedding gate', q:'Can the solution be properly embedded?',
    yes:'Processes are standard enough, and the team open enough, to move past a single pilot.',
    no:'A pilot may well work; it will not spread beyond the people who built it.' },
];
const RDY_RELEASE={
  run:  'Unblocks every technology lever — automation and both AI levers sit behind this one.',
  land: 'Turns the freed hours into capacity the business can actually redeploy.',
  scale:'Lets a working pilot spread beyond the team that built it.',
};
// ONE threshold — the AI readiness bar (3). A gate is cleared at or above it, and not below it.
// 4+ is comfortably clear; exactly 3 clears it with nothing to spare.
function rdyGateStatus(v){
  return v>=4 ? { k:'clear',   label:'Clear',           color:'#1D7044', bg:'#E3F4EC' }
       : v>=3 ? { k:'at',      label:'At the bar',      color:'#1D7044', bg:'#E3F4EC' }
              : { k:'block',   label:'Below the bar',   color:'#C0392B', bg:'#FBE7E4' };
}
function readinessGates(t){
  const dl=k=>((DIMS.find(d=>d.key===k)||{}).label||k);
  return RDY_GATES.map(g=>{
    const dims=g.dims.map(k=>({ key:k, label:dl(k), v:t.scores[k], why:(t.rationale||{})[k]||'' }));
    const low=dims.reduce((a,b)=>b.v<a.v?b:a);
    return { ...g, dims, low, st:rdyGateStatus(low.v) };
  });
}
function readinessBinding(t){
  const gs=readinessGates(t);
  return [...gs].sort((a,b)=>a.low.v-b.low.v || RDY_GATES.findIndex(x=>x.key===a.key)-RDY_GATES.findIndex(x=>x.key===b.key))[0];
}

  // AI readiness is its own read: the act/fix verdict and the readiness score, never the maturity average.

  const RST=t=>{ const v=aiReadinessVerdict(t); return [v.label,v.color,v.bg]; };
  const STAGES=[

      +`<div class="vc-bar rdy"><i style="width:${rsc}%;background:${rsc>=60?'#1D7044':rsc>=40?'#B8620A':'#C0392B'}"></i></div>`
      +`<div class="vc-lead"><span class="vc-leaddot" style="background:${L.dot}"></span><span class="vc-leadlbl">${L.label}</span></div></div>`;
  }}
  el.innerHTML=`<div class="vc-head"><h2>Value chain view — lean maturity and AI readiness by stage</h2><p>The 16 teams mapped onto the value chain. <b>Data, digital &amp; AI</b> is the lowest-scoring dimension at 2.8/5 org-wide, and it is the one that decides whether AI can run at all — a central data &amp; tech foundation is the No.1 cross-team move. <span class="vc-hint">Hover a team for full detail &middot; click to open its deep-dive.</span></p></div><div class="vc-grid">${cells}</div><div id="vc-tip" class="vc-tip"></div>`;

function buildOrgChart(){
  const g=$('#org-chart');
  const totFte=TEAMS.reduce((s,t)=>s+t.fte,0);
  let cols='';
  DIVISIONS.forEach(div=>{
    const teams=div.teams.map(teamById).filter(Boolean);
    const scored=teams.filter(t=>!isOngoing(t));
    const avg=scored.length? scored.reduce((s,t)=>s+weightedOverall(t),0)/scored.length : null;
    let tiles='';
    teams.forEach(t=>{ const ongoing=isOngoing(t); const ov=weightedOverall(t);
      const sChip = ongoing ? `<span class="oc-chip oc-pending">Ongoing</span>` : `<span class="oc-chip">${ov.toFixed(1)}<small>/5</small></span>`;
      const txt = ongoing ? '' : scoreText(ov);
      const bg = ongoing ? '' : ` style="background:${scoreColor(ov)};color:${txt};${txt==='#0F2B52'?'--chipbg:rgba(15,43,82,.13);':''}"`;
      tiles+=`<div class="oc-team${t.id===summarySel?' selected':''}${ongoing?' ongoing':''}" data-team="${t.id}"${bg}>
        <div class="oc-nm">${t.name}</div>
        <div class="oc-foot">${sChip}<span class="oc-chip fte">${t.fte} FTE</span></div>
      </div>`; });
    cols+=`<div class="oc-col">
      <div class="oc-dept"><div class="dn"><span class="oc-dept-dot" style="background:${avg!==null?scoreColor(avg):'var(--border-heavy)'};"></span>${div.name}</div><div class="dm">${teams.length} teams · ${avg!==null?'avg '+avg.toFixed(1):'scoring pending'}</div></div>
      <div class="oc-teams">${tiles}</div></div>`;
  });
  const busInset=(50/DIVISIONS.length).toFixed(2);
  g.innerHTML=`<div class="orgchart"><div class="oc-root">Northwind Assurance · ${totFte} FTE</div><div class="oc-divs" style="--bus:${busInset}%">${cols}</div></div>`;
  g.querySelectorAll('.oc-team').forEach(el=>{
    const t=teamById(el.dataset.team);
    if(!isOngoing(t)) el.onclick=()=>selectSummaryTeam(t.id);
    el.onmouseenter=e=>showTip(t,e);
    el.onmousemove=moveTip;
    el.onmouseleave=hideTip;
  });
}

// The readiness GATE (data + mindset) only applies to technology levers — they need
// clean data/systems and digital appetite to be feasible. Single-dimension levers ARE
// the improvement programmes that build that readiness (a lean/change initiative is how
// you tackle mindset & management routines), so they are act-now enablers, not data-gated.
const COMBO_LEVERS=window.__QS_DATA__?.model?.comboLevers||['auto','aiacc','aienh'];
const LEVER_DIM=window.__QS_DATA__?.model?.leverDim||{ process:'Processes', journey:'the customer journey', lean:'Management systems', data:'Data & systems', change:'Mindset & behaviours', org:'Organisation' };
function readinessModel(o,t){
  t=t||teamById(o.teamId);
  if(!t) return { verdict:'act', tl:'tl-g', label:'Act now', basis:'', reason:'' };
  const s=t.scores;
  if(COMBO_LEVERS.includes(o.lever)){
    let basis, ok;
    if(o.lever==='auto'){ basis=`Data ${s.data} · Process ${s.proc}`; ok=s.data>=3&&s.proc>=3; }
    else if(o.lever==='aiacc'){ basis=`Data ${s.data} · Mindset ${s.mind}`; ok=s.data>=3&&s.mind>=3; }
    else { basis=`Data ${s.data} · Mindset ${s.mind}`; ok=s.data>=2&&s.mind>=3; }
    return ok
      ? { verdict:'act', tl:'tl-g', label:'Act now', basis, reason:'Technology lever — data & mindset gate cleared' }
      : { verdict:'fix', tl:'tl-a', label:'Fix readiness first', basis, reason:'Technology lever — clear the data & mindset gate first' };
  }
  const dim=LEVER_DIM[o.lever]||'the target dimension';
  return { verdict:'act', tl:'tl-g', label:'Act now', basis:`Builds ${dim}`, kind:'foundational',
    reason:`Foundational programme — tackles ${dim} directly (incl. mindset & routines) and builds the readiness AI levers need; not data-gated` };
}
const verdictOf=o=>readinessModel(o,teamById(o.teamId)).verdict;

// HORIZON is DERIVED, not authored: readiness gate × activity complexity (nature) × foundation dependency.
// Rule: foundational enablers start now (they build readiness); ready tech levers deploy by complexity
// (R/S near-term, K mid-term); gated tech levers wait for the data-foundation precondition (K waits longest).
const HORIZON_LABEL=window.__QS_DATA__?.model?.horizonLabel||{ '0-6m':'Stabilise', '6-12m':'Accelerate', '12-24m':'Transform' };
function deriveHorizon(o,t){
  t=t||teamById(o.teamId); const r=readinessModel(o,t); const k=o.nature;
  if(r.kind==='foundational')
    return { key:'0-6m', why:'Foundational enabler — start now; it builds the readiness the technology levers depend on.' };
  if(r.verdict==='act')
    return k==='K'
      ? { key:'6-12m', why:'Readiness gate cleared, but knowledge-driven AI enhancement needs build, grounding and validation time.' }
      : { key:'0-6m', why:'Readiness gate cleared and the work is rule- or semi-structured — deployable as a near-term win.' };
  return k==='K'
    ? { key:'12-24m', why:'Gated on the hardest precondition — data quality and integration maturity — before this AI enhancement is viable.' }
    : { key:'6-12m', why:'Gated — unlocks once the mid-term data-foundation investment lands.' };
}

function oppPotential(o){ // derive a 0-100 from team potential + fte
  const t=teamById(o.teamId); const base=t.potential; const fteMid=(o.fte[0]+o.fte[1])/2;
  return Math.min(96, Math.round(base*0.6 + fteMid*7));
}
function oppReadiness(o){ const t=teamById(o.teamId); const m=readinessModel(o,t);
  if(m.kind==='foundational') return 70;                              // executable now, not data-gated
  return m.verdict==='act'?Math.min(92,t.readinessScore+12):Math.max(12,t.readinessScore-6);
}

// deterministic per-string jitter so co-located dots don't fully overlap
function dotJitter(seed){ let h=0; for(let i=0;i<seed.length;i++) h=(h*31+seed.charCodeAt(i))|0; const a=((h>>>0)%1000)/1000; const b=(((h>>>10)>>>0)%1000)/1000; return [(a-0.5)*4.4,(b-0.5)*4.4]; }

function buildMatrix(opps){
  const m=$('#matrix');
  m.querySelectorAll('.dot').forEach(d=>d.remove());
  opps.forEach(o=>{
    const x=oppReadiness(o), y=oppPotential(o);
    const [jx,jy]=dotJitter(o.team+o.activity);
    const L=lev(o.lever); const r=readinessModel(o);
    const dot=document.createElement('div'); dot.className='dot';
    dot.style.left=`calc(${x}% + ${jx.toFixed(2)}px)`; dot.style.bottom=`calc(${y}% + ${jy.toFixed(2)}px)`; dot.style.background=L.dot;
    const tip=`<div class="tip-h"><b>${o.activity}</b></div>
      <div class="tip-sub">${o.team}</div>
      <div class="tip-row" style="margin-top:9px;"><span>Lever</span>${leverChip(o.lever)}</div>
      <div class="tip-row"><span>FTE impact</span><b style="color:var(--green-soft);">${fmtFte(o.fte)} FTE</b></div>
      <div class="tip-row"><span>Readiness</span><b><span class="tl ${r.tl}" style="display:inline-block;margin-right:5px;"></span>${r.label}</b></div>
      <div class="tip-row" style="margin-bottom:0;"><span>Potential × readiness</span><b>${y} × ${x}</b></div>`;
    dot.onmouseenter=e=>showTipHTML(tip,e); dot.onmousemove=moveTip; dot.onmouseleave=hideTip;
    dot.onclick=()=>{ hideTip(); oppDetail(o); };
    m.appendChild(dot);
  });
}

function renderOppTable(){
  let rows=allOpps();
  if(oppFilters.lever!=='all') rows=rows.filter(o=>o.lever===oppFilters.lever);
  if(oppFilters.team!=='all') rows=rows.filter(o=>o.teamId===oppFilters.team);
  if(oppFilters.nature!=='all') rows=rows.filter(o=>o.nature===oppFilters.nature);
  if(oppFilters.actOnly) rows=rows.filter(o=>verdictOf(o)==='act');
  const sk=oppSort.key;
  rows.sort((a,b)=>{
    let va,vb;
    if(sk==='fte'){ va=(a.fte[0]+a.fte[1]); vb=(b.fte[0]+b.fte[1]); }
    else if(sk==='potential'){ va=oppPotential(a); vb=oppPotential(b); }
    else { va=(a[sk]||'')+''; vb=(b[sk]||'')+''; return oppSort.dir*va.localeCompare(vb); }
    return oppSort.dir*(va-vb);
  });
  const tb=$('#opp-tbody');
  tb.innerHTML=rows.map(o=>{ const rm=readinessModel(o);
    return `<tr style="cursor:pointer;" onclick='QS.oppDetail(${JSON.stringify(o).replace(/'/g,"&#39;")})'>

      <td><span class="fte-range" style="color:var(--green);">${fmtFte(o.fte)}</span></td>
      <td title="${rm.reason}"><span class="tl ${rm.tl}"></span> <span style="font-size:var(--fs-115);">${rm.label}</span><div style="font-size:var(--fs-95);color:var(--muted-2);margin-top:2px;">${rm.basis}</div></td>
      <td title="${o.horizonWhy||''}"><span class="badge-soft">${HORIZON_LABEL[o.horizon]||o.horizon}</span></td>
      <td class="dg-ins" style="max-width:340px;"><ul class="ins-ul">${oppExplain(o).map(b=>`<li>${b}</li>`).join('')}</ul></td>
    </tr>`; }).join('') || `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:30px;">No opportunities match these filters.</td></tr>`;

  if(rmFoundational(o)) return 0;                      // operating basics build readiness → early
  const ready = verdictOf(o)==='act';

function teamPeriods(t){

  const based=ops.map(o=>({ o, b:rmBasePeriod(o) }));
  const mid=r=>(r[0]+r[1])/2;
  based.sort((a,b)=> a.b-b.b || (rmFoundational(b.o)-rmFoundational(a.o)) || (mid(b.o.fte)-mid(a.o.fte)));

  const cursor={A:0,B:0};                               // one slot per track per half-year

/* ── ASSUMPTIONS helpers ──────────────────────────────────────────────── */
function getAssumptions(){
  try{ const s=localStorage.getItem('nr_assumptions'); if(s) return JSON.parse(s); }catch(e){}
  return { costPerFte:80000, realisationRate:100, implPerFte:25000 };
}
function saveAssumptions(a){ try{ localStorage.setItem('nr_assumptions',JSON.stringify(a)); }catch(e){} }
function updateAssumption(field, raw){
  const a=getAssumptions(); a[field]=parseFloat(raw)||0; saveAssumptions(a);
  // refresh Benefits Overview if it is the active page
  const vs=$('#page-valuestake'); if(vs&&vs.classList.contains('active')) renderValueStake();
}

/* ── BENEFITS OVERVIEW ────────────────────────────────────────────────── */
function renderValueStake(){
  const el=$('#page-valuestake');
  const A=getAssumptions();
  const costPerFte=A.costPerFte||80000;
  const realRate=(A.realisationRate||100)/100;
  const implPerFte=A.implPerFte||25000;

  // Aggregate FTE by horizon key (use high-end of each opp's fte range)
  const scored=TEAMS.filter(t=>!isOngoing(t));
  const byHorizon={'0-6m':0,'6-12m':0,'12-24m':0};
  scored.forEach(t=>(t.opps||[]).forEach(o=>{
    const h=o.horizon||'0-6m'; const hi=Array.isArray(o.fte)?o.fte[1]:o.fte;
    byHorizon[h]=(byHorizon[h]||0)+hi;
  }));

  // Map to 4 half-years: 12-24m splits evenly across H1/H2 2027
  const half27=byHorizon['12-24m']/2;
  const HY=[
    { key:'h1-26', label:'H1 2026', when:'Jan–Jun 2026', fte:byHorizon['0-6m'] },
    { key:'h2-26', label:'H2 2026', when:'Jul–Dec 2026', fte:byHorizon['6-12m'] },
    { key:'h1-27', label:'H1 2027', when:'Jan–Jun 2027', fte:half27 },
    { key:'h2-27', label:'H2 2027', when:'Jul–Dec 2027', fte:half27 },
  ];

  // Run-rate added per half-year & cumulative
  HY.forEach(h=>{ h.added=h.fte*costPerFte*realRate; });
  let cum=0; HY.forEach(h=>{ cum+=h.added; h.cum=cum; });
  const totalFte=scored.reduce((s,t)=>(t.opps||[]).reduce((ss,o)=>ss+(Array.isArray(o.fte)?o.fte[1]:o.fte),s),0);
  const annualRunRate=totalFte*costPerFte*realRate;
  // 3-yr cumulative: H1-26 active 30m, H2-26 24m, H1-27 18m, H2-27 12m
  const activationMonths=[30,24,18,12];
  const cum3yr=HY.reduce((s,h,i)=>s+h.fte*costPerFte*realRate*(activationMonths[i]/12),0);
  const implCost=totalFte*implPerFte;
  const paybackMo=annualRunRate>0?Math.round(implCost/annualRunRate*12):null;
  const paybackStr=paybackMo!=null?(paybackMo<12?`~${paybackMo} mo`:`~${(paybackMo/12).toFixed(1)} yr`):'n/a';

  // "Where the value sits" — by division
  const divData=DIVISIONS.map(d=>{
    const divTeams=TEAMS.filter(t=>d.teams.includes(t.id)&&!isOngoing(t));
    const fte=divTeams.reduce((s,t)=>(t.opps||[]).reduce((ss,o)=>ss+(Array.isArray(o.fte)?o.fte[1]:o.fte),s),0);
    return { name:d.name, fte, value:fte*costPerFte*realRate };
  }).sort((a,b)=>b.value-a.value);
  const maxDiv=Math.max(1,...divData.map(d=>d.value));

  const fmt=v=>v>=1e6?`€${(v/1e6).toFixed(1)}M`:v>=1e3?`€${(v/1e3).toFixed(0)}k`:`€${Math.round(v)}`;
  const fmtK=v=>`€${Math.round(v/1000)}k`;

  const ic={
    money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10a2.5 2.5 0 0 1 5 0c0 1.4-1.1 2-2.5 2.5S9.5 12 9.5 14a2.5 2.5 0 0 0 5 0"/></svg>',
    fte:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="3.2"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>',
    trend:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>',
    pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>',
    info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 12v4"/></svg>',
  };

  const kpi=(label,v,sub,icon)=>`<div class="kpi-box">
    <div><div class="kpi-eyebrow">${label}</div><div class="kpi-v">${v}</div><div class="kpi-sub">${sub}</div></div>
    <div class="kpi-icon">${icon}</div></div>`;

  el.innerHTML=`
  <div class="dd-verdict" style="border-left:3px solid var(--green);">
    <span class="dd-verdict-l">Value potential</span>
    <span class="dd-verdict-t">Releasing up to ${totalFte.toFixed(0)} FTE of capacity is worth up to ${fmt(annualRunRate)} a year — an estimated ${paybackStr} payback on ${fmt(implCost)} of implementation, and up to ${fmt(cum3yr)} of cumulative savings over three years.</span>
  </div>

  <div class="kpi-row">
    <div class="kpi-grp pot">
      <div class="kpi-grp-label">Value released · gross cost-out</div>
      <div class="kpi-boxes">
        ${kpi('Annual run-rate','<span class="kpi-pre">up to</span>'+fmt(annualRunRate),'at full ramp',ic.money)}
        ${kpi('Optimisable FTE','<span class="kpi-pre">up to</span>'+totalFte.toFixed(0),'capacity released',ic.fte)}
        ${kpi('3-yr cumulative','<span class="kpi-pre">up to</span>'+fmt(cum3yr),'phased over half-years',ic.trend)}
      </div>
    </div>
    <div class="kpi-grp">
      <div class="kpi-grp-label">Investment &amp; return</div>
      <div class="kpi-boxes">
        ${kpi('Implementation',fmt(implCost),'one-off, indicative',ic.pen)}
        ${kpi('Payback',paybackStr,'to recover the build',ic.clock)}
        ${kpi('Cost per FTE',fmtK(implPerFte),'fully-loaded assumption',ic.info)}
      </div>
    </div>
  </div>

  <div class="dd-section">
    <div class="eyebrow" style="margin-bottom:12px;">Phased value · run-rate by half-year</div>
    <div class="dd6">
      <div class="card span4" style="display:flex;flex-direction:column;">
        <div class="ch"><div class="ct">Savings build-up</div><span style="font-size:var(--fs-105);color:var(--muted);">bars = added run-rate · line = cumulative</span></div>
        <div style="flex:1;min-height:320px;position:relative;margin-top:10px;"><canvas id="bo-chart"></canvas></div>
      </div>
      <div class="card span2" style="display:flex;flex-direction:column;">
        <div class="ch"><div class="ct">Where the value sits</div><span style="font-size:var(--fs-10);color:var(--muted);">annual, by division</span></div>
        <div style="flex:1;margin-top:12px;">
        ${divData.map(d=>`
        <div style="margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;font-family:var(--fh);font-weight:800;font-size:13px;margin-bottom:3px;">
            <span>${d.name}</span><span style="color:var(--green);">${fmt(d.value)}</span>
          </div>
          <div style="font-size:var(--fs-105);color:var(--muted);margin-bottom:5px;">~${d.fte.toFixed(1)} FTE</div>
          <div style="height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;">
            <div style="height:100%;width:${(d.value/maxDiv*100).toFixed(1)}%;background:var(--green);border-radius:3px;"></div>
          </div>
        </div>`).join('')}
        </div>
      </div>
    </div>
  </div>

  <div class="dd-section">
    <div class="eyebrow">How to read this</div>
    <div style="font-size:12px;color:var(--muted);line-height:1.6;">
      Pure cost-out basis — all optimisable capacity is valued as gross saving at the fully-loaded cost per FTE set in <b style="color:var(--text);">Scoring &amp; Levers</b>.
      The phased chart maps when each initiative becomes executable: H1/H2 2026 contains opportunities that teams can act on immediately or within 12 months;
      H1/H2 2027 captures work that requires a data-foundation fix or deeper transformation first.
      The cumulative line shows the build-up of annual run-rate savings over the two-year programme window.
      Optimisable FTE itself is set per activity on the team deep-dives.
    </div>
  </div>`;

  // Phased value chart — Chart.js combo (bars = added run-rate, line = cumulative), matches dashboard standard
  const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const gridc=cssv('--divider'), txtc=cssv('--muted'), navyc=cssv('--navy')||'#0F2B52';
  newChart('bo-chart',{
    type:'bar',
    data:{ labels:HY.map(h=>h.label),
      datasets:[
        { type:'bar', label:'Added annual run-rate', data:HY.map(h=>h.added),
          backgroundColor:'#4D9E6A', borderRadius:5, maxBarThickness:64, order:2 },
        { type:'line', label:'Cumulative run-rate', data:HY.map(h=>h.cum),
          borderColor:navyc, borderWidth:2.6, pointBackgroundColor:navyc, pointRadius:4, tension:.3, order:1 }
      ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:true, position:'bottom', labels:{ color:txtc, font:{size:11.5,family:'Inter'}, boxWidth:12, usePointStyle:true, padding:16 } },
        tooltip:{ callbacks:{ label:c=>c.dataset.label+': '+fmt(c.parsed.y) } } },
      scales:{ x:{ grid:{display:false}, ticks:{ color:txtc, font:{size:11,family:'Inter'} } },
        y:{ beginAtZero:true, grid:{color:gridc}, ticks:{ color:txtc, font:{size:11,family:'Inter'}, callback:v=>fmt(v) } } } }
  });
}

  const t=teamById(teamId); if(!t) return;

  const list=(teamPeriods(t)[p]||[]);   // already enriched with teamId/team
  const P=RM_PERIODS[p]; if(!P) return;
  const fte=list.reduce((s,o)=>s+mid(o.fte),0);

// ===================== VALUE WATERFALL — ONE implementation =====================
// Five-step bridge. Total scope, then the improvement potential taken off in THREE distinct steps —
// addressable now (clears the AI readiness bar) · addressable after the enablers (scoped but gated) ·
// not yet identified (top-down, no initiative yet) — ending on the scope that remains.
// A bracket over the three middle steps carries the potential as one figure.
// Used by the team Overview and by the Improvement potential tab — never duplicated.
function valueWaterfall(t, opt){
  opt=opt||{};
  const midf=r=>(r[0]+r[1])/2;
  const totActFte=t.activities.reduce((s,a)=>s+a.fte,0);
  const totalOpt=teamOptTotal(t);
  const oppsAll=t.opps||[];
  const oppSum=oppsAll.reduce((s,o)=>s+midf(o.fte),0);
  const isNow=o=>readinessModel(o,t).verdict==='act';
  const nowFte=oppsAll.filter(isNow).reduce((s,o)=>s+midf(o.fte),0);
  const laterFte=oppsAll.filter(o=>!isNow(o)).reduce((s,o)=>s+midf(o.fte),0);
  const notYet=Math.max(0,totalOpt-oppSum);
  // transformation-type groups across ALL opportunities — drives the lever legend and the stacking
  const grpMap={}; oppsAll.forEach(o=>{ const k=ttOf(o); (grpMap[k]=grpMap[k]||{fte:0,n:0,items:[]});
    grpMap[k].fte+=midf(o.fte); grpMap[k].n++; grpMap[k].items.push({name:o.activity, lever:lev(o.lever).label, leverKey:o.lever, horizon:o.horizon, fte:midf(o.fte), fteStr:fmtFte(o.fte)}); });
  const grps=Object.entries(grpMap).map(([k,v])=>({ k, fte:v.fte, n:v.n, items:v.items, label:TTYPES[k].label, dot:TTYPES[k].dot }))
    .sort((a,b)=>TTYPE_ORDER.indexOf(a.k)-TTYPE_ORDER.indexOf(b.k));
  const gIdx={}; grps.forEach((g,i)=>gIdx[g.k]=i+1);
  // per-bucket stacking, same transformation-type order
  const bucket=(list)=>{ const m={}; list.forEach(o=>{ const k=ttOf(o); (m[k]=m[k]||{fte:0,n:0,items:[]});
      m[k].fte+=midf(o.fte); m[k].n++; m[k].items.push({name:o.activity, lever:lev(o.lever).label, fteStr:fmtFte(o.fte)}); });
    return Object.entries(m).map(([k,v])=>({ k, ...v, label:TTYPES[k].label, dot:TTYPES[k].dot, no:gIdx[k] }))
      .sort((a,b)=>TTYPE_ORDER.indexOf(a.k)-TTYPE_ORDER.indexOf(b.k)); };
  const segNow=bucket(oppsAll.filter(isNow)), segLater=bucket(oppsAll.filter(o=>!isNow(o)));
  const cov=Math.min(100,Math.round(oppSum/Math.max(0.1,totActFte)*100));
  const wfEnd=Math.max(0,totActFte-totalOpt);

  const wfW=opt.w||580, wfH=opt.h||242, wfPT=opt.pt||42, wfPB=opt.pb||44, wfPL=12, wfPR=12;
  const wfPH=wfH-wfPT-wfPB, wfIW=wfW-wfPL-wfPR, wfN=5, wfSlot=wfIW/wfN, wfBar=Math.min(opt.bar||54,wfSlot-22);
  const wfCx=i=>wfPL+wfSlot*i+wfSlot/2, wfBx=i=>wfCx(i)-wfBar/2;
  const wfScale=Math.max(totActFte,0.1), wfY=v=>wfPT+wfPH*(1-v/wfScale), wfHt=v=>wfPH*Math.max(0,v)/wfScale;
  /* the SVG is drawn in a 580-unit box and squeezed into the card, so on a phone a

  const cTxt=cssVar('--muted')||'#64748b', cMut=cssVar('--muted-2')||'#94a3b8', cGreen=cssVar('--green')||'#006843',
        cAmber=cssVar('--amber')||'#B8620A', cScope='#cbd5e1', cGhost='#e9edf1';
  const T=(x,y,str,sz,col,w,a)=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${a||'middle'}" font-family="Inter,sans-serif" font-size="${(sz*fs).toFixed(1)}" fill="${col}"${w?` font-weight="${w}"`:''}>${str}</text>`;
  const R=(x,y,w,h,fill,extra)=>`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="2.5" fill="${fill}"${extra||''}/>`;
  const E=str=>String(str).replace(/&/g,'&amp;');

  // running tops

  const dash=(x1,y1,x2,y2)=>`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${cMut}" stroke-width="1" stroke-dasharray="4 3"/>`;
  let svgBody =
      dash(wfBx(0)+wfBar,wfY(r0),wfBx(1),wfY(r0))
    + dash(wfBx(1)+wfBar,wfY(r1),wfBx(2),wfY(r1))
    + dash(wfBx(2)+wfBar,wfY(r2),wfBx(3),wfY(r2))
    + dash(wfBx(3)+wfBar,wfY(r3),wfBx(4),wfY(r3))
    + R(wfBx(0),wfY(r0),wfBar,wfHt(r0),cScope,` style="cursor:default" data-tip="Total scope" data-tipv="${+r0.toFixed(1)} FTE" data-tips="current activity workload"`);

  // step 1 + 2 — stacked by transformation type inside each readiness bucket
  const stack=(col,top,segs,label,fill)=>{ let cum=0, out='';
    segs.forEach((g,i)=>{ const yT=wfY(top-cum); const h=wfHt(g.fte); cum+=g.fte;
      out+=R(wfBx(col),yT,wfBar,h,fill,` opacity="${(1-i*0.16).toFixed(2)}" stroke="#fff" stroke-width="1.4" style="cursor:default" data-tip="${E(g.label)}" data-tipv="~${g.fte.toFixed(1)} FTE" data-tips="${label} · ${g.n} initiative${g.n===1?'':'s'}" data-tipl="${tipList(g.items)}"`)
        + (h>=15?T(wfCx(col),yT+h/2+3.4*fs,String(g.no),9.5,'#fff',800):'');

  svgBody += stack(1,r0,segNow,'addressable now',cGreen);
  svgBody += stack(2,r1,segLater,'after the enablers',cAmber);
  // zero-height buckets still need a visible foot so the bridge reads
  if(nowFte<=0.02)   svgBody += R(wfBx(1),wfY(r0)-1.5,wfBar,3,cMut,' opacity=".45"');
  if(laterFte<=0.02) svgBody += R(wfBx(2),wfY(r1)-1.5,wfBar,3,cMut,' opacity=".45"');
  // step 3 — not yet identified
  svgBody += (notYet>0.02
    ? R(wfBx(3),wfY(r2),wfBar,wfHt(notYet),cGhost,` stroke="${cMut}" stroke-width="1" stroke-dasharray="3 2" style="cursor:default" data-tip="Not yet identified" data-tipv="~${+notYet.toFixed(1)} FTE" data-tips="top-down potential with no initiative yet"`)
    : R(wfBx(3),wfY(r2)-1.5,wfBar,3,cMut,' opacity=".45"'));
  svgBody += R(wfBx(4),wfY(r3),wfBar,wfHt(r3),cScope,` style="cursor:default" data-tip="Remaining scope" data-tipv="~${+r3.toFixed(1)} FTE" data-tips="workload if the full potential were captured"`);

  // value labels
  svgBody += T(wfCx(0),wfY(r0)-7,''+(+r0.toFixed(1)),11,cTxt,800)
    + T(wfCx(1),wfY(r0)-7,(nowFte>0.02?'−':'')+nowFte.toFixed(1),11,nowFte>0.02?cGreen:cMut,800)
    + T(wfCx(2),wfY(r1)-7,(laterFte>0.02?'−':'')+laterFte.toFixed(1),11,laterFte>0.02?cAmber:cMut,800)
    + T(wfCx(3),wfY(r2)-7,(notYet>0.02?'−':'')+notYet.toFixed(1),11,cMut,800)
    + T(wfCx(4),wfY(r3)-7,''+(+r3.toFixed(1)),11,cTxt,800);

  // bracket over the three deduction steps — the potential as one figure
  const bkY=wfPT-19*fs, bkL=wfBx(1)-6, bkR=wfBx(3)+wfBar+6;
  svgBody = `<path d="M${bkL.toFixed(1)} ${(bkY+6).toFixed(1)} L${bkL.toFixed(1)} ${bkY.toFixed(1)} L${bkR.toFixed(1)} ${bkY.toFixed(1)} L${bkR.toFixed(1)} ${(bkY+6).toFixed(1)}" fill="none" stroke="${cMut}" stroke-width="1"/>`
    + T((bkL+bkR)/2, bkY-6, `Improvement potential  ~${totalOpt.toFixed(1)} FTE`, 10, cTxt, 800)
    + svgBody;

  const XL=[['Total scope','today'],['Addressable now','clears the readiness bar'],['After the enablers','scoped but gated'],['Not yet identified','still to scope'],['Remaining scope','if all captured']];
  svgBody += XL.map((p,i)=>T(wfCx(i),wfPT+wfPH+16,p[0],9.5,i===1?cGreen:i===2?cAmber:cTxt,700)+T(wfCx(i),wfPT+wfPH+28,p[1],8,cMut,600)).join('');

  const svg=`<svg viewBox="0 0 ${wfW} ${wfH}" width="100%" style="max-height:100%;" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${svgBody}</svg>`;
  return { svg, grps, cov, totActFte, totalOpt, oppSum, nowFte, laterFte, notYet, wfEnd:r3, cGreen };
}
// ===================== TEAM · IMPROVEMENT POTENTIAL TAB =====================

function potentialPage(t){

  const mid=o=>(o.fte[0]+o.fte[1])/2;

    fte:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M16 20v-2a4 4 0 0 0-8 0v2"/><circle cx="12" cy="8" r="3.6"/></svg>',
    pot:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>',
    act:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',

  };

  const kpi=`<div class="kpi-boxes" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px;">
      ${tile('Total scope',W.totActFte.toFixed(1),'FTE across '+t.activities.length+' activities',ic.fte)}
      ${tile('Improvement potential',W.totalOpt.toFixed(1),'FTE · '+Math.round(W.totalOpt/Math.max(0.1,W.totActFte)*100)+'% of scope',ic.pot,true)}
      ${tile('Addressable now',W.nowFte.toFixed(1),'FTE · clears the AI readiness bar',ic.imp,true)}
      ${tile('After the enablers',W.laterFte.toFixed(1),'FTE · waiting on the foundation',ic.act)}
    </div>`;

  const H=430;
  const wfCard=`<div class="card span4" style="display:flex;flex-direction:column;height:${H}px;">

        <span style="font-size:var(--fs-10);color:var(--muted);">hover a bar for the detail behind it</span></div>
      <div style="flex:1;position:relative;min-height:0;display:flex;align-items:stretch;justify-content:center;">${W.svg}</div>
    </div>`;

  // the levers rail — grouped by lever, one line per initiative. The dot is the waterfall's own
  // green/amber, so a row reads back to the bar it sits in. Full detail is on the Opportunities tab.
  // Largest-remainder rounding, so what is printed adds up: the lever figures sum to the printed
  // total and the shares sum to 100. Rounding each one on its own drifts by a tenth and shows.
  const share=(vals,total)=>{
    const base=vals.map(v=>Math.floor(v*total/Math.max(1e-9,vals.reduce((a,c)=>a+c,0))));
    const exact=vals.map(v=>v*total/Math.max(1e-9,vals.reduce((a,c)=>a+c,0)));
    let rem=total-base.reduce((a,c)=>a+c,0);
    exact.map((v,i)=>[v-base[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{ if(rem>0){ base[i]++; rem--; } });
    return base;
  };
  const gTenths=share(W.grps.map(g=>g.fte), Math.round(W.oppSum*10));
  const gPct=share(W.grps.map(g=>g.fte), 100);
  const byGrp=W.grps.map((g,i)=>({ ...g, no:i+1, shown:gTenths[i]/10, pct:gPct[i],
    list:opps.filter(o=>ttOf(o)===g.k).sort((a,b)=>mid(b)-mid(a)) }));
  const oppRow=o=>{ const ok=readinessModel(o,t).verdict==='act';
    return `<tr class="lv-o"><td class="lv-nm">${esc(o.activity||o.name||'Opportunity')}</td>
        <td class="lv-wh"><span class="lv-dot" style="background:${ok?'#006843':'#B8620A'}"></span>${ok?'now':'later'}</td>
        <td class="lv-f">${fmtFte(o.fte)}</td></tr>`; };
  const grpRow=g=>`<tr class="lv-g"><td colspan="2">
        <span class="gno" style="background:${g.dot}">${g.no}</span><span class="lv-gn">${esc(g.label)}</span>

      </td><td class="lv-f" style="color:${g.dot};">~${g.shown.toFixed(1)}</td></tr>`;
  const lvCard=`<div class="card span2" style="display:flex;flex-direction:column;height:${H}px;">
      <div class="ch"><div class="ct">Improvement levers</div>
        <button class="ov-gobtn" onclick="QS.setTeamSub('opportunities')">Detail →</button></div>
      <div style="flex:1;overflow-y:auto;min-height:0;">
      <table class="pot-tbl lv-tbl">
        <thead><tr><th>Lever &amp; initiative</th><th>When</th><th class="r">FTE</th></tr></thead>
        <tbody>
        ${byGrp.length?byGrp.map(g=>grpRow(g)+g.list.map(oppRow).join('')).join(''):'<tr><td colspan="3" class="rdy-none">No opportunities scoped yet.</td></tr>'}
        <tr class="tot"><td class="a">Identified, bottom-up</td><td></td>
          <td class="lv-f" style="color:var(--green);">~${(Math.round(W.oppSum*10)/10).toFixed(1)}</td></tr>
        </tbody>
      </table></div>
    </div>`;

  return `<div class="dd-section"><div class="eyebrow">Improvement potential</div>
      ${kpi}<div class="dd6">${wfCard}${lvCard}</div></div>`;
}
// ===================== TEAM · AI READINESS TAB =====================
// The lean maturity tab answers "how well does this team run today?". This one answers
// "can this team put AI to work, and if not, what is in the way?" — the same six dimensions,
// scored once, read against the minimum AI needs of each. It picks the lever; the potential sizes it.
const RDY_BAR=3;   // the AI readiness bar — the same threshold readinessModel() uses
const rdyEsc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rdyDimLabel=k=>((DIMS.find(d=>d.key===k)||{}).label||k);
function rdyGateMap(t){ const m={}; readinessGates(t).forEach(g=>m[g.key]=g); return m; }
function rdyOpps(t){
  const o=t.opps||[], mid=a=>a.reduce((s,x)=>s+(x.fte[0]+x.fte[1])/2,0);
  const ready=o.filter(x=>readinessModel(x,t).verdict==='act');
  const held=o.filter(x=>readinessModel(x,t).verdict!=='act');
  return { ready, held, readyFte:mid(ready), heldFte:mid(held) };
}
const RDY_Q={ run:'Can AI run at all?', land:'Can the saving be materialised?', scale:'Can the solution be properly embedded?', aim:'Are we investing in the right solution?' };
const RDY_GROUPS=[['run',['data']],['land',['org','mgmt']],['scale',['proc','mind']],['aim',['cust']]];
const RDY_ROLE={ run:'hard gate', land:'value gate', scale:'embedding gate', aim:'aims the work' };
// Six scores against one threshold, grouped under the question each dimension answers.
// Built in HTML/CSS rather than SVG so it fills the card at any width, and so every bar can carry a tooltip.
function rdyChartHTML(t){
  const G=rdyGateMap(t);
  const SC=87;                       // a 5 tops out at 87% of the plot, leaving headroom for the value labels
  const pc=v=>v/5*SC;
  let y=''; for(let v=0;v<=5;v++) y+=`<span style="bottom:${pc(v)}%">${v}</span>`;
  let gl=''; for(let v=0;v<=5;v++) gl+=`<div class="rdyc-gl${v===0?' zero':''}" style="bottom:${pc(v)}%"></div>`;
  let cols='', xs='', gs='', ci=0;
  RDY_GROUPS.forEach(([gk,keys])=>{
    const g=G[gk], col=gk==='aim'?'#98A2B3':g.st.color, st=gk==='aim'?'NOT A GATE':g.st.label.toUpperCase();
    const gStart=2+ci;
    keys.forEach(k=>{
      const cIdx=2+ci; ci++;
      const v=t.scores[k], below=gk!=='aim'&&v<RDY_BAR, h=pc(v);
      const tipRows=[
        ['Question', RDY_Q[gk]],
        ['Verdict', gk==='aim' ? 'Not a gate — it aims the work' : (below?`${RDY_BAR-v} below the AI readiness bar`:'Meets the AI readiness bar')],
      ];
      const why=(t.rationale||{})[k]||'';
      cols+=`<div class="rdyc-col" style="grid-column:${cIdx-1}" data-rk="${k}"`
        +` data-t="${rdyEsc(rdyDimLabel(k))}" data-v="${v} / 5"`
        +` data-rows="${rdyEsc(tipRows.map(r=>r[0]+'§'+r[1]).join('¶'))}"`
        +` data-why="${rdyEsc(why)}">`
        +(below?`<div class="rdyc-gap" style="bottom:${h}%;height:${pc(RDY_BAR-v)}%"></div>`:'')
        +`<div class="rdyc-b" style="height:${h}%;background:${gk==='aim'?'#C7CDD4':scoreColor(v)}"></div>`
        +`<div class="rdyc-v" style="bottom:calc(${h}% + 7px);color:${below?'#C0392B':'var(--navy)'}">${v}</div>`
        +`</div>`;
      xs+=`<div class="rdyc-x" style="grid-column:${cIdx}">${rdyDimLabel(k)}</div>`;
    });
    gs+=`<div class="rdyc-g" style="grid-column:${gStart} / span ${keys.length};color:${col}">`
      +`<i style="background:${col}"></i><b>${RDY_Q[gk]}</b><small>${st}</small></div>`;
  });
  return `<div class="rdyc">
      <div class="rdyc-y">${y}</div>
      <div class="rdyc-plot">${gl}${cols}<div class="rdyc-line" style="bottom:${pc(RDY_BAR)}%"></div></div>
      <div class="rdyc-note"><span style="bottom:${pc(RDY_BAR)}%">AI READINESS<br>BAR</span></div>
      ${xs}${gs}
    </div>`;
}
// What a sub-score means for putting AI to work — ONE line per sub-dimension, built from the
// team's own evidence and branched on the score, so a strong score never reads as a weakness.

function rdySubInsight(t, dim, name, score){
  const lo=score<=2, hi=score>=4;

  const top=[...acts].sort((a,b)=>b.fte-a.fte)[0]||{};
  const Ks=acts.filter(a=>a.nature==='K'), Ss=acts.filter(a=>a.nature==='S'), Rs=acts.filter(a=>a.nature==='R');
  const judg=Ks[0]||Ss[0]||top;
  const rote=[...Rs].sort((a,b)=>b.fte-a.fte)[0]||top;
  const q=x=>'“'+(x||'the core step')+'”';
  const cap=x=>x?x.charAt(0).toUpperCase()+x.slice(1):x;

  const bad=dn.filter(x=>x[2]!=='reliable'), unavail=dn.filter(x=>x[2]==='unavailable'), good=dn.filter(x=>x[2]==='reliable');
  const src=x=>(x&&x[1]&&x[1]!=='—')?' from '+x[1]:'';                 // never print the em-dash placeholder
  const goodList=j2(good.map(x=>x[0].toLowerCase()))||'the core inputs';
  const badList=j2(bad.map(x=>x[0].toLowerCase()))||'some inputs';
  const tools=t.tools||[];
  const shadow=tools.filter(x=>x[2]==='shadow'), gapT=tools.filter(x=>x[2]==='gap'), core=tools.filter(x=>x[2]==='core');
  const coreList=j2(core.map(x=>x[0]))||'the core system';
  const shadowList=j2([...shadow,...gapT].map(x=>x[0]))||'spreadsheets';
  const S=(a,b,c)=>lo?c:(hi?a:b);                                      // high · middle · low

  const M={
  // ---- DATA · can AI run at all?
  'Data availability & completeness': S(
    `Inputs sit where the work happens — ${goodList} ${pl(good)?'are':'is'} there to train on${unavail.length?`; only ${unavail[0][0].toLowerCase()} would still have to be sourced`:''}`,
    `Enough to start on ${goodList}, but ${badList} needs topping up by hand before a model can use it`,

    `Consistent enough to act on a model's output without re-checking it by hand`,

  'System integration maturity': S(

    `${gapT[0]?gapT[0][0]+' is not connected':'Systems are siloed'}, so anything AI produces has to be re-keyed to be used`),
  'Tooling fit': S(
    `${coreList} can host a model where the work is actually done`,
    `The core tools fit, but ${shadowList} ${pl([...shadow,...gapT])?'sit':'sits'} outside them — a model built on the core would miss part of the work`,
    `The work runs on ${shadowList}, so there is no system for a model to plug into`),
  'Analytics & reporting maturity': S(
    `The team already reasons from data, so a model's output gets read and challenged rather than trusted blindly`,
    `Standard reporting is there; the team would need help reading what a model tells them`,
    `Reporting is manual and backward-looking — no one could tell whether a model was working`),

  'Structural fit': S(

  'Spans & layers': S(
    `Spans let supervisors see freed time and move it`,
    `Spans are wide enough that redeployment gets little attention`,
    `Layers absorb the gain before it reaches capacity planning`),
  'Role clarity & specialisation': S(
    `Clear roles make it obvious whose work AI changes`,
    `Roles overlap, so a saving spreads thinly across several people`,
    `Roles are blurred — hard to say whose time is actually freed`),
  'Capacity & skills mix': S(
    `The skills to run and maintain a solution are already in the team`,
    `The skills sit in pockets; keeping a solution running would need support`,
    `No one in the team could keep a solution running once the project ends`),
  // ---- MANAGEMENT SYSTEMS · can the saving be materialised?
  'KPI relevance & alignment': S(
    `The team measures what AI would change, so a saving shows up in numbers people already watch`,
    `KPIs sit beside the work rather than on it — a saving would need a new measure to be seen`,
    `Nothing measures the hours AI would free, so the gain stays invisible`),
  'Performance management routines': S(
    `Routines review performance often enough that freed hours get noticed and reallocated`,

    `No routine would pick the freed hours up; they quietly fill with other work`),
  'Capacity & workload management': S(
    `Capacity is planned, so hours AI frees can be moved to where they are needed`,
    `Capacity is tracked at team level only, which makes freed hours hard to place`,
    `Without a view of capacity, a saving cannot be turned into anything`),
  'Decision rights & accountability': S(
    `Someone close to the work can act on what a model recommends without escalating`,
    `Decision rights are clear at the top but thin where a model would be used`,
    `It is unclear who may act on a model's output, so recommendations stall`),
  'Continuous improvement structure': S(
    `There is a routine that would keep improving a solution after go-live`,
    `Improvement comes in bursts, and a model would drift between them`,
    `Nothing would maintain a model once the project team leaves`),
  // ---- PROCESSES · can the solution be properly embedded?
  'Process clarity & standardisation': S(
    `The work is standard enough that one solution covers most cases`,
    `Standard on the common path; edge cases would still come back to a person`,
    `Routing rules live with individual operators, so there is no single way of working for AI to learn`),
  'Value-adding ratio': S(
    `Most hours already land on value-adding work, so the prize here is sharper judgement rather than volume`,
    `Recurring admin still absorbs real capacity — clear ground for automation`,
    `${q(rote.name)} takes ${rote.pct?rote.pct+'% of team effort':'most of the effort'} on admin, the biggest single target for AI here`),
  'E2E handoff quality': S(
    `Context carries across handoffs, so a model sees the whole case rather than a fragment`,
    `Some context is lost at the handoffs, so a model would work from a partial picture`,
    `Work is re-keyed at each step — AI would automate one link and leave the rest untouched`),
  'Volume & demand variability': S(
    `${q(top.name)} runs at ${top.volume||'high, steady volume'} — the repetition is what makes automation pay back`,
    `Volume supports a business case, but the peaks would need handling`,
    `Volume is too thin or too erratic for automation to pay back`),
  'Exception & error rate': S(
    `Exceptions are rare and root-caused, so a model would not be fighting noise`,
    `Exceptions still take real effort, so a model needs a clear fallback path`,
    `So many cases fall outside the norm that a model would hand most of them back`),
  // ---- MINDSET & BEHAVIOURS · can the solution be properly embedded?
  'Change openness': S(
    `The team takes change constructively — adoption is not the risk here`,
    `Openness is tempered by change fatigue, so adoption needs deliberate support`,
    `Past roll-outs that added work make it likely a new tool gets worked around`),
  'AI & digital appetite': S(
    `The appetite is real — informal pilots already run alongside ${coreList}`,
    `Curiosity is there but adoption is early; expect a slow start`,
    `Appetite is low, so a solution would have to be pushed rather than pulled`),
  'Empowerment & initiative': S(
    `People can change how they work, so a pilot can spread on its own`,
    `Initiative exists but needs permission, so spread depends on the sponsor staying close`,
    `Nothing changes without approval, so a pilot stays where it was built`),
  'Leadership modeling': S(
    `Leaders use the new ways of working themselves, which is what makes a pilot stick`,
    `Leaders endorse change without visibly working that way themselves`,
    `Leaders are not visibly behind new ways of working, so neither is the team`),
  'Learning culture': S(
    `The team picks things up fast, so time-to-competence on a new tool is short`,
    `Learning happens on the job; a roll-out would need structured support`,
    `No time is set aside to learn, so the capability stays with whoever built it`),
  // ---- CUSTOMER · aims the work rather than gating it
  'Understanding of customer (segments) & expectations': S(
    `Clear segments mean AI can be aimed at the cases that carry the most value`,
    `Segments are only loosely defined, which makes it harder to aim AI at the right cases`,
    `Without segments, AI effort spreads evenly instead of landing where value is`),
  'Client satisfaction & quality of customer touchpoints': S(
    `Experience is measured end to end, so the effect of AI on customers would be visible`,
    `Metrics are collected but seldom acted on, so a change in experience would pass unnoticed`,
    `There is no closed loop, so a shift in customer experience would go undetected`),
  'Demand understanding': S(
    `The drivers of demand are understood, which is what makes prediction worth building`,
    `Demand is only partly understood, so a predictive case is harder to size`,
    `Reasons for contact are guesswork, so there is nothing solid to predict from`),
  'Customer centricity in decisions': S(
    `Customer impact is an explicit criterion, so AI gets aimed at real pain`,
    `Customer impact is weighed, but cost usually wins the argument`,
    `Decisions favour internal convenience, so AI would be aimed at cost alone`),
  };
  return M[name] || S(
    `Strong enough here not to hold ${q(judg.name)} back`,
    `Workable, but it would need attention before a solution is rolled out`,
    `Weak enough here to hold a solution back`);
}
