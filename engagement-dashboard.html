.qsx .hm-colh{ padding:9px 6px; text-align:center; font-size:var(--fs-95); font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); background:var(--surface-2); border-radius:7px 7px 0 0; line-height:1.25; cursor:default; }
.qsx .hm-rowh{ display:flex; flex-direction:column; justify-content:center; padding:8px 12px; background:var(--surface-2); border-radius:8px 0 0 8px; cursor:pointer; transition:background .2s; }
.qsx .hm-rowh:hover{ background:var(--s4); }

.qsx .vct-ongbig{font-size:12px;font-weight:800;color:var(--muted);margin:2px 0 4px}

.qsx .vct-pot{font-size:var(--fs-11);color:var(--muted);margin-bottom:11px}
.qsx .vct-pot b{color:var(--text);font-weight:800}
.qsx .vct-sec{font-size:var(--fs-8);font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted-2);margin-bottom:7px}
.qsx .vct-dims{margin-bottom:11px}
.qsx .vct-dr{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.qsx .vct-dr:last-child{margin-bottom:0}
.qsx .vct-dl{font-size:var(--fs-10);color:var(--muted);width:90px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qsx .vct-bk{flex:1;height:8px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.qsx .vct-bk i{display:block;height:100%;border-radius:3px}
.qsx .vct-dv{font-family:var(--fh,inherit);font-size:var(--fs-10);font-weight:900;width:9px;text-align:right;color:var(--text)}
.qsx .vct-lead{font-size:var(--fs-105);color:var(--muted);display:flex;align-items:center;gap:6px;padding:9px 0;border-top:1px solid var(--border-heavy);border-bottom:1px solid var(--border-heavy);margin-bottom:9px}
.qsx .vct-lead b{color:var(--text);font-weight:800}
.qsx .vct-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.qsx .vct-ki{list-style:none;margin:0;padding:0}
.qsx .vct-ki li{font-size:var(--fs-10);color:var(--muted);line-height:1.3;display:flex;align-items:flex-start;gap:6px;margin-bottom:4px}
.qsx .vct-kd{width:5px;height:5px;border-radius:50%;margin-top:4px;flex-shrink:0}
.qsx .vct-ki li:last-child{margin-bottom:0}
.qsx{font-family:var(--fb);}

.qs-switch { display:flex; align-items:center; gap:8px; margin:-2px 0 14px; }
.qs-switch-t { font-family:var(--fh); font-weight:800; font-size:17px; letter-spacing:-.01em; margin-top:2px; }
.qs-switch-sp { flex:1; }
.qs-seg { font-family:var(--fb); font-size:var(--fs-115); font-weight:700; padding:8px 14px; border-radius:9px;
  border:1px solid var(--divider); background:var(--surface); color:var(--muted); cursor:pointer;
  transition:all .2s var(--ease); }
.qs-seg:hover { color:var(--text); border-color:var(--border-heavy); }
.qs-seg.on { background:var(--green); border-color:var(--green); color:#fff; }
.qsx .tdd-bar { margin-top:0; }

.qsx.qs-flow, .qsx.qs-flow #page-summary { display:block; height:auto; overflow:visible; padding:0; }
.qsx.qs-flow #page-summary > * { max-width:none; }

.qsx .diag-side:not(:empty){ margin-top:10px; border-top:1px solid var(--divider); padding-top:10px; }

.qsx .tdd-bar{ display:none !important; }
#topbar .tb-team{ display:flex; align-items:center; gap:10px; min-width:0; }
#topbar .tb-team .nm{ font-family:var(--fh); font-weight:800; font-size:15px; letter-spacing:-.01em;
  white-space:nowrap; }
#topbar .tb-team .mt{ font-size:var(--fs-11); color:var(--muted); white-space:nowrap; }
#topbar .tb-sel{ display:flex; align-items:center; gap:4px; }
#topbar .tb-sel select{ font-family:var(--fb); font-size:12px; font-weight:600; color:var(--text);
  background:var(--surface); border:1px solid var(--divider); border-radius:8px; padding:7px 9px;
  max-width:210px; cursor:pointer; }
#topbar .tb-step-btn{ width:28px; height:28px; border-radius:8px; border:1px solid var(--divider);
  background:var(--surface); color:var(--muted); cursor:pointer; font-size:14px; line-height:1;
  display:flex; align-items:center; justify-content:center; }
#topbar .tb-step-btn:hover{ color:var(--green); border-color:var(--green-soft); }
.qsx .tsub-nav{ margin-top:0; }
.qs-modebar{ display:flex; align-items:center; gap:8px; }
</style>

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   NARROW SCREENS — phone and small tablet.
   Below 900px the sidebar slides off-canvas behind a burger, so #main gets the
   full width and every other breakpoint in this file finally measures the space
   the content actually has (until now they all fired ~212px too late).
   ═══════════════════════════════════════════════════════════════════════════ */
@media (max-width:900px){
  :root{
    --fs-7:11px; --fs-8:11px; --fs-85:11px; --fs-9:11px; --fs-95:11px;
    --fs-10:11.5px; --fs-105:12px; --fs-11:12px; --fs-115:12.5px;
  }
}
#sb-burger { display:none; width:38px; height:38px; border-radius:10px; border:1px solid var(--divider);
  background:var(--surface); color:var(--text); align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
#sb-burger svg { width:19px; height:19px; }
#sb-scrim { display:none; position:fixed; inset:0; background:rgba(15,43,82,.42); z-index:99;
  opacity:0; transition:opacity .22s var(--ease); }
#sb-scrim.open { display:block; opacity:1; }

@media (max-width:900px){
  #sidebar { transform:translateX(-100%); transition:transform .26s var(--ease); box-shadow:0 0 44px rgba(15,43,82,.35); }
  #sidebar.open { transform:none; }
  #main { margin-left:0; }
  #sb-burger { display:flex; }
  #topbar { padding:0 14px; gap:11px; }
  #tb-title { font-size:13.5px; }
  #tb-sub { font-size:var(--fs-10); }
  .page { padding:14px 14px 40px; }

  #topbar.teammode { height:56px; padding:0 14px 0 0; }
  #topbar.teammode #sb-burger { display:flex; margin-left:12px; }
  .tbt-rail { width:4px; }
  .tbt-dd { margin-left:8px; }
  .tbt-av { width:29px; height:29px; font-size:var(--fs-105); }
  .tbt-nm { font-size:13.5px; }
  .tbt-nm .tb-pill { display:none; }
  .tbt-mets, .tbt-step { display:none; }
  .tbt-menu { left:auto; right:0; min-width:min(300px,calc(100vw - 28px)); }

  .kpi-row, .kpi-boxes, .g3, .f3, .dd-grid, .setup-grid, .start-cards, .stages, .vsplit,
  .finding-grid, .ov-grid, .ovsplit, .cfg-pv-row, .ov-kvs, .t3 { grid-template-columns:minmax(0,1fr) !important; }
  .ov-grid { grid-template-areas:'obj' 'setup' 'scope' 'con' 'ass' 'vc' !important; }
  .qsx .dd6, .qsx .diag-row, .qsx .summary-split, .qsx .prog-charts, .qsx .tdd-tiles,
  .qsx .road-grid, .qsx .prio-grid { grid-template-columns:minmax(0,1fr) !important; }
  .qsx .card.span3, .qsx .card.span6 { grid-column:auto !important; }
  /* cards that are height-clamped on desktop scroll internally; on a phone let them grow */
  .qsx #page-teams .card[style*="clamp(300px"], .qsx #page-teams .card[style*="height:560px"] { height:auto !important; }
  .qsx .ov-kp-tblwrap { overflow-y:visible; }
  /* a grid child defaults to min-content width, which a fixed-size chart then blows out */
  .qsx .dd6 > *, .kpi-boxes > *, .g3 > *, .dd-grid > *, .ov-grid > * { min-width:0 !important; }

  .ov-band { flex-direction:column; align-items:stretch; gap:13px; padding:14px; }
  .ov-stats { flex-wrap:wrap; gap:12px 0; }
  .ov-st { flex:1 1 45%; padding:0 12px 0 0; border-left:0; border-right:1px solid var(--divider); }
  .ov-st:nth-child(2n), .ov-st:last-child { border-right:0; }
  .ov-setupbtn { margin-left:0; align-self:flex-start; }
  .ov-vc { flex-direction:column; }
  .ov-vcs, .ov-vcs.first, .ov-vcs.last { border-radius:9px; padding-left:11px; margin-bottom:5px; }
  .ov-vcs::after { display:none; }

  .tbl-wrap, .cfg-wrap, .ov-kp-tblwrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  /* the value waterfall is drawn at a fixed width — let its wrapper clip rather than push */
  #ov-wf { max-width:100%; overflow-x:auto; }
  .ov-kp-tbl { min-width:440px; }
  .qsx .dd-section .card { padding:14px; }

  /* card headers carry a title, a stat and a button — let them wrap rather than spill */
  .ch, .qsx .ch, .sec2, .qsx .sec2 { flex-wrap:wrap; row-gap:6px; }
  /* inline flex rows inside cards: wrap rather than push the card wider than the screen */
  .qsx .card div[style*="display:flex"], .card div[style*="display:flex"] { flex-wrap:wrap; row-gap:6px; }
  .run { padding:13px 14px; }
  .trig { flex-wrap:wrap; }
  .cfg-appr-card { min-width:0 !important; }
  .eng-menu { left:6px; right:6px; }

  /* charts are drawn at a fixed width — let them shrink instead of pushing the page */
  .qsx .card svg, .qsx .dd6 svg, .card svg.wfsvg, #page svg:not(.tbt-chev):not(.ta-cv) { max-width:100%; }
  .qsx canvas, #page canvas { max-width:100% !important; }

  /* the value-chain board keeps its chevrons but scrolls sideways */
  .vc-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .vc-grid { min-width:620px; }
}

@media (max-width:560px){
  .ov-st { flex:1 1 100%; border-right:0; }
  .ov-kp-tbl thead th:nth-child(3), .ov-kp-tbl .kpi-it td:nth-child(3) { display:none; }
  .ov-kp-tbl { min-width:0; }
  .tbt-cr { display:none; }
  .tbt-nm { font-size:13px; }
  .page { padding:12px 12px 36px; }
  .qsx .tsub-nav, .tsub-nav { overflow-x:auto; -webkit-overflow-scrolling:touch;
    flex-wrap:nowrap !important; scrollbar-width:none; }
  .qsx .tsub-nav::-webkit-scrollbar { display:none; }
  .qsx .tsub, .tsub { white-space:nowrap; flex-shrink:0; }
}
</style>
</head>
<body>

<div id="sidebar">
  <div class="sb-brand">
    <div class="sb-logo">NR</div>
    <div class="sb-brand-txt"><b>Nova Reperta</b><span id="sb-mode">Engagement setup</span></div>
  </div>
  <div class="sb-nav" id="sb-nav"></div>
  <div class="sb-foot" id="sb-foot">No engagement loaded</div>
</div>

<div id="main">
  <div id="topbar">
    <button id="sb-burger" aria-label="Menu" onclick="toggleSidebar(event)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div id="tb-std"><div id="tb-title">Engagement</div><div id="tb-sub"></div></div>
    <div class="tb-right" id="tb-right"></div>
    <div id="tb-team"></div>
  </div>
  <div id="pages"><div class="page active" id="page"></div></div>
</div>

<div id="sb-scrim" onclick="closeSidebar()"></div>
<div class="scrim" id="scrim" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-head"><div><h3 id="panel-t"></h3><div class="sub" id="panel-s"></div></div>
    <button onclick="closePanel()">&times;</button></div>
  <div class="panel-body" id="panel-b"></div>
</div>
<div id="toast"></div>
<input type="file" id="loadfile" accept=".json,application/json" style="display:none" onchange="loadFile(this)">

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   METHODOLOGY — mirror of data/methodology.json (nr-inside-out / 2026.4) and

   ═══════════════════════════════════════════════════════════════════════════ */
const M = {

    {k:'proc',label:'Processes',   short:'Process',    col:'#2A4D8F'},

  offers:{
    proc:['lma','process-map'],

    data:['lma','data-maturity'],
    mind:['lma','team-barometer'],
    org :['lma','raci-diagnostic']
  },
  inst:{
    'lma':              {label:'Maturity scan (LMA)', type:'rated-wheel', cat:'maturity-engine', scoreSource:true, skill:'lma-builder', status:'in-build', trig:'run the LMA for {team}', note:'Scores the dimension. Every other analysis is evidence that makes that score defensible.'},
    'process-map':      {label:'Process map', type:'node-map', cat:'dimension', skill:'process-map-builder', status:'live', trig:'run the process map for {team}', note:'Walks the flow end to end: who does what, how much effort each step takes, and where it hurts.'},
    'nps-analysis':     {label:'Customer satisfaction', type:'matrix', cat:'dimension', skill:'voc-nps-analyser', status:'envisioned', trig:'run the NPS analysis for {team}', note:'What customers say about this team, and whether anyone acts on it.'},
    'service-blueprint': {label:'Service blueprint', type:'node-map', cat:'dimension', skill:'service-blueprint-builder', status:'live', trig:'run the service blueprint for {team}', note:'Maps one service the way the customer meets it: what they do and see above the line of visibility, what the team does below it, and the systems that carry it.'},
    'kano-analysis':    {label:'What customers actually value', type:'matrix', cat:'dimension', skill:'kano-analyser', status:'envisioned', trig:'run the KANO analysis for {team}', note:'Sorts what the team delivers into what customers expect, what delights them, and what nobody asked for.'},
    'wilo-analysis':    {label:'What leaders spend time on', type:'matrix', cat:'dimension', skill:'wilo-analyser', status:'envisioned', trig:'run the WILO analysis for {team}', note:'Where the team lead\u2019s week actually goes, against where it should go.'},
    'performance-wheel':{label:'Performance wheel', type:'rated-wheel', cat:'dimension', skill:'performance-wheel-builder', status:'live', trig:'run the performance wheel for {team}', note:'How the team is steered: targets, routines, decision rights — scored 1 to 5 against a fixed rubric.'},

    'kpi-cascade':      {label:'KPI cascade', type:'node-map', cat:'dimension', skill:'kpi-cascade-builder', status:'envisioned', trig:'build the KPI cascade for {team}', note:'Follows a performance indicator down from company level to the department, the team and the individual, and shows where the chain breaks.'},
    'data-maturity':    {label:'Data maturity assessment', type:'matrix', cat:'dimension', skill:'data-maturity-builder', status:'live', trig:'run the data maturity assessment for {team}', note:'Scores the data points the team works on, and reads each process off the weakest one it leans on: how much of the work AI can run on today, and what it would take to unblock the rest.'},

    if(E.assignment.aiEnabled && E.assignment.depth==='full-diagnostic' && !p.registers.includes('opportunity-register'))
      p.registers.push('opportunity-register');
  }
  const per={};
  inScopeTeams().forEach(t=>{
    const lenses={};
    DIMK.forEach(k=>{ const l=effInstruments(t.id,k); if(l.length) lenses[k]=l; });
    const d=teamDepth(t);
    per[t.id]={depth:d,lenses,baseline:p.baseline.slice(),registers:p.registers.slice(),
      ai:((M.approaches[d]||{}).ai||[]).slice()};
  });
  p.perTeam=per;
  E.methodology.approach=E.assignment.depth;
  return p;
}
function inScopeTeams(){ return (E&&E.teams||[]).filter(t=>t.inScope!==false && t.name); }
function scopeFte(){ return inScopeTeams().reduce((a,t)=>a+(+t.fte||0),0); }
function planCount(){
  const p=(E&&E.plan)||{}; let n=0;
  Object.values(p.perTeam||{}).forEach(t=>{
    n+=Object.values(t.lenses||{}).reduce((a,l)=>a+l.length,0);
    n+=(t.baseline||[]).length+(t.registers||[]).length;
  });
  return n+(p.crossCutting||[]).length;
}
function liveCount(){
  const s=new Set();
  Object.values((E.plan||{}).perTeam||{}).forEach(t=>{
    Object.values(t.lenses||{}).flat().concat(t.baseline||[],t.registers||[]).forEach(i=>s.add(i));
  });
  (E.plan.crossCutting||[]).forEach(i=>s.add(i));
  return [...s].filter(i=>(M.inst[i]||{}).status==='live').length;
}
function cellStats(){
  let o=[0,0,0,0], ov=0;
  inScopeTeams().forEach(t=>DIMK.forEach(k=>{ o[depthOf(effInstruments(t.id,k),k)]++; if(isOverridden(t.id,k)) ov++; }));
  return {off:o[0],quick:o[1],diag:o[2],cells:inScopeTeams().length*6,ov};
}

/* ═══════════════════════════════════════════════════════════════════════════
   FINDINGS — reading stage 3
   The configurator builds an empty frame: teams, divisions, value-chain stages.
   Claude fills E.results as analyses land. Every number below is derived on read,
   never stored, so a half-finished engagement draws correctly and honestly.
   ═══════════════════════════════════════════════════════════════════════════ */
function RES(){ const r=(E&&E.results)||{}; return {teams:r.teams||{}, opportunities:r.opportunities||[], updatedAt:r.updatedAt||''}; }
function tRes(id){ return RES().teams[id]||null; }
function scored(id){ const r=tRes(id); return !!(r&&r.scores&&DIMK.some(k=>+r.scores[k]>0)); }
function overall(id){
  const r=tRes(id); if(!scored(id)) return 0;
  let s=0,w=0; DIMK.forEach(k=>{ const wt=+((E.weights||{})[k]||1); s+=(+r.scores[k]||0)*wt; w+=wt; });
  return w?s/w:0;
}
function dimAvg(k){
  const t=assessed(); if(!t.length) return 0;
  return t.reduce((a,x)=>a+(+tRes(x.id).scores[k]||0),0)/t.length;
}
function assessed(){ return inScopeTeams().filter(t=>scored(t.id)); }
function opps(filter){ return RES().opportunities.filter(o=>o&&(!filter||filter(o))); }
function oppsOf(tid){ return opps(o=>o.team===tid); }
function fteOf(o){ const f=o.fte||[0,0]; return (( +f[0]||0)+(+f[1]||0))/2; }
function teamFte(tid){ return oppsOf(tid).reduce((a,o)=>a+fteOf(o),0); }
function totalFte(){ return opps().reduce((a,o)=>a+fteOf(o),0); }
function anyFindings(){ return assessed().length>0 || opps().length>0; }
/* the score bands, identical to the quickscan's stops */
function scoreColor(v){ return v>=4.2?'var(--s5-t)':v>=3.4?'var(--s4-t)':v>=2.6?'var(--s3-t)':v>=1.8?'var(--s2-t)':'var(--s1-t)'; }
function scoreBg(v){ return v>=4.2?'var(--s5)':v>=3.4?'var(--s4)':v>=2.6?'var(--s3)':v>=1.8?'var(--s2)':'var(--s1)'; }
function readiness(v){ return v>=3.3?['Ready','var(--s5-t)','var(--s5)']:v>=2.8?['Developing','var(--s2-t)','var(--s2)']:['Foundation','var(--s1-t)','var(--s1)']; }
function lev(k){ return M.levers[k]||{label:'Not decided yet',bg:'var(--surface-2)',t:'var(--muted)',dot:'var(--muted-2)'}; }
/* the dominant verdict in a set of opportunities — the one carrying the most FTE */
function dominantLever(list){
  const by={}; (list||[]).forEach(o=>{ if(o.lever) by[o.lever]=(by[o.lever]||0)+fteOf(o); });
  const e=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
  return e?e[0]:null;
}
function divisionsOf(){
  const seen=[], by={};
  inScopeTeams().forEach(t=>{ const d=t.division||'Unassigned';
    if(!by[d]){ by[d]=[]; seen.push(d); } by[d].push(t); });
  return seen.map(name=>({name,teams:by[name]}));
}
/* One chain's stages, with the teams standing on each. A team can appear on more than
   one chain (a shared claims desk serving two products) but only once per chain. */
function stagesOf(chainId){
  const c=chainOf(chainId); if(!c) return [];
  const st=(c.stages||[]).filter(Boolean); if(!st.length) return [];
  const teams=inScopeTeams();
  const list=st.map(name=>({name,teams:teams.filter(t=>placedOn(t,c.id)===name)}));
  const rest=teams.filter(t=>!placementsOf(t).length);
  if(rest.length && chainId===(VCS()[0]||{}).id) list.push({name:'Not placed yet',teams:rest,orphan:true});
  return list;
}
function chainOf(id){ return VCS().find(c=>c.id===id)||null; }
function placementsOf(t){ return (t.placements||[]).filter(p=>p&&p.stage&&chainOf(p.chain)); }
function placedOn(t,chainId){ const p=(t.placements||[]).find(x=>x&&x.chain===chainId); return p?p.stage:''; }
function setPlacement(t,chainId,stage){
  t.placements=(t.placements||[]).filter(p=>p&&p.chain!==chainId);
  if(stage) t.placements.push({chain:chainId,stage});
}
function horizonOf(o){ return (M.horizons.find(h=>h.k===o.horizon)||M.horizons[0]).k; }
/* the real months behind a horizon, once the engagement window is set */
function horizonWhen(h){
  const s=E.assignment.start; if(!s) return h.when;
  const d=x=>{ const t=new Date(s); if(isNaN(t)) return null; t.setMonth(t.getMonth()+x); return t; };
  const a=d(h.from), b=d(h.to); if(!a||!b) return h.when;
  const f=t=>MON[t.getMonth()]+' '+t.getFullYear();
  return f(a)+' – '+f(b);
}
/* ── the value case, from the numbers on Value assumptions ── */
function valueCase(){
  const v=E.valueInputs||{}, cost=+v.costPerFte||0, real=(+v.realise||100)/100, impl=+v.implPerFte||0;
  const fte=totalFte(), annual=fte*cost*real, invest=fte*impl;
  const cum=M.horizons.reduce((a,h)=>a+opps(o=>horizonOf(o)===h.k).reduce((x,o)=>x+fteOf(o),0)*cost*real*h.ramp,0);
  return {fte, annual, invest, cum, payback: annual>0 ? invest/(annual/12) : 0, cost, real, impl};
}
const eur=n=> n>=1e6?'€'+(n/1e6).toFixed(1)+'M' : n>=1e3?'€'+Math.round(n/1e3)+'k' : '€'+Math.round(n);

/* ── validation ── */
function issues(){
  const out=[];
  if(!E.client.trim())          out.push({k:'client',s:'The client name is empty.'});
  if(!E.id.trim())              out.push({k:'id',s:'No engagement id — that is the folder name and the baseline join key.'});
  if(!E.scope.statement.trim()) out.push({k:'scope',s:'No scope statement. Claude will ask for one before it sets anything up.'});
  if(!inScopeTeams().length)    out.push({k:'teams',s:'No teams in scope.'});
  const dup=E.teams.map(t=>t.id).filter((v,i,a)=>v&&a.indexOf(v)!==i);
  if(dup.length)                out.push({k:'dup',s:'Duplicate team ids: '+[...new Set(dup)].join(', ')+'. Ids are the baseline join key and must be unique.'});
  const noFte=inScopeTeams().filter(t=>!(+t.fte));
  if(noFte.length)              out.push({k:'fte',soft:1,s:noFte.length+' team'+(noFte.length>1?'s have':' has')+' no FTE estimate. Allowed — the org baseline sets the factual number — but the value case stays unquantified until it runs.'});
  const deepTeams=inScopeTeams().filter(t=>teamDepth(t)==='full-diagnostic').length;
  if(E.assignment.type==='opex-quickscan'&&deepTeams)
    out.push({k:'mix',soft:1,s:deepTeams+' team'+(deepTeams>1?'s are':' is')+' set to full-diagnostic depth inside a quickscan. Deliberate is fine — the plan is what counts — but check the timeline.'});
  const offCells=cellStats().off;
  if(offCells) out.push({k:'off',soft:1,s:offCells+' team-and-dimension combination'+(offCells>1?'s have':' has')+' nothing planned. Those dimensions will carry no score for that team.'});
  return out;
}

/* ── export ── */
function buildExport(){
  derivePlan();
  const o=JSON.parse(JSON.stringify(E));
  delete o._planTouched;
  o.teams=o.teams.filter(t=>t.name&&t.id).map(t=>({
    id:t.id,name:t.name,dept:t.dept||'',division:t.division||'',placements:placementsOf(t),
    fte:(+t.fte||null),hc:(+t.hc||null),lead:t.lead||'',email:t.email||'',
    priority:+t.priority||null,inScope:t.inScope!==false,depth:t.depth||null,note:t.note||''
  }));
  o.divisions=[...new Set(o.teams.map(t=>t.division).filter(Boolean))]
    .map(n=>({name:n,teams:o.teams.filter(t=>t.division===n).map(t=>t.id)}));
  o.createdAt=o.createdAt||todayISO();
  return o;
}
function PROMPT(){ return `Set up this NR engagement from the configurator export below.

Before you build anything:
1. Challenge the scope. If it is too vague to defend in a steering committee, say what you would need.
2. Flag any team set deeper or lighter than the assignment warrants, and any team with no FTE estimate.
3. Answer the open questions at the bottom of the export, or tell me who has to answer them.

Then:
4. Set the engagement up for "${E.id||'<id>'}" and register every team in scope so the later analyses can find them.
5. Save the engagement as active, with the open questions cleared.
6. Come back with a one-page plan — which analysis, on which team, in which week.

As the work then runs, write what you find back into the "results" block of this same file, and
give it back to me so the dashboard can show it:
- results.teams[<team id>] = { scores: {proc,cust,mgmt,data,mind,org — each 1 to 5},
    lever: <how to fix it>, fteImpact: [low,high], finding: <one sentence>, status: "validated" }
- results.opportunities[] = { id, team: <team id>, title, lever, horizon: "0-6m" | "6-12m" | "12-24m",
    fte: [low,high] }
Never invent a score or an opportunity. A team with nothing in results simply shows as still being
assessed, which is the truth.

Propose first. Do not write anything until I approve it.

--- the setup ---
`; }
function download(){
  const b=new Blob([JSON.stringify(buildExport(),null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='engagement.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast('Setup file saved');
}

/* ── load ── */
function loadFile(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ adopt(JSON.parse(r.result)); }catch(e){ toast('That file is not valid JSON.'); } };
  r.readAsText(f); inp.value='';
}
function adopt(o){
  E=normalise(o); derivePlan(); save();
  MODE='live'; go('exec'); toast('Engagement loaded — '+(E.client||E.id));
}
/* older files used five types plus a separate AI toggle; fold them into the three */
const OLD_TYPES={'ai-enabled-opex':'ai-first-redesign','future-state':'ai-first-redesign'};
const OLD_DEPTHS={'ai-enabled':'redesign'};
function mapType(a){
  if(OLD_TYPES[a.type]) return OLD_TYPES[a.type];
  if(M.types[a.type]) return a.type;
  if(a.aiEnabled) return 'ai-first-redesign';
  if(a.depth==='light-quickscan') return 'opex-quickscan';
  return 'opex-diagnostic';
}
function mapDepth(d){ return OLD_DEPTHS[d] || (M.approaches[d] ? d : 'full-diagnostic'); }
function normalise(o){
  if(o.schemaVersion===2||o.contract){
    o.plan=o.plan||{}; o.methodology=o.methodology||{ref:M.ref,version:M.version,approach:'full-diagnostic',overrides:{}};
    o.methodology.overrides=o.methodology.overrides||{};
    o.handoff=o.handoff||{assumptions:[],questions:[]};
    o.assignment=Object.assign(blank().assignment,o.assignment||{});
    o.assignment.type=mapType(o.assignment);
    o.assignment.depth=mapDepth(o.assignment.depth);
    o.scope=Object.assign(blank().scope,o.scope||{});
    /* 2026.10 shipped a single scope.valueChain; a client can have several */
    if(o.scope.valueChain && !(o.scope.valueChains||[]).length){
      const v=o.scope.valueChain;
      o.scope.valueChains=(v.stages||[]).filter(Boolean).length
        ? [{id:'vc1',name:v.label||'Value chain',stages:v.stages}] : [];
    }
    delete o.scope.valueChain;
    o.scope.valueChains=(o.scope.valueChains||[]).map((c,i)=>Object.assign({id:'vc'+(i+1),name:'Value chain',stages:[]},c));
    o.results=Object.assign({updatedAt:'',teams:{},opportunities:[]},o.results||{});
    (o.teams||[]).forEach(t=>{
      if(t.depth) t.depth=mapDepth(t.depth);
      if(!t.placements) t.placements = t.stage ? [{chain:'vc1',stage:t.stage}] : [];
      delete t.stage;
    });
    o.nrMembers=(o.nrMembers||[]).map(m=>Object.assign({skills:[]},m));
    o._planTouched=!!(o.plan.baseline||o.plan.registers);
    return Object.assign(blank(),o);
  }
  /* legacy schemaVersion 1 (the first-generation engagement file) */
  const c=blank(), e=o.engagement||{};
  c.id=o.id||slug(o.client||''); c.client=o.client||e.client||''; c.status=o.status||'active';
  c.assignment={type:'opex-diagnostic',aiEnabled:false,depth:(o.methodology&&o.methodology.approach)||'full-diagnostic',
    partner:'',lead:e.lead||'',sponsor:'',start:e.start||'',target:e.target||'',language:'en'};
  c.assignment.type=mapType(c.assignment);
  c.scope={statement:e.scope||'',entity:'',processes:[],objectives:[],outOfScope:[],constraints:e.notes?[e.notes]:[]};
  const div={}; (o.divisions||[]).forEach(d=>d.teams.forEach(t=>div[t]=d.name));
  const rich=(o.teams||[]).filter(t=>t&&t.id&&t.name);
  if(rich.length){
    c.teams=rich.map((t,i)=>({id:t.id,name:t.name,dept:t.dept||'',division:div[t.id]||t.division||'',placements:[],
      fte:(+t.fte||null),hc:null,lead:t.lead||'',email:t.email||'',priority:+t.priority||i+1,inScope:true,depth:null,note:''}));
    /* carry any findings the old file already held, so the summaries are not blank */
    rich.forEach(t=>{
      if(!t.scores) return;
      c.results.teams[t.id]={scores:t.scores,lever:t.lever||null,readiness:t.readiness||null,
        fteImpact:t.fteImpact||null,finding:t.finding||'',status:t.status||'validated'};
      (t.opps||[]).forEach((op,i)=>c.results.opportunities.push({
        id:t.id+'-'+(i+1), team:t.id, title:op.title||op.name||('Opportunity '+(i+1)),
        lever:op.lever||t.lever||null, horizon:op.horizon||'0-6m', fte:op.fte||[0,0]}));
    });
    c.results.updatedAt=todayISO();
  } else {
    const ids=[...new Set([].concat(...(o.divisions||[]).map(d=>d.teams),Object.keys(o.teamAssign||{})))];
    c.teams=ids.map((id,i)=>({id,name:id.toUpperCase(),dept:'',division:div[id]||'',placements:[],fte:null,hc:null,lead:'',email:'',priority:i+1,inScope:true,depth:null,note:''}));
  }
  c.divisions=o.divisions||[]; c.nrMembers=o.nrMembers||[]; c.teamAssign=o.teamAssign||{};
  c.methodology=Object.assign(c.methodology,o.methodology||{}); c.methodology.overrides=c.methodology.overrides||{};
  c.weights=o.weights||c.weights; c.valueInputs=o.valueInputs||c.valueInputs;
  c._legacy=true;
  return c;
}
</script>

function navFor(){ return MODE==='setup'?SETUP_NAV:MODE==='live'?LIVE_NAV:START_NAV; }

    </div>
    <div class="eng-menu" id="eng-menu">
      <div onclick="closeEngMenu();document.getElementById('loadfile').click()">${ico('up')}Open another</div>
      <div onclick="closeEngMenu();startNew()">${ico('plus')}Start a new one</div>
      ${window.__NR_ENGAGEMENT__?`<div onclick="closeEngMenu();loadSample()">${ico('layers')}Load the sample</div>`:''}
      <div class="sep"></div>
      <div class="danger" onclick="closeEngMenu();closeEng()">${ico('folder')}Close this one</div>
    </div>
  </div>`;
}
function engMenu(e){ e.stopPropagation(); const m=$('#eng-menu'); if(!m) return;
  const open=m.classList.toggle('open');
  if(open) setTimeout(()=>document.addEventListener('click',closeEngMenu,{once:true}),0);
}
function closeEngMenu(){ const m=$('#eng-menu'); if(m) m.classList.remove('open'); }

/* Each page's own action, in the topbar next to its title — so no page has to draw a
   second header just to hang a button on. */
const ACTIONS={
  s1:()=>nextBtn('s2'), s2:()=>nextBtn('s3'), s3:()=>nextBtn('s4'), s4:()=>nextBtn('s5'), s5:()=>nextBtn('s6')
};
/* a section header, with its own controls on the right */
const sec=(label,right)=>`<div class="sec2"><span class="eyebrow">${label}</span>${right?`<div class="sec2-a">${right}</div>`:''}</div>`;

function toggleSidebar(e){ if(e) e.stopPropagation();
  const open=$('#sidebar').classList.toggle('open');
  $('#sb-scrim').classList.toggle('open',open);
}
function closeSidebar(){ $('#sidebar')?.classList.remove('open'); $('#sb-scrim')?.classList.remove('open'); }
function go(k){
  closeSidebar();
  /* an unknown key used to render a silent blank page — land somewhere real instead.
     'scope' arrives here from older bookmarks: it was folded into the wave setup. */
  if(!PAGES[k]) k = MODE==='live'?'exec' : MODE==='setup'?'s1' : 'start';
  PAGE=k;
  if(!E && k!=='start' && k!=='how'){ k=PAGE='start'; }
  renderShell();
  const el=$('#page'); el.innerHTML=(PAGES[k]||(()=>''))(); el.scrollTop=0;
  el.classList.remove('active'); void el.offsetWidth; el.classList.add('active');
}
function startNew(){ E=blank(); addTeam(true); derivePlan(); save(); MODE='setup'; go('s1'); }
function finishSetup(){ if(!E) return; MODE='live'; go('overview'); }
function closeEng(){
  if(!confirm('Close this engagement? Nothing is deleted anywhere else \u2014 this only clears it from this browser.')) return;
  E=null; save(); try{ localStorage.setItem(LS_DEMO,'1'); }catch(e){}
  MODE='start'; go('start');
}
/* the file ships with a worked sample loaded; this puts it back */
function loadSample(){
  if(!window.__NR_ENGAGEMENT__) { flash('This file carries no sample engagement.'); return; }
  if(E && !confirm('Replace what is open with the sample engagement?')) return;
  try{ localStorage.removeItem(LS_DEMO); }catch(e){}
  E=normalise(JSON.parse(JSON.stringify(window.__NR_ENGAGEMENT__)));
  derivePlan(); save(); MODE = E.status==='configuring' ? 'setup' : 'live';
  go(MODE==='setup'?'s1':'exec');
}

/* field binder — writes state without re-rendering, so typing keeps focus */
function upd(path,v){
  set(E,path,v); save();
  if(path==='client'&&!E._idTouched){ E.id=slug(v); const el=$('#f-id'); if(el) el.value=E.id; }
  if(path==='client') renderEngBlock();
}
function updId(v){ E._idTouched=true; E.id=slug(v); save(); }
function field(label,path,o){
  o=o||{}; const v=get(E,path), t=o.type||'text';
  const bind=`oninput="upd('${path}',this.value${t==='num'?'===\'\'?null:+this.value':''})"`;
  return `<div class="field"><label>${label}</label>${
    t==='textarea'?`<textarea rows="${o.rows||3}" placeholder="${esc(o.ph||'')}" ${bind}>${esc(v||'')}</textarea>`
    :`<input type="${t==='num'?'number':t}" value="${esc(v==null?'':v)}" placeholder="${esc(o.ph||'')}" ${bind}>`}
    ${o.hint?`<span class="hint">${o.hint}</span>`:''}</div>`;
}
function bullets(path,ph){
  const arr=get(E,path)||[];
  return `<div>${arr.map((v,i)=>`<div class="bl-row"><span class="bd"></span>
    <input class="tinp" type="text" value="${esc(v)}" placeholder="${esc(ph||'')}" oninput="blSet('${path}',${i},this.value)">
    <button class="xb" onclick="blDel('${path}',${i})">&times;</button></div>`).join('')}
    <button class="addlink" onclick="blAdd('${path}')">+ add</button></div>`;
}
function blSet(p,i,v){ get(E,p)[i]=v; save(); }
function blDel(p,i){ get(E,p).splice(i,1); go(PAGE); }
function blAdd(p){ get(E,p).push(''); go(PAGE); }

/* side panel */
function openPanel(html,title,sub){ $('#panel-t').textContent=title; $('#panel-s').textContent=sub||''; $('#panel-b').innerHTML=html; $('#panel').classList.add('open'); $('#scrim').classList.add('open'); }
function closePanel(){ $('#panel').classList.remove('open'); $('#scrim').classList.remove('open'); }
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   PAGES
   ═══════════════════════════════════════════════════════════════════════════ */
const nextBtn=(k,label)=>`<button class="fchip go" onclick="go('${k}')">${label||'Continue'} &rarr;</button>`;
/* The topbar already names the page and says what it is for. A page adds a lead sentence
   only when it has something to teach — never a second copy of its own title. */
const lead=t=>t?`<p class="pagelead">${t}</p>`:'';

/* ── ready-made content, so nothing has to be typed from scratch ──────────── */
const OBJECTIVE_SUGGESTIONS=[
  'Quantify the operational potential in FTE',
  'Build a defensible business case for next year\u2019s budget',
  'Rank AI use cases by feasibility and impact',
  'Find the binding constraint on AI readiness',
  'Design the target operating model for the value chain',
  'Set a baseline we can measure improvement against',
  'Give every team lead a concrete improvement agenda',
  'Decide where to automate, where to redesign and where to leave alone',
  'Free capacity without touching service levels',
  'Agree one prioritised roadmap across the divisions'
];
const TEAM_EXAMPLES={
  'Insurance operations':[
    ['Customer Service','Indemnity & Service','Customer Experience',62,'Servicing'],
    ['Claims Handling','Indemnity & Service','Claims',48,'Claims'],
    ['Underwriting','Commercial','Commercial Lines',34,'Underwriting'],
    ['Policy Administration','Technical','Operations',28,'Servicing'],
    ['Finance & Control','Corporate','Finance',21,'Corporate & support']],
  'Financial services back office':[
    ['Client Onboarding','Client Lifecycle','Onboarding',26,'Onboarding & KYC'],
    ['KYC & Screening','Client Lifecycle','Compliance Ops',31,'Onboarding & KYC'],
    ['Settlements','Operations','Post-trade',44,'Operations & settlement'],
    ['Corporate Actions','Operations','Post-trade',22,'Operations & settlement'],
    ['Reconciliations','Operations','Control',18,'Operations & settlement']],
  'Shared services':[
    ['HR Services','Corporate','People',19,'Support'],
    ['Finance Operations','Corporate','Finance',27,'Billing & collections'],
    ['Procurement','Corporate','Sourcing',14,'Support'],
    ['IT Service Desk','Technology','Support',23,'Support']]
};
function addObjective(t){
  const a=E.scope.objectives=E.scope.objectives||[];
  if(!a.includes(t)) a.push(t);
  save(); go('s2');
}
function loadExampleTeams(key){
  (TEAM_EXAMPLES[key]||[]).forEach(([name,division,dept,fte,stage],i)=>{
    if(E.teams.some(t=>t.name===name)) return;
    const c=VCS().find(x=>(x.stages||[]).includes(stage));
    E.teams.push({id:autoId(name),name,dept,division,placements:c?[{chain:c.id,stage}]:[],fte,hc:null,lead:'',email:'',
      priority:E.teams.length+1,inScope:true,depth:null,note:''});
  });
  E.teams=E.teams.filter(t=>t.name);
  derivePlan(); save(); go('s3'); toast(key+' loaded — edit anything that does not fit.');
}

const PAGES={};

/* ── start ────────────────────────────────────────────────────────────── */
PAGES.start=()=>`<div class="start-wrap">
  <span class="eyebrow">Nova Reperta · AI-enabled OpEx</span>
  <h1 style="margin-top:8px">Set up the engagement<br>before you set up the dashboard.</h1>
  <p class="lead">It asks what you already know — the client, the kind of work, the scope, the teams — and works out the analysis plan from that. Claude then turns it into a live engagement you run from this same screen.</p>
  <div class="start-cards">
    <div class="card lift" onclick="startNew()">
      <div class="start-ic">${ico('sliders')}</div>
      <h3>Configure a new engagement</h3>
      <p>Six steps. It ends with a setup you hand to Claude, which builds the engagement from it.</p>
    </div>
    <div class="card lift" onclick="document.getElementById('loadfile').click()">
      <div class="start-ic">${ico('up')}</div>
      <h3>Open an engagement</h3>
      <p>Pick up an engagement that is already set up and carry on working.</p>
    </div>
  </div>
  <div class="stages">
    <div><b>First · you set it up</b><span>Six questions you can already answer. Nothing is decided for you.</span></div>
    <div><b>Then · Claude builds it</b><span>It questions what is thin, sets the engagement up, and proposes an order of work.</span></div>
    <div><b>After that · you work from it</b><span>The same screen, now showing the plan and exactly what to say to run each analysis.</span></div>
  </div>
</div>`;

/* ── step 1 · client & assignment ─────────────────────────────────────── */
function personSelect(path,filter,ph){
  const cur=get(E,path)||'';
  const list=NR_PEOPLE.filter(p=>!filter||filter.includes(p.role));
  const known=list.some(p=>p.name===cur);
  return `<select onchange="upd('${path}',this.value)">
    <option value="">${esc(ph||'— select —')}</option>
    ${list.map(p=>`<option value="${esc(p.name)}" ${cur===p.name?'selected':''}>${esc(p.name)} · ${esc(p.role)}</option>`).join('')}
    ${cur&&!known?`<option value="${esc(cur)}" selected>${esc(cur)}</option>`:''}
  </select>`;
}
PAGES.s1=()=>{
  const a=E.assignment, t=M.types[a.type]||{}, ap=M.approaches[a.depth]||{};
  const consequence={
    'light-quickscan':'Every team starts at <b>Quickscan</b> depth — the maturity scan on each of the six dimensions.',
    'full-diagnostic':'Every team starts at <b>Diagnostic</b> depth — every scored analysis each dimension offers.',
    'redesign':'Every team starts at <b>Redesign</b> depth — the full diagnostic, plus designing how the work should run afterwards.'
  }[a.depth]||'';
  return lead('Who the client is, and what kind of work this is. The assignment type is the one choice that shapes everything downstream.')+
  `<div class="dd-section"><span class="eyebrow">What kind of assignment is this?</span>
    <div class="ch-grid">${Object.entries(M.types).map(([k,x])=>`
      <div class="ch-card ${a.type===k?'on':''}" onclick="pickType('${k}')">
        <div class="ch-t"><span class="ch-rad"></span>${x.label}</div>
        <div class="ch-io">
          <div class="ch-io-l">What goes in</div>
          <p class="ch-in">${x.input}</p>
          <div class="ch-io-l">What comes out</div>
          <ul class="ch-out">${x.output.map(o=>`<li>${o}</li>`).join('')}</ul>
        </div>
        <div class="ch-f">${x.foot}</div>
      </div>`).join('')}</div>

    <div class="consq">
      <div class="consq-chips">${Object.entries(M.tracks).map(([k,x])=>{
        const on=(E.plan.tracks||[]).includes(k);
        return `<span class="tchip ${on?'on':''}" title="${esc(x.blurb)}">${on?'&#10003; ':''}${esc(x.label)}</span>`;
      }).join('')}</div>
      <p class="consq-t">${consequence} Adjust it per team in step 3, and per dimension in step 5.</p>
    </div>
  </div>

  <div class="dd-section"><span class="eyebrow">Engagement details</span>
    <div class="card">
      <div class="f2">
        ${field('Client name','client',{ph:'ACME Group'})}
        <div class="field"><label>Engagement id</label>
          <input id="f-id" type="text" value="${esc(E.id)}" placeholder="acme" oninput="updId(this.value)">
          <span class="hint">Short code that names the engagement folder and links every team to its data. Lowercase, no spaces.</span></div>
      </div>
      <div class="f2">
        <div class="field"><label>Partner</label>${personSelect('assignment.partner',['Partner','Director'],'— select partner —')}</div>
        <div class="field"><label>Engagement lead</label>${personSelect('assignment.lead',null,'— select lead —')}</div>
      </div>
      <div class="f3">
        ${field('Client sponsor','assignment.sponsor',{ph:'COO'})}
        ${field('Start date','assignment.start',{type:'date'})}
        ${field('Target completion','assignment.target',{type:'date'})}
      </div>
      <div class="minor">
        <label>Configured by</label>${personSelect('configuredBy',null,'— select —')}
        <label>Working language</label>
        <select onchange="upd('assignment.language',this.value)">
          ${[['en','English'],['nl','Nederlands'],['fr','Français']].map(([k,l])=>`<option value="${k}" ${a.language===k?'selected':''}>${l}</option>`).join('')}
        </select>
        <span class="minor-n">Names come from the NR roster at the top of this file.</span>
      </div>
    </div>
  </div>`;
};
function pickType(k){
  const t=M.types[k]; if(!t) return;
  E.assignment.type=k; E.assignment.depth=t.depth; E.assignment.aiEnabled=!!t.ai;
  E._planTouched=false; derivePlan(); save(); go('s1');
}

/* ── step 2 · scope ───────────────────────────────────────────────────── */
PAGES.s2=()=>{
  const n=k=>(E.scope[k]||[]).filter(Boolean).length;
  const listCard=(title,key,ph,hint,sugg)=>`<div class="card">
    <div class="ch"><span class="ct">${title}</span>${n(key)?`<span class="badge-soft">${n(key)}</span>`:''}</div>
    ${bullets('scope.'+key,ph)}
    ${sugg?`<div class="sugg-l">Pick one to add</div><div class="sugg">${sugg.map(x=>{
      const has=(E.scope[key]||[]).includes(x);
      return `<button ${has?'disabled':''} onclick="addObjective('${esc(x).replace(/'/g,"&#39;")}')">${has?'&#10003; ':'+ '}${esc(x)}</button>`;
    }).join('')}</div>`:''}
    <span class="hint" style="margin-top:auto;padding-top:10px">${hint}</span></div>`;
  return lead('The statement is the sentence you would defend in the steering committee. Everything below has to be traceable to it.')+
  `<div class="card" style="margin-bottom:16px">
    <div style="display:grid;grid-template-columns:1fr 260px;gap:18px;align-items:start">
      <div class="field" style="margin:0"><label>Scope statement — what we assess, and why</label>
        <textarea rows="3" placeholder="Inside-out AI-readiness diagnostic across the eight operational teams of the Belgian entity (≈310 FTE), to quantify the operational potential and rank AI use cases ahead of the 2027 budget." oninput="upd('scope.statement',this.value)">${esc(E.scope.statement||'')}</textarea></div>
      <div class="field" style="margin:0"><label>Entity / perimeter</label>
        <input type="text" value="${esc(E.scope.entity||'')}" placeholder="Belgian P&C entity" oninput="upd('scope.entity',this.value)">
        <span class="hint">The legal or organisational boundary. Keeps the FTE numbers honest.</span></div>
    </div>
  </div>
  ${vcEditor()}
  <div class="g3">
    ${listCard('Objectives','objectives','Quantify the FTE opportunity per team','What the client gets, in their language.',OBJECTIVE_SUGGESTIONS)}
    ${listCard('Out of scope','outOfScope','IT infrastructure','Say it here and it cannot be assumed later.')}
    ${listCard('Constraints','constraints','No client interviews before 15 September','Anything that shapes the plan or the timeline.')}
  </div>
  <div class="card" style="margin-top:16px">
    <div class="ch"><span class="ct">End-to-end processes in scope</span>
      <span class="badge-soft">${n('processes')?n('processes')+' listed':'optional'}</span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 22px">${bullets('scope.processes','Claim intake to settlement')}</div>
    <span class="hint">Fill this when the assignment follows a value chain rather than an org chart.</span>
  </div>
`;
};

/* ── the client's value chain ─────────────────────────────────────────────
   Teams tell you how the client is organised. The value chain tells you how the
   client actually earns its money — and it is the frame the findings get told in.
   It cannot be derived from the org chart, so it is asked for here. */
function vcEditor(){
  const chains=(E.scope.valueChains||[]);
  const live=VCS(), all=inScopeTeams().length, placed=inScopeTeams().filter(t=>placementsOf(t).length).length;
  const block=(c,ci)=>{
    const st=(c.stages||[]).filter(Boolean);
    const chips=(c.stages||[]).map((x,i)=>`<span class="vcs">
      <button class="vcs-mv" title="Move earlier" ${i===0?'disabled':''} onclick="vcMove(${ci},${i},-1)">&#8249;</button>
      <input class="vcs-in" size="${Math.max(9,Math.min(String(x||'').length+1,26))}" value="${esc(x)}" placeholder="Stage"
        oninput="vcSet(${ci},${i},this.value);this.size=Math.max(9,Math.min(this.value.length+1,26))">
      <button class="vcs-mv" title="Move later" ${i===(c.stages||[]).length-1?'disabled':''} onclick="vcMove(${ci},${i},1)">&#8250;</button>
      <button class="vcs-x" title="Remove" onclick="vcDelStage(${ci},${i})">&times;</button></span>`).join('');
    return `<div class="vcblock">
      <div class="vcblock-h">
        <input class="vcname" value="${esc(c.name||'')}" placeholder="Name this chain — the product or service it delivers"
          oninput="vcName(${ci},this.value)">
        ${st.length?`<span class="badge-soft">${st.length} stage${st.length>1?'s':''}</span>`:''}
        ${chains.length>1?`<button class="xb" title="Remove this chain" onclick="vcDelChain(${ci})">&times;</button>`:''}
      </div>
      ${st.length?'':`<div class="sugg-l" style="margin-top:0">Start from a standard chain — rename anything that does not fit</div>
        <div class="sugg" style="margin-bottom:12px">${Object.keys(M.chains).map(k=>
          `<button onclick="vcLoad(${ci},'${k}')">+ ${k}</button>`).join('')}</div>`}
      <div class="vcs-row">${chips}<button class="addlink" onclick="vcAddStage(${ci})">+ Add stage</button>${
        st.length?`<button class="addlink" style="color:var(--muted)" onclick="vcClear(${ci})">Start over</button>`:''}</div>
      ${st.length?`<div class="vcflow">${st.map((x,i)=>`<span class="vcf${i===0?' first':''}">${esc(x)}</span>`).join('')}</div>`:''}
    </div>`;
  };
  return `<div class="card" style="margin:0 0 16px">
    <div class="ch"><span class="ct">The client&rsquo;s value chain${chains.length>1?'s':''}</span>
      <span class="badge-soft">${live.length?live.length+' chain'+(live.length>1?'s':'')+' · '+placed+' of '+all+' teams placed':'not set'}</span></div>
    <p style="font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:13px;max-width:780px">
      The handful of steps the client&rsquo;s business runs through, start to finish. The findings get told along
      this chain rather than along the org chart &mdash; it is how a board sees the company, and it is what shows
      where a weak team actually hurts. Order the stages the way the work flows.
      <b>A client that sells more than one thing has more than one chain</b> &mdash; add one per product or service
      line, and place each team on every chain it serves. You do the placing in the next step.</p>
    ${chains.map(block).join('')}
    <div style="margin-top:${chains.length?'6px':'0'}">
      <button class="addlink" onclick="vcAddChain()">+ ${chains.length?'Add another value chain':'Add a value chain'}</button></div>
    <span class="hint" style="display:block;margin-top:12px">Leave it empty and everything still works &mdash; the value chain page simply stays closed.</span>
  </div>`;
}
function vcArrC(){ const s=E.scope; s.valueChains=s.valueChains||[]; return s.valueChains; }
function vcNewId(){ const a=vcArrC(); let n=1; while(a.some(c=>c.id==='vc'+n)) n++; return 'vc'+n; }
function vcAddChain(){ vcArrC().push({id:vcNewId(),name:'',stages:[]}); save(); go('s2'); }
function vcDelChain(ci){
  const c=vcArrC()[ci]; if(!c) return;
  (E.teams||[]).forEach(t=>{ t.placements=(t.placements||[]).filter(p=>p.chain!==c.id); });
  vcArrC().splice(ci,1); save(); go('s2');
}
function vcName(ci,v){ const c=vcArrC()[ci]; if(c){ c.name=v; save(); } }
function vcStages(ci){ const c=vcArrC()[ci]; if(!c) return []; c.stages=c.stages||[]; return c.stages; }
function vcAddStage(ci){ vcStages(ci).push(''); save(); go('s2'); }
function vcSet(ci,i,v){
  const c=vcArrC()[ci], a=vcStages(ci), old=a[i]; a[i]=v;
  (E.teams||[]).forEach(t=>(t.placements||[]).forEach(p=>{ if(p.chain===c.id&&p.stage===old) p.stage=v; }));
  save();
}
function vcDelStage(ci,i){
  const c=vcArrC()[ci], a=vcStages(ci), old=a[i]; a.splice(i,1);
  (E.teams||[]).forEach(t=>{ t.placements=(t.placements||[]).filter(p=>!(p.chain===c.id&&p.stage===old)); });
  save(); go('s2');
}
function vcMove(ci,i,d){ const a=vcStages(ci), j=i+d; if(j<0||j>=a.length) return; const x=a[i]; a[i]=a[j]; a[j]=x; save(); go('s2'); }
function vcClear(ci){
  const c=vcArrC()[ci]; if(!c) return; c.stages=[];
  (E.teams||[]).forEach(t=>{ t.placements=(t.placements||[]).filter(p=>p.chain!==c.id); });
  save(); go('s2');
}
function vcLoad(ci,k){
  const c=vcArrC()[ci]; if(!c) return;
  if(!c.name) c.name=k; c.stages=(M.chains[k]||[]).slice(); save(); go('s2');
}

/* ── step 3 · teams ───────────────────────────────────────────────────── */
PAGES.s3=()=>{
  const rows=E.teams.map((t,i)=>`<tr class="${t.inScope===false?'off':''}">
    <td style="width:38px"><div class="tgl tgl-sm ${t.inScope!==false?'on':''}" title="In scope" onclick="tSet(${i},'inScope',${t.inScope===false})"><span class="sw"></span></div></td>
    <td><input class="tinp" value="${esc(t.name)}" placeholder="Customer Service" oninput="tName(${i},this.value)"></td>
    <td style="width:78px"><input class="tinp" value="${esc(t.id)}" placeholder="cs" oninput="tSet(${i},'id',this.value.toLowerCase())"></td>
    <td><input class="tinp" list="dl-div" value="${esc(t.division)}" placeholder="Division" oninput="tSet(${i},'division',this.value)"></td>
    <td><input class="tinp" list="dl-dept" value="${esc(t.dept)}" placeholder="Department" oninput="tSet(${i},'dept',this.value)"></td>
    ${VCS().map(c=>`<td style="width:${VCS().length>1?138:158}px"><select class="tinp" onchange="tPlace(${i},'${c.id}',this.value)">
      <option value=""${placedOn(t,c.id)?'':' selected'}>— not on it —</option>
      ${(c.stages||[]).filter(Boolean).map(x=>`<option${placedOn(t,c.id)===x?' selected':''}>${esc(x)}</option>`).join('')}</select></td>`).join('')}
    <td style="width:76px"><input class="tinp" type="number" value="${t.fte==null?'':t.fte}" placeholder="—" oninput="tSet(${i},'fte',this.value===''?null:+this.value)"></td>
    <td><input class="tinp" list="dl-lead" value="${esc(t.lead)}" placeholder="Team lead" oninput="tSet(${i},'lead',this.value)"></td>

function teamLensBoard(t){
  const pt=(E.plan.perTeam||{})[t.id]||{lenses:{}};

  const nAi=(pt.ai||[]).length;
  const open=OPEN_TEAMS.has(t.id);
  /* collapsed rows stay readable: one swatch per lens, coloured by its depth */
  const strip=M.dims.map(d=>{
    const D=DEPTH[depthOf(pt.lenses[d.k]||[],d.k)];
    return `<i title="${esc(d.label)} · ${D.label}" style="background:${D.bg}"></i>`;
  }).join('');
  const rows=M.dims.map(d=>{
    const eff=effInstruments(t.id,d.k), D=DEPTH[depthOf(eff,d.k)];
    /* short lens names on purpose: they keep every row one line high, so the matrix

    const label=`<div class="lmx-lens" title="${esc(d.label)}"><span class="lmx-dot" style="background:${d.col}"></span>

    const cells=(M.offers[d.k]||[]).map(i=>mxCell(i,eff.includes(i),`togInstrument('${t.id}','${d.k}','${i}')`));
    return mxRow(label,cells);
  }).join('');

/* One count of "an analysis", used everywhere: one instrument on one team.
   `plan` is what the configurator asks for, `done` is what the artefact ledger
   says has actually been produced against it. */
function planLedger(){
  const map={};
  Object.entries((E&&E.plan&&E.plan.perTeam)||{}).forEach(([tid,pt])=>{
    Object.values(pt.lenses||{}).flat().concat(pt.baseline||[],pt.registers||[])
      .forEach(i=>{ (map[i]=map[i]||new Set()).add(tid); });
  });
  const done={};
  ((window.__QS_DATA__&&window.__QS_DATA__.artifacts&&window.__QS_DATA__.artifacts.artifacts)||[])
    .forEach(r=>{ if(r&&r.status==='produced'&&r.instrument) (done[r.instrument]=done[r.instrument]||new Set()).add(r.team); });
  let plan=0, run=0;
  Object.entries(map).forEach(([i,set])=>{ plan+=set.size;
    if(done[i]) run+=[...set].filter(t=>done[i].has(t)).length; });
  return {map, done, plan, run};
}
const donut=pct=>{ const r=17, C=2*Math.PI*r, on=C*Math.max(0,Math.min(100,pct))/100;
  return `<svg class="ov-ring" viewBox="0 0 42 42" aria-hidden="true">
    <circle cx="21" cy="21" r="${r}" fill="none" stroke="var(--divider)" stroke-width="5"/>
    <circle cx="21" cy="21" r="${r}" fill="none" stroke="var(--green)" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${on.toFixed(1)} ${(C-on).toFixed(1)}" transform="rotate(-90 21 21)"/>
    <text x="21" y="24.4" text-anchor="middle" font-family="var(--fh)" font-size="10.5" font-weight="800" fill="var(--text)">${pct}%</text>
  </svg>`; };

  /* The scope numbers belong to the Engagement overview and are context here, not a
     second copy of that KPI row — this page is only ever about what we found. */
  const ctx=`<div class="ctxline">${teams.length} team${teams.length===1?'':'s'} &middot; ${divs.length} division${divs.length===1?'':'s'}${scopeFte()?' &middot; '+scopeFte()+' FTE in scope':''}
    ${(E.results||{}).updatedAt?` &middot; last updated ${esc(dmy(E.results.updatedAt))}`:''}</div>`;
  return head+ctx+`<div class="kpi-row one">
    <div class="kpi-grp pot"><div class="kpi-grp-label">What we found</div><div class="kpi-boxes">
      ${kpi('Teams assessed',a.length+'<span style="font-size:15px;font-weight:700;color:var(--muted)">/'+teams.length+'</span>',a.length?'scored on six dimensions':'nothing scored yet','check')}
      ${kpi('Opportunities',o.length||'—',o.length?'across the assessed teams':'none logged yet','bolt')}
      ${kpi('FTE potential',totalFte()?'~'+totalFte().toFixed(0):'—',totalFte()?'releasable capacity':'quantified as we go','spark')}
      ${kpi('Worth a year',totalFte()?eur(valueCase().annual):'—',totalFte()?'at full ramp, gross':'valued once we find it','euro')}
    </div></div>
  </div>

  <div style="display:grid;grid-template-columns:1.45fr 1fr;gap:18px" class="ovsplit">
    <div><span class="eyebrow" style="display:block;margin-bottom:9px">Maturity by team and division</span>
      <div class="card" style="height:calc(100% - 26px)">
        <div class="legend">
          <span class="lgd" style="font-weight:800;color:var(--text)">Maturity</span>
          ${[[1,'var(--s1)'],[2,'var(--s2)'],[3,'var(--s3)'],[4,'var(--s4)'],[5,'var(--s5)']]
            .map(([n,c])=>`<span class="lgd"><i style="background:${c};border:1px solid rgba(15,43,82,.10)"></i>${n}</span>`).join('')}
          <span class="lgd"><i style="border:1.5px dashed var(--border-heavy);background:transparent"></i>Assessment ongoing</span>
        </div>
        ${divs.length?tree:`<p style="font-size:12.5px;color:var(--muted-2)">No teams in scope yet — add them in the configurator.</p>`}
      </div></div>
    <div><span class="eyebrow" style="display:block;margin-bottom:9px">Where the six dimensions stand</span>
      <div class="card" style="height:calc(100% - 26px)">
        <p style="font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:10px">
          ${a.length?`The average across the ${a.length} team${a.length>1?'s':''} assessed so far. The lowest bar is usually the thing to fix first — it holds the others back.`
                    :`These fill in as teams are scored. The lowest bar will be the organisation-level priority.`}</p>
        ${dims}
        ${w?`<div class="callout"><div class="cl">Organisation-level priority</div>
          <p><b>${esc(w.dim.label)}</b> is the weakest dimension at ${w.v.toFixed(1)}/5. Fixing it centrally is worth more than
          fixing it team by team — it is what unblocks the rest.</p></div>`:''}
      </div></div>
  </div>`;
};

/* ── findings · value chain ───────────────────────────────────────────── */
PAGES.chain=()=>{
  const chains=VCS();
  if(!chains.length) return narr('Not set up yet',
      `This engagement has no value chain yet, so there is nothing to draw it along.`)+
    fempty('Set the client&rsquo;s value chain first',
      `The org chart says who reports to whom. The value chain says how the client actually earns its money — distribution, underwriting, servicing, claims, and so on. It is the frame the findings get told in, and it cannot be worked out from the team list, so it is asked for in setup. Pick a standard chain, adjust the names, and place each team on a stage. A client that sells more than one thing gets one chain per product or service.`,
      `<button class="fchip go" onclick="MODE='setup';go('s2')">Set the value chain &rarr;</button>`);

  const dataDim=dimOf('data'), dataAvg=dimAvg('data');
  const shared=inScopeTeams().filter(t=>placementsOf(t).length>1);

  const board=c=>{
    const stages=stagesOf(c.id);
    if(!stages.length) return '';
    const cols=stages.length, rows=Math.max(...stages.map(x=>x.teams.length),1);
    let cells='';
    stages.forEach((x,i)=>{
      const sc=x.teams.filter(t=>scored(t.id));
      const avg=sc.length?sc.reduce((a,t)=>a+overall(t.id),0)/sc.length:0;
      cells+=`<div class="vc-chev${i===0?' first':''}${x.orphan?' orphan':''}"><b>${esc(x.name)}</b>
        <span>${avg?avg.toFixed(1)+' /5 avg':x.teams.length?x.teams.length+' team'+(x.teams.length===1?'':'s')+' · not assessed':'no team here'}</span></div>`;
    });
    for(let r=0;r<rows;r++) for(let i=0;i<cols;i++){
      const t=stages[i].teams[r];
      if(!t){ cells+='<div class="vc-void"></div>'; continue; }
      const multi=placementsOf(t).length>1?`<span class="vc-multi" title="Also on ${esc(placementsOf(t).filter(p=>p.chain!==c.id).map(p=>(chainOf(p.chain)||{}).name).join(', '))}">shared</span>`:'';
      if(!scored(t.id)){
        cells+=`<div class="vc-card pend" onclick="openTeam('${t.id}')"><div class="vn">${esc(t.name)}${multi}</div>
          <span class="vc-st" style="background:var(--surface-2);color:var(--muted-2)">Assessment ongoing</span>
          ${t.fte?`<div class="vc-row"><span class="vf" style="margin-left:0">${t.fte} FTE in the team</span></div>`:''}</div>`;
        continue;
      }
      const v=overall(t.id), rd=readiness(v), L=lev(tRes(t.id).lever||dominantLever(oppsOf(t.id))), f=teamFte(t.id);
      cells+=`<div class="vc-card" onclick="openTeam('${t.id}')"><div class="vn">${esc(t.name)}${multi}</div>
        <span class="vc-st" style="background:${rd[2]};color:${rd[1]}">${rd[0]}</span>
        <div class="vc-row"><span class="vs" style="color:${scoreColor(v)}">${v.toFixed(1)}<s>/5</s></span>
          ${f?`<span class="vf">~${f.toFixed(1)} FTE</span>`:''}</div>
        <div class="vc-bar"><i style="width:${v/5*100}%;background:${scoreColor(v)}"></i></div>
        <div class="vc-lead"><i style="background:${L.dot}"></i>${esc(L.label)}</div></div>`;
    }
    const tm=[...new Set(stages.flatMap(x=>x.teams.map(t=>t.id)))].length;
    return `<div class="dd-section">${sec(esc(c.name||'Value chain')+' · '+cols+' stage'+(cols>1?'s':'')+' · '+tm+' team'+(tm===1?'':'s'),
        chains.length>1?'':`<button class="fchip" onclick="MODE='setup';go('s2')">Edit the chain</button>`)}
      <div class="card"><div class="vc-wrap"><div class="vc-grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${cells}</div></div></div></div>`;
  };

  const head=assessed().length
    ? narr('Along the chain', `The ${inScopeTeams().length} teams placed on ${chains.length>1?`the client's ${chains.length} value chains`:"the client's own value chain"}. ${progressLine()}.
        ${dataAvg?`<b>${esc(dataDim.label)}</b> sits at ${dataAvg.toFixed(1)}/5 across the organisation — a constraint that shows up at every stage, not just one.`:''}`)
    : narr('Along the chain', `The ${inScopeTeams().length} teams placed on ${chains.length>1?`the client's ${chains.length} value chains`:"the client's own value chain"}. Each card fills with a
        maturity score, the capacity it can release and the verdict on how to fix it as the analyses run.`);

  return head+
    (chains.length>1?`<p class="pagelead">One board per product or service line. A team that serves more than one appears on each,
      marked <span class="vc-multi" style="position:static">shared</span> — its capacity is counted once, not once per chain.
      <button class="addlink" style="padding:1px 7px" onclick="MODE='setup';go('s2')">Edit the chains</button></p>`:'')+
    chains.map(board).join('')+
    (stagesOf((chains[0]||{}).id).some(x=>x.orphan)?`<p style="font-size:var(--fs-115);color:var(--s2-t);margin-top:-10px">The last column holds teams that have not been placed on any chain yet — place them in <button class="addlink" style="padding:1px 7px" onclick="MODE='setup';go('s3')">Step 3 · Teams</button>.</p>`:'')+
    (shared.length?`<p style="font-size:var(--fs-115);color:var(--muted);margin-top:-8px">${shared.length} team${shared.length>1?'s serve':' serves'} more than one chain: ${esc(shared.map(t=>t.name).join(', '))}.</p>`:'');
};

/* ── findings · transformation roadmap ────────────────────────────────── */
var RM_OPEN=null;
function rmSet(){ if(RM_OPEN===null) RM_OPEN=new Set(); return RM_OPEN; }
function rmToggle(n){ const s=rmSet(); s.has(n)?s.delete(n):s.add(n); go('roadmap'); }
function rmAll(on){ RM_OPEN = on ? new Set(divisionsOf().map(d=>d.name)) : new Set(); go('roadmap'); }
PAGES.roadmap=()=>{
  const H=M.horizons, divs=divisionsOf(), open=rmSet(), o=opps();
  const gt=`grid-template-columns:1.5fr repeat(${H.length},1fr)`;
  const head=o.length
    ? narr('The sequence', `<b>~${totalFte().toFixed(0)} FTE</b> of potential across <b>${o.length} initiatives</b>, sequenced over two years.
        ${(()=>{const n=opps(x=>horizonOf(x)==='0-6m').reduce((a,x)=>a+fteOf(x),0);
          return totalFte()?`About ${Math.round(n/totalFte()*100)}% of the value can start in the first six months; the rest waits on a foundation being fixed first.`:'';})()}`)
    : narr('The sequence', `Nothing to sequence yet. Once opportunities are found they land in one of the three horizons below —
        by <b>when the client can actually start</b>, not by how attractive they look.`);

  const cell=(list,h)=>{
    const sub=list.filter(x=>horizonOf(x)===h.k);
    if(!sub.length) return `<div class="rm-cell"><span class="rm-none">—</span></div>`;
    const L=lev(dominantLever(sub)), f=sub.reduce((a,x)=>a+fteOf(x),0);
    return `<div class="rm-cell"><span class="rm-blk" style="background:${L.bg};color:${L.t}" title="${sub.length} initiative${sub.length>1?'s':''} · ~${f.toFixed(1)} FTE">${esc(L.label)}</span></div>`;
  };
  const rows=divs.map(d=>{
    const ids=d.teams.map(t=>t.id), list=o.filter(x=>ids.includes(x.team));
    const f=list.reduce((a,x)=>a+fteOf(x),0), on=open.has(d.name);
    const inits=on?`<div class="rm-sub">${
      (list.length?list:[]).map(x=>{
        const L=lev(x.lever), tn=(inScopeTeams().find(t=>t.id===x.team)||{}).name||x.team;
        return `<div class="rm-init" style="${gt}"><div>${esc(x.title||'Untitled')} <span style="color:var(--muted-2);font-weight:500">· ${esc(tn)}</span></div>
          ${H.map(h=>horizonOf(x)===h.k
            ? `<div class="rm-cell"><span class="rm-tag" style="background:${L.bg};color:${L.t}">~${fteOf(x).toFixed(1)} FTE</span></div>`
            : `<div class="rm-cell"></div>`).join('')}</div>`;
      }).join('') || `<div style="padding:11px 36px;font-size:var(--fs-115);color:var(--muted-2)">No initiatives yet for the ${d.teams.length} team${d.teams.length>1?'s':''} in this division.</div>`
    }</div>`:'';
    return `<div class="rm-row" style="${gt}">
      <div class="rm-lbl ${on?'open':''}" onclick="rmToggle('${esc(d.name).replace(/'/g,"&#39;")}')">
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
        <span><b>${esc(d.name)}</b><small>${d.teams.length} team${d.teams.length>1?'s':''}${f?` · ~${f.toFixed(1)} FTE potential`:' · nothing found yet'}</small></span></div>
      ${H.map(h=>cell(list,h)).join('')}
      ${inits}</div>`;
  }).join('');

  const used=[...new Set(o.map(x=>x.lever).filter(Boolean))];
  return head+
  `<div class="dd-section">${sec('Two-year roadmap · what happens when',
      `<button class="fchip" onclick="rmAll(true)">Expand all</button><button class="fchip" onclick="rmAll(false)">Collapse all</button>`)}
    <p class="lead-in" style="margin:0 0 12px">Each row is a division, each column a horizon. The block shows the main kind of change
      planned in that window — the pace is set by readiness, not ambition. Open a row for the initiatives behind it.</p>
  ${used.length?`<div class="legend">${used.map(k=>`<span class="lgd"><i style="background:${lev(k).dot}"></i>${esc(lev(k).label)}</span>`).join('')}</div>`:''}
  <div class="rm">
    <div class="rm-head" style="${gt}">
      <div><span class="w">Division</span><b>Where</b></div>
      ${H.map((h,i)=>{ const sub=opps(x=>horizonOf(x)===h.k), f=sub.reduce((a,x)=>a+fteOf(x),0);
        return `<div class="rm-h${i}"><span class="w">${esc(h.when)}</span><b>${esc(h.label)}</b>
          <span class="m">${sub.length?`${sub.length} initiative${sub.length>1?'s':''} · ~${f.toFixed(1)} FTE`:'nothing here yet'} · ${esc(horizonWhen(h))}</span></div>`;}).join('')}
    </div>
    ${rows||`<div style="padding:22px 16px;font-size:12.5px;color:var(--muted-2)">No teams in scope yet.</div>`}
  </div></div>`;
};

/* ── findings · benefits overview ─────────────────────────────────────── */
PAGES.benefits=()=>{
  const v=valueCase(), H=M.horizons, divs=divisionsOf(), o=opps();
  const head=o.length
    ? narr('Value potential', `Releasing <b>~${v.fte.toFixed(0)} FTE</b> of capacity is worth <b>${eur(v.annual)} a year</b> at full ramp —
        an estimated <b>~${Math.round(v.payback)} months</b> payback on ${eur(v.invest)} of implementation, and ${eur(v.cum)} of cumulative value over three years.`)
    : narr('Value potential', `Nothing quantified yet. The numbers below are the assumptions this engagement runs on —
        <b>${eur(v.cost)} per FTE</b> a year, <b>${eur(v.impl)} per FTE</b> to implement. Every opportunity found gets valued against them,
        so the case builds itself as the work lands.`);

  const box=(eyebrow,val,sub,icon)=>kpi(eyebrow,val,sub,icon);
  const byH=H.map(h=>({h, fte:opps(x=>horizonOf(x)===h.k).reduce((a,x)=>a+fteOf(x),0)}));
  let run=0; const cumSeries=byH.map(x=>{ run+=x.fte*v.cost*v.real; return run; });
  const peak=Math.max(...cumSeries,1);
  const chart=`<div class="chart">
    ${byH.map((x,i)=>{ const add=x.fte*v.cost*v.real;
      return `<div class="cb">
        <div class="cbar" style="height:${o.length?Math.max(add/peak*100,add?3:0):0}%;opacity:${add?1:.15}">${add?`<em>+${eur(add)}</em>`:''}</div>
        <div class="cl"><b style="display:block;color:var(--text);font-size:var(--fs-11)">${esc(x.h.label)}</b>${esc(x.h.when)}<br>
          <span style="color:${cumSeries[i]?'var(--green-2)':'var(--muted-2)'};font-weight:800">${cumSeries[i]?eur(cumSeries[i]):'—'} run-rate</span></div>
      </div>`; }).join('')}
  </div>`;

  const rows=divs.map(d=>{
    const ids=d.teams.map(t=>t.id), list=o.filter(x=>ids.includes(x.team));
    const f=list.reduce((a,x)=>a+fteOf(x),0), val=f*v.cost*v.real;
    return {name:d.name,f,val};
  }).sort((a,b)=>b.val-a.val);
  const top=Math.max(...rows.map(r=>r.val),1);

  return head+`<div class="kpi-row">
    <div class="kpi-grp pot"><div class="kpi-grp-label">Value released · gross cost-out</div><div class="kpi-boxes">
      ${box('Annual run-rate',o.length?eur(v.annual):'—','at full ramp','euro')}
      ${box('Releasable FTE',o.length?'~'+v.fte.toFixed(0):'—','capacity freed','users')}
      ${box('3-year value',o.length?eur(v.cum):'—','phased by horizon','spark')}
    </div></div>
    <div class="kpi-grp"><div class="kpi-grp-label">Investment &amp; return</div><div class="kpi-boxes">
      ${box('Implementation',o.length?eur(v.invest):'—','one-off, indicative','bolt')}
      ${box('Payback',o.length?'~'+Math.round(v.payback)+' mo':'—','to recover the build','check')}
      ${box('Cost per FTE',eur(v.cost),'fully-loaded assumption','grid')}
    </div></div>
  </div>

  <div class="vsplit">
    <div><span class="eyebrow" style="display:block;margin-bottom:9px">Value build-up · by horizon</span>
      <div class="card">
        <div class="ch"><span class="ct">Savings build-up</span><span style="font-size:var(--fs-105);color:var(--muted)">bars = value added in that window</span></div>
        ${chart}
        ${o.length?'':`<p style="font-size:12px;color:var(--muted-2);text-align:center;margin-top:-96px;position:relative">Empty until opportunities are found and placed in a horizon.</p>`}
      </div></div>
    <div><span class="eyebrow" style="display:block;margin-bottom:9px">Where the value sits</span>
      <div class="card" style="height:calc(100% - 26px)">
        ${rows.length?rows.map(r=>`<div class="vrow"><div class="vt"><b>${esc(r.name)}</b><span>${r.val?eur(r.val):'—'}</span></div>
          <small>${r.f?'~'+r.f.toFixed(1)+' FTE':'nothing found yet'}</small>
          <div class="vb"><i style="width:${r.val/top*100}%"></i></div></div>`).join('')
          :`<p style="font-size:12.5px;color:var(--muted-2)">No divisions yet.</p>`}
      </div></div>
  </div>

  <div class="dd-section" style="margin-top:22px"><span class="eyebrow">How to read this</span>
    <div class="card"><p style="font-size:12.5px;line-height:1.75;color:var(--muted)">
      Pure cost-out basis — every releasable FTE is valued at the fully-loaded cost of <b style="color:var(--text)">${eur(v.cost)}</b> a year${v.real!==1?`, of which <b style="color:var(--text)">${Math.round(v.real*100)}%</b> is assumed to actually be realised`:''}.
      Implementation is estimated at <b style="color:var(--text)">${eur(v.impl)}</b> per releasable FTE. The three-year figure phases each horizon by when it starts paying:
      ${H.map((h,i)=>i?`${h.label.toLowerCase()} for ${h.ramp}`:`${h.label.toLowerCase()} counts for ${h.ramp} of the three years`).join(', ')}.
      These three numbers are set in <button class="addlink" style="padding:1px 7px" onclick="go('config')">Settings</button> and are assumptions until the client confirms them —
      the FTE behind them is what the analyses measure.</p></div>
  </div>`;
};

/* ── live · teams ─────────────────────────────────────────────────────── */
/* Teams, the analysis plan and the per-team results were three views of the same rows.
   One list now: every team, click through to what runs on it, what came back, and what
   that turned into. The collapsed row carries the six-dimension strip, so the cross-team
   scan the matrix used to give still works without a second table. */
var OPEN_TEAM_LIVE=null;
function liveOpen(){ if(OPEN_TEAM_LIVE===null) OPEN_TEAM_LIVE=new Set(); return OPEN_TEAM_LIVE; }
function openTeam(id){ liveOpen().add(id); PAGE='teams'; go('teams');
  setTimeout(()=>{ const el=document.getElementById('t-'+id); if(el) el.scrollIntoView({block:'center'}); },60); }
function toggleLiveTeam(id){ const s=liveOpen(); s.has(id)?s.delete(id):s.add(id); go('teams'); }
function expandLive(all){ OPEN_TEAM_LIVE = all ? new Set(inScopeTeams().map(t=>t.id)) : new Set(); go('teams'); }

function teamPanel(t){
  const pt=(E.plan.perTeam||{})[t.id]||{lenses:{},baseline:[],registers:[],ai:[]};
  const r=tRes(t.id), o=oppsOf(t.id);
  /* one line per analysis: what it is, whether it can run today, and the sentence to say —
     tucked behind the copy button so six dimensions still fit on a screen */
  const runLine=i=>{
    const x=M.inst[i]; if(!x) return '';
    const trig=x.trig.replace('{team}',t.name);

      ${x.status==='envisioned'?'<span class="tp-man">by hand</span>'
        :`<button class="tp-copy" title="Copy: ${esc(trig)}" onclick="event.stopPropagation();copy(${JSON.stringify(trig).replace(/"/g,'&quot;')},'Trigger copied')">${ico('copy')}</button>`}
    </div>`;
  };
  const dims=DIMK.map(k=>{
    const instr=pt.lenses[k]||[], lvl=depthOf(instr,k), d=dimOf(k), sc=r&&r.scores?+r.scores[k]||0:0;
    return `<div class="tp-dim">
      <div class="tp-dim-h">

        <span class="tp-cov" style="background:${DEPTH[lvl].bg};color:${DEPTH[lvl].fg}">${DEPTH[lvl].label}</span>
        <span class="tp-sc">${sc?`<b style="color:${scoreColor(sc)}">${sc}</b><span>/5</span>`:'<span class="tp-none">not scored yet</span>'}</span>
      </div>
      ${instr.length?`<div class="tp-ans">${instr.map(runLine).join('')}</div>`
        :`<p class="tp-none" style="padding:4px 0 2px">Nothing planned on this dimension — it will carry no score.</p>`}
      ${r&&r.rationale&&r.rationale[k]?`<p class="tp-rat">${esc(r.rationale[k])}</p>`:''}

  }).join('');
  const first=`<div class="tp-first">
    <div class="tp-first-l">Run these first</div>
    <div class="tp-ans">${(pt.baseline||[]).concat(pt.registers||[]).map(runLine).join('')||'<span class="tp-none">Nothing set.</span>'}</div></div>`;
  const ai=(pt.ai||[]).length?`<div class="tp-first ai">
    <div class="tp-first-l">Redesign · once the diagnosis lands</div>
    <div class="tp-ans">${(pt.ai||[]).map(k=>{
      const x=M.aiWork[k], trig=x.trig.replace('{team}',t.name);
      return `<div class="tp-an" title="${esc(x.note+'  Say: \"'+trig+'\"')}"><b>${esc(x.label)}</b>${stat(x.status)}
        <button class="tp-copy" title="Copy: ${esc(trig)}" onclick="event.stopPropagation();copy(${JSON.stringify(trig).replace(/"/g,'&quot;')},'Trigger copied')">${ico('copy')}</button></div>`;
    }).join('')}</div></div>`:'';
  const opps=o.length?`<div class="tp-opps">
    <div class="tp-first-l">What we found &mdash; ${o.length} opportunit${o.length===1?'y':'ies'} · ~${teamFte(t.id).toFixed(1)} FTE</div>
    <table class="tbl"><thead><tr><th>Opportunity</th><th>How to fix it</th><th>When</th><th>FTE</th></tr></thead><tbody>
      ${o.map(x=>{const L=lev(x.lever), h=M.horizons.find(y=>y.k===horizonOf(x))||M.horizons[0];

      <span class="mi-name">${esc(x.name)}</span>
