<!doctype html>
<!-- ============================================================================
  SERVICE BLUEPRINT  ·  the customer axis over the process baseline
  Lanes come from task.visibility, columns from journey.stages (baseline/2026.9).
  Replace ONLY the /* DATA */ block. Three views: Blueprint / Journey / Painpoints.
  <style> inlined from templates/brand.css (canonical). Logo inlined.
============================================================================ -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service Blueprint</title>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif}
  #art{--navy:#0B2347;--slate:#364156;--green:#1C7A4A;--accent:#6EB1D1;--navy2:#16315B;--rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;--rag-green-text:#2F8F6B;--rag-amber-text:#B97F22;--rag-red-text:#C2483D;--rag-na-text:#6B7480;--tint-green:rgba(47,143,107,.12);--tint-amber:rgba(212,154,58,.16);--tint-red:rgba(210,100,90,.13);--tint-na:rgba(154,164,176,.16);--navy-fill:#0B2347;
      --slate-10:rgba(54,65,86,.09);--navy-10:rgba(11,35,71,.10);--green-10:rgba(28,122,74,.10);
      --soft:#F5F7FB;--muted:#7A838F;--ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #art[data-t="dark"]{--soft:#141E2A;--muted:#94A1B2;--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--navy-fill:#243246;--accent:#8FC7E8;--steel:#93A9C4;--rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;--rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;--tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}
  body:has(#art[data-t="dark"]){--page:#0E1620}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:3}
  .tags{display:flex;align-items:center;gap:11px}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)} .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:11.5px;letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #art[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0 0 16px;max-width:1300px}
  #art[data-t="dark"] h1{color:#EAEFF5} h1 .hl{color:var(--green)}
  #view{flex:1;min-height:0;position:relative;overflow:auto}
  .board{display:grid;gap:10px}
  .colhead{display:grid;gap:10px;margin-bottom:6px}
  .stage{background:var(--navy2);color:#fff;font-size:12px;font-weight:700;letter-spacing:.4px;padding:9px 12px;border-radius:8px;text-align:center}
  .lane{display:grid;gap:10px;align-items:stretch}
  .lanelabel{display:flex;align-items:center;font-size:12px;font-weight:700;color:var(--navy);background:var(--slate-10);border-radius:8px;padding:0 12px}
  #art[data-t="dark"] .lanelabel{color:#EAEFF5}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:11px 13px;font-size:12.5px;color:var(--txt);line-height:1.4}
  .cell b{color:var(--ink);display:block;margin-bottom:3px;font-size:13px}
  .cell.empty{background:transparent;border:1px dashed var(--line);box-shadow:none}
  #ft{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:11px;color:var(--mut)}
  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600}
  /* ── service blueprint ── */
  #art{--steel:#7991AD}   /* the dark palette defines it; the light one does not */
  .ctrls{display:flex;gap:9px;flex:none}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:6px 0 14px}
  .subt{font-size:15px;font-weight:600;color:var(--accent)}
  .stamp{font-size:11px;color:var(--mut)}
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:20px}
  /* on the canvas the inner box is a flex column that fills the frame and scrolls inside itself */
  #art.canvasview #vinner{position:absolute;inset:0;padding-bottom:0;display:flex;flex-direction:column}
  #art.canvasview #view{overflow:hidden}

  .bp{display:grid;gap:1px;align-content:stretch;background:var(--line);
      border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .bp>*{background:var(--card)}

  /* the column heads: a stage, its number, and the work that maps to it */
  .hd{background:var(--navy2);color:#fff;font-size:12px;font-weight:700;letter-spacing:.2px;
      padding:9px 11px;line-height:1.3}
  .hd .n{opacity:.6;font-weight:800;margin-right:5px}
  .hd small{display:block;font-weight:400;opacity:.68;font-size:9.5px;margin-top:3px;
      letter-spacing:.1px;line-height:1.35}
  .hd.off{background:#8A7B58}

  /* the rail: what each row is, and what it answers */
  .lbl{background:var(--slate-10);display:flex;align-items:flex-start;gap:8px;padding:9px 11px;
       font-size:11px;font-weight:700;color:var(--navy);line-height:1.25}
  #art[data-t="dark"] .lbl{color:#EAEFF5}
  .lbl .ic{flex:none;width:15px;height:15px;margin-top:1px;color:var(--accent)}
  .lbl .ic svg{width:15px;height:15px;display:block}
  .lbl em{display:block;font-style:normal;font-weight:400;font-size:9.5px;color:var(--mut);
          margin-top:2px;letter-spacing:.1px;line-height:1.35}
  .lbl.acc{box-shadow:inset 3px 0 0 var(--l-col)}

  .cell{padding:9px 11px;font-size:12px;color:var(--txt);line-height:1.4}
  .cell.none{background:var(--soft)}
  .cell.off{background:rgba(180,150,70,.05)}

  /* a lane cell groups its steps by the team that performs them - but only names the team when
     the row actually holds more than one, or the name would repeat in every cell and say nothing */
  .grp{display:block;font-size:11px;font-weight:700;color:var(--ink);margin-bottom:3px}
  .grp+.stp{margin-top:0}
  .stp{position:relative;padding-left:9px;font-size:11.5px;color:var(--txt);line-height:1.4}
  .stp:before{content:'';position:absolute;left:0;top:6px;width:3px;height:3px;border-radius:50%;
              background:var(--mut)}
  .stp+.stp{margin-top:3px}
  .stp b{display:inline;font-weight:600;color:var(--txt);font-size:11.5px}
  .stp .sys{display:block;font-size:9.5px;color:var(--mut);letter-spacing:.1px}
  .grp2{margin-top:8px}

  /* what the customer does: chips, read left to right, with the flow between them */
  .jstep{display:inline-flex;align-items:center;gap:6px;background:var(--card);
         border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:11px;
         font-weight:600;color:var(--ink);line-height:1.3}
  .jwrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .jarr{color:var(--rag-green);flex:none}
  .jarr svg{width:15px;height:9px;display:block}
  .cell.jrow{background:rgba(47,143,107,.04);position:relative}
  .jnext{position:absolute;right:-10px;top:15px;z-index:2;
         background:var(--card);border-radius:50%;padding:3px 2px;line-height:0}

  /* how they feel: a track, not a rating. The dot says good or bad, the note says their word. */
  .cell.feelrow{position:relative;overflow:visible}
  .feel{position:relative;display:flex;align-items:center;gap:8px;height:20px}
  .feel:before{content:'';position:absolute;left:-11px;right:-12px;top:10px;height:1px;
               background:var(--mut);opacity:.3;z-index:0}
  .feel i{position:relative;z-index:1;width:9px;height:9px;border-radius:50%;flex:none;
          font-style:normal;box-shadow:0 0 0 3px var(--card)}
  .feel .ft{position:relative;z-index:1;font-size:10.5px;line-height:1.35;color:var(--txt);
            background:var(--card);padding-right:4px}
  .feel .ft b{display:block;font-size:11px;font-weight:700;color:var(--ink)}
  .feel.pos i{background:var(--rag-green)} .feel.neu i{background:var(--rag-na)}
  .feel.neg i{background:var(--rag-red)}
  .feel.non i{background:transparent;border:1.5px dashed var(--rag-na)}
  .cell.feelrow{padding-top:14px}

  /* touchpoints: what they meet it through. A channel is not a system. */
  .chs{display:flex;gap:6px;flex-wrap:wrap}
  .ch{display:inline-flex;align-items:center;gap:5px;background:var(--slate-10);border-radius:7px;
      padding:4px 8px;font-size:10.5px;font-weight:600;color:var(--ink)}
  .ch svg{width:12px;height:12px;display:block;color:var(--mut);flex:none}
  .ch.non{background:transparent;border:1px dashed var(--line);color:var(--mut);font-weight:400;font-style:italic}

  .sysc{display:flex;gap:6px;flex-wrap:wrap}
  .sysc span{background:var(--navy-10);border-radius:6px;padding:3px 8px;font-size:10.5px;
             font-weight:600;color:var(--navy)}
  #art[data-t="dark"] .sysc span{background:#243246;color:#EAEFF5}

  .pncell{background:rgba(210,100,90,.055)}
  .pn{position:relative;padding-left:13px;font-size:11px;color:var(--rag-red-text);line-height:1.4}
  .pn:before{content:'\25B4';position:absolute;left:0;top:-1px;font-size:11px}
  .pn+.pn{margin-top:4px}
  .pn b{font-weight:700}
  .pn.nq{color:var(--mut);font-style:italic}

  .divider{grid-column:1/-1;background:var(--navy-fill);height:2px;padding:0}
  .dlbl{grid-column:1/-1;background:var(--card);padding:3px 11px 5px;font-size:9.5px;letter-spacing:.9px;
        text-transform:uppercase;color:var(--navy);font-weight:700}
  #art[data-t="dark"] .dlbl{color:var(--accent)}

  /* journey view */
  .jgrid{display:grid;gap:13px}
  .jcard{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);padding:13px 15px;
         display:flex;flex-direction:column}
  .jcard.hot{border-color:var(--rag-red);border-width:1.5px}
  .jcard.hot h3::after{content:' · nobody meets them';font-size:10.5px;font-weight:600;color:var(--rag-red-text)}
  .jcard h3{margin:0 0 3px;font-size:13.5px;color:var(--navy);font-weight:700}
  #art[data-t="dark"] .jcard h3{color:#EAEFF5}
  .want{font-size:12px;color:var(--txt);font-style:italic;line-height:1.4;margin:0 0 9px}
  .jrow{font-size:11.5px;color:var(--txt);padding:6px 0;border-top:1px solid var(--line);line-height:1.4}
  .jrow i{font-style:normal;display:block;font-size:9px;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin-bottom:1px}
  .jrow.brk{color:var(--rag-red-text)} .jrow.brk i{color:var(--rag-red-text);opacity:.8}
  .behind{margin-top:auto;padding-top:9px;font-size:10px;color:var(--steel);letter-spacing:.2px}

  /* painpoints view */
  table{border-collapse:collapse;width:100%}
  th{text-align:left;font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:700;
     padding:0 18px 8px 0;border-bottom:2px solid var(--line)}
  td{font-size:12.5px;color:var(--txt);padding:10px 18px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
  td b{color:var(--ink)}
  .stagetag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--navy-10);color:var(--navy);white-space:nowrap}
  #art[data-t="dark"] .stagetag{background:#243246;color:#EAEFF5}

  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:10px;font-size:11px;color:var(--mut)}
  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legend{display:flex;gap:9px;flex-wrap:wrap}
  .lp{font-size:.95em;font-weight:600;padding:.2em .8em;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
  .lp i{width:8px;height:8px;border-radius:50%;font-style:normal}
  .conf{font-size:.88em;letter-spacing:.5px;font-weight:600}
  @media (max-width:760px){
    #art{padding:14px 18px 10px 42px}
    .nr-rail{width:24px}
    .toprow{position:static;margin:0 0 12px;flex-wrap:wrap;justify-content:flex-start;gap:10px 12px}
    .tags{flex-wrap:wrap;gap:8px;margin-left:-42px}
    .ctrls{flex-wrap:wrap;gap:8px;flex:1 1 100%}
  }






</style>

</head>

  function unitsFor(stageId){
    var seen={}, out=[];
    steps.forEach(function(s){
      if((stageId===null ? !!s.stageId : s.stageId!==stageId)) return;
      var n=s.unitName||s.activityId; if(!n||seen[n]) return;
      seen[n]=1; out.push(n);
    });
    return out;
  }
  function channelsAt(c){
    var seen={}, out=[];
    ['customer-action','frontstage'].forEach(function(v){
      at(c,v).forEach(function(s){ if(s.channel&&!seen[s.channel]){seen[s.channel]=1;out.push(s.channel);} });
    });
    return out;
  }
  function systemsAt(c){
    var seen={}, out=[];
    LANES.forEach(function(L){ at(c,L.k).forEach(function(s){
      if(s.system&&!seen[s.system]){seen[s.system]=1;out.push(s.system);} }); });
    return out;
  }
  function painsAt(c){
    var out=[];
    LANES.forEach(function(L){ at(c,L.k).forEach(function(s){
      (s.pains||[]).forEach(function(p){ out.push(p); }); }); });
    return out;
  }

          meets = at(s.id,'frontstage'),
          back  = at(s.id,'backstage').concat(at(s.id,'support'));
      var breaks = [];
      ['customer-action','frontstage','backstage','support',''].forEach(function(v){
        at(s.id,v).forEach(function(st){ painsOf(st).forEach(function(p){ breaks.push(p); }); });
      });
      var sys = {};
      back.forEach(function(b){ if(b.system) sys[b.system]=1; });
      var sysList = Object.keys(sys);
      var alone = !meets.length;      /* nobody frontstage: the customer is on their own here */
      return '<div class="jcard'+(alone?' hot':'')+'">'+

        '<div class="jrow"><i>They meet</i>'+(meets.length?meets.map(function(d){return esc(d.name);}).join(', '):'— nobody')+'</div>'+

  /* Monotonic binary-search fit: the largest scale whose content still fits the frame, capped at
     1.0 so a short view fills rather than magnifies. Same fit every instrument uses. */
  function fit(){
    var view=document.getElementById('view'), inner=document.getElementById('vinner');
    inner.style.transform='scale(1)'; inner.style.width='100%';
    var prev=inner.querySelector('[data-stretch]');
    if(prev) prev.style.minHeight='';          /* measure unstretched, or it only ever grows */
    var availH=view.clientHeight, availW=view.clientWidth;
    if(!availH||!availW) return;
    var lo=0.4, hi=1.0, best=0.4;
    for(var i=0;i<18;i++){
      var mid=(lo+hi)/2;
      inner.style.width=(100/mid)+'%';
      inner.style.transform='scale('+mid+')';
      var fits = inner.scrollHeight*mid <= availH+0.5;
      if(fits){ best=mid; lo=mid; } else { hi=mid; }
    }
    inner.style.width=(100/best)+'%';
    inner.style.transform='scale('+best+')';
    /* the fit is capped at 1.0 so a short view never magnifies - so a short view also never
       fills the slide. Let the marked element take the slack instead. */
    var grow=inner.querySelector('[data-stretch]');
    if(grow && best>=0.999){
      var slack = availH - inner.scrollHeight;
      if(slack > 6) grow.style.minHeight = (grow.offsetHeight + slack) + 'px';
    }
  }

    if(cur!=='canvas'){ fit(); }
