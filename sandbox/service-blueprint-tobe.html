<!doctype html>
<!-- ============================================================================
  SERVICE BLUEPRINT  ·  the customer axis over the operating baseline
  Lanes come from task.visibility, columns from journey.stages (baseline/2026.9).
  Replace ONLY the /* DATA */ block. Three views: Blueprint / Journey / Pain points.
  <style> inlined from templates/brand.css (canonical). Logo inlined.
============================================================================ -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service Blueprint</title>
<style>
/* Type scale — one place, not case by case. Every size below 12px is a token; the
   whole small end lifts on a narrow screen so nothing drops under 11px on a phone. */
:root{
  --fs-65:6.5px; --fs-7:7px; --fs-75:7.5px; --fs-8:8px; --fs-85:8.5px; --fs-9:9px;
  --fs-95:9.5px; --fs-10:10px; --fs-105:10.5px; --fs-11:11px; --fs-115:11.5px;
}
@media (max-width:760px){
  :root{
    --fs-65:11px; --fs-7:11px; --fs-75:11px; --fs-8:11px; --fs-85:11px; --fs-9:11px;
    --fs-95:11px; --fs-10:11.5px; --fs-105:12px; --fs-11:12px; --fs-115:12.5px;
  }
}
</style>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif}
  #art{--navy:#0B2347;--slate:#364156;--green:#1C7A4A;--accent:#6EB1D1;--navy2:#16315B;--rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;--rag-green-text:#2F8F6B;--rag-amber-text:#B97F22;--rag-red-text:#C2483D;--rag-na-text:#6B7480;--tint-green:rgba(47,143,107,.12);--tint-amber:rgba(212,154,58,.16);--tint-red:rgba(210,100,90,.13);--tint-na:rgba(154,164,176,.16);--navy-fill:#0B2347;
      --slate-10:rgba(54,65,86,.09);--navy-10:rgba(11,35,71,.10);--green-10:rgba(28,122,74,.10);
      --soft:#F5F7FB;--muted:#7A838F;--ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #art[data-t="dark"]{--soft:#141E2A;--muted:#94A1B2;--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--navy-fill:#243246;--accent:#8FC7E8;--steel:#93A9C4;--rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;--rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;--tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}
  body:has(#art[data-t="dark"]){--page:#0E1620}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:3}
  .tags{display:flex;align-items:center;gap:11px}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)} .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:var(--fs-115);letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #art[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0 0 16px;max-width:1300px}
  #art[data-t="dark"] h1{color:#EAEFF5} h1 .hl{color:var(--green)}
  #view{flex:1;min-height:0;position:relative;overflow:auto}
  .board{display:grid;gap:10px}
  .colhead{display:grid;gap:10px;margin-bottom:6px}
  .stage{background:var(--navy2);color:#fff;font-size:12px;font-weight:700;letter-spacing:.4px;padding:9px 12px;border-radius:8px;text-align:center}
  .lane{display:grid;gap:10px;align-items:stretch}
  .lanelabel{display:flex;align-items:center;font-size:12px;font-weight:700;color:var(--navy);background:var(--slate-10);border-radius:8px;padding:0 12px}
  #art[data-t="dark"] .lanelabel{color:#EAEFF5}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:11px 13px;font-size:12.5px;color:var(--txt);line-height:1.4}
  .cell b{color:var(--ink);display:block;margin-bottom:3px;font-size:13px}
  .cell.empty{background:transparent;border:1px dashed var(--line);box-shadow:none}
  #ft{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:var(--fs-11);color:var(--mut)}
  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600}
  /* ── service blueprint ── */
  #art{--steel:#7991AD}   /* the dark palette defines it; the light one does not */
  .ctrls{display:flex;gap:9px;flex:none}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:6px 0 14px}
  .subt{font-size:15px;font-weight:600;color:var(--accent)}
  .stamp{font-size:var(--fs-11);color:var(--mut)}
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:20px}
  /* on the canvas the inner box is a flex column that fills the frame and scrolls inside itself */
  #art.canvasview #vinner{position:absolute;inset:0;padding-bottom:0;display:flex;flex-direction:column}
  #art.canvasview #view{overflow:hidden}

  .bp{display:grid;gap:1px;align-content:stretch;background:var(--line);
      border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .bp>*{background:var(--card)}

  /* the column heads: a stage, its number, and the work that maps to it */
  .hd{background:var(--navy2);color:#fff;font-size:12px;font-weight:700;letter-spacing:.2px;
      padding:9px 11px;line-height:1.3}
  .hd .n{opacity:.6;font-weight:800;margin-right:5px}
  .hd small{display:block;font-weight:400;opacity:.68;font-size:var(--fs-95);margin-top:3px;
      letter-spacing:.1px;line-height:1.35}
  .hd.off{background:#8A7B58}

  /* the rail: what each row is, and what it answers */
  .lbl{background:var(--slate-10);display:flex;align-items:flex-start;gap:8px;padding:9px 11px;
       font-size:var(--fs-11);font-weight:700;color:var(--navy);line-height:1.25}
  #art[data-t="dark"] .lbl{color:#EAEFF5}
  .lbl .ic{flex:none;width:15px;height:15px;margin-top:1px;color:var(--accent)}
  .lbl .ic svg{width:15px;height:15px;display:block}
  .lbl em{display:block;font-style:normal;font-weight:400;font-size:var(--fs-95);color:var(--mut);
          margin-top:2px;letter-spacing:.1px;line-height:1.35}
  .lbl.acc{box-shadow:inset 3px 0 0 var(--l-col)}

  .cell{padding:9px 11px;font-size:12px;color:var(--txt);line-height:1.4}
  .cell.none{background:var(--soft)}
  .cell.off{background:rgba(180,150,70,.05)}

  /* a lane cell groups its steps by the team that performs them - but only names the team when
     the row actually holds more than one, or the name would repeat in every cell and say nothing */
  .grp{display:block;font-size:var(--fs-11);font-weight:700;color:var(--ink);margin-bottom:3px}
  .grp+.stp{margin-top:0}
  .stp{position:relative;padding-left:9px;font-size:var(--fs-115);color:var(--txt);line-height:1.4}
  .stp:before{content:'';position:absolute;left:0;top:6px;width:3px;height:3px;border-radius:50%;
              background:var(--mut)}
  .stp+.stp{margin-top:3px}
  .stp b{display:inline;font-weight:600;color:var(--txt);font-size:var(--fs-115)}
  .stp .sys{display:block;font-size:var(--fs-95);color:var(--mut);letter-spacing:.1px}
  .grp2{margin-top:8px}

  /* what the customer does: chips, read left to right, with the flow between them */
  .jstep{display:inline-flex;align-items:center;gap:6px;background:var(--card);
         border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:var(--fs-11);
         font-weight:600;color:var(--ink);line-height:1.3}
  .jwrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .jarr{color:var(--rag-green);flex:none}
  .jarr svg{width:15px;height:9px;display:block}
  .cell.jrow{background:rgba(47,143,107,.04);position:relative}
  .jnext{position:absolute;right:-10px;top:15px;z-index:2;
         background:var(--card);border-radius:50%;padding:3px 2px;line-height:0}

  /* how they feel: a track, not a rating. The dot says good or bad, the note says their word. */
  .cell.feelrow{position:relative;overflow:visible}
  .feel{position:relative;display:flex;align-items:center;gap:8px;height:20px}
  .feel:before{content:'';position:absolute;left:-11px;right:-12px;top:10px;height:1px;
               background:var(--mut);opacity:.3;z-index:0}
  .feel i{position:relative;z-index:1;width:9px;height:9px;border-radius:50%;flex:none;
          font-style:normal;box-shadow:0 0 0 3px var(--card)}
  .feel .ft{position:relative;z-index:1;font-size:var(--fs-105);line-height:1.35;color:var(--txt);
            background:var(--card);padding-right:4px}
  .feel .ft b{display:block;font-size:var(--fs-11);font-weight:700;color:var(--ink)}
  .feel.pos i{background:var(--rag-green)} .feel.neu i{background:var(--rag-na)}
  .feel.neg i{background:var(--rag-red)}
  .feel.non i{background:transparent;border:1.5px dashed var(--rag-na)}
  .cell.feelrow{padding-top:14px}

  /* touchpoints: what they meet it through. A channel is not a system. */
  .chs{display:flex;gap:6px;flex-wrap:wrap}
  .ch{display:inline-flex;align-items:center;gap:5px;background:var(--slate-10);border-radius:7px;
      padding:4px 8px;font-size:var(--fs-105);font-weight:600;color:var(--ink)}
  .ch svg{width:12px;height:12px;display:block;color:var(--mut);flex:none}
  .ch.non{background:transparent;border:1px dashed var(--line);color:var(--mut);font-weight:400;font-style:italic}

  .sysc{display:flex;gap:6px;flex-wrap:wrap}
  .sysc span{background:var(--navy-10);border-radius:6px;padding:3px 8px;font-size:var(--fs-105);
             font-weight:600;color:var(--navy)}
  #art[data-t="dark"] .sysc span{background:#243246;color:#EAEFF5}

  .pncell{background:rgba(210,100,90,.055)}
  .pn{position:relative;padding-left:13px;font-size:var(--fs-11);color:var(--rag-red-text);line-height:1.4}
  .pn:before{content:'\25B4';position:absolute;left:0;top:-1px;font-size:var(--fs-11)}
  .pn+.pn{margin-top:4px}
  .pn b{font-weight:700}
  .pn.nq{color:var(--mut);font-style:italic}

  .divider{grid-column:1/-1;background:var(--navy-fill);height:2px;padding:0}
  .dlbl{grid-column:1/-1;background:var(--card);padding:3px 11px 5px;font-size:var(--fs-95);letter-spacing:.9px;
        text-transform:uppercase;color:var(--navy);font-weight:700}
  #art[data-t="dark"] .dlbl{color:var(--accent)}

  /* journey view */
  .jgrid{display:grid;gap:13px}
  .jcard{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);padding:13px 15px;
         display:flex;flex-direction:column}
  .jcard.hot{border-color:var(--rag-red);border-width:1.5px}
  .jcard.hot h3::after{content:' · nobody meets them';font-size:var(--fs-105);font-weight:600;color:var(--rag-red-text)}
  .jcard h3{margin:0 0 3px;font-size:13.5px;color:var(--navy);font-weight:700}
  #art[data-t="dark"] .jcard h3{color:#EAEFF5}
  .want{font-size:12px;color:var(--txt);font-style:italic;line-height:1.4;margin:0 0 9px}
  .jrow{font-size:var(--fs-115);color:var(--txt);padding:6px 0;border-top:1px solid var(--line);line-height:1.4}
  .jrow i{font-style:normal;display:block;font-size:var(--fs-9);letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin-bottom:1px}
  .jrow.brk{color:var(--rag-red-text)} .jrow.brk i{color:var(--rag-red-text);opacity:.8}
  .behind{margin-top:auto;padding-top:9px;font-size:var(--fs-10);color:var(--steel);letter-spacing:.2px}

  /* painpoints view */
  table{border-collapse:collapse;width:100%}
  th{text-align:left;font-size:var(--fs-10);letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:700;
     padding:0 18px 8px 0;border-bottom:2px solid var(--line)}
  td{font-size:12.5px;color:var(--txt);padding:10px 18px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
  td b{color:var(--ink)}
  .stagetag{font-size:var(--fs-10);font-weight:700;padding:2px 8px;border-radius:999px;background:var(--navy-10);color:var(--navy);white-space:nowrap}
  #art[data-t="dark"] .stagetag{background:#243246;color:#EAEFF5}

  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:10px;font-size:var(--fs-11);color:var(--mut)}
  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legend{display:flex;gap:9px;flex-wrap:wrap}
  .lp{font-size:.95em;font-weight:600;padding:.2em .8em;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
  .lp i{width:8px;height:8px;border-radius:50%;font-style:normal}
  .conf{font-size:.88em;letter-spacing:.5px;font-weight:600}
  @media (max-width:760px){
    #art{padding:14px 18px 10px 42px}
    .nr-rail{width:24px}
  }







  /* ── responsive chrome ──────────────────────────────────────────────────────
     The toprow stacks when it does not fit, and the switch is DETECTED, not
     guessed: fitChrome() below measures the one-row layout and adds .stacked to
     the artifact root. Never hard-code a breakpoint for the chrome — see
     brand-guide.html, "Responsive chrome". Stacked order is brand row, then
     navigation, then working controls: where am I, what am I looking at, what
     can I change. ── */
  #art.stacked .toprow,#pm.stacked .toprow,#pw.stacked .toprow{
    position:static;top:auto;left:auto;right:auto;margin:0 0 12px;
    display:flex;flex-wrap:wrap;justify-content:flex-start;align-items:center;gap:10px 12px}
  #art.stacked .tags,#pm.stacked .tags,#pw.stacked .tags{display:contents}
  /* only the brand pill bleeds out onto the navy rail — that is why it is
     border-radius:0 9px 9px 0. The negative margin is given back as padding, so
     its right edge does not move and no sibling shifts. */
  #art.stacked .nr-pill,#pm.stacked .nr-pill,#pw.stacked .nr-pill{
    order:1;margin-left:calc(-1 * var(--padl,0px));padding-left:calc(14px + var(--padl,0px))}
  /* no text in an artifact is ever cut to make it fit: the lens badge wraps, it
     does not ellipsise. An instrument that truncates it looks fine to a gate and
     wrong to a client. */
  #art.stacked .nr-track,#pm.stacked .nr-track,#pw.stacked .nr-track{
    order:2;max-width:none;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
  #art.stacked .ctrls,#pm.stacked .ctrls,#pw.stacked .ctrls{
    order:3;flex:1 1 100%;display:flex;flex-wrap:wrap;justify-content:flex-start;gap:8px}
  /* a shell whose view switch sits straight in the toprow, with no .ctrls group */
  #art.stacked .toprow>.seg,#pm.stacked .toprow>.seg,#pw.stacked .toprow>.seg{order:3;flex:1 1 100%}
  #art.stacked .seg,#pm.stacked .seg,#pw.stacked .seg{flex-wrap:wrap;max-width:100%}
  #art.stacked .wgrp,#pm.stacked .wgrp,#pw.stacked .wgrp{
    order:4;flex:1 1 100%;flex-wrap:wrap;gap:8px}
  #art.stacked #save,#art.stacked #lock,#pm.stacked #save,#pm.stacked #lock,
  #pw.stacked #save,#pw.stacked #lock{order:4}
  /* the narrow-screen media query keeps only what it was really for: padding and
     rail width on a phone. Chrome layout is no longer its business. */
  @media (max-width:760px){
    #art.stacked,#pm.stacked,#pw.stacked{padding:14px 18px 10px 42px}
    #art.stacked .nr-rail,#pm.stacked .nr-rail,#pw.stacked .nr-rail{width:24px}
  }
</style>

<style id="nr-cards">
  /* ── cards: every step is one, and every card opens its detail ── */
  #art{--agent:#0A84B8}
  #art[data-t="dark"]{--agent:#5BB8E0}
  .bpc{display:block;position:relative;background:var(--card);border:1px solid var(--line);
        border-left:3px solid var(--l-col,var(--line));border-radius:8px;padding:5px 22px 5px 8px;
        cursor:pointer;transition:transform .12s,box-shadow .12s}
  .bpc:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(11,35,71,.13)}
  .bpc+.bpc{margin-top:5px}
  #art .bpc{border-radius:8px}
  .grp+.bpc{margin-top:0}
  .bpc b{display:block;font-size:var(--fs-115);font-weight:600;color:var(--ink);line-height:1.35}
  .bpc .sys{display:block;font-size:var(--fs-95);color:var(--mut);letter-spacing:.1px;margin-top:1px}
  .bpc.ai{background:linear-gradient(0deg,rgba(10,132,184,.07),rgba(10,132,184,.07)),var(--card);
           border-style:dashed;border-left-style:solid}
  .bpc.rm{opacity:.55}
  .bpc.rm{padding-top:3px;padding-bottom:3px}
  .bpc.rm b{text-decoration:line-through;font-weight:500;font-size:var(--fs-105);color:var(--mut)}
  .bpc.rm .sys{display:none}
  #ft .conf{white-space:nowrap}
  .aitag{display:inline-block;font-size:var(--fs-85);font-weight:800;letter-spacing:.5px;color:#fff;
         background:var(--agent);border-radius:3px;padding:1px 4px;margin-right:5px;vertical-align:1px}
  .newtag{position:absolute;right:7px;bottom:5px;font-size:var(--fs-85);font-weight:800;letter-spacing:.4px;
          color:var(--agent);text-transform:uppercase}
  .pd{position:absolute;right:5px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--rag-red);
      color:#fff;font-size:var(--fs-95);font-weight:800;line-height:14px;text-align:center;font-style:normal}
  .pd.ok{background:var(--rag-green)}
  .pd+.pd{right:22px}
  .jstep{position:relative;cursor:pointer;transition:transform .12s,box-shadow .12s}
  .jstep:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(11,35,71,.13)}
  .jstep .pd{position:static;margin-left:2px}
  .jstep.rm{opacity:.55;text-decoration:line-through}
  .pn{cursor:pointer}
  .pn.ok{color:var(--rag-green-text)}
  .pn.ok:before{content:'\2713'}
  .pn s{color:var(--mut)}
  .pn .by{display:block;font-size:var(--fs-10);color:var(--mut);font-style:normal}
  .pn .by.open{color:var(--rag-red-text)}
  .jcard a[data-card]{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
  .jcard a[data-card]:hover{text-decoration-color:var(--accent)}
  tr[data-pain]{cursor:pointer}
  tr[data-pain]:hover td{background:var(--soft)}
  .st{font-size:var(--fs-11);font-weight:600}
  .st.ok{color:var(--rag-green-text)} .st.open{color:var(--rag-red-text)}
  /* the detail window: outside the scaled view, so it is always full size */
  #dlg{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
       background:rgba(11,20,34,.42)}
  #dlg.on{display:flex}
  .dbox{width:min(560px,86%);max-height:84%;overflow:auto;background:var(--card);border-radius:12px;
        box-shadow:0 22px 60px rgba(0,0,0,.28)}
  .dh{display:flex;justify-content:space-between;gap:12px;padding:16px 20px 12px;
      border-top:5px solid var(--l-col,var(--navy));border-bottom:1px solid var(--line);border-radius:12px 12px 0 0}
  .dk{font-size:var(--fs-10);font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
  .dh h2{margin:5px 0 0;font-size:18px;line-height:1.25;color:var(--ink)}
  .dx{border:0;background:none;font-size:22px;line-height:1;color:var(--mut);cursor:pointer;align-self:flex-start}
  .db{padding:14px 20px 18px;display:grid;gap:10px}
  .dfacts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

<style id="nr-journey">
  /* ── the blueprint as a journey: arrows across the top, the customer's card under each stage,
     then open rows of our work. No boxes in boxes: rows are separated by a hairline, nothing else. */
  .jb{display:grid;column-gap:10px;row-gap:0;align-content:stretch}
  .jhd{position:relative;background:var(--navy2);color:#fff;font-size:13px;font-weight:800;line-height:1.2;
       padding:8px 26px 9px 28px;margin-right:-22px;min-height:46px;display:flex;flex-direction:column;justify-content:center;
       clip-path:polygon(0 0,calc(100% - 15px) 0,100% 50%,calc(100% - 15px) 100%,0 100%,15px 50%)}
  .jhd.first{padding-left:14px;clip-path:polygon(0 0,calc(100% - 15px) 0,100% 50%,calc(100% - 15px) 100%,0 100%)}
  .jhd.last{margin-right:0}
  .jhd .n{font-size:var(--fs-105);font-weight:800;color:var(--accent);margin-bottom:1px;letter-spacing:.3px}
  .jhd.off{background:#8A7B58}
  .jhd.off .n{color:rgba(255,255,255,.6)}
  .jlb{padding:10px 8px 9px 0;border-top:1px solid var(--line)}
  .jlb b{display:block;font-size:12.5px;font-weight:800;color:var(--l-col);line-height:1.25}
  .jlb em{display:block;font-style:normal;font-size:var(--fs-105);color:var(--mut);line-height:1.3;margin-top:2px}
  .jcell{position:relative;padding:8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;
         gap:5px;align-items:stretch;min-width:0}
  .jcell.off{background:rgba(180,150,70,.05);padding-left:6px;padding-right:6px}
  /* the customer's card: what they do on top, how it leaves them at the bottom */
  .jcu{border-top:0;padding:10px 0 12px;align-items:stretch}
  .jcc{position:relative;flex:1;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--line);
       border-radius:10px;padding:8px 10px 7px;display:flex;flex-direction:column;gap:5px;
       box-shadow:0 1px 2px rgba(11,35,71,.05)}
  .jcc.pos{border-top-color:var(--rag-green)} .jcc.neu{border-top-color:var(--rag-na)} .jcc.neg{border-top-color:var(--rag-red)}
  .jcc .jp{background:none;padding:0;border-radius:0;font-size:12.5px;font-weight:700;color:var(--navy);box-shadow:none}
  #art[data-t="dark"] .jcc .jp{color:var(--ink)}
  .jcc .jp:hover{transform:none;box-shadow:none;text-decoration:underline;text-decoration-color:var(--line)}
  .jnone{font-size:12px;color:var(--mut);font-style:italic}
  .jfeel{margin-top:auto;padding-top:6px;border-top:1px dashed var(--line);font-size:var(--fs-115);font-style:italic;
         color:var(--txt);display:flex;gap:6px;align-items:baseline;line-height:1.3}
  .jfeel i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--rag-na);transform:translateY(-1px)}
  .jcc.pos .jfeel i{background:var(--rag-green)} .jcc.neg .jfeel i{background:var(--rag-red)}
  .jcc.non .jfeel i{background:transparent;border:1.5px dashed var(--rag-na)}
  /* the two lines */
  .jdiv{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:var(--fs-95);font-weight:800;letter-spacing:1.2px;
        text-transform:uppercase;color:var(--navy);padding:9px 0 3px}
  .jdiv:after{content:"";flex:1;border-top:1.5px dashed var(--navy)}
  #art[data-t="dark"] .jdiv{color:var(--accent)} #art[data-t="dark"] .jdiv:after{border-color:var(--accent)}
  .jlb.nd,.jcell.nd{border-top-color:transparent}
  /* a step: a soft pill, tinted by its row */
  /* every step fills its column, so steps line up as equal rectangles down each stage */
  .jp{display:flex;align-items:center;gap:6px;width:100%;box-sizing:border-box;padding:6px 10px;border-radius:10px;
      font-size:var(--fs-115);font-weight:600;line-height:1.3;cursor:pointer;background:var(--p-bg);color:var(--p-fg);

  .jp .tx{min-width:0;flex:1}

  .jp.t-hu,.jp.t-fr{--p-bg:rgba(47,143,107,.10);--p-fg:#1D6A4E}
  .jp.t-bk{--p-bg:rgba(121,145,173,.16);--p-fg:#34506F}
  .jp.t-su{--p-bg:rgba(154,164,176,.15);--p-fg:var(--slate);font-weight:500}
  .jp.t-un{--p-bg:rgba(212,154,58,.15);--p-fg:#8A5A12}
  #art[data-t="dark"] .jp.t-ag{--p-bg:rgba(91,184,224,.16);--p-fg:#CFEAF6}
  #art[data-t="dark"] .jp.t-hu,#art[data-t="dark"] .jp.t-fr{--p-bg:rgba(47,143,107,.24);--p-fg:#CDEBDD}
  #art[data-t="dark"] .jp.t-bk{--p-bg:rgba(121,145,173,.24);--p-fg:#DCE4EE}
  #art[data-t="dark"] .jp.t-su{--p-bg:rgba(154,164,176,.18);--p-fg:#C9D1DA}
  #art[data-t="dark"] .jp.t-un{--p-bg:rgba(212,154,58,.2);--p-fg:#F1D6A6}
  .jp .aitag{margin-right:0;flex:none}
  .chi{display:inline-flex;color:var(--mut);flex:none}
  .chi svg{width:12px;height:12px}
  .mk{flex:none;width:15px;height:15px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
      font-size:var(--fs-10);font-weight:800;color:#fff;line-height:1;font-style:normal}

  /* the working copy: the + to add a customer step sits in the customer's card */
  .jcc .cellplus{top:4px;right:4px}
  #art.editing .jcu:hover .cellplus{opacity:1}
</style>

    {k:"bagent",          label:"Backstage agent",  sub:"AI working behind the scenes",         col:"var(--agent)"},
    LANES_CLASSIC[3], LANES_CLASSIC[4]
  ];
  var LANES = LANES_CLASSIC;
  /* the two lines a blueprint is defined by; a third would be noise */
  var DIVIDERS_CLASSIC = { "frontstage":"line of interaction", "backstage":"line of visibility" };
  var DIVIDERS_AGENT   = { "fagent":"line of interaction", "bagent":"line of visibility" };
  var DIVIDERS = DIVIDERS_CLASSIC;
  var OFF = "__off";

  /* Hoisted so the render path below is byte-identical in the client build and the
     working copy. In the client build the whole edit layer is stripped and these stay
     inert: EA() adds no attributes, PLUSBTN() draws nothing, BINDEDITS() does nothing. */
  var EDIT=false;   /* is the edit layer present at all?  */
  var ON=false;     /* is editing active right now?       */
  function EA(s){ return EDIT ? (" "+s) : ""; }
  var PLUSBTN=function(){ return ""; };
  var BINDEDITS=function(){};
  var GEAR_SVG_I='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>';
  var UNLOCK_SVG_I='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>';
  var LOCK_SVG=GEAR_SVG_I;                     /* the trailing "not on the journey" column */

  function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function hl(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1</span>');}

  /* A magnitude is a number and a unit KEY; the key is a database value, not something a client
     should ever read. model.json owns the labels and travels with the capture. */
  var V = DATA.vocab || {};
  function unitLabel(k){
    var u=(V.magnitudeUnits||[]).filter(function(x){return x.key===k;})[0];
    return (u&&u.label)||k||'';
  }
  function magText(m){
    if(!m||m.value==null) return '';
    var lb=unitLabel(m.unit);
    return m.value+(String(lb).charAt(0)==='%'?'':' ')+lb;
  }
  /* the channel's label, from the same vocabulary the gate enforces */
  function chLabel(k){
    var c=(V.channels||[]).filter(function(x){return x.key===k;})[0];
    return (c&&c.label)||(CH[k]&&CH[k][0])||k||'';
  }

  /* THE SLIDE SELECTION. The one-pager is not the canvas shrunk; it is the part of it that
     carries the argument, picked in the working copy. An absent selection means everything, so a
     capture written before the picker existed still renders exactly as it did. */
  var SEL = DATA.slide || null;
  function onSlideRow(k){
    if(!SEL || !SEL.rows) return true;
    if(SEL.rows.indexOf(k)>=0) return true;
    /* a pick made on the classic rows carries over to the agent rows that replace them */
    var from={fagent:'frontstage', human:'frontstage', bagent:'backstage'}[k];
    return !!from && SEL.rows.indexOf(from)>=0;
  }
  function onSlideCol(c){ return !SEL || !SEL.cols || SEL.cols.indexOf(c)>=0; }

  /* ── TWO MOMENTS, ONE RENDERER ──────────────────────────────────────────────────────────────
     A to-be capture may carry the as-is it was designed from (DATA.asis). The page then shows
     both, with a switch. Nothing is typed twice: a step kept from the as-is keeps its id, so what
     disappeared, what is new and which pain a step removes are all worked out from the two lists. */
  var ASIS = (DATA.asis && (DATA.asis.steps||[]).length) ? DATA.asis : null;
  var MOMENT = ASIS ? 'tobe' : (DATA.moment==='to-be' ? 'tobe' : 'asis');
  var WORLD = DATA;

  var stages, steps, actors, offSteps, cols, allCols, AGENTS, FIXED, ASPAIN;
  function isAgent(s){ return (actors[s.actorId]||{}).kind==='agent'; }
  /* which row a step sits on. Classic rows ARE the visibility; with agents in the work the
     visible and invisible human work share the middle row, and each agent takes its own row. */
  function laneOf(s){
    var v=s.visibility||'';
    if(!AGENTS) return v;
    if(isAgent(s)) return v==='frontstage' ? 'fagent' : (v==='backstage'||v==='support') ? 'bagent' : v;
    if(v==='frontstage'||v==='backstage') return 'human';
    return v;
  }
  function setWorld(w){
    WORLD = w;
    actors = w.actors||{};
    var own = (w.steps||[]).slice();
    FIXED = {}; ASPAIN = [];
    if(w===DATA && ASIS){
      /* steps the to-be drops are drawn where they were, struck through; steps it adds say so */
      var keep={}; own.forEach(function(s){ keep[s.id]=1; });
      var was={};  (ASIS.steps||[]).forEach(function(s){ was[s.id]=1; });
      own = own.map(function(s){ return was[s.id] ? s : Object.assign({}, s, {_new:true}); });
      (ASIS.steps||[]).forEach(function(s){
        if(!keep[s.id]){
          Object.keys(ASIS.actors||{}).forEach(function(k){ if(!actors[k]) actors[k]=ASIS.actors[k]; });
          own.push(Object.assign({}, s, {_rm:true, _was:s.pains||[], pains:[]}));
        }
      });
      own.forEach(function(s){ (s.fixes||[]).forEach(function(pid){ (FIXED[pid]=FIXED[pid]||[]).push(s); }); });
      (ASIS.steps||[]).forEach(function(s){ (s.pains||[]).forEach(function(p){ ASPAIN.push({p:p, s:s}); }); });
    }
    steps = own;
    stages = ((w===DATA && ASIS && !(w.stages||[]).length ? ASIS.stages : w.stages)||[])
               .slice().sort(function(a,b){return (a.order||0)-(b.order||0);});
    AGENTS = steps.some(isAgent);
    LANES = AGENTS ? LANES_AGENT : LANES_CLASSIC;
    DIVIDERS = AGENTS ? DIVIDERS_AGENT : DIVIDERS_CLASSIC;
    offSteps = steps.filter(function(s){return !s.stageId;});
    cols = stages.map(function(s){return s.id;});
    if(offSteps.length) cols.push(OFF);
    allCols = cols.slice();                 /* the canvas shows everything; the slide shows the pick */
    cols = cols.filter(onSlideCol);
    stages = stages.filter(function(s){ return onSlideCol(s.id); });
  }
  setWorld(DATA);

  /* by VISIBILITY: the question the baseline asks of every step. The edit layer and the gates
     read the blueprint this way, so this one keeps its meaning whatever rows are drawn. */
  function at(stageId, vis){
    return steps.filter(function(s){
      return (stageId===OFF ? !s.stageId : s.stageId===stageId) && (s.visibility||"")===vis;
    });
  }
  /* by ROW: what is drawn where */
  function atLane(stageId, lane){
    return steps.filter(function(s){
      return (stageId===OFF ? !s.stageId : s.stageId===stageId) && laneOf(s)===lane;
    });
  }
  function inCol(stageId){
    return steps.filter(function(s){ return stageId===OFF ? !s.stageId : s.stageId===stageId; });
  }
  function painsOf(s){ return s.pains||[]; }
  function seenBy(s){ var v=s.visibility||''; return v==='customer-action'||v==='frontstage'; }

  /* ── the card: every step is one, and every card opens ────────────────────────────────── */
  /* a to-be drawn against its as-is: the as-is pains it leaves open, on the step that carried them */
  function openPainsOn(s){
    if(!(WORLD===DATA && ASIS)) return [];
    return ASPAIN.filter(function(o){ return o.s.id===s.id && !FIXED[o.p.id]; });
  }
  var TONE = {"customer-action":"cu", frontstage:"fr", backstage:"bk", support:"su", "":"un",
              fagent:"ag", bagent:"ag", human:"hu"};
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" '+
              'stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  function chSvg(k){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '+
           'stroke-linecap="round" stroke-linejoin="round">'+((CH[k]||[])[1]||'')+'</svg>';
  }
  function marks(s){
    return (painsOf(s).length   ? '<span class="mk bad" title="Pain point">!</span>' : '') +
           (openPainsOn(s).length ? '<span class="mk open" title="Pain point not fixed yet">!</span>' : '') +
           ((s.fixes||[]).length ? '<span class="mk ok" title="Fixes a pain point">'+CHECK+'</span>' : '');
  }
  /* `named`: the row holds more than one team or agent, so each step says which one does it */
  function card(s, lane, named){
    var ai=isAgent(s);
    var who = named ? '<span class="tm">'+esc(actorName(s.actorId))+'</span>' : '';
    var ch = (s.channel && CH[s.channel]) ? '<span class="chi" title="'+esc(chLabel(s.channel))+'">'+chSvg(s.channel)+'</span>' : '';
    return '<div class="jp t-'+(TONE[lane]||'un')+'" data-card="'+esc(s.id)+'"'+EA('data-step="'+s.id+'"')+'>'+
      (ai?'<span class="aitag">AI</span>':'')+'<span class="tx">'+esc(s.name)+who+'</span>'+ch+marks(s)+'</div>';
  }

  /* ── view 1: the blueprint ───────────────────────────────────────────────────────────────
     The journey runs across the top as arrows. Under each stage, one card holds what the customer
     does there and how it leaves them, the colour on its top edge saying good, neutral or bad.
     Then the line of interaction, the work they see, the line of visibility, and the work they
     never see. A row with nothing in it is not drawn: an absent row is information, an empty one
     is noise. Channels sit on the cards as icons; systems and numbers sit in each card's detail. */

  var IC = {
    agent:'<rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4"/><circle cx="12" cy="3.5" r="1"/><path d="M9.5 13h.01M14.5 13h.01"/><path d="M9.5 16.2h5"/>'
  };
  var CH = {
    phone:['Phone','<path d="M6 3.5h3l1.5 4-2 1.5a11 11 0 0 0 5 5l1.5-2 4 1.5v3a1.5 1.5 0 0 1-1.6 1.5C10.2 17.6 6.4 13.8 4.5 5.1A1.5 1.5 0 0 1 6 3.5z"/>'],
    email:['Email','<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.6 6.6 12 12.5l8.4-5.9"/>'],
    letter:['Letter','<rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M7 9h10M7 12.5h10M7 16h6"/>'],
    portal:['Portal','<rect x="2.5" y="4.5" width="19" height="13" rx="2"/><path d="M2.5 8.5h19"/><path d="M8 20.5h8"/>'],
    app:['App','<rect x="7" y="2.5" width="10" height="19" rx="2.4"/><path d="M10.8 18.6h2.4"/>'],
    sms:['SMS','<path d="M20.5 12a7.5 7.5 0 0 1-11 6.7L4 20l1.4-4.2A7.5 7.5 0 1 1 20.5 12z"/>'],
    chat:['Chat','<path d="M20.5 12a7.5 7.5 0 0 1-11 6.7L4 20l1.4-4.2A7.5 7.5 0 1 1 20.5 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/>'],
    'in-person':['In person','<circle cx="12" cy="7.5" r="3"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/>']
  };

  function actorName(id){ return (actors[id]||{}).name || id || ''; }

  function rail(label, sub, col, cls){
    return '<div class="jlb'+(cls?' '+cls:'')+'" style="--l-col:'+(col||'var(--mut)')+'"><b>'+esc(label)+'</b>'+
      (sub?'<em>'+esc(sub)+'</em>':'')+'</div>';
  }

  var FEELW = {positive:'good', neutral:'neutral', negative:'bad'};
  var FEELC = {positive:'pos', neutral:'neu', negative:'neg'};
  /* the customer's card: what they do here and how it leaves them, in one */
  function custCell(c){
    var st = c===OFF ? null : stages.filter(function(x){ return x.id===c; })[0];
    var d  = at(c,'customer-action').filter(function(s){ return !s._rm; });
    var doIt = onSlideRow('customer-action'),
        feel = onSlideRow('feel') && st && (st.sentiment || st.sentimentNote);
    if(c===OFF && !d.length) return '<div class="jcell jcu off"></div>';
    var acts = doIt ? (d.length ? d.map(function(s){ return card(s,'customer-action'); }).join('')
                                : '<span class="jnone">The customer does nothing here</span>') : '';
    return '<div class="jcell jcu'+(c===OFF?' off':'')+'"><div class="jcc '+(st&&FEELC[st.sentiment]||'non')+'">'+
      acts+PLUSBTN(c)+
      (feel ? '<div class="jfeel"><i></i><span>'+esc(st.sentimentNote||FEELW[st.sentiment]||'')+'</span></div>' : '')+
      '</div></div>';
  }

  var PEND=[];   /* a line whose own row was not drawn is drawn above the next row that is */
  function laneRow(L, out, ROWS){
    if(DIVIDERS[L.k]) PEND.push(DIVIDERS[L.k]);
    if(!onSlideRow(L.k)) return out;                                  /* left off the slide */
    var lists = cols.map(function(c){ return atLane(c,L.k).filter(function(s){ return !s._rm; }); });
    if(!lists.some(function(x){ return x.length; })) return out;       /* the row says nothing */
    var nd = PEND.length ? ' nd' : '';            /* under a line, the hairline would double it */
    PEND.forEach(function(t){ ROWS.push('min-content'); out += '<div class="jdiv"><span>'+esc(t)+'</span></div>'; });
    PEND=[];
    ROWS.push('auto');            /* a lane holds the steps, so a lane takes the slack */
    out += rail(L.label, L.sub, L.col, nd.trim());
    /* who does it: named only when the row holds more than one performer, otherwise the row label
       already says it */
    var who={}; lists.forEach(function(l){ l.forEach(function(s){ who[s.actorId||'']=1; }); });
    var named = Object.keys(who).length > 1;
    lists.forEach(function(l,x){
      out += '<div class="jcell'+nd+(cols[x]===OFF?' off':'')+'">'+l.map(function(s){ return card(s,L.k,named); }).join('')+'</div>';
    });
    return out;
  }

  function pad2(n){ n=String(n||''); return n.length===1 ? '0'+n : n; }

  function vBlueprint(){
    if(!stages.length) return '<p style="color:var(--mut)">No journey stages captured yet. The columns of a blueprint are the customer’s journey, so there is nothing to draw.</p>';
    var grid = 'minmax(118px,142px) repeat('+cols.length+',minmax(128px,1fr))';
    var ROWS=[], out='';
    PEND=[];

    /* --- the journey, as arrows --- */
    ROWS.push('min-content');
    out += '<div class="jcorner"></div>';
    cols.forEach(function(c,i){
      var last = i===cols.length-1, first = i===0;
      if(c===OFF){
        out += '<div class="jhd off'+(first?' first':'')+(last?' last':'')+'"'+EA('data-lock="off"')+'><span class="n">&nbsp;</span>Not on the journey</div>';
        return;
      }
      var s=stages.filter(function(x){ return x.id===c; })[0]||{};
      out += '<div class="jhd'+(first?' first':'')+(last?' last':'')+'"'+EA('data-stage="'+s.id+'"')+'><span class="n">'+
             pad2(s.order||i+1)+'</span>'+esc(s.name)+'</div>';
    });

    /* --- the customer: what they do, and how it leaves them --- */
    if(onSlideRow('customer-action') || onSlideRow('feel')){
      ROWS.push('min-content');
      out += rail('Customer', 'What they do and how they feel', 'var(--ink)', 'nd');
      cols.forEach(function(c){ out += custCell(c); });
    }

    /* --- the rows of our own work --- */
    LANES.forEach(function(L){
      if(L.k==='customer-action') return;
      out = laneRow(L, out, ROWS);
    });

    return '<div class="jb" style="grid-template-columns:'+grid+
           ';grid-template-rows:'+ROWS.join(' ')+'">'+out+'</div>';
  }

  /* ── the small derivations the rows above read from ─────────────────────────────────────── */
  // the unit a column maps at: a KEY PROCESS where the team's work is sequenced into them,
  // otherwise the ACTIVITY BLOCK itself. ('phase'/'activity' are the pre-taxonomy spellings.)
  function atProcess(){ var u=WORLD.mappingUnit||DATA.mappingUnit; return u==='key process'||u==='phase'; }
  function unitWord(pl){ return atProcess() ? (pl?'Key processes':'Key process')
                                            : (pl?'Activity blocks':'Activity block'); }
  function unitsFor(stageId){
    var seen={}, out=[];
    steps.forEach(function(s){
      if((stageId===null ? !!s.stageId : s.stageId!==stageId)) return;
      if(s._rm) return;
      var n=s.unitName||s.blockId; if(!n||seen[n]) return;
      seen[n]=1; out.push(n);
    });
    return out;
  }
  function channelsAt(c){
    var seen={}, out=[];
    inCol(c).forEach(function(s){
      if(s._rm || !seenBy(s)) return;
      if(s.channel&&!seen[s.channel]){seen[s.channel]=1;out.push(s.channel);}
    });
    return out;
  }
  function systemsAt(c){
    var seen={}, out=[];
    inCol(c).forEach(function(s){
      if(s._rm) return;
      if(s.system&&!seen[s.system]){seen[s.system]=1;out.push(s.system);}
    });
    return out;
  }
  function painsAt(c){
    var out=[];
    inCol(c).forEach(function(s){ (s.pains||[]).forEach(function(p){ out.push(p); }); });
    return out;
  }
  /* the as-is pains, placed in the column their step sat in */
  function asPainsAt(c){
    return ASPAIN.filter(function(o){ return c===OFF ? !o.s.stageId : o.s.stageId===c; });
  }

  /* ── the detail window: what a card holds that the grid has no room for ──────────────────── */
  function stepById(id){ return steps.filter(function(s){ return s.id===id; })[0]; }
  function laneLabel(s){ var L=LANES.filter(function(x){ return x.k===laneOf(s); })[0]; return L?L.label:'Unclassified'; }
  function laneCol(s){ var L=LANES.filter(function(x){ return x.k===laneOf(s); })[0]; return L?L.col:'var(--line)'; }
  function painBlock(p, cls, head){
    var q=p.magnitude&&p.magnitude.value!=null;
    return '<div class="dblk '+cls+'"><i>'+head+'</i><p><b>'+esc(p.theme)+'</b>'+
      (q?' · '+esc(magText(p.magnitude)):' · not quantified')+
      (p.magnitudeNote && p.magnitudeNote!==String(p.magnitude&&p.magnitude.value)?'. '+esc(p.magnitudeNote):'')+
      (p.rootCause?'<br>'+esc(p.rootCause):'')+'</p></div>';
  }
  function openCard(id){
    var s=stepById(id); if(!s) return;
    var st=stages.filter(function(x){return x.id===s.stageId;})[0];
    var ai=isAgent(s), h='';
    h+='<div class="dh" style="--l-col:'+laneCol(s)+'"><div><div class="dk">'+esc(laneLabel(s))+(ai?' · AI':'')+
       (s._new?' · new in the to-be':'')+'</div><h2>'+esc(s.name)+'</h2></div>'+
       '<button class="dx" id="dlgx" aria-label="Close">&times;</button></div><div class="db">';
    h+='<div class="dfacts">'+
       '<div><i>Journey stage</i><span>'+esc(st?st.name:'Not on the journey')+'</span></div>'+
       '<div><i>'+esc(unitWord())+'</i><span>'+esc(s.unitName||s.blockId||'not recorded')+'</span></div>'+
       '<div><i>'+(ai?'Agent':'Performed by')+'</i><span>'+esc(actorName(s.actorId)||'not recorded')+'</span></div>'+
       '<div><i>'+(seenBy(s)?'Channel':'System')+'</i><span>'+
         esc(seenBy(s) ? (s.channel?chLabel(s.channel):'not recorded') : (s.system||'not recorded'))+'</span></div>'+
       '</div>';
    if(seenBy(s) && s.system) h+='<div class="dblk"><i>System that carries it</i><p>'+esc(s.system)+'</p></div>';
    if(s.sees) h+='<div class="dblk ag"><i>What the customer sees</i><p>'+esc(s.sees)+'</p></div>';
    if(s.does) h+='<div class="dblk"><i>'+(ai?'What the agent does':'What happens here')+'</i><p>'+esc(s.does)+'</p></div>';
    if(AGENTS && !ai && s.visibility==='backstage') h+='<div class="dblk"><i>Visibility</i><p>Our people do this out of the customer’s sight.</p></div>';
    painsOf(s).forEach(function(p){ h+=painBlock(p,'pn','Pain point'); });
    (s.fixes||[]).forEach(function(pid){
      var o=ASPAIN.filter(function(x){ return x.p.id===pid; })[0];
      if(o) h+=painBlock(o.p,'ok','Fixes this pain point from the as-is');
    });
    if(s._rm){
      h+='<div class="dblk"><i>In the to-be</i><p>This step is removed.</p></div>';
      (s._was||[]).forEach(function(p){ h+=painBlock(p,'ok','Its pain point goes with it'); });
    }
    if(s.tasks && s.tasks.length)
      h+='<div class="dblk"><i>Tasks inside it</i><ol>'+s.tasks.map(function(k){ return '<li>'+esc(k.name||'')+'</li>'; }).join('')+'</ol></div>';
    h+='</div>';
    var d=document.getElementById('dlg'); if(!d) return;
    d.innerHTML='<div class="dbox" role="dialog" aria-modal="true">'+h+'</div>';
    d.classList.add('on');
    document.getElementById('dlgx').onclick=closeCard;
  }
  function openPainRow(pid){
    var hit=steps.filter(function(s){ return (s.pains||[]).some(function(p){ return p.id===pid; }); })[0];
    if(hit){ openCard(hit.id); return; }
    var fx=(FIXED[pid]||[])[0]; if(fx){ openCard(fx.id); return; }
    var o=ASPAIN.filter(function(x){ return x.p.id===pid; })[0];
    if(o){ var gone=steps.filter(function(s){ return s.id===o.s.id; })[0]; if(gone) openCard(gone.id); }
  }
  function closeCard(){ var d=document.getElementById('dlg'); if(d){ d.classList.remove('on'); d.innerHTML=''; } }
  (function(){
    var d=document.getElementById('dlg');
    if(d) d.addEventListener('click',function(e){ if(e.target===d) closeCard(); });
    window.addEventListener('keydown',function(e){ if(e.key==='Escape') closeCard(); });
  })();
  /* cards open their detail whenever editing is off. With editing on, the edit layer binds the
     same elements after this and its panel wins. */
  function bindCards(){
    document.querySelectorAll('#vinner [data-card]').forEach(function(el){
      el.onclick=function(e){ e.stopPropagation(); openCard(el.getAttribute('data-card')); };
    });
    document.querySelectorAll('#vinner [data-pain]').forEach(function(el){
      el.onclick=function(e){ e.stopPropagation(); openPainRow(el.getAttribute('data-pain')); };
    });
  }

  /* ── view 2: the journey ─────────────────────────────────────────── */
  function vJourney(){
    if(!stages.length) return '<p style="color:var(--mut)">No journey stages captured yet.</p>';
    var cards = stages.map(function(s){
      var live  = inCol(s.id).filter(function(x){ return !x._rm; });
      var does  = live.filter(function(x){ return (x.visibility||'')==='customer-action'; }),

  /* Monotonic binary-search fit: the largest scale whose content still fits the frame, capped at
     1.0 so a short view fills rather than magnifies. Same fit every instrument uses. */
  function fit(){
    var view=document.getElementById('view'), inner=document.getElementById('vinner');
    inner.style.transform='scale(1)'; inner.style.width='100%';
    var prev=inner.querySelector('[data-stretch]');
    if(prev) prev.style.minHeight='';          /* measure unstretched, or it only ever grows */
    var availH=view.clientHeight, availW=view.clientWidth;
    if(!availH||!availW) return;
    var lo=0.4, hi=1.0*nrZ(), best=0.4;
    for(var i=0;i<18;i++){
      var mid=(lo+hi)/2;
      inner.style.width=(100/mid)+'%';
      inner.style.transform='scale('+mid+')';
      var fits = inner.scrollHeight*mid <= availH+0.5;
      if(fits){ best=mid; lo=mid; } else { hi=mid; }
    }
    inner.style.width=(100/best)+'%';
    inner.style.transform='scale('+best+')';
    /* the fit is capped at 1.0 so a short view never magnifies - so a short view also never
       fills the slide. Let the marked element take the slack instead. */
    var grow=inner.querySelector('[data-stretch]');
    if(grow && best>=0.999){
      var slack = availH/best - inner.scrollHeight;
      if(slack > 6) grow.style.minHeight = (grow.offsetHeight + slack) + 'px';
    }
  }

<script>
/* ── fitChrome() — the chrome stacks when it does not fit ────────────────────
   Measures the one-row layout and adds .stacked to the artifact root when any of
   six things is true: the two groups are closer than 12px · a control runs past
   either edge · a label has been squeezed narrower than its own text · the
   toprow wraps · the toprow comes within 6px of the action title · the viewport
   is at or below 760px (the floor). Exposed as window.fitChrome() so a render
   pass can call it after it changes a label. ── */
(function(){
  var busy=false,lastW=-1;
  function root(){return document.querySelector('#art,#pm,#pw');}
  function skip(e){
    if(!e) return true;
    if(e.id==='wpop'||(e.closest&&e.closest('#wpop'))) return true;
    var cs=getComputedStyle(e);
    if(cs.visibility==='hidden'||cs.display==='none') return true;
    return false;
  }
  function fitChrome(){
    if(busy) return; busy=true;
    try{
      var R=root(); if(!R) return;
      var tr=R.querySelector('.toprow'); if(!tr) return;
      R.classList.remove('stacked');
      void tr.offsetWidth;                                  /* force the reflow we measure */
      var need=window.innerWidth<=760, i, r, e;
      var trb=tr.getBoundingClientRect();
      /* 1. the two groups are closer than 12px */
      var tags=R.querySelector('.tags'), ctrls=R.querySelector('.ctrls');
      if(!need&&tags&&ctrls&&!skip(tags)&&!skip(ctrls)){
        var a=tags.getBoundingClientRect(), b=ctrls.getBoundingClientRect();
        if(b.left-a.right<12) need=true;
      }
      /* 2. a control runs past either edge */
      if(!need){
        var kids=tr.querySelectorAll('.nr-pill,.nr-track,.seg,.wgrp,button,#wnote');
        for(i=0;i<kids.length;i++){
          e=kids[i]; if(skip(e)) continue;
          r=e.getBoundingClientRect(); if(!r.width&&!r.height) continue;
          if(r.right>trb.right+0.5||r.left<trb.left-0.5){need=true;break;}
        }
      }
      /* 3. a label has been squeezed narrower than its own text */
      if(!need){
        var ls=tr.querySelectorAll('.nr-pill b,.nr-track,.seg button,button,#wnote,span');
        for(i=0;i<ls.length;i++){
          e=ls[i]; if(skip(e)) continue;
          if(!e.textContent||!e.textContent.trim()) continue;
          if(e.scrollWidth>e.clientWidth+1){need=true;break;}
        }
      }
      /* 4. the toprow wraps — a floating row that wraps grows downwards into the
         title without pushing anything down */
      if(!need){
        var tall=0,ch=tr.children;
        for(i=0;i<ch.length;i++){var h=ch[i].getBoundingClientRect().height;if(h>tall)tall=h;}
        if(trb.height>tall+2) need=true;
      }
      /* 5. the toprow sits on, or within 6px of, the action title */
      if(!need){
        var t=R.querySelector('.nr-strip'); if(!t||skip(t)) t=R.querySelector('h1');
        if(t&&!skip(t)){var tb=t.getBoundingClientRect(); if(tb.top-trb.bottom<6) need=true;}
      }
      if(need) R.classList.add('stacked');
      /* --padl is read AFTER the class lands: the class itself changes the padding */
      R.style.setProperty('--padl',(parseFloat(getComputedStyle(R).paddingLeft)||0)+'px');
    } finally { busy=false; }
  }
  window.fitChrome=fitChrome;
  function kick(){requestAnimationFrame(fitChrome);}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',kick); else kick();
  window.addEventListener('load',kick);
  window.addEventListener('resize',function(){lastW=-1;kick();});
  if(window.ResizeObserver){
    var ro=new ResizeObserver(function(en){
      var w=en&&en[0]?Math.round(en[0].contentRect.width):-1;
      if(w===lastW) return;                                 /* stacking must not re-trigger us */
      lastW=w; kick();
    });
    var r0=root(); if(r0) ro.observe(r0);
  }
})();
</script>
<script id="nr-topbar-js">
/* patch_topbar.py: one theme switch and the way home, the same in every instrument.
   Theme: the choice is kept under the cockpit's key, nr_dark, so every page of an
   engagement opens the same way. Home: a page that carries
   <meta name="nr-home" content="index.html"> (the engagement artifact adds it) gets
   "< Cockpit /" in front of its section tag. */
(function(){
  var K='nr_dark', box=document.getElementById('theme')||document.getElementById('tseg');
  if(box){
    box.querySelectorAll('button').forEach(function(b){ var d=b.getAttribute('data-s')==='dark';
      b.title=d?'Dark mode':'Light mode'; b.setAttribute('aria-label',b.title);
      b.addEventListener('click',function(){ try{ localStorage.setItem(K,d?'1':'0'); }catch(e){} }); });
    var v=null; try{ v=localStorage.getItem(K); }catch(e){}
    var dk=box.querySelector('button[data-s="dark"]');
    if(v==='1'&&dk&&!dk.classList.contains('on')) dk.click();
  }
  var m=document.querySelector('meta[name="nr-home"]'), lens=document.getElementById('lens')||document.querySelector('.toprow .nr-track');
  if(m&&lens&&!document.querySelector('.nr-crumb')){
    var c=document.createElement('div'); c.className='nr-track nr-crumb';
    var a=document.createElement('a'); a.className='nr-home'; a.href=m.getAttribute('content')||'index.html';
    a.textContent='\u2039 '+(m.getAttribute('data-label')||'Cockpit'); a.title='Back to the engagement cockpit';
    /* opened in a window of the findings dashboard (a frame of our own page): go back in that page, not in the frame */
    try{ if(window.parent!==window&&window.parent.document) a.target='_parent'; }catch(e){}
    var s=document.createElement('span'); s.className='nr-sep'; s.textContent='/';
    lens.parentNode.insertBefore(c,lens); c.appendChild(a); c.appendChild(s); c.appendChild(lens);
    if(window.fitChrome) requestAnimationFrame(window.fitChrome);
  }
})();
</script>
