<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Barometer — read-out</title>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}
  /* ===== NR BRAND THEME (inlined from brand.css; swap for a client template) ===== */
  #pw{--navy:#0B2347;--navy-fill:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;
      --slate-10:rgba(54,65,86,.09);--rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;
      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #pw[data-t="dark"]{--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--navy-fill:#243246;--accent:#8FC7E8;--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}
  body:has(#pw[data-t="dark"]){--page:#0E1620}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:3}
  .tags{display:flex;align-items:center;gap:11px;min-width:0}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)}
  .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:11.5px;letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #pw[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  .ctrls{display:flex;gap:9px;flex:none}
  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0;max-width:1300px}
  #pw[data-t="dark"] h1{color:#EAEFF5}
  h1 .hl{color:var(--green)}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 16px}
  .subt{font-size:15px;font-weight:600;color:var(--accent)}
  /* body / cards */
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:24px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;align-items:stretch}
  @media(max-width:1280px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
  .card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:20px 20px 18px;position:relative}
  .step{position:absolute;top:13px;left:14px;width:23px;height:23px;border-radius:50%;background:var(--slate-10);color:var(--mut);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .chd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:13px}
  .cnm{font-size:18px;font-weight:600;color:var(--ink);line-height:1.2}
  .cq{font-size:13px;color:var(--mut);line-height:1.35;margin-bottom:11px}
  .ladd{display:flex;gap:4px;margin:1px 0 15px}
  .lc{flex:1;height:7px;border-radius:4px}
  .subs{flex:1;display:flex;flex-direction:column;gap:16px}
  .sub-h{display:flex;align-items:center;gap:8px}
  .dot{flex:none;width:8px;height:8px;border-radius:50%}
  .sub-nm{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink);line-height:1.25}
  .sub-sc{flex:none;font-size:13.5px;font-weight:700}
  .ins{list-style:none;margin:5px 0 0;padding:0}
  .ins li{position:relative;padding-left:15px;font-size:14px;color:var(--txt);line-height:1.45;margin:4px 0}
  .ins li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--mut);opacity:.5}
  .na{font-size:13.5px;color:var(--mut);font-style:italic;margin:5px 0 0;line-height:1.4}
  .lead-n{width:44px;height:44px;border-radius:50%;color:#fff;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .ribbon{display:flex;gap:0;margin-bottom:22px;overflow-x:auto}
  .chev{flex:1;min-width:150px;padding:13px 16px;margin-left:-10px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
  .chev:first-child{margin-left:0}
  .chev .ct{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;line-height:1.2}
  .chev .cq2{font-size:12px;color:var(--txt);line-height:1.32;opacity:.85}
  .nb{flex:none;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
  .chpill{align-self:flex-start;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:999px;margin-top:3px}
  /* footer: source + legend bottom-left, trademark bottom-right */
  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:12px;font-size:clamp(9.5px,0.75vw,12px);color:var(--mut)}
  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  #ft .ov b{color:var(--ink)}
  .legend{display:flex;gap:7px}
  .lp{font-size:0.95em;font-weight:600;padding:0.2em 0.85em;border-radius:999px}
  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600}
  /* classic cyclic-arrow view */
  .classic{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,500px) minmax(0,1fr);gap:16px;align-items:start}
  .classic>svg{align-self:center}
  .cl-col{display:flex;flex-direction:column;gap:14px}
  .cl-h{display:flex;align-items:center;gap:8px;margin-bottom:1px}
  .cl-num{flex:none;display:inline-flex;width:19px;height:19px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center}
  #pw[data-t="dark"] .cl-num{background:var(--accent);color:var(--navy)}
  .cl-n{font-size:13.5px;font-weight:700;color:var(--navy)}
  #pw[data-t="dark"] .cl-n{color:#EAEFF5}
  .cl-q{font-size:11.5px;font-style:italic;color:var(--mut);margin:0 0 4px 27px}
  .classic .ins{margin-left:27px}
  .classic .ladd{margin:3px 0 9px 27px;max-width:200px}
  .classic .ins li{font-size:12.5px;line-height:1.4}
  .classic .ins li::before{background:var(--bc,var(--mut));opacity:1;width:6px;height:6px;top:7px}
  @media(max-width:1100px){
    .classic{grid-template-columns:1fr 1fr;justify-items:start;gap:14px 26px}
    .classic>svg{grid-column:1/-1;order:-1;max-width:380px;justify-self:center;margin-bottom:4px}
  }
  @media(max-width:680px){
    .classic{grid-template-columns:1fr}
    .classic>svg{max-width:320px}
  }
  /* ================= BAROMETER BODY (content) ================= */
  .dcols{display:grid;grid-template-columns:2fr 1fr;gap:38px;align-items:start}
  .dcol-side{padding-left:6px;min-width:0}
  .dcol-main{min-width:0}
  .colhead{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.1px;margin:0 0 14px}
  .conc-grp{margin-bottom:16px}
  .conc-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px}
  .conc-h.pos{color:var(--pos)} .conc-h.neg{color:var(--neg)}
  .conc-ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .conc-ul li{position:relative;padding-left:16px;font-size:13.5px;line-height:1.4;color:var(--ink)}
  .conc-ul li::before{content:"";position:absolute;left:3px;top:7px;width:6px;height:6px;border-radius:50%}
  .conc-ul.pos li::before{background:var(--pos)} .conc-ul.neg li::before{background:var(--neg)}
  .insights.conc{display:flex;flex-direction:column;gap:15px}
  .conc-k{display:block;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
  .conc-t{display:block;font-size:13.5px;line-height:1.42;color:var(--ink)}
  .conc-so{display:block;margin-top:2px;background:var(--tint);border-left:4px solid var(--nr-green);border-radius:8px;padding:12px 14px}
  .conc-so-k{display:block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--nr-green);margin-bottom:4px}
  .conc-so-t{display:block;font-size:14px;font-weight:600;line-height:1.42;color:var(--ink)}
  .cap{font-size:12px;color:var(--muted);line-height:1.4;margin:-2px 0 10px}
  .cap b{color:var(--ink);font-weight:700}

  /* barometer token map onto NR palette (chrome above stays PW) */
  #pw{--nr-navy:var(--navy);--nr-green:var(--green);--muted:var(--mut);--border:var(--line);--hair:var(--line);--tint:var(--slate-10);
      --s1:#8C2B26;--s2:#B4483C;--s3:#C98A2C;--s4:#9FC3AE;--s5:#4F9A72;--s6:#1C7A4A;--pos:#1C7A4A;--neg:#A8352F;--warn:#96660A}
  #pw[data-t="dark"]{--tint:#243246;--s1:#C0453E;--s2:#D06A4A;--s3:#D8A64A;--s4:#7FB49A;--s5:#40A579;--s6:#2FBE86;--pos:#3FBE86;--neg:#D0655C;--warn:#D2A64A}
  .seg.small button{padding:4px 10px;font-size:11px}
  .legend{flex-wrap:wrap;align-items:center;gap:9px}
  .legend .lp{display:inline-flex;align-items:center;gap:5px;padding:0;background:none;border-radius:0}
  .legend .sw{width:11px;height:11px;border-radius:2px;display:inline-block}
/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh);padding:14px 16px;min-width:0}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.kpi .v{font-size:30px;font-weight:800;line-height:1;color:var(--ink)}
.kpi .u{font-size:14px;font-weight:700;color:var(--muted)}
.kpi.pos .v{color:var(--pos)} .kpi.neg .v{color:var(--neg)}
.kpi .s{font-size:11px;color:var(--muted);margin-top:5px}
/* section label */
.slab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 9px}
/* theme strip */
.themes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tcard{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh);padding:11px 13px;min-width:0}
.tcard .tn{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:8px;min-height:30px}
.tbar{height:8px;background:var(--hair);position:relative;overflow:hidden}
.tbar>i{position:absolute;left:0;top:0;bottom:0;background:var(--nr-green)}
.tcard .tv{font-size:19px;font-weight:800;color:var(--ink);margin-top:8px}
.tcard .tv small{font-size:11px;font-weight:700;color:var(--muted)}
/* insight band */
.insights{display:flex;flex-direction:column;gap:9px}
.ins{display:flex;gap:11px;align-items:flex-start}
.ins .num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--nr-navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
#pw[data-t="dark"] .ins .num{background:var(--nr-green)}
.ins .tx{font-size:13.5px;line-height:1.4;color:var(--ink)}
.ins .tx b{font-weight:700}
/* distribution rows */
.dist{display:flex;flex-direction:column;gap:3px}
.dgrp{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.drow{display:flex;align-items:center;gap:10px;padding:3px 0}
.drow .dl{width:160px;flex:none;font-size:13px;font-weight:600;color:var(--ink)}
.drow .db{flex:1;height:23px;display:flex;overflow:hidden;background:var(--hair);border-radius:3px}
.drow .db span{height:100%}
.drow .df{width:80px;flex:none;text-align:right;font-size:13px}
.drow .df b{font-weight:800}
.drow .df i{font-style:normal;color:var(--muted);font-size:11px}
/* heatmap */
.hmctl{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.hmctl .lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.hm{border-collapse:separate;border-spacing:3px;width:100%;table-layout:fixed}
table.hm th.rw{width:132px}
table.hm td,table.hm th.col{overflow:hidden;text-overflow:ellipsis}
table.hm th.col{font-size:12px;font-weight:700;color:var(--ink);text-align:center;vertical-align:bottom;padding:2px 4px 6px}
table.hm th.rw{font-size:13.5px;text-align:left;padding-right:10px;white-space:nowrap;color:var(--ink);font-weight:600}
table.hm th.rw .chip{font-size:9px;font-weight:700;color:var(--muted);background:var(--tint);padding:1px 5px;margin-left:4px}
table.hm td{height:73px;text-align:center;font-size:15px;font-weight:700;color:#fff;min-width:56px}
table.hm td.na{background:var(--hair)!important;color:var(--muted)!important;font-weight:400}
table.hm tr.all th.rw{font-weight:800;color:var(--nr-navy)}
#pw[data-t="dark"] table.hm tr.all th.rw{color:var(--ink)}
table.hm tr.all td{outline:2px solid rgba(0,32,91,.35);outline-offset:-2px}
.hmleg{display:flex;gap:9px;align-items:center;margin-top:9px;font-size:11px;color:var(--muted)}
.dqbox{margin-top:12px;border:1px solid var(--border);border-left:4px solid var(--warn);background:var(--tint);padding:9px 13px;font-size:11.5px;color:var(--ink)}
.dqbox b{color:var(--warn)}

  /* -- responsive chrome: on a narrow screen the absolute toprow would collide, so drop it
     into normal flow and let it wrap (applies to every artifact that uses this chrome) -- */
  @media (max-width:760px){
    #art,#pm,#pw{padding:14px 18px 10px 42px}
    .nr-rail{width:24px}
    .toprow{position:static;top:auto;right:auto;margin:0 0 12px;flex-wrap:wrap;justify-content:flex-start;gap:10px 12px}
    .tags{flex-wrap:wrap;gap:8px;margin-left:-42px}
    .ctrls{flex-wrap:wrap;gap:8px;flex:1 1 100%}
  }
  /*<EDIT>*/
  #pw.editing .dcol-side{cursor:pointer;transition:.12s}
  #pw.editing .dcol-side:hover{outline:2px solid var(--accent);outline-offset:4px;border-radius:12px}
  #pw.editing #title{cursor:pointer;transition:.12s}
  #pw.editing #title:hover{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
  #pw.editing .dcol-main{opacity:.5;filter:saturate(.7);cursor:help;transition:.15s}
  #lock{width:34px;height:34px;border:1px solid var(--line);background:var(--card);border-radius:9px;color:var(--mut);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  #lock svg{width:17px;height:17px;display:block}
  #lock.unlocked{background:var(--rag-amber);border-color:var(--rag-amber);color:#fff}
  #save{font-size:12px;font-weight:700;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:8px 13px;border-radius:9px;cursor:pointer;display:none}
  #save.show{display:inline-flex} #save:disabled{opacity:.45;cursor:default}
  #ed{position:fixed;top:0;right:0;bottom:0;width:410px;max-width:92vw;overflow:hidden;background:var(--card);border-left:1px solid var(--line);box-shadow:-18px 0 44px -24px rgba(11,35,71,.4);z-index:90;display:none;flex-direction:column}
  #ed.on{display:flex}
  #ed .edh{flex:none;position:relative;padding:14px 20px 12px;border-bottom:1px solid var(--line);background:var(--slate-10)}
  #ed .edh .row{display:flex;align-items:center;gap:9px;padding-right:40px}
  #ed .edh .kind{flex:none;font-size:8.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--navy);padding:3px 7px;border-radius:5px}
  #ed .edh h3{margin:0;font-size:15px;font-weight:800;color:var(--ink);line-height:1.25}
  #ed .edh .x{position:absolute;top:12px;right:15px;width:26px;height:26px;border:0;background:none;font-size:19px;color:var(--mut);cursor:pointer;border-radius:6px}
  #ed .edb{flex:1;min-height:0;overflow:auto;padding:16px 20px}
  #ed .edf{flex:none;display:flex;gap:8px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:var(--slate-10)}
  #ed .edf .sp{flex:1}
  #ed .f{margin-bottom:13px} #ed .f label{display:block;font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin:0 0 5px}
  #ed .f input,#ed .f textarea{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:12.5px;color:var(--ink);background:var(--card)}
  #ed .f input:focus,#ed .f textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,177,209,.18)}
  #ed .f textarea{min-height:56px;resize:none;overflow:hidden;line-height:1.5}
  #ed .cap{display:block;font-size:10px;color:var(--mut);font-weight:400;margin-top:4px;letter-spacing:0;text-transform:none}
  #ed .cap2{font-weight:400;color:var(--mut);letter-spacing:0;text-transform:none;margin-left:4px}
  #ed .edq{font-size:11px;color:var(--mut);margin-top:6px}
  #ed .sect{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
  #ed .sect.pos{border-left-color:var(--rag-green)} #ed .sect.pos label{color:var(--rag-green)}
  #ed .sect.neg{border-left-color:var(--rag-amber)} #ed .sect.neg label{color:#B07A1E}
  #ed .sect.take{border-left-color:var(--navy);background:var(--slate-10)} #ed .sect.take label{color:var(--navy)}
  #ed .sect label{display:block;font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin:0 0 5px}
  #ed .sect textarea{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:12.5px;color:var(--ink);background:var(--card);min-height:56px;resize:none;overflow:hidden;line-height:1.5}
  #ed .sect textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,177,209,.18)}
  #ed .prev{margin-top:7px;padding:9px 11px;border-radius:8px;background:var(--slate-10);font-size:12.5px;font-weight:700;color:var(--navy);line-height:1.4}
  #ed .prev .hl{color:var(--green)}
  .nr-toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(6px);background:var(--navy);color:#fff;font-size:12.5px;font-weight:600;line-height:1.45;padding:11px 18px;border-radius:10px;z-index:99;max-width:520px;text-align:center;opacity:0;pointer-events:none;transition:.25s}
  .nr-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .lockchip{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);background:var(--slate-10);border-radius:999px;padding:3px 10px;margin-left:9px;vertical-align:2px}
  .lockchip svg{width:10px;height:10px}
  #ed .wbtn{font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
  #ed .wbtn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
  /*</EDIT>*/

  /* action-title editor extensions — the house standard (editable-deliverable.md) */

      kpi("Reported teams", teams.filter(function(t){return t.reported;}).length, "", "", "min cell "+D.response.minCell)+
    '</div>';
    html+='<div class="slab">Favourable by theme</div><div class="themes">'+
      themes.map(function(t){var c=t.favourablePct>=70?"var(--pos)":t.favourablePct>=50?"var(--warn)":"var(--neg)";
        return '<div class="tcard"><div class="tn">'+esc(t.name)+'</div><div class="tbar"><i style="width:'+t.favourablePct+'%;background:'+c+'"></i></div><div class="tv">'+t.favourablePct.toFixed(0)+'<small>% fav · '+fmtMean(t.mean)+'/6</small></div></div>';}).join("")+'</div>';
    html+='<div class="slab">Key insights</div><div class="insights">'+
      '<div class="ins"><span class="num">1</span><span class="tx"><b>Strength:</b> '+esc(top.label)+' scores '+top.favourablePct.toFixed(0)+'% favourable — job content, team and skills are solid.</span></div>'+
      '<div class="ins"><span class="num">2</span><span class="tx"><b>Attention:</b> '+esc(low.label)+' is lowest at '+low.favourablePct.toFixed(0)+'% favourable; the Workload theme sits at '+(themes.filter(function(t){return t.name==="Workload";})[0]||{favourablePct:0}).favourablePct.toFixed(0)+'%.</span></div>'+
      (lead?'<div class="ins"><span class="num">3</span><span class="tx"><b>Leadership:</b> support and motivation aggregate to '+lead.favourablePct.toFixed(0)+'% favourable — a develop-further zone, not a red flag.</span></div>':'')+
    '</div>';
    return html;
  }

  function renderDistribution(){
    var order=["Work & Role","Team & Atmosphere","Workload","Enablement","Leadership"];
    var byTheme={}; statements.forEach(function(s){(byTheme[s.theme]=byTheme[s.theme]||[]).push(s);});
    var html='<div class="dist">';
    order.forEach(function(th){ if(!byTheme[th])return;
      html+='<div class="dgrp">'+esc(th)+'</div>';
      byTheme[th].forEach(function(s){
        var segs=s.dist.map(function(p,i){return p>0?'<span title="'+esc(D.scale.labels[i])+': '+p+'%" style="width:'+p+'%;background:var(--s'+(i+1)+')"></span>':'';}).join("");
        var favc=s.favourablePct>=70?"var(--pos)":s.favourablePct>=50?"var(--warn)":"var(--neg)";
        html+='<div class="drow"><div class="dl">'+esc(s.label)+'</div><div class="db">'+segs+'</div>'+
          '<div class="df"><b style="color:'+favc+'">'+s.favourablePct.toFixed(0)+'%</b> <i>n='+s.n+'</i></div></div>';
      });
    });
    html+='</div>';
    return html;
  }

  var hmCols="themes", hmMetric="avg";
  function renderHeatmap(){
    var cols = hmCols==="themes" ? themes.map(function(t){return {label:t.name,key:t.name,kind:"theme"};})
             : statements.map(function(s){return {label:s.label,key:s.id,kind:"stmt"};});
    var rows=[{name:"ALL",all:true,n:D.overall.respondents,get:function(c){return metricFromAgg(allAgg(c));}}]
      .concat(teams.map(function(tm){return {name:tm.name,reported:tm.reported,n:tm.n,
        get:function(c){var m=c.kind==="theme"?tm.byTheme[c.key]:tm.byStatement[c.key];return m;}};}));
    function allAgg(c){ if(c.kind==="theme"){var t=themes.filter(function(x){return x.name===c.key;})[0];return {mean:t.mean,fav:t.favourablePct};}
      var s=statements.filter(function(x){return x.id===c.key;})[0];return {mean:s.mean,fav:s.favourablePct};}
    function metricFromAgg(m){return m;}
    var html='<div class="hmctl"><span class="lab">Group by</span><div class="seg small" id="hmc"><button data-v="themes"'+(hmCols==="themes"?' class="on"':'')+'>By theme</button><button data-v="statements"'+(hmCols==="statements"?' class="on"':'')+'>By question</button></div>'+
      '<span class="lab" style="margin-left:8px">Show</span><div class="seg small" id="hmm"><button data-v="avg"'+(hmMetric==="avg"?' class="on"':'')+'>Average score</button><button data-v="fav"'+(hmMetric==="fav"?' class="on"':'')+'>% favourable</button></div></div>';
    html+='<table class="hm"><thead><tr><th class="rw"></th>'+cols.map(function(c){return '<th class="col">'+esc(c.label)+'</th>';}).join("")+'</tr></thead><tbody>';
    rows.forEach(function(r){
      html+='<tr class="'+(r.all?"all":"")+'"><th class="rw">'+esc(r.name)+'<span class="chip">n='+r.n+'</span></th>';
      if(r.reported===false){ cols.forEach(function(){html+='<td class="na">n/r</td>';}); html+='</tr>'; return; }
      cols.forEach(function(c){var m=r.get(c);
        if(!m){html+='<td class="na">–</td>';return;}
        var val=hmMetric==="avg"?m.mean:m.fav; var bg=hmMetric==="avg"?avgColor(m.mean):favColor(m.fav);
        var txt=hmMetric==="avg"?m.mean.toFixed(1):Math.round(m.fav)+"%";
        html+='<td style="background:'+bg+';color:'+textOn(bg)+'">'+txt+'</td>';});
      html+='</tr>';
    });
    html+='</tbody></table>';
    
    
    return html;
  }

  function buildConclusions(D){var st=D.statements,th=D.themes,f=function(x){return Math.round(x);};function tops(theme,best){var a=st.filter(function(s){return s.theme===theme;});if(!a.length)return null;a.sort(function(x,y){return best?y.favourablePct-x.favourablePct:x.favourablePct-y.favourablePct;});return a[0];}var byFav=th.slice().sort(function(a,b){return b.favourablePct-a.favourablePct;});var top=byFav.slice(0,2);var rest=byFav.slice(2);var bot=(rest.length?rest:byFav).slice(-2).sort(function(a,b){return a.favourablePct-b.favourablePct;});var strengths=top.map(function(t){var s=tops(t.name,true);return t.name+' is strong at '+f(t.favourablePct)+'% favourable'+(s?', led by '+s.label+' ('+f(s.favourablePct)+'%)':'')+'.';});var attentions=bot.map(function(t,i){var s=tops(t.name,false);return t.name+(i===0?' needs the most attention':' is also soft')+' at '+f(t.favourablePct)+'% favourable'+(s?', where '+s.label+' sits at '+f(s.favourablePct)+'%':'')+'.';});var worst=bot[0],ws=tops(worst.name,false),best=top[0];var takeaway='Focus on '+worst.name+' first \u2014 understand why '+(ws?ws.label:worst.name)+' scores just '+f(worst.favourablePct)+'% favourable and act on it, while protecting the strong '+best.name+'.';return {strengths:strengths,attentions:attentions,takeaway:takeaway};}
  function renderConclusions(){var C=(D.conclusions&&D.conclusions.strengths)?D.conclusions:buildConclusions(D);function ul(items,cls){return '<ul class="conc-ul '+cls+'">'+items.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>';}var h='';if(C.strengths&&C.strengths.length)h+='<div class="conc-grp"><div class="conc-h pos">Strengths</div>'+ul(C.strengths,'pos')+'</div>';if(C.attentions&&C.attentions.length)h+='<div class="conc-grp"><div class="conc-h neg">Attention areas</div>'+ul(C.attentions,'neg')+'</div>';if(C.takeaway)h+='<div class="conc-so"><span class="conc-so-k">\u2192 Key take-away</span><span class="conc-so-t">'+esc(C.takeaway)+'</span></div>';return h;}
  function buildSegmentConclusions(D){var segs=(D.segments||D.teams||[]).filter(function(x){return x&&x.reported!==false&&x.favourablePct!=null;});var themes=D.themes,f=function(x){return Math.round(x);};if(segs.length<2)return null;function weak(seg){if(!seg.byTheme)return [];var a=themes.map(function(t){var m=seg.byTheme[t.name];return m?{name:t.name,fav:m.fav}:null;}).filter(Boolean);a.sort(function(x,y){return x.fav-y.fav;});return a.slice(0,2);}var byFav=segs.slice().sort(function(a,b){return b.favourablePct-a.favourablePct;});var best=byFav[0],worst=byFav[byFav.length-1];var standouts=[best.name+' is the strongest segment at '+f(best.favourablePct)+'% favourable, well above the rest.'];var low=byFav.slice(-2).sort(function(a,b){return a.favourablePct-b.favourablePct;});var support=low.map(function(sg,i){var w=weak(sg);return sg.name+(i===0?' is the lowest':' is also soft')+' at '+f(sg.favourablePct)+'% favourable'+(w.length?', weakest on '+w.map(function(x){return x.name+' ('+f(x.fav)+'%)';}).join(' and '):'')+'.';});var gap=null;themes.forEach(function(t){var v=segs.map(function(sg){return sg.byTheme&&sg.byTheme[t.name]?sg.byTheme[t.name].fav:null;}).filter(function(x){return x!=null;});if(v.length>1){var mx=Math.max.apply(null,v),mn=Math.min.apply(null,v);if(!gap||(mx-mn)>gap.r)gap={n:t.name,r:mx-mn,mx:mx,mn:mn};}});var takeaway='Prioritise '+worst.name+' ('+f(worst.favourablePct)+'% favourable)'+(gap?'; '+gap.n+' shows the widest gap across segments ('+f(gap.mn)+'\u2013'+f(gap.mx)+'%)':'')+'. Learn from '+best.name+' ('+f(best.favourablePct)+'%).';return {standouts:standouts,support:support,takeaway:takeaway};}
  function renderSegmentConclusions(){var C=buildSegmentConclusions(D);if(!C)return renderConclusions();function ul(items,cls){return '<ul class="conc-ul '+cls+'">'+items.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>';}var h='';if(C.standouts&&C.standouts.length)h+='<div class="conc-grp"><div class="conc-h pos">Standout segments</div>'+ul(C.standouts,'pos')+'</div>';if(C.support&&C.support.length)h+='<div class="conc-grp"><div class="conc-h neg">Segments to support</div>'+ul(C.support,'neg')+'</div>';if(C.takeaway)h+='<div class="conc-so"><span class="conc-so-k">\u2192 Key take-away</span><span class="conc-so-t">'+esc(C.takeaway)+'</span></div>';return h;}
  function conclBlock(){return '<div class="colhead" style="margin-top:18px">Conclusions</div>'+renderConclusions();}
  var VIEWS={distribution:function(){return '<div class="dcols"><div class="dcol-main"><div class="colhead">Survey outcome</div><div class="cap">Each bar is the full 1\u20136 response spread. <b>% favourable</b> = share answering 4\u20136 (rather agree, agree, completely agree).</div>'+renderDistribution()+'</div><div class="dcol-side"><div class="colhead">Conclusions</div>'+renderConclusions()+'</div></div>';},heatmap:function(){return '<div class="dcols"><div class="dcol-main"><div class="colhead">Segment breakdown</div>'+renderHeatmap()+'</div><div class="dcol-side"><div class="colhead">Conclusions</div>'+renderSegmentConclusions()+'</div></div>';}},cur="distribution";
  function fitView(){var v=document.getElementById('view'),vi=document.getElementById('vinner');var ah=v.clientHeight;if(!ah)return;var st=vi.querySelector('[data-stretch]');if(st)st.style.height='';vi.style.transform='none';var lo=0.25,hi=1.12,best=0.25;for(var k=0;k<12;k++){var s=(lo+hi)/2;vi.style.width=(100/s)+'%';var H=vi.scrollHeight;if(H*s<=ah-10){best=s;lo=s;}else{hi=s;}}vi.style.width=(100/best)+'%';vi.style.transform='scale('+best+')';if(st){var free=(ah-10)/best-vi.scrollHeight;if(free>1)st.style.height=(st.offsetHeight+free)+'px';}}
  function render(){document.getElementById("vinner").innerHTML=VIEWS[cur]();
    if(cur==="heatmap"){wireSeg("hmc",function(v){hmCols=v;render();});wireSeg("hmm",function(v){hmMetric=v;render();});}
    /*<EDIT>*/bindEdit();/*</EDIT>*/
    requestAnimationFrame(fitView);setTimeout(fitView,50);}
  function wireSeg(id,cb){var box=document.getElementById(id);if(!box)return;box.querySelectorAll("button").forEach(function(b){b.onclick=function(){cb(b.getAttribute("data-v"));};});}
  function seg(id,attr,cb){var box=document.getElementById(id);box.querySelectorAll("button").forEach(function(b){b.onclick=function(){box.querySelectorAll("button").forEach(function(x){x.classList.remove("on");});b.classList.add("on");cb(b.getAttribute(attr));};});}
  seg("views","data-v",function(v){cur=v;render();});
  seg("theme","data-s",function(t){document.getElementById("pw").setAttribute("data-t",t);render();});
  (function(){var segs=(D.segments||D.teams||[]);if(segs.length<2){var hb=document.querySelector('#views button[data-v="heatmap"]');if(hb)hb.remove();delete VIEWS.heatmap;if(cur==="heatmap")cur="distribution";}})();
  window.addEventListener("resize",fitView);
/*<EDIT>*/

  var ON=false, CHANGES={}, edp=null;
  var LOCK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>', UNLOCK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>';
  function bump(){var b=document.getElementById("save");var n=Object.keys(CHANGES).length;b.className=ON||n?"show":"";b.disabled=!n;b.textContent=n?("Export "+n+" change"+(n>1?"s":"")):"No changes";}
  function setEditing(on){ON=!!on;document.getElementById("pw").classList.toggle("editing",ON);
    var g=document.getElementById("lock");g.classList.toggle("unlocked",ON);g.innerHTML=ON?UNLOCK_SVG:LOCK_SVG;g.title=ON?"Editing unlocked — click to lock":"Locked — click to edit";
    if(!ON&&edp)edp.classList.remove("on");bump();render();}
  function bindEdit(){ if(!ON) return;
    document.querySelectorAll("#vinner .dcol-side").forEach(function(el){el.onclick=function(){openConclusions();};});
    document.getElementById("title").onclick=function(){openConclusions();};
    document.querySelectorAll("#vinner .dcol-main").forEach(function(el){
      var ch=el.querySelector(".colhead");
      if(ch&&!ch.querySelector(".lockchip")){var c=document.createElement("span");c.className="lockchip";c.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>'+" locked";ch.appendChild(c);}
      el.onclick=function(){toast("Survey numbers are the respondents\u2019 aggregated self-report \u2014 locked by design, not a bug. Edit the story via the Conclusions column; a data fix means re-processing the responses.");};});}
  function bullets(v){return (v||[]).map(function(x){return "\u2022 "+x;}).join("\n");}
  function unbullets(t){return String(t||"").split("\n").map(function(x){return x.replace(/^\s*[\u2022\-\*]\s?/,"").trim();}).filter(Boolean);}
  function bindBullets(ta){
    if(ta.value.trim()&&!/^\s*\u2022/.test(ta.value))ta.value=bullets(unbullets(ta.value));
    ta.addEventListener("focus",function(){if(!ta.value.trim()){ta.value="\u2022 ";}});
    ta.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();
      var s=ta.selectionStart,ep=ta.selectionEnd,v=ta.value;
      ta.value=v.slice(0,s)+"\n\u2022 "+v.slice(ep);ta.selectionStart=ta.selectionEnd=s+3;
      ta.dispatchEvent(new Event("input",{bubbles:true}));}});
    ta.addEventListener("blur",function(){ta.value=bullets(unbullets(ta.value));});}
  var _tt=null;
  function toast(m){var t=document.querySelector('.nr-toast');if(!t){t=document.createElement('div');t.className='nr-toast';document.body.appendChild(t);}
    t.textContent=m;t.classList.add('on');clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove('on');},3200);}

  function openConclusions(){ if(!ON) return; edp=document.getElementById("ed");
    var C=(D.conclusions&&D.conclusions.strengths)?D.conclusions:{strengths:[],attentions:[],takeaway:""};
    edp.innerHTML='<div class="edh"><button class="x" id="edx">&times;</button><div class="row"><span class="kind">Narrative</span><h3>Conclusions &amp; action title</h3></div><div class="edq">'+esc(D.teamName||"")+' — survey numbers stay locked; this panel edits the story, not the data</div></div>'+
      '<div class="edb">'+
      '<div class="f"><label>Action title</label><textarea id="f_km">'+esc(D.keyMessage||"")+'</textarea><button class="kmhl" id="km_hl" title="Wrap the selected words in **\u2026** so they render green"><span class="swch"></span>Highlight selection</button></div>'+
      '<div class="f"><label>Preview \u2014 exactly as it renders</label><div class="prev" id="km_prev"></div></div><div class="kmhints"><b>Formatting</b><span class="kchip">**42 FTE**</span> &rarr; <span style="color:var(--green);font-weight:700">42 FTE</span> \u2014 green highlight for the load-bearing numbers and words.<br>Everything else renders <span style="color:var(--navy);font-weight:700">bold navy</span> automatically \u2014 no HTML needed (tags are not interpreted).<br><b style="margin-top:7px">Good title checklist</b>The conclusion, not the topic \u00b7 \u22652 numbers \u00b7 one structural implication \u00b7 no hedging.</div>'+
      '<div class="sect pos"><label>Strengths<span class="cap2">each line is a bullet — Enter adds one</span></label><textarea id="f_str">'+esc(bullets(C.strengths))+'</textarea></div>'+
      '<div class="sect neg"><label>Attention areas<span class="cap2">each line is a bullet — Enter adds one</span></label><textarea id="f_att">'+esc(bullets(C.attentions))+'</textarea></div>'+
      '<div class="sect take"><label>Key take-away</label><textarea id="f_tk">'+esc(C.takeaway||"")+'</textarea></div>'+
      '</div><div class="edf"><span class="sp"></span><button class="wbtn" id="edc">Cancel</button><button class="wbtn pri" id="edok">Apply</button></div>';
    edp.classList.add("on");
    var kmp=edp.querySelector("#km_prev"),kmt=edp.querySelector("#f_km");
    function prev(){kmp.innerHTML=hl(kmt.value||"");}
    prev();kmt.addEventListener("input",prev);
    edp.querySelector('#km_hl').onclick=function(){
      var s=kmt.selectionStart,e2=kmt.selectionEnd,v=kmt.value;
      if(s===e2){kmt.focus();return;}
      var sl=v.slice(s,e2);
      if(/^\*\*[\s\S]*\*\*$/.test(sl)){kmt.value=v.slice(0,s)+sl.slice(2,-2)+v.slice(e2);kmt.setSelectionRange(s,e2-4);}
      else{kmt.value=v.slice(0,s)+'**'+sl+'**'+v.slice(e2);kmt.setSelectionRange(s,e2+4);}
      kmt.dispatchEvent(new Event('input',{bubbles:true}));kmt.focus();};

    bindBullets(edp.querySelector("#f_str"));bindBullets(edp.querySelector("#f_att"));
    edp.querySelectorAll("textarea").forEach(function(ta){function grow(){ta.style.height="auto";ta.style.height=(ta.scrollHeight+2)+"px";}
      ta.addEventListener("input",grow);setTimeout(grow,10);});
    edp.querySelector("#edx").onclick=edp.querySelector("#edc").onclick=function(){edp.classList.remove("on");};
    edp.querySelector("#edok").onclick=function(){
      var km=edp.querySelector("#f_km").value.trim();
      var st=unbullets(edp.querySelector("#f_str").value);
      var at=unbullets(edp.querySelector("#f_att").value);
      var tk=edp.querySelector("#f_tk").value.trim();
      if(km!==(D.keyMessage||"")){D.keyMessage=km;CHANGES.keyMessage={keyMessage:km};document.getElementById("title").innerHTML=hl(km);}
      var nc={strengths:st,attentions:at,takeaway:tk};
      if(JSON.stringify(nc)!==JSON.stringify(D.conclusions||{})){D.conclusions=nc;CHANGES.conclusions={conclusions:nc};}
      bump();edp.classList.remove("on");render();};}
  function exportDelta(){var n=Object.keys(CHANGES).length;if(!n)return;var out={kind:"team-barometer-delta",team:D.teamName,exportedAt:new Date().toISOString().slice(0,10),changes:{}};
    Object.keys(CHANGES).forEach(function(k){Object.assign(out.changes,CHANGES[k]);});
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}));a.download="D-"+new Date().toISOString().slice(0,10)+"-team-barometer.json";a.click();}
  (function(){var g=document.getElementById("lock"),b=document.getElementById("save");
    if(g)g.onclick=function(e){e.stopPropagation();setEditing(!ON);};
    if(b)b.onclick=exportDelta;setEditing(false);})();
/*</EDIT>*/
  render();
})();
</script>
</body></html>
