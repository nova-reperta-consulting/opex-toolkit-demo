<!doctype html>
<!-- ============================================================================
  WASTE OBSERVATIONS  |  artifact template, derived from
  diagnostic-skill-builder/templates/artifact-shell-editable.html

  TWO FILES: scripts/render_waste.py strips the editing fences to build the client
  waste-observations.html (the file you SEND, with the editing layer removed) and keeps
  them for waste-observations.WORKING.html (editable, never sent).

  Only the /* DATA */ block changes per team.
============================================================================ -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waste Observations</title>
<style>
/* Type scale — one place, not case by case. Every size below 12px is a token; the
   whole small end lifts on a narrow screen so nothing drops under 11px on a phone. */
:root{
  --fs-65:6.5px; --fs-7:7px; --fs-75:7.5px; --fs-8:8px; --fs-85:8.5px; --fs-9:9px;
  --fs-95:9.5px; --fs-10:10px; --fs-105:10.5px; --fs-11:11px; --fs-115:11.5px;
}
@media (max-width:760px){
  :root{
    --fs-65:11px; --fs-7:11px; --fs-75:11px; --fs-8:11px; --fs-85:11px; --fs-9:11px;
    --fs-95:11px; --fs-10:11.5px; --fs-105:12px; --fs-11:12px; --fs-115:12.5px;
  }
}
</style>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}
  /* ===== BRAND THEME (inlined from templates/brand.css) ===== */
  #art{--navy:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;
      --slate-10:rgba(54,65,86,.09);--navy-10:rgba(11,35,71,.10);--green-10:rgba(28,122,74,.10);--accent-10:rgba(110,177,209,.13);
      --rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;--rag-green-text:#2F8F6B;--rag-amber-text:#B97F22;--rag-red-text:#C2483D;--rag-na-text:#6B7480;--tint-green:rgba(47,143,107,.12);--tint-amber:rgba(212,154,58,.16);--tint-red:rgba(210,100,90,.13);--tint-na:rgba(154,164,176,.16);--navy-fill:#0B2347;
      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      /* the value split, sharing the OTE's colours so the two instruments read as one family */
      --wf-total:#0B2347;--wf-loss:#C0405A;--wf-value-b:#8CBF3F;--wf-value-c:#1C7A4A;
      --tint-loss:rgba(192,64,90,.12);--tint-valb:rgba(140,191,63,.16);--tint-valc:rgba(28,122,74,.12);
      /* ══ THE TYPE SCALE ══  ONE base, --ui, solved from the frame height by fitUI() and used by
         BOTH columns, so the chart and the prose beside it stay in proportion at every window
         size. Six steps, and nothing outside them. Anything in bare px below this line is
         FURNITURE, a border or a badge circle, not type. Same scale as the OTE waterfall. */
      --ui:11px;
      /* the label gutter in --ui, not em: em resolves against each element's OWN font-size, so
         the separator would indent to a different column than the labels it lines up with */
      --labw:calc(var(--ui)*20);
      --fs-micro:calc(var(--ui)*.78);   /* column headers, unit suffixes */
      --fs-small:calc(var(--ui)*.88);   /* the axis note, values outside a bar */
      --fs-body:var(--ui);              /* row labels, insight bullets */
      --fs-lead:calc(var(--ui)*1.1);    /* insight headings */
      --fs-sect:calc(var(--ui)*1.22);   /* section headings */
      --fs-display:calc(var(--ui)*2.2);
      --lh-tight:1.25;--lh-ui:1.4;--lh-prose:1.55;--rowh:29px;
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #art[data-t="dark"]{--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--navy-fill:#243246;--accent:#8FC7E8;--steel:#93A9C4;--rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;--rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;--tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6);
      --wf-total:#5B85B8;--wf-loss:#D9647C;--wf-value-b:#A6D45C;--wf-value-c:#4FA97C;
      --tint-loss:rgba(217,100,124,.18);--tint-valb:rgba(166,212,92,.18);--tint-valc:rgba(79,169,124,.16);
      /* the neutral tint has to lift too, or a chip on a dark card reads as loose text */
      --slate-10:rgba(255,255,255,.085);--navy-10:rgba(255,255,255,.10)}
  body:has(#art[data-t="dark"]){--page:#0E1620}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:3}
  .tags{display:flex;align-items:center;gap:11px;min-width:0}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)}
  .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:var(--fs-115);letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #art[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  .ctrls{display:flex;gap:9px;flex:none}
  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0;max-width:1300px}
  #art[data-t="dark"] h1{color:#EAEFF5}
  h1 .hl{color:var(--green)}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 14px}
  .subt{font-size:15px;font-weight:600;color:var(--accent)}
  .methodline{font-size:var(--fs-small);color:var(--mut);text-align:right;line-height:var(--lh-ui)}
  .methodline b{color:var(--txt);font-weight:600}
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:20px}

  /* ══ the house layout: chart left, insights right ══ */
  .slide{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:calc(var(--ui)*2.6);align-items:start}
  .sech{margin:0 0 calc(var(--ui)*1.05);font-size:var(--fs-sect);font-weight:700;color:var(--ink);
    line-height:var(--lh-tight);padding-bottom:calc(var(--ui)*.55);border-bottom:1px solid var(--steel)}
  .col-wf,.col-ins{min-width:0}

  /* ── the cascade furniture, shared by all four views ── */
  .wfmeta{display:flex;align-items:baseline;font-size:var(--fs-small);color:var(--mut);
    line-height:var(--lh-ui);margin-bottom:calc(var(--ui)*.9)}
  .wfmeta .a{flex:1;min-width:0}
  .wfmeta .a b{color:var(--txt);font-weight:600}
  .wfmeta .c{flex:none;white-space:nowrap;padding-left:.9em;text-align:right;
    font-weight:600;font-size:var(--fs-small)}
  .wf-row{display:flex;align-items:center;height:var(--rowh,29px)}
  .wf-label{width:var(--labw);flex:none;display:flex;align-items:center;justify-content:flex-end;gap:.55em;
    padding-right:.9em;font-size:var(--fs-body);color:var(--txt);white-space:nowrap}
  .wf-label>span{overflow:hidden;text-overflow:ellipsis}
  .wf-row.tot .wf-label>span:not(.wf-num){font-weight:700;color:var(--ink)}
  .wf-row.na .wf-label>span:not(.wf-num){color:var(--mut)}
  .wf-num{flex:none;width:1.5em;height:1.5em;border-radius:50%;background:var(--wf-total);
    font-size:var(--fs-micro);font-weight:800;display:inline-flex;align-items:center;justify-content:center}
  .wf-label .wf-num,.wf-num{color:#fff}
  .wf-track{flex:1;min-width:0;position:relative;
    /* the bar grows with its row so a four-row chart still fills the frame, but never past a
       third of the row: a 40px bar in a 58px row reads as a block, not a chart */
    height:min(calc(var(--rowh,29px)*.7),max(calc(var(--ui)*2.1),calc(var(--rowh,29px)*.32)))}
  .wf-bar{position:absolute;height:100%;border-radius:2px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .wf-bar span{font-size:var(--fs-small);font-weight:700;color:#fff;white-space:nowrap}
  .wf-out{position:absolute;top:50%;transform:translateY(-50%);font-size:var(--fs-small);font-weight:700;color:var(--mut);white-space:nowrap}
  .wf-out.na{font-weight:600;font-style:italic}
  /* the rule between bands scales with the row, or a four-row chart reads as one tight pair
     followed by a hole */
  .wf-sep{height:1px;background:var(--line);
    margin:calc(var(--rowh,29px)*.22) 0 calc(var(--rowh,29px)*.22) var(--labw)}
  /* a hover carries what the panel has no room for. Never a callout, and never the native
     title attribute, which waits a second and dies as soon as the pointer moves. */
  .defd{border-bottom:1px dotted var(--steel);cursor:help}
  #tip{position:fixed;z-index:80;max-width:340px;background:var(--navy-fill,#0B2347);color:#fff;
    font-size:var(--fs-115);line-height:1.5;padding:9px 12px;border-radius:8px;pointer-events:none;
    box-shadow:0 14px 32px -14px rgba(0,0,0,.55);opacity:0;transition:opacity .12s}
  #tip.on{opacity:1}
  #tip b{display:block;font-size:var(--fs-10);letter-spacing:.5px;text-transform:uppercase;color:#9FC7E8;margin-bottom:3px}
  #art[data-t="dark"] #tip{background:#0B1729}
  .wf-row[data-tiph] .wf-bar,.wf-row[data-tiph] .wf-label{cursor:help}
  /* a thin bar is a tiny hit target, so widen the hit area without changing what is drawn */
  .wf-row[data-tiph] .wf-bar::after{content:"";position:absolute;inset:0 -7px}

  /* ── vertical columns: the shape a chart takes up to six items, where a label has room
        to wrap under its own column instead of being squeezed into a gutter ── */
  .vchart{display:flex;align-items:flex-end;justify-content:center;gap:2.2%;height:var(--colh,260px);
    position:relative;border-bottom:1px solid var(--line);padding-top:calc(var(--ui)*1.9)}
  /* three columns across a full slide would be slabs, so cap the width and centre what is left */
  .vcol{flex:1 1 0;min-width:0;max-width:calc(var(--ui)*22);height:100%;position:relative;
    display:flex;flex-direction:column;justify-content:flex-end;z-index:2}
  .vcol.float{justify-content:flex-start}
  .vcol[data-tipb]{cursor:help}
  .vbar{width:100%;border-radius:3px 3px 0 0;position:relative}
  .vval{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:var(--fs-small);
    font-weight:800;color:var(--ink);margin-bottom:.35em;white-space:nowrap}
  .vbar.inbar .vval{bottom:auto;top:.7em;color:#fff;margin:0}
  .vspacer{width:100%}
  /* the connector runs under the bars, so it only shows where it should: across the gap */
  .vconn{position:absolute;height:0;border-top:1px dashed var(--steel);opacity:.75;z-index:1}
  .vlabs{display:flex;justify-content:center;gap:2.2%;margin-top:calc(var(--ui)*.8)}
  .vlab{flex:1 1 0;min-width:0;max-width:calc(var(--ui)*22);text-align:center}
  /* the label wraps under its own column and stops at four lines. Past that the column is too
     narrow for the words, and the full name is one hover away. */
  /* the band is a fixed four lines whether a label uses them or not, so the chart keeps one
     baseline instead of stepping up and down with the wrapping */
  .vlab .n{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
    font-size:var(--fs-body);color:var(--txt);line-height:var(--lh-ui);
    min-height:calc(4em*var(--lh-ui))}
  /* more columns, less width each, so the label steps down the same scale the rest of the page uses */
  .vlabs.dense .vlab .n{font-size:var(--fs-small)}
  /* at nine columns or more the words need a fifth line before they stop fitting at all */
  .vlabs.dense2 .vlab .n{font-size:var(--fs-micro);line-height:1.3;-webkit-line-clamp:5;
    min-height:calc(5em*1.3)}
  .vlab.tot .n{font-weight:700;color:var(--ink)}
  .vnum{display:inline-flex;width:1.5em;height:1.5em;border-radius:50%;color:#fff;
    font-size:var(--fs-micro);font-weight:800;align-items:center;justify-content:center;margin-bottom:.3em}

  /* ── insight panel: heading, bullets, evidence in italics. No rules between blocks and no
        boxes. Every size is relative to .col-ins, whose font-size fitInsights() searches so the
        prose always fills the height of the chart beside it. ── */
  .col-ins{font-size:var(--ui)}
  .inswrap{display:flex;flex-direction:column;gap:1.35em}
  .ins .inh{display:flex;align-items:flex-start;gap:.65em;margin-bottom:.4em}
  .ins .inum{flex:none;width:1.6em;height:1.6em;border-radius:50%;background:var(--wf-total);color:#fff;
    font-size:.84em;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-top:.15em}
  .ins .inh b{font-size:1.1em;font-weight:700;color:var(--ink);line-height:1.35}
  .ins .chip{display:inline-flex;align-items:center;font-size:.8em;font-weight:700;padding:.1em .5em;
    border-radius:99px;vertical-align:.1em;white-space:nowrap;line-height:1.5;margin-left:.45em}
  .ins .chip.poor{background:var(--tint-loss);color:var(--wf-loss)}
  .ins .chip.enab{background:var(--tint-valb);color:var(--wf-value-c)}
  .ins .chip.good{background:var(--tint-valc);color:var(--wf-value-c)}
  .ins .chip.neu{background:var(--slate-10);color:var(--mut)}
  .ins ul{margin:0;padding-left:2.9em;list-style:none}
  .ins ul:empty{display:none}
  .ins li{position:relative;font-size:1em;color:var(--txt);line-height:var(--lh-prose);margin-bottom:.3em}
  .ins li::before{content:"";position:absolute;left:-.9em;top:.55em;width:.33em;height:.33em;border-radius:50%;background:var(--mut)}
  .ins .inev{margin:.35em 0 0 2.9em;font-size:.88em;color:var(--mut);font-style:italic}
  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:12px;font-size:clamp(9.5px,0.75vw,12px);color:var(--mut)}
  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legend{display:flex;gap:7px}
  .lp{font-size:0.95em;font-weight:600;padding:0.2em 0.85em;border-radius:999px}
  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600}
  
  /* ── responsive chrome: on a narrow screen the absolute toprow would collide, so drop it
     into normal flow and let it wrap ── */
  @media (max-width:760px){
    #art{padding:14px 18px 10px 42px;--labw:calc(var(--ui)*13)}
    .nr-rail{width:24px}
    .toprow{position:static;top:auto;right:auto;margin:0 0 12px;flex-wrap:wrap;justify-content:flex-start;gap:10px 12px}
    .tags{flex-wrap:wrap;gap:8px;margin-left:-42px}
    .ctrls{flex-wrap:wrap;gap:8px;flex:1 1 100%}
    .slide{grid-template-columns:1fr}
    .methodline{text-align:left}
  }
</style><style id="nr-finish">
/* == THE DECK FINISH (patch_finish.py) == one look across the toolkit: the same base size as a deck
   in the same window, the quiet subtitle, light grey cards for ideas, icons from the house set.
   Written with an html prefix so it wins over the template's own rules wherever they sit. */
html{--srf:#F7F9FB;--srf-line:#E4E9EF;--sh-soft:0 1px 2px rgba(16,24,40,.05);--subt:#5E718B}
html [data-t="dark"]{--srf:#1E2937;--srf-line:#2C3947;--sh-soft:0 1px 2px rgba(0,0,0,.35);--subt:#9FB1C8}
html .subt{font-size:max(15px,calc(var(--nr-t,14px) * 1.22));font-weight:400;color:var(--subt)}
/* the title follows the deck where the deck's title is the larger one (a window above about 1615 x 909);
   below that every instrument keeps its own title, including the ones that shrink it to fit */
@media (min-width:1615px) and (min-height:909px){html h1{font-size:calc(var(--nr-t,15.14px) * 1.85)}}
html :is(.card,.kpi,#pw .tcard,.plan,.findings,.acard,.t-dept .nc,.t-team.in .nc,.blk.boxed,.conc-so,.node.l3){background:var(--srf);border-color:var(--srf-line);border-radius:14px;box-shadow:var(--sh-soft)}
/* the templates paint their dark cards from #art[data-t="dark"] rules; the finish wins over those */
html [data-t="dark"]:is(#art,#pw,#pm) :is(.card,.kpi,#pw .tcard,.plan,.findings,.acard,.t-dept .nc,.t-team.in .nc,.blk.boxed,.conc-so,.node.l3){background:var(--srf);border-color:var(--srf-line)}
html :is(.blk.boxed,.conc-so){border:1px solid var(--srf-line)}
html .ic{width:1.2em;height:1.2em;fill:var(--navy);flex:none;vertical-align:-.24em;margin-right:.4em}
html [data-t="dark"] .ic{fill:#93A9C4}
@media print{html{--sh-soft:0 0 0 transparent}}
</style>
<script id="nr-finish-js">
/* == ONE TYPE SIZE PER WINDOW (patch_finish.py) == the deck's base size for this window, published
   on <html> before any fit runs, and nrZ() for the fit caps. Never below the instrument's own 14px. */
(function(){
  function deck(){var W=window.innerWidth||1600,H=window.innerHeight||900;
    return Math.max(11,Math.min(20,H/60,(W-138)/97.5));}
  function ui(){return Math.max(14,deck());}
  function put(){var d=document.documentElement.style;d.setProperty('--nr-t',deck().toFixed(2)+'px');
    d.setProperty('--nr-ui',ui().toFixed(2)+'px');}
  window.nrZ=function(){return ui()/14;};

    ['moving-building','moving through the building'],
    ['searching','searching for goods or documents'],
    ['over-processing','doing more than necessary'],
    ['status-questions','answering status questions']];
  var CAUSE=[
    ['system-fit','System fit'],
    ['information-quality','Information quality'],
    ['process-design','Process design'],
    ['skills','Skills and experience'],
    ['workload-scheduling','Workload and scheduling'],
    ['governance-policy','Governance and policy']];
  var BUCKET={valueAdding:['Value adding','var(--wf-value-c)','good'],
              valueEnabling:['Value enabling','var(--wf-value-b)','enab'],
              waste:['Waste','var(--wf-loss)','poor']};
  var BORDER=['valueAdding','valueEnabling','waste'];

  function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function hl(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1</span>');}
  function n1(v){return (Math.round(v*10)/10).toFixed(1);}
  function pct(v){return (Math.round(v*10)/10)+'%';}
  function lbl(list,k){for(var i=0;i<list.length;i++){if(list[i][0]===k)return list[i][1];}return k;}
  function rows(){return DATA.rows||[];}

  /* ── one row of the cascade. `left` and `width` are percentages of process time, so every
        view shares one scale and the bars can be compared across tabs. ── */
  function bar(o){
    var lab='<div class="wf-label">'+(o.num?'<span class="wf-num" style="background:'+o.col+'">'+o.num+'</span>':'')+
      '<span'+(o.tipb?' class="defd"':'')+'>'+esc(o.label)+'</span></div>';
    var track;
    if(o.na){ track='<div class="wf-track"><div class="wf-out na" style="left:0">not observed</div></div>'; }
    else{
      /* the figure sits inside the bar when there is room, to the right of it when there is not,
         and to the LEFT when the bar ends near the frame */
      var end=o.left+o.width, inside=o.width>=14, flip=(!inside && end>78);
      track='<div class="wf-track"><div class="wf-bar" style="left:'+o.left+'%;width:'+o.width+'%;background:'+o.col+
        (o.dim?';opacity:.72':'')+'">'+(inside?'<span>'+pct(o.value)+'</span>':'')+'</div>'+
        (inside?'':'<div class="wf-out" style="'+(flip?'right:calc('+(100-o.left)+'% + .5em)':'left:calc('+end+'% + .5em)')+'">'+pct(o.value)+'</div>')+'</div>';
    }
    return '<div class="wf-row'+(o.cls?' '+o.cls:'')+'"'+(o.id?' data-id="'+esc(o.id)+'"':'')+
      (o.tipb?' data-tiph="'+esc(o.tiph||o.label)+'" data-tipb="'+esc(o.tipb)+'"':'')+'>'+lab+track+'</div>';
  }
  /* A chart is drawn as columns. Past fourteen items a column is narrower than the words it has
     to carry, and it falls back to rows. Between seven and fourteen the label band steps down the
     type scale and stops at four lines, with the full name in the hover.
     items: {label, value, col, num, from, total, id, tiph, tipb}. `from` makes a floating
     waterfall column, measured from the top of the plot. */
  var VERTICAL_MAX=14;
  function cols(items,scaleTo,carries){
    var n=items.length, gap=2.2, w=(100-gap*(n-1))/n, chart='', labs='', conn='';
    items.forEach(function(it){
      var h=Math.max(0,(it.value/scaleTo)*100), from=(it.from!=null?(it.from/scaleTo)*100:null);
      var inside=h>=22;
      chart+='<div class="vcol'+(from!=null?' float':'')+'"'+(it.id?' data-id="'+esc(it.id)+'"':'')+
        (it.tipb?' data-tiph="'+esc(it.tiph||it.label)+'" data-tipb="'+esc(it.tipb)+'"':'')+'>'+
        (from!=null?'<div class="vspacer" style="height:'+from+'%"></div>':'')+
        '<div class="vbar'+(inside?' inbar':'')+'" style="height:'+h+'%;background:'+it.col+'">'+
        '<span class="vval">'+pct(it.value)+'</span></div></div>';
      labs+='<div class="vlab'+(it.total?' tot':'')+'">'+
        (it.num?'<span class="vnum" style="background:'+it.col+'">'+it.num+'</span>':'')+
        '<span class="n">'+esc(it.label)+'</span></div>';
    });
    (carries||[]).forEach(function(c,i){
      if(c==null||i>=n-1) return;
      var y=(c/scaleTo);
      conn+='<div class="vconn" style="left:'+(i*(w+gap))+'%;width:'+(2*w+gap)+'%;'+
        'top:calc(var(--ui)*1.9 + (100% - var(--ui)*1.9)*'+y.toFixed(4)+')"></div>';
    });
    var dense=n>8?' dense2':(n>6?' dense':'');
    return '<div class="vchart">'+chart+conn+'</div><div class="vlabs'+dense+'">'+labs+'</div>';
  }
  function frame(style,inner){return '<div style="'+style+'">'+inner+'</div>';}
  function cap1(t){t=String(t||'');return t?t.charAt(0).toUpperCase()+t.slice(1):t;}
  function head(meta,right,axis){return '<div class="wfmeta"><span class="a">'+(meta||'')+
    '</span><span class="c'+(axis?' axis':'')+'">'+(right||'')+'</span></div>';}

  /* one insight block, the house shape: numbered badge, heading with at most one chip, bullets,
     and the evidence in italics underneath. No rule between blocks and no box around them. */
  function insBlock(num,head,chips,bullets,ev){
    var li=(bullets||[]).filter(Boolean).map(function(b){return '<li>'+esc(b)+'</li>';}).join('');
    return '<div class="ins"><div class="inh"><span class="inum">'+(num||'&bull;')+'</span><b>'+
      esc(head)+(chips||'')+'</b></div><ul>'+li+'</ul>'+
      (ev?'<div class="inev">'+esc(ev)+'</div>':'')+'</div>';
  }
  function chip(cls,t){return '<span class="chip '+cls+'">'+esc(t)+'</span>';}
  function uniq(a){return a.filter(function(x,i){return x&&a.indexOf(x)===i;});}
  function slide(title,labw,left,right){
    return '<div class="slide"><section class="col-wf" style="--labw:calc(var(--ui)*'+labw+')">'+
      '<h3 class="sech">'+esc(title)+'</h3>'+left+'</section>'+
      '<section class="col-ins"><h3 class="sech">Insights and key sources of waste</h3>'+
      '<div class="inswrap">'+right+'</div></section></div>';
  }
  function byShare(a,b){return b.pctOfProcessTime-a.pctOfProcessTime;}

  /* ── view 1 · the three buckets as a cascade from 100 ── */
  function vSplit(){
    var s=DATA.split||{}, rem=100, f=(DATA.scope||{}).observedFte;
    var meta='Indexed to observed process time = <b>100</b>'+(f!=null?' \u00b7 <b>'+n1(f)+'</b> FTE observed':'');
    var items=[{label:'Process time observed',value:100,col:'var(--wf-total)',total:true}], carries=[0], cum=0;
    BORDER.forEach(function(k,i){
      var v=+(s[k]||0);
      items.push({label:BUCKET[k][0],value:v,from:cum,col:BUCKET[k][1],num:i+1,tipb:(DATA.definitions||{})[k]||''});
      cum+=v; carries.push(cum);
    });
    var out=head(meta,'');
    if(items.length<=VERTICAL_MAX){
      out=head(meta,'% of process time',true)+cols(items,100,carries);
    }else{
      out+=bar({label:items[0].label,value:100,left:0,width:100,col:'var(--wf-total)',
                cls:'tot'});
      out+='<div class="wf-sep"></div>';
      BORDER.forEach(function(k,i){
        var v=+(s[k]||0);
        out+=bar({label:BUCKET[k][0],value:v,left:Math.max(0,rem-v),width:v,col:BUCKET[k][1],num:i+1,
                  tipb:(DATA.definitions||{})[k]||'',});
        rem-=v;
      });
    }
    /* the panel says what each bucket MEANS for this activity and which observed steps sit in
       it. The definition is written per activity, so it is the one thing the reader cannot work
       out from the chart. */
    var ins='';
    BORDER.forEach(function(k,i){
      var rs=rows().filter(function(r){return r.bucket===k;}).sort(byShare);
      var def=(DATA.definitions||{})[k]||'';
      var bul=def?[def]:[];
      rs.slice(0,3).forEach(function(r){
        bul.push(r.label+', '+pct(r.pctOfProcessTime)+
          (r.namedWaste?': '+r.namedWaste+'.':'.')); });
      if(rs.length>3) bul.push('And '+(rs.length-3)+' more, ranked on the next tab.');
      ins+=insBlock(i+1,BUCKET[k][0]+': '+pct(+(DATA.split||{})[k]||0),'',bul,'');
    });
    return slide('Breakdown of processing time',20,out,ins);
  }

  /* ── view 2 · every observed step, ranked, coloured by bucket ── */
  function tipOf(r){
    return (r.wasteId?cap1(lbl(WASTE,r.wasteId))+': '+(r.namedWaste||'')+' ':'')+
           (r.why?cap1(r.why)+' ':'')+(r.evidence?'Seen: '+r.evidence+'.':'');
  }
  function vRows(){
    var rs=rows().slice().sort(byShare), out='', ins='';
    if(rs.length<=VERTICAL_MAX){
      out=head('Ranked, largest first','% of process time',true)+
          cols(rs.map(function(r,i){return {label:r.label,value:r.pctOfProcessTime,col:BUCKET[r.bucket][1],
               num:i+1,id:r.id,tiph:r.label,
               tipb:BUCKET[r.bucket][0]+'. '+tipOf(r)};}),
               rs[0].pctOfProcessTime,null);
    }else{
      out=head('','');
      rs.forEach(function(r,i){
        out+=bar({label:r.label,value:r.pctOfProcessTime,left:0,width:r.pctOfProcessTime,
                  col:BUCKET[r.bucket][1],num:i+1,id:r.id,
                  tiph:BUCKET[r.bucket][0],tipb:tipOf(r)});
      });
    }
    /* two bullets, and they answer the two questions a reader has: what was seen, and why it
       was judged that way. The evidence line underneath says where it was seen. */
    rs.slice(0,5).forEach(function(r,i){
      var bul=[];
      if(r.wasteId) bul.push(cap1(lbl(WASTE,r.wasteId))+': '+(r.namedWaste||r.evidence||'')+'.');
      else if(r.namedWaste) bul.push(cap1(r.namedWaste)+'.');
      if(r.why) bul.push(cap1(r.why));
      if(!bul.length) bul.push(cap1(r.evidence||'')+'.');
      ins+=insBlock(i+1,r.label+': '+pct(r.pctOfProcessTime),
        r.wasteId?'':chip(BUCKET[r.bucket][2],BUCKET[r.bucket][0]),
        bul, cap1(r.evidence||''));
    });
    return slide(((DATA.scope||{}).level==='activity')?'By activity':'By task',33,out,ins);
  }

  /* ── view 3 · the ten fixed waste categories, ranked, unobserved shown as unobserved ── */
  function vWaste(){
    var tot={}, ex={};
    rows().forEach(function(r){ if(r.bucket!=='waste'||!r.wasteId) return;
      tot[r.wasteId]=(tot[r.wasteId]||0)+r.pctOfProcessTime;
      (ex[r.wasteId]=ex[r.wasteId]||[]).push(r); });
    var seen=WASTE.filter(function(w){return tot[w[0]];}).sort(function(a,b){return tot[b[0]]-tot[a[0]];});
    var total=+(DATA.split||{}).waste||0, out='', ins='';
    function tb(w){ return ex[w].slice().sort(byShare).map(function(r){
      return r.label+', '+pct(r.pctOfProcessTime)+(r.namedWaste?': '+r.namedWaste:'')+'.';}).join(' '); }
    if(seen.length<=VERTICAL_MAX && seen.length){
      /* the total moves into the meta line: a total column beside four ranked ones invites the
         reader to compare it with them, and it is not that kind of number */
      out=head('Ranked, largest first \u00b7 <b>'+pct(total)+'</b> of process time in total',
               '% of process time',true)+
          cols(seen.map(function(w,i){return {label:w[1],value:tot[w[0]],col:'var(--wf-loss)',num:i+1,tiph:'What sits in it',tipb:tb(w[0])};}),
               tot[seen[0][0]],null);
    }else{
      out=head('','');
      seen.forEach(function(w,i){
        out+=bar({label:w[1],value:tot[w[0]],left:0,width:tot[w[0]],col:'var(--wf-loss)',num:i+1,tiph:'What sits in it',tipb:tb(w[0])});
      });
      out+='<div class="wf-sep"></div>';
      out+=bar({label:'Total waste',value:total,left:0,width:total,col:'var(--wf-loss)',cls:'tot',});
    }
    seen.slice(0,5).forEach(function(w,i){
      var list=ex[w[0]].slice().sort(byShare), causes=uniq(list.map(function(r){return r.causeId;}));
      var bul=list.slice(0,2).map(function(r){
        return r.label+': '+(r.namedWaste||r.evidence||'')+'.'+(r.why?' '+cap1(r.why):''); });
      ins+=insBlock(i+1,cap1(w[1])+': '+pct(tot[w[0]]),
        causes.length===1?chip('neu',lbl(CAUSE,causes[0])):'',
        bul, cap1(list[0].evidence||''));
    });
    return slide('By waste category',26,out,ins);
  }

  /* ── view 4 · the same minutes on the cause axis ── */
  function vCause(){
    var tot={}, ex={};
    rows().forEach(function(r){ if(r.bucket!=='waste'||!r.causeId) return;
      tot[r.causeId]=(tot[r.causeId]||0)+r.pctOfProcessTime;
      (ex[r.causeId]=ex[r.causeId]||[]).push(r); });
    var seen=CAUSE.filter(function(c){return tot[c[0]];}).sort(function(a,b){return tot[b[0]]-tot[a[0]];});
    var total=+(DATA.split||{}).waste||0, out='', ins='';
    function tb(c){ var list=ex[c].slice().sort(byShare);
      return uniq(list.map(function(r){return r.rootCauseText;})).map(function(x){return cap1(x)+'.';}).join(' ')+
             ' Shows up in: '+list.map(function(r){return r.label;}).join(', ')+'.'; }
    if(seen.length<=VERTICAL_MAX && seen.length){
      out=head('Ranked, largest first \u00b7 <b>'+pct(total)+'</b> of process time in total',
               '% of process time',true)+
          cols(seen.map(function(c,i){return {label:c[1],value:tot[c[0]],col:'var(--wf-loss)',num:i+1,tiph:'Why it happens',tipb:tb(c[0])};}),
               tot[seen[0][0]],null);
    }else{
      out=head('','');
      seen.forEach(function(c,i){
        out+=bar({label:c[1],value:tot[c[0]],left:0,width:tot[c[0]],col:'var(--wf-loss)',num:i+1,tiph:'Why it happens',tipb:tb(c[0])});
      });
      out+='<div class="wf-sep"></div>';
      out+=bar({label:'Total waste',value:total,left:0,width:total,col:'var(--wf-loss)',cls:'tot',});
    }
    seen.slice(0,5).forEach(function(c,i){
      var list=ex[c[0]].slice().sort(byShare);
      var why=uniq(list.map(function(r){return r.rootCauseText;}));
      ins+=insBlock(i+1,c[1]+': '+pct(tot[c[0]]),'',
        (why.length?why:[list[0].namedWaste]).map(function(x){return cap1(x)+'.';}),
        'Shows up in: '+list.map(function(r){return r.label;}).join(', ')+'.');
    });
    return slide('By root cause',22,out,ins);
  }

  var VIEWS=[['split','Breakdown of processing time',vSplit],
             ['rows','',vRows],
             ['waste','By waste category',vWaste],
             ['cause','By root cause',vCause]];
  VIEWS[1][1]=((DATA.scope||{}).level==='activity')?'By activity':'By task';
  var cur='split';

  document.getElementById('ctx').textContent=DATA.context||'OPEX QUICKSCAN';
  document.getElementById('lens').textContent=DATA.lens||'PROCESSES · WASTE OBSERVATIONS';
  document.getElementById('title').innerHTML=hl(DATA.keyMessage||'');
  document.getElementById('subt').textContent=DATA.teamName||'';
  document.getElementById('views').innerHTML=VIEWS.map(function(v,i){
    return '<button data-v="'+v[0]+'"'+(i===0?' class="on"':'')+'>'+esc(v[1])+'</button>';}).join('');
  (function(){
    var s=DATA.session||{}, r=s.representativeness||{}, p=[];
    if(s.runsWatched) p.push('<b>'+s.runsWatched+'</b> run'+(s.runsWatched>1?'s':'')+' watched');
    if(r.people) p.push('<b>'+r.people+'</b> person'+(r.people>1?'s':''));
    if(r.caseTypes) p.push(esc(r.caseTypes)+' case type'+(r.caseTypes==='one'?'':'s'));
    if(r.cyclePoint) p.push(esc(r.cyclePoint)+' point in the cycle');
    document.getElementById('meth').innerHTML=p.join(' &middot; ');
  })();
  document.getElementById('src').innerHTML=DATA.source?('<b style="color:var(--txt)">Source:</b> '+esc(DATA.source)):'';
  document.getElementById('lg').innerHTML='<b style="color:var(--txt);margin-right:4px">Legend:</b>'+
    BORDER.map(function(k){return '<span class="lp" style="background:rgba(0,0,0,.04);color:'+BUCKET[k][1]+'">● '+BUCKET[k][0]+'</span>';}).join('');

  /* ══ THE FIT, ported from the OTE waterfall so the two instruments size identically ══
     --ui is solved from the frame and nothing else, the chart fills by growing its ROWS rather
     than by magnifying everything, and the prose column searches the largest base at which it
     still fits the chart beside it. */
  function bottomGap(ah){ return Math.max(14, ah*0.035); }
  function fitUI(ah){
    var art=document.getElementById('art');
    var ui=Math.max(9.5, Math.min(14*nrZ(), ah/52));
    art.style.setProperty('--ui', ui.toFixed(2)+'px');
    return ui; }
  /* Height is linear in the row height (total = fixed chrome + rows x rowh), so one solve is exact. */
  function fitRows(ah){
    var art=document.getElementById('art'), col=document.querySelector('.col-wf');
    if(!col){ if(art) art.style.removeProperty('--rowh'); return; }
    var n=col.querySelectorAll('.wf-row').length; if(!n) return;
    var cur=parseFloat(getComputedStyle(art).getPropertyValue('--rowh'))||29;
    var fixed=col.offsetHeight-n*cur;
    /* no 68px ceiling: a four-row cascade has to fill the same frame a twelve-row one does,
       and the bar height above is what stops a tall row reading as a block */
    var h=Math.max(22,Math.min(150,(ah-16-fixed)/n));
    art.style.setProperty('--rowh',h.toFixed(2)+'px');}
  /* A column chart fills the frame the same way the rows do: by growing the plot, not by
     magnifying everything. Height is linear in the plot height, so one solve is exact. */
  function fitCols(ah){
    var art=document.getElementById('art'), col=document.querySelector('.col-wf');
    if(!col) return;
    var ch=col.querySelector('.vchart');
    if(!ch){ art.style.removeProperty('--colh'); return; }
    var cur=parseFloat(getComputedStyle(art).getPropertyValue('--colh'))||260;
    var fixed=col.offsetHeight-cur;
    var h=Math.max(130,Math.min(560,ah-16-fixed));
    art.style.setProperty('--colh',h.toFixed(2)+'px');}
  /* The insight column carries prose, so it is not stretched like a table: search the largest
     base font-size at which it still fits the chart beside it, banded around --ui so the prose
     can never outgrow its own section heading. Spend any slack on the gaps, not the letters. */
  function fitInsights(){
    var host=document.querySelector('.col-ins'), wf=document.querySelector('.col-wf');
    if(!host||!wf) return;
    var wrap=host.querySelector('.inswrap'); if(!wrap) return;
    var target=wf.offsetHeight-(wrap.offsetTop-host.offsetTop);
    if(target<40){host.style.fontSize='';return;}
    var ui=parseFloat(getComputedStyle(document.getElementById('art')).getPropertyValue('--ui'))||11;
    var lo=7,hi=ui*1.06,best=lo;
    wrap.style.gap='';
    for(var i=0;i<11;i++){var f=(lo+hi)/2;host.style.fontSize=f+'px';
      if(wrap.scrollHeight<=target){best=f;lo=f;}else{hi=f;}}
    host.style.fontSize=best.toFixed(2)+'px';
    var n=wrap.children.length;
    if(n>1){
      var free=target-wrap.scrollHeight;
      var fr=document.getElementById('view'), vi=document.getElementById('vinner');
      if(fr&&vi){
        var sc=+(String(vi.style.transform).match(/scale\(([\d.]+)\)/)||[0,1])[1]||1;
        var room=(fr.clientHeight-bottomGap(fr.clientHeight))/sc-vi.scrollHeight;
        free=Math.min(free, Math.max(0, room));
      }
      if(free>2){
        var base=1.35*best, extra=Math.min(free/(n-1), 2.4*best);
        wrap.style.gap=(base+extra).toFixed(1)+'px';
      }
    }}
  /* TWO PASSES, always: the fit changes the layout it is measuring, and in the working copy the
     edit layer changes it again underneath. The second pass measures what the first produced. */
  function fitView(){ fitOnce(); fitOnce(); }
  function fitOnce(){var v=document.getElementById('view'),vi=document.getElementById('vinner');var ah=v.clientHeight;if(!ah)return;
    vi.style.transform='none';vi.style.width='100%';
    var gap=bottomGap(ah);
    fitUI(ah); fitRows(ah-gap); fitCols(ah-gap); fitInsights();
    var lo=0.25,hi=1.0*nrZ(),best=0.25;
    for(var k=0;k<12;k++){var s=(lo+hi)/2;vi.style.width=(100/s)+'%';if(vi.scrollHeight*s<=ah-gap){best=s;lo=s;}else{hi=s;}}
    vi.style.width=(100/best)+'%';vi.style.transform='scale('+best+')';
    /* the painted bottom of the deepest element is the fact, scrollHeight is only a promise:
       long prose rewraps when the search changes the column width, so shrink until it is in. */
    var vt=vi.getBoundingClientRect().top;
    for(var g=0;g<3;g++){
      var fb=v.getBoundingClientRect().bottom-gap, deep=vt;
      vi.querySelectorAll('*').forEach(function(e){var r=e.getBoundingClientRect();
        if(r.height&&r.bottom>deep) deep=r.bottom;});
      if(deep<=fb) break;
      var q=(fb-vt)/(deep-vt); if(!(q>0&&q<1)) break;
      best=Math.max(0.25,best*q);
      vi.style.width=(100/best)+'%'; vi.style.transform='scale('+best+')';
    }}
  function viewFn(){for(var i=0;i<VIEWS.length;i++){if(VIEWS[i][0]===cur)return VIEWS[i][2];}return VIEWS[0][2];}
  var tipEl=null;
  function bindTips(){
    if(!tipEl){ tipEl=document.createElement('div'); tipEl.id='tip';
      (document.getElementById('art')||document.body).appendChild(tipEl); }
    /* bind the BAR and the LABEL, never the whole row: the row spans the full width, so hovering
       empty track would fire the tooltip wherever the pointer happened to be */
    document.querySelectorAll('#vinner [data-tipb]').forEach(function(el){
      var trig=[el.querySelector('.wf-bar'),el.querySelector('.wf-label')].filter(Boolean);
      if(!trig.length) trig=[el];   /* a column: the whole column is the hit area */
      trig.forEach(function(tr){
        tr.addEventListener('mouseenter',function(){
          tipEl.innerHTML='<b>'+esc(el.getAttribute('data-tiph')||'')+'</b>'+esc(el.getAttribute('data-tipb')||'');
          tipEl.classList.add('on'); place(el); });
        tr.addEventListener('mouseleave',function(){tipEl.classList.remove('on');});
      });
    });
    /* anchor over the chart's own whitespace, right of the label column, rather than out over
       the insight panel */
    function place(el){ var r=el.getBoundingClientRect(), b=tipEl.getBoundingClientRect();
      var lab=el.querySelector('.wf-label'), trk=el.querySelector('.wf-track');
      if(!lab){ /* a column: above it where there is room, otherwise inside the plot rather than
                   up over the action title */
        var ch=el.closest('.vchart'), ct=ch?ch.getBoundingClientRect().top:0;
        var left=Math.max(8,Math.min(r.left+r.width/2-b.width/2, window.innerWidth-b.width-8));
        var top=Math.max(ct+6, r.top-b.height-8);
        tipEl.style.left=left+'px'; tipEl.style.top=top+'px'; return; }
      var top=Math.max(8,Math.min(r.top+r.height/2-b.height/2, window.innerHeight-b.height-8));
      var left=(lab?lab.getBoundingClientRect().right:r.left+24)+10;
      var limit=(trk?trk.getBoundingClientRect().right:r.right);
      if(left+b.width>limit) left=Math.max(8,limit-b.width);
      if(left+b.width>window.innerWidth-8) left=Math.max(8,window.innerWidth-b.width-8);
      tipEl.style.left=left+'px'; tipEl.style.top=top+'px'; }
  }
  function render(){document.getElementById('vinner').innerHTML=viewFn()();bindTips();requestAnimationFrame(fitView);setTimeout(fitView,60);}
  function seg(id,attr,cb){var box=document.getElementById(id);box.querySelectorAll('button').forEach(function(b){b.onclick=function(){box.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');cb(b.getAttribute(attr));};});}
  seg('views','data-v',function(v){cur=v;render();});
  seg('theme','data-s',function(t){document.getElementById('art').setAttribute('data-t',t);render();});
  window.addEventListener('resize',fitView);

  render();

})();
</script>
<script id="nr-topbar-js">
/* patch_topbar.py: one theme switch and the way home, the same in every instrument.
   Theme: the choice is kept under the cockpit's key, nr_dark, so every page of an
   engagement opens the same way. Home: a page that carries
   <meta name="nr-home" content="index.html"> (the engagement artifact adds it) gets
   "< Cockpit /" in front of its section tag. */
(function(){
  var K='nr_dark', box=document.getElementById('theme')||document.getElementById('tseg');
  if(box){
    box.querySelectorAll('button').forEach(function(b){ var d=b.getAttribute('data-s')==='dark';
      b.title=d?'Dark mode':'Light mode'; b.setAttribute('aria-label',b.title);
      b.addEventListener('click',function(){ try{ localStorage.setItem(K,d?'1':'0'); }catch(e){} }); });
    var v=null; try{ v=localStorage.getItem(K); }catch(e){}
    var dk=box.querySelector('button[data-s="dark"]');
    if(v==='1'&&dk&&!dk.classList.contains('on')) dk.click();
  }
  var m=document.querySelector('meta[name="nr-home"]'), lens=document.getElementById('lens')||document.querySelector('.toprow .nr-track');
  if(m&&lens&&!document.querySelector('.nr-crumb')){
    var c=document.createElement('div'); c.className='nr-track nr-crumb';
    var a=document.createElement('a'); a.className='nr-home'; a.href=m.getAttribute('content')||'index.html';
    a.textContent='\u2039 '+(m.getAttribute('data-label')||'Cockpit'); a.title='Back to the engagement cockpit';
    /* opened in a window of the findings dashboard (a frame of our own page): go back in that page, not in the frame */
    try{ if(window.parent!==window&&window.parent.document) a.target='_parent'; }catch(e){}
    var s=document.createElement('span'); s.className='nr-sep'; s.textContent='/';
    lens.parentNode.insertBefore(c,lens); c.appendChild(a); c.appendChild(s); c.appendChild(lens);
    if(window.fitChrome) requestAnimationFrame(window.fitChrome);
  }
})();
</script>

   On a phone that turns 13px type into 4px. Below 760px the scaling is switched
   off and the page simply flows and scrolls at its real size. Desktop is

  .tags{flex-wrap:wrap!important;gap:8px!important;margin-left:-34px!important}
  .ctrls{flex-wrap:wrap!important;gap:8px!important;flex:1 1 100%!important}
  #ft{position:static!important;flex-wrap:wrap!important;row-gap:6px!important;margin-top:14px!important}
  h1{font-size:19px!important;max-width:none!important}

}
</style>
<style>/* READ-MODE TYPE FLOOR — nothing under 11px once the page stops scaling */

@media (max-width:760px){
  #ft{font-size:11px!important}

}
</style>
