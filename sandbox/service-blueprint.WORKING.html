<!doctype html>
<!-- ============================================================================
  SERVICE BLUEPRINT  ·  the customer axis over the operating baseline
  Lanes come from task.visibility, columns from journey.stages (baseline/2026.9).
  Replace ONLY the /* DATA */ block. Three views: Blueprint / Journey / Pain points.
  <style> inlined from templates/brand.css (canonical). Logo inlined.
============================================================================ -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service Blueprint</title>
<style>
/* Type scale — one place, not case by case. Every size below 12px is a token; the
   whole small end lifts on a narrow screen so nothing drops under 11px on a phone. */
:root{
  --fs-65:6.5px; --fs-7:7px; --fs-75:7.5px; --fs-8:8px; --fs-85:8.5px; --fs-9:9px;
  --fs-95:9.5px; --fs-10:10px; --fs-105:10.5px; --fs-11:11px; --fs-115:11.5px;
}
@media (max-width:760px){
  :root{
    --fs-65:11px; --fs-7:11px; --fs-75:11px; --fs-8:11px; --fs-85:11px; --fs-9:11px;
    --fs-95:11px; --fs-10:11.5px; --fs-105:12px; --fs-11:12px; --fs-115:12.5px;
  }
}
</style>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif}
  #art{--navy:#0B2347;--slate:#364156;--green:#1C7A4A;--accent:#6EB1D1;--navy2:#16315B;--rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;--rag-green-text:#2F8F6B;--rag-amber-text:#B97F22;--rag-red-text:#C2483D;--rag-na-text:#6B7480;--tint-green:rgba(47,143,107,.12);--tint-amber:rgba(212,154,58,.16);--tint-red:rgba(210,100,90,.13);--tint-na:rgba(154,164,176,.16);--navy-fill:#0B2347;
      --slate-10:rgba(54,65,86,.09);--navy-10:rgba(11,35,71,.10);--green-10:rgba(28,122,74,.10);
      --soft:#F5F7FB;--muted:#7A838F;--ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #art[data-t="dark"]{--soft:#141E2A;--muted:#94A1B2;--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--navy-fill:#243246;--accent:#8FC7E8;--steel:#93A9C4;--rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;--rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;--tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}
  body:has(#art[data-t="dark"]){--page:#0E1620}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:3}
  .tags{display:flex;align-items:center;gap:11px}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)} .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:var(--fs-115);letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #art[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0 0 16px;max-width:1300px}
  #art[data-t="dark"] h1{color:#EAEFF5} h1 .hl{color:var(--green)}
  #view{flex:1;min-height:0;position:relative;overflow:auto}
  .board{display:grid;gap:10px}
  .colhead{display:grid;gap:10px;margin-bottom:6px}
  .stage{background:var(--navy2);color:#fff;font-size:12px;font-weight:700;letter-spacing:.4px;padding:9px 12px;border-radius:8px;text-align:center}
  .lane{display:grid;gap:10px;align-items:stretch}
  .lanelabel{display:flex;align-items:center;font-size:12px;font-weight:700;color:var(--navy);background:var(--slate-10);border-radius:8px;padding:0 12px}
  #art[data-t="dark"] .lanelabel{color:#EAEFF5}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:11px 13px;font-size:12.5px;color:var(--txt);line-height:1.4}
  .cell b{color:var(--ink);display:block;margin-bottom:3px;font-size:13px}
  .cell.empty{background:transparent;border:1px dashed var(--line);box-shadow:none}
  #ft{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:var(--fs-11);color:var(--mut)}
  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600}
  /* ── service blueprint ── */
  #art{--steel:#7991AD}   /* the dark palette defines it; the light one does not */
  .ctrls{display:flex;gap:9px;flex:none}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:6px 0 14px}
  .subt{font-size:15px;font-weight:600;color:var(--accent)}
  .stamp{font-size:var(--fs-11);color:var(--mut)}
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:20px}
  /* on the canvas the inner box is a flex column that fills the frame and scrolls inside itself */
  #art.canvasview #vinner{position:absolute;inset:0;padding-bottom:0;display:flex;flex-direction:column}
  #art.canvasview #view{overflow:hidden}

  .bp{display:grid;gap:1px;align-content:stretch;background:var(--line);
      border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .bp>*{background:var(--card)}

  /* the column heads: a stage, its number, and the work that maps to it */
  .hd{background:var(--navy2);color:#fff;font-size:12px;font-weight:700;letter-spacing:.2px;
      padding:9px 11px;line-height:1.3}
  .hd .n{opacity:.6;font-weight:800;margin-right:5px}
  .hd small{display:block;font-weight:400;opacity:.68;font-size:var(--fs-95);margin-top:3px;
      letter-spacing:.1px;line-height:1.35}
  .hd.off{background:#8A7B58}

  /* the rail: what each row is, and what it answers */
  .lbl{background:var(--slate-10);display:flex;align-items:flex-start;gap:8px;padding:9px 11px;
       font-size:var(--fs-11);font-weight:700;color:var(--navy);line-height:1.25}
  #art[data-t="dark"] .lbl{color:#EAEFF5}
  .lbl .ic{flex:none;width:15px;height:15px;margin-top:1px;color:var(--accent)}
  .lbl .ic svg{width:15px;height:15px;display:block}
  .lbl em{display:block;font-style:normal;font-weight:400;font-size:var(--fs-95);color:var(--mut);
          margin-top:2px;letter-spacing:.1px;line-height:1.35}
  .lbl.acc{box-shadow:inset 3px 0 0 var(--l-col)}

  .cell{padding:9px 11px;font-size:12px;color:var(--txt);line-height:1.4}
  .cell.none{background:var(--soft)}
  .cell.off{background:rgba(180,150,70,.05)}

  /* a lane cell groups its steps by the team that performs them - but only names the team when
     the row actually holds more than one, or the name would repeat in every cell and say nothing */
  .grp{display:block;font-size:var(--fs-11);font-weight:700;color:var(--ink);margin-bottom:3px}
  .grp+.stp{margin-top:0}
  .stp{position:relative;padding-left:9px;font-size:var(--fs-115);color:var(--txt);line-height:1.4}
  .stp:before{content:'';position:absolute;left:0;top:6px;width:3px;height:3px;border-radius:50%;
              background:var(--mut)}
  .stp+.stp{margin-top:3px}
  .stp b{display:inline;font-weight:600;color:var(--txt);font-size:var(--fs-115)}
  .stp .sys{display:block;font-size:var(--fs-95);color:var(--mut);letter-spacing:.1px}
  .grp2{margin-top:8px}

  /* what the customer does: chips, read left to right, with the flow between them */
  .jstep{display:inline-flex;align-items:center;gap:6px;background:var(--card);
         border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:var(--fs-11);
         font-weight:600;color:var(--ink);line-height:1.3}
  .jwrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .jarr{color:var(--rag-green);flex:none}
  .jarr svg{width:15px;height:9px;display:block}
  .cell.jrow{background:rgba(47,143,107,.04);position:relative}
  .jnext{position:absolute;right:-10px;top:15px;z-index:2;
         background:var(--card);border-radius:50%;padding:3px 2px;line-height:0}

  /* how they feel: a track, not a rating. The dot says good or bad, the note says their word. */
  .cell.feelrow{position:relative;overflow:visible}
  .feel{position:relative;display:flex;align-items:center;gap:8px;height:20px}
  .feel:before{content:'';position:absolute;left:-11px;right:-12px;top:10px;height:1px;
               background:var(--mut);opacity:.3;z-index:0}
  .feel i{position:relative;z-index:1;width:9px;height:9px;border-radius:50%;flex:none;
          font-style:normal;box-shadow:0 0 0 3px var(--card)}
  .feel .ft{position:relative;z-index:1;font-size:var(--fs-105);line-height:1.35;color:var(--txt);
            background:var(--card);padding-right:4px}
  .feel .ft b{display:block;font-size:var(--fs-11);font-weight:700;color:var(--ink)}
  .feel.pos i{background:var(--rag-green)} .feel.neu i{background:var(--rag-na)}
  .feel.neg i{background:var(--rag-red)}
  .feel.non i{background:transparent;border:1.5px dashed var(--rag-na)}
  .cell.feelrow{padding-top:14px}

  /* touchpoints: what they meet it through. A channel is not a system. */
  .chs{display:flex;gap:6px;flex-wrap:wrap}
  .ch{display:inline-flex;align-items:center;gap:5px;background:var(--slate-10);border-radius:7px;
      padding:4px 8px;font-size:var(--fs-105);font-weight:600;color:var(--ink)}
  .ch svg{width:12px;height:12px;display:block;color:var(--mut);flex:none}
  .ch.non{background:transparent;border:1px dashed var(--line);color:var(--mut);font-weight:400;font-style:italic}

  .sysc{display:flex;gap:6px;flex-wrap:wrap}
  .sysc span{background:var(--navy-10);border-radius:6px;padding:3px 8px;font-size:var(--fs-105);
             font-weight:600;color:var(--navy)}
  #art[data-t="dark"] .sysc span{background:#243246;color:#EAEFF5}

  .pncell{background:rgba(210,100,90,.055)}
  .pn{position:relative;padding-left:13px;font-size:var(--fs-11);color:var(--rag-red-text);line-height:1.4}
  .pn:before{content:'\25B4';position:absolute;left:0;top:-1px;font-size:var(--fs-11)}
  .pn+.pn{margin-top:4px}
  .pn b{font-weight:700}
  .pn.nq{color:var(--mut);font-style:italic}

  .divider{grid-column:1/-1;background:var(--navy-fill);height:2px;padding:0}
  .dlbl{grid-column:1/-1;background:var(--card);padding:3px 11px 5px;font-size:var(--fs-95);letter-spacing:.9px;
        text-transform:uppercase;color:var(--navy);font-weight:700}
  #art[data-t="dark"] .dlbl{color:var(--accent)}

  /* journey view */
  .jgrid{display:grid;gap:13px}
  .jcard{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);padding:13px 15px;
         display:flex;flex-direction:column}
  .jcard.hot{border-color:var(--rag-red);border-width:1.5px}
  .jcard.hot h3::after{content:' · nobody meets them';font-size:var(--fs-105);font-weight:600;color:var(--rag-red-text)}
  .jcard h3{margin:0 0 3px;font-size:13.5px;color:var(--navy);font-weight:700}
  #art[data-t="dark"] .jcard h3{color:#EAEFF5}
  .want{font-size:12px;color:var(--txt);font-style:italic;line-height:1.4;margin:0 0 9px}
  .jrow{font-size:var(--fs-115);color:var(--txt);padding:6px 0;border-top:1px solid var(--line);line-height:1.4}
  .jrow i{font-style:normal;display:block;font-size:var(--fs-9);letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin-bottom:1px}
  .jrow.brk{color:var(--rag-red-text)} .jrow.brk i{color:var(--rag-red-text);opacity:.8}
  .behind{margin-top:auto;padding-top:9px;font-size:var(--fs-10);color:var(--steel);letter-spacing:.2px}

  /* painpoints view */
  table{border-collapse:collapse;width:100%}
  th{text-align:left;font-size:var(--fs-10);letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:700;
     padding:0 18px 8px 0;border-bottom:2px solid var(--line)}
  td{font-size:12.5px;color:var(--txt);padding:10px 18px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
  td b{color:var(--ink)}
  .stagetag{font-size:var(--fs-10);font-weight:700;padding:2px 8px;border-radius:999px;background:var(--navy-10);color:var(--navy);white-space:nowrap}
  #art[data-t="dark"] .stagetag{background:#243246;color:#EAEFF5}

  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:10px;font-size:var(--fs-11);color:var(--mut)}
  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legend{display:flex;gap:9px;flex-wrap:wrap}
  .lp{font-size:.95em;font-weight:600;padding:.2em .8em;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
  .lp i{width:8px;height:8px;border-radius:50%;font-style:normal}
  .conf{font-size:.88em;letter-spacing:.5px;font-weight:600}
  @media (max-width:760px){
    #art{padding:14px 18px 10px 42px}
    .nr-rail{width:24px}
  }

/*<EDIT>*/
  /* ---- WORKING MODE. Stripped entirely from a client read-out. ---- */
  .wgrp{display:flex;align-items:center;gap:8px;position:relative}
  .wchip{font-size:var(--fs-10);font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    padding:3px 9px;border-radius:999px;background:rgba(212,154,58,.16);color:#8A5F17;white-space:nowrap}
  .wchip.bad{background:rgba(210,100,90,.14);color:#C2483D}
  .wchip.ok{background:rgba(47,143,107,.13);color:#1F6B50}
  /* the gear = the whole edit affordance */
  #wgear{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid var(--line);background:var(--card);border-radius:9px;cursor:pointer;
    color:var(--mut);transition:color .15s,border-color .15s,background .15s,transform .3s}
  #wgear:hover{color:var(--ink);border-color:var(--accent)}
  #wgear svg{width:17px;height:17px;display:block}
  #wgear.unlocked{color:#fff;background:var(--rag-amber);border-color:var(--rag-amber)}
  #wgear.live{color:#fff;background:var(--green);border-color:var(--green)}
  #wgear.unlocked:hover,#wgear.live:hover{filter:brightness(1.06)}
  #wgear.blocked{color:#fff;background:var(--rag-red);border-color:var(--rag-red)}
  #wsave{font-size:12px;font-weight:700;border:1px solid var(--navy-fill);background:var(--navy-fill);color:#fff;
    padding:8px 15px;border-radius:8px;cursor:pointer;white-space:nowrap;display:none}
  #wsave.show{display:inline-block}
  #wsave:disabled{opacity:.45;cursor:default}
  /* the popover - replaces the native title tooltip, which is slow and ugly */
  #wpop{position:absolute;top:44px;right:0;width:330px;z-index:10;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;
    box-shadow:0 22px 50px -20px rgba(11,35,71,.45);
    opacity:0;visibility:hidden;transform:translateY(-5px);transition:opacity .16s,transform .16s,visibility .16s;
    text-align:left;cursor:default}
  .wgrp:hover #wpop,#wpop.pin{opacity:1;visibility:visible;transform:translateY(0)}
  #wpop:after{content:'';position:absolute;top:-6px;right:12px;width:10px;height:10px;background:var(--card);
    border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
  #wpop h4{margin:0 0 3px;font-size:12.5px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px}
  #wpop h4 i{width:7px;height:7px;border-radius:50%;background:var(--rag-amber);flex:none;font-style:normal}
  #wpop h4.live i{background:var(--rag-green)}
  #wpop h4.on i{background:var(--rag-amber)}
  #wpop .lockbtn{width:100%;margin-top:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--navy);
    background:var(--navy-fill);color:#fff;font-size:12px;font-weight:800;cursor:pointer;transition:.14s}
  #wpop .lockbtn:hover{filter:brightness(1.08)}
  #wpop .lockbtn.on{background:var(--card);color:var(--navy)}
  #wpop p{margin:6px 0 0;font-size:var(--fs-115);line-height:1.55;color:var(--txt)}
  #wpop .cmd{margin:10px 0 0;padding:9px 11px;background:var(--soft);border:1px solid var(--line);
    border-radius:8px;font-family:ui-monospace,monospace;font-size:var(--fs-11);color:var(--ink);
    display:flex;align-items:center;gap:8px;justify-content:space-between}
  #wpop .cmd b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #wpop .cmd button{border:none;background:var(--navy-fill);color:#fff;font-size:var(--fs-95);font-weight:700;
    padding:4px 8px;border-radius:5px;cursor:pointer;flex:none}
  #wpop .fine{margin-top:10px;font-size:var(--fs-10);color:var(--mut);line-height:1.5}
  #wpop ul{margin:7px 0 0;padding-left:16px}
  #wpop li{font-size:var(--fs-115);line-height:1.6;color:var(--txt)}
  #art.editing .swt{cursor:grab;position:relative;padding-left:19px}
  #art.editing .swt:active{cursor:grabbing}
  #art.editing .swt:before{content:'\2059';position:absolute;left:6px;top:50%;transform:translateY(-50%);
    font-size:var(--fs-11);letter-spacing:-1px;color:var(--line);line-height:1;transition:color .15s}
  #art.editing .swt:hover{border-color:var(--accent);box-shadow:0 2px 10px -4px rgba(11,35,71,.35)}
  #art.editing .swt:hover:before{color:var(--accent)}
  .swt.drag{opacity:.35;transform:scale(.98)}
  #art.editing .swcell.drop{outline:2px dashed var(--accent);outline-offset:-3px;background:rgba(110,177,209,.10)}
  /* the block picker - shown when an activity is dropped into a key process that holds several blocks */
  /* --- v2026.7 edit controls: adds, dropdowns, structured magnitude --- */
  .hidden{display:none !important}
  #ed .frow{display:flex;gap:9px} #ed .frow .f{flex:1;min-width:0}
  #ed textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;
    font-size:12.5px;line-height:1.5;color:var(--ink);background:var(--card);resize:vertical;min-height:56px}
  #ed textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,177,209,.16)}
  #ed .srcnew{display:flex;gap:6px;margin-top:6px}
  #ed .srcnew input{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:12.5px;background:var(--card);color:var(--ink)}
  #ed .srcnew input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,177,209,.16)}
  #ed select:focus,#ed input:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(110,177,209,.16)}
  #ed .quote{margin-top:8px;padding:9px 11px;border-left:3px solid var(--rag-red);
    background:rgba(214,69,65,.06);border-radius:0 7px 7px 0;font-size:var(--fs-115);color:var(--ink);line-height:1.45}
  #ed .quote span{color:var(--mut)}
  #ed .addbox{margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:9px;background:var(--soft)}
  #ed .addbox h6{margin:0 0 9px;font-size:var(--fs-95);font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
  #ed .wbtn.wide{width:100%;margin-top:4px}
  #ed .chks{display:flex;flex-direction:column;gap:5px;max-height:190px;overflow:auto}

  /* ── responsive chrome ──────────────────────────────────────────────────────
     The toprow stacks when it does not fit, and the switch is DETECTED, not
     guessed: fitChrome() below measures the one-row layout and adds .stacked to
     the artifact root. Never hard-code a breakpoint for the chrome — see
     brand-guide.html, "Responsive chrome". Stacked order is brand row, then
     navigation, then working controls: where am I, what am I looking at, what
     can I change. ── */
  #art.stacked .toprow,#pm.stacked .toprow,#pw.stacked .toprow{
    position:static;top:auto;left:auto;right:auto;margin:0 0 12px;
    display:flex;flex-wrap:wrap;justify-content:flex-start;align-items:center;gap:10px 12px}
  #art.stacked .tags,#pm.stacked .tags,#pw.stacked .tags{display:contents}
  /* only the brand pill bleeds out onto the navy rail — that is why it is
     border-radius:0 9px 9px 0. The negative margin is given back as padding, so
     its right edge does not move and no sibling shifts. */
  #art.stacked .nr-pill,#pm.stacked .nr-pill,#pw.stacked .nr-pill{
    order:1;margin-left:calc(-1 * var(--padl,0px));padding-left:calc(14px + var(--padl,0px))}
  /* no text in an artifact is ever cut to make it fit: the lens badge wraps, it
     does not ellipsise. An instrument that truncates it looks fine to a gate and
     wrong to a client. */
  #art.stacked .nr-track,#pm.stacked .nr-track,#pw.stacked .nr-track{
    order:2;max-width:none;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
  #art.stacked .ctrls,#pm.stacked .ctrls,#pw.stacked .ctrls{
    order:3;flex:1 1 100%;display:flex;flex-wrap:wrap;justify-content:flex-start;gap:8px}
  /* a shell whose view switch sits straight in the toprow, with no .ctrls group */
  #art.stacked .toprow>.seg,#pm.stacked .toprow>.seg,#pw.stacked .toprow>.seg{order:3;flex:1 1 100%}

<!-- ==============================================================================================
  NR CANVAS SHELL  ·  canonical, shared, instrument-agnostic
  Source of truth: diagnostic-skill-builder/templates/canvas-shell.html
  Synced into a leaf skill's assets/ by scripts/sync-brand.sh; drift is gated by check-brand.sh.
  DO NOT EDIT A SYNCED COPY - edit the canonical file and re-sync.

  WHAT THIS IS. The working surface for any instrument whose deliverable is wider than a slide:
  a swimlane process map, a service blueprint, later an org chart or an opportunity heatmap. It is
  a map you move around in, like the OpEx Constellation: drag to pan, pinch or Ctrl/Cmd + scroll
  to zoom, and the rail and the column heads stay put.

  WHAT YOU SEE CHANGES WITH THE ZOOM, NOT JUST THE SIZE. A map of a hundred activities shrunk to
  fit the screen is unreadable, so each zoom level shows one level of the taxonomy:
      zoomed out   one tile per cell: the effort, the count, the pain points   (levels[0])
      in between   one box per group (an activity block)                       (levels[1])
      close up     every card                                                   (levels[2])
  The grid is always laid out for the cards, and the two outer levels are drawn over it, so the
  thing under the pointer stays under the pointer when the level changes.

  It also owns the SLIDE PICKER. The one-page deliverable is not "the canvas, shrunk"; it is the
  part of the canvas that carries the argument, chosen deliberately. The picker is where that
  choice is made and where its consequences are shown.

  WHAT IT IS NOT. It holds no instrument logic: no baseline, no gate, no delta. An instrument
  supplies a MODEL and a set of HOOKS, and gets back a rendered canvas.

  ── THE MODEL ────────────────────────────────────────────────────────────────────────────────
  {
    columns: [ {id, tag, label, sub, kind:'normal'|'off'} ],
    rows:    [ {id, label, sub, icon, accent, kind:'cards'|'track',
                divider:'line of visibility'|null, count, fixed} ],   // fixed: no move arrows
    cells:   { "rowId|colId": {cards:[cardId], track:{tone,label}, note} },   // note: shown in an empty cell
    cards:   { cardId: {title, meta, accent, flags:[], tags:[{text,kind}],
                        group, owner, weight, alerts} },
    groups:  { groupId: {title} },              // optional: the middle zoom level
    outerLinks: 'hover',                        // optional: zoomed out, draw a box's links only on hover
    links:   [ {from, to, sometimes, note, alerts} ],   // optional: card -> card. Across owners =
                                                // a hand-off; alerts = pain points sitting on it (red)
    levels:  [ 'Key processes', 'Activity blocks', 'Activities' ],   // what each zoom level shows
    run:     { title, sub },                    // optional: the label on the run button
    words:   { item:['activity','activities'], alert:['pain point','pain points'], unit:'FTE' },
    filters: [ {k, label, flag} ],              // flag null = everything
    slide:   { rows:[rowId], cols:[colId] },
    cornerTitle, cornerSub, addRowLabel
  }
  Tones: 'positive' | 'neutral' | 'negative'. Tag kinds: 'ch' | 'sys' | 'pain' | 'warn' | ''.
  A card's `weight` (an FTE, say) is summed on the outer levels; `alerts` (its pain points) are
  counted. `owner` is who does it: a link between two owners is drawn as a hand-off.

  ── THE HOOKS (all optional) ──────────────────────────────────────────────────────────────────
  {
    onCard(cardId),  onColumn(colId),  onRow(rowId),   // a click, when editing is unlocked
    onAdd(rowId, colId),                                // the + affordance in a cell
    canAdd(rowId, colId) -> bool,
    onMoveRow(rowId, step),                             // the up / down arrows on a lane
    onAddRow(),                                         // the + under the last lane
    onLink(fromCardId, toCardId),                       // a link drawn from a card's handle
    onLinkClick(link),                                  // a link clicked, when editing
    runInfo(cardId) -> {pains:[string]},                // what the run reads out at this card
    detail(cardId) -> {kind, title, id, rows:[{k,v}], notes:[{body,strong,meta,tone}]},
    onSlideChange(slide),
    suggestSlide() -> {rows:[], cols:[]},
    slideWarnings(slide) -> [string]
  }
  NRCanvas.mount({model, hooks, host, editing}) renders; NRCanvas.redraw() re-renders in place.
  The view (pan and zoom) survives a redraw and a re-mount: an edit never throws you back out.

  ── MOTION AND THE RUN ────────────────────────────────────────────────────────────────────────
  The canvas wears the Constellation's look. Motion (the work flowing along the links, the camera
  gliding, the first view assembling) is a switch in the bar, remembered per viewer in
  localStorage `nr_motion`, and off by default when the system asks for reduced motion. Nothing
  on the map needs motion to be read. The look (dark, the default, or light) is a second switch,
  remembered in localStorage `nr_theme`; the light look re-points the same tokens. "Run your end-to-end process" walks the links from the
  first activity to the last; it appears only when the model carries links.
============================================================================================== -->

        display:none;flex-direction:column;transform:translateX(14px);opacity:0;transition:.18s}
  #ncdp.on{display:flex;transform:none;opacity:1}
  #ncdp .h{padding:15px 20px 13px;border-bottom:1px solid var(--line);background:var(--soft);position:relative}
  #ncdp .k{font-size:var(--fs-85);font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff;
           background:var(--navy-fill);padding:3px 7px;border-radius:5px;display:inline-block}
  #ncdp h3{margin:7px 0 0;font-size:15px;font-weight:800;color:var(--ink);line-height:1.3;padding-right:34px}
  #ncdp .id{font-family:ui-monospace,monospace;font-size:var(--fs-95);color:var(--mut);margin-top:5px;display:block}
  #ncdp .x{position:absolute;top:12px;right:14px;border:none;background:none;font-size:22px;line-height:1;
           color:var(--mut);cursor:pointer}
  #ncdp .b{flex:1;overflow:auto;padding:16px 20px 22px}
  #ncdp .r{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
           border-bottom:1px solid var(--line);font-size:var(--fs-115);color:var(--mut)}
  #ncdp .r b{color:var(--ink);font-weight:600;text-align:right}
  #ncdp h4{margin:16px 0 7px;font-size:var(--fs-95);font-weight:800;letter-spacing:.6px;text-transform:uppercase;
           color:var(--mut)}
  #ncdp .note{border-left:3px solid var(--rag-na);background:var(--soft);border-radius:0 7px 7px 0;
              padding:8px 11px;font-size:var(--fs-115);color:var(--ink);line-height:1.45;margin-bottom:7px}
  #ncdp .note.negative{border-left-color:var(--rag-red);background:rgba(214,69,65,.06)}
  #ncdp .note b{display:block;font-size:12px;margin-top:3px}
  #ncdp .note .m{font-size:var(--fs-10);color:var(--mut);margin-top:3px}
  #ncov{position:fixed;inset:0;background:rgba(11,35,71,.18);z-index:35;display:none}
  #ncov.on{display:block}

  #ncprev{position:fixed;inset:0;background:rgba(11,35,71,.55);z-index:60;display:none;
          align-items:center;justify-content:center;padding:34px}
  #ncprev.on{display:flex}
  #ncprev .box{background:var(--card);border-radius:14px;padding:20px 22px;width:min(1180px,94vw);
               max-height:92vh;overflow:auto;box-shadow:0 40px 90px -40px rgba(0,0,0,.6)}
  #ncprev h2{margin:0 0 3px;font-size:15px;color:var(--ink)}
  #ncprev .sub{font-size:var(--fs-115);color:var(--mut);margin-bottom:14px}
  .nc-mini{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;
           overflow:hidden}
  .nc-mini>*{background:var(--card);padding:6px 8px;font-size:var(--fs-95);color:var(--txt);line-height:1.3}
  .nc-mini .mh{background:var(--navy2);color:#fff;font-weight:700;font-size:var(--fs-10)}
  .nc-mini .mh.off{background:#8A7B58}
  .nc-mini .mr{background:var(--slate-10);font-weight:700;color:var(--navy);font-size:var(--fs-95)}
  #art[data-t="dark"] .nc-mini .mr,#pm[data-t="dark"] .nc-mini .mr{color:#EAEFF5}
  .nc-mini .mc b{display:block;font-weight:600;color:var(--ink);font-size:var(--fs-95)}
  .nc-mini .mc.none{background:var(--soft)}

  /* ══ THE TWIN LOOK ═══════════════════════════════════════════════════════════════════════════
     The canvas wears the Constellation's look whatever the page theme: a deep navy ground, glass
     surfaces, light that means something (blue = the flow, amber = a hand-off, red = a pain point).
     Done by re-pointing the brand tokens INSIDE the canvas, so every component above keeps its
     rules and only its colours change. Motion is a separate switch (.nc-motion), never required
     to read the map. */
  .nc-scroll,.nc-twin{
    --card:#0E182B; --bg:#060B16; --ink:#E8EEF9; --txt:#B3C1DA; --mut:#7586A8; --line:#1B2A47;
    --soft:rgba(147,164,196,.035); --accent:#6F9FFF; --accent-10:rgba(78,134,247,.13);
    --slate-10:rgba(147,164,196,.13); --navy-10:rgba(78,134,247,.18); --navy:#A9C4FF; --navy2:#16315B;
    --navy-fill:#4E86F7; --steel:#5F7EB8; --green:#4FC08D; --rag-green:#4FC08D; --rag-red:#F0736A;
    --rag-red-text:#FF9188; --tint-red:rgba(240,115,106,.17); --rag-amber:#E5A03C;
    --rag-amber-text:#F2B866; --tint-amber:rgba(229,160,60,.17); --rag-na:#57678A;
    --live:#4E86F7; --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
    --lk:#8C9AB3; --lk-bead:rgba(214,224,242,.42); --lk-hot:#7FA8FF;
    color:var(--ink); border:1px solid #14223B; border-radius:14px;
    background:
      radial-gradient(900px 620px at 22% 62%, rgba(46,86,168,.16), transparent 68%),
      radial-gradient(760px 520px at 79% 55%, rgba(32,120,102,.12), transparent 70%),
      radial-gradient(1100px 700px at 50% 12%, rgba(38,66,140,.22), transparent 72%),
      #060B16;
  }
  /* the dot grid is the floor of the twin: it moves and scales with the map (see place()) */
  .nc-clip{background-image:radial-gradient(rgba(143,168,206,.16) 1px, transparent 1.4px);
           background-size:26px 26px}
  .nc-grid{background:transparent}
  .nc-cell,.nc-track{border-color:rgba(27,42,71,.75)}
  .nc-cell.empty,.nc-cell.off{background:rgba(147,164,196,.025)}
  .nc-railov,.nc-headov,.nc-corner{background:rgba(7,13,25,.84);backdrop-filter:blur(8px);
           -webkit-backdrop-filter:blur(8px);border-color:#14223B!important}
  .nc-corner{border-radius:14px 0 0 0}
  .nc-corner b{font-family:var(--mono);font-size:var(--fs-95);letter-spacing:.16em;text-transform:uppercase;
           color:var(--ink-2,#93A4C4);font-weight:500}
  .nc-colh .t{font-family:var(--mono);font-weight:500;letter-spacing:.16em;color:var(--live)}
  .nc-colh b{color:var(--ink)}
  .nc-rail{border-color:#14223B}
  .nc-rail:hover{background:rgba(78,134,247,.07)}
  .nc-rail.acc{box-shadow:inset 3px 0 0 var(--rc), inset 14px 0 18px -16px var(--rc)}
  .nc-sl{font-family:var(--mono);font-weight:500;letter-spacing:.14em;color:#6F80A3}
  .nc-divl{font-family:var(--mono);font-weight:500;letter-spacing:.16em;color:var(--navy)!important;
           background:rgba(7,13,25,.9);border-color:#1E3157}
  .nc-div i{background:var(--live);box-shadow:0 0 10px rgba(78,134,247,.7)}
  .nc-card{background:rgba(14,24,43,.94);border-color:#1C2C4B;
           box-shadow:-7px 0 16px -12px var(--lc,transparent), 0 8px 22px -18px rgba(0,0,0,.9)}
  .nc-card:hover{border-color:rgba(111,159,255,.6);
           box-shadow:-7px 0 16px -12px var(--lc,transparent), 0 0 22px -6px rgba(78,134,247,.55)}
  .nc-card .tags .nc-tag.pain{box-shadow:0 0 10px -3px rgba(240,115,106,.7)}
  .nc-tag.sys{background:rgba(78,134,247,.16);color:#AFC6F6}
  .nc-tag.ch{background:rgba(63,196,180,.15);color:#7FE0D3}
  .nc-tile{border-color:rgba(78,134,247,.28);box-shadow:inset 0 0 26px -14px rgba(111,159,255,.7)}
  .nc-tile .w{text-shadow:0 0 14px rgba(111,159,255,.55)}
  .nc-grp{border-color:rgba(111,159,255,.42);background:rgba(78,134,247,.09);
          box-shadow:0 0 22px -12px rgba(78,134,247,.8)}
  /* the connections are a quiet grey at rest: the cards carry the story, the lines only join it.
     The one you point at (and the run) takes its meaning back: blue the flow, amber a hand-off
     between teams, red a hand-off with a pain point on it. */
  .nc-lk path.l{stroke:var(--lk);opacity:.34}
  .nc-lk path.l.ho{stroke:var(--lk);opacity:.5;stroke-width:calc(1.7px*var(--inv))}
  .nc-lk path.l.hot,.nc-running .nc-lk path.l.run{stroke:var(--lk-hot)}
  .nc-lk path.l.ho.hot,.nc-running .nc-lk path.l.ho.run{stroke:var(--rag-amber)}
  .nc-lk path.l.pn.hot,.nc-running .nc-lk path.l.pn.run{stroke:var(--rag-red)}
  .nc-chip.nc-mo{display:inline-flex;align-items:center;gap:6px}
  .nc-mo i{width:22px;height:12px;border-radius:999px;background:var(--line);position:relative;transition:.18s}
  .nc-mo i:after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;border-radius:50%;
                 background:#fff;transition:.18s}
  .nc-mo.on{background:var(--card);color:var(--ink);border-color:var(--accent)}
  .nc-mo.on i{background:#4E86F7;box-shadow:0 0 8px rgba(78,134,247,.8)}
  .nc-mo.on i:after{left:12px}

  /* the zoom control and the level line sit inside the map, where the Constellation keeps them */
  .nc-zoomctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:1px;
    border:1px solid var(--line);border-radius:8px;overflow:hidden;background:rgba(12,21,38,.86);
    backdrop-filter:blur(6px);z-index:6}
  .nc-zoomctl button{width:34px;height:32px;display:grid;place-items:center;font-size:15px;color:#93A4C4;
    border:0;background:none;cursor:pointer;transition:.14s}
  .nc-zoomctl button:hover{background:rgba(78,134,247,.16);color:var(--ink)}
  .nc-zoomctl button+button{border-top:1px solid #152239}
  .nc-zoomctl .fit{font-size:var(--fs-10);font-family:var(--mono);letter-spacing:.04em}
  .nc-hint{position:absolute;left:222px;bottom:10px;font-family:var(--mono);font-size:var(--fs-105);letter-spacing:.06em;
    color:#7586A8;pointer-events:none;z-index:6;text-transform:uppercase;background:rgba(7,13,25,.82);
    padding:4px 8px;border-radius:6px;backdrop-filter:blur(6px)}
  .nc-hint b{color:#AFC6F6;font-weight:500}

  /* the outer levels cross-fade instead of popping */
  .nc-ov{display:block!important;opacity:0}
  .nc-lv1 .nc-ov1,.nc-lv2 .nc-ov2{opacity:1}
  .nc-tile,.nc-grp{pointer-events:none}
  .nc-lv1 .nc-ov1 .nc-tile,.nc-lv2 .nc-ov2 .nc-grp{pointer-events:auto}
  .nc-lk g{display:inline!important;opacity:0;pointer-events:none}
  .nc-lv1 .nc-lk .g1,.nc-lv2 .nc-lk .g2,.nc-lv3 .nc-lk .g3{opacity:1;pointer-events:auto}
  .nc-lv1 .nc-grid .nc-card,.nc-lv2 .nc-grid .nc-card,.nc-lv1 .nc-sl,.nc-lv2 .nc-sl{visibility:visible!important;opacity:0;pointer-events:none}


  /* ══ THE TWIN FRAME ══════════════════════════════════════════════════════════════════════════
     frame:'twin' — the canvas as its own full-screen deliverable, laid out like the Constellation:
     a top bar (what this is, which arrangement, the switches, the instrument's own controls), a
     sidebar (what to show, where to jump, the run) and the map filling everything else. */
  .nc-twin{position:fixed;inset:0;z-index:30;display:grid;grid-template-columns:248px 1fr;
    grid-template-rows:auto 1fr;color:var(--ink);font-family:var(--font,system-ui,sans-serif);
    background:radial-gradient(900px 620px at 22% 62%, rgba(46,86,168,.16), transparent 68%),
      radial-gradient(1100px 700px at 50% 12%, rgba(38,66,140,.22), transparent 72%),#060B16}
  .nc-twin.off{display:none}
  .nc-twin>.nc-scroll{grid-column:2;grid-row:2;border:0;border-radius:0;min-height:0;border-top:0}
  .nc-tbar{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:14px;padding:9px 16px;
    border-bottom:1px solid #152239;background:linear-gradient(180deg,rgba(6,11,22,.95),rgba(6,11,22,.7));
    flex-wrap:wrap;min-height:52px;box-sizing:border-box}
  .nc-brand{display:flex;align-items:baseline;gap:12px;min-width:0;flex:1 1 260px}
  .nc-brand b{font-size:16px;font-weight:600;letter-spacing:.2px;white-space:nowrap;color:var(--ink)}
  .nc-brand span{font-family:var(--mono);font-size:var(--fs-95);letter-spacing:.16em;text-transform:uppercase;
    color:#57678A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nc-tmid{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .nc-arr{display:inline-flex;border:1px solid #1B2A47;border-radius:999px;overflow:hidden}
  .nc-arr button{border:0;background:none;color:#93A4C4;font:inherit;font-size:var(--fs-115);font-weight:600;
    padding:6px 13px;cursor:pointer}
  .nc-arr button.on{background:rgba(78,134,247,.2);color:#C9DAFF}
  .nc-tbar .nc-chip{background:transparent;border-color:#1B2A47;color:#B3C1DA}
  .nc-tbar .nc-chip.on{background:rgba(78,134,247,.2);border-color:rgba(78,134,247,.55);color:#C9DAFF}
  .nc-tbar .nc-links{color:#7586A8}
  .nc-slot{display:flex;align-items:center;gap:8px}
  .nc-side{grid-column:1;grid-row:2;border-right:1px solid #152239;padding:16px 16px 14px;overflow:auto;
    display:flex;flex-direction:column;gap:18px;min-height:0;scrollbar-width:none}
  .nc-side::-webkit-scrollbar{display:none}
  .nc-side h6{margin:0 0 8px;font-family:var(--mono);font-size:var(--fs-95);font-weight:500;letter-spacing:.18em;
    text-transform:uppercase;color:#57678A}
  .nc-side .nc-chip{background:transparent;border-color:#1E3157;color:#B3C1DA;margin:0 4px 6px 0;
    display:inline-flex;align-items:center}
  .nc-side .nc-chip.on{background:rgba(78,134,247,.18);border-color:rgba(78,134,247,.55);color:#C9DAFF}
  .nc-side .nc-chip .dot{width:7px;height:7px;border-radius:50%;margin-right:6px;flex:none}
  .nc-side .nc-chip.ac{color:#93A4C4}
  .nc-side .nc-chip.ac:hover{border-color:#2E4674;color:var(--ink);background:rgba(78,134,247,.08)}
  .nc-siderun{margin-top:auto}
  .nc-siderun .nc-runbtn{height:auto;padding:11px 12px;border-radius:9px}
  .nc-siderun .nc-runbtn b{font-size:12.5px}
  .nc-siderun .nc-runbtn small{display:block;font-size:var(--fs-11);color:#93A4C4;line-height:1.35;margin-top:2px;font-weight:400}
  .nc-twin .nc-tour{left:226px}
  @media (max-width:900px){ .nc-twin{grid-template-columns:0 1fr} .nc-side{display:none} }

  /* ══ MOTION — only when the switch is on ═════════════════════════════════════════════════════ */
  .nc-motion .nc-ov,.nc-motion .nc-lk g,.nc-motion .nc-card,.nc-motion .nc-sl{transition:opacity .32s ease}
  /* the work flowing: a bead of light travels each connection, in the direction the work goes */
  .nc-lk path.fl{fill:none;stroke-linecap:round;opacity:0;pointer-events:none;
    stroke-width:calc(3px*var(--inv));stroke-dasharray:0 calc(26px*var(--inv))}
  .nc-motion .nc-lk path.fl{opacity:.95;animation:ncflow 1.7s linear infinite}
  .nc-lk path.fl{stroke:var(--lk-bead)}
  .nc-motion .nc-lk path.fl{opacity:.8}
  @keyframes ncflow{to{stroke-dashoffset:calc(-26px*var(--inv))}}
  .nc-hoverlinks.nc-lv1 .nc-lk path.fl,.nc-hoverlinks.nc-lv2 .nc-lk path.fl{display:none}
  .nc-focus .nc-lk path.fl{opacity:.1}
  .nc-focus .nc-lk path.fl.hot{opacity:1}
  /* the first view assembles itself, column by column, the way the Constellation cascades */
  .nc-motion.nc-enter .nc-cell,.nc-motion.nc-enter .nc-track,.nc-motion.nc-enter .nc-tile{animation:ncin .6s cubic-bezier(.2,.7,.2,1) both;
    animation-delay:calc(var(--ci,0)*110ms + var(--ri,0)*30ms)}
  .nc-motion.nc-enter .nc-lk{animation:ncfade .7s ease .55s both}
  @keyframes ncin{from{opacity:0;transform:translateY(10px)}}
  @keyframes ncfade{from{opacity:0}}
  .nc-motion .nc-card:hover{transform:translateY(-1px)}
  @media (prefers-reduced-motion:reduce){ .nc-motion *{animation:none!important;transition:none!important} }

  /* ══ RUN YOUR END-TO-END PROCESS ═════════════════════════════════════════════════════════════ */
  /* it sits in the top-left corner, the one place on the canvas nothing scrolls under */
  .nc-runbtn{width:100%;height:100%;box-sizing:border-box;text-align:left;cursor:pointer;font:inherit;
    border:1px solid rgba(78,134,247,.5);border-radius:9px;padding:6px 9px;background:rgba(78,134,247,.10);
    display:flex;gap:9px;align-items:center;color:var(--ink);transition:.16s}
  .nc-corner.run{padding:8px 10px}
  .nc-runbtn:hover{background:rgba(32,58,110,.95)}
  .nc-runbtn .ic2{width:24px;height:24px;border-radius:50%;flex:none;border:1px solid rgba(78,134,247,.7);
    display:grid;place-items:center;color:#7FA8FF;font-size:var(--fs-9);box-shadow:0 0 12px -2px rgba(78,134,247,.7)}
  .nc-runbtn b{display:block;font-size:12px;font-weight:600;line-height:1.25;letter-spacing:0;text-transform:none;
    font-family:inherit;color:var(--ink)}
  .nc-running .nc-runbtn{opacity:.45;pointer-events:none}
  .nc-tour{position:absolute;left:226px;right:64px;bottom:14px;z-index:7;display:none;gap:14px;align-items:center;
    border:1px solid rgba(78,134,247,.34);border-radius:12px;background:rgba(9,16,29,.94);backdrop-filter:blur(10px);
    padding:12px 14px;box-shadow:0 14px 44px rgba(0,0,0,.55);color:var(--ink)}
  .nc-running .nc-tour{display:flex}
  .nc-running .nc-hint{display:none}
  .nc-tour .sn{font-family:var(--mono);font-size:var(--fs-10);letter-spacing:.14em;color:#7FA8FF;flex:none;
    border:1px solid rgba(78,134,247,.4);border-radius:6px;padding:5px 9px}
  .nc-tour .tx{flex:1;min-width:0}
  .nc-tour .tx b{display:block;font-size:13.5px;font-weight:600;margin-bottom:2px}
  .nc-tour .tx .who{display:block;font-size:var(--fs-115);color:#93A4C4;line-height:1.45}
  .nc-tour .tx .ho{color:#F2B866}
  .nc-tour .tx .pn{display:block;font-size:var(--fs-115);color:#FF9188;line-height:1.45;margin-top:2px}
  .nc-tour .nav{display:flex;gap:6px;flex:none}
  .nc-tour .nav button{border:1px solid #1B2A47;border-radius:7px;padding:6px 12px;font-size:12px;color:#B3C1DA;
    background:none;cursor:pointer;transition:.14s}
  .nc-tour .nav button:hover{border-color:#2E4674;color:var(--ink);background:rgba(78,134,247,.10)}
  .nc-tour .nav button.pri{border-color:rgba(78,134,247,.55);color:#9CBEFF;background:rgba(78,134,247,.14)}
  .nc-tour .bar2{position:absolute;left:14px;right:14px;bottom:5px;height:2px;border-radius:2px;background:#152239;overflow:hidden}
  .nc-tour .bar2 i{display:block;height:100%;background:#4E86F7;box-shadow:0 0 8px rgba(78,134,247,.9);transition:width .4s}
  .nc-running .nc-card,.nc-running .nc-tile,.nc-running .nc-grp{opacity:.22}
  .nc-running .nc-card.seen{opacity:.75}
  .nc-running .nc-card.now{opacity:1;border-color:#7FA8FF;
    box-shadow:0 0 0 1px rgba(127,168,255,.6), 0 0 34px -4px rgba(78,134,247,.85)}
  .nc-running .nc-lk path.l{opacity:.07}
  .nc-running .nc-lk path.fl{opacity:0}
  .nc-running .nc-lk path.l.run{opacity:1}
  .nc-running .nc-lk path.l.runnow{opacity:1;stroke-width:calc(2.6px*var(--inv))}
  .nc-motion.nc-running .nc-lk path.l.runnow{stroke-dasharray:var(--len) var(--len);animation:ncdraw .7s ease-out both}
  @keyframes ncdraw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
  /* ══ THE LIGHT LOOK ══════════════════════════════════════════════════════════════════════════
     The same twin on a bright ground, for whoever reads better that way: a switch in the bar,
     remembered per viewer in localStorage `nr_theme`. Same glass, same light-that-means-something,
     re-pointed tokens plus the few surfaces the dark look paints by hand. Dark stays the default. */
  .nc-light .nc-scroll,.nc-light .nc-twin,.nc-light.nc-twin{
    --card:#FFFFFF; --bg:#F3F6FB; --ink:#0E1B33; --txt:#3E4C68; --mut:#6B7A95; --line:#DFE6F1;
    --soft:rgba(30,60,120,.03); --accent:#2F6BEB; --accent-10:rgba(47,107,235,.08);
    --slate-10:rgba(90,110,150,.10); --navy-10:rgba(47,107,235,.10); --navy:#1F4FB8; --navy2:#16315B;
    --navy-fill:#2F6BEB; --steel:#8E9AB0; --green:#1F9D6B; --rag-green:#1F9D6B; --rag-red:#D9493F;
    --rag-red-text:#C2483D; --tint-red:rgba(217,73,63,.10); --rag-amber:#C9851F;
    --rag-amber-text:#A86A12; --tint-amber:rgba(201,133,31,.12); --rag-na:#A3AEC2; --live:#2F6BEB;
    --lk:#8E9AB0; --lk-bead:rgba(70,92,135,.38); --lk-hot:#2F6BEB;
    border-color:#E2E8F2;
    background:
      radial-gradient(900px 620px at 22% 62%, rgba(47,107,235,.07), transparent 68%),
      radial-gradient(760px 520px at 79% 55%, rgba(20,150,135,.06), transparent 70%),
      radial-gradient(1100px 700px at 50% 12%, rgba(47,107,235,.08), transparent 72%),
      #F5F8FC;
  }
  .nc-light .nc-twin>.nc-scroll{background:transparent}
  .nc-light .nc-clip{background-image:radial-gradient(rgba(60,90,150,.16) 1px, transparent 1.4px)}
  .nc-light .nc-cell,.nc-light .nc-track{border-color:rgba(206,216,233,.85)}
  .nc-light .nc-cell.empty,.nc-light .nc-cell.off{background:rgba(30,60,120,.022)}

<script>
/* NRCanvas - the shared canvas renderer. Instrument-agnostic by construction: it never reads a
   field it has not defined above, and every decision it cannot make on its own is a hook. */
var NRCanvas = (function(){
  var M=null, H={}, HOST=null, EDITING=false, PICKING=false, FILTER=null, CLOSED={};
  var RAILW=210, HEADH=66, COLW=260;
  var V=null;                    /* the view: {s, tx, ty}. Survives redraws; null until the first fit */
  var G=null;                    /* the measured geometry of the last draw, in world units */
  var LV=3, DRAG=null, LINKDRAG=null, MOVED=false, KEYS=false, LINKMODE='all', OUTER=0, SHOWALL=null;
  var TWIN=false, CHROME={};     /* frame:'twin' - the canvas as its own full-screen deliverable */
  var ZMIN=0.08, ZMAX=2.2, ANIM=null, RUN=null, ENTERED=false;
  /* motion is a per-viewer choice, remembered on this browser; off when the system asks for less */
  var MOTION=(function(){ try{ var v=localStorage.getItem('nr_motion'); if(v!=null) return v==='1'; }catch(_){}
    try{ return !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(_){ return true; } })();
  /* the look is a per-viewer choice too: dark (the default) or light */
  var LIGHT=(function(){ try{ return localStorage.getItem('nr_theme')!=='dark'; }catch(_){ return true; } })();

  var ICONS={
    journey:'<path d="M4 12h12"/><path d="M13 8l4 4-4 4"/><circle cx="4" cy="12" r="1.6"/>',
    feel:'<circle cx="12" cy="12" r="8"/><path d="M9 14.5s1.2 1.2 3 1.2 3-1.2 3-1.2"/><path d="M9.5 9.5h.01"/><path d="M14.5 9.5h.01"/>',
    touch:'<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18.5h2"/>',
    front:'<circle cx="12" cy="8" r="3.2"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/>',
    back:'<rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="M3.5 10h17"/>',
    support:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>',
    systems:'<ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"/><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/>',
    pain:'<path d="M12 4.5 21 19H3z"/><path d="M12 10v4"/><path d="M12 16.6h.01"/>',
    team:'<circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3 3 0 0 1 0 5.6"/><path d="M17.5 14a5 5 0 0 1 3 5"/>',
    external:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.4 2.3 3.6 5.2 3.6 8.5s-1.2 6.2-3.6 8.5c-2.4-2.3-3.6-5.2-3.6-8.5s1.2-6.2 3.6-8.5z"/>'
  };
  var CHEV='<svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
  var TICK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var SVGI=function(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';};
  var TONE={positive:'var(--rag-green)',neutral:'var(--rag-na)',negative:'var(--rag-red)'};
  var TONEY={positive:14,neutral:28,negative:42};

  function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function rn(n){return Math.round(n*10)/10;}
  function cell(r,c){ return (M.cells||{})[r+'|'+c] || {}; }
  function cardsOf(r,c){ return (cell(r,c).cards||[]).map(function(id){
    var x=(M.cards||{})[id]; return x?Object.assign({id:id},x):null; }).filter(Boolean); }
  function onSlide(kind,id){ var s=M.slide||{rows:[],cols:[]};
    return (kind==='r'?s.rows:s.cols).indexOf(id)>=0; }
  function passes(card){ if(!FILTER) return true; return (card.flags||[]).indexOf(FILTER)>=0; }
  function word(k,n){ var w=(M.words||{})[k]; if(!w) w=k==='item'?['card','cards']:k==='alert'?['pain point','pain points']:['',''];
    return n===1?w[0]:w[1]; }
  function unit(){ return (M.words||{}).unit||''; }
  function hasGroups(){ return !!(M.groups&&Object.keys(M.groups).length); }
  function levelName(l){ var L=M.levels||['Overview','Groups','Cards'];
    return L[l-1]||L[L.length-1]; }

  function icon(k){ return '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
    'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[k]||'')+'</svg></span>'; }

  /* ── the bar: filters on the left, the links and the zoom on the right ────────────────────── */
  function counts(flag){
    if(!flag) return Object.keys(M.cards||{}).length;
    var n=0; for(var k in (M.cards||{})) if(((M.cards[k].flags)||[]).indexOf(flag)>=0) n++;
    return n;
  }
  function filtersHtml(){
    return (M.filters||[]).map(function(f){
      return '<button class="nc-chip'+((f.flag||null)===FILTER?' on':'')+'" data-flag="'+
        esc(f.flag||'')+'">'+esc(f.label)+'<span class="n">'+counts(f.flag||null)+'</span></button>';
    }).join('');
  }
  function bar(){ return filtersHtml()+'<span class="nc-sp"></span>'+legendHtml(); }
  function legendHtml(){
    var h='';
    if((M.links||[]).length){
      var ho=handoffs();
      h+='<span class="nc-links"><span class="k"></span>'+ho+' hand-off'+(ho===1?'':'s')+' between teams'+
         '<span class="k s" style="margin-left:6px"></span>next step'+
         ((M.links||[]).some(function(l){return l.sometimes;})?'<span class="k d" style="margin-left:6px"></span>only sometimes':'')+'</span>';
    }
    h+='<button class="nc-chip" id="ncall-links" style="display:none"></button>';
    h+='<button class="nc-chip nc-mo'+(MOTION?' on':'')+'" id="ncmotion" title="Animation on the map: the work flowing along the connections, and the camera gliding">'+
       '<i></i>Motion '+(MOTION?'on':'off')+'</button>';
    h+='<span class="nc-arr nc-thm" title="The look of the map: whichever reads better for you">'+
       '<button data-thm="dark"'+(LIGHT?'':' class="on"')+'>Dark</button>'+
       '<button data-thm="light"'+(LIGHT?' class="on"':'')+'>Light</button></span>';
    return h;
  }
  function arrHtml(){
    var A=M.arrangements||[]; if(A.length<2) return '';
    return '<span class="nc-arr">'+A.map(function(a){ return '<button data-arr="'+esc(a.id)+'"'+
      (a.id===M.arrangement?' class="on"':'')+'>'+esc(a.label)+'</button>'; }).join('')+'</span>';
  }
  function jumpHtml(){
    var cols=(M.columns||[]).map(function(c){ return '<button class="nc-chip ac" data-jump="c:'+esc(c.id)+'">'+esc(c.label)+'</button>'; }).join('');
    var rows=(M.rows||[]).filter(function(r){ return r.kind!=='track'; }).map(function(r){
      return '<button class="nc-chip ac" data-jump="r:'+esc(r.id)+'">'+(r.accent?'<span class="dot" style="background:'+r.accent+'"></span>':'')+esc(r.label)+'</button>'; }).join('');
    return '<div><h6>'+esc((M.jumpWords||[])[0]||'Columns')+'</h6>'+cols+'</div>'+
           '<div><h6>'+esc((M.jumpWords||[])[1]||'Rows')+'</h6>'+rows+'</div>';
  }
  function paintBar(){
    if(!TWIN){ HOST.querySelector('.nc-bar').innerHTML=bar(); return; }
    HOST.querySelector('.nc-brand').innerHTML='<b>'+esc(CHROME.title||M.title||'')+'</b>'+
      (CHROME.eyebrow?'<span>'+esc(CHROME.eyebrow)+'</span>':'');
    HOST.querySelector('.nc-tmid').innerHTML=arrHtml()+legendHtml();
    HOST.querySelector('.nc-sidemain').innerHTML=((M.filters||[]).length?'<div><h6>Show</h6>'+filtersHtml()+'</div>':'')+jumpHtml();
    HOST.querySelector('.nc-sidex').innerHTML=(CHROME.side||[]).map(function(sec,si){
      return '<div><h6>'+esc(sec.title)+'</h6>'+(sec.actions||[]).map(function(a,ai){
        return '<button class="nc-chip ac" data-sact="'+si+'.'+ai+'"'+(a.hint?' title="'+esc(a.hint)+'"':'')+'>'+esc(a.label)+'</button>'; }).join('')+'</div>'; }).join('');
  }
  function handoffs(){ var n=0; (M.links||[]).forEach(function(l){ if(isHandoff(l)) n++; }); return n; }
  function isHandoff(l){ var a=(M.cards||{})[l.from], b=(M.cards||{})[l.to];
    return !!(a&&b&&a.owner&&b.owner&&a.owner!==b.owner); }

  /* ── the grid, inside the zoomed world. No rail, no heads: those are drawn outside ─────────── */
  function cardHtml(card){
    return '<div class="nc-card'+(passes(card)?'':' nomatch')+
      '" data-card="'+esc(card.id)+'"'+(card.accent?' style="border-left:3px solid '+card.accent+';--lc:'+card.accent+'"':'')+'>'+
      '<b>'+esc(card.title)+'</b>'+
      (card.meta?'<span class="who">'+esc(card.meta)+'</span>':'')+
      ((card.tags||[]).length?'<div class="tags">'+card.tags.map(function(t){
        return '<span class="nc-tag '+esc(t.kind||'')+'">'+esc(t.text)+'</span>';}).join('')+'</div>':'')+
      (H.onLink?'<span class="nc-hd" data-hd="'+esc(card.id)+'" title="Drag to the activity that comes next"></span>':'')+
      '</div>';
  }
  function trackCell(row,col,i){
    var c=cell(row.id,col.id).track;
    var dim=PICKING&&!onSlide('c',col.id);
    if(!c) return '<div class="nc-track'+(col.kind==='off'?' off':'')+(dim?' dim':'')+'" data-r="'+esc(row.id)+'" data-c="'+esc(col.id)+'"></div>';
    var y=TONEY[c.tone]!=null?TONEY[c.tone]:28, col2=TONE[c.tone]||'var(--rag-na)';
    var prev=(M.columns[i-1]&&cell(row.id,M.columns[i-1].id).track)||null;
    var next=(M.columns[i+1]&&cell(row.id,M.columns[i+1].id).track)||null;
    var py=prev?(TONEY[prev.tone]!=null?TONEY[prev.tone]:28):y;
    var ny=next?(TONEY[next.tone]!=null?TONEY[next.tone]:28):y;
    var a=(py+y)/2, b=(ny+y)/2;
    return '<div class="nc-track'+(col.kind==='off'?' off':'')+(dim?' dim':'')+'" data-r="'+esc(row.id)+'" data-c="'+esc(col.id)+'">'+
      '<svg viewBox="0 0 100 56" preserveAspectRatio="none">'+
        '<path d="M0 '+a+' C25 '+a+' 25 '+y+' 50 '+y+' C75 '+y+' 75 '+b+' 100 '+b+'" fill="none" '+
        'stroke="'+col2+'" stroke-width="1.8" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>'+
      '<span class="nc-dot" style="top:'+y+'px;background:'+col2+'"></span>'+
      (c.label?'<div class="nc-tlab"><b>'+esc(c.label)+'</b></div>':'')+'</div>';
  }
  var STACK=null;                /* cards in one stack before it wraps into a second column. Chosen
                                    once, so that the whole map is about the shape of the screen */
  function pickStack(){
    var sc=HOST.querySelector('.nc-scroll'), aim=Math.max(0.6,(sc.clientWidth-RAILW)/Math.max(200,sc.clientHeight-HEADH));
    var best=6, bestd=1e9, grouped=hasGroups();
    for(var st=3; st<=8; st++){
      var W=0, Ht=0;
      (M.columns||[]).forEach(function(c){ var cw=COLW;
        (M.rows||[]).forEach(function(r){ var runs={}, order=[];
          cardsOf(r.id,c.id).forEach(function(card){ var g=grouped?(card.group||card.id):'_'; if(!runs[g]){runs[g]=0;order.push(g);} runs[g]++; });
          var w=order.reduce(function(a,g){ return a+Math.ceil(runs[g]/st)*244+18; },30); if(w>cw) cw=w; });
        W+=cw; });
      (M.rows||[]).forEach(function(r){ var rh=60;
        if(r.kind==='track'){ Ht+=96; return; }
        (M.columns||[]).forEach(function(c){ var runs={};
          cardsOf(r.id,c.id).forEach(function(card){ var g=grouped?(card.group||card.id):'_'; runs[g]=(runs[g]||0)+1; });
          Object.keys(runs).forEach(function(g){ var n=runs[g], per=Math.ceil(n/Math.ceil(n/st)); rh=Math.max(rh, per*66+40); }); });
        Ht+=rh; });
      var d=Math.abs(Math.log((W/Math.max(1,Ht))/aim));
      if(d<bestd-0.05){ bestd=d; best=st; }
    }
    return best;
  }
  function stacks(list, key){
    var runs=[], cur=null, grouped=hasGroups();
    list.forEach(function(card){ var g=grouped?(card.group||('_'+card.id)):'_all';
      if(cur&&cur.g===g) cur.items.push(card); else { cur={g:g,items:[card]}; runs.push(cur); } });
    return runs.map(function(run){
      var gi=grouped?(M.groups||{})[run.g]:null, n=run.items.length, k=Math.ceil(n/STACK), per=Math.ceil(n/k), subs='';
      for(var i=0;i<k;i++) subs+='<div class="nc-sub">'+run.items.slice(i*per,(i+1)*per).map(cardHtml).join('')+'</div>';
      return '<div class="nc-stack" data-st="'+esc(key+'#'+run.g)+'">'+
        (gi?'<span class="nc-sl" title="'+esc(gi.title)+'">'+esc(gi.title)+'</span>':'')+
        (k>1?'<div class="nc-subs">'+subs+'</div>':run.items.map(cardHtml).join(''))+'</div>';
    }).join('');
  }
  function grid(){
    var cols=M.columns||[], rows=M.rows||[], h='';
    rows.forEach(function(r,ri){
      if(r.divider) h+='<div class="nc-div" data-div="'+esc(r.id)+'"><i></i></div>';
      cols.forEach(function(c,i){
        var dim=PICKING&&(!onSlide('c',c.id)||!onSlide('r',r.id));
        if(r.kind==='track'){ h+=CLOSED[r.id]
          ? '<div class="nc-cell empty'+(dim?' dim':'')+'" data-r="'+esc(r.id)+'" data-c="'+esc(c.id)+'"></div>' : trackCell(r,c,i); return; }
        var list=cardsOf(r.id,c.id);
        if(CLOSED[r.id]){
          h+='<div class="nc-cell'+(list.length?'':' empty')+(dim?' dim':'')+'" data-r="'+esc(r.id)+'" data-c="'+esc(c.id)+'">'+
             (list.length?'<span class="nc-closed">'+list.length+' '+word('item',list.length)+'</span>':'')+'</div>';
          return; }
        var plus=(EDITING&&H.onAdd&&(!H.canAdd||H.canAdd(r.id,c.id)))
          ? '<button class="nc-plus" data-add="'+esc(r.id)+'|'+esc(c.id)+'" title="Add">+</button>' : '';
        h+='<div class="nc-cell'+(c.kind==='off'?' off':'')+(list.length?'':' empty')+(dim?' dim':'')+
           '" style="--ci:'+i+';--ri:'+ri+'" data-r="'+esc(r.id)+'" data-c="'+esc(c.id)+'">'+
           (list.length?stacks(list,r.id+'|'+c.id):(cell(r.id,c.id).note?'<div class="nc-ghost">'+esc(cell(r.id,c.id).note)+'</div>':''))+plus+'</div>';
      });
    });
    return h;
  }

  /* ── measuring: where every row, column, cell and card landed, in world units ───────────────
     offsetLeft/offsetTop ignore transforms, so this is the same at any zoom. */
  function offs(el, stop){ var x=0,y=0; while(el&&el!==stop){ x+=el.offsetLeft; y+=el.offsetTop; el=el.offsetParent; }
    return {x:x,y:y}; }
  function measure(){
    var world=HOST.querySelector('.nc-world'), grid=HOST.querySelector('.nc-grid');
    var g={rows:{},cols:{},cells:{},cards:{},divs:{},W:grid.offsetWidth,H:grid.offsetHeight};
    grid.querySelectorAll('[data-r][data-c]').forEach(function(el){
      var o=offs(el,world), r=el.getAttribute('data-r'), c=el.getAttribute('data-c');
      var b={x:o.x,y:o.y,w:el.offsetWidth,h:el.offsetHeight};
      g.cells[r+'|'+c]=b;
      if(!g.rows[r]) g.rows[r]={y:b.y,h:b.h};
      if(!g.cols[c]) g.cols[c]={x:b.x,w:b.w};
    });
    grid.querySelectorAll('.nc-card').forEach(function(el){
      var o=offs(el,world), cl=el.closest('[data-r][data-c]');
      g.cards[el.getAttribute('data-card')]={x:o.x,y:o.y,w:el.offsetWidth,h:el.offsetHeight,
        cell:cl.getAttribute('data-r')+'|'+cl.getAttribute('data-c')};
    });
    g.stacks={};
    grid.querySelectorAll('.nc-stack').forEach(function(el){ var o=offs(el,world);
      g.stacks[el.getAttribute('data-st')]={x:o.x,y:o.y,w:el.offsetWidth,h:el.offsetHeight}; });
    grid.querySelectorAll('.nc-div').forEach(function(el){ g.divs[el.getAttribute('data-div')]=offs(el,world).y; });
    G=g;
  }

  /* ── the two outer levels ─────────────────────────────────────────────────────────────────── */
  function sumUp(list){ var w=0,hasW=false,a=0,m=0;
    list.forEach(function(c){ if(typeof c.weight==='number'){ w+=c.weight; hasW=true; }
      a+=(c.alerts||0); if(passes(c)) m++; });
    return {w:w,hasW:hasW,a:a,n:list.length,m:m}; }
  function alertPill(a){ return a?'<span class="nc-pill">'+a+' '+word('alert',a)+'</span>':''; }
  function overlays(){
    var o1='', o2='', mx=0;
    (M.rows||[]).forEach(function(r){ (M.columns||[]).forEach(function(c){
      var s=sumUp(cardsOf(r.id,c.id)); if(s.w>mx) mx=s.w; }); });
    (M.rows||[]).forEach(function(r){
      if(r.kind==='track'||CLOSED[r.id]) return;
      (M.columns||[]).forEach(function(c){
        var list=cardsOf(r.id,c.id), b=G.cells[r.id+'|'+c.id]; if(!list.length||!b) return;
        var s=sumUp(list), pad=6;
        var tint=s.hasW&&mx? 'rgba(110,177,209,'+(0.10+0.42*s.w/mx).toFixed(2)+')' : 'var(--accent-10)';
        o1+='<div class="nc-tile" data-zoom="'+esc(r.id+'|'+c.id)+'" data-key="'+esc(r.id+'|'+c.id)+'" data-w="'+(b.w-2*pad)+'" data-h="'+(b.h-2*pad)+'" style="--ci:'+(M.columns||[]).indexOf(c)+';left:'+(b.x+pad)+'px;top:'+(b.y+pad)+
          'px;width:'+(b.w-2*pad)+'px;height:'+(b.h-2*pad)+'px;background:'+tint+'">'+
          (s.hasW?'<span class="w">'+rn(s.w)+' '+esc(unit())+'</span>':'<span class="w">'+s.n+'</span>')+
          '<span class="c">'+(s.hasW?s.n+' ':'')+word('item',s.n)+(FILTER?' · '+s.m+' match':'')+'</span>'+alertPill(s.a)+'</div>';
        /* the middle level: one box per group, over that group's stack in this cell */
        if(!hasGroups()) return;
        var runs=[], cur=null;
        list.forEach(function(card){ var gid=card.group||('_'+card.id);
          if(cur&&cur.g===gid) cur.items.push(card); else { cur={g:gid,items:[card]}; runs.push(cur); } });
        runs.forEach(function(run){
          var sb=G.stacks[r.id+'|'+c.id+'#'+run.g]; if(!sb) return;
          var gs=sumUp(run.items), gi=(M.groups||{})[run.g];
          var title=gi?gi.title:run.items[0].title;
          o2+='<div class="nc-grp" data-zoomcard="'+esc(run.items[0].id)+'" data-key="'+esc(r.id+'|'+c.id+'#'+run.g)+'" data-w="'+(sb.w+8)+'" data-h="'+(sb.h+8)+'" style="left:'+(sb.x-4)+'px;top:'+(sb.y-4)+
            'px;width:'+(sb.w+8)+'px;height:'+(sb.h+8)+'px">'+
            '<b>'+esc(title)+'</b>'+(gi?'<span>'+gs.n+' '+word('item',gs.n)+(gs.hasW?' · '+rn(gs.w)+' '+esc(unit()):'')+
            (FILTER?' · '+gs.m+' match':'')+'</span>':'')+alertPill(gs.a)+'</div>';
        });
      });
    });
    HOST.querySelector('.nc-ov1').innerHTML=o1;
    HOST.querySelector('.nc-ov2').innerHTML=o2;
  }

  /* ── the links. Drawn once per level from the card links, so the hand-offs you see zoomed out
        are exactly the sum of the ones underneath ──────────────────────────────────────────── */
  function boxOf(id, lv){
    var cb=G.cards[id]; if(!cb) return null;
    if(lv===3) return {k:id,x:cb.x,y:cb.y,w:cb.w,h:cb.h,cell:cb.cell};
    if(lv===1){ var b=G.cells[cb.cell]; return {k:cb.cell,x:b.x+6,y:b.y+6,w:b.w-12,h:b.h-12,cell:cb.cell}; }
    var g=(M.cards[id]||{}).group||('_'+id), sb=G.stacks[cb.cell+'#'+g];
    if(!sb) return {k:id,x:cb.x,y:cb.y,w:cb.w,h:cb.h,cell:cb.cell};
    return {k:cb.cell+'#'+g,x:sb.x-4,y:sb.y-4,w:sb.w+8,h:sb.h+8,cell:cb.cell};
  }
  function curve(a,b){
    var ay=a.y+a.h/2, by=b.y+b.h/2, dy=Math.abs(by-ay);
    if(Math.abs(a.x-b.x)<2){ var bx=Math.min(70,18+dy*0.25);
      return 'M'+a.x+' '+ay+'C'+(a.x-bx)+' '+ay+' '+(b.x-bx)+' '+by+' '+(b.x-1)+' '+by; }
    if(b.x>a.x){ var x1=a.x+a.w, x2=b.x-1, k=Math.max(30,(x2-x1)*0.5);
      return 'M'+x1+' '+ay+'C'+(x1+k)+' '+ay+' '+(x2-k)+' '+by+' '+x2+' '+by; }
    return 'M'+(a.x+a.w/2)+' '+(a.y+a.h)+'C'+(a.x+a.w/2)+' '+(a.y+a.h+60)+' '+(b.x+b.w/2)+' '+(b.y-60)+' '+(b.x+b.w/2)+' '+(b.y-1);
  }
  function route(a,b){
    var ay=a.y+a.h/2, by=b.y+b.h/2, g=7;
    if(Math.abs(a.x-b.x)<2){                                     /* same column: down the left gutter */
      return 'M'+a.x+' '+ay+'H'+(a.x-g)+'V'+by+'H'+(b.x-1);
    }
    if(b.x>a.x){                                                  /* forward: through the gap between columns */
      var mx=b.x-g-1;
      return 'M'+(a.x+a.w)+' '+ay+'H'+mx+'V'+by+'H'+(b.x-1);
    }
    var my=Math.max(a.y+a.h,b.y+b.h)+10;                           /* backward: under both */
    return 'M'+a.x+' '+ay+'H'+(a.x-g)+'V'+my+'H'+(b.x-g)+'V'+by+'H'+(b.x-1);
  }
  function linksSvg(){
    var L=M.links||[]; if(!L.length&&!(EDITING&&H.onLink)) return '';
    var out='<defs>'+['s','h'].map(function(k){
      return '<marker id="ncm'+k+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.6" markerHeight="3.6" markerUnits="strokeWidth" orient="auto">'+
             '<path d="M0 0L10 5L0 10z" fill="var(--lk,var(--steel))"/></marker>';}).join('')+'</defs>';
    [1,2,3].forEach(function(lv){
      if(lv===2&&!hasGroups()){ out+='<g class="g2"></g>'; return; }
      var seen={}, parts='';
      L.forEach(function(l,i){
        if(LINKMODE==='handoffs'&&!isHandoff(l)) return;
        var a=boxOf(l.from,lv), b=boxOf(l.to,lv); if(!a||!b||a.k===b.k) return;
        var ho=isHandoff(l), key=a.k+'>'+b.k;
        if(lv<3){ if(seen[key]){ seen[key].n++; if(ho) seen[key].ho=true; return; } seen[key]={n:1,ho:ho}; }
        var d=lv===3?route(a,b):curve(a,b);
        parts+='<path class="l'+(ho?' ho':'')+(l.alerts?' pn':'')+(l.sometimes&&lv===3?' some':'')+'" data-f="'+esc(l.from)+'" data-t="'+esc(l.to)+
               '" data-k="'+esc(key)+'" data-i="'+i+'" d="'+d+'" marker-end="url(#ncm'+(ho?'h':'s')+')"/>'+
               (l.sometimes?'':'<path class="fl'+(ho?' ho':'')+(l.alerts?' pn':'')+'" data-f="'+esc(l.from)+'" data-t="'+esc(l.to)+'" data-k="'+esc(key)+'" d="'+d+'"/>');
        if(lv===3&&EDITING&&H.onLinkClick) parts+='<path class="hit" data-li="'+i+'" d="'+d+'"><title>'+
               esc((M.cards[l.from]||{}).title)+' → '+esc((M.cards[l.to]||{}).title)+'</title></path>';
      });
      if(lv<3) parts=parts.replace(/data-k="([^"]*)"/g,function(m0,k){ var x=seen[k.replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"')];
        return m0+(x&&x.n>1?' style="stroke-width:calc('+Math.min(3.2,1.4+x.n*0.45).toFixed(1)+'px*var(--inv))"':''); });
      out+='<g class="g'+lv+'">'+parts+'</g>';
    });
    OUTER=(out.match(/class="g1">([\s\S]*?)<\/g>/)||['',''])[1].split('<path class="l').length-1;
    return out+'<path class="tmp" id="nctmp" d="" style="display:none"/>';
  }

  /* ── the rail and the heads: positioned from the measured geometry and the view ─────────── */
  function railHtml(){
    var h='';
    (M.rows||[]).forEach(function(row,i){
      var g=G.rows[row.id]; if(!g) return;
      if(row.divider&&G.divs[row.id]!=null)

  function headHtml(){
