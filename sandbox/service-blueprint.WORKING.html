        '" data-cx="'+g.x+'" data-cw="'+g.w+'" title="'+esc(c.label)+'">'+
        (c.tag?'<span class="t">'+esc(c.tag)+'</span>':'')+'<b>'+esc(c.label)+'</b>'+
        (c.sub?'<em>'+esc(c.sub)+'</em>':'')+
        '<span class="nc-pk'+(onSlide('c',c.id)?' on':'')+'" data-pk="c:'+esc(c.id)+'">'+TICK+'</span></div>';
    }).join('');
  }

  /* ── the view ─────────────────────────────────────────────────────────────────────────────── */
  function vp(){ var sc=HOST.querySelector('.nc-scroll');
    return {w:Math.max(80,sc.clientWidth-RAILW), h:Math.max(80,sc.clientHeight-HEADH)}; }
  function levelFor(s){ if(s>=0.78) return 3; if(s>=0.4&&hasGroups()) return 2; return s>=0.7&&!hasGroups()?3:1; }
  function place(){
    if(!G||!V) return;
    var world=HOST.querySelector('.nc-world'), s=V.s;
    world.style.transform='translate('+V.tx+'px,'+V.ty+'px) scale('+s+')';
    world.style.setProperty('--inv',(1/s).toFixed(4));
    var lv=levelFor(s);
    if(lv!==LV){ LV=lv; }
    var sc=HOST.querySelector('.nc-scroll');
    sc.classList.remove('nc-lv1','nc-lv2','nc-lv3'); sc.classList.add('nc-lv'+LV);
    HOST.querySelectorAll('.nc-rail').forEach(function(el){
      var y=+el.getAttribute('data-ry'), h=+el.getAttribute('data-rh');
      var top=V.ty+y*s, hh=h*s;
      el.style.top=top+'px'; el.style.height=Math.max(0,hh)+'px';
      el.classList.toggle('thin', hh<54);
      el.style.display=(top>sc.clientHeight||top+hh<-4||hh<9)?'none':'flex';
    });
    HOST.querySelectorAll('.nc-divl').forEach(function(el){
      var top=V.ty+(+el.getAttribute('data-divy'))*s-10; el.style.top=top+'px';
      el.style.display=(top<-20||top>sc.clientHeight)?'none':'block'; });
    var ar=HOST.querySelector('.nc-addrow');
    if(ar) ar.style.top=(V.ty+(+ar.getAttribute('data-ry'))*s+10)+'px';
    HOST.querySelectorAll('.nc-colh').forEach(function(el){
      var x=+el.getAttribute('data-cx'), w=+el.getAttribute('data-cw');
      el.style.left=(V.tx+x*s)+'px'; el.style.width=(w*s)+'px';
      el.classList.toggle('narrow', w*s<150);
    });
    if(LV<3) HOST.querySelectorAll(LV===1?'.nc-tile':'.nc-grp').forEach(function(el){
      var hs=(+el.getAttribute('data-h'))*s, ws=(+el.getAttribute('data-w'))*s;
      el.classList.toggle('xs', hs<40||ws<56); el.classList.toggle('sm', hs<72||ws<120); });
    var cb=HOST.querySelector('#ncall-links'); if(cb) cb.style.display=((OUTER>24||M.outerLinks==='hover')&&LV<3)?'':'none';
    var lb=HOST.querySelector('.nc-hint');
    if(lb) lb.innerHTML='Showing <b>'+esc(levelName(LV===2&&!hasGroups()?3:LV))+'</b> · '+Math.round(s*100)+'%'+
      ' &nbsp;·&nbsp; drag to move · '+(navigator.platform&&/Mac/.test(navigator.platform)?'⌘':'Ctrl')+' + scroll to zoom';
    var cl=HOST.querySelector('.nc-clip'), gs=26*s; while(gs<14) gs*=2; while(gs>52) gs/=2;
    cl.style.backgroundSize=gs+'px '+gs+'px'; cl.style.backgroundPosition=(V.tx%gs)+'px '+(V.ty%gs)+'px';
  }
  function clamp(){
    var p=vp(), s=V.s, W=G.W*s, Hh=G.H*s, m=60;
    V.tx=Math.min(m, Math.max(p.w-W-m, V.tx)); if(W<p.w) V.tx=Math.min(Math.max(V.tx,0), p.w-W);
    V.ty=Math.min(m, Math.max(p.h-Hh-m, V.ty)); if(Hh<p.h) V.ty=Math.min(Math.max(V.ty,0), p.h-Hh);
  }
  /* the camera glides between views when motion is on: centre and zoom are interpolated in
     log-space, so a zoom feels like flying in rather than a picture being stretched */
  function animTo(t, ms){
    if(ANIM){ cancelAnimationFrame(ANIM.raf); ANIM=null; }
    if(!MOTION||!V){ V=t; clamp(); place(); return; }
    var p=vp(), a={s:V.s, cx:(p.w/2-V.tx)/V.s, cy:(p.h/2-V.ty)/V.s},
        b={s:t.s, cx:(p.w/2-t.tx)/t.s, cy:(p.h/2-t.ty)/t.s}, t0=performance.now(), D=ms||560;
    function ease(x){ return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
    function step(now){
      var k=Math.min(1,(now-t0)/D), e=ease(k);
      var s=Math.exp(Math.log(a.s)+(Math.log(b.s)-Math.log(a.s))*e);
      var cx=a.cx+(b.cx-a.cx)*e, cy=a.cy+(b.cy-a.cy)*e;
      V={s:s, tx:p.w/2-cx*s, ty:p.h/2-cy*s}; place();
      if(k<1) ANIM={raf:requestAnimationFrame(step)}; else { ANIM=null; V=t; clamp(); place(); }
    }
    ANIM={raf:requestAnimationFrame(step)};
  }
  function stopAnim(){ if(ANIM){ cancelAnimationFrame(ANIM.raf); ANIM=null; } }
  function zoomAt(ns, ax, ay){
    ns=Math.max(ZMIN,Math.min(ZMAX,ns));
    var p=vp(); if(ax==null){ ax=p.w/2; ay=p.h/2; }
    V.tx=ax-(ax-V.tx)*ns/V.s; V.ty=ay-(ay-V.ty)*ns/V.s; V.s=ns; clamp(); place();
  }
  function fitView(){
    var p=vp(), s=Math.max(ZMIN,Math.min(1, (p.w-24)/G.W, (p.h-24)/G.H));
    return {s:s, tx:Math.max(12,(p.w-G.W*s)/2), ty:12};
  }
  function fit(animate){
    if(!G) return;
    if(animate&&V) animTo(fitView()); else { V=fitView(); place(); }
  }
  function rectView(b, minS, maxS){
    var p=vp(), s=Math.min(maxS||ZMAX, Math.max(minS||0, Math.min((p.w-60)/b.w, (p.h-60)/b.h)));
    var t={s:s, tx:p.w/2-(b.x+b.w/2)*s, ty:p.h/2-(b.y+b.h/2)*s};
    var keep=V; V=t; clamp(); t=V; V=keep; return t;
  }
  function zoomToRect(b, minS, maxS){ animTo(rectView(b, minS, maxS)); }
  function focusCard(id, ms){
    if(!G||!G.cards[id]) return; var b=G.cards[id];
    var s=Math.max(0.95, Math.min(1.1, V?V.s:1)), p=vp();
    var t={s:s, tx:p.w/2-(b.x+b.w/2)*s, ty:p.h/2-(b.y+b.h/2)*s};
    var keep=V; V=t; clamp(); t=V; V=keep||t; animTo(t, ms);
  }

  function zoomStep(f){
    var p=vp(), ns=Math.max(ZMIN,Math.min(ZMAX,V.s*f)), ax=p.w/2, ay=p.h/2;
    var t={s:ns, tx:ax-(ax-V.tx)*ns/V.s, ty:ay-(ay-V.ty)*ns/V.s};
    var keep=V; V=t; clamp(); t=V; V=keep; animTo(t, 360);
  }
  function setMotion(v){
    MOTION=!!v; try{ localStorage.setItem('nr_motion', MOTION?'1':'0'); }catch(_){}
    if(!HOST) return;
    HOST.querySelector('.nc-scroll').classList.toggle('nc-motion', MOTION);
    paintBar(); bind(); linkMode(); place();
  }

  /* ── RUN YOUR END-TO-END PROCESS ────────────────────────────────────────────────────────────
     A walk along the links: from the first activity nothing leads into, along the usual path
     (an "only sometimes" link is named, not taken), then whatever runs alongside it. The camera
     follows the work, a hand-off says who passed it on, and the pain points are read out where
     they sit. It reads the same links the map draws, so it can never tell a different story. */
  function rowOf(id){ var cb=G&&G.cards[id]; if(!cb) return null; var rid=cb.cell.split('|')[0];
    return (M.rows||[]).filter(function(r){ return r.id===rid; })[0]||null; }
  function runSteps(){
    var L=M.links||[], out={}, inn={}, order=[], pos={};
    L.forEach(function(l){ if(!M.cards[l.from]||!M.cards[l.to]) return;
      (out[l.from]=out[l.from]||[]).push(l); inn[l.to]=(inn[l.to]||0)+1; });
    (M.columns||[]).forEach(function(c){ (M.rows||[]).forEach(function(r){
      ((cell(r.id,c.id).cards)||[]).forEach(function(id){ pos[id]=order.length; order.push(id); }); }); });
    var seen={}, steps=[];
    function walk(id, via, aside){
      var first=true;
      while(id&&!seen[id]){
        seen[id]=1;
        var st={id:id, via:via, aside:aside&&first, branches:[]}; steps.push(st); first=false;
        var nx=(out[id]||[]).filter(function(l){ return !seen[l.to]; });
        var main=nx.filter(function(l){ return !l.sometimes; });
        var pick=(main.length?main:[]).sort(function(a,b){ return pos[a.to]-pos[b.to]; })[0];
        st.branches=(out[id]||[]).filter(function(l){ return l.sometimes; });
        if(!pick) break; via=pick; id=pick.to;
      }
    }
    var starts=order.filter(function(id){ return out[id]&&!inn[id]; });
    if(!starts.length){ var f=order.filter(function(id){ return out[id]; })[0]; if(f) starts=[f]; }
    starts.forEach(function(id,i){ walk(id,null,i>0); });
    for(var i=0;i<steps.length;i++) (out[steps[i].id]||[]).forEach(function(l){
      if(!l.sometimes&&!seen[l.to]) walk(l.to,l,true); });
    return steps;
  }
  function runButton(){
    var n=(M.links||[]).length?runSteps().length:0;
    var R=M.run||{}, sub=R.sub||('Follow the work from the first '+word('item',1)+' to the last, '+n+' moves across the map');
    if(TWIN){ var sr=HOST.querySelector('.nc-siderun');
      sr.innerHTML=n<2?'':'<button class="nc-runbtn"><span class="ic2">&#9654;</span><span><b>'+
        esc(R.title||'Run your end-to-end process')+'</b><small>'+esc(sub)+'</small></span></button>';
      return; }
    if(n<2) return;
    var c=HOST.querySelector('.nc-corner');
    c.classList.add('run');
    c.innerHTML='<button class="nc-runbtn" title="'+esc(R.sub||('Follow the work from the first '+word('item',1)+' to the last, '+n+' moves across the map'))+'">'+
      '<span class="ic2">&#9654;</span><b>'+esc(R.title||'Run your end-to-end process')+'</b></button>';
  }
  function runStart(){
    var steps=runSteps(); if(steps.length<2) return;
    closeDetail();
    RUN={steps:steps, i:0, playing:true, timer:null};
    HOST.querySelector('.nc-scroll').classList.add('nc-running');
    runGo(0);
  }
  function runStop(){
    if(!RUN) return; clearTimeout(RUN.timer); RUN=null;
    var sc=HOST.querySelector('.nc-scroll'); sc.classList.remove('nc-running');
    HOST.querySelectorAll('.nc-card.now,.nc-card.seen').forEach(function(c){ c.classList.remove('now','seen'); });
    HOST.querySelectorAll('.nc-lk path.run,.nc-lk path.runnow').forEach(function(p){ p.classList.remove('run','runnow'); });
  }
  function runPlay(on){
    if(!RUN) return; RUN.playing=!!on; clearTimeout(RUN.timer);
    var b=HOST.querySelector('[data-run="play"]'); if(b) b.textContent=on?'Pause':'Play';
    if(on){ if(RUN.i>=RUN.steps.length) runGo(0); else RUN.timer=setTimeout(function(){ runGo(RUN.i+1); }, 2900); }
  }
  function runPaint(){
    var R=RUN, steps=R.steps, i=R.i, done=i>=steps.length;
    HOST.querySelectorAll('.nc-card').forEach(function(c){ c.classList.remove('now','seen'); });
    HOST.querySelectorAll('.nc-lk path.run,.nc-lk path.runnow').forEach(function(p){ p.classList.remove('run','runnow'); });
    var lit={};
    steps.forEach(function(st,k){ if(k>i&&!done) return;
      var el=HOST.querySelector('.nc-card[data-card="'+cssq(st.id)+'"]');
      if(el) el.classList.add(k===i?'now':'seen');
      if(st.via) lit[(M.links||[]).indexOf(st.via)]=(k===i?'runnow':'run'); });
    HOST.querySelectorAll('.nc-lk .g3 path.l').forEach(function(p){
      var c=lit[+p.getAttribute('data-i')]; if(!c) return; p.classList.add('run');
      if(c==='runnow'){ try{ p.style.setProperty('--len', Math.ceil(p.getTotalLength())); }catch(_){}
        p.classList.add('runnow'); } });
  }
  function cssq(x){ return String(x).replace(/["\\]/g,'\\$&'); }
  function runGo(i){
    if(!RUN) return; var steps=RUN.steps; clearTimeout(RUN.timer);
    RUN.i=Math.max(0,Math.min(steps.length,i));
    var done=RUN.i>=steps.length, tour=HOST.querySelector('.nc-tour');
    var sn=tour.querySelector('.sn'), tx=tour.querySelector('.tx');
    tour.querySelector('.bar2 i').style.width=(100*Math.min(RUN.i+1,steps.length)/steps.length)+'%';
    if(done){
      var teams={}, ho=0, al=0, w=0, hw=false;
      steps.forEach(function(st){ var c=M.cards[st.id]; var r=rowOf(st.id); if(r) teams[r.id]=1;
        if(st.via&&isHandoff(st.via)) ho++; al+=(c.alerts||0); if(typeof c.weight==='number'){ w+=c.weight; hw=true; } });
      var nt=Object.keys(teams).length;
      sn.textContent='END';
      tx.innerHTML='<b>End to end: '+steps.length+' '+word('item',steps.length)+', '+nt+' team'+(nt===1?'':'s')+
        ', '+ho+' hand-off'+(ho===1?'':'s')+'</b><span class="who">'+(hw?rn(w)+' '+esc(unit())+' of work on the way · ':'')+
        al+' '+word('alert',al)+' along the path</span>';
      runPaint(); animTo(fitView(), 900); runPlay(false);
      var pb=HOST.querySelector('[data-run="play"]'); if(pb) pb.textContent='Replay';
      return;
    }
    var st=steps[RUN.i], c=M.cards[st.id]||{}, r=rowOf(st.id);
    sn.textContent=('0'+(RUN.i+1)).slice(-2)+' / '+('0'+steps.length).slice(-2);
    var info=H.runInfo?H.runInfo(st.id)||{}:{};
    var who=(c.meta||(r?r.label:''))+(typeof c.weight==='number'?' · '+rn(c.weight)+' '+unit():'');
    var line='';
    if(st.aside) line+='Runs alongside the main flow · ';
    if(st.via&&isHandoff(st.via)){ var fc=M.cards[st.via.from]||{}, fr=rowOf(st.via.from);
      line+='<span class="ho">Hand-off from '+esc(fc.meta||(fr?fr.label:'another team'))+'</span> · '; }
    var pains=(info.pains||[]).map(function(p){ return '<span class="pn">'+esc(p)+'</span>'; }).join('');
    var br=st.branches.map(function(l){ return '<span class="who">Only sometimes: goes on to '+esc((M.cards[l.to]||{}).title)+'</span>'; }).join('');
    tx.innerHTML='<b>'+esc(c.title)+'</b><span class="who">'+line+esc(who)+'</span>'+pains+br;
    runPaint(); focusCard(st.id, 700);
    if(RUN.playing){ var pb2=HOST.querySelector('[data-run="play"]'); if(pb2) pb2.textContent='Pause';
      RUN.timer=setTimeout(function(){ runGo(RUN.i+1); }, 2900+(pains?900:0)); }
  }

  /* ── drawing ──────────────────────────────────────────────────────────────────────────────── */
  function draw(){
    var cols=M.columns||[];
    paintBar();
    var sc=HOST.querySelector('.nc-scroll');
    HOST.classList.toggle('nc-light', LIGHT);
    sc.classList.toggle('nc-editing',EDITING); sc.classList.toggle('nc-canlink',!!H.onLink);
    var grid=HOST.querySelector('.nc-grid');
    grid.style.gridTemplateColumns='repeat('+cols.length+',minmax('+COLW+'px,max-content))';
    if(!STACK||!V) STACK=pickStack();
    grid.innerHTML=grid_safe();
    measure();
    overlays();
    var lk=HOST.querySelector('.nc-lk');
    lk.setAttribute('width',G.W); lk.setAttribute('height',G.H); lk.innerHTML=linksSvg();
    HOST.querySelector('.nc-railov').innerHTML=railHtml();
    HOST.querySelector('.nc-headov').innerHTML=headHtml();
    HOST.querySelector('.nc-corner').innerHTML=(M.cornerTitle?'<b>'+esc(M.cornerTitle)+'</b>':'')+
          (M.cornerSub?'<span>'+esc(M.cornerSub)+'</span>':'');
    HOST.querySelector('.nc-corner').classList.remove('run');
    var first=!V;
    if(!V) fit(); else { clamp(); place(); }
    sc.classList.toggle('nc-motion', MOTION);
    if(first&&MOTION&&!ENTERED){ ENTERED=true; sc.classList.add('nc-enter');
      setTimeout(function(){ sc.classList.remove('nc-enter'); }, 1900); }
    linkMode();
    runButton();
    if(RUN) runPaint();
    bind();
    pickbar();
  }
  /* a few connections are always drawn; past two dozen, zoomed out, they are drawn for the box
     you point at - the rest is a tangle that says nothing - and a chip shows them all */
  function linkMode(){
    var busy=OUTER>24||M.outerLinks==='hover', all=SHOWALL==null?!busy:SHOWALL, b=HOST.querySelector('#ncall-links');
    HOST.querySelector('.nc-scroll').classList.toggle('nc-hoverlinks', !all);
    if(b){ b.style.display=(busy&&LV<3)?'':'none'; b.classList.toggle('on',all);
      b.textContent=all?'All connections shown':'Show all connections';
      b.onclick=function(){ SHOWALL=!all; linkMode(); }; }
  }
  function grid_safe(){ try{ return grid(); }catch(e){ console.error(e); return ''; } }

  function bind(){
    HOST.querySelectorAll('.nc-chip[data-flag]').forEach(function(b){
      b.onclick=function(){ FILTER=b.getAttribute('data-flag')||null; draw(); };});
    var mo=HOST.querySelector('#ncmotion');
    if(mo) mo.onclick=function(){ setMotion(!MOTION); };
    HOST.querySelectorAll('[data-thm]').forEach(function(b){

  function setTheme(v){

    if(!HOST) return;
    HOST.classList.toggle('nc-light', LIGHT); paintBar(); bind(); linkMode();
  }

  /* one set of listeners per host, wired at mount: the grid inside is redrawn, the frame is not */
  function wire(){
    var sc=HOST.querySelector('.nc-scroll');
    function local(e){ var r=HOST.querySelector('.nc-clip').getBoundingClientRect();
      return {x:e.clientX-r.left, y:e.clientY-r.top}; }
    function worldPt(e){ var p=local(e); return {x:(p.x-V.tx)/V.s, y:(p.y-V.ty)/V.s}; }

    sc.addEventListener('pointerdown',function(e){
      if(e.button!==0) return;
      var hd=e.target.closest('.nc-hd');
      if(hd&&EDITING&&H.onLink){ e.preventDefault(); e.stopPropagation();
        LINKDRAG={from:hd.getAttribute('data-hd')}; sc.setPointerCapture(e.pointerId); return; }
      if(e.target.closest('button,.nc-pk,input,select,textarea,a,.nc-tour,.nc-zoomctl')) return;
      stopAnim(); DRAG={x:e.clientX,y:e.clientY,tx:V.tx,ty:V.ty,id:e.pointerId}; MOVED=false;
    });
    sc.addEventListener('pointermove',function(e){
      if(LINKDRAG){
        var a=G.cards[LINKDRAG.from], p=worldPt(e), t=HOST.querySelector('#nctmp');
        if(a&&t){ t.style.display=''; t.setAttribute('d','M'+(a.x+a.w)+' '+(a.y+a.h/2)+'L'+p.x+' '+p.y); }
        HOST.querySelectorAll('.droptarget').forEach(function(x){x.classList.remove('droptarget');});
        var el=document.elementFromPoint(e.clientX,e.clientY), c=el&&el.closest('.nc-card');
        if(c&&c.getAttribute('data-card')!==LINKDRAG.from) c.classList.add('droptarget');
        return; }
      if(!DRAG) return;
      var dx=e.clientX-DRAG.x, dy=e.clientY-DRAG.y;
      if(!MOVED&&Math.abs(dx)+Math.abs(dy)>4){ MOVED=true; sc.classList.add('grabbing');
        try{ sc.setPointerCapture(DRAG.id); }catch(_){} }
      if(MOVED){ V.tx=DRAG.tx+dx; V.ty=DRAG.ty+dy; clamp(); place(); }
    });
    function end(e){
      if(LINKDRAG){
        var el=document.elementFromPoint(e.clientX,e.clientY), c=el&&el.closest('.nc-card'), from=LINKDRAG.from;
        LINKDRAG=null; var t=HOST.querySelector('#nctmp'); if(t) t.style.display='none';
        HOST.querySelectorAll('.droptarget').forEach(function(x){x.classList.remove('droptarget');});
        MOVED=false;
        if(c&&c.getAttribute('data-card')!==from) H.onLink(from, c.getAttribute('data-card'));
        return; }
      DRAG=null; sc.classList.remove('grabbing');
    }
    sc.addEventListener('pointerup',end); sc.addEventListener('pointercancel',end);
    sc.addEventListener('wheel',function(e){
      e.preventDefault(); stopAnim();
      if(e.ctrlKey||e.metaKey){ var p=local(e); zoomAt(V.s*Math.pow(1.0018,-e.deltaY), p.x, p.y); }
      else { V.tx-=e.deltaX; V.ty-=e.deltaY; clamp(); place(); }
    },{passive:false});
    sc.addEventListener('dblclick',function(e){
      if(e.target.closest('.nc-card,button,.nc-rail,.nc-colh')) return;
      var p=local(e); zoomAt(V.s*1.6, p.x, p.y); });
    sc.addEventListener('mouseover',function(e){
      var bx=e.target.closest('.nc-tile,.nc-grp');
      if(bx&&LV<3){ var key=bx.getAttribute('data-key'), any2=false;
        HOST.querySelectorAll('.nc-lk .g'+LV+' path.l,.nc-lk .g'+LV+' path.fl').forEach(function(p){
          var k=p.getAttribute('data-k')||'', hot=k.indexOf(key+'>')===0||k.slice(-(key.length+1))==='>'+key;
          p.classList.toggle('hot',hot); if(hot) any2=true; });
        sc.classList.toggle('nc-focus',any2); return; }
      var c=e.target.closest('.nc-card'); if(!c||LV!==3) return;
      var id=c.getAttribute('data-card'), any=false;
      HOST.querySelectorAll('.nc-lk .g3 path.l,.nc-lk .g3 path.fl').forEach(function(p){
        var hot=p.getAttribute('data-f')===id||p.getAttribute('data-t')===id; p.classList.toggle('hot',hot); if(hot) any=true; });
      sc.classList.toggle('nc-focus',any);
    });
    sc.addEventListener('mouseout',function(e){
      var c=e.target.closest('.nc-card,.nc-tile,.nc-grp'); if(!c) return;
      if(e.relatedTarget&&c.contains(e.relatedTarget)) return;
      sc.classList.remove('nc-focus'); });

    /* clicks: one delegate, because the grid is redrawn on every edit */
    HOST.addEventListener('click',function(e){
      var t=e.target;
      var zc=t.closest('[data-zc]');
      if(zc){ var z=zc.getAttribute('data-zc');
        if(z==='fit') fit(true); else zoomStep(z==='in'?1.4:1/1.4); return; }
      var rb=t.closest('[data-run]');
      if(rb){ var a=rb.getAttribute('data-run');
        if(a==='next') runGo(RUN.i+1); else if(a==='prev') runGo(RUN.i-1);
        else if(a==='play') runPlay(!RUN.playing); else runStop(); return; }
      if(t.closest('.nc-runbtn')){ runStart(); return; }
      var ar=t.closest('[data-arr]');
      if(ar){ if(H.onArrange&&ar.getAttribute('data-arr')!==M.arrangement){ runStop(); H.onArrange(ar.getAttribute('data-arr')); } return; }
      var jp=t.closest('[data-jump]');
      if(jp&&G){ var q=jp.getAttribute('data-jump'), k=q.slice(0,1), id=q.slice(2);
        if(k==='c'&&G.cols[id]) zoomToRect({x:G.cols[id].x,y:0,w:G.cols[id].w,h:G.H}, 0.45, 1);
        if(k==='r'&&G.rows[id]) zoomToRect({x:0,y:G.rows[id].y,w:G.W,h:G.rows[id].h}, 0.45, 1);
        return; }
      var sa=t.closest('[data-sact]');
      if(sa){ var ix=sa.getAttribute('data-sact').split('.'), sec=(CHROME.side||[])[+ix[0]], act=sec&&sec.actions[+ix[1]];
        if(act&&act.onClick) act.onClick(); return; }
      if(MOVED){ MOVED=false; return; }
      var pk=t.closest('.nc-pk');
      if(pk){ e.stopPropagation();
        var v=pk.getAttribute('data-pk').split(':'), kind=v[0], id=v.slice(1).join(':');
        var s=M.slide=M.slide||{rows:[],cols:[]};
        var arr=kind==='r'?s.rows:s.cols, i=arr.indexOf(id);
        if(i>=0) arr.splice(i,1); else arr.push(id);
        if(H.onSlideChange) H.onSlideChange(s);
        draw(); return; }
      var mv=t.closest('[data-mv]');
      if(mv){ var q=mv.getAttribute('data-mv').split('|'); if(H.onMoveRow) H.onMoveRow(q[0], +q[1]); return; }
      if(t.closest('.nc-addrow')){ if(H.onAddRow) H.onAddRow(); return; }
      var hit=t.closest('path.hit');
      if(hit){ if(H.onLinkClick) H.onLinkClick((M.links||[])[+hit.getAttribute('data-li')]); return; }
      var plus=t.closest('.nc-plus');
      if(plus){ e.stopPropagation(); var a=plus.getAttribute('data-add').split('|'); H.onAdd(a[0],a[1]); return; }
      var tile=t.closest('.nc-tile');
      if(tile){ var b=G.cells[tile.getAttribute('data-zoom')];
        if(b) zoomToRect(b, hasGroups()?0.45:0.85, hasGroups()?0.7:ZMAX);
        return; }
      var grp=t.closest('.nc-grp');
      if(grp){ var cb=G.cards[grp.getAttribute('data-zoomcard')], gb=boxOf(grp.getAttribute('data-zoomcard'),2);
        if(gb) zoomToRect({x:gb.x-20,y:gb.y-20,w:gb.w+40,h:gb.h+40}, 0.9); return; }
      var card=t.closest('.nc-card');
      if(card){ var id=card.getAttribute('data-card');
        if(EDITING&&H.onCard) H.onCard(id); else openDetail(id); return; }
      var rail=t.closest('.nc-rail');
      if(rail){ var rid=rail.getAttribute('data-row');
        if(EDITING&&H.onRow&&e.altKey){ H.onRow(rid); return; }
        CLOSED[rid]=!CLOSED[rid]; draw(); return; }
      var ch=t.closest('.nc-colh');
      if(ch&&EDITING&&H.onColumn){ H.onColumn(ch.getAttribute('data-col')); return; }
    });
    if(!KEYS){ KEYS=true;
      window.addEventListener('keydown',function(e){
        if(!HOST||!document.body.contains(HOST)||!HOST.offsetParent) return;
        if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]')) return;
        if(document.getElementById('ncdp')&&document.getElementById('ncdp').classList.contains('on')) return;
        var k=e.key, st=60;
        if(RUN){ if(k==='ArrowRight'){ runGo(RUN.i+1); e.preventDefault(); return; }
                 if(k==='ArrowLeft'){ runGo(RUN.i-1); e.preventDefault(); return; }
                 if(k===' '){ runPlay(!RUN.playing); e.preventDefault(); return; }
                 if(k==='Escape'){ runStop(); return; } }
        if(k==='+'||k==='='){ zoomAt(V.s*1.25); } else if(k==='-'||k==='_'){ zoomAt(V.s/1.25); }
        else if(k==='0'){ fit(true); }
        else if(k==='ArrowLeft'){ V.tx+=st; clamp(); place(); } else if(k==='ArrowRight'){ V.tx-=st; clamp(); place(); }
        else if(k==='ArrowUp'){ V.ty+=st; clamp(); place(); } else if(k==='ArrowDown'){ V.ty-=st; clamp(); place(); }
        else return;
        e.preventDefault();
      });
      window.addEventListener('resize',function(){ if(HOST&&document.body.contains(HOST)&&V){ clamp(); place(); } });
    }
  }

  /* ── the slide picker ─────────────────────────────────────────────────────────────────────── */
  function pickbar(){
    var el=document.getElementById('ncbar'); if(!el) return;
    var s=M.slide||{rows:[],cols:[]};
    var n=0;
    (M.rows||[]).forEach(function(r){ if(s.rows.indexOf(r.id)<0) return;
      (M.columns||[]).forEach(function(c){ if(s.cols.indexOf(c.id)<0) return;
        n+=cardsOf(r.id,c.id).length; }); });
    var total=Object.keys(M.cards||{}).length;
    var warn=(H.slideWarnings?H.slideWarnings(s):[]).map(function(w){
      return '<span class="warn">'+w+'</span>';}).join('');

      ' and <b>'+s.rows.length+'</b> row'+(s.rows.length===1?'':'s')+' on the slide, holding <b>'+
      n+'</b> of '+total+'.'+warn;

        '<div id="ncbar"><div class="txt"></div>'+
        '<button class="nc-btn ghost" id="ncall">Everything</button>'+
        '<button class="nc-btn ghost" id="ncsug">What I would pick</button>'+
        '<button class="nc-btn" id="ncpv">Preview the slide</button>'+
        '<button class="nc-btn ghost" id="ncdone">Done</button></div>';
      while(f.firstChild) document.body.appendChild(f.firstChild);
      document.getElementById('ncov').onclick=closeDetail;
      window.addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeDetail();
        document.getElementById('ncprev').classList.remove('on'); }});
      document.getElementById('ncall').onclick=function(){
        M.slide={rows:(M.rows||[]).map(function(r){return r.id;}),
                 cols:(M.columns||[]).map(function(c){return c.id;})};
        if(H.onSlideChange) H.onSlideChange(M.slide); draw(); };
      document.getElementById('ncsug').onclick=function(){
        if(!H.suggestSlide) return;
        M.slide=H.suggestSlide();
        if(H.onSlideChange) H.onSlideChange(M.slide); draw(); };
      document.getElementById('ncpv').onclick=preview;
      document.getElementById('ncdone').onclick=function(){ setPicking(false); };
    }
    draw();
    /* a host that was not laid out yet (a hidden tab) measures zero: measure again once it is */
    if(!G||!G.W){ requestAnimationFrame(function(){ if(M&&HOST){ V=null; draw(); } }); }
  }

  /* Every entry point tolerates being called before mount(): an instrument switching views or
     toggling its lock has no reason to know whether the canvas happens to be on screen. */
  return {mount:mount,
          redraw:function(m, opts){ if(m) M=m; if(opts&&opts.refit){ V=null; STACK=null; ENTERED=false; }
                                    if(opts&&opts.chrome) CHROME=opts.chrome; if(M&&HOST) draw(); },
          show:function(on){ var t=HOST&&HOST.querySelector('.nc-twin'); if(t) t.classList.toggle('off',!on);
                             if(on&&M&&HOST){ V=V||null; draw(); } },
          setEditing:function(v){ EDITING=!!v; if(M&&HOST) draw(); },
          setPicking:function(v){ if(M&&HOST) setPicking(v); },
          isPicking:function(){return PICKING;},
          model:function(){return M;}, closeDetail:closeDetail,
          fit:function(){ if(M&&HOST) fit(); }, focus:function(id){ if(M&&HOST) focusCard(id); },
          view:function(){ return V?{s:V.s,tx:V.tx,ty:V.ty,level:LV}:null; },
          run:function(){ if(M&&HOST) runStart(); }, stopRun:function(){ if(M&&HOST) runStop(); },
          motion:function(v){ if(v===undefined) return MOTION; setMotion(v); },
          theme:function(v){ if(v===undefined) return LIGHT?'light':'dark'; setTheme(v==='light'); }};
})();
</script>

    if(onSlideRow('customer-action') || onSlideRow('feel')){
      ROWS.push('min-content');
      out += rail('Customer', 'What they do and how they feel', 'var(--ink)', 'nd');
      cols.forEach(function(c){ out += custCell(c); });
    }

    /* --- the rows of our own work --- */
    LANES.forEach(function(L){
      if(L.k==='customer-action') return;
      out = laneRow(L, out, ROWS);

    return '<div class="jb" style="grid-template-columns:'+grid+
           ';grid-template-rows:'+ROWS.join(' ')+'">'+out+'</div>';

  /* ── the small derivations the rows above read from ─────────────────────────────────────── */
  // the unit a column maps at: a KEY PROCESS where the team's work is sequenced into them,
  // otherwise the ACTIVITY BLOCK itself. ('phase'/'activity' are the pre-taxonomy spellings.)
  function atProcess(){ var u=WORLD.mappingUnit||DATA.mappingUnit; return u==='key process'||u==='phase'; }
  function unitWord(pl){ return atProcess() ? (pl?'Key processes':'Key process')
                                            : (pl?'Activity blocks':'Activity block'); }
  function unitsFor(stageId){
    var seen={}, out=[];
    steps.forEach(function(s){
      if((stageId===null ? !!s.stageId : s.stageId!==stageId)) return;
      if(s._rm) return;
      var n=s.unitName||s.blockId; if(!n||seen[n]) return;
      seen[n]=1; out.push(n);
    });
    return out;
  }
  function channelsAt(c){
    var seen={}, out=[];
    inCol(c).forEach(function(s){
      if(s._rm || !seenBy(s)) return;
      if(s.channel&&!seen[s.channel]){seen[s.channel]=1;out.push(s.channel);}
    });
    return out;
  }
  function systemsAt(c){
    var seen={}, out=[];
    inCol(c).forEach(function(s){
      if(s._rm) return;
      if(s.system&&!seen[s.system]){seen[s.system]=1;out.push(s.system);}
    });
    return out;
  }
  function painsAt(c){
    var out=[];
    inCol(c).forEach(function(s){ (s.pains||[]).forEach(function(p){ out.push(p); }); });
    return out;
  }
  /* the as-is pains, placed in the column their step sat in */
  function asPainsAt(c){
    return ASPAIN.filter(function(o){ return c===OFF ? !o.s.stageId : o.s.stageId===c; });
  }

       '<button class="dx" id="dlgx" aria-label="Close">&times;</button></div><div class="db">';
    h+='<div class="dfacts">'+
       '<div><i>Journey stage</i><span>'+esc(st?st.name:'Not on the journey')+'</span></div>'+
       '<div><i>'+esc(unitWord())+'</i><span>'+esc(s.unitName||s.blockId||'not recorded')+'</span></div>'+
       '<div><i>'+(ai?'Agent':'Performed by')+'</i><span>'+esc(actorName(s.actorId)||'not recorded')+'</span></div>'+
       '<div><i>'+(seenBy(s)?'Channel':'System')+'</i><span>'+
         esc(seenBy(s) ? (s.channel?chLabel(s.channel):'not recorded') : (s.system||'not recorded'))+'</span></div>'+
       '</div>';

/*<EDIT>*/
  /* ================= WORKING COPY (never shipped to a client) =================
     NO SERVER. The browser collects edits into a DELTA and exports it. The delta is applied by
     apply_delta.py, which runs the ONE gate (check_baseline.validate) and mints every ID. So the
     browser never validates, never mints an id, and never re-projects the baseline - it updates
     its own view optimistically and the truth is re-derived on apply.

     What this instrument owns is thin, and that is the point: the blueprint holds no steps of its
     own. It owns the JOURNEY (the columns), the VISIBILITY of each step (the lanes), and the
     mapping between them. Everything else on screen belongs to the operating baseline and is locked
     here, with a toast that says where the change is actually made.
     ========================================================================== */
  var DELTA=[], KM=null;
  EDIT = !!DATA.editable;

  var V = DATA.vocab || {};
  var UNITCOLL = (DATA.mappingUnit==='key process'||DATA.mappingUnit==='phase') ? 'processes' : 'activityBlocks';

  function esc2(x){return String(x==null?'':x);}
  function pushOp(op){ DELTA.push(op); wsave(); }

  /* ---- the refusal a consultant must SEE. A click that silently does nothing reads as a bug,
         so every locked region says why it is locked and where the change is really made. ---- */
  var _tt=null;
  function toast(m){

      '<b style="margin-top:7px">Good title checklist</b>Cover the slide with your hand: can the reader still tell how good or bad this team is? · the conclusion, not the topic · numbers only where they carry the claim · one verdict · two lines at most.</div>',
      '<span style="flex:1"></span><button class="wbtn" id="km_c">Cancel</button><button class="wbtn pri" id="km_ok">Apply</button>');
    var kmt=edp.querySelector('#f_km'), kmp=edp.querySelector('#km_prev');
    function prev(){ kmp.innerHTML=hl(kmt.value||''); }
    function grow(){ kmt.style.height='auto'; kmt.style.height=(kmt.scrollHeight+2)+'px'; }
    prev(); kmt.addEventListener('input',prev); kmt.addEventListener('input',grow); setTimeout(grow,10);
    edp.querySelector('#km_sg').onclick=function(){
      kmt.value=suggestTitle(); kmt.dispatchEvent(new Event('input',{bubbles:true})); kmt.focus(); };
    edp.querySelector('#km_hl').onclick=function(){
      var s=kmt.selectionStart, e2=kmt.selectionEnd, v=kmt.value;
      if(s===e2){ kmt.focus(); return; }
      var slice=v.slice(s,e2);
      if(/^\*\*[\s\S]*\*\*$/.test(slice)){ kmt.value=v.slice(0,s)+slice.slice(2,-2)+v.slice(e2); kmt.setSelectionRange(s,e2-4); }
      else { kmt.value=v.slice(0,s)+'**'+slice+'**'+v.slice(e2); kmt.setSelectionRange(s,e2+4); }
      kmt.dispatchEvent(new Event('input',{bubbles:true})); kmt.focus(); };
    edp.querySelector('#km_c').onclick=closeEd;
    edp.querySelector('#km_ok').onclick=function(){
      var km=kmt.value.trim();
      if(km!==(DATA.keyMessage||'')){ DATA.keyMessage=km; KM=km;
        document.getElementById('title').innerHTML=hl(km); }
      wsave(); closeEd(); };
  }

  /* ---- a STEP. The one question this instrument asks: does the customer see this happen? ---- */
  function stepById(id){ return steps.filter(function(s){return s.id===id;})[0]; }
  /* only a step the customer performs or sees has a channel - work they never meet has none */
  function SEEN(v){ return v==='customer-action' || v==='frontstage'; }
  function openStep(id){
    if(!ON) return;
    if(DATA.moment==='to-be'){
      toast('This is the <b>target service</b>. Its steps live in the to-be capture, not in the '+
            'process baseline, so they are changed there: ask Claude to change the design, then re-render.');
      return;
    }
    var s=stepById(id); if(!s) return;
    var a=actors[s.actorId]||{};
    var stage=stages.filter(function(x){return x.id===s.stageId;})[0];
    var mine=(s.actorId===DATA.teamActorId);
    // Who performs a step decides which lanes are even possible. The customer's own steps are
    // customer actions and nothing else; ours are never customer actions. Offering the impossible
    // option and refusing it afterwards is worse than not offering it at all.
    var isCust=(a.kind==='customer');
    var vocab = isCust ? LANEVOCAB.filter(function(L){return L.key==='customer-action';})
                       : LANEVOCAB.filter(function(L){return L.key!=='customer-action';});
    var body =
      sel('Does the customer see this happen?','f_vis',vocab,s.visibility||'',
          isCust?null:'— not classified yet —',
          '<span id="vishint">'+(LANEHINT[s.visibility]||'One question, and only one. Not “is it important”.')+'</span>')+
      (isCust?'<div class="lockchip" id="lk_vis">'+LOCK_SVG+'this step is the customer\u2019s own</div>':'')+
      '<div id="chwrap" class="'+(SEEN(s.visibility)?'':'hidden')+'">'+
        sel('What do they meet it through','f_ch',V.channels||[],s.channel||'','— not recorded —',
            'The channel is what the <b>customer touches</b>. The system below is what carries our '+
            'work. Answering the first with the second is the mistake these two fields keep apart.')+
      '</div>'+
      '<div class="f"><label>System that carries it</label><input id="f_sys" value="'+esc(s.system||'')+'" placeholder="e.g. Guidewire"></div>'+
      '<div class="metablock">'+
        '<div class="mrow"><span>Step</span><b>'+esc(s.name)+'</b></div>'+
        '<div class="mrow"><span>Performed by</span><b>'+esc(a.name||s.actorId||'—')+'</b></div>'+
        '<div class="mrow"><span>Journey stage</span><b>'+esc(stage?stage.name:'not on the journey')+'</b></div>'+
        '<div class="lockchip" id="lk_step">'+LOCK_SVG+'locked — these come from the baseline</div>'+
      '</div>'+
      // the deep dive: the tasks inside this activity. Read-only here - the process map and the
      // baseline own them; the blueprint only shows how deep the walkthrough went.
      ((s.tasks&&s.tasks.length)
        ? '<div class="metablock"><div class="mrow"><span>Tasks</span><b>'+s.tasks.length+'</b></div>'+
          '<ol class="bsteps">'+s.tasks.map(function(k){ return '<li>'+esc(k.name||'')+'</li>'; }).join('')+
          '</ol></div>'
        : '')+
      '<div class="addbox"><h6>Pain at this step</h6>'+
        (s.pains&&s.pains.length
          ? s.pains.map(function(p){ return '<div class="pn2">'+esc(p.theme)+
              (p.magnitude&&p.magnitude.value!=null?' <b>'+esc(magText(p.magnitude))+'</b>':
               '<span class="pn2m">not quantified</span>')+'</div>'; }).join('')
          : '<p class="fine">Nothing captured here yet.</p>')+
        '<button class="wbtn wide" id="f_addpain">Capture a pain point</button></div>';
    panelShell({cls:mine?'':'act', label:'Step'}, s.name,
      '<span class="id">'+esc(s.id)+'</span>'+(s.blockId?'<span class="id">'+esc(s.blockId)+'</span>':''),
      body, '<span style="flex:1"></span><button class="wbtn" id="s_c">Cancel</button><button class="wbtn pri" id="s_ok">Apply</button>');
    var vs=edp.querySelector('#f_vis');
    vs.addEventListener('change',function(){
      edp.querySelector('#vishint').innerHTML = LANEHINT[vs.value] || 'Unclassified is an honest answer; it shows as a question on the face.';
      // a step that moves behind the line of visibility loses its channel, because there is
      // nothing left for the customer to meet it through
      var w=edp.querySelector('#chwrap');
      if(w) w.classList.toggle('hidden', !SEEN(vs.value)); });
    var lv=edp.querySelector('#lk_vis');
    if(lv) lv.onclick=function(){
      toast('The customer performs this step, so it sits above the line of interaction and nowhere '+
            'else. Change who performs it on the process map if that is wrong.'); };
    edp.querySelector('#lk_step').onclick=function(){
      toast('A step’s name, who performs it and which activity it belongs to are the <b>operating baseline’s</b>. '+
            'Change them on the process map, then re-seed this blueprint.'); };
    edp.querySelector('#f_addpain').onclick=function(){ openPain(s); };
    edp.querySelector('#s_c').onclick=closeEd;
    edp.querySelector('#s_ok').onclick=function(){
      var v=vs.value, sy=edp.querySelector('#f_sys').value.trim()||null, ch={};
      var cf=edp.querySelector('#f_ch'), cv=(SEEN(v)&&cf)?(cf.value||null):null;
      if(v!==(s.visibility||'')) ch.visibility=v||null;
      if(sy!==(s.system||null)) ch.system=sy;
      if(cv!==(s.channel||null)) ch.channel=cv;
      if(Object.keys(ch).length){
        // unreachable through the dropdown above; kept because a lane that lies is the one
        // thing this instrument must never write
        if(ch.visibility==='customer-action' && !isCust){
          toast('This step is performed by <b>'+esc(a.name||'us')+'</b>, so it cannot be a customer '+
                'action. Add the customer\u2019s own step with <b>+</b> in the Customer lane instead.');
          return;
        }
        if(ch.visibility && ch.visibility!=='customer-action' && isCust){
          toast('This step is performed by the customer, so it stays above the line of interaction.');
          return;
        }
        Object.keys(ch).forEach(function(k){ s[k]=ch[k]; });
        pushOp({op:'update', coll:'activities', id:s.id, changes:ch});
        draw();
      }
      closeEd(); };
  }

  /* ---- a PAIN. It lands on the baseline like any other, with a dimension and a source. ---- */
  function openPain(s){
    if(!ON) return;
    panelShell({cls:'pain',label:'Pain point'}, 'What breaks here', esc(s.name),
      '<div class="f"><label>What hurts</label><textarea id="p_theme" placeholder="e.g. the customer hears nothing between sending photos and the settlement letter"></textarea></div>'+
      magField(null)+
      sel('Who feels it','p_dim',[{key:'cust',label:'The customer'},{key:'proc',label:'Only the operation'}],'cust',null,
          'The customer feels it → it reaches the Clients lens. Only we feel it → it stays a process pain.')+
      '<div class="f"><label>Who told you</label>'+
        '<input id="p_src" list="srclist" placeholder="e.g. Anne Vereecken, claims team lead, 14 Aug">'+
        '<datalist id="srclist">'+sourceVocab().map(function(x){
            return '<option value="'+esc(x.label)+'"></option>'; }).join('')+'</datalist>'+
        '<div class="hint">A name, in plain language. Every pain carries a source, or it is an '+
        'impression rather than a finding. <code>apply_delta.py</code> matches it to an existing '+
        'source or registers a new one — the browser never mints an id.</div></div>',
      '<span style="flex:1"></span><button class="wbtn" id="p_c">Cancel</button><button class="wbtn pri" id="p_ok">Capture</button>');
    edp.querySelector('#p_c').onclick=closeEd;
    edp.querySelector('#p_ok').onclick=function(){
      var th=edp.querySelector('#p_theme').value.trim();
      if(!th){ toast('A pain needs to say what hurts.'); return; }
      var src=edp.querySelector('#p_src').value.trim();
      if(!src){ toast('A pain without a source is an impression. Say who told you.'); return; }
      var mag=readMag(), rec={blockId:s.blockId||null, theme:th,
                              dimension:edp.querySelector('#p_dim').value, sourceLabel:src};
      if(mag) rec.magnitude=mag; else rec.magnitudeNote='not quantified';
      (s.pains=s.pains||[]).push({theme:th, magnitude:mag, dimension:rec.dimension});
      pushOp({op:'add', coll:'pains', record:rec});
      draw(); closeEd(); };
  }

  /* ---- a JOURNEY STAGE. The columns, in the customer's words. ---- */
  function openStage(id){
    if(!ON) return;
    var s=id?stages.filter(function(x){return x.id===id;})[0]:null;
    panelShell({cls:'',label:'Journey stage'}, s?s.name:'A new stage',
      s?'<span class="id">'+esc(s.id)+'</span>':'in the customer’s words, not ours',
      '<div class="f"><label>Stage name</label><input id="j_name" value="'+esc(s?s.name:'')+'" placeholder="e.g. Get it assessed"></div>'+
      '<div class="f"><label>What they are trying to do</label><textarea id="j_want" placeholder="e.g. I need to know what happens to my car.">'+esc(s&&s.want?s.want:'')+'</textarea>'+
        '<div class="hint">Their sentence, first person. It is what the Journey view puts under the stage name.</div></div>'+
      sel('How does the customer feel here','j_feel',V.sentiments||[],s?(s.sentiment||''):'','— not asked yet —',
          'Three readings, not a five-point scale: this instrument rates nothing. The note below '+
          'carries their own word for it.')+
      '<div class="f"><label>In their words</label><input id="j_note" value="'+esc(s&&s.sentimentNote?s.sentimentNote:'')+'" placeholder="e.g. Disconnected, hears nothing">'+
        '<div class="hint">Short. It is what the experience track prints under the dot.</div></div>'+
      '<div class="f"><label>Position</label><input id="j_order" type="number" min="1" step="1" value="'+esc(s?(s.order||''):(stages.length+1))+'"></div>'+
      (s?'':'<p class="fine">A new stage is minted by <code>apply_delta.py</code>; everything after it shifts along.</p>'),
      '<span style="flex:1"></span><button class="wbtn" id="j_c">Cancel</button><button class="wbtn pri" id="j_ok">'+(s?'Apply':'Add stage')+'</button>');
    edp.querySelector('#j_c').onclick=closeEd;
    edp.querySelector('#j_ok').onclick=function(){
      var nm=edp.querySelector('#j_name').value.trim();
      if(!nm){ toast('A journey stage needs a name the customer would recognise.'); return; }
      var want=edp.querySelector('#j_want').value.trim()||null;
      var ord=+edp.querySelector('#j_order').value||null;
      var feel=edp.querySelector('#j_feel').value||null;
      var note=edp.querySelector('#j_note').value.trim()||null;
      if(note && !feel){
        toast('You have their word for it but not whether it goes well or badly. The track is '+
              'drawn from that reading, so it needs both.');
        return;
      }
      if(s){
        var ch={};
        if(nm!==s.name) ch.name=nm;
        if(want!==(s.want||null)) ch.want=want;
        if(ord!==(s.order||null)) ch.order=ord;
        if(feel!==(s.sentiment||null)) ch.sentiment=feel;
        if(note!==(s.sentimentNote||null)) ch.sentimentNote=note;
        if(Object.keys(ch).length){
          Object.keys(ch).forEach(function(k){ s[k]=ch[k]; });
          pushOp({op:'update', coll:'journey', id:s.id, changes:ch});
          resort(); draw();
        }
      } else {
        // A LOCAL id so the view can draw it now. apply_delta mints the real one; this file is a
        // view, not the record, so the placeholder never leaves the browser except as a name.
        var tmp={id:'NEW'+(stages.length+1), name:nm, want:want, order:ord||stages.length+1,
                 sentiment:feel, sentimentNote:note, _new:true};
        stages.push(tmp);
        pushOp({op:'add', coll:'journey',
                record:{name:nm, want:want, order:tmp.order, sentiment:feel, sentimentNote:note}});
        resort(); draw();
      }
      closeEd(); };
  }

  /* ---- MAP THE WORK. A step's column comes from its unit, so the mapping is edited per unit,
         never per step - otherwise one click would silently move everything beside it. ---- */
  function unitsOf(){
    var seen={}, out=[];
    steps.forEach(function(s){
      var u = (UNITCOLL==='activityBlocks') ? s.blockId : (s.processId||s.blockId);
      if(!u || seen[u]) return;
      seen[u]=1;
      var mine=steps.filter(function(x){
        return ((UNITCOLL==='activityBlocks')?x.blockId:(x.processId||x.blockId))===u; });
      out.push({id:u, name:(s.unitName||u), n:mine.length, stageId:mine[0].stageId||''});
    });
    return out;
  }
  function openUnits(){
    if(!ON) return;
    var us=unitsOf();
    panelShell({cls:'act',label:'Mapping'}, 'Map the work onto the journey',
      esc(us.length)+' '+esc(unitWord(us.length!==1).toLowerCase())+' · a column each',
      us.map(function(u,i){
        return sel(u.name+'  ('+u.n+' step'+(u.n===1?'':'s')+')','u_'+i,stageVocab(),u.stageId,
                   '— not on the journey —');
      }).join('')+
      '<p class="fine">Work that maps to no stage sits in the trailing <b>Not on the journey</b> column. '+
      'That is a finding, not an error — ask why it exists before deciding it should not.</p>',
      '<span style="flex:1"></span><button class="wbtn" id="u_c">Cancel</button><button class="wbtn pri" id="u_ok">Apply</button>');
    edp.querySelector('#u_c').onclick=closeEd;
    edp.querySelector('#u_ok').onclick=function(){
      var n=0;
      us.forEach(function(u,i){
        var v=edp.querySelector('#u_'+i).value||null;
        if(v===(u.stageId||null)) return;
        steps.forEach(function(s){
          var su=(UNITCOLL==='activityBlocks')?s.blockId:(s.processId||s.blockId);
          if(su===u.id) s.stageId=v; });
        pushOp({op:'update', coll:UNITCOLL, id:u.id, changes:{journeyStageId:v}});
        n++;
      });
      if(n){ recount(); draw(); }
      closeEd(); };
  }

  /* ---- THE CUSTOMER'S OWN STEPS. The baseline never held them; surfacing them is half the job. */
  function customerActor(){
    var k=Object.keys(actors).filter(function(i){return (actors[i]||{}).kind==='customer';})[0];
    return k?{id:k,name:actors[k].name}:null;
  }
  function addCustomerStep(stageId){
    if(!ON) return;
    var cust=customerActor();
    var acts={}, order=[];
    steps.forEach(function(s){ if(s.blockId && !acts[s.blockId]){
      acts[s.blockId]=s.unitName||s.blockId; order.push(s.blockId); } });
    var actVocab=order.map(function(i){return {key:i,label:acts[i]};});
    var stg=stages.filter(function(x){return x.id===stageId;})[0];
    panelShell({cls:'new',label:'Customer step'}, 'What does the customer do here?',
      stg?esc(stg.name):'',
      '<div class="f"><label>The step, in their words</label><input id="c_name" placeholder="e.g. Sends photos and documents"></div>'+
      sel('What do they do it through','c_ch',V.channels||[],'','— not recorded —')+
      (cust
        ? '<div class="metablock"><div class="mrow"><span>Performed by</span><b>'+esc(cust.name)+'</b></div></div>'
        : '<div class="f"><label>Who is the customer</label><input id="c_who" placeholder="e.g. Policyholder">'+
          '<div class="hint">This baseline has no customer actor yet. Naming them here adds one (kind <code>customer</code>, no FTE).</div></div>')+
      sel('Part of which work','c_act',actVocab,null,'— pick the activity it belongs to —',
          'A step belongs to an activity, so the baseline knows where it sits. Pick the one the customer is dealing with.'),
      '<span style="flex:1"></span><button class="wbtn" id="c_c">Cancel</button><button class="wbtn pri" id="c_ok">Add step</button>');
    edp.querySelector('#c_c').onclick=closeEd;
    edp.querySelector('#c_ok').onclick=function(){
      var nm=edp.querySelector('#c_name').value.trim();
      if(!nm){ toast('The step needs a name.'); return; }
      var aid=edp.querySelector('#c_act').value;
      if(!aid){ toast('Pick the activity this step belongs to, so it lands somewhere on the baseline.'); return; }
      var who=cust?cust.name:(edp.querySelector('#c_who').value.trim());
      if(!who){ toast('Name the customer — the person on the other side of the line.'); return; }
      if(!cust){
        pushOp({op:'add', coll:'actors', record:{name:who, kind:'customer'}});
        actors['NEWCUST']={name:who, kind:'customer'};
      }
      var lid='NEWSTEP'+(steps.length+1);
      var cch=edp.querySelector('#c_ch').value||null;
      steps.push({id:lid, stageId:stageId||null, visibility:'customer-action', channel:cch,
                  actorId:cust?cust.id:'NEWCUST', name:nm, system:null, blockId:aid, pains:[], _new:true});
      pushOp({op:'add', coll:'activities',
              record:{blockId:aid, actorName:who, name:nm, visibility:'customer-action',
                      channel:cch}});
      recount(); draw(); closeEd(); };
  }

  /* ---- keeping the local view honest between edits ---- */
  function resort(){
    stages.sort(function(a,b){return (a.order||0)-(b.order||0);});
    recount();
  }
  function recount(){
    offSteps = steps.filter(function(s){return !s.stageId;});
    cols = stages.map(function(s){return s.id;});
    if(offSteps.length) cols.push(OFF);
    var c=DATA.coverage||(DATA.coverage={});
    c.tasksTotal=steps.length;
    c.classified=steps.filter(function(s){return s.visibility;}).length;
    c.customerActions=steps.filter(function(s){return s.visibility==='customer-action';}).length;
    var us=unitsOf();
    c.unitsMapped=us.filter(function(u){return u.stageId;}).length;
    c.unitsUnmapped=us.filter(function(u){return !u.stageId;}).length;
  }

  /* ---- what is editable announces itself; what is locked dims and explains itself ---- */
  var LOCKS = {
    stamp:'The coverage line is <b>computed</b> from the steps below it. Classify a step and it moves on its own.',
    off:'The <b>Not on the journey</b> column is derived: it holds work that maps to no stage. Use <b>Map work</b> to put it on one.',
    pains:'This view is the <b>same pains the process map holds</b>, ordered by journey stage. Capture a new one on the step it happens at, in the Blueprint view.',
    journey:'The Journey view is <b>read from the blueprint</b>. Edit the stage on its column in the Blueprint view.'
  };
  function bindLocks(root){
    (root||document).querySelectorAll('[data-lock]').forEach(function(el){
      el.classList.add('nr-locked');
      el.onclick=function(e){ e.stopPropagation(); toast(LOCKS[el.getAttribute('data-lock')]||'Locked.'); };
    });
  }
  function bindEdits(){
    if(!ON) return;
    document.querySelectorAll('#vinner [data-step]').forEach(function(el){
      el.classList.add('ed-on');
      el.onclick=function(e){ e.stopPropagation(); openStep(el.getAttribute('data-step')); };
    });
    document.querySelectorAll('#vinner [data-stage]').forEach(function(el){
      el.classList.add('ed-on');
      el.onclick=function(e){ e.stopPropagation(); openStage(el.getAttribute('data-stage')); };
    });
    document.querySelectorAll('#vinner [data-addcust]').forEach(function(el){
      el.onclick=function(e){ e.stopPropagation();
        var v=el.getAttribute('data-addcust'); addCustomerStep(v===OFF?null:v); };
    });
    var t=document.getElementById('title');
    if(t){ t.classList.add('ed-on'); t.onclick=openTitle; }
    bindLocks(document);
  }

  function setEditing(on){
    ON=!!on;
    document.getElementById('art').classList.toggle('editing',ON);
    /* the canvas is re-mounted by the draw() below, with `editing` passed in - telling the shell
       separately would just be a second source of truth */
    var g=document.getElementById('wgear');
    if(g) g.innerHTML = ON ? UNLOCK_SVG_I : GEAR_SVG_I;
    draw();
    wsave();
  }
  window.__setEditing=setEditing;


  /* ── THE CANVAS ────────────────────────────────────────────────────────────────────────────
     The working surface. The one-pager is not this, shrunk: it is the part of this that carries
     the argument, chosen in the picker below. Everything here is a projection of the same capture
     the client read-out renders from, so the two cannot disagree.
     The shell (NRCanvas) is shared and instrument-agnostic; what follows is the blueprint's own
     model, its hooks, and nothing else. */

  var CROWS = [
    {id:'feel',            kind:'track', icon:'feel',    label:'How the customer feels', sub:'At this stage, in their words'},
    {id:'customer-action', kind:'cards', icon:'journey', label:'Customer',            sub:'What they do',                  accent:'var(--accent)'},
    {id:'frontstage',      kind:'cards', icon:'front',   label:'Frontstage',          sub:'Our work the customer sees',    accent:'var(--rag-green)', divider:'line of interaction'},
    {id:'backstage',       kind:'cards', icon:'back',    label:'Backstage',           sub:'Our work the customer does not see', accent:'var(--steel)',     divider:'line of visibility'},
    {id:'support',         kind:'cards', icon:'support', label:'Support',             sub:'Other teams and systems behind it', accent:'var(--rag-na)'},
    {id:'',                kind:'cards', icon:'back',    label:'Not yet placed',      sub:'Nobody has asked if the customer sees it', accent:'var(--rag-amber)'}
  ];
  /* with agents in the work the people sit in the middle, an agent row either side of them */
  var CROWS_AGENT = [
    CROWS[0], CROWS[1],
    {id:'fagent', kind:'cards', icon:'front',   label:'Frontstage agent',   sub:'AI the customer deals with',              accent:'var(--agent)', divider:'line of interaction'},
    {id:'human',  kind:'cards', icon:'front',   label:'Our people',         sub:'Staff who take the decisions', accent:'var(--rag-green)'},
    {id:'bagent', kind:'cards', icon:'back',    label:'Backstage agent',    sub:'AI working behind the scenes',            accent:'var(--agent)', divider:'line of visibility'},
    CROWS[4], CROWS[5]
  ];
  var LANEACCENT={};
  CROWS.concat(CROWS_AGENT).forEach(function(r){ LANEACCENT[r.id]=r.accent; });

  function cardFlags(s){
    var f=[];
    if(!s.visibility) f.push('unclassified');
    if(s.visibility==='customer-action'||s.visibility==='frontstage'){
      f.push('seen');
      if(!s.channel) f.push('nochannel');
    }
    if((s.pains||[]).length) f.push('pain');
    return f;
  }
  function cardTags(s){
    var t=[];
    if(s.channel) t.push({text:chLabel(s.channel), kind:'ch'});
    if(s.system)  t.push({text:s.system, kind:'sys'});
    (s.pains||[]).forEach(function(p){
      t.push({text:(p.magnitude&&p.magnitude.value!=null)?magText(p.magnitude):'pain', kind:'pain'});});
    if(!s.visibility) t.push({text:'not classified', kind:'warn'});
    return t;
  }

  function canvasModel(){
    var m={columns:[],rows:[],cells:{},cards:{},
           cornerTitle:'Journey stage', cornerSub:unitWord(true)+' mapped onto it',
           filters:[
             {k:'all',   label:'Everything',      flag:null},
             {k:'unc',   label:'Not yet placed',  flag:'unclassified'},
             {k:'seen',  label:'What the customer sees', flag:'seen'},
             {k:'pain',  label:'Pain points',     flag:'pain'},
             {k:'noch',  label:'No channel yet',  flag:'nochannel'}
           ],
           slide: DATA.slide || defaultSlide()};
    stages.forEach(function(s){
      m.columns.push({id:s.id, kind:'normal', tag:'STAGE '+(s.order||''), label:s.name,
                      sub:unitsFor(s.id).join(' · ')||'no '+unitWord().toLowerCase()+' maps here'});
    });
    if(offSteps.length) m.columns.push({id:OFF, kind:'off', label:'Not on the journey',
                                        sub:unitsFor(null).join(' · ')});

    /* only the teams doing OUR work: with one team, its name on every card says nothing the rail
       has not already said */
    var ours={};
    steps.forEach(function(s){ if(s.actorId && (actors[s.actorId]||{}).kind!=='customer') ours[s.actorId]=1; });
    var named=Object.keys(ours).length>1;

    (AGENTS?CROWS_AGENT:CROWS).forEach(function(r){
      var any=false;
      m.columns.forEach(function(c){
        var key=r.id+'|'+c.id;
        if(r.kind==='track'){
          if(c.kind==='off') return;
          var st=stages.filter(function(x){return x.id===c.id;})[0]||{};
          if(st.sentiment){ any=true;
            m.cells[key]={track:{tone:st.sentiment, label:st.sentimentNote||''}}; }
          return;
        }
        /* a step the to-be removes is shown struck through on the read-out; the canvas holds
           only the service being worked on */
        var list=atLane(c.id,r.id).filter(function(s){ return !s._rm; });
        if(!list.length) return;
        any=true;
        m.cells[key]={cards:list.map(function(s){
          m.cards[s.id]={title:s.name,
                         meta:(named&&r.id!=='customer-action')?actorName(s.actorId):null,
                         accent:LANEACCENT[r.id], flags:cardFlags(s), tags:cardTags(s)};
          return s.id; })};
      });
      if(!any) return;
      var n=m.columns.reduce(function(a,c){return a+((m.cells[r.id+'|'+c.id]||{}).cards||[]).length;},0);
      m.rows.push(Object.assign({}, r, {count:r.kind==='track'?null:n}));
    });
    /* a divider belongs to the first row actually drawn under it, not to a row that was skipped */
    var seen={};
    m.rows.forEach(function(r){
      if(!r.divider) return;
      if(seen[r.divider]) { r.divider=null; return; }
      seen[r.divider]=1;
    });
    return m;
  }

  /* the deterministic starting pick: every column the customer reaches, the rows that carry the
     finding. Composed from what the data says, never a guess. */
  function defaultSlide(){
    var rows=AGENTS ? ['feel','customer-action','fagent','human','bagent']
                    : ['feel','customer-action','frontstage','backstage'];
    if(steps.some(function(s){return s.visibility==='support';})) rows.push('support');
    if(steps.some(function(s){return !s.visibility;})) rows.push('');
    return {rows:rows, cols:stages.map(function(s){return s.id;}).concat(offSteps.length?[OFF]:[])};
  }

  var CHOOKS={
    onCard:   function(id){ openStep(id); },
    onColumn: function(id){ if(id!==OFF) openStage(id);
                            else toast('The <b>Not on the journey</b> column is derived: it holds work '+
                                       'that maps to no stage. Use <b>Map work</b> to put it on one.'); },
    onAdd:    function(rowId,colId){ addCustomerStep(colId===OFF?null:colId); },
    canAdd:   function(rowId){ return rowId==='customer-action'; },
    detail:   function(id){
      var s=stepById(id); if(!s) return null;
      var r=CROWS.filter(function(x){return x.id===(s.visibility||'');})[0]||{label:'Not yet placed'};
      var st=stages.filter(function(x){return x.id===s.stageId;})[0];
      return {kind:r.label, title:s.name, id:s.id+(s.blockId?' · '+s.blockId:''),
        rows:[
          {k:'Journey stage', v:st?st.name:'not on the journey'},
          {k:'Performed by',  v:actorName(s.actorId)},
          {k:'The customer',  v:s.visibility==='customer-action'?'does this themselves':
                               s.visibility==='frontstage'?'sees this happen':
                               s.visibility?'never sees this':'has not been asked'},
          {k:'They meet it through', v:s.channel?chLabel(s.channel):'—'},
          {k:'Carried by',    v:s.system||'—'},
          {k:'Part of',       v:s.unitName||s.blockId||'—'}
        ],
        notesTitle:'Pain points', notesEmpty:'Nothing captured at this step.',
        notes:(s.pains||[]).map(function(p){
          return {body:p.theme, tone:'negative',
                  strong:(p.magnitude&&p.magnitude.value!=null)?magText(p.magnitude):'',
                  meta:(p.dimension==='cust'?'the customer feels it':'only the operation feels it')+
                       (p.sourceId?' · '+p.sourceId:'')};})};
    },
    suggestSlide: defaultSlide,
    onSlideChange: function(s){ DATA.slide=s; SLIDE=s; wsave(); },
    slideWarnings: function(s){
      var w=[], real=s.cols.filter(function(c){return c!==OFF;});
      if(real.length>5) w.push('Past five columns the text on the slide drops below 11px. '+
                               'Consider splitting the journey across two slides.');
      if(s.rows.indexOf('customer-action')<0) w.push('Without the customer row it is a process map, '+
                               'not a service blueprint.');
      if(s.rows.length&&!s.cols.length) w.push('No columns picked, so there is no slide to render.');
      return w;
    }
  };

  var SLIDE=null;
  function drawCanvas(){
    NRCanvas.mount({model:canvasModel(), hooks:CHOOKS,
                    host:document.getElementById('canvashost'), editing:ON});
  }

  /* ---- the two hoisted stubs the shared render path calls, now given their real bodies ---- */
  PLUSBTN = function(stageId){
    if(!ON) return '';        // locked means locked: not drawn, not hidden-but-clickable
    return '<button class="cellplus" data-addcust="'+esc(stageId==null?OFF:stageId)+'"'+
           ' title="Add a step the customer performs here">+</button>';
  };
  BINDEDITS = function(){
    if(cur==='canvas'){ drawCanvas(); return; }   /* the shell binds its own affordances */
    bindEdits();
  };

  function bootEdit(){
    if(!EDIT) return;
    /* The canvas is the working copy's first view and its default: this is where the work is done.
       The other three are the client read-out, shown here so you can see what you are about to
       hand over without leaving the file.
       This runs in bootEdit rather than at load because `var VIEWS` is hoisted but its VALUE is
       not - the edit layer is spliced in above the line that fills it. */
    VIEWS.unshift(['canvas','Canvas',function(){ return '<div id="canvashost"></div>'; }]);
    cur='canvas';
    document.getElementById('views').innerHTML = VIEWS.map(function(v,i){
      return '<button data-v="'+v[0]+'"'+(i===0?' class="on"':'')+'>'+v[1]+'</button>';}).join('');
    seg('views','data-v',function(v){ cur=v; draw(); });
    var g=document.getElementById('wgear'), b=document.getElementById('wsave'),
        pop=document.getElementById('wpop'), grp=document.querySelector('.wgrp');
    if(g) g.onclick=function(e){ e.stopPropagation(); setEditing(!ON); };
    if(b) b.onclick=exportDelta;
    if(pop) pop.onclick=function(e){ e.stopPropagation(); };
    if(grp) grp.onclick=function(e){ e.stopPropagation(); };
    var pk=document.getElementById('wpick');
    if(pk) pk.onclick=function(){
      if(cur!=='canvas'){ toast('The picker lives on the <b>Canvas</b>, where you can see what you '+
                                'are choosing between.'); return; }
      NRCanvas.setPicking(!NRCanvas.isPicking());
      pk.textContent=NRCanvas.isPicking()?'Back to the canvas':'Pick what goes on the slide'; };
    var mw=document.getElementById('wmap');
    if(mw) mw.onclick=function(){ ON ? openUnits() : toast('Unlock editing first — the padlock, top right.'); };
    var ms=document.getElementById('wstage');
    if(ms) ms.onclick=function(){ ON ? openStage(null) : toast('Unlock editing first — the padlock, top right.'); };
    window.addEventListener('keydown',function(e){ if(e.key==='Escape') closeEd(); });
    setEditing(false);
  }
/*</EDIT>*/


  var VIEWS=[['bp','Blueprint',vBlueprint],['journey','Journey',vJourney],['pains','Pain points',vPains]];
  var cur='bp';

  document.getElementById('ctx').textContent  = DATA.context||'OPEX QUICKSCAN';
  document.getElementById('lens').textContent = DATA.lens||'CLIENTS · SERVICE BLUEPRINT';
  function drawHead(){
    document.getElementById('title').innerHTML  = hl(WORLD.keyMessage||DATA.keyMessage||'');
    document.getElementById('subt').textContent = WORLD.teamName||DATA.teamName||'';
  }
  document.getElementById('views').innerHTML  = VIEWS.map(function(v,i){
    return '<button data-v="'+v[0]+'"'+(i===0?' class="on"':'')+'>'+v[1]+'</button>';}).join('');

  function drawMeta(){
    var c = WORLD.coverage||{}, src = WORLD.source||(WORLD===DATA?'':DATA.source);
    document.getElementById('src').innerHTML = src
      ? '<b style="color:var(--txt)">Source:</b> '+esc(src) : '';
    var bits=[], unit=unitWord().toLowerCase();
    if(MOMENT==='tobe' && WORLD===DATA){
      /* a target service has no baseline stamp: it says what it changes */
      var nAg=steps.filter(function(s){ return isAgent(s) && !s._rm; }).length,
          nRm=steps.filter(function(s){ return s._rm; }).length,
          nFx=ASPAIN.filter(function(o){ return FIXED[o.p.id]; }).length;
      bits.push('To-be');
      if(nAg) bits.push(nAg+' step'+(nAg>1?'s':'')+' done by AI');
      if(nRm) bits.push(nRm+' step'+(nRm>1?'s':'')+' removed');
      if(ASPAIN.length) bits.push(nFx+' of '+ASPAIN.length+' pain points fixed');
    } else {
    if(WORLD.baselineVersion) bits.push(WORLD.baselineVersion);
    if(c.tasksTotal) bits.push(c.classified===c.tasksTotal ? c.tasksTotal+' steps mapped'
                                : (c.tasksTotal-c.classified)+' of '+c.tasksTotal+' steps not yet placed');
    if(c.unitsUnmapped) bits.push(c.unitsUnmapped+' '+unit+(c.unitsUnmapped>1?'s':'')+' not on the journey');
    }
    if(SEL && SEL.cols && SEL.cols.length < allCols.length)
      bits.push(SEL.cols.length+' of '+allCols.length+' stages shown');
    var stel=document.getElementById('stamp');
    stel.textContent = bits.join(' · ');
    if(EDIT) stel.setAttribute('data-lock','stamp');
    /* the legend belongs to the blueprint; the other views carry their own meaning */
    var anyPain=steps.some(function(x){ return !x._rm && painsOf(x).length; }),
        anyOpen=steps.some(function(x){ return !x._rm && openPainsOn(x).length; });
    document.getElementById('lg').innerHTML = (cur==='bp')
      ? (stages.some(function(s){return s.sentiment;})
          ? '<span class="lp">Customer feels</span>'+
            '<span class="lp"><i style="background:var(--rag-green)"></i>good</span>'+
            '<span class="lp"><i style="background:var(--rag-na)"></i>neutral</span>'+
            '<span class="lp"><i style="background:var(--rag-red)"></i>bad</span>' : '')+
        (AGENTS ? '<span class="lp"><span class="aitag">AI</span>done by an AI agent</span>' : '')+
        (anyPain ? '<span class="lp"><span class="mk bad">!</span>pain point</span>' : '')+
        (Object.keys(FIXED).length ? '<span class="lp"><span class="mk ok">'+CHECK+'</span>fixes a pain point</span>' : '')+
        (anyOpen ? '<span class="lp"><span class="mk open">!</span>pain point not fixed yet</span>' : '')+
        '<span class="lp">Click a card for more detail</span>'
      : '';
  }

  /* Monotonic binary-search fit: the largest scale whose content still fits the frame, capped at
     1.0 so a short view fills rather than magnifies. Same fit every instrument uses. */
  function fit(){
    var view=document.getElementById('view'), inner=document.getElementById('vinner');
    inner.style.transform='scale(1)'; inner.style.width='100%';
    var prev=inner.querySelector('[data-stretch]');
    if(prev) prev.style.minHeight='';          /* measure unstretched, or it only ever grows */
    var availH=view.clientHeight, availW=view.clientWidth;
    if(!availH||!availW) return;
    var lo=0.4, hi=1.0*nrZ(), best=0.4;
    for(var i=0;i<18;i++){
      var mid=(lo+hi)/2;
      inner.style.width=(100/mid)+'%';
      inner.style.transform='scale('+mid+')';
      var fits = inner.scrollHeight*mid <= availH+0.5;
      if(fits){ best=mid; lo=mid; } else { hi=mid; }
    }
    inner.style.width=(100/best)+'%';
    inner.style.transform='scale('+best+')';
    /* the fit is capped at 1.0 so a short view never magnifies - so a short view also never
       fills the slide. Let the marked element take the slack instead. */
    var grow=inner.querySelector('[data-stretch]');
    if(grow && best>=0.999){
      var slack = availH/best - inner.scrollHeight;
      if(slack > 6) grow.style.minHeight = (grow.offsetHeight + slack) + 'px';
    }
  }
  function draw(){
    var v=VIEWS.filter(function(x){return x[0]===cur;})[0];
    document.getElementById('art').classList.toggle('canvasview', cur==='canvas');
    document.getElementById('vinner').innerHTML = v ? v[2]() : '';
    drawHead(); drawMeta(); bindCards(); BINDEDITS();
    /* the canvas SCROLLS; scaling it to fit the frame is exactly the thing it exists to stop */
    if(cur!=='canvas'){ fit(); }
    else { var vi=document.getElementById('vinner');
           vi.style.transform='none'; vi.style.width='100%'; }
  }
  function seg(id,attr,cb){
    var box=document.getElementById(id);
    box.querySelectorAll('button').forEach(function(b){
      b.onclick=function(){
        box.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
        b.classList.add('on'); cb(b.getAttribute(attr));
      };
    });
  }
  seg('views','data-v',function(v){ cur=v; draw(); });
  (function(){
    var box=document.getElementById('moment');
    if(!ASIS || EDIT || !box) return;
    box.innerHTML='<button data-m="asis">As-is</button><button data-m="tobe" class="on">To-be</button>';
    box.style.display='';
    seg('moment','data-m',function(m){ MOMENT=m; setWorld(m==='asis'?ASIS:DATA); draw(); });
  })();
  seg('theme','data-s',function(t){ document.getElementById('art').setAttribute('data-t',t); fit(); });
  window.addEventListener('resize',fit);
  draw();
/*<EDIT>*/
  bootEdit();
/*</EDIT>*/

})();
</script>
<script>
/* ── fitChrome() — the chrome stacks when it does not fit ────────────────────
   Measures the one-row layout and adds .stacked to the artifact root when any of
   six things is true: the two groups are closer than 12px · a control runs past
   either edge · a label has been squeezed narrower than its own text · the
   toprow wraps · the toprow comes within 6px of the action title · the viewport
   is at or below 760px (the floor). Exposed as window.fitChrome() so a render
   pass can call it after it changes a label. ── */
(function(){
  var busy=false,lastW=-1;
  function root(){return document.querySelector('#art,#pm,#pw');}
  function skip(e){
    if(!e) return true;
    if(e.id==='wpop'||(e.closest&&e.closest('#wpop'))) return true;
    var cs=getComputedStyle(e);
    if(cs.visibility==='hidden'||cs.display==='none') return true;
    return false;
  }
  function fitChrome(){
    if(busy) return; busy=true;
    try{
      var R=root(); if(!R) return;
      var tr=R.querySelector('.toprow'); if(!tr) return;
      R.classList.remove('stacked');
      void tr.offsetWidth;                                  /* force the reflow we measure */
      var need=window.innerWidth<=760, i, r, e;
      var trb=tr.getBoundingClientRect();
      /* 1. the two groups are closer than 12px */
      var tags=R.querySelector('.tags'), ctrls=R.querySelector('.ctrls');
      if(!need&&tags&&ctrls&&!skip(tags)&&!skip(ctrls)){
        var a=tags.getBoundingClientRect(), b=ctrls.getBoundingClientRect();
        if(b.left-a.right<12) need=true;
      }
      /* 2. a control runs past either edge */
      if(!need){
        var kids=tr.querySelectorAll('.nr-pill,.nr-track,.seg,.wgrp,button,#wnote');
        for(i=0;i<kids.length;i++){
          e=kids[i]; if(skip(e)) continue;
          r=e.getBoundingClientRect(); if(!r.width&&!r.height) continue;
          if(r.right>trb.right+0.5||r.left<trb.left-0.5){need=true;break;}
        }
      }
      /* 3. a label has been squeezed narrower than its own text */
      if(!need){
        var ls=tr.querySelectorAll('.nr-pill b,.nr-track,.seg button,button,#wnote,span');
        for(i=0;i<ls.length;i++){
          e=ls[i]; if(skip(e)) continue;
          if(!e.textContent||!e.textContent.trim()) continue;
          if(e.scrollWidth>e.clientWidth+1){need=true;break;}
        }
      }
      /* 4. the toprow wraps — a floating row that wraps grows downwards into the
         title without pushing anything down */
      if(!need){
        var tall=0,ch=tr.children;
        for(i=0;i<ch.length;i++){var h=ch[i].getBoundingClientRect().height;if(h>tall)tall=h;}
        if(trb.height>tall+2) need=true;
      }
      /* 5. the toprow sits on, or within 6px of, the action title */
      if(!need){
        var t=R.querySelector('.nr-strip'); if(!t||skip(t)) t=R.querySelector('h1');
        if(t&&!skip(t)){var tb=t.getBoundingClientRect(); if(tb.top-trb.bottom<6) need=true;}
      }
      if(need) R.classList.add('stacked');
      /* --padl is read AFTER the class lands: the class itself changes the padding */
      R.style.setProperty('--padl',(parseFloat(getComputedStyle(R).paddingLeft)||0)+'px');
    } finally { busy=false; }
  }
  window.fitChrome=fitChrome;
  function kick(){requestAnimationFrame(fitChrome);}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',kick); else kick();
  window.addEventListener('load',kick);
  window.addEventListener('resize',function(){lastW=-1;kick();});
  if(window.ResizeObserver){
    var ro=new ResizeObserver(function(en){
      var w=en&&en[0]?Math.round(en[0].contentRect.width):-1;
      if(w===lastW) return;                                 /* stacking must not re-trigger us */
      lastW=w; kick();
    });
    var r0=root(); if(r0) ro.observe(r0);
  }
})();
</script>
<script id="nr-topbar-js">
/* patch_topbar.py: one theme switch and the way home, the same in every instrument.
   Theme: the choice is kept under the cockpit's key, nr_dark, so every page of an
   engagement opens the same way. Home: a page that carries
   <meta name="nr-home" content="index.html"> (the engagement artifact adds it) gets
   "< Cockpit /" in front of its section tag. */
(function(){
  var K='nr_dark', box=document.getElementById('theme')||document.getElementById('tseg');
  if(box){
    box.querySelectorAll('button').forEach(function(b){ var d=b.getAttribute('data-s')==='dark';
      b.title=d?'Dark mode':'Light mode'; b.setAttribute('aria-label',b.title);
      b.addEventListener('click',function(){ try{ localStorage.setItem(K,d?'1':'0'); }catch(e){} }); });
    var v=null; try{ v=localStorage.getItem(K); }catch(e){}
    var dk=box.querySelector('button[data-s="dark"]');
    if(v==='1'&&dk&&!dk.classList.contains('on')) dk.click();
  }
  var m=document.querySelector('meta[name="nr-home"]'), lens=document.getElementById('lens')||document.querySelector('.toprow .nr-track');
  if(m&&lens&&!document.querySelector('.nr-crumb')){
    var c=document.createElement('div'); c.className='nr-track nr-crumb';
    var a=document.createElement('a'); a.className='nr-home'; a.href=m.getAttribute('content')||'index.html';
    a.textContent='\u2039 '+(m.getAttribute('data-label')||'Cockpit'); a.title='Back to the engagement cockpit';
    /* opened in a window of the findings dashboard (a frame of our own page): go back in that page, not in the frame */
    try{ if(window.parent!==window&&window.parent.document) a.target='_parent'; }catch(e){}
    var s=document.createElement('span'); s.className='nr-sep'; s.textContent='/';
    lens.parentNode.insertBefore(c,lens); c.appendChild(a); c.appendChild(s); c.appendChild(lens);
    if(window.fitChrome) requestAnimationFrame(window.fitChrome);
  }
})();
</script>
<style>
/* ── READ MODE · narrow screens ──────────────────────────────────────────────
   This artifact normally scales its whole body down so the page fits one screen.
   On a phone that turns 13px type into 4px. Below 760px the scaling is switched
   off and the page simply flows and scrolls at its real size. Desktop is
   untouched — every rule here lives inside the media query. */
@media (max-width:760px){
  html,body{height:auto!important;overflow:auto!important}
  #art,#pw,#pm{height:auto!important;min-height:0!important;max-height:none!important;
    overflow:visible!important;padding:12px 14px 22px 34px!important}
  #view{height:auto!important;min-height:0!important;max-height:none!important;
    overflow:visible!important;flex:none!important;position:static!important}
  #vinner{position:static!important;transform:none!important;width:100%!important;
    padding-bottom:14px!important}
  .nr-rail{width:22px!important}
  .toprow{position:static!important;top:auto!important;right:auto!important;left:auto!important;
    margin:0 0 10px!important;flex-wrap:wrap!important;gap:8px 10px!important;justify-content:flex-start!important}
  .tags{flex-wrap:wrap!important;gap:8px!important;margin-left:-34px!important}
  .ctrls{flex-wrap:wrap!important;gap:8px!important;flex:1 1 100%!important}
  #ft{position:static!important;flex-wrap:wrap!important;row-gap:6px!important;margin-top:14px!important}
  h1{font-size:19px!important;max-width:none!important}
  .grid,.classic,.cols-grid{grid-template-columns:1fr!important}
  table{min-width:0!important}
  .tbl-wrap,.wrap-x{overflow-x:auto!important}
}
</style>
<style>/* READ-MODE TYPE FLOOR — nothing under 11px once the page stops scaling */

@media (max-width:760px){
  #ft{font-size:11px!important}
  .conf,.lp,.li,.nr-track,.nr-foot,.lbl,.note{font-size:11px!important}
  .inum,.chip,.inev,.num,.wf-num,.vnum{font-size:11px!important}
  #ft b,.legend b,.l b{font-size:11px!important}
  /* a row label truncated to '…' is worse than a wrapped one once the page flows */
  [style*="ellipsis"]{white-space:normal!important;text-overflow:clip!important;overflow:visible!important}
}
</style>
