<!doctype html>
<!-- ============================================================================
  SERVICE BLUEPRINT  ·  the customer axis over the process baseline
  Lanes come from task.visibility, columns from journey.stages (baseline/2026.9).
  Replace ONLY the /* DATA */ block. Three views: Blueprint / Journey / Painpoints.
  <style> inlined from templates/brand.css (canonical). Logo inlined.
============================================================================ -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service Blueprint</title>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif}
  #art{--navy:#0B2347;--slate:#364156;--green:#1C7A4A;--accent:#6EB1D1;--navy2:#16315B;--rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;--rag-green-text:#2F8F6B;--rag-amber-text:#B97F22;--rag-red-text:#C2483D;--rag-na-text:#6B7480;--tint-green:rgba(47,143,107,.12);--tint-amber:rgba(212,154,58,.16);--tint-red:rgba(210,100,90,.13);--tint-na:rgba(154,164,176,.16);--navy-fill:#0B2347;
      --slate-10:rgba(54,65,86,.09);--navy-10:rgba(11,35,71,.10);--green-10:rgba(28,122,74,.10);
      --soft:#F5F7FB;--muted:#7A838F;--ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #art[data-t="dark"]{--soft:#141E2A;--muted:#94A1B2;--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--navy-fill:#243246;--accent:#8FC7E8;--steel:#93A9C4;--rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;--rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;--tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}
  body:has(#art[data-t="dark"]){--page:#0E1620}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:3}
  .tags{display:flex;align-items:center;gap:11px}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)} .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:11.5px;letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #art[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0 0 16px;max-width:1300px}
  #art[data-t="dark"] h1{color:#EAEFF5} h1 .hl{color:var(--green)}
  #view{flex:1;min-height:0;position:relative;overflow:auto}
  .board{display:grid;gap:10px}
  .colhead{display:grid;gap:10px;margin-bottom:6px}
  .stage{background:var(--navy2);color:#fff;font-size:12px;font-weight:700;letter-spacing:.4px;padding:9px 12px;border-radius:8px;text-align:center}
  .lane{display:grid;gap:10px;align-items:stretch}
  .lanelabel{display:flex;align-items:center;font-size:12px;font-weight:700;color:var(--navy);background:var(--slate-10);border-radius:8px;padding:0 12px}
  #art[data-t="dark"] .lanelabel{color:#EAEFF5}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:11px 13px;font-size:12.5px;color:var(--txt);line-height:1.4}
  .cell b{color:var(--ink);display:block;margin-bottom:3px;font-size:13px}
  .cell.empty{background:transparent;border:1px dashed var(--line);box-shadow:none}
  #ft{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:11px;color:var(--mut)}
  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600}
  /* ── service blueprint ── */
  #art{--steel:#7991AD}   /* the dark palette defines it; the light one does not */
  .ctrls{display:flex;gap:9px;flex:none}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:6px 0 14px}
  .subt{font-size:15px;font-weight:600;color:var(--accent)}
  .stamp{font-size:11px;color:var(--mut)}
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:20px}
  /* on the canvas the inner box is a flex column that fills the frame and scrolls inside itself */
  #art.canvasview #vinner{position:absolute;inset:0;padding-bottom:0;display:flex;flex-direction:column}
  #art.canvasview #view{overflow:hidden}

  .bp{display:grid;gap:1px;align-content:stretch;background:var(--line);
      border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .bp>*{background:var(--card)}

  /* the column heads: a stage, its number, and the work that maps to it */
  .hd{background:var(--navy2);color:#fff;font-size:12px;font-weight:700;letter-spacing:.2px;
      padding:9px 11px;line-height:1.3}
  .hd .n{opacity:.6;font-weight:800;margin-right:5px}
  .hd small{display:block;font-weight:400;opacity:.68;font-size:9.5px;margin-top:3px;
      letter-spacing:.1px;line-height:1.35}
  .hd.off{background:#8A7B58}

  /* the rail: what each row is, and what it answers */
  .lbl{background:var(--slate-10);display:flex;align-items:flex-start;gap:8px;padding:9px 11px;
       font-size:11px;font-weight:700;color:var(--navy);line-height:1.25}
  #art[data-t="dark"] .lbl{color:#EAEFF5}
  .lbl .ic{flex:none;width:15px;height:15px;margin-top:1px;color:var(--accent)}
  .lbl .ic svg{width:15px;height:15px;display:block}
  .lbl em{display:block;font-style:normal;font-weight:400;font-size:9.5px;color:var(--mut);
          margin-top:2px;letter-spacing:.1px;line-height:1.35}
  .lbl.acc{box-shadow:inset 3px 0 0 var(--l-col)}

  .cell{padding:9px 11px;font-size:12px;color:var(--txt);line-height:1.4}
  .cell.none{background:var(--soft)}
  .cell.off{background:rgba(180,150,70,.05)}

  /* a lane cell groups its steps by the team that performs them - but only names the team when
     the row actually holds more than one, or the name would repeat in every cell and say nothing */
  .grp{display:block;font-size:11px;font-weight:700;color:var(--ink);margin-bottom:3px}
  .grp+.stp{margin-top:0}
  .stp{position:relative;padding-left:9px;font-size:11.5px;color:var(--txt);line-height:1.4}
  .stp:before{content:'';position:absolute;left:0;top:6px;width:3px;height:3px;border-radius:50%;
              background:var(--mut)}
  .stp+.stp{margin-top:3px}
  .stp b{display:inline;font-weight:600;color:var(--txt);font-size:11.5px}
  .stp .sys{display:block;font-size:9.5px;color:var(--mut);letter-spacing:.1px}
  .grp2{margin-top:8px}

  /* what the customer does: chips, read left to right, with the flow between them */
  .jstep{display:inline-flex;align-items:center;gap:6px;background:var(--card);
         border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:11px;
         font-weight:600;color:var(--ink);line-height:1.3}
  .jwrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .jarr{color:var(--rag-green);flex:none}
  .jarr svg{width:15px;height:9px;display:block}
  .cell.jrow{background:rgba(47,143,107,.04);position:relative}
  .jnext{position:absolute;right:-10px;top:15px;z-index:2;
         background:var(--card);border-radius:50%;padding:3px 2px;line-height:0}

  /* how they feel: a track, not a rating. The dot says good or bad, the note says their word. */
  .cell.feelrow{position:relative;overflow:visible}
  .feel{position:relative;display:flex;align-items:center;gap:8px;height:20px}
  .feel:before{content:'';position:absolute;left:-11px;right:-12px;top:10px;height:1px;
               background:var(--mut);opacity:.3;z-index:0}
  .feel i{position:relative;z-index:1;width:9px;height:9px;border-radius:50%;flex:none;
          font-style:normal;box-shadow:0 0 0 3px var(--card)}
  .feel .ft{position:relative;z-index:1;font-size:10.5px;line-height:1.35;color:var(--txt);
            background:var(--card);padding-right:4px}
  .feel .ft b{display:block;font-size:11px;font-weight:700;color:var(--ink)}
  .feel.pos i{background:var(--rag-green)} .feel.neu i{background:var(--rag-na)}
  .feel.neg i{background:var(--rag-red)}
  .feel.non i{background:transparent;border:1.5px dashed var(--rag-na)}
  .cell.feelrow{padding-top:14px}

  /* touchpoints: what they meet it through. A channel is not a system. */
  .chs{display:flex;gap:6px;flex-wrap:wrap}
  .ch{display:inline-flex;align-items:center;gap:5px;background:var(--slate-10);border-radius:7px;
      padding:4px 8px;font-size:10.5px;font-weight:600;color:var(--ink)}
  .ch svg{width:12px;height:12px;display:block;color:var(--mut);flex:none}
  .ch.non{background:transparent;border:1px dashed var(--line);color:var(--mut);font-weight:400;font-style:italic}

  .sysc{display:flex;gap:6px;flex-wrap:wrap}
  .sysc span{background:var(--navy-10);border-radius:6px;padding:3px 8px;font-size:10.5px;
             font-weight:600;color:var(--navy)}
  #art[data-t="dark"] .sysc span{background:#243246;color:#EAEFF5}

  .pncell{background:rgba(210,100,90,.055)}
  .pn{position:relative;padding-left:13px;font-size:11px;color:var(--rag-red-text);line-height:1.4}
  .pn:before{content:'\25B4';position:absolute;left:0;top:-1px;font-size:11px}
  .pn+.pn{margin-top:4px}
  .pn b{font-weight:700}
  .pn.nq{color:var(--mut);font-style:italic}

  .divider{grid-column:1/-1;background:var(--navy-fill);height:2px;padding:0}
  .dlbl{grid-column:1/-1;background:var(--card);padding:3px 11px 5px;font-size:9.5px;letter-spacing:.9px;
        text-transform:uppercase;color:var(--navy);font-weight:700}
  #art[data-t="dark"] .dlbl{color:var(--accent)}

  /* journey view */
  .jgrid{display:grid;gap:13px}
  .jcard{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);padding:13px 15px;
         display:flex;flex-direction:column}
  .jcard.hot{border-color:var(--rag-red);border-width:1.5px}
  .jcard.hot h3::after{content:' · nobody meets them';font-size:10.5px;font-weight:600;color:var(--rag-red-text)}
  .jcard h3{margin:0 0 3px;font-size:13.5px;color:var(--navy);font-weight:700}
  #art[data-t="dark"] .jcard h3{color:#EAEFF5}
  .want{font-size:12px;color:var(--txt);font-style:italic;line-height:1.4;margin:0 0 9px}
  .jrow{font-size:11.5px;color:var(--txt);padding:6px 0;border-top:1px solid var(--line);line-height:1.4}
  .jrow i{font-style:normal;display:block;font-size:9px;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin-bottom:1px}
  .jrow.brk{color:var(--rag-red-text)} .jrow.brk i{color:var(--rag-red-text);opacity:.8}
  .behind{margin-top:auto;padding-top:9px;font-size:10px;color:var(--steel);letter-spacing:.2px}

  /* painpoints view */
  table{border-collapse:collapse;width:100%}
  th{text-align:left;font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:700;
     padding:0 18px 8px 0;border-bottom:2px solid var(--line)}
  td{font-size:12.5px;color:var(--txt);padding:10px 18px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
  td b{color:var(--ink)}
  .stagetag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--navy-10);color:var(--navy);white-space:nowrap}
  #art[data-t="dark"] .stagetag{background:#243246;color:#EAEFF5}

  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:10px;font-size:11px;color:var(--mut)}
  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legend{display:flex;gap:9px;flex-wrap:wrap}
  .lp{font-size:.95em;font-weight:600;padding:.2em .8em;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
  .lp i{width:8px;height:8px;border-radius:50%;font-style:normal}
  .conf{font-size:.88em;letter-spacing:.5px;font-weight:600}
  @media (max-width:760px){
    #art{padding:14px 18px 10px 42px}
    .nr-rail{width:24px}
    .toprow{position:static;margin:0 0 12px;flex-wrap:wrap;justify-content:flex-start;gap:10px 12px}
    .tags{flex-wrap:wrap;gap:8px;margin-left:-42px}
    .ctrls{flex-wrap:wrap;gap:8px;flex:1 1 100%}
  }

/*<EDIT>*/
  /* ---- WORKING MODE. Stripped entirely from a client read-out. ---- */
  .wgrp{display:flex;align-items:center;gap:8px;position:relative}
  .wchip{font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    padding:3px 9px;border-radius:999px;background:rgba(212,154,58,.16);color:#8A5F17;white-space:nowrap}
  .wchip.bad{background:rgba(210,100,90,.14);color:#C2483D}
  .wchip.ok{background:rgba(47,143,107,.13);color:#1F6B50}
  /* the gear = the whole edit affordance */
  #wgear{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid var(--line);background:var(--card);border-radius:9px;cursor:pointer;
    color:var(--mut);transition:color .15s,border-color .15s,background .15s,transform .3s}
  #wgear:hover{color:var(--ink);border-color:var(--accent)}
  #wgear svg{width:17px;height:17px;display:block}
  #wgear.unlocked{color:#fff;background:var(--rag-amber);border-color:var(--rag-amber)}
  #wgear.live{color:#fff;background:var(--green);border-color:var(--green)}
  #wgear.unlocked:hover,#wgear.live:hover{filter:brightness(1.06)}
  #wgear.blocked{color:#fff;background:var(--rag-red);border-color:var(--rag-red)}
  #wsave{font-size:12px;font-weight:700;border:1px solid var(--navy-fill);background:var(--navy-fill);color:#fff;
    padding:8px 15px;border-radius:8px;cursor:pointer;white-space:nowrap;display:none}
  #wsave.show{display:inline-block}
  #wsave:disabled{opacity:.45;cursor:default}
  /* the popover - replaces the native title tooltip, which is slow and ugly */
  #wpop{position:absolute;top:44px;right:0;width:330px;z-index:10;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;
    box-shadow:0 22px 50px -20px rgba(11,35,71,.45);
    opacity:0;visibility:hidden;transform:translateY(-5px);transition:opacity .16s,transform .16s,visibility .16s;
    text-align:left;cursor:default}
  .wgrp:hover #wpop,#wpop.pin{opacity:1;visibility:visible;transform:translateY(0)}
  #wpop:after{content:'';position:absolute;top:-6px;right:12px;width:10px;height:10px;background:var(--card);
    border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
  #wpop h4{margin:0 0 3px;font-size:12.5px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px}
  #wpop h4 i{width:7px;height:7px;border-radius:50%;background:var(--rag-amber);flex:none;font-style:normal}
  #wpop h4.live i{background:var(--rag-green)}
  #wpop h4.on i{background:var(--rag-amber)}
  #wpop .lockbtn{width:100%;margin-top:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--navy);
    background:var(--navy-fill);color:#fff;font-size:12px;font-weight:800;cursor:pointer;transition:.14s}
  #wpop .lockbtn:hover{filter:brightness(1.08)}
  #wpop .lockbtn.on{background:var(--card);color:var(--navy)}
  #wpop p{margin:6px 0 0;font-size:11.5px;line-height:1.55;color:var(--txt)}
  #wpop .cmd{margin:10px 0 0;padding:9px 11px;background:var(--soft);border:1px solid var(--line);
    border-radius:8px;font-family:ui-monospace,monospace;font-size:11px;color:var(--ink);
    display:flex;align-items:center;gap:8px;justify-content:space-between}
  #wpop .cmd b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #wpop .cmd button{border:none;background:var(--navy-fill);color:#fff;font-size:9.5px;font-weight:700;
    padding:4px 8px;border-radius:5px;cursor:pointer;flex:none}
  #wpop .fine{margin-top:10px;font-size:10px;color:var(--mut);line-height:1.5}
  #wpop ul{margin:7px 0 0;padding-left:16px}
  #wpop li{font-size:11.5px;line-height:1.6;color:var(--txt)}
  #art.editing .swt{cursor:grab;position:relative;padding-left:19px}
  #art.editing .swt:active{cursor:grabbing}
  #art.editing .swt:before{content:'\2059';position:absolute;left:6px;top:50%;transform:translateY(-50%);
    font-size:11px;letter-spacing:-1px;color:var(--line);line-height:1;transition:color .15s}
  #art.editing .swt:hover{border-color:var(--accent);box-shadow:0 2px 10px -4px rgba(11,35,71,.35)}
  #art.editing .swt:hover:before{color:var(--accent)}
  .swt.drag{opacity:.35;transform:scale(.98)}
  #art.editing .swcell.drop{outline:2px dashed var(--accent);outline-offset:-3px;background:rgba(110,177,209,.10)}
  /* the activity picker - shown when a task is dropped into a phase that holds several activities */
  /* --- v2026.7 edit controls: adds, dropdowns, structured magnitude --- */
  .hidden{display:none !important}
  #ed .frow{display:flex;gap:9px} #ed .frow .f{flex:1;min-width:0}
  #ed textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;
    font-size:12.5px;line-height:1.5;color:var(--ink);background:var(--card);resize:vertical;min-height:56px}
  #ed textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,177,209,.16)}
  #ed .srcnew{display:flex;gap:6px;margin-top:6px}
  #ed .srcnew input{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:12.5px;background:var(--card);color:var(--ink)}
  #ed .srcnew input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,177,209,.16)}
  #ed select:focus,#ed input:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(110,177,209,.16)}
  #ed .quote{margin-top:8px;padding:9px 11px;border-left:3px solid var(--rag-red);
    background:rgba(214,69,65,.06);border-radius:0 7px 7px 0;font-size:11.5px;color:var(--ink);line-height:1.45}
  #ed .quote span{color:var(--mut)}
  #ed .addbox{margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:9px;background:var(--soft)}
  #ed .addbox h6{margin:0 0 9px;font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
  #ed .wbtn.wide{width:100%;margin-top:4px}
  #ed .chks{display:flex;flex-direction:column;gap:5px;max-height:190px;overflow:auto}
  #ed .chk{display:flex;align-items:center;gap:8px;padding:6px 9px;border:1px solid var(--line);
    border-radius:7px;font-size:12px;color:var(--ink);cursor:pointer;background:var(--card)}
  #ed .chk:hover{border-color:var(--accent);background:rgba(110,177,209,.07)}
  #ed .chk i{color:var(--mut);font-style:normal;font-size:11px}
  #ed .pn2.soft{border-left-color:var(--mut);opacity:.85}
  #ed .pn2m{font-size:10.5px;margin-top:3px;color:var(--mut)}
  #ed .pn2m .okv{color:var(--green);font-weight:700}
  #ed .pn2m .badv{color:var(--rag-red);font-weight:600}
  #ed .edkind.new{background:var(--green)} #ed .edkind.opp{background:var(--accent)}

  /* ── cards ─────────────────────────────────────────────────────────────────────────────── */
  .nc-card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;

  .nc-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--slate-10);

  /* ── a track row: a line through the columns, not a chart ──────────────────────────────── */
  .nc-track{border-bottom:1px solid var(--line);border-right:1px solid var(--line);position:relative;

  /* the dot is drawn in PIXELS, never inside the stretched svg, or a circle becomes an ellipse */

           border-bottom:1px solid var(--line);font-size:11.5px;color:var(--mut)}

           color:var(--mut)}

              padding:8px 11px;font-size:11.5px;color:var(--ink);line-height:1.45;margin-bottom:7px}
  #ncdp .note.negative{border-left-color:var(--rag-red);background:rgba(214,69,65,.06)}
  #ncdp .note b{display:block;font-size:12px;margin-top:3px}
  #ncdp .note .m{font-size:10px;color:var(--mut);margin-top:3px}
  #ncov{position:fixed;inset:0;background:rgba(11,35,71,.18);z-index:35;display:none}
  #ncov.on{display:block}

  #ncprev{position:fixed;inset:0;background:rgba(11,35,71,.55);z-index:60;display:none;
          align-items:center;justify-content:center;padding:34px}
  #ncprev.on{display:flex}
  #ncprev .box{background:var(--card);border-radius:14px;padding:20px 22px;width:min(1180px,94vw);
               max-height:92vh;overflow:auto;box-shadow:0 40px 90px -40px rgba(0,0,0,.6)}
  #ncprev h2{margin:0 0 3px;font-size:15px;color:var(--ink)}
  #ncprev .sub{font-size:11.5px;color:var(--mut);margin-bottom:14px}
  .nc-mini{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;
           overflow:hidden}
  .nc-mini>*{background:var(--card);padding:6px 8px;font-size:9.5px;color:var(--txt);line-height:1.3}
  .nc-mini .mh{background:var(--navy2);color:#fff;font-weight:700;font-size:10px}
  .nc-mini .mh.off{background:#8A7B58}
  .nc-mini .mr{background:var(--slate-10);font-weight:700;color:var(--navy);font-size:9.5px}
  #art[data-t="dark"] .nc-mini .mr{color:#EAEFF5}
  .nc-mini .mc b{display:block;font-weight:600;color:var(--ink);font-size:9.5px}
  .nc-mini .mc.none{background:var(--soft)}
</style>
<script>
/* NRCanvas - the shared canvas renderer. Instrument-agnostic by construction: it never reads a
   field it has not defined above, and every decision it cannot make on its own is a hook. */
var NRCanvas = (function(){
  var M=null, H={}, HOST=null, EDITING=false, PICKING=false, FILTER=null, CLOSED={};

  var ICONS={
    journey:'<path d="M4 12h12"/><path d="M13 8l4 4-4 4"/><circle cx="4" cy="12" r="1.6"/>',
    feel:'<circle cx="12" cy="12" r="8"/><path d="M9 14.5s1.2 1.2 3 1.2 3-1.2 3-1.2"/><path d="M9.5 9.5h.01"/><path d="M14.5 9.5h.01"/>',
    touch:'<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18.5h2"/>',
    front:'<circle cx="12" cy="8" r="3.2"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/>',
    back:'<rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="M3.5 10h17"/>',
    support:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>',
    systems:'<ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"/><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/>',
    pain:'<path d="M12 4.5 21 19H3z"/><path d="M12 10v4"/><path d="M12 16.6h.01"/>'
  };
  var CHEV='<svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
  var TICK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var TONE={positive:'var(--rag-green)',neutral:'var(--rag-na)',negative:'var(--rag-red)'};
  var TONEY={positive:14,neutral:28,negative:42};

  function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function cell(r,c){ return (M.cells||{})[r+'|'+c] || {}; }
  function cardsOf(r,c){ return (cell(r,c).cards||[]).map(function(id){
    var x=(M.cards||{})[id]; return x?Object.assign({id:id},x):null; }).filter(Boolean); }
  function onSlide(kind,id){ var s=M.slide||{rows:[],cols:[]};
    return (kind==='r'?s.rows:s.cols).indexOf(id)>=0; }
  function passes(card){ if(!FILTER) return true; return (card.flags||[]).indexOf(FILTER)>=0; }

  function icon(k){ return '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
    'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[k]||'')+'</svg></span>'; }

  /* ── filters ─────────────────────────────────────────────────────────────────────────── */
  function counts(flag){
    if(!flag) return Object.keys(M.cards||{}).length;
    var n=0; for(var k in (M.cards||{})) if(((M.cards[k].flags)||[]).indexOf(flag)>=0) n++;
    return n;
  }
  function bar(){
    return (M.filters||[]).map(function(f){
      return '<button class="nc-chip'+((f.flag||null)===FILTER?' on':'')+'" data-flag="'+
        esc(f.flag||'')+'">'+esc(f.label)+'<span class="n">'+counts(f.flag||null)+'</span></button>';
    }).join('');
  }

  /* ── the grid ────────────────────────────────────────────────────────────────────────── */
  function railHtml(row){
    var dim=PICKING&&!onSlide('r',row.id);
    return '<div class="nc-rail'+(row.accent?' acc':'')+(CLOSED[row.id]?' closed':'')+(dim?' dim':'')+
      '" data-row="'+esc(row.id)+'"'+(row.accent?' style="--rc:'+row.accent+'"':'')+'>'+
      icon(row.icon)+'<span><b>'+esc(row.label)+'</b>'+(row.sub?'<em>'+esc(row.sub)+'</em>':'')+'</span>'+
      (row.count!=null?'<span class="cnt">'+row.count+'</span>':'')+CHEV+
      '<span class="nc-pk'+(onSlide('r',row.id)?' on':'')+'" data-pk="r:'+esc(row.id)+'">'+TICK+'</span></div>';
  }
  function cardHtml(card){
    var act=EDITING&&H.onCard;
    return '<div class="nc-card'+(act?' act':'')+(passes(card)?'':' hide')+
      '" data-card="'+esc(card.id)+'"'+(card.accent?' style="border-left:3px solid '+card.accent+'"':'')+'>'+
      '<b>'+esc(card.title)+'</b>'+
      (card.meta?'<span class="who">'+esc(card.meta)+'</span>':'')+
      ((card.tags||[]).length?'<div class="tags">'+card.tags.map(function(t){
        return '<span class="nc-tag '+esc(t.kind||'')+'">'+esc(t.text)+'</span>';}).join('')+'</div>':'')+
      '</div>';
  }
  function trackCell(row,col,i){
    var c=cell(row.id,col.id).track;
    var dim=PICKING&&!onSlide('c',col.id);
    if(!c) return '<div class="nc-track'+(col.kind==='off'?' off':'')+(dim?' dim':'')+'"></div>';
    var y=TONEY[c.tone]!=null?TONEY[c.tone]:28, col2=TONE[c.tone]||'var(--rag-na)';
    var prev=(M.columns[i-1]&&cell(row.id,M.columns[i-1].id).track)||null;
    var next=(M.columns[i+1]&&cell(row.id,M.columns[i+1].id).track)||null;
    var py=prev?(TONEY[prev.tone]!=null?TONEY[prev.tone]:28):y;
    var ny=next?(TONEY[next.tone]!=null?TONEY[next.tone]:28):y;
    var a=(py+y)/2, b=(ny+y)/2;
    return '<div class="nc-track'+(col.kind==='off'?' off':'')+(dim?' dim':'')+'">'+
      '<svg viewBox="0 0 100 56" preserveAspectRatio="none">'+
        '<path d="M0 '+a+' C25 '+a+' 25 '+y+' 50 '+y+' C75 '+y+' 75 '+b+' 100 '+b+'" fill="none" '+
        'stroke="'+col2+'" stroke-width="1.8" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>'+
      '<span class="nc-dot" style="top:'+y+'px;background:'+col2+'"></span>'+
      (c.label?'<div class="nc-tlab"><b>'+esc(c.label)+'</b></div>':'')+'</div>';
  }

  function grid(){
    var cols=M.columns||[], rows=M.rows||[];
    var h='<div class="nc-corner">'+(M.cornerTitle?'<b>'+esc(M.cornerTitle)+'</b>':'')+
          (M.cornerSub?'<span>'+esc(M.cornerSub)+'</span>':'')+'</div>';
    cols.forEach(function(c){
      var dim=PICKING&&!onSlide('c',c.id);
      h+='<div class="nc-colh'+(c.kind==='off'?' off':'')+(dim?' dim':'')+'" data-col="'+esc(c.id)+'">'+
        (c.tag?'<span class="t">'+esc(c.tag)+'</span>':'')+'<b>'+esc(c.label)+'</b>'+
        (c.sub?'<em>'+esc(c.sub)+'</em>':'')+
        '<span class="nc-pk'+(onSlide('c',c.id)?' on':'')+'" data-pk="c:'+esc(c.id)+'">'+TICK+'</span></div>';
    });
    rows.forEach(function(r){
      if(r.divider) h+='<div class="nc-div"><i></i></div><div class="nc-divl">'+esc(r.divider)+'</div>'+
        cols.map(function(){return '<div style="height:0"></div>';}).join('');
      h+=railHtml(r);
      cols.forEach(function(c,i){
        var dim=PICKING&&!onSlide('c',c.id);
        if(r.kind==='track'){ h+=CLOSED[r.id]
          ? '<div class="nc-cell empty'+(dim?' dim':'')+'"></div>' : trackCell(r,c,i); return; }
        if(CLOSED[r.id]){ h+='<div class="nc-cell empty'+(dim?' dim':'')+'"></div>'; return; }
        var list=cardsOf(r.id,c.id);
        var plus=(EDITING&&H.onAdd&&(!H.canAdd||H.canAdd(r.id,c.id)))
          ? '<button class="nc-plus" data-add="'+esc(r.id)+'|'+esc(c.id)+'" title="Add">+</button>' : '';
        h+='<div class="nc-cell'+(c.kind==='off'?' off':'')+(list.length?'':' empty')+(dim?' dim':'')+'">'+
           list.map(cardHtml).join('')+plus+'</div>';
      });
    });
    return h;
  }

  function draw(){
    var cols=M.columns||[];
    HOST.querySelector('.nc-bar').innerHTML=bar();
    var g=HOST.querySelector('.nc-grid');
    g.style.gridTemplateColumns='210px repeat('+cols.length+',minmax(230px,1fr))';
    g.innerHTML=grid();
    bind();
    pickbar();
  }

  function bind(){
    HOST.querySelectorAll('.nc-chip').forEach(function(b){
      b.onclick=function(){ FILTER=b.getAttribute('data-flag')||null; draw(); };});
    HOST.querySelectorAll('.nc-rail').forEach(function(r){
      r.onclick=function(e){
        if(e.target.closest('.nc-pk')) return;
        var id=r.getAttribute('data-row');
        if(EDITING&&H.onRow&&e.altKey){ H.onRow(id); return; }
        CLOSED[id]=!CLOSED[id]; draw(); };});
    HOST.querySelectorAll('.nc-colh').forEach(function(c){
      c.onclick=function(e){
        if(e.target.closest('.nc-pk')) return;
        if(EDITING&&H.onColumn) H.onColumn(c.getAttribute('data-col')); };});
    HOST.querySelectorAll('.nc-card').forEach(function(c){
      c.onclick=function(){ var id=c.getAttribute('data-card');
        if(EDITING&&H.onCard) H.onCard(id); else openDetail(id); };});
    HOST.querySelectorAll('.nc-plus').forEach(function(p){
      p.onclick=function(e){ e.stopPropagation();
        var v=p.getAttribute('data-add').split('|'); H.onAdd(v[0],v[1]); };});
    HOST.querySelectorAll('.nc-pk').forEach(function(p){
      p.onclick=function(e){ e.stopPropagation();
        var v=p.getAttribute('data-pk').split(':'), kind=v[0], id=v.slice(1).join(':');
        var s=M.slide=M.slide||{rows:[],cols:[]};
        var arr=kind==='r'?s.rows:s.cols, i=arr.indexOf(id);
        if(i>=0) arr.splice(i,1); else arr.push(id);
        if(H.onSlideChange) H.onSlideChange(s);
        draw(); };});
  }

  /* ── the detail panel (read-only: editing instruments open their own) ─────────────────── */
  function openDetail(id){
    if(!H.detail) return;
    var d=H.detail(id); if(!d) return;
    var dp=document.getElementById('ncdp');
    dp.innerHTML='<div class="h"><button class="x" id="ncdpx">&times;</button>'+
      (d.kind?'<span class="k">'+esc(d.kind)+'</span>':'')+'<h3>'+esc(d.title)+'</h3>'+
      (d.id?'<span class="id">'+esc(d.id)+'</span>':'')+'</div><div class="b">'+
      (d.rows||[]).map(function(r){
        return '<div class="r"><span>'+esc(r.k)+'</span><b>'+(r.raw?r.v:esc(r.v))+'</b></div>';}).join('')+
      ((d.notes||[]).length||d.notesTitle
        ? '<h4>'+esc(d.notesTitle||'Detail')+'</h4>'+
          ((d.notes||[]).length
            ? d.notes.map(function(n){
                return '<div class="note '+esc(n.tone||'')+'">'+esc(n.body)+
                  (n.strong?'<b>'+esc(n.strong)+'</b>':'')+
                  (n.meta?'<div class="m">'+esc(n.meta)+'</div>':'')+'</div>';}).join('')
            : '<div style="font-size:11.5px;color:var(--mut)">'+esc(d.notesEmpty||'Nothing captured here.')+'</div>')
        : '')+'</div>';
    dp.classList.add('on'); document.getElementById('ncov').classList.add('on');
    document.getElementById('ncdpx').onclick=closeDetail;
  }
  function closeDetail(){
    document.getElementById('ncdp').classList.remove('on');
    document.getElementById('ncov').classList.remove('on');
  }

  /* ── the slide picker ────────────────────────────────────────────────────────────────── */
  function pickbar(){
    var el=document.getElementById('ncbar'); if(!el) return;
    var s=M.slide||{rows:[],cols:[]};
    var n=0;
    (M.rows||[]).forEach(function(r){ if(s.rows.indexOf(r.id)<0) return;
      (M.columns||[]).forEach(function(c){ if(s.cols.indexOf(c.id)<0) return;
        n+=cardsOf(r.id,c.id).length; }); });
    var total=Object.keys(M.cards||{}).length;
    var warn=(H.slideWarnings?H.slideWarnings(s):[]).map(function(w){
      return '<span class="warn">'+w+'</span>';}).join('');
    el.querySelector('.txt').innerHTML='<b>'+s.cols.length+'</b> column'+(s.cols.length===1?'':'s')+
      ' and <b>'+s.rows.length+'</b> row'+(s.rows.length===1?'':'s')+' on the slide, holding <b>'+
      n+'</b> of '+total+'.'+warn;
  }
  function setPicking(on){
    PICKING=!!on; document.body.classList.toggle('nc-picking',PICKING); draw();
  }
  function preview(){
    var s=M.slide||{rows:[],cols:[]};
    var cols=(M.columns||[]).filter(function(c){return s.cols.indexOf(c.id)>=0;});
    var rows=(M.rows||[]).filter(function(r){return s.rows.indexOf(r.id)>=0;});
    var h='<h2>What the one-pager becomes</h2><div class="sub">'+cols.length+' columns &middot; '+
      rows.length+' rows &middot; the shape, not the finished render</div>'+
      '<div class="nc-mini" style="grid-template-columns:120px repeat('+cols.length+',1fr)">'+
      '<div class="mr">'+esc(M.cornerTitle||'')+'</div>'+
      cols.map(function(c){return '<div class="mh'+(c.kind==='off'?' off':'')+'">'+esc(c.label)+'</div>';}).join('');
    rows.forEach(function(r){
      var lists=cols.map(function(c){
        return r.kind==='track' ? [(cell(r.id,c.id).track||{}).label||''] :
          cardsOf(r.id,c.id).map(function(x){return x.title;}); });
      if(!lists.some(function(l){return l.filter(Boolean).length;})) return;
      h+='<div class="mr">'+esc(r.label)+'</div>';
      lists.forEach(function(l){
        var v=l.filter(Boolean);
        h+='<div class="mc'+(v.length?'':' none')+'">'+v.map(function(x){
          return '<b>'+esc(x)+'</b>';}).join('')+'</div>'; });
    });
    h+='</div><div style="margin-top:14px;font-size:11.5px;color:var(--mut)">'+
      'The real one-pager keeps the brand frame, the action title and the source line.</div>'+
      '<div style="margin-top:14px;text-align:right"><button class="nc-btn" id="ncpvx">Close</button></div>';
    document.getElementById('ncprevbox').innerHTML=h;
    document.getElementById('ncprev').classList.add('on');
    document.getElementById('ncpvx').onclick=function(){
      document.getElementById('ncprev').classList.remove('on');};
  }

  function mount(o){
    M=o.model; H=o.hooks||{}; HOST=o.host; EDITING=!!o.editing;
    HOST.innerHTML='<div class="nc-bar"></div><div class="nc-scroll"><div class="nc-grid"></div></div>';
    HOST.classList.add('nc-wrap');
    if(!document.getElementById('ncdp')){
      var f=document.createElement('div');
      f.innerHTML='<div id="ncov"></div><div id="ncdp"></div>'+
        '<div id="ncprev"><div class="box" id="ncprevbox"></div></div>'+
        '<div id="ncbar"><div class="txt"></div>'+
        '<button class="nc-btn ghost" id="ncall">Everything</button>'+
        '<button class="nc-btn ghost" id="ncsug">What I would pick</button>'+
        '<button class="nc-btn" id="ncpv">Preview the slide</button>'+
        '<button class="nc-btn ghost" id="ncdone">Done</button></div>';
      while(f.firstChild) HOST.parentNode.appendChild(f.firstChild);
      document.getElementById('ncov').onclick=closeDetail;
      window.addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeDetail();
        document.getElementById('ncprev').classList.remove('on'); }});
      document.getElementById('ncall').onclick=function(){
        M.slide={rows:(M.rows||[]).map(function(r){return r.id;}),
                 cols:(M.columns||[]).map(function(c){return c.id;})};
        if(H.onSlideChange) H.onSlideChange(M.slide); draw(); };
      document.getElementById('ncsug').onclick=function(){
        if(!H.suggestSlide) return;
        M.slide=H.suggestSlide();
        if(H.onSlideChange) H.onSlideChange(M.slide); draw(); };
      document.getElementById('ncpv').onclick=preview;
      document.getElementById('ncdone').onclick=function(){ setPicking(false); };
    }
    draw();
  }

  /* Every entry point tolerates being called before mount(): an instrument switching views or
     toggling its lock has no reason to know whether the canvas happens to be on screen. */
  return {mount:mount, redraw:function(m){ if(m) M=m; if(M&&HOST) draw(); },
          setEditing:function(v){ EDITING=!!v; if(M&&HOST) draw(); },
          setPicking:function(v){ if(M&&HOST) setPicking(v); },
          isPicking:function(){return PICKING;},
          model:function(){return M;}, closeDetail:closeDetail};
})();
</script>

          return '<div class="stp"'+EA('data-step="'+s.id+'"')+'><b>'+esc(s.name)+'</b>'+
                 (s.system&&!named?'<span class="sys">'+esc(s.system)+'</span>':'')+'</div>';
        }).join('');
    }).join('');
    return '<div class="cell'+(off?' off':'')+'">'+html+'</div>';
  }

  function laneRow(L, out, ROWS){
    if(!onSlideRow(L.k)) return out;                                  /* left off the slide */
    var lists = cols.map(function(c){ return at(c,L.k); });
    if(!lists.some(function(x){ return x.length; })) return out;       /* the row says nothing */
    var actorsInRow={};
    lists.forEach(function(l){ l.forEach(function(s){ actorsInRow[s.actorId||'']=1; }); });
    var named = Object.keys(actorsInRow).length > 1;
    if(DIVIDERS[L.k]){
      ROWS.push('min-content'); ROWS.push('min-content');
      out += '<div class="divider"></div><div class="dlbl">'+DIVIDERS[L.k]+'</div>';
    }
    ROWS.push('auto');            /* a lane holds the steps, so a lane takes the slack */
    out += rail(L.icon, L.label, L.sub, L.col);
    lists.forEach(function(l,x){ out += laneCell(l, cols[x]===OFF, named); });
    return out;
  }

  function rail(ic, label, sub, col){
    return '<div class="lbl'+(col?' acc':'')+'"'+(col?' style="--l-col:'+col+'"':'')+'>'+
      icon(ic)+'<span>'+esc(label)+(sub?'<em>'+esc(sub)+'</em>':'')+'</span></div>';
  }

  function vBlueprint(){
    if(!stages.length) return '<p style="color:var(--mut)">No journey stages captured yet — the columns of a blueprint are the customer’s journey, so there is nothing to draw.</p>';
    var grid = 'minmax(132px,158px) repeat('+cols.length+',minmax(140px,1fr))';
    var ROWS=[];                      /* filled as the rows are built, emitted as the row track */
    var out = '';

    /* --- the column heads: the stage, and the work that maps onto it --- */
    ROWS.push('min-content');
    out += '<div class="lbl" style="background:var(--card)"><span>Journey stage<em>'+
           esc(unitWord(true))+' mapped onto it</em></span></div>';
    stages.forEach(function(s){
      out += '<div class="hd"'+EA('data-stage="'+s.id+'"')+'><span class="n">'+(s.order||'')+'.</span>'+
             esc(s.name)+'<small>'+esc(unitsFor(s.id).join(' · ')||'no '+unitWord().toLowerCase()+' maps here')+'</small></div>';
    });
    if(offSteps.length && onSlideCol(OFF)) out += '<div class="hd off"'+EA('data-lock="off"')+'>Not on the journey<small>'+
      esc(unitsFor(null).join(' · '))+'</small></div>';

    /* --- what the customer does --- */
    var anyDo = onSlideRow('customer-action') && cols.some(function(c){ return at(c,'customer-action').length; });
    if(anyDo){
      ROWS.push('min-content');
      out += rail('journey','Customer journey','What the customer does');
      cols.forEach(function(c,x){
        var d=at(c,'customer-action');
        out += '<div class="cell jrow'+(c===OFF?' off':'')+'">'+
          (d.length
            ? '<div class="jwrap">'+d.map(function(s,x){
                return (x?ARROW:'')+'<span class="jstep"'+EA('data-step="'+s.id+'"')+'>'+esc(s.name)+'</span>';
              }).join('')+PLUSBTN(c)+'</div>'
            : '<span style="color:var(--mut);font-size:11px;font-style:italic">nothing — they wait</span>'+PLUSBTN(c))+
          (c!==OFF && x<stages.length-1 ? '<span class="jnext">'+ARROW+'</span>' : '')+
          '</div>';
      });
    }

    /* --- how they feel. The dot reads good or bad; the note is their own word. --- */
    var anyFeel = onSlideRow('feel') && stages.some(function(s){ return s.sentiment; });
    if(anyFeel){
      var CLS={positive:'pos',neutral:'neu',negative:'neg'};
      ROWS.push('min-content');
      out += rail('feel','Customer experience','How they feel here');
      cols.forEach(function(c){
        if(c===OFF){ out += '<div class="cell none off"></div>'; return; }
        var s=stages.filter(function(x){return x.id===c;})[0]||{};
        var k=CLS[s.sentiment]||'non';
        out += '<div class="cell feelrow"><div class="feel '+k+'"><i></i><span class="ft">'+
          (s.sentimentNote?'<b>'+esc(s.sentimentNote)+'</b>':
            (s.sentiment?esc(s.sentiment):'<span style="color:var(--mut);font-style:italic">not asked</span>'))+
          '</span></div></div>';
      });
    }

    /* --- what they meet it through --- */
    var anyCh = onSlideRow('touch') && cols.some(function(c){ return channelsAt(c).length; });
    if(anyCh){
      ROWS.push('min-content');
      out += rail('touch','Touchpoints','Channels they meet us on');
      cols.forEach(function(c){
        var ch=channelsAt(c), seen=at(c,'customer-action').concat(at(c,'frontstage'));
        out += '<div class="cell'+(c===OFF?' off':'')+'">'+
          (ch.length ? '<div class="chs">'+ch.map(chip).join('')+'</div>'
            : (seen.length ? '<div class="chs"><span class="ch non">not recorded</span></div>'
                           : '<div class="chs"><span class="ch non">no customer contact</span></div>'))+
          '</div>';
      });
    }

    /* --- the three lanes of our own work --- */
    LANES.forEach(function(L){
      if(L.k==='customer-action') return;            /* drawn above, as the journey */
      out = laneRow(L, out, ROWS);
    });

    /* --- the systems that carry it --- */
    var anySys = onSlideRow('systems') && cols.some(function(c){ return systemsAt(c).length; });
    if(anySys){
      ROWS.push('min-content');
      out += rail('systems','Systems & data','What carries the work');
      cols.forEach(function(c){
        var sy=systemsAt(c);
        out += '<div class="cell'+(c===OFF?' off':'')+'">'+
          (sy.length?'<div class="sysc">'+sy.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>'
                    :'<span style="color:var(--mut);font-size:11px;font-style:italic">not recorded</span>')+
          '</div>';
      });
    }

    /* --- where it breaks --- */
    var anyPain = onSlideRow('pain') && cols.some(function(c){ return painsAt(c).length; });
    if(anyPain){
      ROWS.push('min-content');
      out += rail('pain','Key pain points','Where it breaks','var(--rag-red)');
      cols.forEach(function(c){
        var ps=painsAt(c);
        out += '<div class="cell'+(ps.length?' pncell':' none')+(c===OFF?' off':'')+'">'+
          ps.map(function(p){
            var q=p.magnitude&&p.magnitude.value!=null;
            return '<div class="pn'+(q?'':' nq')+'">'+esc(p.theme)+
              (q?' <b>'+esc(magText(p.magnitude))+'</b>':'')+'</div>';
          }).join('')+'</div>';
      });
    }

    return '<div class="bp" data-stretch style="grid-template-columns:'+grid+
           ';grid-template-rows:'+ROWS.join(' ')+'">'+out+'</div>';
  }

  /* ── the small derivations the rows above read from ─────────────────────────────────────── */
  function unitWord(pl){ return DATA.mappingUnit==='phase' ? (pl?'Phases':'Phase')
                                                            : (pl?'Activities':'Activity'); }
  function unitsFor(stageId){
    var seen={}, out=[];
    steps.forEach(function(s){
      if((stageId===null ? !!s.stageId : s.stageId!==stageId)) return;
      var n=s.unitName||s.activityId; if(!n||seen[n]) return;
      seen[n]=1; out.push(n);
    });
    return out;
  }
  function channelsAt(c){
    var seen={}, out=[];
    ['customer-action','frontstage'].forEach(function(v){
      at(c,v).forEach(function(s){ if(s.channel&&!seen[s.channel]){seen[s.channel]=1;out.push(s.channel);} });
    });
    return out;
  }
  function systemsAt(c){
    var seen={}, out=[];
    LANES.forEach(function(L){ at(c,L.k).forEach(function(s){
      if(s.system&&!seen[s.system]){seen[s.system]=1;out.push(s.system);} }); });
    return out;
  }
  function painsAt(c){
    var out=[];
    LANES.forEach(function(L){ at(c,L.k).forEach(function(s){
      (s.pains||[]).forEach(function(p){ out.push(p); }); }); });
    return out;
  }

    if(!stages.length) return '<p style="color:var(--mut)">No journey stages captured yet.</p>';

          meets = at(s.id,'frontstage'),
          back  = at(s.id,'backstage').concat(at(s.id,'support'));
      var breaks = [];
      ['customer-action','frontstage','backstage','support',''].forEach(function(v){
        at(s.id,v).forEach(function(st){ painsOf(st).forEach(function(p){ breaks.push(p); }); });
      });
      var sys = {};
      back.forEach(function(b){ if(b.system) sys[b.system]=1; });
      var sysList = Object.keys(sys);
      var alone = !meets.length;      /* nobody frontstage: the customer is on their own here */
      return '<div class="jcard'+(alone?' hot':'')+'">'+
        '<h3>'+(s.order||'')+' · '+esc(s.name)+'</h3>'+
        (s.want?'<p class="want">“'+esc(s.want)+'”</p>':'') +
        '<div class="jrow"><i>They do</i>'+(does.length?does.map(function(d){return esc(d.name);}).join(', '):'— nothing; they wait')+'</div>'+
        '<div class="jrow"><i>They meet</i>'+(meets.length?meets.map(function(d){return esc(d.name);}).join(', '):'— nobody')+'</div>'+
        (breaks.length?'<div class="jrow brk"><i>Breaks</i>'+breaks.map(function(p){

  function vPains(){
