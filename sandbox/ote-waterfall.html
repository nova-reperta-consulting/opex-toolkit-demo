<!doctype html>
<!-- ============================================================================
  OTE WATERFALL (TOP-DOWN)  ·  Nova Reperta  ·  baseline-category instrument
  Hybrid artifact: a read-out (5 views) plus a calculator layer in the working copy.

  TWO FILES, built by scripts/render_ote.py:
    ote-waterfall.html          client read-out — every edit fence stripped out. The file you SEND.
    ote-waterfall.WORKING.html  working copy — lock-by-default; the calculator, the provenance
                                and the narrative are editable; exports a delta. NEVER sent.

  THE MATHS lives twice on purpose: here in JS (so the working copy recalculates live in a TL
  session) and in scripts/render_ote.py (so the capture's numbers are produced by Python).
  scripts/check_ote.py --parity asserts the two agree to 0.01 on the worked example. If you
  change a formula here, change it there and re-run the parity check.

  ONLY the /* DATA */ block changes per team. Markup, CSS and JS are fixed.
============================================================================ -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OTE Waterfall (Top-Down)</title>
<style>
/* Type scale — one place, not case by case. Every size below 12px is a token; the
   whole small end lifts on a narrow screen so nothing drops under 11px on a phone. */
:root{
  --fs-65:6.5px; --fs-7:7px; --fs-75:7.5px; --fs-8:8px; --fs-85:8.5px; --fs-9:9px;
  --fs-95:9.5px; --fs-10:10px; --fs-105:10.5px; --fs-11:11px; --fs-115:11.5px;
}
@media (max-width:760px){
  :root{
    --fs-65:11px; --fs-7:11px; --fs-75:11px; --fs-8:11px; --fs-85:11px; --fs-9:11px;
    --fs-95:11px; --fs-10:11.5px; --fs-105:12px; --fs-11:12px; --fs-115:12.5px;
  }
}
</style>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}
  /* ===== BRAND THEME (inlined from templates/brand.css — do not hand-edit the tokens) ===== */
  #art{--navy:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;
      --slate-10:rgba(54,65,86,.09);--navy-10:rgba(11,35,71,.10);--green-10:rgba(28,122,74,.10);--accent-10:rgba(110,177,209,.13);--sky-10:rgba(169,213,230,.22);
      --rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;
      --rag-green-text:#2F8F6B;--rag-amber-text:#B97F22;--rag-red-text:#C2483D;--rag-na-text:#6B7480;
      --tint-green:rgba(47,143,107,.12);--tint-amber:rgba(212,154,58,.16);--tint-red:rgba(210,100,90,.13);--tint-na:rgba(154,164,176,.16);
      --navy-fill:#0B2347;
      --dv-1:#0B2347;--dv-2:#2E5C8A;--dv-3:#7991AD;--dv-4:#A9D5E6;--dv-5:#1C7A4A;--dv-6:#2E8B6F;
      /* waterfall encoding — chart tokens, deliberately SEPARATE from the RAG scoring set:
         navy = a total · steel = a structural deduction · crimson = a loss you can attack ·
         green = value. This is the house read of the slide, and the footer legend names it. */
      --wf-total:#0B2347;--wf-struct:#3E5B80;--wf-loss:#C0405A;--wf-value-b:#8CBF3F;--wf-value-c:#1C7A4A;
      --tint-value:rgba(28,122,74,.075);--tint-loss:rgba(192,64,90,.08);
      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;
      /* ══ THE TYPE SCALE ══
         ONE base, --ui, solved from the frame height by fitUI() and used by BOTH columns, so the
         chart and the prose beside it stay in proportion at every window size. Before this, the
         insight column was solved and the chart column was fixed px: at 1920 the prose ran to
         15.7px while its own section heading sat at 12.8, and the headings were SMALLER than the
         body text under them. Six steps, and nothing outside them.
         Anything expressed in px below this line is FURNITURE - a border, a badge circle, a
         radius - not type. */
      --ui:11px;
      /* the label gutter, in --ui rather than em: `em` would resolve against each element's OWN
         font-size, so the separator and the OTE box (which inherit the page default) would indent
         to a different column than the labels they are supposed to line up with */
      --labw:calc(var(--ui)*13.7);
      --fs-micro:calc(var(--ui)*.78);   /* column headers, threshold labels, unit suffixes */
      --fs-small:calc(var(--ui)*.88);   /* badges, the FTE column, values outside a bar */
      --fs-body:var(--ui);              /* row labels, table cells, insight bullets */
      --fs-lead:calc(var(--ui)*1.1);    /* insight headings, chart names */
      --fs-sect:calc(var(--ui)*1.22);   /* section headings */
      --fs-display:calc(var(--ui)*2.2); /* the OTE result, the waste summary numbers */
      --lh-tight:1.25;--lh-ui:1.4;--lh-prose:1.55;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #art[data-t="dark"]{--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;
      --navy-fill:#243246;--accent:#8FC7E8;--steel:#93A9C4;
      --dv-1:#5B85B8;--dv-2:#7BA3CC;--dv-3:#9DB4CE;--dv-4:#A9D5E6;--dv-5:#4FA97C;--dv-6:#66B79A;
      --wf-total:#5B85B8;--wf-struct:#7B93B4;--wf-loss:#D9647C;--wf-value-b:#A6D45C;--wf-value-c:#4FA97C;
      --tint-value:rgba(79,169,124,.15);--tint-loss:rgba(217,100,124,.15);
      --rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;
      --rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;
      --tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);
      --sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}
  body:has(#art[data-t="dark"]){--page:#0E1620}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:3}
  .tags{display:flex;align-items:center;gap:11px;min-width:0}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)}
  .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:var(--fs-115);letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #art[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  .ctrls{display:flex;gap:9px;flex:none}
  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0;max-width:1300px}
  #art[data-t="dark"] h1{color:#EAEFF5}
  h1 .hl{color:var(--green)}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 14px}
  .subt{font-size:15px;font-weight:600;color:var(--accent)}
  .methodline{font-size:var(--fs-115);color:var(--mut);text-align:right;line-height:1.5}
  .methodline b{color:var(--txt);font-weight:600}
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:20px}

  /* ══ THE MAIN SLIDE: waterfall left, insights right (the house layout) ══ */
  .slide{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);
    gap:calc(var(--ui)*2.6);align-items:start}
  .sech{margin:0 0 calc(var(--ui)*1.05);font-size:var(--fs-sect);font-weight:700;color:var(--ink);
    line-height:var(--lh-tight);padding-bottom:calc(var(--ui)*.55);border-bottom:1px solid var(--steel)}
  .col-wf,.col-ins{min-width:0}

  /* ── waterfall cascade, indexed to available time = 100 ── */
  .wfwrap{padding:0;position:relative}
  .wfmeta{display:flex;align-items:baseline;gap:10px;font-size:var(--fs-small);color:var(--mut);
    line-height:var(--lh-ui);margin-bottom:calc(var(--ui)*.9)}
  .wfmeta>span:first-child{flex:1;min-width:0}
  .wfmeta .fteh{font-weight:700;letter-spacing:.5px;text-transform:uppercase;flex:none;width:3.9em;text-align:right}
  .wfmeta .cumh{font-weight:700;letter-spacing:.5px;text-transform:uppercase;flex:none;width:5.3em;text-align:right;padding-left:.8em;font-size:var(--fs-micro)}
  .wf-row{display:flex;align-items:center;height:var(--rowh,29px)}
  /* the gutters are in --ui too: a label column fixed in px clips its longest label as soon as
     the type grows, and a right-hand number column stops lining up with its header */
  .wf-label{width:var(--labw);flex:none;display:flex;align-items:center;justify-content:flex-end;
    gap:.55em;padding-right:.9em;font-size:var(--fs-body);color:var(--txt);white-space:nowrap}
  .wf-label>span{overflow:hidden;text-overflow:ellipsis}
  .wf-row.tot .wf-label>span:not(.wf-num){font-weight:700;color:var(--ink)}
  /* The badge is a SPAN inside .wf-label, so any `.wf-label>span{color:...}` rule will steal its
     white and leave a dark digit on a dark circle. This wins, and every view-specific label rule
     below excludes .wf-num explicitly. The test asserts the computed contrast on every badge. */
  .wf-num{flex:none;width:1.5em;height:1.5em;border-radius:50%;background:var(--wf-total);
    font-size:var(--fs-micro);font-weight:800;display:inline-flex;align-items:center;justify-content:center}
  .wf-label .wf-num,.wf-num{color:#fff}
  /* the bar grows with its row, but not without limit: a 40px bar in a 58px row reads as a
     block, not a chart */
  .wf-track{flex:1;min-width:0;position:relative;
    height:min(calc(var(--rowh,29px)*.7), calc(var(--ui)*2.1))}
  .wf-bar{position:absolute;height:100%;border-radius:2px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .wf-bar span{font-size:var(--fs-small);font-weight:700;color:#fff;white-space:nowrap}
  .wf-out{position:absolute;top:50%;transform:translateY(-50%);font-size:var(--fs-small);font-weight:700;color:var(--mut);white-space:nowrap}
  /* The bars carry no reference marks. Two ticks per bar - a peer median and a good threshold -
     put four extra objects on the busiest part of the page to say what the chips beside the
     insight already say in words. The ranking lives in the chips and, in full, on the
     Benchmark view. */
  .wf-fte{width:3.8em;flex:none;padding-left:.9em;text-align:right;font-size:var(--fs-small);color:var(--mut);font-variant-numeric:tabular-nums}
  .wf-sep{height:1px;background:var(--line);margin:calc(var(--ui)*.4) 0 calc(var(--ui)*.4) var(--labw)}
  .wf-sub{height:20px}
  .wf-sub .wf-label{font-size:var(--fs-small);color:var(--mut);font-style:italic}
  .wf-sub .wf-bar{opacity:.45}
  /* Value added time carries no band and no bracket. The numbered badge simply appears on BOTH
     value rows, the way every other numbered bar carries its badge, and the insight card ties
     them together. A marker drawn across rows is one more thing that can drift. */
  .wf-num.vnum{background:var(--wf-value-c)}

  /* ── the OTE formula box ── */
  .otebox{display:flex;align-items:center;gap:calc(var(--ui)*1.2);
    margin:calc(var(--ui)*1.5) 0 0 var(--labw);
    background:var(--slate-10);border-radius:10px;padding:calc(var(--ui)*1) calc(var(--ui)*1.5)}
  .otebox .oteeq{font-size:var(--fs-lead);font-weight:700;color:var(--ink);flex:none}
  .otebox .otef{display:flex;flex-direction:column;align-items:center;flex:none;line-height:1.3}
  .otebox .otef .num{font-size:var(--fs-body);font-weight:700;color:var(--wf-value-c);padding:0 6px 2px;border-bottom:1.5px solid var(--ink)}
  .otebox .otef .den{font-size:var(--fs-body);color:var(--txt);padding-top:2px}
  .otebox .oteres{font-size:var(--fs-display);font-weight:800;color:var(--ink);letter-spacing:-.5px;flex:none}
  .otebox .otenote{font-size:var(--fs-small);color:var(--mut);line-height:var(--lh-prose);margin-left:auto;text-align:right}
  .otebox.na{display:block;font-size:var(--fs-body);color:var(--txt);line-height:var(--lh-prose);background:var(--tint-na)}
  .otebox.na b{color:var(--ink)}


  /* ── waste breakdown: the same cascade furniture, ranked instead of stepped ── */
  .wf-row.wst .wf-label>span:not(.wf-num){color:var(--txt)}
  .wf-row.wst.top .wf-label>span:not(.wf-num){font-weight:700;color:var(--ink)}
  .wf-cum{width:4.7em;flex:none;padding-left:.8em;text-align:right;font-size:var(--fs-small);color:var(--mut);
    font-variant-numeric:tabular-nums}
  .wf-row.wtot{border-top:1px solid var(--line);margin-top:5px;padding-top:5px}
  .wf-row.wtot .wf-label>span:not(.wf-num){font-weight:700;color:var(--ink)}

  /* The CSS for the four instrument views that were removed - the engine cards, the sanity
     check cards and the reconciliation boxes - went with them. Dead CSS is not free: it is
     where a stray font size hides from a scale audit, and where the next person looks for a
     view that no longer exists. */

  /* ── Benchmark view: three ranked columns, stacked ──
     No axis and no team labels on the face. The value is on this team's bar, the rank is the
     bar's position, and the band is which side of the dashed lines it falls on, so none of it
     is written out twice. Everything else is in the hover. */
  #art{--bnpeer:#B8C4D4}
  #art[data-t="dark"]{--bnpeer:#4A5A6E}
  .bn{max-width:none}
  .bnblk{margin-bottom:calc(var(--ui)*1.6)}
  .bnblk:last-child{margin-bottom:0}
  .bncat{font-size:var(--fs-lead);font-weight:700;color:var(--ink);margin-bottom:calc(var(--ui)*.5)}
  .bnplot{position:relative;height:var(--bnh,150px)}
  .bnbars{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:flex-end;gap:3px}
  .bnbar{flex:1;background:var(--bnpeer);border-radius:2px 2px 0 0;position:relative;cursor:help;transition:filter .12s}
  .bnbar:hover{filter:brightness(.9)}
  .bnbar.me{background:var(--wf-loss)}
  .bnbar .bnv{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:var(--fs-small);
    font-weight:800;color:var(--wf-loss);margin-bottom:3px;white-space:nowrap}
  .bnbase{position:absolute;left:0;right:0;bottom:0;border-bottom:1px solid var(--line)}
  .bnthr{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--mut);pointer-events:none}
  .bnthr.g{border-top-color:var(--wf-value-c)}
  .bnthrl{position:absolute;right:0;font-size:var(--fs-micro);color:var(--mut);background:var(--card);
    padding:0 3px;pointer-events:none;line-height:var(--lh-tight)}
  .bnthrl.g{color:var(--wf-value-c);font-weight:600}
  .bncap{font-size:var(--fs-small);color:var(--mut);margin-top:calc(var(--ui)*.75);
    display:flex;justify-content:space-between;gap:12px}
  #lg .lp i.lstd{background:none;border-top:1px dashed var(--wf-value-c);width:12px;height:0;border-radius:0}
  .bmnote{font-size:.86em;color:var(--mut);line-height:var(--lh-prose);margin:-2px 0 .85em;font-style:italic}
  .bmnote b{color:var(--txt);font-style:normal}

  /* ── insight panel ── */
  /* every size here is relative to .col-ins, whose font-size fitInsights() searches so the
     insights always fill the height of the waterfall beside them */
  /* fitInsights() searches this, but only inside a band around --ui, so the two columns can
     never drift apart the way they did when this was solved and the chart column was not. */
  .col-ins{font-size:var(--ui)}
  .inswrap{display:flex;flex-direction:column;gap:1.35em}
  .ins .inh{display:flex;align-items:flex-start;gap:.65em;margin-bottom:.4em}
  .ins .inum{flex:none;width:1.6em;height:1.6em;border-radius:50%;background:var(--wf-total);color:#fff;
    font-size:.84em;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-top:.15em}
  .ins .inh b{font-size:1.1em;font-weight:700;color:var(--ink);line-height:1.35}
  /* ONE chip on an insight heading: the band against the stated standard. It sits on the heading
     line, so it costs no height, and it is the only verdict the main page carries. */
  .ins .chip{display:inline-flex;align-items:center;gap:.35em;font-size:.8em;font-weight:700;
    padding:.1em .5em;border-radius:99px;vertical-align:.1em;white-space:nowrap;cursor:help;
    line-height:1.5}
  .ins .chip.st.good{background:var(--tint-value);color:var(--wf-value-c)}
  .ins .chip.st.neu{background:var(--tint-amber);color:var(--rag-amber-text)}
  .ins .chip.st.poor{background:var(--tint-loss);color:var(--wf-loss)}
  /* .sev survives for the waste view's share-of-waste note, which is text, not a chip */
  .sev.good{color:var(--wf-value-c)} .sev.neu{color:var(--mut)} .sev.poor{color:var(--wf-loss)}
  .ins ul{margin:0;padding-left:2.9em;list-style:none}
  .ins li{position:relative;font-size:1em;color:var(--txt);line-height:var(--lh-prose);margin-bottom:.3em}
  .ins li::before{content:"";position:absolute;left:-.9em;top:.55em;width:.33em;height:.33em;border-radius:50%;background:var(--mut)}
  .ins .inev{margin:.35em 0 0 2.9em;font-size:.88em;color:var(--mut);font-style:italic}
  .ins.empty .inum{background:var(--rag-na)}
  .ins.empty .inh b{color:var(--rag-na-text)}

  /* ── tables ── */
  .tmeta{font-size:var(--fs-small);color:var(--mut);line-height:var(--lh-prose);
    margin:0 0 calc(var(--ui)*.95);max-width:840px}
  .tmeta b{color:var(--txt);font-weight:700}
  tbody td.run{color:var(--mut);font-variant-numeric:tabular-nums}
  tbody tr.tot td.run{color:var(--ink)}
  .tcard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
  table{border-collapse:collapse;width:100%}
  thead tr{background:var(--navy-fill)}
  th{text-align:left;font-size:var(--fs-micro);letter-spacing:.6px;text-transform:uppercase;color:#DCE4F0;
    font-weight:700;padding:calc(var(--ui)*.78) calc(var(--ui)*1.2);white-space:nowrap}
  th.r{text-align:right}
  td{font-size:var(--fs-body);color:var(--txt);line-height:var(--lh-ui);
    padding:calc(var(--ui)*.72) calc(var(--ui)*1.2);border-bottom:1px solid var(--line);vertical-align:top}
  td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.tot td{font-weight:700;color:var(--ink);background:var(--slate-10)}
  tbody tr.sub td{color:var(--mut);font-style:italic}
  tbody tr.val td:first-child{padding-left:26px}
  tbody tr.tot.val td{background:var(--green-10)}
  td b{color:var(--ink)}
  /* ── the peer cell: a distribution, not two words to translate ── */
  td.pk{padding-top:0;padding-bottom:0;vertical-align:middle}
  .pstrip{position:relative;display:inline-block;width:11em;height:1.5em;vertical-align:middle}
  .pstrip i{position:absolute;display:block}
  .prail{left:0;right:0;top:50%;height:1.5px;margin-top:-.75px;background:var(--line);border-radius:1px}
  .pbox{top:50%;height:.66em;margin-top:-.33em;background:rgba(11,35,71,.16);border-radius:2px}
  .pmed{top:50%;height:.95em;margin-top:-.475em;width:1.5px;background:var(--steel)}
  .pme{top:50%;width:.6em;height:.6em;margin-top:-.3em;margin-left:-.3em;border-radius:50%;
    background:var(--wf-loss);box-shadow:0 0 0 1.5px var(--card)}
  .pme.good{background:var(--wf-value-c)} .pme.neu{background:var(--mut)}
  #art[data-t="dark"] .pbox{background:rgba(255,255,255,.14)}
  .pkey{display:flex;align-items:flex-start;gap:.8em}
  .pkey .pstrip.key{width:5.5em;flex:none;margin-top:-.1em}
  .miss{color:var(--rag-red-text);font-style:italic;font-size:var(--fs-body)}
  .psub{font-size:var(--fs-small);color:var(--mut);margin-top:.25em;line-height:var(--lh-ui)}
  /* the editor panel is 570px: a nowrap header is what pushed the Sources table off its own edge.
     Scoped to .psrc - the calculator's own .mtx tables want their nowrap labels. */
  #ed .psrc{table-layout:fixed}
  #ed .psrc th{white-space:normal}
  #ed .psrc td:first-child,#ed .psrc th:first-child{width:36%;overflow-wrap:anywhere}

  /* ONE FTE basis on the face: days / the contracted year, so every row adds up to the payroll.
     capacityBasis still exists inside the calculation (management days are derived from it) but
     the read-out never shows a second FTE number: two FTE columns is how a deck ends up quoting
     the wrong one. */
  function ofAvail(R,days){return R.availableDays>0?days/R.availableDays:null;}

  /* ───────────────── the nine sanity checks ─────────────────
     Each returns g (green) · a (amber) · r (red) · n (not assessed). */
  function checks(D,R){
    var I=D.inputs||{}, F=I.flags||{}, P=D.provenance||{}, out=[];
    function add(id,name,val,st,why,thr){out.push({id:id,name:name,value:val,st:st,why:why,thr:thr});}

    var mg=ofAvail(R,R.mgtDays);
    add('mgmt','Management share',pct(mg),
      mg>=0.08&&mg<=0.12?'g':(mg>=0.06&&mg<=0.15?'a':'r'),
      mg<0.08?'Below the band. Either the manager carries operational work that belongs in process time, or the span of control is wide. Validate against the org baseline.'
             :(mg>0.12?'Above the band. Usually a narrow span of control. Validate against the org baseline.':'Inside the 8–12% band.'),
      '8–12% of available time');

    var tm=ofAvail(R,R.trnDays+R.mtgDays);
    add('trnmtg','Training + meetings',pct(tm), tm>0.25?'a':'g',
      tm>0.25?'High. Check the line items for invisible operational work booked as a meeting.':'Inside the normal range.',
      'amber above 25% of available time');

    var rg=ofAvail(R,R.rigDays);
    add('rigidity','Rigidity',pct(rg),
      rg>=0.15?'g':(F.idleTimeObserved?'r':'a'),
      rg>=0.15?'At or above the 15% floor.'
             :(F.idleTimeObserved?'Below 15% while idle time, waiting or skill silos were observed in the interviews. The two cannot both be true, so rigidity is understated or another category absorbs it.'
                                 :'Below 15%. Confirm no idle time or waiting was observed. If it was, this is a contradiction, not a low score.'),
      'at least 15%, red if idle time was observed');

    var vr=ofAvail(R,R.varDays);
    add('variability','Variability',pct(vr),
      vr>=0.02?'g':(F.senioritySpread?'r':'a'),
      vr>=0.02?'Non-zero and consistent with the seniority profile.'
             :(F.senioritySpread?'Near zero despite a wide seniority spread. Check the levels: if everybody is scored at the reference level the model has nothing to measure.'
                                :'Near zero. That means the team is scored at a uniform level. Confirm that is really the case.'),
      'at least 2%, red if a wide seniority spread was recorded');

    /* The overlap the house sheet never reconciles: rigidity is a productivity loss across all
       operational time, and the waste questions book part of the same hours again. */
    if(R.lossOfOps==null) add('overlap','Rigidity + waste','n/a','n','No operational time to measure.','at most 65% of operational time');
    else add('overlap','Rigidity + waste',pct(R.lossOfOps),
      R.lossOfOps<=0.65?'g':(R.lossOfOps<=0.85?'a':'r'),
      R.lossOfOps>0.65?('Together they claim '+pct(R.lossOfOps)+' of operational time. Rigidity is a productivity loss across all of that time, and the waste questions book part of the same hours again: waiting and searching are WHY productivity is below 100%. Reconcile them with the team before either number goes on a slide.')
                      :'The two estimates leave enough productive time between them to be credible.',
      'at most 65% of operational time');

    var pr=R.procPctAvail;
    add('process','Process time',pct(pr),
      pr>0.45?'a':(pr<0.20?'r':'g'),
      pr>0.45?'Residual above 45%. Rigidity or variability is probably understated, so the waterfall is deducting too little.'
             :(pr<0.20?'Residual below 20%. Something above it is overstated, or work is being double-counted.':'Inside the 20–45% range.'),
      '20–45% of available time');

    if(R.valueAssessed){ var ote=R.ote||0, neg=R.remainderDays<0;
      add('ote','OTE',pct(ote,0), neg?'r':((ote>=0.15&&ote<=0.50)?'g':'a'),
        neg?'NEGATIVE. The measured waste exceeds the whole process-time residual, so the deductions above it cannot all be right. Fix the inputs before this goes anywhere.'
        :(ote>0.50?'Above 50%. Very few service teams turn half of available time into value-added work. Revisit the waste answers with the business.'
        :(ote<0.15?'Below 15%. Either the losses above are overstated or this team is in real trouble. Walk the waterfall before it goes on a slide.'
                 :'Inside the plausible band for a top-down OTE.')),
        '15–50% of available time'); }
    else add('ote','OTE','not assessed','n',
      'Waste is measured, but the remaining process time has not been split into business value and customer value, so there is no OTE. That split is the point of the instrument, not an optional extra.',
      'needs the business/customer split');

    var cats=rowsFor(D,R).filter(function(c){return c.prov;}), miss=[], mism=[];
    var ref=(D.referencePeriod||{}).label||'';
    /* only MEASURED categories share the one-year window; an estimated category is a
       point-in-time assessment, so its own period is expected (reference.md §1). */
    cats.filter(function(c){return c.type==='measured';}).forEach(function(c){ var e=(D.provenance||{})[c.id];
      if(!e||!e.period) miss.push(c.label); else if(ref && e.period!==ref) mism.push(c.label+' ('+e.period+')'); });
    add('period','Reference periods', miss.length?('not recorded ×'+miss.length):(mism.length?('mismatched ×'+mism.length):'aligned'),
      (miss.length||mism.length)?'a':'g',
      miss.length?('No period recorded for: '+miss.join(', ')+'. A number without a window cannot be compared with the rest.')
        :(mism.length?('These datasets sit outside '+ref+': '+mism.join(', ')+'. Keep it only if the deviation is deliberate and recorded.')
                    :('Every dataset carries the same window ('+ref+').')),
      'all datasets on one window');

    var mth=D.methods||{}, nomethod=[];
    ['rigidity','variability','waste'].forEach(function(k){ if(!mth[k]) nomethod.push(k); });
    var nosource=cats.filter(function(c){var e=(D.provenance||{})[c.id];return !e||!e.source;}).map(function(c){return c.label;});
    add('method','Method & source recorded',
      (nomethod.length||nosource.length)?'incomplete':'complete',
      (nomethod.length?'r':(nosource.length?'a':'g')),
      nomethod.length?('No method recorded for: '+nomethod.join(', ')+'. An estimate without a stated method is not a finding.')
        :(nosource.length?('No source recorded for: '+nosource.join(', ')+'. Those numbers are excluded from the pass.')
                        :'Every estimate states its method and every category cites its source.'),
      'method + source on every category');
    return out;
  }


  /* ───────────────── category spine (drives every view) ───────────────── */
  /* Colour ENCODES the evidence type, it does not decorate: navy = a total, steel = the gross-to-net
     step, mid blue = a measured deduction, sky = an estimated one, green = the derived residual.
     That is the legend already in the footer, so the chart explains itself. */
  var C_TOT='var(--wf-total)', C_STRUCT='var(--wf-struct)', C_LOSS='var(--wf-loss)',
      C_VAL_B='var(--wf-value-b)', C_VAL_C='var(--wf-value-c)';
  var CATS=[
    {id:'paid-time',   label:'Paid time',            kind:'total',  type:'measured',   prov:true,  col:C_TOT},
    {id:'absences',    label:'Absences (leave, sick, …)',  kind:'deduct', type:'measured',   prov:true,  col:C_STRUCT},
    {id:'available',   label:'Available time (in the seat)',       kind:'total',  type:'calculated', prov:false, col:C_TOT},
    {id:'management',  label:'Management',           kind:'deduct', type:'measured',   prov:true,  col:C_STRUCT, band:true},
    {id:'trainings',   label:'Trainings / Projects / Coaching',   kind:'deduct', type:'measured',   prov:true,  col:C_STRUCT, band:true},
    {id:'meetings',    label:'Meetings',             kind:'deduct', type:'measured',   prov:true,  col:C_STRUCT, band:true},
    {id:'rigidity',    label:'Rigidity',             kind:'deduct', type:'estimated',  prov:true,  col:C_LOSS,   band:true},
    {id:'variability', label:'Variability',          kind:'deduct', type:'estimated',  prov:true,  col:C_LOSS,   band:true},
    {id:'process-time',label:'Total process time',   kind:'total',  type:'derived',    prov:false, col:C_TOT},
    /* waste is MEASURED bottom-up from the ten questions; only the split below it is judged */
    {id:'waste',          label:'Waste',           kind:'deduct', type:'assessed',  prov:true, col:C_LOSS,  band:true, value:true},
    {id:'business-value', label:'Business value',  kind:'deduct', type:'estimated', prov:true, col:C_VAL_B, band:true, value:true},
    {id:'customer-value', label:'Customer value',  kind:'deduct', type:'estimated', prov:true, col:C_VAL_C, band:true, value:true}
  ];
  /* The engagement may rename the three value rows (for example value enabling / value adding).
     Defaults are the house labels. */
  function catLabel(D,c){ return ((D.inputs&&D.inputs.valueSplit&&D.inputs.valueSplit.labels)||{})[c.id] || c.label; }
  function rowsFor(D,R){ return CATS.filter(function(c){ return !c.value || R.valueAssessed; }); }
  /* What each bucket MEANS. A tooltip earns its place only when it adds something the row does
     not already show, so these are definitions, never a repeat of the number. */
  /* CLIENT-FACING COPY. Everything in here is read over someone's shoulder in a session, so it
     is written the way you would say it: short sentences, no house vocabulary, and none of the
     "not a judgement, an assessment" phrasing this file used to be full of. */
  /* CLIENT-FACING COPY, and not ours to phrase. Every definition below is quoted from the
     Nova Reperta OTE Waterfall guidelines, slide 18, with one method note added where the
     TOP-DOWN direction changes how the row is produced (annex slide 49). assets/terms.json
     is the authority and check_docs.py fails a build that has drifted from it. */
  var DEFS={
    'paid-time':'Total contracted hours of all team members. Counted here in days: contracted days per year times FTE, plus overtime where it is real and not automatically compensated.',
    'absences':'Non-productive time unavailable for work (sick leave, vacation, and public holidays).',
    'available':'Total team time available on the floor, excluding (prolonged) sick leave, vacation, and public holidays. This is the 100 on the chart. Everything below is a share of it.',
    'management':'Total time spent on management activities, both by managers and others (e.g. product specialists, team leads). All non-management tasks of managers belong in process time, not here.',
    'trainings':'Team time spent on trainings, (on the job) coaching, projects, and meetings related to development or improvement. For team members only, not managers.',
    'meetings':'Time spent in operational, recurring, or ad hoc meetings not captured under trainings or projects.',
    'rigidity':'Lost productive time due to mismatch between demand and supply, and rigidity in how work is organised (e.g. excess breaks, scheduling inefficiencies). Estimated here on the two criteria of the house rigidity template: the number of peak and low days in a month, and how many people have a lead rather than a follower profile.',
    'variability':'Additional process time required because team members perform below the average senior level due to skill differences or being newer to the role. Two things sit inside it: competence variability, the difference between juniors and seniors, and individual variability, the difference between people at the same level. Both are estimated here together, from one seniority profile. The reference is the average senior - the level marked as expected - and only the people below it are counted.',
    'process-time':'Total productive time needed for average senior team members to complete all production work, based on standard times (norm times). In a top-down waterfall this is not measured. It is what is left of available time once management, trainings, meetings, variability and rigidity are taken off.',
    'waste':'Portion of total process time spent on activities that add no direct value for the customer or the business. Assessed with the team through ten fixed questions, in minutes per person per workday.',
    'business-value':'Portion of total process time spent on activities that add indirect value - necessary for the organisation but not directly perceived by the customer. The customer is not willing to pay for it, but production needs it: required controls, testing, back-office services.',
    'customer-value':'Portion of total process time spent on activities that directly deliver value to the customer. The test is whether the customer is willing to pay for the activity.'
  };
  function catDays(R,id){
    return {'paid-time':R.paidDays,'absences':R.absenceDays,'available':R.availableDays,
      'management':R.mgtDays,'trainings':R.trnDays,'meetings':R.mtgDays,'rigidity':R.rigDays,
      'variability':R.varDays,'process-time':R.procDays,
      'waste':R.wasteDays,'business-value':R.businessValueDays,'customer-value':R.customerValueDays}[id];
  }

  /* ───────────────── views ─────────────────
     LAYER = "the edit layer is present in this build". Hoisted OUTSIDE the fences and set to
     true inside them, so one copy of the render code serves both builds: the client file emits
     no lock affordances at all (its markup AND its CSS are stripped together). */
  var LAYER=false;
  function lockchip(){return LAYER?'<span class="lockchip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>locked</span>':'';}
  function lockAttrs(kind){return LAYER?' class="wfwrap nr-locked" data-lock="'+kind+'"':' class="wfwrap"';}

  /* ── the main slide: waterfall left, insights right (the house layout) ──
     Everything is INDEXED TO AVAILABLE TIME = 100, so paid time reads above 100 (e.g. 129).
     That is the convention the read-out is titled on: "current state OTE, %". */
  function idx(R,days){ return R.availableDays>0 ? days/R.availableDays*100 : 0; }

  function vWaterfall(D,R){
    var list=rowsFor(D,R), maxI=idx(R,R.paidDays)||100, run=R.paidDays, out='';
    /* Number the callouts in waterfall order, so the badge on a bar and the badge on its
       insight card are the same number. */
    var anns=(D.annotations||[]).filter(function(a){return WID.indexOf(a.categoryId)<0;});
    var num={}, k=0;
    list.concat([{id:'value-added'}]).forEach(function(c){
      if(anns.some(function(a){return a.categoryId===c.id;})) num[c.id]=++k; });

    list.forEach(function(c){
      var days=catDays(R,c.id), left, w=idx(R,days)/maxI*100;
      if(c.kind==='total'){ left=0; run=days; }
      else { run-=days; left=idx(R,run)/maxI*100; }
      var sep = (c.id==='available'||c.id==='process-time') ? '<div class="wf-sep"></div>' : '';
      /* the value-added call-out numbers BOTH value rows, since it is about the pair of them.
         Waste is a loss, not a value row, so it never picks that badge up. */
      var isVal = (c.id==='business-value'||c.id==='customer-value');
      var bn = num[c.id] || (isVal ? num['value-added'] : 0);
      var badge = bn?'<span class="wf-num'+(isVal?' vnum':'')+'">'+bn+'</span>':'';
      var val=Math.round(idx(R,days)), inBar=w>7;
      var row=sep+'<div class="wf-row'+(c.kind==='total'?' tot':'')+(c.value?' val':'')+'"'+
        (DEFS[c.id]?' data-tip="'+c.id+'"':'')+'>'+
        '<div class="wf-label">'+badge+'<span>'+esc(catLabel(D,c))+'</span></div>'+
        '<div class="wf-track"><div class="wf-bar" style="left:'+left.toFixed(2)+'%;width:'+Math.max(0.5,w).toFixed(2)+'%;background:'+c.col+'">'+
          (inBar?'<span>'+val+'</span>':'')+'</div>'+
          (inBar?'':'<span class="wf-out" style="left:calc('+(left+w).toFixed(2)+'% + 7px)">'+val+'</span>')+
        '</div><div class="wf-fte">'+d1(cFte(R,days))+'</div></div>';
      out+=row;
    });

    var oteBox = R.valueAssessed
      ? '<div class="otebox"><div class="oteeq">OTE =</div>'+
        '<div class="otef"><span class="num">Value added time</span><span class="den">Available time</span></div>'+
        '<div class="oteres">= '+Math.round(R.ote*100)+'%</div>'+
        '<div class="otenote">'+d0(R.valueAddedDays)+' of '+d0(R.availableDays)+' days<br>'+d1(cFte(R,R.valueAddedDays))+' of '+d1(R.fte)+' FTE</div></div>'
      : '<div class="otebox na"><b>No OTE yet.</b> The chart stops at waste until the business and customer value split has been made with the business. That split is what gives the OTE.</div>';

    return '<div class="slide">'+
      '<section class="col-wf"><h3 class="sech">Current state OTE, %</h3>'+
      '<div'+lockAttrs('derived')+'><div class="wfmeta"><span>Indexed to available time = 100 &middot; '+
        d1(R.fte)+' FTE contracted &middot; '+d0(R.availableDays)+' available days'+lockchip()+'</span><span class="fteh">FTE</span></div>'+
        out+'</div>'+oteBox+'</section>'+
      '<section class="col-ins"><h3 class="sech">Insights and key sources of inefficiencies</h3>'+
      bmNote(D,R,false)+
      '<div class="inswrap">'+insightList(D,R,num,anns)+'</div></section></div>';
  }


  /* The comparison chip. It says WHICH population and HOW MANY teams, because a quartile of
     five teams and a quartile of forty are different claims. Direction-aware: more waste is
     worse, more customer value is better, and overheads are neither. */
  function bmClass(b){ if(!b) return '';
    if(b.direction==='neutral') return 'neu';
    var good=(b.direction==='worse')?(b.quartile<=2):(b.quartile>=3);
    return good?'good':'poor'; }
  /* NO PEER CHIP ON THE WATERFALL. The band against the standard - good, medium, high - is the
     whole verdict the main page needs; "third of 13" beside it is a second scale the reader has to
     hold at the same time, on the page that is already carrying the cascade. The peer comparison
     lives where it can be seen properly: the Benchmark view and the strip in the detailed table.
     bmClass survives because the peer strip colours its dot with it. */
  /* The STATED standard. Worded as distance from good, never as an outlier: on these engines
     most teams read high on rigidity and variability, and that is the intended reading. */
  var STDCLASS={good:'good',medium:'neu',high:'poor'};
  function stdChip(t){ if(!t) return '';
    var d='Against '+esc(t.label||'the standard')+
      (t.author?', stated by '+esc(t.author):'')+': good below '+pct(t.good,0)+
      ', medium to '+pct(t.medium,0)+', high above. A stated standard from experience, '+
      'not measured industry data, and deliberately demanding.';
    return ' <span class="chip st '+STDCLASS[t.band]+'" data-tiph="'+esc(t.band)+' against the standard"'+
      ' data-tipb="'+d+'">'+esc(t.band)+'</span>'; }

  /* One line naming what a band on this page is a band OF, so a word like "high" is never
     floating. It names only what the page in front of the reader actually shows: the waterfall
     carries the stated standard, the benchmark view carries both. */
  function bmNote(D,R,withPeers){
    var sets=refsets(D), parts=[];
    var meas=null, st=null;
    sets.forEach(function(x){ if(!meas&&(x.population==='engagement'||x.population==='library')) meas=x;
                              if(!st&&x.population==='standard') st=x; });
    if(st && Object.keys(R.std||{}).length)
      parts.push('<b>'+esc(st.label||'the standard')+'</b>, a stated standard from experience '+
                 'and deliberately demanding, not measured industry data');
    if(withPeers){
      if(meas && Object.keys(R.bench||{}).length)
        parts.push('<b>'+esc(meas.label||'teams measured before')+'</b>, quartiles of what was '+
                   'actually measured');
      else if(meas)
        parts.push('no measured comparison yet: fewer than '+MIN_N+' teams on this method');
    }
    if(!parts.length) return '<div class="bmnote">No standard loaded, so these are this team\'s '+
      'figures on their own</div>';
    var tail = (!withPeers && meas && Object.keys(R.bench||{}).length)
      ? '. How this team compares with the other teams measured is on the Benchmark tab' : '';
    return '<div class="bmnote">Compared with '+parts.join(' &middot; ')+tail+'</div>'; }

  function insightList(D,R,num,anns){
    if(!anns.length) return '<div class="ins empty" data-ann="-1"><div class="inh"><span class="inum">+</span>'+
      '<b>No findings written</b></div><ul><li>The chart shows the numbers. It does not yet say what they mean.</li>'+
      '<li>Add one note per category that matters: what is behind it, how big it is, and what it costs the team.</li></ul></div>';
    var all=(D.annotations||[]);
    return anns.map(function(a){
      var i=all.indexOf(a);
      var c=CATS.filter(function(x){return x.id===a.categoryId;})[0];
      var days=c?catDays(R,c.id):(a.categoryId==='value-added'?R.valueAddedDays:null);
      var pa=(days!=null&&R.availableDays>0)?days/R.availableDays:null;
      var st=(R.std||{})[a.categoryId];
      var head=(c?catLabel(D,c):(a.categoryId==='value-added'?'Value added time':'Other findings'))+
        (pa!=null?': '+Math.round(pa*100)+'%':'')+stdChip(st);
      var bl=(a.bullets&&a.bullets.length)?a.bullets:(a.text?[a.text]:[]);
      return '<div class="ins" data-ann="'+i+'"><div class="inh"><span class="inum">'+(num[a.categoryId]||'&bull;')+'</span>'+
        '<b>'+head+'</b></div><ul>'+bl.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>'+
        '<div class="inev">'+esc(a.evidence||'no evidence recorded')+'</div></div>';
    }).join('');
  }


  /* ── Where time is wasted: the ten questions ranked ──
     Same furniture as the waterfall (.wf-row / .wf-track / .wf-bar), so fitRows and fitInsights
     size this view too, and a client reads the second slide the way they read the first. */
  var WID=WASTE_ITEMS.map(function(w){return w[0];});
  function cap(t){t=String(t||'');return t.charAt(0).toUpperCase()+t.slice(1);}

  function vWaste(D,R){
    var items=(R.wasteItems||[]).slice().sort(function(a,b){return b.minutesPerDay-a.minutesPerDay;});
    var tot=R.wasteMinutesPerDay||0, mx=items.length?Math.max(0.0001,items[0].minutesPerDay):1;
    var dPerMin = tot>0 ? R.wasteDays/tot : 0;
    /* Number the call-outs in bar order, exactly as the waterfall does, so a badge on a bar and
       the badge on its card are the same number. */
    var anns=(D.annotations||[]).filter(function(a){return WID.indexOf(a.categoryId)>=0;});
    var num={}, k=0;
    items.forEach(function(w){ if(anns.some(function(a){return a.categoryId===w.id;})) num[w.id]=++k; });
    var run=0, out='';
    items.forEach(function(w,i){
      var m=w.minutesPerDay||0; run+=m;
      var wpc=m/mx*100, cat=WASTE_ITEMS.filter(function(x){return x[0]===w.id;})[0];
      var badge = num[w.id]?'<span class="wf-num">'+num[w.id]+'</span>':'';
      var lb=cap(w.label);
      out+='<div class="wf-row wst'+(i<3?' top':'')+'" data-tiph="'+esc(lb)+
          '" data-tipb="'+esc(cat?cat[2]:'')+'">'+
        '<div class="wf-label">'+badge+'<span>'+esc(lb)+'</span></div>'+
        '<div class="wf-track"><div class="wf-bar" style="left:0;width:'+Math.max(0.6,wpc).toFixed(2)+
          '%;background:var(--wf-loss)'+(i<3?'':';opacity:.62')+'">'+(wpc>16?'<span>'+d0(m)+' min</span>':'')+'</div>'+
          (wpc>16?'':'<span class="wf-out" style="left:calc('+Math.max(0.6,wpc).toFixed(2)+'% + 7px)">'+d0(m)+' min</span>')+
        '</div><div class="wf-fte">'+d1(cFte(R,m*dPerMin))+'</div>'+
        '<div class="wf-cum">'+pct(tot>0?run/tot:null,0)+'</div></div>';
    });
    /* The three summary cards under the chart are gone: they restated this row in three boxes and
       took a third of the canvas to do it. Nothing unique went with them - the share of available
       time is the waste bar on the waterfall, and the days are in the detailed table. This line
       stays short on purpose: the track ends where the FTE column begins. */
    out+='<div class="wf-row wtot"><div class="wf-label"><span>Total measured waste</span></div>'+
      '<div class="wf-track"><span class="wf-out" style="left:0">'+d0(tot)+' min per person per workday, '+
        pct(R.wasteShareOfDay,0)+' of an '+d1(R.hoursPerDay)+'h day</span></div>'+
      '<div class="wf-fte">'+d1(cFte(R,R.wasteDays))+'</div><div class="wf-cum">100%</div></div>';

    return '<div class="slide">'+
      '<section class="col-wf" style="--labw:calc(var(--ui)*28.5)"><h3 class="sech">Where the time goes, minutes per workday</h3>'+
      '<div class="wfwrap"><div class="wfmeta"><span>The ten questions, ranked largest first. '+
        '<b>Cumulative</b> is the running share of all measured waste.</span>'+
        '<span class="fteh">FTE</span><span class="cumh">cumulative</span></div>'+out+'</div></section>'+
      '<section class="col-ins"><h3 class="sech">Insights</h3>'+
      '<div class="inswrap">'+wasteInsights(D,R,anns,num,items)+'</div></section></div>';
  }

  /* The insight panel is AUTHORED, like the waterfall's. It carries what the team said about a
     particular waste question, never a restatement of the arithmetic already on the bar beside it. */
  function wasteInsights(D,R,anns,num,items){
    if(!anns.length) return '<div class="ins empty" data-ann="-1"><div class="inh"><span class="inum">+</span>'+
      '<b>No findings written</b></div><ul><li>There are ten answers here, and nothing yet about what sits '+
      'behind them.</li><li>Write one note per question that matters: what actually happens, how often, and '+
      'what it costs the team.</li></ul></div>';
    var byId={}; items.forEach(function(w){byId[w.id]=w;});
    var tot=R.wasteMinutesPerDay||0, dPerMin = tot>0 ? R.wasteDays/tot : 0;
    return anns.map(function(a){
      var w=byId[a.categoryId], m=w?w.minutesPerDay:0;
      /* no per-question population exists yet, so this states the share of THIS team's waste,
         which is arithmetic, and makes no comparison it cannot support */
      var head=esc(cap(w?w.label:a.categoryId))+': '+d0(m)+' min'+
        (tot>0?' <span class="sev neu">('+pct(m/tot,0)+' of waste, '+
          d1(cFte(R,m*dPerMin))+' FTE)</span>':'');
      var bl=(a.bullets&&a.bullets.length)?a.bullets:(a.text?[a.text]:[]);
      return '<div class="ins" data-ann="'+(D.annotations||[]).indexOf(a)+'"><div class="inh">'+
        '<span class="inum">'+(num[a.categoryId]||'&bull;')+'</span><b>'+head+'</b></div>'+
        '<ul>'+bl.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>'+
        '<div class="inev">'+esc(a.evidence||'no evidence recorded')+'</div></div>';
    }).join('');
  }

  /* The detailed table. It ships in BOTH builds: the waterfall states the shape, this states the
     numbers, and a client who wants the arithmetic should be able to see it.
     ONE FTE column. Two columns on different bases is how the wrong one gets quoted. */
  /* THE PEER CELL. `17% third q` was two things a reader has to translate before either says
     anything. This draws the distribution instead: the box is the middle half of the reference
     teams, the tick is their median, the dot is this team - on the good or the bad side, with
     direction respected, so more customer value reads green and more waste reads crimson.
     It also shows what a quartile word cannot: the SHAPE of the field. Rigidity is a wide spread
     and this team sits just past the middle of it; variability is a tight cluster and the same
     team sits at its edge. Same word, different finding. */
  function peerStrip(D,R,cid){
    var bm=(R.bench||{})[cid]; if(!bm) return '';
    var s=seriesSet(D), xs=s?((s.series||{})[cid]||null):null;
    var q1=null,q2=bm.median,q3=null;
    var b=null; refsets(D).forEach(function(x){
      if(!b&&(x.population==='engagement'||x.population==='library')) b=x; });
    var e=b?((b.categories||{})[cid]||null):null; if(!e) return '';
    q1=+e.q1; q3=+e.q3;
    var lo,hi;
    if(xs&&xs.length){ lo=xs[0].v; hi=xs[0].v;
      xs.forEach(function(x){ if(x.v<lo)lo=x.v; if(x.v>hi)hi=x.v; }); }
    else { var iqr=Math.max(1e-9,q3-q1); lo=q1-iqr*0.6; hi=q3+iqr*0.6; }
    /* the team's own dot is never off the end of its own strip */
    lo=Math.min(lo,bm.value); hi=Math.max(hi,bm.value);
    var sp=hi-lo; if(!(sp>0)) return '';
    var P=function(x){ return ((x-lo)/sp*100).toFixed(2)+'%'; };
    return '<span class="pstrip" title="'+esc(bm.band)+' of '+bm.n+' teams; their median is '+
      pct(bm.median,0)+'"><i class="prail"></i>'+
      '<i class="pbox" style="left:'+P(q1)+';width:'+((q3-q1)/sp*100).toFixed(2)+'%"></i>'+
      '<i class="pmed" style="left:'+P(q2)+'"></i>'+
      '<i class="pme '+bmClass(bm)+'" style="left:'+P(bm.value)+'"></i></span>';
  }

  function vDetail(D,R){
    /* The cascade in numbers. Two columns have been tried and removed here: a delta that restated
       the days as a negative, and a running balance headed "Left" that needed a sentence of its
       own to be read at all. A column a reader cannot use without a footnote is not earning its
       place; days, share of available and FTE each read on their own row. */
    var out='', hasBench=Object.keys(R.bench||{}).length>0;
    rowsFor(D,R).forEach(function(c){
      var days=catDays(R,c.id);
      var ofProc = c.value ? ' <span style="color:var(--mut)">('+pct(R.procDays>0?days/R.procDays:null,0)+' of process)</span>' : '';
      out+='<tr class="'+(c.kind==='total'?'tot':'')+(c.value?' val':'')+'"'+
        (DEFS[c.id]?' data-tip="'+c.id+'"':'')+'><td><b>'+esc(catLabel(D,c))+'</b></td>'+
        '<td class="r">'+d0(days)+'</td>'+
        '<td class="r">'+pct(ofAvail(R,days))+ofProc+'</td>'+
        '<td class="r">'+d1(cFte(R,days))+'</td>'+
        (hasBench?'<td class="r pk">'+peerStrip(D,R,c.id)+'</td>':'')+
        '</tr>';
    });
    if(R.valueAssessed){
      out+='<tr class="tot val"><td><b>Value added time</b> <span style="font-weight:400;color:var(--mut)">(business + customer)</span></td>'+
        '<td class="r">'+d0(R.valueAddedDays)+'</td><td class="r"><b>OTE '+pct(R.ote,0)+'</b></td>'+
        '<td class="r">'+d1(cFte(R,R.valueAddedDays))+'</td>'+
        (hasBench?'<td class="r pk">'+peerStrip(D,R,'value-added')+'</td>':'')+
        '</tr>'; }
    else
      out+='<tr><td colspan="'+(hasBench?5:4)+'"><span class="naChip">n/a</span> <span style="color:var(--mut);font-size:var(--fs-small)">Business value and customer value not assessed for this team, so there is no OTE. The waterfall stops at waste.</span></td></tr>';
    var meas=null; refsets(D).forEach(function(x){
      if(!meas&&(x.population==='engagement'||x.population==='library')) meas=x; });
    return '<h3 class="sech">The same cascade, in days and FTE</h3>'+
      '<div class="tmeta"><span>Every row is deducted from the one above it. Percentages are of '+
        '<b>available time</b> ('+d0(R.availableDays)+' days), which is why paid time reads above '+
        '100%.</span></div>'+
      '<div class="tcard"><table data-stretch><thead><tr><th>Category</th><th class="r">Days</th>'+
      '<th class="r">% of available</th><th class="r">FTE</th>'+
      (hasBench?'<th class="r">vs the '+((R.bench||{})['rigidity']||(R.bench||{})['waste']||{}).n+
        ' teams</th>':'')+'</tr></thead>'+
      '<tbody>'+out+'</tbody></table></div>'+
      (hasBench?'<div class="tmeta pkey" style="margin:.8em 0 0">'+
        '<span class="pstrip key"><i class="prail"></i><i class="pbox" style="left:22%;width:44%"></i>'+
        '<i class="pmed" style="left:47%"></i><i class="pme" style="left:66%"></i></span>'+
        'Across '+esc((meas||{}).label||'the reference teams')+', on the same share of available '+
        'time: the <b>box</b> covers the middle half of them, the <b>tick</b> is their middle '+
        'value and the <b>dot</b> is this team. Green means this team is on the better side of '+
        'that middle value for that row, red the worse side.</div>':'');
  }

  /* ── Benchmark: where this team sits among the teams measured in the same engagement ──
     Three ranked columns, stacked. Every team is a bar, sorted best to worst, this team in
     crimson; the standard is two dashed lines across the plot. The face carries the category
     name, the bars, the lines and one number - the team, its share and its rank are all in the
     hover, because writing them out repeats what the picture already says. */
  function vBench(D,R){
    var s=seriesSet(D), blocks=[];
    BENCH_VIEW.forEach(function(cid){
      var br=benchRows(D,R,cid); if(!br) return;
      var c=CATS.filter(function(x){return x.id===cid;})[0], sd=(R.std||{})[cid];
      var mx=0; br.rows.forEach(function(r){ if(r.v>mx) mx=r.v; });
      var top=mx*1.12||1, P=function(x){return (x/top*100).toFixed(2)+'%';};
      var thr='';
      if(sd){
        thr='<div class="bnthr g" style="bottom:'+P(sd.good)+'"></div>'+
            '<span class="bnthrl g" style="bottom:'+P(sd.good)+';margin-bottom:1px">good &lt;'+pct(sd.good,0)+'</span>'+
            '<div class="bnthr" style="bottom:'+P(sd.medium)+'"></div>'+
            '<span class="bnthrl" style="bottom:'+P(sd.medium)+';margin-bottom:1px">medium &lt;'+pct(sd.medium,0)+'</span>'; }
      var bars=br.rows.map(function(r,i){
        var band=sd?(r.v<sd.good?'good':(r.v<=sd.medium?'medium':'high')):null;
        return '<div class="bnbar'+(r.me?' me':'')+'" style="height:'+P(r.v)+'"'+
          ' data-tiph="'+esc(r.team)+'" data-tipb="'+pct(r.v,1)+' of available time. '+
          ordn(i+1)+' lowest of '+br.n+' teams'+(band?', '+band+' against the standard':'')+'.">'+
          (r.me?'<span class="bnv">'+pct(r.v,0)+'</span>':'')+'</div>'; }).join('');
      blocks.push('<div class="bnblk"><div class="bncat">'+esc(c?catLabel(D,c):cid)+'</div>'+
        /* the threshold lines paint OVER the bars: a line that a solid bar hides is a line
           nobody sees, and crossing the bars is how a reference line is read anyway */
        '<div class="bnplot"><div class="bnbars">'+bars+'</div>'+thr+'<div class="bnbase"></div></div></div>');
    });
    if(!blocks.length) return '<h3 class="sech">Benchmark</h3><div class="tmeta"><span>'+
      'No engagement benchmark is loaded, so there is nothing to rank this team against.</span></div>';
    var n=(R.benchRank[BENCH_VIEW[0]]||{}).n||0;
    return '<div class="slide">'+
      '<section class="col-wf bn"><h3 class="sech">Where this team ranks among the '+n+
        ' teams measured</h3><div class="bn">'+blocks.join('')+'</div>'+
        '<div class="bncap"><span>Each bar is one team, best to worst &rarr;</span>'+
        '<span>hover a bar for the team, its share and its rank</span></div></section>'+
      '<section class="col-ins"><h3 class="sech">Reading the benchmark</h3>'+
      bmNote(D,R,true)+'<div class="inswrap">'+benchList(D,R,s)+'</div></section></div>';
  }
  /* Authored, like every other insight panel on this instrument. A ranking that writes its own
     commentary produces sentences that restate the chart; what a client needs is what the
     consultant concluded from it. */
  function benchList(D,R,s){
    var list=(D.benchmarkInsights||[]).filter(function(x){return x&&(x.title||x.bullets);});
    if(!list.length) return '<div class="ins empty"><div class="inh"><span class="inum">+</span>'+
      '<b>No reading written</b></div><ul><li>The ranking is here, but not what it means for this '+
      'organisation.</li><li>Two or three notes: where this team sits, what the gap between the best and '+
      'the worst team tells you, and where to start.</li>'+
      '</ul></div>';
    return list.map(function(x,i){
      return '<div class="ins"><div class="inh"><span class="inum">'+(i+1)+'</span><b>'+
        esc(x.title||'')+'</b></div><ul>'+
        (x.bullets||[]).map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul></div>'; }).join('');
  }

  /* FOUR VIEWS, in both builds. The waterfall states the answer, the waste view states where the
     time goes, the benchmark places the team among its peers, the table states the numbers behind
     all three. Provenance, the sanity checks and the baseline reconciliation are still COMPUTED,
     still written to the capture and still enforced by check_ote.py: they are consultant
     apparatus, so they belong in the gate, not on a tab.
     The benchmark tab appears only when an ENGAGEMENT benchmark with a series is loaded - a tab
     that renders an apology is worse than no tab. */
  var VIEWS=[['wf','Waterfall',vWaterfall],['waste','Where time is wasted',vWaste]];
  if(seriesSet(DATA)) VIEWS.push(['bench','Benchmark',vBench]);
  VIEWS.push(['detail','Detailed table',vDetail]);
  var cur='wf', R=calc(DATA);

  /* ───────────────── chrome ───────────────── */
  document.getElementById('ctx').textContent=DATA.context||'OPEX QUICKSCAN';
  document.getElementById('lens').textContent=DATA.lens||'BASELINE · OTE WATERFALL';
  document.getElementById('subt').textContent=(DATA.teamName||'')+((DATA.referencePeriod||{}).label?' · '+DATA.referencePeriod.label:'');
  document.getElementById('views').innerHTML=VIEWS.map(function(v,i){return '<button data-v="'+v[0]+'"'+(i===0?' class="on"':'')+'>'+v[1]+'</button>';}).join('');
  function drawMeta(){
    document.getElementById('src').innerHTML=DATA.source?('<b style="color:var(--txt)">Source:</b> '+esc(DATA.source)):'';
    var lg=[['var(--wf-struct)','Structural time'],
            ['var(--wf-loss)','Inefficiency'],
            ['var(--wf-value-c)','Value added']]
      .map(function(x){return '<span class="lp"><i style="background:'+x[0]+'"></i>'+x[1]+'</span>';});
    if(cur==='bench') lg=[['var(--wf-loss)',(DATA.teamName||'this team')],
                          ['var(--bnpeer)','the other teams measured']]
      .map(function(x){return '<span class="lp"><i style="background:'+x[0]+'"></i>'+esc(x[1])+'</span>';})
      .concat(['<span class="lp"><i class="lstd"></i>Best-in-class standard</span>']);
    document.getElementById('lg').innerHTML=lg.join('');
  }
  function drawTitle(){document.getElementById('title').innerHTML=hl(DATA.keyMessage||'');}

  /* Monotonic binary-search fit: the largest scale whose content still fits the frame. It cannot
     overshoot (an iterative fit can oscillate and clip). Capped at 1.0 on purpose — a short view
     stretches to fill rather than magnifying, so body text is the same size on every tab. */
  /* BREATHING ROOM. The fit used to run the content to within 8px of the frame, which is why a
     full slide read as packed. This leaves a deliberate margin at the bottom of every view, the
     same on all four, so the whole deck breathes the same way. */
  function bottomGap(ah){ return Math.max(14, ah*0.035); }

  /* ONE TYPE BASE for the whole slide, solved from the frame and nothing else.
     Deliberately NOT solved from content: a base that depended on how many findings were written
     would make the chart type jump when someone added a bullet. Sub-linear in the frame height,
     so a 1080p slide reads bigger than a 768p one without the chart becoming a poster. */
  function fitUI(ah){
    var art=document.getElementById('art');
    var ui=Math.max(9.5, Math.min(14, ah/52));
    art.style.setProperty('--ui', ui.toFixed(2)+'px');
    return ui; }

  /* TWO PASSES, always. The fit changes the layout it is measuring - row height moves the chart
     column, which moves the insight column's target - and in the working copy the edit layer
     changes it again underneath. One pass can therefore settle on a size solved against a stale
     measurement, which is how the unlocked working copy ended up with 7px insights and content
     past the bottom of the frame. The second pass measures what the first one produced. */
  function fitView(){ fitOnce(); fitOnce(); }
  function fitOnce(){var v=document.getElementById('view'),vi=document.getElementById('vinner');var ah=v.clientHeight;if(!ah)return;
    var st=vi.querySelector('[data-stretch]'); if(st)st.style.height='';
    vi.style.transform='none';vi.style.width='100%';
    var gap=bottomGap(ah);
    /* --ui first: every size downstream is measured in it */
    fitUI(ah); fitRows(ah-gap); fitBench(ah-gap); fitInsights();
    var lo=0.25,hi=1.0,best=0.25;
    for(var k=0;k<12;k++){var s=(lo+hi)/2;vi.style.width=(100/s)+'%';if(vi.scrollHeight*s<=ah-gap){best=s;lo=s;}else{hi=s;}}
    vi.style.width=(100/best)+'%';vi.style.transform='scale('+best+')';
    if(st){var free=(ah-gap)/best-vi.scrollHeight; if(free>1)st.style.height=(st.offsetHeight+free)+'px';}
    /* THE BACKSTOP. scrollHeight is a promise about layout; the painted bottom of the deepest
       element is the fact. They disagree whenever something rewraps after the search - long
       insight prose in a column whose width the search itself just changed is the case that bit
       us, and only in the working copy, where the edit layer moves the goalposts again. So
       measure what is actually on the glass and shrink until it is inside the frame. Three
       passes, because each shrink can rewrap once more. */
    var vt=vi.getBoundingClientRect().top;
    for(var g=0;g<3;g++){
      var fb=v.getBoundingClientRect().bottom-gap, deep=vt;
      vi.querySelectorAll('*').forEach(function(e){var r=e.getBoundingClientRect();
        if(r.height&&r.bottom>deep) deep=r.bottom;});
      if(deep<=fb) break;
      var k=(fb-vt)/(deep-vt); if(!(k>0&&k<1)) break;
      best=Math.max(0.25,best*k);
      vi.style.width=(100/best)+'%'; vi.style.transform='scale('+best+')';
    }}
    /* NO trailing fitInsights here. It used to re-solve the insight column AFTER the scale was
       fixed, so it could grow the prose - and the gaps with it - past the height the scale search
       had just approved: 707px of content inside a 536px frame, with the last finding off the
       bottom. The second pass of fitView does that re-solve and then re-runs the scale search on
       the result, which is the same work in an order that cannot overflow. */
  /* The waterfall fills the frame by growing its ROWS, not by magnifying everything. Height is
     linear in the row height (total = fixed chrome + rows x rowh), so one solve is exact. */
  function fitRows(ah){
    var art=document.getElementById('art'), col=document.querySelector('.col-wf');
    if(!col){ if(art) art.style.removeProperty('--rowh'); return; }
    var rows=col.querySelectorAll('.wf-row').length; if(!rows) return;
    var cur=parseFloat(getComputedStyle(art).getPropertyValue('--rowh'))||29;
    var fixed=col.offsetHeight-rows*cur;
    var h=Math.max(22,Math.min(68,(ah-16-fixed)/rows));
    art.style.setProperty('--rowh',h.toFixed(2)+'px');}
  /* The benchmark charts fill the frame the same way the waterfall does: by growing the PLOTS,
     not by magnifying everything. Height is linear in the plot height, so one solve is exact. */
  function fitBench(ah){
    var art=document.getElementById('art'), col=document.querySelector('.col-wf.bn');
    if(!col){ if(art) art.style.removeProperty('--bnh'); return; }
    var n=col.querySelectorAll('.bnplot').length; if(!n) return;
    var cur=parseFloat(getComputedStyle(art).getPropertyValue('--bnh'))||150;
    var fixed=col.offsetHeight-n*cur;
    var h=Math.max(72,Math.min(300,(ah-16-fixed)/n));
    art.style.setProperty('--bnh',h.toFixed(2)+'px');}
  /* The insight column carries prose, so it cannot be stretched like a table. Instead search the
     largest base font-size at which it still fits the height of the waterfall beside it, and let
     every size inside it be relative. The column then always fills, at any width, with any number
     of findings. It never drives the outer fit, because its target IS the waterfall's height. */
  function fitInsights(){
    var host=document.querySelector('.col-ins'), wf=document.querySelector('.col-wf');
    if(!host||!wf) return;
    var wrap=host.querySelector('.inswrap'); if(!wrap) return;
    /* subtract EVERYTHING that sits above the list inside this column, not just the heading:
       the reference note lives there too, and at 1920 it runs to two lines. Measuring the
       offset is robust to whatever is added above it next. */
    var target=wf.offsetHeight-(wrap.offsetTop-host.offsetTop);
    if(target<40){host.style.fontSize='';return;}
    /* The search is BANDED around --ui. It may shrink below the base when a team has a lot of
       findings, because clipping is worse than small type, but it may not grow far above it:
       an unbanded search is what let the prose reach 15.7px at 1920 while its own section
       heading sat at 12.8 and the chart labels at 9.9. A little slack under a short list is
       breathing room, not a fault. */
    var ui=parseFloat(getComputedStyle(document.getElementById('art')).getPropertyValue('--ui'))||11;
    var lo=7,hi=ui*1.06,best=lo;
    wrap.style.gap='';
    for(var i=0;i<11;i++){var f=(lo+hi)/2;host.style.fontSize=f+'px';
      if(wrap.scrollHeight<=target){best=f;lo=f;}else{hi=f;}}
    host.style.fontSize=best.toFixed(2)+'px';
    /* Banding the type means a short list no longer stretches to the bottom of the column. Spend
       the slack on the GAPS rather than on the letters: the cards spread down the column, which
       is breathing room, where the same slack left at the foot is just a hole. Capped, because
       three findings a hand-span apart stop reading as one list. */
    var n=wrap.children.length;
    if(n>1){
      var free=target-wrap.scrollHeight;
      /* Clamp by the room actually left in the FRAME, not just in the chart column beside it.
         The working copy's chart column grows when the edit layer is on, so filling it blindly
         pushed the last finding off the bottom of the slide - and this runs after the outer
         scale is already fixed, so nothing downstream would have caught it. */
      var fr=document.getElementById('view'), vi=document.getElementById('vinner');
      if(fr&&vi){
        var sc=+(String(vi.style.transform).match(/scale\(([\d.]+)\)/)||[0,1])[1]||1;
        var room=(fr.clientHeight-bottomGap(fr.clientHeight))/sc-vi.scrollHeight;
        free=Math.min(free, Math.max(0, room));
      }
      if(free>2){
        var base=1.35*best, extra=Math.min(free/(n-1), 2.4*best);
        wrap.style.gap=(base+extra).toFixed(1)+'px';
      }
    }}

  var tipEl=null;
  function bindTips(){
    if(!tipEl){ tipEl=document.createElement('div'); tipEl.id='tip';
      (document.getElementById('art')||document.body).appendChild(tipEl); }
    /* Bind the BAR and the LABEL, never the whole row: the row spans the full width, so hovering
       empty track would fire the tooltip wherever the pointer happened to be. */
    /* Any element may carry a definition: a waterfall row, a waste question, a table row. The
       TRIGGERS are the bar and the label where they exist, and the element itself otherwise, so a
       hover never fires from empty track. */
    document.querySelectorAll('#vinner [data-tip],#vinner [data-tiph]').forEach(function(el){
      var id=el.getAttribute('data-tip');
      var trig=[el.querySelector('.wf-bar'),el.querySelector('.wf-label')].filter(Boolean);
      if(!trig.length) trig=[el];
      trig.forEach(function(t){ if(!t) return;
        t.addEventListener('mouseenter',function(){
          if(id){ var c=CATS.filter(function(x){return x.id===id;})[0];
            tipEl.innerHTML='<b>'+esc(c?catLabel(DATA,c):'')+'</b>'+esc(DEFS[id]||''); }
          else { tipEl.innerHTML='<b>'+esc(el.getAttribute('data-tiph')||'')+'</b>'+
            esc(el.getAttribute('data-tipb')||''); }
          tipEl.classList.add('on'); place(el); });
        t.addEventListener('mouseleave',function(){tipEl.classList.remove('on');});
      });
    });
    /* Anchor over the chart's own whitespace, just right of the label column, rather than out
       to the right where it would sit on top of the insight panel. */
    function place(el){ var r=el.getBoundingClientRect(), t=tipEl.getBoundingClientRect();
      var lab=el.querySelector('.wf-label'), trk=el.querySelector('.wf-track');
      var top=r.top+r.height/2-t.height/2;
      top=Math.max(8,Math.min(top,window.innerHeight-t.height-8));
      var left=(lab?lab.getBoundingClientRect().right:r.left+24)+10;
      var limit=(trk?trk.getBoundingClientRect().right:r.right);
      if(left+t.width>limit) left=Math.max(8,limit-t.width);
      if(left+t.width>window.innerWidth-8) left=Math.max(8,window.innerWidth-t.width-8);
      tipEl.style.left=left+'px'; tipEl.style.top=top+'px'; }
  }
  function render(){
    R=calc(DATA);
    var v=VIEWS.filter(function(x){return x[0]===cur;})[0];
    document.getElementById('vinner').innerHTML=v[2](DATA,R);
    drawTitle(); drawMeta(); bindTips();
    
    requestAnimationFrame(fitView); setTimeout(fitView,60);
  }
  function seg(id,attr,cb){var box=document.getElementById(id);box.querySelectorAll('button').forEach(function(b){b.onclick=function(){
    box.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');cb(b.getAttribute(attr));};});}
  seg('views','data-v',function(v){cur=v;render();});
  seg('theme','data-s',function(t){document.getElementById('art').setAttribute('data-t',t);render();});
  window.addEventListener('resize',fitView);

  render();

})();
</script>
<style>
/* ── READ MODE · narrow screens ──────────────────────────────────────────────
   This artifact normally scales its whole body down so the page fits one screen.
   On a phone that turns 13px type into 4px. Below 760px the scaling is switched
   off and the page simply flows and scrolls at its real size. Desktop is
   untouched — every rule here lives inside the media query. */
@media (max-width:760px){
  html,body{height:auto!important;overflow:auto!important}
  #art,#pw,#pm{height:auto!important;min-height:0!important;max-height:none!important;
    overflow:visible!important;padding:12px 14px 22px 34px!important}
  #view{height:auto!important;min-height:0!important;max-height:none!important;
    overflow:visible!important;flex:none!important;position:static!important}
  #vinner{position:static!important;transform:none!important;width:100%!important;
    padding-bottom:14px!important}
  .nr-rail{width:22px!important}
  .toprow{position:static!important;top:auto!important;right:auto!important;left:auto!important;
    margin:0 0 10px!important;flex-wrap:wrap!important;gap:8px 10px!important;justify-content:flex-start!important}
  .tags{flex-wrap:wrap!important;gap:8px!important;margin-left:-34px!important}
  .ctrls{flex-wrap:wrap!important;gap:8px!important;flex:1 1 100%!important}
  #ft{position:static!important;flex-wrap:wrap!important;row-gap:6px!important;margin-top:14px!important}
  h1{font-size:19px!important;max-width:none!important}
  .grid,.classic,.cols-grid{grid-template-columns:1fr!important}
  table{min-width:0!important}
  .tbl-wrap,.wrap-x{overflow-x:auto!important}
}
</style>
<style>/* READ-MODE TYPE FLOOR — nothing under 11px once the page stops scaling */

@media (max-width:760px){
  #ft{font-size:11px!important}
  .conf,.lp,.li,.nr-track,.nr-foot,.lbl,.note{font-size:11px!important}
  .inum,.chip,.inev,.num,.wf-num,.vnum{font-size:11px!important}
  #ft b,.legend b,.l b{font-size:11px!important}
  /* a row label truncated to '…' is worse than a wrapped one once the page flows */
  [style*="ellipsis"]{white-space:normal!important;text-overflow:clip!important;overflow:visible!important}
}
</style>
