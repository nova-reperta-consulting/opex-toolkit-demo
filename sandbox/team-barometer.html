<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Barometer — read-out</title>
<style>
/* Type scale — one place, not case by case. Every size below 12px is a token; the
   whole small end lifts on a narrow screen so nothing drops under 11px on a phone. */
:root{
  --fs-65:6.5px; --fs-7:7px; --fs-75:7.5px; --fs-8:8px; --fs-85:8.5px; --fs-9:9px;
  --fs-95:9.5px; --fs-10:10px; --fs-105:10.5px; --fs-11:11px; --fs-115:11.5px;
}
@media (max-width:760px){
  :root{
    --fs-65:11px; --fs-7:11px; --fs-75:11px; --fs-8:11px; --fs-85:11px; --fs-9:11px;
    --fs-95:11px; --fs-10:11.5px; --fs-105:12px; --fs-11:12px; --fs-115:12.5px;
  }
}
</style>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}
  /* ===== NR BRAND THEME (inlined from brand.css; swap for a client template) ===== */
  #pw{--navy:#0B2347;--navy-fill:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;
      --slate-10:rgba(54,65,86,.09);--rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;
      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #pw[data-t="dark"]{--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--navy-fill:#243246;--accent:#8FC7E8;--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}
  body:has(#pw[data-t="dark"]){--page:#0E1620}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:3}
  .tags{display:flex;align-items:center;gap:11px;min-width:0}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)}
  .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:var(--fs-115);letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #pw[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  .ctrls{display:flex;gap:9px;flex:none}
  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0;max-width:1300px}
  #pw[data-t="dark"] h1{color:#EAEFF5}
  h1 .hl{color:var(--green)}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 16px}
  .subt{font-size:15px;font-weight:600;color:var(--accent)}
  /* body / cards */
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:24px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;align-items:stretch}
  @media(max-width:1280px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
  .card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:20px 20px 18px;position:relative}
  .step{position:absolute;top:13px;left:14px;width:23px;height:23px;border-radius:50%;background:var(--slate-10);color:var(--mut);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .chd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:13px}
  .cnm{font-size:18px;font-weight:600;color:var(--ink);line-height:1.2}
  .cq{font-size:13px;color:var(--mut);line-height:1.35;margin-bottom:11px}
  .ladd{display:flex;gap:4px;margin:1px 0 15px}
  .lc{flex:1;height:7px;border-radius:4px}
  .subs{flex:1;display:flex;flex-direction:column;gap:16px}
  .sub-h{display:flex;align-items:center;gap:8px}
  .dot{flex:none;width:8px;height:8px;border-radius:50%}
  .sub-nm{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink);line-height:1.25}
  .sub-sc{flex:none;font-size:13.5px;font-weight:700}
  .ins{list-style:none;margin:5px 0 0;padding:0}
  .ins li{position:relative;padding-left:15px;font-size:14px;color:var(--txt);line-height:1.45;margin:4px 0}
  .ins li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--mut);opacity:.5}
  .na{font-size:13.5px;color:var(--mut);font-style:italic;margin:5px 0 0;line-height:1.4}
  .lead-n{width:44px;height:44px;border-radius:50%;color:#fff;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .ribbon{display:flex;gap:0;margin-bottom:22px;overflow-x:auto}
  .chev{flex:1;min-width:150px;padding:13px 16px;margin-left:-10px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
  .chev:first-child{margin-left:0}
  .chev .ct{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;line-height:1.2}
  .chev .cq2{font-size:12px;color:var(--txt);line-height:1.32;opacity:.85}
  .nb{flex:none;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
  .chpill{align-self:flex-start;font-size:var(--fs-115);font-weight:600;padding:2px 10px;border-radius:999px;margin-top:3px}
  /* footer: source + legend bottom-left, trademark bottom-right */
  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:12px;font-size:clamp(9.5px,0.75vw,12px);color:var(--mut)}
  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  #ft .ov b{color:var(--ink)}
  .legend{display:flex;gap:7px}
  .lp{font-size:0.95em;font-weight:600;padding:0.2em 0.85em;border-radius:999px}
  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600}
  /* classic cyclic-arrow view */
  .classic{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,500px) minmax(0,1fr);gap:16px;align-items:start}
  .classic>svg{align-self:center}
  .cl-col{display:flex;flex-direction:column;gap:14px}
  .cl-h{display:flex;align-items:center;gap:8px;margin-bottom:1px}
  .cl-num{flex:none;display:inline-flex;width:19px;height:19px;border-radius:50%;background:var(--navy);color:#fff;font-size:var(--fs-11);font-weight:700;align-items:center;justify-content:center}
  #pw[data-t="dark"] .cl-num{background:var(--accent);color:var(--navy)}
  .cl-n{font-size:13.5px;font-weight:700;color:var(--navy)}
  #pw[data-t="dark"] .cl-n{color:#EAEFF5}
  .cl-q{font-size:var(--fs-115);font-style:italic;color:var(--mut);margin:0 0 4px 27px}
  .classic .ins{margin-left:27px}
  .classic .ladd{margin:3px 0 9px 27px;max-width:200px}
  .classic .ins li{font-size:12.5px;line-height:1.4}
  .classic .ins li::before{background:var(--bc,var(--mut));opacity:1;width:6px;height:6px;top:7px}
  @media(max-width:1100px){
    .classic{grid-template-columns:1fr 1fr;justify-items:start;gap:14px 26px}
    .classic>svg{grid-column:1/-1;order:-1;max-width:380px;justify-self:center;margin-bottom:4px}
  }
  @media(max-width:680px){
    .classic{grid-template-columns:1fr}
    .classic>svg{max-width:320px}
  }
  /* ================= BAROMETER BODY (content) ================= */
  .dcols{display:grid;grid-template-columns:2fr 1fr;gap:38px;align-items:start}
  .dcol-side{padding-left:6px;min-width:0}
  .dcol-main{min-width:0}
  .colhead{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.1px;margin:0 0 14px}
  .conc-grp{margin-bottom:16px}
  .conc-h{font-size:var(--fs-11);font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px}
  .conc-h.pos{color:var(--pos)} .conc-h.neg{color:var(--neg)}
  .conc-ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .conc-ul li{position:relative;padding-left:16px;font-size:13.5px;line-height:1.4;color:var(--ink)}
  .conc-ul li::before{content:"";position:absolute;left:3px;top:7px;width:6px;height:6px;border-radius:50%}
  .conc-ul.pos li::before{background:var(--pos)} .conc-ul.neg li::before{background:var(--neg)}
  .insights.conc{display:flex;flex-direction:column;gap:15px}
  .conc-k{display:block;font-size:var(--fs-105);font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
  .conc-t{display:block;font-size:13.5px;line-height:1.42;color:var(--ink)}
  .conc-so{display:block;margin-top:2px;background:var(--tint);border-radius:8px;padding:12px 14px;--nr-tc:var(--nr-green);background-image:linear-gradient(color-mix(in srgb,var(--nr-tc) 11%,transparent),color-mix(in srgb,var(--nr-tc) 11%,transparent))}
  .conc-so{position:relative;padding-left:44px!important;border-radius:12px}.conc-so::before{content:"!";position:absolute;left:14px;top:12px;width:20px;height:20px;border-radius:50%;background:var(--nr-green);color:#fff;font:700 12px/20px system-ui,-apple-system,sans-serif;text-align:center}
  .conc-so-k{display:block;font-size:var(--fs-11);font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--nr-green);margin-bottom:4px}
  .conc-so-t{display:block;font-size:14px;font-weight:600;line-height:1.42;color:var(--ink)}
  .cap{font-size:12px;color:var(--muted);line-height:1.4;margin:-2px 0 10px}
  .cap b{color:var(--ink);font-weight:700}

  /* barometer token map onto NR palette (chrome above stays PW) */
  #pw{--nr-navy:var(--navy);--nr-green:var(--green);--muted:var(--mut);--border:var(--line);--hair:var(--line);--tint:var(--slate-10);
      --s1:#8C2B26;--s2:#B4483C;--s3:#C98A2C;--s4:#9FC3AE;--s5:#4F9A72;--s6:#1C7A4A;--pos:#1C7A4A;--neg:#A8352F;--warn:#96660A}
  #pw[data-t="dark"]{--tint:#243246;--s1:#C0453E;--s2:#D06A4A;--s3:#D8A64A;--s4:#7FB49A;--s5:#40A579;--s6:#2FBE86;--pos:#3FBE86;--neg:#D0655C;--warn:#D2A64A}
  .seg.small button{padding:4px 10px;font-size:var(--fs-11)}
  .legend{flex-wrap:wrap;align-items:center;gap:9px}
  .legend .lp{display:inline-flex;align-items:center;gap:5px;padding:0;background:none;border-radius:0}
  .legend .sw{width:11px;height:11px;border-radius:2px;display:inline-block}
/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh);padding:14px 16px;min-width:0}
.kpi .l{font-size:var(--fs-11);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.kpi .v{font-size:30px;font-weight:800;line-height:1;color:var(--ink)}
.kpi .u{font-size:14px;font-weight:700;color:var(--muted)}
.kpi.pos .v{color:var(--pos)} .kpi.neg .v{color:var(--neg)}
.kpi .s{font-size:var(--fs-11);color:var(--muted);margin-top:5px}
/* section label */
.slab{font-size:var(--fs-11);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 9px}
/* theme strip */
.themes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tcard{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh);padding:11px 13px;min-width:0}
.tcard .tn{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:8px;min-height:30px}
.tbar{height:8px;background:var(--hair);position:relative;overflow:hidden}
.tbar>i{position:absolute;left:0;top:0;bottom:0;background:var(--nr-green)}
.tcard .tv{font-size:19px;font-weight:800;color:var(--ink);margin-top:8px}
.tcard .tv small{font-size:var(--fs-11);font-weight:700;color:var(--muted)}
/* insight band */
.insights{display:flex;flex-direction:column;gap:9px}
.ins{display:flex;gap:11px;align-items:flex-start}
.ins .num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--nr-navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
#pw[data-t="dark"] .ins .num{background:var(--nr-green)}
.ins .tx{font-size:13.5px;line-height:1.4;color:var(--ink)}
.ins .tx b{font-weight:700}
/* distribution rows */
.dist{display:flex;flex-direction:column;gap:3px}
.dgrp{font-size:var(--fs-11);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.drow{display:flex;align-items:center;gap:10px;padding:3px 0}
.drow .dl{width:160px;flex:none;font-size:13px;font-weight:600;color:var(--ink)}
.drow .db{flex:1;height:23px;display:flex;overflow:hidden;background:var(--hair);border-radius:3px}
.drow .db span{height:100%}
.drow .df{width:80px;flex:none;text-align:right;font-size:13px}
.drow .df b{font-weight:800}
.drow .df i{font-style:normal;color:var(--muted);font-size:var(--fs-11)}
/* heatmap */
.hmctl{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.hmctl .lab{font-size:var(--fs-11);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.hm{border-collapse:separate;border-spacing:3px;width:100%;table-layout:fixed}
table.hm th.rw{width:132px}
table.hm td,table.hm th.col{overflow:hidden;text-overflow:ellipsis}
table.hm th.col{font-size:12px;font-weight:700;color:var(--ink);text-align:center;vertical-align:bottom;padding:2px 4px 6px}
table.hm th.rw{font-size:13.5px;text-align:left;padding-right:10px;white-space:nowrap;color:var(--ink);font-weight:600}
table.hm th.rw .chip{font-size:var(--fs-9);font-weight:700;color:var(--muted);background:var(--tint);padding:1px 5px;margin-left:4px}
table.hm td{height:73px;text-align:center;font-size:15px;font-weight:700;color:#fff;min-width:56px}
table.hm td.na{background:var(--hair)!important;color:var(--muted)!important;font-weight:400}
table.hm tr.all th.rw{font-weight:800;color:var(--nr-navy)}
#pw[data-t="dark"] table.hm tr.all th.rw{color:var(--ink)}
table.hm tr.all td{outline:2px solid rgba(0,32,91,.35);outline-offset:-2px}
.hmleg{display:flex;gap:9px;align-items:center;margin-top:9px;font-size:var(--fs-11);color:var(--muted)}
.dqbox{margin-top:12px;border:1px solid var(--border);background:var(--tint);padding:9px 13px;font-size:var(--fs-115);color:var(--ink);--nr-tc:var(--warn);background-image:linear-gradient(color-mix(in srgb,var(--nr-tc) 11%,transparent),color-mix(in srgb,var(--nr-tc) 11%,transparent));border-radius:7px}
.dqbox b{color:var(--warn)}

  /* -- responsive chrome: on a narrow screen the absolute toprow would collide, so drop it
     into normal flow and let it wrap (applies to every artifact that uses this chrome) -- */
  @media (max-width:760px){
    #art,#pm,#pw{padding:14px 18px 10px 42px}
    .nr-rail{width:24px}
  }
  


  /* ── responsive chrome ──────────────────────────────────────────────────────
     The toprow stacks when it does not fit, and the switch is DETECTED, not
     guessed: fitChrome() below measures the one-row layout and adds .stacked to
     the artifact root. Never hard-code a breakpoint for the chrome — see
     brand-guide.html, "Responsive chrome". Stacked order is brand row, then
     navigation, then working controls: where am I, what am I looking at, what
     can I change. ── */
  #art.stacked .toprow,#pm.stacked .toprow,#pw.stacked .toprow{
    position:static;top:auto;left:auto;right:auto;margin:0 0 12px;
    display:flex;flex-wrap:wrap;justify-content:flex-start;align-items:center;gap:10px 12px}
  #art.stacked .tags,#pm.stacked .tags,#pw.stacked .tags{display:contents}
  /* only the brand pill bleeds out onto the navy rail — that is why it is
     border-radius:0 9px 9px 0. The negative margin is given back as padding, so
     its right edge does not move and no sibling shifts. */
  #art.stacked .nr-pill,#pm.stacked .nr-pill,#pw.stacked .nr-pill{
    order:1;margin-left:calc(-1 * var(--padl,0px));padding-left:calc(14px + var(--padl,0px))}
  /* no text in an artifact is ever cut to make it fit: the lens badge wraps, it
     does not ellipsise. An instrument that truncates it looks fine to a gate and
     wrong to a client. */
  #art.stacked .nr-track,#pm.stacked .nr-track,#pw.stacked .nr-track{
    order:2;max-width:none;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
  #art.stacked .ctrls,#pm.stacked .ctrls,#pw.stacked .ctrls{
    order:3;flex:1 1 100%;display:flex;flex-wrap:wrap;justify-content:flex-start;gap:8px}
  /* a shell whose view switch sits straight in the toprow, with no .ctrls group */
  #art.stacked .toprow>.seg,#pm.stacked .toprow>.seg,#pw.stacked .toprow>.seg{order:3;flex:1 1 100%}
  #art.stacked .seg,#pm.stacked .seg,#pw.stacked .seg{flex-wrap:wrap;max-width:100%}
  #art.stacked .wgrp,#pm.stacked .wgrp,#pw.stacked .wgrp{
    order:4;flex:1 1 100%;flex-wrap:wrap;gap:8px}
  #art.stacked #save,#art.stacked #lock,#pm.stacked #save,#pm.stacked #lock,
  #pw.stacked #save,#pw.stacked #lock{order:4}
  /* the narrow-screen media query keeps only what it was really for: padding and
     rail width on a phone. Chrome layout is no longer its business. */
  @media (max-width:760px){
    #art.stacked,#pm.stacked,#pw.stacked{padding:14px 18px 10px 42px}
    #art.stacked .nr-rail,#pm.stacked .nr-rail,#pw.stacked .nr-rail{width:24px}
  }
</style><style id="nr-finish">
/* == THE DECK FINISH (patch_finish.py) == one look across the toolkit: the same base size as a deck
   in the same window, the quiet subtitle, light grey cards for ideas, icons from the house set.
   Written with an html prefix so it wins over the template's own rules wherever they sit. */
html{--srf:#F7F9FB;--srf-line:#E4E9EF;--sh-soft:0 1px 2px rgba(16,24,40,.05);--subt:#5E718B}
html [data-t="dark"]{--srf:#1E2937;--srf-line:#2C3947;--sh-soft:0 1px 2px rgba(0,0,0,.35);--subt:#9FB1C8}
html .subt{font-size:max(15px,calc(var(--nr-t,14px) * 1.22));font-weight:400;color:var(--subt)}
/* the title follows the deck where the deck's title is the larger one (a window above about 1615 x 909);
   below that every instrument keeps its own title, including the ones that shrink it to fit */
@media (min-width:1615px) and (min-height:909px){html h1{font-size:calc(var(--nr-t,15.14px) * 1.85)}}
html :is(.card,.kpi,#pw .tcard,.plan,.findings,.acard,.t-dept .nc,.t-team.in .nc,.blk.boxed,.conc-so,.node.l3){background:var(--srf);border-color:var(--srf-line);border-radius:14px;box-shadow:var(--sh-soft)}
/* the templates paint their dark cards from #art[data-t="dark"] rules; the finish wins over those */
html [data-t="dark"]:is(#art,#pw,#pm) :is(.card,.kpi,#pw .tcard,.plan,.findings,.acard,.t-dept .nc,.t-team.in .nc,.blk.boxed,.conc-so,.node.l3){background:var(--srf);border-color:var(--srf-line)}
html :is(.blk.boxed,.conc-so){border:1px solid var(--srf-line)}
html .ic{width:1.2em;height:1.2em;fill:var(--navy);flex:none;vertical-align:-.24em;margin-right:.4em}
html [data-t="dark"] .ic{fill:#93A9C4}
@media print{html{--sh-soft:0 0 0 transparent}}

<style>

    font:500 13px/1.4 -apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;color:var(--ink,#15243A);background:var(--card,#fff);box-shadow:0 14px 34px -10px rgba(11,35,71,.28);
    opacity:0;transform:translateY(6px) scale(.97);transition:opacity .28s ease,transform .32s cubic-bezier(.2,.9,.25,1.15);pointer-events:none}

<script>
(function(){
  var GROUPS=[['interviews','Interviews'],['observations','Observations'],['documents','Documents'],['data','Data'],['external','External sources'],['internal','Internal discussions']];
  var NOUN={interviews:['interview','interviews'],observations:['observation','observations'],documents:['document','documents'],data:['data extract','data extracts'],external:['external source','external sources']};
  var SPECS={}, pop=null, cur=null;
  function P(){ try{ return (typeof DATA!=='undefined'&&DATA&&DATA.sourcePanel)||null; }catch(e){ return null; } }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function low(t){ t=String(t||''); return /^[A-Z][a-z]*(?=[\s,.;:-]|$)/.test(t)?t.charAt(0).toLowerCase()+t.slice(1):t; }   /* EventHub stays EventHub */
  function plain(t){ return String(t||'').replace(/\*\*/g,'').replace(/<[^>]+>/g,''); }
  function working(){ var p=P(); return !!(p&&p.build==='working'); }
  function root(){ return document.querySelector('#art,#pm,#pw')||document.body; }
  function href(e){ var p=P(); if(e.url) return e.url; if(e.file&&p&&p.rootRel!=null) return (p.rootRel?p.rootRel+'/':'')+e.file.split('/').map(encodeURIComponent).join('/'); return ''; }
  function badge(s){ if(s.badge==null&&s.score==null) return '';
    var r=s.rag||'na', txt=s.badge!=null?s.badge:(s.score+' out of 5');
    return '<span class="nrsrc-sc" style="color:var(--rag-'+r+'-text);background:var(--tint-'+r+')">'+esc(txt)+'</span>'; }
  /* every source an item rests on: an analysis gives its method and what it was built from */
  function expand(ids){ var p=P(), S=p.src, pool=[], how=[], seen={};
    (function walk(list,top){ (list||[]).forEach(function(k){ var e=S[k]; if(!e||seen[k]) return; seen[k]=1;
      if(e.group==='analysis'){ how.push({k:k,e:e}); walk(e.builtFrom,false); } else pool.push({k:k,e:e}); }); })(ids,true);
    return {pool:pool,how:how}; }
  function summary(pool){ var n={}, one={}; pool.forEach(function(x){ var g=x.e.group; if(g==='internal') return; n[g]=(n[g]||0)+1; one[g]=x.e; });
    var parts=[]; ['interviews','observations','documents','data','external'].forEach(function(g){ if(!n[g]) return;
      if(n[g]===1&&(g==='documents'||g==='data')) parts.push('the '+low(one[g].label)); else parts.push(n[g]+' '+NOUN[g][n[g]===1?0:1]); });
    if(!parts.length) return '';
    return 'Based on '+(parts.length>1?parts.slice(0,-1).join(', ')+' and '+parts[parts.length-1]:parts[0])+'.'; }
  function who(e){ var w=working(); if(w&&e.people&&e.label.indexOf(e.people.split(/[;,]/)[0].trim())<0) return e.people; return ''; }
  function item(x){ var e=x.e, w=working(), h=w?href(e):(e.url||'');
    return '<div class="nrsrc-it">'+esc(e.label)+(who(e)?' <span class="nrsrc-d">· '+esc(who(e))+'</span>':'')+(e.date?' <span class="nrsrc-d">· '+esc(e.date)+'</span>':'')+
      (w&&e.group==='external'&&e.origins&&e.origins.length?e.origins.map(function(o){return o==='thirdparty'||o==='internet'?'<span class="nrsrc-o '+o+'">'+(o==='thirdparty'?'Third party':'Internet')+'</span>':'';}).join(''):'')+
      (w?' <span class="nrsrc-id">'+esc(x.k)+'</span>':'')+(h?' <a href="'+esc(h)+'" target="_blank" rel="noopener">open</a>':'')+'</div>'; }
  function body(s){ var p=P(), w=working(), ids=s.ids||[], h='';
    h+='<div class="nrsrc-hx"><div class="nrsrc-ey"><span>'+esc(s.eyebrow||'')+'</span>'+badge(s)+'</div>'+
       '<button type="button" class="nrsrc-x" aria-label="Close">&times;</button></div><div class="nrsrc-bd">';
    if(!ids.length){ return h+'<div class="nrsrc-warn">No source yet. Unlock the page and pick one where you score it. Without a source this score cannot go into the client build.</div></div>'; }
    var x=expand(ids), sm=summary(x.pool);
    if(sm) h+='<p class="nrsrc-sum">'+esc(sm)+'</p>';
    x.how.forEach(function(a){ var e=a.e; h+='<div class="nrsrc-how"><b>Method</b>'+esc(e.method||e.label)+(w?' <span class="nrsrc-id">'+esc(a.k)+'</span>'+(href(e)?' <a href="'+esc(href(e))+'" target="_blank" rel="noopener">open</a>':''):'')+'</div>'; });

  function renderSegmentConclusions(){var C=buildSegmentConclusions(D);if(!C)return renderConclusions();function ul(items,cls){return '<ul class="conc-ul '+cls+'">'+items.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>';}var h='';if(C.standouts&&C.standouts.length)h+='<div class="conc-grp"><div class="conc-h pos">Standout segments</div>'+ul(C.standouts,'pos')+'</div>';if(C.support&&C.support.length)h+='<div class="conc-grp"><div class="conc-h neg">Segments to support</div>'+ul(C.support,'neg')+'</div>';if(C.takeaway)h+='<div class="conc-so"><span class="conc-so-k">\u2192 Key take-away</span><span class="conc-so-t">'+esc(C.takeaway)+'</span></div>';return h;}

<script>
/* ── fitChrome() — the chrome stacks when it does not fit ────────────────────
   Measures the one-row layout and adds .stacked to the artifact root when any of
   six things is true: the two groups are closer than 12px · a control runs past
   either edge · a label has been squeezed narrower than its own text · the
   toprow wraps · the toprow comes within 6px of the action title · the viewport
   is at or below 760px (the floor). Exposed as window.fitChrome() so a render
   pass can call it after it changes a label. ── */
(function(){
  var busy=false,lastW=-1;
  function root(){return document.querySelector('#art,#pm,#pw');}
  function skip(e){
    if(!e) return true;
    if(e.id==='wpop'||(e.closest&&e.closest('#wpop'))) return true;
    var cs=getComputedStyle(e);
    if(cs.visibility==='hidden'||cs.display==='none') return true;
    return false;
  }
  function fitChrome(){
    if(busy) return; busy=true;
    try{
      var R=root(); if(!R) return;
      var tr=R.querySelector('.toprow'); if(!tr) return;
      R.classList.remove('stacked');
      void tr.offsetWidth;                                  /* force the reflow we measure */
      var need=window.innerWidth<=760, i, r, e;
      var trb=tr.getBoundingClientRect();
      /* 1. the two groups are closer than 12px */
      var tags=R.querySelector('.tags'), ctrls=R.querySelector('.ctrls');
      if(!need&&tags&&ctrls&&!skip(tags)&&!skip(ctrls)){
        var a=tags.getBoundingClientRect(), b=ctrls.getBoundingClientRect();
        if(b.left-a.right<12) need=true;
      }
      /* 2. a control runs past either edge */
      if(!need){
        var kids=tr.querySelectorAll('.nr-pill,.nr-track,.seg,.wgrp,button,#wnote');
        for(i=0;i<kids.length;i++){
          e=kids[i]; if(skip(e)) continue;
          r=e.getBoundingClientRect(); if(!r.width&&!r.height) continue;
          if(r.right>trb.right+0.5||r.left<trb.left-0.5){need=true;break;}
        }
      }
      /* 3. a label has been squeezed narrower than its own text */
      if(!need){
        var ls=tr.querySelectorAll('.nr-pill b,.nr-track,.seg button,button,#wnote,span');
        for(i=0;i<ls.length;i++){
          e=ls[i]; if(skip(e)) continue;
          if(!e.textContent||!e.textContent.trim()) continue;
          if(e.scrollWidth>e.clientWidth+1){need=true;break;}
        }
      }
      /* 4. the toprow wraps — a floating row that wraps grows downwards into the
         title without pushing anything down */
      if(!need){
        var tall=0,ch=tr.children;
        for(i=0;i<ch.length;i++){var h=ch[i].getBoundingClientRect().height;if(h>tall)tall=h;}
        if(trb.height>tall+2) need=true;
      }
      /* 5. the toprow sits on, or within 6px of, the action title */
      if(!need){
        var t=R.querySelector('.nr-strip'); if(!t||skip(t)) t=R.querySelector('h1');
        if(t&&!skip(t)){var tb=t.getBoundingClientRect(); if(tb.top-trb.bottom<6) need=true;}
      }
      if(need) R.classList.add('stacked');
      /* --padl is read AFTER the class lands: the class itself changes the padding */
      R.style.setProperty('--padl',(parseFloat(getComputedStyle(R).paddingLeft)||0)+'px');
    } finally { busy=false; }
  }
  window.fitChrome=fitChrome;
  function kick(){requestAnimationFrame(fitChrome);}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',kick); else kick();
  window.addEventListener('load',kick);
  window.addEventListener('resize',function(){lastW=-1;kick();});
  if(window.ResizeObserver){
    var ro=new ResizeObserver(function(en){
      var w=en&&en[0]?Math.round(en[0].contentRect.width):-1;
      if(w===lastW) return;                                 /* stacking must not re-trigger us */
      lastW=w; kick();
    });
    var r0=root(); if(r0) ro.observe(r0);
  }
})();
</script>
