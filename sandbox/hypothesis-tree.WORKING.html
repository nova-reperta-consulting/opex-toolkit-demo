<!doctype html>
<!-- ============================================================================
  HYPOTHESIS TREE  |  assets/TEMPLATE.html
  Built ON diagnostic-skill-builder/templates/artifact-shell-editable.html: the chrome, the
  seg views, the lock, the sidebar, the .nr-select dropdowns, the action-title editor and the
  monotonic fit are the canonical ones. Only the DATA block, the three view renderers and the
  sidebar fields belong to this instrument.

  TWO FILES: scripts/render_hypothesis_tree.py strips every fenced region to build the client
  hypothesis-tree.html (the file you SEND) and keeps them for hypothesis-tree.WORKING.html
  (editable, NEVER sent).
============================================================================ -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hypothesis tree</title>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}
  /* ===== BRAND THEME (inlined from templates/brand.css) ===== */
  #art{--navy:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;
      --slate-10:rgba(54,65,86,.09);--navy-10:rgba(11,35,71,.10);--green-10:rgba(28,122,74,.10);--accent-10:rgba(110,177,209,.13);
      --rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;--rag-green-text:#2F8F6B;--rag-amber-text:#B97F22;--rag-red-text:#C2483D;--rag-na-text:#6B7480;--tint-green:rgba(47,143,107,.12);--tint-amber:rgba(212,154,58,.16);--tint-red:rgba(210,100,90,.13);--tint-na:rgba(154,164,176,.16);--navy-fill:#0B2347;
      --dv-2:#2E5C8A;
      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #art[data-t="dark"]{--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--navy-fill:#243246;--accent:#8FC7E8;--steel:#93A9C4;--rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;--rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;--tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);--dv-2:#5A9BD5;--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}
  body:has(#art[data-t="dark"]){--page:#0E1620}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:3}
  .tags{display:flex;align-items:center;gap:11px;min-width:0}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)}
  .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:11.5px;letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #art[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  /* the zoom stepper, same component as the org baseline's tree */
  .zoombox{display:flex;align-items:center;background:var(--slate-10);border-radius:999px;padding:3px;gap:1px}
  .zoombox button{font-size:13px;font-weight:700;color:var(--mut);width:26px;height:26px;border-radius:999px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;border:0;background:none;cursor:pointer}
  .zoombox button:hover{background:var(--card);color:var(--ink)}
  .zoombox button.wide{width:auto;padding:0 10px;font-size:11px;font-weight:600}
  .zoombox .zlvl{font-size:11px;font-weight:700;color:var(--txt);min-width:40px;text-align:center;letter-spacing:-.2px}
  #view.grabbable{cursor:grab}
  #view.grabbing{cursor:grabbing}
  #view.grabbing .node{pointer-events:none}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  .ctrls{display:flex;gap:9px;flex:none}
  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0 0 16px;max-width:1300px}
  #art[data-t="dark"] h1{color:#EAEFF5}
  h1 .hl{color:var(--green)}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 16px}
  .subt{font-size:15px;font-weight:600;color:var(--accent);max-width:1300px;line-height:1.4}
  .subt .dec{display:block;font-size:.82em;font-weight:600;color:var(--mut);margin-top:3px}
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:24px}
  table{border-collapse:collapse;width:100%}
  th{text-align:left;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:700;padding:0 20px 9px 0;border-bottom:2px solid var(--line)}
  td{font-size:13px;color:var(--txt);padding:11px 20px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
  td b{color:var(--ink)}
  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:12px;font-size:clamp(9.5px,0.75vw,12px);color:var(--mut)}
  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legend{display:flex;gap:7px}
  .lp{font-size:0.95em;font-weight:600;padding:0.2em 0.85em;border-radius:999px}
  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600;white-space:nowrap;flex:none}

  /* ── the tree: levels left to right, one row per lowest-level hypothesis ── */
  .twrap{position:relative;width:100%}
  .tgrid{display:grid;position:relative;z-index:1;width:100%}
  .node.l0{background:var(--navy);border-left:4px solid var(--sky)}
  .node.l0 .txt{font-size:14px;line-height:1.35}
  .node.l0 .dec{margin-top:7px;font-size:11.5px;font-weight:600;color:var(--sky);line-height:1.4}
  svg.wires{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:visible}
  .band{grid-column:1/-1;border-bottom:1px solid var(--line);pointer-events:none}
  .hcell{padding:0 14px 9px 0;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);
    font-weight:700;white-space:nowrap;border-bottom:2px solid var(--line)}
  .nops{position:absolute;top:4px;right:4px;display:none;gap:3px;z-index:5}
  #art.editing .node .nops{display:flex}
  .nops button{width:17px;height:17px;padding:0;line-height:1;font-size:12.5px;font-weight:700;cursor:pointer;
    border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;border-radius:5px;
    display:flex;align-items:center;justify-content:center}
  .nops button:hover{background:#fff;color:var(--navy);border-color:#fff}
  .nops button.rm:hover{background:var(--rag-red);color:#fff;border-color:var(--rag-red)}
  /* the lowest two levels are light cards, so the controls invert */
  .node.l3 .nops button,.node.l4 .nops button{border-color:var(--line);background:var(--card);color:var(--mut)}
  .node.l3 .nops button:hover,.node.l4 .nops button:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
  .node.l3 .nops button.rm:hover,.node.l4 .nops button.rm:hover{background:var(--rag-red);border-color:var(--rag-red)}
  .node{align-self:center;position:relative;z-index:2;margin:5px 0;background:var(--navy-fill);color:#fff;
    border-radius:10px;padding:9px 12px;border-left:4px solid var(--accent)}
  .node.l2{background:var(--navy2);border-left-color:var(--green)}
  .node.l3,.node.l4{background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--dv-2)}
  .node .lv{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;opacity:.62;margin-bottom:3px;
    display:flex;align-items:center;gap:6px}
  .node .txt{font-size:13px;line-height:1.35;font-weight:600}
  .roll{margin-top:7px;display:flex;align-items:center;gap:7px}
  .roll .bar{flex:1;height:5px;border-radius:3px;overflow:hidden;display:flex;background:#ffffff2e;min-width:40px}
  .node.l3 .roll .bar,.node.l4 .roll .bar{background:var(--line)}
  .roll .bar i{display:block;height:100%}
  .roll .lbl{font-size:9.5px;opacity:.82;white-space:nowrap}
  .mcell{align-self:center;padding:9px 14px 9px 0;font-size:12.5px;color:var(--txt);line-height:1.45;position:relative;z-index:2}
  .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:11px;
    font-weight:700;white-space:nowrap;color:#fff}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:#ffffff9c}
  .p-open{background:var(--rag-na)} .p-prog{background:var(--dv-2)} .p-conf{background:var(--rag-green)}
  .p-part{background:var(--rag-amber)} .p-rej{background:var(--rag-red)} .p-park{background:var(--mut)}
  .prio{font-size:11px;font-weight:700;letter-spacing:.3px}
  .prio.High{color:var(--rag-red-text)} .prio.Medium{color:var(--rag-amber-text)} .prio.Low{color:var(--mut)}
  .tchip{display:inline-block;background:var(--navy-10);color:var(--navy);font-weight:600;font-size:11.5px;padding:3px 9px;border-radius:9px}
  #art[data-t="dark"] .tchip{background:#2A3744;color:var(--ink)}
  .tscope{display:block;font-size:11px;color:var(--mut);margin-top:3px}
  .dim{color:var(--mut);font-style:italic}

  /* ── the test plan: one block per analysis ── */
  .plan{border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--sh);margin:0 0 14px;overflow:hidden}
  .plan>header{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--slate-10)}
  .plan>header .nm{flex:1;min-width:0;font-weight:700;color:var(--ink);font-size:14.5px}
  .plan>header .nm small{display:block;font-weight:700;color:var(--mut);font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:2px}
  .plan table{font-size:13px}
  .plan td{padding:10px 18px;border-top:1px solid var(--line);border-bottom:0}
  .plan tr:first-child td{border-top:0}
  .plan td.pr{width:90px} .plan td.st{width:160px;white-space:nowrap}
  .plan td .settles{display:block;font-size:11.5px;color:var(--mut);margin-top:2px}
  /* the test plan: one flat table, the analysis a chip rather than a group header */
  .plantbl td{padding:11px 18px 11px 0}
  .plantbl td.an{width:190px}
  .plantbl td.an .sc{display:block;font-size:10.5px;color:var(--mut);margin-top:4px;line-height:1.4}
  .plantbl td.hy{font-size:13px;font-weight:600;color:var(--ink)}
  .plantbl td.hy .se{display:block;font-size:11.5px;font-weight:400;color:var(--mut);margin-top:3px;line-height:1.45}
  .plantbl td.dn{width:24%;font-size:12px;color:var(--txt)}
  .plantbl td.pr{width:82px} .plantbl td.st{width:150px;white-space:nowrap}
  .tchip.out{background:var(--accent-10);color:var(--navy)}
  .tchip.none{background:var(--tint-amber);color:var(--rag-amber-text)}
  /* where we stand: the central hypothesis, then one block per dimension */
  .stand{border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:14px;background:var(--card);
    box-shadow:var(--sh);padding:14px 18px;margin:0 0 16px}
  .stand .sl{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .stand .sl .ct{font-size:11.5px;font-weight:600;color:var(--mut)}
  .stand .st{font-size:15px;font-weight:700;color:var(--ink);line-height:1.35}
  .stand .dc{font-size:12px;font-weight:600;color:var(--mut);margin-top:5px}
  .dimblk{border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--sh);margin:0 0 12px;overflow:hidden}
  .dimblk>header{display:flex;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--slate-10)}
  .dimblk>header .nm{flex:1;min-width:0;font-weight:700;color:var(--ink);font-size:14px}
  .dimblk>header .cnt{font-size:11px;font-weight:700;color:var(--mut);white-space:nowrap}
  .dimblk .cols{display:flex}
  .dimblk .col{flex:1;min-width:0;padding:13px 18px}
  .dimblk .col+.col{border-left:1px solid var(--line)}
  .dimblk .col h4{font-size:9.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
  .ev{margin:0 0 11px} .ev:last-child{margin:0}
  .ev .hy{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.4}
  .ev .hy .pill{margin-right:7px;vertical-align:1px}
  .ev .fi{font-size:11.5px;color:var(--mut);line-height:1.5;margin-top:3px}
  .fine{font-size:11px;color:var(--mut);margin:16px 0 0;line-height:1.5}
  .unassigned{border-color:var(--rag-amber)}
  .unassigned>header{background:var(--tint-amber)}
  .note{display:flex;gap:12px;align-items:flex-start;background:var(--slate-10);border:1px solid var(--line);
    border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:12px 16px;margin:0 0 16px;font-size:13px;line-height:1.5}
  .note.warn{background:var(--tint-amber);border-color:var(--rag-amber)}
  .note b{display:block;margin-bottom:2px;color:var(--ink)}

  /* ── coverage ── */
  .kpis{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:12px 18px;min-width:124px}
  .kpi .v{font-size:24px;font-weight:700;color:var(--ink);line-height:1.1}
  .kpi .v small{font-size:11px;font-weight:600;color:var(--mut)}
  .kpi .k{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin-top:4px}
  .sect{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
  ul.gaps{margin:0;padding-left:18px;font-size:12.5px;color:var(--mut);line-height:1.6}
  ul.gaps li{margin:0 0 3px}
  .distbar{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--line);margin:0 0 8px}
  .distbar i{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
  .cov{display:flex;align-items:center;gap:8px}
  .cov .t{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;max-width:120px}
  .cov .t i{display:block;height:100%;background:var(--green)}
  /*<EDIT>*/
  #art.editing .node,#art.editing .subt{cursor:pointer;transition:.13s}
  #art.editing .node:hover,#art.editing .subt:hover{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  #art.editing .nr-locked{opacity:.5;filter:saturate(.7);cursor:help;transition:.15s}
  #lock{width:34px;height:34px;border:1px solid var(--line);background:var(--card);border-radius:9px;color:var(--mut);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  #lock svg{width:17px;height:17px;display:block}
  #lock.unlocked{background:var(--rag-amber);border-color:var(--rag-amber);color:#fff}
  #save{font-size:12px;font-weight:700;border:1px solid var(--navy-fill);background:var(--navy-fill);color:#fff;padding:8px 13px;border-radius:9px;cursor:pointer;display:none}
  #save.show{display:inline-flex} #save:disabled{opacity:.45;cursor:default}
  .mflag{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;
    background:var(--rag-amber);color:#15243A;font-size:9.5px;font-weight:800;flex:none}
  #ed{position:fixed;top:0;right:0;bottom:0;width:410px;max-width:92vw;overflow:hidden;background:var(--card);border-left:1px solid var(--line);box-shadow:-18px 0 44px -24px rgba(11,35,71,.4);z-index:90;display:none;flex-direction:column}
  #ed.on{display:flex}
  #ed .edh{flex:none;position:relative;padding:14px 20px 12px;border-bottom:1px solid var(--line);background:var(--slate-10)}
  #ed .edh .row{display:flex;align-items:center;gap:9px;padding-right:40px}
  #ed .edh .kind{flex:none;font-size:8.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--navy-fill);padding:3px 7px;border-radius:5px}
  #ed .edh h3{margin:0;font-size:15px;font-weight:800;color:var(--ink);line-height:1.25}
  #ed .edh .x{position:absolute;top:12px;right:15px;width:26px;height:26px;border:0;background:none;font-size:19px;color:var(--mut);cursor:pointer;border-radius:6px}
  #ed .edb{flex:1;min-height:0;overflow:auto;padding:16px 20px}
  #ed .edf{flex:none;display:flex;gap:8px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:var(--slate-10)}
  #ed .edf .sp{flex:1}
  #ed .f{margin-bottom:12px} #ed .f label{display:block;font-size:10px;font-weight:700;color:var(--txt);margin:0 0 4px}
  #ed .f input,#ed .f textarea{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:12.5px;color:var(--ink);background:var(--card)}
  #ed .f textarea{min-height:84px;resize:vertical;line-height:1.5}
  #ed .hint{font-size:11px;color:var(--mut);margin:5px 0 0;line-height:1.45}
  #ed .wbtn{font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
  #ed .wbtn.pri{background:var(--navy-fill);color:#fff;border-color:var(--navy-fill)}
  #ed .wbtn.menu{padding:8px 11px;font-size:14px;line-height:1}
  /* destructive and structural actions live in the ⋯ menu so the footer leads with Cancel and Apply */
  #ed .edmenu{position:absolute;bottom:52px;left:16px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 16px 34px -16px rgba(11,35,71,.5);padding:4px;display:none;z-index:5;min-width:210px}
  #ed .edmenu.on{display:block}
  #ed .edmenu button{display:block;width:100%;text-align:left;font-size:12.5px;padding:7px 12px;border-radius:6px;
    border:0;background:none;color:var(--ink);font-weight:600;cursor:pointer}
  #ed .edmenu button:hover{background:var(--slate-10)}
  #ed .edmenu button:disabled{opacity:.4;cursor:default}
  #ed .edmenu button.del{color:var(--rag-red)} #ed .edmenu button.del:hover{background:rgba(210,100,90,.1)}
  #ed .edmenu .sep{height:1px;background:var(--line);margin:4px 6px}
  .addbtn{font-size:11.5px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--navy);
    padding:7px 13px;border-radius:8px;cursor:pointer}
  .addbtn:hover{border-color:var(--accent)}
  #ed .flags{margin:0;padding:0;list-style:none;font-size:12px;line-height:1.5}
  #ed .flags li{display:flex;gap:8px;margin-bottom:7px}
  #ed .flags li b{flex:none;width:15px;height:15px;border-radius:50%;font-size:9.5px;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:2px}
  #ed .flags li.warn b{background:var(--rag-amber);color:#15243A} #ed .flags li.info b{background:var(--dv-2)}
  #ed .flags li.ok b{background:var(--rag-green)}
  #ed .derived{padding:8px 10px;border:1px dashed var(--line);border-radius:8px;font-size:12.5px;color:var(--ink)}
  #ed .cselwrap{position:relative} #ed .cselwrap>select{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  #ed .cseltrg{width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;text-align:left}

  "source": "Kick-off brief, four framing interviews, the claims system report pack and the six analyses run on Claims Handling",

  "problem": {
    "statement": "Claims Handling absorbs 42 FTE and is the journey customers rate lowest, and we cannot say how much of that effort is avoidable or which parts an AI could take over.",

      "text": "The effort goes on moving information, not on deciding claims",
      "mece": {
        "me": "yes",
        "ce": "yes",
        "note": ""
      },
      "children": [
        {
          "id": "n2",

              "rationale": "Both teams described it unprompted in the first interview",
              "dataNeeded": "Handling time per notification, in both systems",

                "instrument": "process-map",
                "scope": "Claims Handling",
                "settles": "where the same input is entered twice"

              "children": []
            },

              "id": "n4",

              "rationale": "Observed in the walkthrough on every file opened",

              "test": {
                "instrument": "mae",

                "scope": "Claims Handling",

              "children": []
            },
            {
              "id": "n7",
              "text": "Recovery files are rebuilt from scratch every time",
              "status": "Confirmed",
              "priority": "Low",
              "rationale": "Seen in the workshop; no template exists",
              "dataNeeded": "Time per recovery file and the number of files per month",
              "findings": "1,2 FTE. Nobody is accountable for recovery, so both teams build their own file.",
              "test": {
                "instrument": "raci-diagnostic",

                "settles": "who owns what, and where accountability is absent"

              "children": []
            }

        {
          "id": "n8",
          "text": "Too little of the paid time reaches the customer at all",

            "me": "yes",
            "ce": "yes",
            "note": ""
          },
          "children": [
            {
              "id": "n9",
              "text": "Value-adding time is below the band we would expect for a claims team",
              "status": "Confirmed",
              "priority": "High",
              "rationale": "Top-down decomposition of paid time with the team lead",
              "dataNeeded": "Contracted days, absence, the day-type matrix and the ten waste questions",
              "findings": "OTE is 32%. Just under a third of the time Northwind pays for reaches a customer or the business.",
              "test": {
                "instrument": "ote-waterfall",
                "scope": "Claims Handling",
                "settles": "how much available time reaches value-adding work"

              "children": []
            },
            {
              "id": "n10",
              "text": "The peaks the team cannot staff for are a bigger loss than absence",

              "priority": "Medium",
              "rationale": "Motor claims arrive with the weather; the peak is real",
              "dataNeeded": "Day-type matrix and the seniority profile",
              "findings": "Rigidity is 27% against 18% waste. The peak cannot be staffed away and there is no route to escalate.",
              "test": {
                "instrument": "ote-waterfall",
                "scope": "Claims Handling",
                "settles": "how much available time reaches value-adding work"

              "children": []
            }

    {

      "text": "The team is measured but not steered",

        "me": "yes",

        "note": ""
      },
      "children": [

          "id": "n12",
          "text": "The numbers are read after the fact rather than used to decide the day",
          "status": "Confirmed",
          "priority": "High",
          "rationale": "Scored with the manager and two team members",

          "children": []
        },

          "text": "Nothing records who can handle which claim type",

        {
          "id": "n16",
          "text": "Status calls are the cost of having no self-service",

          "priority": "High",
          "rationale": "Call reasons from the contact-centre report pack",
          "dataNeeded": "Volume and reason code of status calls on open claims",

            "instrument": "service-blueprint",
            "scope": "Claims Handling",
            "settles": "what the client experiences, front and back stage"

          "children": []
        },
        {
          "id": "n17",
          "text": "The claims data is fit for an assistant to answer a status question",

          warnField('A verdict needs a finding. Record what the evidence showed, and where it came from.'); return; }
      } else {
        ch.mece={me:edp.querySelector('#f_me').value,ce:edp.querySelector('#f_ce').value,note:edp.querySelector('#f_note').value};
        if((ch.mece.me==="no"||ch.mece.ce==="no")&&!ch.mece.note.trim()){
          warnField('A recorded gap needs a note. Write what is missing or overlapping, because the steerco will ask.'); return; }
      }
      for(var k in ch) n[k]=ch[k];
      pushOp({op:'update',coll:'hypotheses',id:n.id,changes:ch}); closeEd(); render(); };
  }
  /* The problem statement is the root of the tree, so it is edited the way the action title is. */
  function openProblem(){ if(!ON||!edp) return;
    edp.innerHTML='<div class="edh"><button class="x" id="edx">&times;</button><div class="row"><span class="kind">Problem</span><h3>The root of the tree</h3></div></div>'+
      '<div class="edb"><div class="f"><label>Problem statement, one full sentence</label><textarea id="f_st">'+esc(DATA.problem.statement||'')+'</textarea>'+
      '<p class="hint">Name the condition and the uncertainty. A topic label is not a problem: "promotions" is a subject, "promo spend of 180m does not deliver volume and we do not know which levers to pull" is a problem.</p></div>'+
      '<div class="f"><label>The decision at stake, and its date</label><textarea id="f_sub">'+esc(DATA.problem.subline||'')+'</textarea>'+
      '<p class="hint">A tree with no decision behind it produces analysis nobody uses.</p></div>'+
      selField('Is the cut into dimensions mutually exclusive?','f_me',YESNO,DATA.problem.mece.me,false)+
      selField('Is it collectively exhaustive?','f_ce',YESNO,DATA.problem.mece.ce,false)+
      '<div class="f"><label>Note, needed as soon as either answer is a gap</label><textarea id="f_note">'+esc(DATA.problem.mece.note||'')+'</textarea></div></div>'+
      '<div class="edf"><span class="sp"></span><button class="wbtn" id="edc">Cancel</button><button class="wbtn pri" id="edok">Apply</button></div>';
    edp.classList.add('on'); enhanceSelects(edp);
    edp.querySelector('#edx').onclick=edp.querySelector('#edc').onclick=closeEd;
    edp.querySelector('#edok').onclick=function(){
      var me=edp.querySelector('#f_me').value,ce=edp.querySelector('#f_ce').value,note=edp.querySelector('#f_note').value;
      if((me==="no"||ce==="no")&&!note.trim()){warnField('A recorded gap needs a note. Write what is missing or overlapping.');return;}
      DATA.problem.statement=edp.querySelector('#f_st').value.trim();
      DATA.problem.subline=edp.querySelector('#f_sub').value.trim();
      DATA.problem.mece={me:me,ce:ce,note:note};
      pushOp({op:'update',coll:'problem',id:'problem',changes:DATA.problem});
      closeEd(); render(); };
  }
  /* The tree owns its own data, so the export carries the whole payload rather than a patch.
     render_hypothesis_tree.py re-seeds from it. A round trip, not a merge. */
  function exportDelta(){ if(!DELTA.length) return;
    var d={deltaId:'D-'+new Date().toISOString().slice(0,10)+'-hypothesis-tree',author:'consultant',
           instrument:'hypothesis-tree',proposals:DELTA,data:DATA};
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,1)],{type:'application/json'}));
    a.download=d.deltaId+'.json'; a.click(); }
  function setEditing(on){ ON=!!on; document.getElementById('art').classList.toggle('editing',ON);
    var g=document.getElementById('lock'); g.classList.toggle('unlocked',ON); g.innerHTML=ON?UNLOCK_SVG:LOCK_SVG;
    g.title=ON?'Editing unlocked — click to lock':'Locked — click to edit';
    document.getElementById('save').className=ON?'show':''; render(); }
/*</EDIT>*/
  render();
/*<EDIT>*/
  // ── the action-title editor — THE house standard (editable-deliverable.md):
  //    sidebar, rendered preview of the end formatting, hints, highlight helper.
  function openTitle(){ if(!ON||!edp) return;
    edp.innerHTML='<div class="edh"><button class="x" id="edx">&times;</button><div class="row"><span class="kind">Narrative</span><h3>Action title</h3></div></div>'+
      '<div class="edb"><div class="f"><label>Action title</label><textarea id="f_km">'+esc(DATA.keyMessage||'')+'</textarea>'+
      '<button class="kmhl" id="km_hl" title="Wrap the selected words in **…** so they render green"><span class="swch"></span>Highlight selection</button></div>'+
      '<div class="f"><label>Preview, exactly as it renders</label><div class="kmprev" id="km_prev"></div></div>'+
      '<div class="kmhints"><b>Formatting</b>'+
      '<span class="kchip">**37%**</span> &rarr; <span style="color:var(--green);font-weight:700">37%</span>, a green highlight for the load-bearing numbers and words.<br>'+
      'Everything else renders <span style="color:var(--navy);font-weight:700" class="dk">bold navy</span> automatically, with no HTML needed. Tags are not interpreted.<br>'+
      '<b style="margin-top:7px">Good title checklist</b>'+
      'The conclusion, not the topic &middot; at least two numbers &middot; one implication &middot; no hedging.</div></div>'+
      '<div class="edf"><span class="sp"></span><button class="wbtn" id="edc">Cancel</button><button class="wbtn pri" id="edok">Apply</button></div>';
    edp.classList.add('on');
    var ta=edp.querySelector('#f_km'), pv=edp.querySelector('#km_prev');
    function upd(){pv.innerHTML=ta.value?hl(ta.value):'<span style="color:var(--mut);font-style:italic;font-weight:600;font-size:.85em">Key message to be drafted</span>';}
    function grow(){ta.style.height='auto';ta.style.height=(ta.scrollHeight+2)+'px';}
    ta.addEventListener('input',function(){upd();grow();}); upd(); setTimeout(grow,10); ta.focus();
    edp.querySelector('#km_hl').onclick=function(){
      var s=ta.selectionStart,e=ta.selectionEnd,v=ta.value;
      if(s===e){ta.focus();return;}
      var sl=v.slice(s,e);
      if(/^\*\*[\s\S]*\*\*$/.test(sl)){ta.value=v.slice(0,s)+sl.slice(2,-2)+v.slice(e);ta.setSelectionRange(s,e-4);}
      else{ta.value=v.slice(0,s)+'**'+sl+'**'+v.slice(e);ta.setSelectionRange(s,e+4);}
      upd();grow();ta.focus(); };
    edp.querySelector('#edx').onclick=edp.querySelector('#edc').onclick=closeEd;
    edp.querySelector('#edok').onclick=function(){ var km=ta.value.trim();
      if(km!==(DATA.keyMessage||'')){DATA.keyMessage=km;document.getElementById('title').innerHTML=hl(km);pushOp({op:'keyMessage',value:km});}
      closeEd(); }; }
  (function(){ var g=document.getElementById('lock'), b=document.getElementById('save');
    if(g) g.onclick=function(e){e.stopPropagation(); setEditing(!ON);};
    if(b) b.onclick=exportDelta;
    var h=document.getElementById('title'); if(h) h.onclick=function(){ if(ON) openTitle(); };
    setEditing(false); })();
/*</EDIT>*/
})();
</script>
</body></html>
