<!doctype html>
<!-- ============================================================================
  ORG BASELINE — interactive org-tree artifact (org-baseline instrument)
  Chrome = the canonical editable artifact shell (artifact-shell-editable.html):
  navy rail, NR pill + track chip, action-title h1, subrow, view/theme segs,
  source+legend footer. Only the view body (the org tree) is instrument-specific.
  render_org.py emits TWO builds: the client org-baseline.html (edit fences
  stripped, zero editor references; the only file you SEND) and
  org-baseline.WORKING.html (lock-by-default editing; exports a names-based delta
  for apply_org_delta.py). The browser never mints a persisted ID and never
  writes the capture. Only the /* DATA */ block changes per engagement.
============================================================================ -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Org Baseline · Nova Reperta</title>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}
  /* ===== BRAND THEME (inlined from assets/brand.css — canonical values) ===== */
  #art{--navy:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;
      --slate-10:rgba(54,65,86,.09);--navy-10:rgba(11,35,71,.10);--green-10:rgba(28,122,74,.10);--accent-10:rgba(110,177,209,.13);
      --rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;--rag-green-text:#2F8F6B;--rag-amber-text:#B97F22;--rag-red-text:#C2483D;--rag-na-text:#6B7480;--tint-green:rgba(47,143,107,.12);--tint-amber:rgba(212,154,58,.16);--tint-red:rgba(210,100,90,.13);--tint-na:rgba(154,164,176,.16);--navy-fill:#0B2347;--green-text:var(--green);
      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #art[data-t="dark"]{--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--navy-fill:#243246;--accent:#8FC7E8;--steel:#93A9C4;--rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;--rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;--tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);--green-text:#5FBF94;--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}
  body:has(#art[data-t="dark"]){--page:#0E1620}
  button{font-family:inherit;cursor:pointer;border:0;background:transparent}
  input,textarea,select{font-family:inherit;outline:none}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:3}
  .tags{display:flex;align-items:center;gap:11px;min-width:0}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)}
  .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:11.5px;letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #art[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  .ctrls{display:flex;gap:9px;flex:none}
  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0;max-width:1300px}
  #art[data-t="dark"] h1{color:#EAEFF5}
  h1 .hl{color:var(--green)}
  h1 .km-empty{color:var(--mut);font-style:italic;font-weight:600;font-size:.75em}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 16px}
  .subt{font-size:15px;font-weight:600;color:var(--accent)}
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #canvas{position:absolute;inset:0;overflow:hidden}
  /* ===== ORG TREE (instrument-specific view body) ===== */
  .tree-wrap{display:flex;justify-content:center;min-width:max-content;position:relative;padding:14px 0 16px}
  .lines-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .tn{display:flex;flex-direction:column;align-items:center}
  .tn-children{display:flex;gap:10px;align-items:flex-start;padding-top:30px}
  .nc{border-radius:10px;padding:9px 13px;position:relative;min-width:140px;max-width:215px;
    transition:transform .1s,box-shadow .1s,outline-color .13s;border:2px solid transparent}
  .nc.sel{border-color:var(--accent)!important;box-shadow:0 0 0 3px rgba(110,177,209,.22)}
  .t-company .nc{background:var(--accent);min-width:180px}
  .t-company .n-name{font-size:14px;font-weight:700;color:var(--navy)}
  .t-company .n-fte{font-size:12px;color:var(--navy2);margin-top:3px}
  .t-company .n-sub{font-size:10px;color:var(--slate);margin-top:4px;letter-spacing:.4px}
  .t-dept .nc{background:var(--card);border-color:var(--line)!important;border-top:3px solid var(--navy)!important;box-shadow:var(--sh)}
  .t-dept .n-name{font-size:12.5px;font-weight:700;color:var(--navy)}
  .t-dept .n-fte{font-size:11px;color:var(--txt);margin-top:2px}
  .t-team.in .nc{background:var(--card);border-color:var(--line);box-shadow:var(--sh)}
  .t-team.out .nc{background:var(--slate-10);border-color:var(--line)}
  .t-team .n-name{font-size:12px;font-weight:700;color:var(--navy)}
  .t-team.out .n-name{color:var(--mut)}
  .t-team .n-fte{font-size:11px;color:var(--txt);margin-top:2px}
  .t-team .n-desc{font-size:10px;color:var(--mut);font-style:italic;margin-top:5px;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .n-mgr{display:flex;align-items:center;gap:5px;margin-top:4px}
  .t-team .n-mgr{font-size:10px;color:var(--steel)}
  .t-team .n-pills{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
  .t-sub.in .nc{background:var(--green-10);border-color:rgba(28,122,74,.2)}
  .t-sub.out .nc{background:var(--slate-10);border-color:var(--line)}
  .t-sub .n-name{font-size:11px;font-weight:700;color:var(--navy)}
  .t-sub.out .n-name{color:var(--mut)}
  .t-sub .n-fte{font-size:10.5px;color:var(--txt);margin-top:2px}
  .t-sub .n-desc{font-size:9.5px;color:var(--mut);font-style:italic;margin-top:4px;line-height:1.35}
  .t-sub .n-mgr{font-size:9.5px;color:var(--steel);margin-top:3px;gap:4px}
  .t-ssub.in .nc{background:var(--accent-10);border-color:rgba(110,177,209,.3)}
  .t-ssub.out .nc{background:var(--slate-10);border-color:var(--line)}
  .t-ssub .n-name{font-size:10.5px;font-weight:700;color:var(--navy)}
  .t-ssub.out .n-name{color:var(--mut)}
  .t-ssub .n-fte{font-size:10px;color:var(--txt);margin-top:2px}
  .t-ssub .n-desc{font-size:9px;color:var(--mut);font-style:italic;margin-top:4px;line-height:1.3}
  .t-ssub .n-mgr{font-size:9px;color:var(--steel);margin-top:3px;gap:3px}
  .t-ssub .mgr-name{font-size:9px}
  .mgr-name{font-size:10px;color:var(--steel)}
  .t-company .mgr-name{color:var(--navy2);font-size:10.5px}
  #art[data-t="dark"] .t-company .mgr-name{color:var(--txt)}
  .t-sub .mgr-name{font-size:9.5px}
  #art[data-t="dark"] .t-company .nc{background:var(--navy-fill)}
  #art[data-t="dark"] .t-company .n-name{color:var(--ink)}
  #art[data-t="dark"] .t-company .n-fte{color:var(--txt)}
  #art[data-t="dark"] .t-company .n-sub{color:var(--mut)}
  #art[data-t="dark"] .stat-n.g{color:var(--green-text)!important}
  #art[data-t="dark"] .t-dept .n-name,#art[data-t="dark"] .t-team .n-name,
  #art[data-t="dark"] .t-sub .n-name,#art[data-t="dark"] .t-ssub .n-name{color:#EAEFF5}
  .sc-badge{position:absolute;top:-8px;right:8px;font-size:8.5px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:999px}
  .sc-in{background:var(--green);color:#fff}
  .sc-out{background:var(--mut);color:#fff}
  .ep{font-size:9px;font-weight:600;padding:2px 6px;border-radius:999px}
  .ep-ext{background:rgba(110,177,209,.18);color:#2E5C8A}
  .ep-vac{background:var(--tint-amber);color:var(--rag-amber-text)}
  .ep-sick{background:var(--tint-red);color:var(--rag-red-text)}
  .ep-stu{background:var(--tint-na);color:var(--rag-na-text)}
  #art[data-t="dark"] .ep-ext{color:#A9D5E6}
  .n-scope-row{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
  .sc-in-sm{font-size:9.5px;font-weight:700;background:var(--tint-green);color:var(--green-text);padding:2px 7px;border-radius:999px}
  .sc-out-sm{font-size:9.5px;font-weight:700;background:var(--tint-na);color:var(--rag-na-text);padding:2px 7px;border-radius:999px}
  .compact .n-desc,.compact .n-mgr,.compact .n-pills,.compact .n-sub,.compact .n-scope-row{display:none}
  .compact .nc{min-width:110px;max-width:150px;padding:8px 11px}
  .compact .sc-badge{font-size:8px;padding:1px 5px;right:6px}
  /* ===== TREE VIEWPORT: pan / zoom / collapse ===== */
  #canvas.grabbable{cursor:grab}
  #canvas.grabbing{cursor:grabbing}
  #canvas.grabbing .nc{pointer-events:none}
  .zoombox{display:flex;align-items:center;background:var(--slate-10);border-radius:999px;padding:3px;gap:1px}
  .zoombox button{font-size:13px;font-weight:700;color:var(--mut);width:26px;height:26px;border-radius:999px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center}
  .zoombox button:hover{background:var(--card);color:var(--ink)}
  .zoombox button.wide{width:auto;padding:0 10px;font-size:11px;font-weight:600}
  .zoombox .zlvl{font-size:11px;font-weight:700;color:var(--txt);min-width:38px;text-align:center;letter-spacing:-.2px}
  .zoombox.tight #z-fit{color:var(--rag-amber-text);position:relative}
  .zoombox.tight #z-fit::after{content:'';position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--rag-amber)}
  .tog{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;
    background:var(--card);border:1.5px solid var(--line);color:var(--mut);font-size:11px;font-weight:800;line-height:1;
    display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:0 2px 5px rgba(20,30,50,.10);padding:0}
  .tog:hover{border-color:var(--navy);color:var(--navy)}
  .tog .cnt{font-size:9px;font-weight:800}
  .tn.collapsed>.tn-children{display:none}
  /* ===== MATRIX VIEW ===== */
  .matrix-mode{min-width:unset!important;width:100%;padding:0}
  .matrix-wrap{width:100%;background:var(--card)}
  .mtbl{width:100%;border-collapse:collapse;font-size:13px}
  .mtbl th{text-align:left;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:700;
    padding:0 16px 9px 0;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--card);position:sticky;top:0;z-index:2}
  .mtbl th:nth-child(4),.mtbl th:nth-child(5){text-align:right}
  .mtbl td{font-size:13px;color:var(--txt);padding:9px 16px 9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
  .mtbl tbody tr:hover td{background:var(--slate-10)}
  .mtbl .tot-row td{font-weight:700;color:var(--navy);border-top:2px solid var(--navy);border-bottom:0}
  #art[data-t="dark"] .mtbl .tot-row td{color:#EAEFF5}
  .t-name{font-weight:700;color:var(--navy);font-size:13px;line-height:1.3}
  #art[data-t="dark"] .t-name{color:#EAEFF5}
  .t-desc{font-size:10.5px;color:var(--mut);font-style:italic;margin-top:2px;line-height:1.35}
  .d-badge{background:var(--slate-10);color:var(--slate);font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap;display:inline-block}
  #art[data-t="dark"] .d-badge{color:#C4CEDA}
  .fte-row{display:flex;align-items:center;gap:8px}
  .fte-n{font-size:13px;font-weight:700;color:var(--navy);min-width:36px;text-align:right}
  #art[data-t="dark"] .fte-n{color:#EAEFF5}
  .fte-bar{height:5px;background:var(--line);border-radius:3px;flex:1;min-width:50px}
  .fte-bar-f{height:100%;background:var(--green);border-radius:3px;transition:width .3s}
  .fte-bar-f.out{background:var(--mut)}
  .m-sc-in{background:var(--tint-green);color:var(--green-text);font-size:10px;font-weight:700;padding:3px 9px;border-radius:4px;display:inline-block}
  .m-sc-out{background:var(--slate-10);color:var(--mut);font-size:10px;font-weight:700;padding:3px 9px;border-radius:4px;display:inline-block}
  .m-indent-1{padding-left:28px!important}
  .m-indent-2{padding-left:44px!important}
  /* ===== SUMMARY ROW (computed) ===== */
  .sumrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:10px 0 4px;transition:opacity .15s,filter .15s}
  .stat{display:flex;flex-direction:column}
  .stat-n{font-size:17px;font-weight:800;color:var(--navy);line-height:1}
  #art[data-t="dark"] .stat-n{color:#EAEFF5}
  .stat-n.g{color:var(--green)!important}
  .stat-n.warn{color:var(--rag-amber)!important}
  .stat-l{font-size:9.5px;color:var(--mut);margin-top:2px;letter-spacing:.2px}
  .sdiv{width:1px;height:28px;background:var(--line)}
  /* ===== FOOTER ===== */
  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:8px;font-size:clamp(9.5px,0.75vw,12px);color:var(--mut)}
  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legend{display:flex;gap:7px;align-items:center}
  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600}
  /*<EDIT>*/
  /* ===== EDIT LAYER (stripped from the client build) ===== */
  /* coverage flags are an INTERNAL data-quality signal — working build only */
  .gap-dot{position:absolute;top:-6px;left:8px;width:12px;height:12px;border-radius:50%;
    background:var(--rag-amber);border:2px solid var(--card);cursor:help}
  .lg-gap{width:10px;height:10px;border-radius:50%;background:var(--rag-amber);display:inline-block}
  /* a suggested (derived) value — visibly not a measured one */
  .st input.sugg{border-color:var(--rag-amber);border-style:dashed;background:var(--tint-amber)}
  #art.editing .nc{cursor:pointer}
  #art.editing .nc:hover{outline:2px solid var(--accent);outline-offset:2px;transform:translateY(-1px)}
  #art.editing h1{cursor:pointer}
  #art.editing h1:hover{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
  #art.editing .nr-locked{opacity:.5;filter:saturate(.7);cursor:help}
  #lock{width:34px;height:34px;border:1px solid var(--line);background:var(--card);border-radius:9px;color:var(--mut);display:inline-flex;align-items:center;justify-content:center}
  #lock svg{width:17px;height:17px;display:block}
  #lock.unlocked{background:var(--rag-amber);border-color:var(--rag-amber);color:#fff}
  #save{font-size:12px;font-weight:700;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:8px 13px;border-radius:9px;display:none}
  #save.show{display:inline-flex}
  #save:disabled{opacity:.45;cursor:default}
  .lockchip{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
    color:var(--mut);background:var(--slate-10);padding:2px 8px;border-radius:999px;margin-left:8px}
  /* the add button and its mirror spacer are the SAME fixed width, so a branch row
     stays symmetric and the parent card keeps sitting on the centre of its children */
  .add-btn{border:2px dashed var(--line);background:var(--card);border-radius:8px;padding:8px 6px;font-size:11px;color:var(--mut);
    display:none;align-items:center;justify-content:center;gap:5px;width:118px;flex:none;white-space:nowrap;transition:all .15s}
  .add-sp{width:118px;flex:none;display:none}
  #art.editing .add-btn{display:flex}
  #art.editing .add-sp{display:block}
  .add-btn:hover{border-color:var(--navy)!important;color:var(--navy);background:var(--navy-10)}
  /* .nr-panel — the standard editing sidebar */
  .nr-panel{position:fixed;top:0;right:0;bottom:0;width:410px;max-width:92vw;overflow:hidden;background:var(--card);
    border-left:1px solid var(--line);box-shadow:-18px 0 44px -24px rgba(11,35,71,.4);z-index:90;display:none;flex-direction:column}
  .nr-panel.on{display:flex}
  .nrp-hdr{flex:none;position:relative;padding:14px 20px 12px;border-bottom:1px solid var(--line);background:var(--slate-10)}
  .nrp-row{display:flex;align-items:center;gap:9px;padding-right:40px}
  .nrp-kind{flex:none;font-size:8.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--navy);padding:3px 7px;border-radius:5px}
  .nrp-ttl{margin:0;font-size:15px;font-weight:800;color:var(--ink);line-height:1.25}
  .nrp-x{position:absolute;top:12px;right:15px;width:26px;height:26px;font-size:19px;color:var(--mut);border-radius:6px}
  .nrp-body{flex:1;min-height:0;overflow:auto;padding:16px 20px}
  .nrp-ftr{flex:none;display:flex;gap:8px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:var(--slate-10);position:relative}
  .nrp-ftr .sp{flex:1}
  .wbtn{font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px}
  .wbtn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
  .wbtn.menu{width:34px;text-align:center;padding:8px 0}
  .nrp-menu{position:absolute;bottom:52px;left:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 16px 34px -16px rgba(11,35,71,.5);padding:4px;display:none;z-index:5}
  .nrp-menu.on{display:block}
  .nrp-menu button{display:block;width:100%;text-align:left;font-size:12.5px;padding:7px 12px;border-radius:6px;color:var(--rag-red);font-weight:600}
  .nrp-menu button:hover{background:rgba(210,100,90,.1)}
  .f{margin-bottom:12px}
  .f label{display:block;font-size:10px;font-weight:700;color:var(--txt);margin:0 0 4px;letter-spacing:.3px;text-transform:uppercase}
  .f.req label::after{content:' *';color:var(--rag-red)}
  .f input,.f textarea{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    font:inherit;font-size:12.5px;color:var(--ink);background:var(--card);transition:border-color .15s;resize:vertical}
  .f input:focus,.f textarea:focus{border-color:var(--navy)}
  .f textarea{min-height:58px;line-height:1.5}
  .nr-metablock{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
  .nr-metablock .f{margin-bottom:8px}
  .nr-metablock .f:last-child{margin-bottom:0}
  .f-sec{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--navy);padding:12px 0 7px;border-bottom:1.5px solid var(--line);margin:4px 0 10px}
  #art[data-t="dark"] .f-sec{color:#EAEFF5}
  .tr{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);margin-bottom:10px}

  .st .tot td{font-weight:700;color:var(--navy);border-top:2px solid var(--navy);border-bottom:0}
  #art[data-t="dark"] .st .tot td{color:#EAEFF5}
  .hint{font-size:10.5px;color:var(--mut);margin-top:4px;font-style:italic}

  .km-prev{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);

  #art[data-t="dark"] .km-prev{color:#EAEFF5}
  .km-prev .hl{color:var(--green)}
  .km-prev .km-empty{color:var(--mut);font-style:italic;font-weight:600;font-size:.85em}
  .km-hints{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:12px;font-size:11px;color:var(--txt);line-height:1.7}
  .km-hints b{display:block;font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
  .kchip{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;background:var(--slate-10);padding:1px 5px;border-radius:4px;white-space:nowrap}
  .km-hlbtn{font-size:11px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:5px 10px;border-radius:7px;margin-top:6px;display:inline-flex;align-items:center;gap:5px}
  .km-hlbtn .swch{width:10px;height:10px;border-radius:3px;background:var(--green);display:inline-block}

  #inc-nav:hover .stat-n{text-decoration:underline}
  /* toast */

/* ---- viewport: fit, zoom and pan --------------------------------------
   Auto-fit alone made a real client org unreadable: a wide tree scaled to
   ~15% with no way back in. The fit is now CLAMPED at FITMIN and the frame
   is pannable (drag, two-finger swipe) and zoomable (ctrl/⌘+wheel, buttons),
   so the tree is navigated rather than shrunk. Nothing here is edit-only —
   the client build gets the same navigation.                              */
var PZ={s:1,x:0,y:0,fit:1,W:0,H:0,manual:false};
var ZMIN=0.2,ZMAX=2.5,FITMIN=0.5;
function clampPZ(){
  var canvas=document.getElementById('canvas');
  if(!canvas)return;
  var aW=canvas.clientWidth,aH=canvas.clientHeight;
  var sw=PZ.W*PZ.s,sh=PZ.H*PZ.s;
  var mx=Math.max(0,(sw-aW)/2)+90,my=Math.max(0,sh-aH)+90;
  PZ.x=Math.max(-mx,Math.min(mx,PZ.x));
  PZ.y=Math.max(-my,Math.min(90,PZ.y));
}
function applyPZ(){
  var tw=document.getElementById('tw');
  if(!tw||view==='matrix')return;
  clampPZ();
  tw.style.transformOrigin='top center';
  tw.style.transform='translate('+PZ.x.toFixed(1)+'px,'+PZ.y.toFixed(1)+'px) scale('+PZ.s.toFixed(4)+')';
  var l=document.getElementById('z-lvl');
  if(l)l.textContent=Math.round(PZ.s*100)+'%';
  /* say so when the whole tree cannot be shown legibly, instead of silently shrinking */
  var zf=document.getElementById('z-fit'),zb=document.getElementById('zbox');
  if(zf&&zb){
    var tight=PZ.fit<FITMIN-0.001;
    zb.classList.toggle('tight',tight);
    zf.title=tight
      ?'The whole tree does not fit legibly at this size — drag to pan, or collapse branches'
      :'Fit the whole tree in the frame';
  }
  drawLines();
}
function zoomTo(s,ax,ay){
  var canvas=document.getElementById('canvas');
  var aW=canvas.clientWidth,cx=aW/2;
  var s2=Math.max(ZMIN,Math.min(ZMAX,s));
  if(ax==null){ax=cx;ay=Math.min(canvas.clientHeight/2,120);}
  var ex=(ax-cx-PZ.x)/PZ.s+cx, ey=(ay-PZ.y)/PZ.s;
  PZ.x=ax-cx-(ex-cx)*s2; PZ.y=ay-ey*s2; PZ.s=s2; PZ.manual=true;
  applyPZ();
}
/* keep=true on a re-render so an edit never throws away the consultant's viewport.
   FITSEQ: two fits can be in flight at once (init renders twice). The old code let
   the LATER rAF measure after the earlier one had already restored width:100%, so it
   read the frame width as the tree width and "fitted" to ~99% — the tree was never
   actually scaled, just clipped. Measure inside the rAF, and let only the newest win. */
var FITSEQ=0;
function fitTree(keep){
  if(view==='matrix')return;
  var my=++FITSEQ;
  var canvas=document.getElementById('canvas'),tw=document.getElementById('tw');
  requestAnimationFrame(function(){
    if(my!==FITSEQ)return;
    tw.style.transform='';tw.style.width='max-content';tw.style.minWidth='max-content';
    var aW=canvas.clientWidth-16,aH=canvas.clientHeight-16;
    var tW=tw.offsetWidth,tH=tw.offsetHeight;   /* same tick as the style write — forces reflow */
    tw.style.width='100%';tw.style.minWidth='unset';
    if(!aW||!tW){renderSum();return;}
    PZ.W=tW;PZ.H=tH;
    PZ.fit=Math.min(1,aW/tW,aH/tH);
    if(!(keep&&PZ.manual)){

      PZ.s=Math.max(FITMIN,PZ.fit);PZ.x=0;PZ.y=0;PZ.manual=false;

function bindViewport(){
  var canvas=document.getElementById('canvas');
  canvas.classList.add('grabbable');
  /* two-finger swipe / wheel pans; ctrl or ⌘ + wheel zooms about the pointer */
  canvas.addEventListener('wheel',function(e){
    if(view==='matrix')return;
    e.preventDefault();
    if(e.ctrlKey||e.metaKey){
      var r=canvas.getBoundingClientRect();
      zoomTo(PZ.s*(e.deltaY<0?1.12:1/1.12),e.clientX-r.left,e.clientY-r.top);
    }else{
      PZ.x-=e.deltaX;PZ.y-=e.deltaY;PZ.manual=true;applyPZ();
    }
  },{passive:false});
  var down=null;
  canvas.addEventListener('pointerdown',function(e){
    if(view==='matrix'||e.button!==0)return;
    down={x:e.clientX,y:e.clientY,px:PZ.x,py:PZ.y,moved:false};
    PANNED=false;
  });
  canvas.addEventListener('pointermove',function(e){
    if(!down)return;
    var dx=e.clientX-down.x,dy=e.clientY-down.y;
    if(!down.moved&&Math.abs(dx)+Math.abs(dy)<4)return;   /* let a real click through */
    if(!down.moved){down.moved=true;canvas.classList.add('grabbing');try{canvas.setPointerCapture(e.pointerId);}catch(_){}}
    PZ.x=down.px+dx;PZ.y=down.py+dy;PZ.manual=true;applyPZ();
  });
  function up(e){
    if(!down)return;
    PANNED=down.moved;
    canvas.classList.remove('grabbing');
    try{canvas.releasePointerCapture(e.pointerId);}catch(_){}
    down=null;
    setTimeout(function(){PANNED=false;},0);
  }
  canvas.addEventListener('pointerup',up);
  canvas.addEventListener('pointercancel',up);
  /* keyboard: arrows pan, +/- zoom, 0 refits — reachable without a trackpad */
  document.addEventListener('keydown',function(e){
    if(view==='matrix')return;
    var t=e.target;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
    var step=e.shiftKey?200:70;
    if(e.key==='ArrowLeft'){PZ.x+=step;}
    else if(e.key==='ArrowRight'){PZ.x-=step;}
    else if(e.key==='ArrowUp'){PZ.y+=step;}
    else if(e.key==='ArrowDown'){PZ.y-=step;}
    else if(e.key==='+'||e.key==='='){zoomTo(PZ.s*1.15);return;}
    else if(e.key==='-'||e.key==='_'){zoomTo(PZ.s/1.15);return;}
    else if(e.key==='0'){fitTree(false);return;}
    else return;
    e.preventDefault();PZ.manual=true;applyPZ();
  });
  var zi=document.getElementById('z-in'),zo=document.getElementById('z-out'),
      zf=document.getElementById('z-fit'),zc=document.getElementById('z-coll');
  if(zi)zi.onclick=function(){zoomTo(PZ.s*1.15);};
  if(zo)zo.onclick=function(){zoomTo(PZ.s/1.15);};
  if(zf)zf.onclick=function(){fitTree(false);};
  if(zc)zc.onclick=function(){
    var anyOpen=false;
    (function w(n,d){if(d>0&&(n.children||[]).length&&!n.__collapsed)anyOpen=true;(n.children||[]).forEach(function(c){w(c,d+1);});})(T,0);
    collapseAll(anyOpen);
    zc.textContent=anyOpen?'Expand all':'Collapse all';
  };
}

function refreshSave(){
  var n=DELTA.filter(Boolean).length+(KM_CHANGED?1:0);
  var b=document.getElementById('save');
  b.className=ON?'show':'';b.disabled=!n;
  b.textContent=n?('Export '+n+' change'+(n>1?'s':'')):'No changes';

function nodeRecord(n){
  var r={type:n.type,name:n.name||'',notes:n.notes||''};
  if(n.type==='company'){r.sector=n.sector||'';r.manager=n.manager||null;}
  if(n.type==='department'){r.manager=n.manager||null;}
  if(isTeam(n)){
    r.service_description=n.service_description||'';
    r.manager=n.manager||null;r.in_scope=!!n.in_scope;
    r.staff=n.staff||{};r.fte_inscope=n.fte_inscope!=null?n.fte_inscope:null;
    r.source=n.source||'';
  }
  return r;
}
function recordUpdate(n,changes){
  var op=OPBY[n.__rid];
  if(op&&op.op==='add'){op.node=nodeRecord(n);}
  else if(op&&op.op==='update'){Object.assign(op.changes,changes);}
  else{
    if(!n.__origPath)n.__origPath=pathOf(n);
    op={op:'update',path:n.__origPath,changes:changes};
    DELTA.push(op);OPBY[n.__rid]=op;
  }
  refreshSave();
}
function recordAdd(n,parent){
  var op={op:'add',ref:n.__rid,type:n.type,node:nodeRecord(n)};
  if(OPBY[parent.__rid]&&OPBY[parent.__rid].op==='add')op.parentRef=parent.__rid;
  else op.parentPath=parent.__origPath||pathOf(parent);
  DELTA.push(op);OPBY[n.__rid]=op;
  refreshSave();
}
function recordRemove(n){
  (n.children||[]).slice().forEach(recordRemove);
  var op=OPBY[n.__rid];
  if(op&&op.op==='add'){DELTA[DELTA.indexOf(op)]=null;}
  else{
    if(op&&op.op==='update')DELTA[DELTA.indexOf(op)]=null;
    DELTA.push({op:'remove',path:n.__origPath||pathOf(n),type:n.type});
  }
  delete OPBY[n.__rid];
  refreshSave();
}

    (n.type!=='company'?'<button id="np-del">Delete node (and children)</button>':'')+
    '</div>';
  h2+='<span class="sp"></span>';
  if(ct)h2+='<button class="wbtn" id="np-add">+ '+cl[ct]+'</button>';
  h2+='<button class="wbtn pri" id="np-close">Close</button>';
  ftr.innerHTML=h2;
  var mb=ftr.querySelector('#np-menu-btn'),menu=ftr.querySelector('#np-menu');
  if(mb)mb.onclick=function(e){e.stopPropagation();menu.classList.toggle('on');};
  document.addEventListener('click',function(){if(menu)menu.classList.remove('on');},{once:true});
  var rev=ftr.querySelector('#np-revert');
  if(rev)rev.onclick=function(){revertNode(n);};
  var del=ftr.querySelector('#np-del');
  if(del)del.onclick=function(){
    if(!confirm('Delete this node and all its children? The removal is staged in the delta — nothing is final until the delta is applied.'))return;
    recordRemove(n);
    var p=n.__parent;
    if(p&&p.children)p.children.splice(p.children.indexOf(n),1);
    closePanel();
  };
  var ad=ftr.querySelector('#np-add');
  if(ad)ad.onclick=function(){addNode(n.__rid,ct);};
  ftr.querySelector('#np-close').onclick=closePanel;
  document.getElementById('np-x').onclick=closePanel;
  document.getElementById('np').classList.add('on');
}
function openPanelTotals(n){
  /* refresh the computed total row without rebuilding the whole panel */
  var tot=document.querySelector('#np-body .st .tot');
  if(!tot||!isTeam(n))return;
  var o=ownFte(n);
  tot.innerHTML='<td>Total (incl. mgr)</td><td style="text-align:right">'+f(o.fte)+'</td><td style="text-align:right">'+o.hc+'</td>';
}

/* ---- node add (runtime ref only — apply_org_delta.py mints the persisted ID) ---- */
function addNode(prid,type){
  var p=nm[prid];if(!p)return;
  var nn={id:null,type:type,name:'',children:[],__rid:'tmp'+(++TMPN)};
  if(type==='department'){nn.manager=null;nn.direct_reports={fte:0,hc:0};}
  if(type==='team'||type==='subteam'||type==='subsubteam'){
    nn.service_description='';
    nn.manager={name:'',fte_total:null,fte_mgmt:null,fte_ops:null};
    nn.in_scope=true;nn.fte_inscope=null;nn.source='';
    nn.staff={regular:{fte:null,hc:null},external:{fte:null,hc:null},
      vacancy:{fte:null,hc:null},longsick:{fte:null,hc:null},student:{fte:null,hc:null}};
  }
  if(!p.children)p.children=[];
  p.children.push(nn);
  nn.__parent=p;nm[nn.__rid]=nn;
  recordAdd(nn,p);
  render();setTimeout(function(){sel(nn.__rid);},60);
}

/* ---- action title: ALWAYS editable while unlocked — in the SIDEBAR, with the
   end formatting rendered live + formatting hints (the house standard) ---- */
function openTitle(){
  if(!ON)return;
  document.getElementById('np-kind').textContent='Narrative';
  document.getElementById('np-ttl').textContent='Action title';
  var b=document.getElementById('np-body');
  b.innerHTML=
    '<div class="f"><label>Action title</label>'+
    '<textarea id="f_km" placeholder="The conclusion, not the topic — with at least two numbers.">'+x(DATA.meta.keyMessage||'')+'</textarea>'+
    '<button class="km-hlbtn" id="km_hl" title="Wrap the selected words in **…** so they render green"><span class="swch"></span>Highlight selection</button>'+
    ' <button class="km-hlbtn" id="km_sug" title="Compose a starting title from the computed stats — deterministic, no invented numbers">Suggest a starting title</button></div>'+
    '<div class="f"><label>Preview — exactly as it renders</label><div class="km-prev" id="km_prev"></div></div>'+
    '<div class="km-hints"><b>Formatting</b>'+
    '<span class="kchip">**41,3 FTE**</span> &rarr; <span style="color:var(--green);font-weight:700">41,3 FTE</span> — green highlight for the load-bearing numbers and words.<br>'+
    'Everything else renders <span style="color:var(--navy);font-weight:700">bold navy</span> automatically — no HTML needed (tags are not interpreted).<br>'+
    '<b style="margin-top:7px">Good title checklist</b>'+
    'The conclusion, not the topic · ≥2 numbers · one structural implication · no hedging.</div>';
  var ftr=document.getElementById('np-ftr');
  ftr.innerHTML='<span class="sp"></span><button class="wbtn" id="km_cancel">Cancel</button><button class="wbtn pri" id="km_apply">Apply</button>';
  var ta=b.querySelector('#f_km'),pv=b.querySelector('#km_prev');
  function upd(){pv.innerHTML=ta.value?hlMsg(ta.value):'<span class="km-empty">Key conclusion to be drafted</span>';}
  function grow(){ta.style.height='auto';ta.style.height=(ta.scrollHeight+2)+'px';}
  ta.addEventListener('input',function(){upd();grow();});
  upd();setTimeout(grow,10);ta.focus();
  b.querySelector('#km_hl').onclick=function(){
    var s=ta.selectionStart,e=ta.selectionEnd,v=ta.value;
    if(s===e){toast('Select the words to highlight first, then click the button.');ta.focus();return;}
    var sel=v.slice(s,e);
    if(/^\*\*[\s\S]*\*\*$/.test(sel)){ta.value=v.slice(0,s)+sel.slice(2,-2)+v.slice(e);ta.setSelectionRange(s,e-4);}
    else{ta.value=v.slice(0,s)+'**'+sel+'**'+v.slice(e);ta.setSelectionRange(s,e+4);}
    upd();grow();ta.focus();
  };
  var st=summary(T),ms=mgrSplitStats();
  b.querySelector('#km_sug').onclick=function(){
    var draft=(DATA.meta.team||'The scope')+' runs **'+f(st.fte_inscope)+' FTE in scope** across '+
      st.teams_inscope+' teams and '+st.org_layers+' org layers; **'+ms.split+' of '+ms.named+
      '** named managers quantify their management split.';
    if(ta.value.trim()&&!confirm('Replace the current title with the suggested draft?'))return;
    ta.value=draft;upd();grow();ta.focus();
  };
  function close(){document.getElementById('np').classList.remove('on');}
  ftr.querySelector('#km_cancel').onclick=close;
  document.getElementById('np-x').onclick=close;
  ftr.querySelector('#km_apply').onclick=function(){
    var km=ta.value.trim();
    if(km!==(DATA.meta.keyMessage||'')){DATA.meta.keyMessage=km;KM_CHANGED=true;refreshSave();renderKeyMsg();}
    close();
  };
  document.getElementById('np').classList.add('on');
}
document.getElementById('title').addEventListener('click',function(){if(ON)openTitle();});

/* ---- locked regions announce themselves ---- */
document.getElementById('sumbar').addEventListener('click',function(e){
  if(!ON)return;
  if(e.target.closest&&e.target.closest('#inc-nav')){gotoNextGap();return;}
  toast('These totals are computed from the node data — edit a team card instead.');
});

/* ---- lock toggle ---- */
function setEditing(on){
  ON=!!on;
  var art=document.getElementById('art');
  art.classList.toggle('editing',ON);
  var g=document.getElementById('lock');
  g.classList.toggle('unlocked',ON);
  g.innerHTML=ON?UNLOCK_SVG:LOCK_SVG;
  g.title=ON?'Editing unlocked — click to lock':'Locked — click to edit';
  document.getElementById('sumbar').classList.toggle('nr-locked',ON);
  refreshSave();
  if(!ON)closePanel();else render();
}
(function(){
  var g=document.getElementById('lock'),b=document.getElementById('save');
  if(g)g.onclick=function(e){e.stopPropagation();setEditing(!ON);};
  if(b)b.onclick=exportDelta;
})();
/*</EDIT>*/

/* ---- init (both builds) ---- */
T=DATA.org;
buildMap(T,null);
renderChrome();
render();
/*<EDIT>*/setEditing(false);/*</EDIT>*/
})();
</script>
