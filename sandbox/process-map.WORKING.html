<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Process Map</title>
<style>
/* Type scale — one place, not case by case. Every size below 12px is a token; the
   whole small end lifts on a narrow screen so nothing drops under 11px on a phone. */
:root{
  --fs-65:6.5px; --fs-7:7px; --fs-75:7.5px; --fs-8:8px; --fs-85:8.5px; --fs-9:9px;
  --fs-95:9.5px; --fs-10:10px; --fs-105:10.5px; --fs-11:11px; --fs-115:11.5px;
}
@media (max-width:760px){
  :root{
    --fs-65:11px; --fs-7:11px; --fs-75:11px; --fs-8:11px; --fs-85:11px; --fs-9:11px;
    --fs-95:11px; --fs-10:11.5px; --fs-105:12px; --fs-11:12px; --fs-115:12.5px;
  }
}
</style>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}
  #pm{--navy:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;
      --slate-10:rgba(54,65,86,.09);--rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;--rag-green-text:#2F8F6B;--rag-amber-text:#B97F22;--rag-red-text:#C2483D;--rag-na-text:#6B7480;--tint-green:rgba(47,143,107,.12);--tint-amber:rgba(212,154,58,.16);--tint-red:rgba(210,100,90,.13);--tint-na:rgba(154,164,176,.16);--navy-fill:#0B2347;
      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;--soft:#F5F7FB;
      --lev-auto:#3B6FBF;--lev-aiacc:#1C7A4A;--lev-aienh:#6EB1D1;--lev-process:#2A4D8F;--lev-journey:#C0392B;--lev-lean:#145530;--lev-data:#B8620A;--lev-change:#6B4E9E;--lev-org:#1F6F66;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #pm[data-t="dark"]{--lev-auto:#6E9BDB;--lev-aiacc:#5FBF94;--lev-aienh:#8FC7E8;--lev-process:#7FA3DB;--lev-journey:#E8877C;--lev-lean:#5FA87F;--lev-data:#D9A05B;--lev-change:#A48CD1;--lev-org:#5FB5A9;--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--soft:#141E2A;--navy-fill:#243246;--navy2:#31517F;--accent:#8FC7E8;--steel:#93A9C4;--rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;--rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;--tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}
  body:has(#pm[data-t="dark"]){--page:#0E1620}
  #pm[data-t="dark"] .prow .pbadge,#pm[data-t="dark"] #pin .ptp,#pm[data-t="dark"] #pin .tchip.pn,#pm[data-t="dark"] #pin .plegend .lp,#pm[data-t="dark"] .pchpill{color:#16202C}
  /*<EDIT>*/#pm[data-t="dark"] #wgear.blocked,#pm[data-t="dark"] #ed .edkind.pain{color:#16202C}/*</EDIT>*/
  #pm[data-t="dark"] #pin .tcb{background:rgba(0,0,0,.22)}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:70}
  /* stacking ladder (chevrons use inline z-index 1..N, so everything else must clear them):
     content 1-10 · sticky grid headers 2-4 · toprow+gear 70 · pin modal 80 · tooltip 85 · editor panel 90 */
  .tags{display:flex;align-items:center;gap:11px;min-width:0}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)}
  .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:var(--fs-115);letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #pm[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  .ctrls{display:flex;gap:9px;flex:none}
  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0;max-width:1300px}
  #pm[data-t="dark"] h1{color:#EAEFF5}
  h1 .hl{color:var(--green)}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 14px}
  .subt{font-size:13.5px;font-weight:600;color:var(--accent)}
  .kpis{display:flex;gap:10px;flex-wrap:wrap}
  .kpi{background:var(--soft);border-radius:12px;padding:7px 14px;min-width:96px}
  .kpi .l{font-size:var(--fs-105);color:var(--mut);font-weight:600}
  .kpi .n{font-size:20px;font-weight:800;color:var(--navy);line-height:1.05}
  #pm[data-t="dark"] .kpi .n{color:#EAEFF5}
  .kpi .n.hl{color:var(--green)} .kpi .n.warn{color:var(--rag-red)}
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:18px}
  #pm.scrollmode #view{overflow:auto}
  #pm.scrollmode #vinner{position:relative;transform:none!important;width:auto!important}
/*<EDIT>*/
  /* the working copy opens as the PROCESS TWIN: a full-screen map over the page (see the edit layer).
     The slides stay underneath, unchanged, and "Preview the slides" brings them back. */
  body.nr-twin{overflow:hidden}
  body.nr-twin #pm{visibility:hidden}
  body.nr-twin #ed,body.nr-twin #apick,body.nr-twin #pinwrap,body.nr-twin #toast{visibility:visible}
  #twinhost .wgrp{display:flex;align-items:center;gap:8px}
  #twinhost .nr-strip{display:none;margin:0;padding:0;border:0;min-height:0;color:#93A4C4;font-size:12px}
  #twinhost.ed .nr-strip{display:flex}
  #twinhost .nr-strip>b{color:#E8EEF9}
  #twinhost #wgear{background:transparent;border-color:#1B2A47;color:#93A4C4}
  #twinhost.nc-light .nr-strip{color:#5A6A88}
  #twinhost.nc-light .nr-strip>b{color:#0E1B33}
  #twinhost.nc-light #wgear{border-color:#D9E1EE;color:#5A6A88}
  #twinback{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:95;border:1px solid rgba(78,134,247,.55);
    background:#0E1A33;color:#C9DAFF;font:inherit;font-size:12.5px;font-weight:700;padding:9px 15px;
    border-radius:999px;cursor:pointer;box-shadow:0 10px 30px -12px rgba(11,35,71,.6)}
/*</EDIT>*/
  .swim{display:grid;gap:7px;min-width:520px}
  .colh{font-size:var(--fs-10);letter-spacing:.5px;font-weight:700;color:var(--mut);text-transform:uppercase;text-align:center;padding:2px 0 3px}
  .lh{background:var(--soft);border-radius:9px;display:flex;align-items:center;padding:0 12px;font-size:12.5px;font-weight:800;color:var(--ink)}
  .cw{background:var(--soft);border-radius:9px;padding:3px}
  .cell{min-height:30px;height:100%;display:flex;flex-direction:column;gap:5px}
  .act{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--rag-na);border-radius:8px;padding:8px 10px;height:100%;cursor:default}
  .act .sn{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.22}
  .act .meta{font-size:var(--fs-10);color:var(--mut);margin-top:2px}
  .tagrow{display:flex;gap:4px;align-items:center;margin-top:6px;flex-wrap:wrap}
  .chip{font-size:var(--fs-95);font-weight:700;padding:1px 7px;border-radius:5px;background:var(--soft);color:var(--txt)}
  .nat{font-size:var(--fs-95);font-weight:700;padding:1px 8px;border-radius:5px;color:#fff;display:inline-block;white-space:nowrap}
  .pn{font-size:var(--fs-95);font-weight:700;padding:1px 7px;border-radius:5px}
  .dgrid{display:grid;gap:5px;min-width:max-content}
  .dband{font-size:var(--fs-105);font-weight:700;color:#fff;border-radius:7px;padding:6px 10px;display:flex;align-items:center;gap:7px}
  .dweek{font-size:var(--fs-95);letter-spacing:.4px;font-weight:700;color:var(--mut);text-transform:uppercase;text-align:center;align-self:center}
  .dlane{background:var(--soft);border-radius:8px;display:flex;align-items:center;padding:0 11px;font-size:var(--fs-115);font-weight:700;color:var(--ink);position:sticky;left:0;z-index:2}
  .dcell{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--rag-na);border-radius:7px;padding:7px 9px;cursor:default;overflow:hidden;display:flex;flex-direction:column;justify-content:center;position:relative;transition:border-color .14s,box-shadow .14s}
  .dcell:hover{border-color:var(--accent);box-shadow:var(--sh)}
  .dcell .dn{font-size:var(--fs-11);font-weight:700;color:var(--ink);line-height:1.2;padding-right:13px}
  .dcell .dm{font-size:var(--fs-9);color:var(--mut);margin-top:2px}
  .dcell .ppn{display:inline-block;margin-top:4px;font-size:var(--fs-85);font-weight:700;padding:0 6px;border-radius:5px}
  .dmile{background:var(--navy-fill);color:#fff;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:var(--fs-10);font-weight:700;text-align:center;padding:6px;writing-mode:vertical-rl;transform:rotate(180deg)}
  .swsub{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .swhint{font-size:var(--fs-105);color:var(--mut)}
  .swg{display:grid;gap:8px;min-width:720px;align-items:stretch}
  .swcorner{position:sticky;left:0;top:0;z-index:4;background:var(--bg)}
  .swch{position:sticky;top:0;z-index:3;background:var(--navy-fill);color:#fff;font-size:var(--fs-11);font-weight:700;padding:8px 12px;border-radius:8px;display:flex;flex-direction:column;gap:4px}
  .swchn{width:17px;height:17px;border-radius:50%;background:#fff;color:var(--navy);font-size:var(--fs-10);font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .swcht{flex:1;min-width:0;line-height:1.2}
  .swchc{font-size:var(--fs-95);font-weight:700;color:rgba(255,255,255,.72);background:rgba(255,255,255,.14);border-radius:999px;padding:1px 7px;flex:none}
  .swlane{position:sticky;left:0;z-index:2;background:var(--soft);border-radius:8px;display:flex;align-items:center;gap:7px;padding:0 12px;font-size:var(--fs-115);font-weight:800;color:var(--ink);min-height:44px}
  .swcell{display:flex;flex-direction:column;gap:6px;padding:2px;min-height:40px}
  .swcell.swempty{background:var(--soft);border-radius:8px;opacity:.45;min-height:0}
  .swact{font-size:var(--fs-8);font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;padding:3px 2px 0}
  .swt{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--rag-na);border-radius:8px;padding:7px 10px;cursor:default;position:relative;transition:border-color .14s,box-shadow .14s}
  .swt:hover{border-color:var(--accent);box-shadow:var(--sh)}
  .swt .swn{font-size:var(--fs-11);font-weight:700;color:var(--ink);line-height:1.28;padding-right:15px}
  .swt .swm{font-size:var(--fs-9);color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .swgo{position:absolute;top:6px;right:7px;color:var(--mut);opacity:.35;transition:.14s;line-height:0;pointer-events:none}
  .swt:hover .swgo,.dcell:hover .swgo{opacity:1;color:var(--accent)}
  .swt .swp{font-size:var(--fs-85);font-weight:700;padding:0 6px;border-radius:5px;background:rgba(210,100,90,.14);color:#C2483D}
  .swchtop{display:flex;align-items:center;gap:8px}
  .swchsub{font-size:var(--fs-9);font-weight:600;color:rgba(255,255,255,.74);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .swchsub b{color:#fff;font-weight:800}
  .swchsub .warn{color:#F3B8B0;font-weight:800}
  .swlane{cursor:pointer}
  .swlane:hover{background:var(--slate-10)}
  .swcaret{font-size:var(--fs-8);color:var(--mut);flex:none;width:8px;transition:transform .15s}
  .swln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .swlsum{font-size:var(--fs-85);font-weight:700;color:var(--mut);flex:none}
  .swrowsum{display:flex;align-items:center;gap:10px;padding:0 13px;font-size:var(--fs-10);color:var(--mut);background:var(--soft);border-radius:8px;cursor:pointer}
  .swrowsum b{color:var(--ink);font-weight:800}
  .swrowsum .warn{color:var(--rag-red);font-weight:800}
  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:10px;font-size:clamp(9.5px,0.75vw,12px);color:var(--mut)}
  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legend{display:flex;gap:7px;flex-wrap:wrap}
  .lp{font-size:0.95em;font-weight:600;padding:0.2em 0.85em;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
  .lp i{width:9px;height:9px;border-radius:3px;display:inline-block}
  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600}
  .cov{margin-top:10px;font-size:var(--fs-105);color:#B07A1E;background:rgba(212,154,58,.10);border:1px solid rgba(212,154,58,.28);border-radius:8px;padding:7px 12px;line-height:1.4}
  .nbwrap{margin-bottom:14px}
  .nblabel{font-size:var(--fs-115);font-weight:600;color:var(--txt);margin-bottom:5px}
  .natbar{display:flex;height:26px;border-radius:7px;overflow:hidden;font-size:var(--fs-10);font-weight:700}
  .natbar>div{display:flex;align-items:center;justify-content:center;color:#fff;min-width:0}
  .natbar>div span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
  .atile{position:relative;border-radius:8px;border:1px solid var(--line);padding:7px 9px;height:100%;min-height:46px;cursor:default}
  .atile .afte{font-size:16px;font-weight:800;color:var(--ink);line-height:1}
  .atile .afte span{font-size:var(--fs-9);font-weight:600;color:var(--mut)}
  .atile .acount{font-size:var(--fs-95);color:var(--mut);margin:2px 0 6px}
  .amix{display:flex;height:5px;border-radius:3px;overflow:hidden}
  .pdot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--rag-red)}
  .lanetot,.phasetot{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--navy)}
  #pm[data-t="dark"] .lanetot,#pm[data-t="dark"] .phasetot{color:var(--ink)}
  .phlabel{display:flex;align-items:center;font-size:var(--fs-95);font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
  .pcard{background:var(--soft);border-radius:10px;padding:8px 11px;display:flex;flex-direction:column;justify-content:center}
  .pcn{font-size:var(--fs-11);font-weight:700;color:var(--ink);line-height:1.2}
  .pcm{font-size:var(--fs-10);color:var(--mut);margin-top:3px}
  .ribbon2{display:flex;gap:5px;margin-bottom:15px}
  .chev2{flex:1;min-width:0;color:var(--ink)}
  .chev2 .c2h{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .chev2 .c2n{width:17px;height:17px;border-radius:50%;background:var(--navy-fill);color:#fff;font-size:var(--fs-10);font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .chev2 .c2t{font-size:12px;font-weight:700;line-height:1.18}
  .chev2 .c2m{font-size:var(--fs-10);font-weight:600;color:var(--mut);margin-bottom:7px}
  .chev2 .c2a{display:flex;gap:3px;flex-wrap:wrap}
  .ochip{font-size:var(--fs-85);font-weight:600;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
  .pcols{display:grid;gap:13px;align-items:start;padding-right:18px;overflow-x:auto}
  .pcol{display:flex;flex-direction:column;gap:9px}
  .pcolh{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:54px;padding-top:5px;padding-bottom:5px;background:var(--navy-fill)}
  .pchev{position:relative;background:var(--bg);padding:3px}
  .pchh{display:flex;align-items:center;gap:7px;margin-bottom:4px}
  .pchn{width:18px;height:18px;border-radius:50%;background:#fff;color:var(--navy);font-size:var(--fs-105);font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .pcht{font-size:clamp(10.5px,1vw,12px);font-weight:700;color:#fff;line-height:1.15;padding-right:16px;overflow-wrap:anywhere}
  .pchm{font-size:clamp(8.5px,0.79vw,9.5px);font-weight:600;color:rgba(255,255,255,.74);padding-right:14px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 5px}
  .pcha{display:flex;gap:3px;flex-wrap:wrap}
  .phead{display:flex;flex-direction:column;gap:4px}
  .pcap{font-size:clamp(9px,0.83vw,10px);font-weight:600;color:var(--mut);padding:0 4px 0 2px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
  .pcolh .cc{font-size:var(--fs-95);font-weight:700;color:var(--rag-red);white-space:nowrap}
  .prow{display:flex;align-items:flex-start;gap:5px;padding:3px 9px;border-bottom:1px solid var(--line);cursor:default}
  .prow:hover{background:var(--slate-10)}
  .prow .pi{font-size:var(--fs-8);color:var(--mut);min-width:13px;padding-top:2px}
  .prow .pt{font-size:var(--fs-95);line-height:1.25;flex:1;min-width:0;color:var(--ink)}
  .prow .owner{font-size:var(--fs-8);font-weight:700;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:0 4px;overflow-wrap:anywhere;flex:none}
  .prow .pbadge{font-size:var(--fs-85);font-weight:700;color:#fff;background:var(--rag-red);border-radius:999px;min-width:14px;text-align:center;padding:0 3px;flex:none}
  .prow .fchip{font-size:var(--fs-8);font-weight:700;color:var(--navy);background:var(--sky);border-radius:4px;padding:0 4px;white-space:nowrap;flex:none}
  .acard{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 16px 0 0;padding:10px 12px;min-height:112px;display:flex;flex-direction:column;overflow:hidden;position:relative;transition:border-color .14s,box-shadow .14s,transform .14s}
  .acn{font-size:clamp(10.5px,1vw,12px);font-weight:700;color:var(--ink);line-height:1.25;padding-right:16px;overflow-wrap:anywhere}
  .acm{font-size:var(--fs-10);color:var(--mut);margin:4px 0 7px}
  .aca{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden;margin-top:auto}
  .ochip2{font-size:var(--fs-85);font-weight:600;color:var(--txt);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 7px;white-space:nowrap}
  .acard .amix{margin-top:6px}
  #pinwrap{position:fixed;inset:0;background:rgba(11,23,45,.32);z-index:80;display:none;align-items:center;justify-content:center;padding:24px}
  #pinwrap.on{display:flex}
  #pin{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);max-width:860px;width:100%;max-height:82vh;overflow:auto;padding:18px 22px}

<!--<EDIT>--><!-- ==============================================================================================
  NR CANVAS SHELL  ·  canonical, shared, instrument-agnostic
  Source of truth: diagnostic-skill-builder/templates/canvas-shell.html
  Synced into a leaf skill's assets/ by scripts/sync-brand.sh; drift is gated by check-brand.sh.
  DO NOT EDIT A SYNCED COPY - edit the canonical file and re-sync.

  WHAT THIS IS. The working surface for any instrument whose deliverable is wider than a slide:
  a swimlane process map, a service blueprint, later an org chart or an opportunity heatmap. It is
  a map you move around in, like the OpEx Constellation: drag to pan, pinch or Ctrl/Cmd + scroll
  to zoom, and the rail and the column heads stay put.

  WHAT YOU SEE CHANGES WITH THE ZOOM, NOT JUST THE SIZE. A map of a hundred activities shrunk to
  fit the screen is unreadable, so each zoom level shows one level of the taxonomy:
      zoomed out   one tile per cell: the effort, the count, the pain points   (levels[0])
      in between   one box per group (an activity block)                       (levels[1])
      close up     every card                                                   (levels[2])
  The grid is always laid out for the cards, and the two outer levels are drawn over it, so the
  thing under the pointer stays under the pointer when the level changes.

  It also owns the SLIDE PICKER. The one-page deliverable is not "the canvas, shrunk"; it is the
  part of the canvas that carries the argument, chosen deliberately. The picker is where that
  choice is made and where its consequences are shown.

  WHAT IT IS NOT. It holds no instrument logic: no baseline, no gate, no delta. An instrument
  supplies a MODEL and a set of HOOKS, and gets back a rendered canvas.

  ── THE MODEL ────────────────────────────────────────────────────────────────────────────────
  {
    columns: [ {id, tag, label, sub, kind:'normal'|'off'} ],
    rows:    [ {id, label, sub, icon, accent, kind:'cards'|'track',
                divider:'line of visibility'|null, count, fixed} ],   // fixed: no move arrows
    cells:   { "rowId|colId": {cards:[cardId], track:{tone,label}, note} },   // note: shown in an empty cell
    cards:   { cardId: {title, meta, accent, flags:[], tags:[{text,kind}],
                        group, owner, weight, alerts} },
    groups:  { groupId: {title} },              // optional: the middle zoom level
    outerLinks: 'hover',                        // optional: zoomed out, draw a box's links only on hover
    links:   [ {from, to, sometimes, note, alerts} ],   // optional: card -> card. Across owners =
                                                // a hand-off; alerts = pain points sitting on it (red)
    levels:  [ 'Key processes', 'Activity blocks', 'Activities' ],   // what each zoom level shows
    run:     { title, sub },                    // optional: the label on the run button
    words:   { item:['activity','activities'], alert:['pain point','pain points'], unit:'FTE' },
    filters: [ {k, label, flag} ],              // flag null = everything
    slide:   { rows:[rowId], cols:[colId] },
    cornerTitle, cornerSub, addRowLabel
  }
  Tones: 'positive' | 'neutral' | 'negative'. Tag kinds: 'ch' | 'sys' | 'pain' | 'warn' | ''.
  A card's `weight` (an FTE, say) is summed on the outer levels; `alerts` (its pain points) are
  counted. `owner` is who does it: a link between two owners is drawn as a hand-off.

  ── THE HOOKS (all optional) ──────────────────────────────────────────────────────────────────
  {
    onCard(cardId),  onColumn(colId),  onRow(rowId),   // a click, when editing is unlocked
    onAdd(rowId, colId),                                // the + affordance in a cell
    canAdd(rowId, colId) -> bool,
    onMoveRow(rowId, step),                             // the up / down arrows on a lane
    onAddRow(),                                         // the + under the last lane
    onLink(fromCardId, toCardId),                       // a link drawn from a card's handle
    onLinkClick(link),                                  // a link clicked, when editing
    runInfo(cardId) -> {pains:[string]},                // what the run reads out at this card
    detail(cardId) -> {kind, title, id, rows:[{k,v}], notes:[{body,strong,meta,tone}]},
    onSlideChange(slide),
    suggestSlide() -> {rows:[], cols:[]},
    slideWarnings(slide) -> [string]
  }
  NRCanvas.mount({model, hooks, host, editing}) renders; NRCanvas.redraw() re-renders in place.
  The view (pan and zoom) survives a redraw and a re-mount: an edit never throws you back out.

  ── MOTION AND THE RUN ────────────────────────────────────────────────────────────────────────
  The canvas wears the Constellation's look. Motion (the work flowing along the links, the camera
  gliding, the first view assembling) is a switch in the bar, remembered per viewer in
  localStorage `nr_motion`, and off by default when the system asks for reduced motion. Nothing
  on the map needs motion to be read. The look (dark, the default, or light) is a second switch,
  remembered in localStorage `nr_theme`; the light look re-points the same tokens. "Run your end-to-end process" walks the links from the
  first activity to the last; it appears only when the model carries links.
============================================================================================== -->
<style>
  /* ── the frame ───────────────────────────────────────────────────────────────────────────── */
  .nc-wrap{display:flex;flex-direction:column;min-height:0;flex:1}
  .nc-bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:0 0 10px 0}
  .nc-chip{font-size:var(--fs-11);font-weight:600;border:1px solid var(--line);background:var(--card);
           color:var(--txt);padding:5px 11px;border-radius:999px;cursor:pointer;transition:.13s;
           white-space:nowrap}
  .nc-chip:hover{border-color:var(--accent);color:var(--accent)}
  .nc-chip.on{background:var(--navy-fill);border-color:var(--navy-fill);color:#fff}
  .nc-chip .n{opacity:.65;margin-left:5px;font-weight:700}
  .nc-sp{flex:1}
  .nc-links{font-size:var(--fs-11);color:var(--mut);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

  .nc-scroll{position:relative;overflow:hidden;flex:1;min-height:320px;border-top:1px solid var(--line);
             cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--soft)}
  .nc-scroll.grabbing{cursor:grabbing}
  .nc-clip{position:absolute;left:210px;top:66px;right:0;bottom:0;overflow:hidden}
  .nc-world{position:absolute;left:0;top:0;transform-origin:0 0;--inv:1;width:max-content}
  /* paint order inside the world: cell backgrounds, then the outer-level boxes (z 1), then the
     links (z 2), then the cards (z 3). A line runs over an empty cell and never over a word. */
  .nc-grid{display:grid;position:relative;grid-auto-rows:min-content;align-content:start;
           background:var(--card);width:max-content}

  /* the rail and the column heads are drawn OUTSIDE the zoomed world, at their own size, and
     follow it: a label you cannot read at the zoom you need is not a label */
  .nc-railov,.nc-headov,.nc-corner{position:absolute;background:var(--card);z-index:3}
  .nc-railov{left:0;top:66px;bottom:0;width:210px;border-right:1px solid var(--line);overflow:hidden}
  .nc-headov{left:210px;top:0;right:0;height:66px;border-bottom:1px solid var(--line);overflow:hidden}
  .nc-corner{left:0;top:0;width:210px;height:66px;box-sizing:border-box;border-right:1px solid var(--line);
             border-bottom:1px solid var(--line);padding:11px 13px;z-index:4}
  .nc-corner b{display:block;font-size:var(--fs-11);font-weight:800;color:var(--ink);letter-spacing:.2px}
  .nc-corner span{font-size:var(--fs-95);color:var(--mut)}

  .nc-colh{position:absolute;top:0;height:66px;box-sizing:border-box;border-right:1px solid var(--line);
           padding:11px 13px;overflow:hidden;cursor:default}
  .nc-colh .t{font-size:var(--fs-95);font-weight:800;color:var(--accent);letter-spacing:.6px;white-space:nowrap}
  .nc-colh b{display:block;font-size:13px;font-weight:700;color:var(--ink);line-height:1.25;margin:1px 0 3px;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nc-colh em{display:block;font-style:normal;font-size:var(--fs-95);color:var(--mut);line-height:1.35;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nc-colh.off{background:rgba(180,150,70,.07)}
  .nc-colh.off b{color:#8A7B58}
  .nc-colh.narrow .t,.nc-colh.narrow em{display:none}
  .nc-colh.narrow{padding:12px 8px 0}
  .nc-colh.narrow b{white-space:normal;font-size:var(--fs-11);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
  .nc-colh.dim,.nc-rail.dim,.nc-cell.dim,.nc-track.dim{opacity:.38}

  .nc-rail{position:absolute;left:0;width:210px;box-sizing:border-box;border-bottom:1px solid var(--line);
           padding:10px 12px;display:flex;gap:8px;align-items:flex-start;cursor:pointer;overflow:hidden}
  .nc-rail:hover{background:var(--soft)}
  .nc-rail .ic{flex:none;width:15px;height:15px;margin-top:1px;color:var(--accent)}
  .nc-rail .ic svg{width:15px;height:15px;display:block}
  .nc-rail .nm{min-width:0;flex:1}
  .nc-rail b{display:block;font-size:var(--fs-115);font-weight:700;color:var(--ink);line-height:1.25}
  .nc-rail em{display:block;font-style:normal;font-size:var(--fs-95);color:var(--mut);margin-top:2px;line-height:1.35}
  .nc-rail.thin{padding-top:3px;padding-bottom:0;align-items:center}
  .nc-rail.thin em,.nc-rail.thin .ic{display:none}
  .nc-rail.thin b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nc-rail .cnt{font-size:var(--fs-95);font-weight:700;color:var(--mut);background:var(--slate-10);
                border-radius:999px;padding:2px 7px;flex:none}
  .nc-rail .chev{color:var(--mut);flex:none;transition:transform .16s}
  .nc-rail.closed .chev{transform:rotate(-90deg)}
  .nc-rail.acc{box-shadow:inset 3px 0 0 var(--rc)}
  .nc-mv{display:none;flex-direction:column;gap:2px;flex:none}
  .nc-editing .nc-mv{display:flex}
  .nc-mv button{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:5px;
                width:20px;height:17px;padding:0;font-size:var(--fs-10);line-height:1;cursor:pointer}
  .nc-mv button:hover{border-color:var(--accent);color:var(--accent)}
  .nc-addrow{position:absolute;left:12px;font-size:var(--fs-11);font-weight:700;color:var(--accent);
             border:1px dashed var(--accent);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer}
  .nc-addrow:hover{background:var(--accent-10)}

           text-transform:uppercase;color:var(--navy);font-weight:800;border:1px solid var(--line);
           border-left:0;border-radius:0 6px 6px 0;z-index:2;white-space:nowrap}
  #art[data-t="dark"] .nc-divl,#pm[data-t="dark"] .nc-divl{color:var(--accent)}

  /* ── the cells ────────────────────────────────────────────────────────────────────────────── */
  /* a cell is a row of STACKS, one per group (an activity block), each a column of cards. A long
     stack wraps into a second column rather than running down the page: the map stays about as
     wide as it is tall, which is what lets the whole value chain fit on one screen */
  .nc-cell{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:9px 14px 12px 15px;
           min-height:46px;position:relative;box-sizing:border-box;display:flex;gap:18px;align-items:flex-start}
  .nc-stack{display:flex;flex-direction:column;gap:7px;flex:none}
  .nc-subs{display:flex;gap:12px;align-items:flex-start}
  .nc-sub{display:flex;flex-direction:column;gap:7px}
  .nc-sl{font-size:var(--fs-9);font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);
         line-height:1.3;max-width:232px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:-2px}
  .nc-cell.off{background:rgba(180,150,70,.04)}
  .nc-cell.empty{background:var(--soft)}
  .nc-closed{font-size:var(--fs-105);color:var(--mut)}
  /* a cell with no cards can still say something: an outside party involved in this step */
  .nc-ghost{border:1px dashed rgba(147,164,196,.35);border-radius:8px;padding:8px 10px;font-size:var(--fs-105);
            line-height:1.4;color:var(--mut);width:232px;box-sizing:border-box}
  .nc-div{grid-column:1/-1;height:0;position:relative;z-index:1}
  .nc-div i{position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--navy-fill)}

  /* ── cards ────────────────────────────────────────────────────────────────────────────────── */
  .nc-card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;
           box-shadow:0 1px 2px rgba(20,30,50,.04);transition:border-color .13s,box-shadow .13s,opacity .13s;
           position:relative;z-index:3;cursor:pointer}
  .nc-card{width:232px;box-sizing:border-box}
  .nc-card b{display:block;font-size:var(--fs-115);font-weight:600;color:var(--ink);line-height:1.35}
  .nc-card .who{display:block;font-size:var(--fs-95);color:var(--mut);margin-top:3px}
  .nc-card .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .nc-card:hover{border-color:var(--accent);box-shadow:0 6px 16px -8px rgba(11,35,71,.35)}
  .nc-card.nomatch{opacity:.2}
  .nc-tag{font-size:var(--fs-9);font-weight:700;padding:2px 6px;border-radius:5px;background:var(--slate-10);
          color:var(--txt)}
  .nc-tag.ch{background:rgba(110,177,209,.16);color:#1F5C7A}
  .nc-tag.sys{background:var(--navy-10);color:var(--navy)}
  .nc-tag.pain{background:var(--tint-red);color:var(--rag-red-text)}
  .nc-tag.warn{background:var(--tint-amber);color:var(--rag-amber-text)}
  #art[data-t="dark"] .nc-tag.ch,#pm[data-t="dark"] .nc-tag.ch{background:rgba(143,199,232,.16);color:#8FC7E8}
  #art[data-t="dark"] .nc-tag.sys,#pm[data-t="dark"] .nc-tag.sys{background:#243246;color:#EAEFF5}
  /* the handle a link is drawn from: only there while editing, only on the card under the pointer */
  .nc-hd{position:absolute;right:-7px;top:50%;width:13px;height:13px;margin-top:-7px;border-radius:50%;
         background:var(--card);border:2px solid var(--accent);display:none;cursor:crosshair;z-index:3}
  .nc-editing.nc-canlink .nc-card:hover .nc-hd{display:block}
  .nc-card.droptarget{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-10)}

  /* ── a track row: a line through the columns, not a chart ────────────────────────────────── */
  .nc-track{border-bottom:1px solid var(--line);border-right:1px solid var(--line);position:relative;
            height:96px}
  .nc-track svg{position:absolute;left:0;right:0;top:0;height:56px;width:100%;pointer-events:none;
                overflow:visible}
  /* the dot is drawn in PIXELS, never inside the stretched svg, or a circle becomes an ellipse */
  .nc-dot{position:absolute;left:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
          box-shadow:0 0 0 3px var(--card);z-index:2}
  .nc-tlab{position:absolute;left:11px;right:11px;bottom:10px;font-size:var(--fs-10);line-height:1.35;
           color:var(--txt)}
  .nc-tlab b{display:block;font-size:var(--fs-105);color:var(--ink);font-weight:600}

  .nc-plus{position:absolute;top:5px;right:5px;width:19px;height:19px;line-height:1;padding:0;
           border:1px dashed var(--line);background:var(--card);color:var(--mut);border-radius:6px;
           font-size:13px;font-weight:700;cursor:pointer;opacity:0;transition:.14s;z-index:4}
  .nc-cell:hover .nc-plus{opacity:1}
  .nc-plus:hover{border-style:solid;border-color:var(--accent);color:var(--accent);
                 background:rgba(110,177,209,.12);transform:scale(1.1)}

  /* ── the outer zoom levels, drawn over the grid. Text is counter-scaled by --inv, so it reads
        at the same size whatever the zoom ────────────────────────────────────────────────── */
  .nc-ov{position:absolute;left:0;top:0;pointer-events:none;display:none;z-index:1}
  .nc-lv1 .nc-ov1,.nc-lv2 .nc-ov2{display:block}
  .nc-lv1 .nc-grid .nc-card,.nc-lv2 .nc-grid .nc-card,.nc-lv1 .nc-sl,.nc-lv2 .nc-sl{visibility:hidden}
  .nc-lv1 .nc-plus,.nc-lv2 .nc-plus{display:none}
  .nc-tile,.nc-grp{position:absolute;box-sizing:border-box;pointer-events:auto;cursor:zoom-in;overflow:hidden}
  .nc-tile{border-radius:calc(10px*var(--inv));border:1px solid var(--line);display:flex;flex-direction:column;
           align-items:center;justify-content:center;text-align:center;gap:calc(3px*var(--inv));
           padding:calc(6px*var(--inv))}
  .nc-tile .w{font-size:calc(20px*var(--inv));font-weight:800;color:var(--ink);line-height:1.1}
  .nc-tile .c{font-size:calc(11px*var(--inv));color:var(--txt)}
  .nc-grp{border-radius:calc(8px*var(--inv));border:1px solid rgba(110,177,209,.55);
          background:var(--accent-10);padding:calc(7px*var(--inv)) calc(10px*var(--inv))}
  .nc-grp b{display:block;font-size:calc(12px*var(--inv));font-weight:700;color:var(--ink);line-height:1.25}
  .nc-grp span:not(.nc-pill){display:block;font-size:calc(10.5px*var(--inv));color:var(--txt);margin-top:calc(2px*var(--inv))}
  .nc-pill{display:inline-block;font-size:calc(10px*var(--inv));font-weight:700;color:var(--rag-red-text);
           background:var(--tint-red);border-radius:999px;padding:calc(1px*var(--inv)) calc(7px*var(--inv));
           margin-top:calc(4px*var(--inv))}
  .nc-tile:hover,.nc-grp:hover{border-color:var(--accent)}
  /* a box too small on screen to carry its text says less, never less legibly */
  .nc-tile.sm .nc-pill,.nc-tile.xs .c,.nc-tile.xs .nc-pill{display:none}
  .nc-tile.xs .w{font-size:calc(11px*var(--inv))}
  .nc-grp.sm span,.nc-grp.sm .nc-pill{display:none}
  .nc-grp.xs>*{display:none}

  /* ── the links ────────────────────────────────────────────────────────────────────────────── */
  .nc-lk{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:2}
  .nc-lk g{display:none}
  .nc-lv1 .nc-lk .g1,.nc-lv2 .nc-lk .g2,.nc-lv3 .nc-lk .g3{display:inline}
  .nc-lk path.l{fill:none;stroke:var(--steel);stroke-width:calc(1.4px*var(--inv));opacity:.75}
  .nc-lk path.l.ho{stroke:var(--rag-amber);stroke-width:calc(2px*var(--inv));opacity:.95}
  .nc-lk path.l.some{stroke-dasharray:calc(5px*var(--inv)) calc(4px*var(--inv))}
  .nc-lk path.hit{fill:none;stroke:transparent;stroke-width:calc(10px*var(--inv));pointer-events:stroke;cursor:pointer}
  .nc-focus .nc-lk path.l{opacity:.12}
  /* on a busy map the outer levels draw a box's links only while you point at it */
  .nc-hoverlinks.nc-lv1 .nc-lk path.l,.nc-hoverlinks.nc-lv2 .nc-lk path.l{opacity:0}
  .nc-hoverlinks.nc-lv1 .nc-lk path.l.hot,.nc-hoverlinks.nc-lv2 .nc-lk path.l.hot{opacity:1}
  .nc-focus .nc-lk path.l.hot{opacity:1}
  .nc-lk .tmp{fill:none;stroke:var(--accent);stroke-width:calc(2px*var(--inv));stroke-dasharray:calc(4px*var(--inv)) calc(3px*var(--inv))}
  .nc-links .k{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--lk,var(--steel));vertical-align:middle;opacity:.8}
  .nc-links .k.s{border-top:1.5px solid var(--lk,var(--steel));opacity:.65}
  .nc-links .k.d{border-top:1.5px dashed var(--lk,var(--steel));opacity:.65}

  /* ── the slide picker ─────────────────────────────────────────────────────────────────────── */
  .nc-pk{position:absolute;top:6px;right:6px;width:17px;height:17px;border-radius:5px;
         border:1.5px solid var(--line);background:var(--card);cursor:pointer;display:none;
         align-items:center;justify-content:center;z-index:5}
  .nc-picking .nc-pk{display:flex}
  .nc-pk.on{background:var(--green);border-color:var(--green)}
  .nc-pk svg{width:11px;height:11px;color:#fff;opacity:0}
  .nc-pk.on svg{opacity:1}
  .nc-rail .nc-pk{top:8px;right:8px}
  .nc-picking .nc-rail .cnt,.nc-picking .nc-rail .chev,.nc-picking .nc-mv{display:none}

  #ncbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
         box-shadow:0 -14px 34px -22px rgba(11,35,71,.5);padding:11px 22px 11px 66px;z-index:20;
         display:none;align-items:center;gap:12px;flex-wrap:wrap}
  .nc-picking #ncbar{display:flex}
  #ncbar .txt{font-size:var(--fs-115);color:var(--txt);line-height:1.5;flex:1;min-width:220px}
  #ncbar .txt b{color:var(--ink)}
  #ncbar .warn{display:block;color:var(--rag-red-text);font-weight:600}
  .nc-btn{font-size:12px;font-weight:700;border:1px solid var(--navy-fill);background:var(--navy-fill);
          color:#fff;padding:8px 15px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .nc-btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .nc-btn.ghost:hover{border-color:var(--accent);color:var(--accent)}

  /* ── the detail panel ─────────────────────────────────────────────────────────────────────── */
  #ncdp{position:fixed;top:0;right:0;bottom:0;width:390px;max-width:92vw;background:var(--card);
        border-left:1px solid var(--line);box-shadow:-18px 0 44px -24px rgba(11,35,71,.4);z-index:40;
        display:none;flex-direction:column;transform:translateX(14px);opacity:0;transition:.18s}
  #ncdp.on{display:flex;transform:none;opacity:1}
  #ncdp .h{padding:15px 20px 13px;border-bottom:1px solid var(--line);background:var(--soft);position:relative}
  #ncdp .k{font-size:var(--fs-85);font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff;
           background:var(--navy-fill);padding:3px 7px;border-radius:5px;display:inline-block}
  #ncdp h3{margin:7px 0 0;font-size:15px;font-weight:800;color:var(--ink);line-height:1.3;padding-right:34px}
  #ncdp .id{font-family:ui-monospace,monospace;font-size:var(--fs-95);color:var(--mut);margin-top:5px;display:block}
  #ncdp .x{position:absolute;top:12px;right:14px;border:none;background:none;font-size:22px;line-height:1;
           color:var(--mut);cursor:pointer}
  #ncdp .b{flex:1;overflow:auto;padding:16px 20px 22px}
  #ncdp .r{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
           border-bottom:1px solid var(--line);font-size:var(--fs-115);color:var(--mut)}
  #ncdp .r b{color:var(--ink);font-weight:600;text-align:right}
  #ncdp h4{margin:16px 0 7px;font-size:var(--fs-95);font-weight:800;letter-spacing:.6px;text-transform:uppercase;
           color:var(--mut)}
  #ncdp .note{border-left:3px solid var(--rag-na);background:var(--soft);border-radius:0 7px 7px 0;
              padding:8px 11px;font-size:var(--fs-115);color:var(--ink);line-height:1.45;margin-bottom:7px}
  #ncdp .note.negative{border-left-color:var(--rag-red);background:rgba(214,69,65,.06)}
  #ncdp .note b{display:block;font-size:12px;margin-top:3px}
  #ncdp .note .m{font-size:var(--fs-10);color:var(--mut);margin-top:3px}
  #ncov{position:fixed;inset:0;background:rgba(11,35,71,.18);z-index:35;display:none}
  #ncov.on{display:block}

  #ncprev{position:fixed;inset:0;background:rgba(11,35,71,.55);z-index:60;display:none;
          align-items:center;justify-content:center;padding:34px}
  #ncprev.on{display:flex}
  #ncprev .box{background:var(--card);border-radius:14px;padding:20px 22px;width:min(1180px,94vw);
               max-height:92vh;overflow:auto;box-shadow:0 40px 90px -40px rgba(0,0,0,.6)}
  #ncprev h2{margin:0 0 3px;font-size:15px;color:var(--ink)}
  #ncprev .sub{font-size:var(--fs-115);color:var(--mut);margin-bottom:14px}
  .nc-mini{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;
           overflow:hidden}
  .nc-mini>*{background:var(--card);padding:6px 8px;font-size:var(--fs-95);color:var(--txt);line-height:1.3}
  .nc-mini .mh{background:var(--navy2);color:#fff;font-weight:700;font-size:var(--fs-10)}
  .nc-mini .mh.off{background:#8A7B58}
  .nc-mini .mr{background:var(--slate-10);font-weight:700;color:var(--navy);font-size:var(--fs-95)}
  #art[data-t="dark"] .nc-mini .mr,#pm[data-t="dark"] .nc-mini .mr{color:#EAEFF5}
  .nc-mini .mc b{display:block;font-weight:600;color:var(--ink);font-size:var(--fs-95)}
  .nc-mini .mc.none{background:var(--soft)}

  /* ══ THE TWIN LOOK ═══════════════════════════════════════════════════════════════════════════
     The canvas wears the Constellation's look whatever the page theme: a deep navy ground, glass
     surfaces, light that means something (blue = the flow, amber = a hand-off, red = a pain point).
     Done by re-pointing the brand tokens INSIDE the canvas, so every component above keeps its
     rules and only its colours change. Motion is a separate switch (.nc-motion), never required
     to read the map. */
  .nc-scroll,.nc-twin{
    --card:#0E182B; --bg:#060B16; --ink:#E8EEF9; --txt:#B3C1DA; --mut:#7586A8; --line:#1B2A47;
    --soft:rgba(147,164,196,.035); --accent:#6F9FFF; --accent-10:rgba(78,134,247,.13);
    --slate-10:rgba(147,164,196,.13); --navy-10:rgba(78,134,247,.18); --navy:#A9C4FF; --navy2:#16315B;
    --navy-fill:#4E86F7; --steel:#5F7EB8; --green:#4FC08D; --rag-green:#4FC08D; --rag-red:#F0736A;
    --rag-red-text:#FF9188; --tint-red:rgba(240,115,106,.17); --rag-amber:#E5A03C;
    --rag-amber-text:#F2B866; --tint-amber:rgba(229,160,60,.17); --rag-na:#57678A;
    --live:#4E86F7; --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
    --lk:#8C9AB3; --lk-bead:rgba(214,224,242,.42); --lk-hot:#7FA8FF;
    color:var(--ink); border:1px solid #14223B; border-radius:14px;
    background:
      radial-gradient(900px 620px at 22% 62%, rgba(46,86,168,.16), transparent 68%),
      radial-gradient(760px 520px at 79% 55%, rgba(32,120,102,.12), transparent 70%),
      radial-gradient(1100px 700px at 50% 12%, rgba(38,66,140,.22), transparent 72%),
      #060B16;
  }
  /* the dot grid is the floor of the twin: it moves and scales with the map (see place()) */
  .nc-clip{background-image:radial-gradient(rgba(143,168,206,.16) 1px, transparent 1.4px);
           background-size:26px 26px}
  .nc-grid{background:transparent}
  .nc-cell,.nc-track{border-color:rgba(27,42,71,.75)}
  .nc-cell.empty,.nc-cell.off{background:rgba(147,164,196,.025)}
  .nc-railov,.nc-headov,.nc-corner{background:rgba(7,13,25,.84);backdrop-filter:blur(8px);
           -webkit-backdrop-filter:blur(8px);border-color:#14223B!important}
  .nc-corner{border-radius:14px 0 0 0}
  .nc-corner b{font-family:var(--mono);font-size:var(--fs-95);letter-spacing:.16em;text-transform:uppercase;
           color:var(--ink-2,#93A4C4);font-weight:500}
  .nc-colh .t{font-family:var(--mono);font-weight:500;letter-spacing:.16em;color:var(--live)}
  .nc-colh b{color:var(--ink)}
  .nc-rail{border-color:#14223B}
  .nc-rail:hover{background:rgba(78,134,247,.07)}
  .nc-rail.acc{box-shadow:inset 3px 0 0 var(--rc), inset 14px 0 18px -16px var(--rc)}
  .nc-sl{font-family:var(--mono);font-weight:500;letter-spacing:.14em;color:#6F80A3}
  .nc-divl{font-family:var(--mono);font-weight:500;letter-spacing:.16em;color:var(--navy)!important;
           background:rgba(7,13,25,.9);border-color:#1E3157}
  .nc-div i{background:var(--live);box-shadow:0 0 10px rgba(78,134,247,.7)}
  .nc-card{background:rgba(14,24,43,.94);border-color:#1C2C4B;
           box-shadow:-7px 0 16px -12px var(--lc,transparent), 0 8px 22px -18px rgba(0,0,0,.9)}
  .nc-card:hover{border-color:rgba(111,159,255,.6);
           box-shadow:-7px 0 16px -12px var(--lc,transparent), 0 0 22px -6px rgba(78,134,247,.55)}
  .nc-card .tags .nc-tag.pain{box-shadow:0 0 10px -3px rgba(240,115,106,.7)}
  .nc-tag.sys{background:rgba(78,134,247,.16);color:#AFC6F6}
  .nc-tag.ch{background:rgba(63,196,180,.15);color:#7FE0D3}
  .nc-tile{border-color:rgba(78,134,247,.28);box-shadow:inset 0 0 26px -14px rgba(111,159,255,.7)}
  .nc-tile .w{text-shadow:0 0 14px rgba(111,159,255,.55)}
  .nc-grp{border-color:rgba(111,159,255,.42);background:rgba(78,134,247,.09);
          box-shadow:0 0 22px -12px rgba(78,134,247,.8)}
  /* the connections are a quiet grey at rest: the cards carry the story, the lines only join it.
     The one you point at (and the run) takes its meaning back: blue the flow, amber a hand-off
     between teams, red a hand-off with a pain point on it. */
  .nc-lk path.l{stroke:var(--lk);opacity:.34}
  .nc-lk path.l.ho{stroke:var(--lk);opacity:.5;stroke-width:calc(1.7px*var(--inv))}
  .nc-lk path.l.hot,.nc-running .nc-lk path.l.run{stroke:var(--lk-hot)}
  .nc-lk path.l.ho.hot,.nc-running .nc-lk path.l.ho.run{stroke:var(--rag-amber)}
  .nc-lk path.l.pn.hot,.nc-running .nc-lk path.l.pn.run{stroke:var(--rag-red)}
  .nc-chip.nc-mo{display:inline-flex;align-items:center;gap:6px}
  .nc-mo i{width:22px;height:12px;border-radius:999px;background:var(--line);position:relative;transition:.18s}
  .nc-mo i:after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;border-radius:50%;
                 background:#fff;transition:.18s}
  .nc-mo.on{background:var(--card);color:var(--ink);border-color:var(--accent)}
  .nc-mo.on i{background:#4E86F7;box-shadow:0 0 8px rgba(78,134,247,.8)}
  .nc-mo.on i:after{left:12px}

  /* the zoom control and the level line sit inside the map, where the Constellation keeps them */
  .nc-zoomctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:1px;
    border:1px solid var(--line);border-radius:8px;overflow:hidden;background:rgba(12,21,38,.86);
    backdrop-filter:blur(6px);z-index:6}
  .nc-zoomctl button{width:34px;height:32px;display:grid;place-items:center;font-size:15px;color:#93A4C4;
    border:0;background:none;cursor:pointer;transition:.14s}
  .nc-zoomctl button:hover{background:rgba(78,134,247,.16);color:var(--ink)}
  .nc-zoomctl button+button{border-top:1px solid #152239}
  .nc-zoomctl .fit{font-size:var(--fs-10);font-family:var(--mono);letter-spacing:.04em}
  .nc-hint{position:absolute;left:222px;bottom:10px;font-family:var(--mono);font-size:var(--fs-105);letter-spacing:.06em;
    color:#7586A8;pointer-events:none;z-index:6;text-transform:uppercase;background:rgba(7,13,25,.82);
    padding:4px 8px;border-radius:6px;backdrop-filter:blur(6px)}
  .nc-hint b{color:#AFC6F6;font-weight:500}

  /* the outer levels cross-fade instead of popping */
  .nc-ov{display:block!important;opacity:0}
  .nc-lv1 .nc-ov1,.nc-lv2 .nc-ov2{opacity:1}
  .nc-tile,.nc-grp{pointer-events:none}
  .nc-lv1 .nc-ov1 .nc-tile,.nc-lv2 .nc-ov2 .nc-grp{pointer-events:auto}
  .nc-lk g{display:inline!important;opacity:0;pointer-events:none}
  .nc-lv1 .nc-lk .g1,.nc-lv2 .nc-lk .g2,.nc-lv3 .nc-lk .g3{opacity:1;pointer-events:auto}
  .nc-lv1 .nc-grid .nc-card,.nc-lv2 .nc-grid .nc-card,.nc-lv1 .nc-sl,.nc-lv2 .nc-sl{visibility:visible!important;opacity:0;pointer-events:none}


  /* ══ THE TWIN FRAME ══════════════════════════════════════════════════════════════════════════
     frame:'twin' — the canvas as its own full-screen deliverable, laid out like the Constellation:
     a top bar (what this is, which arrangement, the switches, the instrument's own controls), a

        esc(f.flag||'')+'">'+esc(f.label)+'<span class="n">'+counts(f.flag||null)+'</span></button>';
    }).join('');
  }
  function bar(){ return filtersHtml()+'<span class="nc-sp"></span>'+legendHtml(); }

  function jumpHtml(){

  function paintBar(){
    if(!TWIN){ HOST.querySelector('.nc-bar').innerHTML=bar(); return; }
