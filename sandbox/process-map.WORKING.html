<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Process Map</title>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}
  #pm{--navy:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;
      --slate-10:rgba(54,65,86,.09);--rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;--rag-green-text:#2F8F6B;--rag-amber-text:#B97F22;--rag-red-text:#C2483D;--rag-na-text:#6B7480;--tint-green:rgba(47,143,107,.12);--tint-amber:rgba(212,154,58,.16);--tint-red:rgba(210,100,90,.13);--tint-na:rgba(154,164,176,.16);--navy-fill:#0B2347;
      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;--soft:#F5F7FB;
      --nat-automate:#2E5C8A;--nat-accelerate:#1C7A4A;--nat-enhance:#6EB1D1;--nat-redesign:#D49A3A;--nat-keep:#7991AD;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #pm[data-t="dark"]{--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--soft:#141E2A;--navy-fill:#243246;--navy2:#31517F;--accent:#8FC7E8;--steel:#93A9C4;--rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;--rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;--tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);--nat-automate:#4A7FB8;--nat-keep:#93A9BC;--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}
  body:has(#pm[data-t="dark"]){--page:#0E1620}
  #pm[data-t="dark"] .prow .pbadge,#pm[data-t="dark"] #pin .ptp,#pm[data-t="dark"] #pin .tchip.pn,#pm[data-t="dark"] #pin .plegend .lp,#pm[data-t="dark"] .pchpill{color:#16202C}
  /*<EDIT>*/#pm[data-t="dark"] #wgear.blocked,#pm[data-t="dark"] #ed .edkind.pain{color:#16202C}/*</EDIT>*/
  #pm[data-t="dark"] #pin .tcb{background:rgba(0,0,0,.22)}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:70}
  /* stacking ladder (chevrons use inline z-index 1..N, so everything else must clear them):
     content 1-10 · sticky grid headers 2-4 · toprow+gear 70 · pin modal 80 · tooltip 85 · editor panel 90 */
  .tags{display:flex;align-items:center;gap:11px;min-width:0}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)}
  .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:11.5px;letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #pm[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  .ctrls{display:flex;gap:9px;flex:none}
  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0;max-width:1300px}
  #pm[data-t="dark"] h1{color:#EAEFF5}
  h1 .hl{color:var(--green)}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 14px}
  .subt{font-size:13.5px;font-weight:600;color:var(--accent)}
  .kpis{display:flex;gap:10px;flex-wrap:wrap}
  .kpi{background:var(--soft);border-radius:12px;padding:7px 14px;min-width:96px}
  .kpi .l{font-size:10.5px;color:var(--mut);font-weight:600}
  .kpi .n{font-size:20px;font-weight:800;color:var(--navy);line-height:1.05}
  #pm[data-t="dark"] .kpi .n{color:#EAEFF5}
  .kpi .n.hl{color:var(--green)} .kpi .n.warn{color:var(--rag-red)}
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:18px}
  #pm.scrollmode #view{overflow:auto}
  #pm.scrollmode #vinner{position:relative;transform:none!important;width:auto!important}
  .swim{display:grid;gap:7px;min-width:520px}
  .colh{font-size:10px;letter-spacing:.5px;font-weight:700;color:var(--mut);text-transform:uppercase;text-align:center;padding:2px 0 3px}
  .lh{background:var(--soft);border-radius:9px;display:flex;align-items:center;padding:0 12px;font-size:12.5px;font-weight:800;color:var(--ink)}
  .cw{background:var(--soft);border-radius:9px;padding:3px}
  .cell{min-height:30px;height:100%;display:flex;flex-direction:column;gap:5px}
  .act{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--rag-na);border-radius:8px;padding:8px 10px;height:100%;cursor:default}
  .act .sn{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.22}
  .act .meta{font-size:10px;color:var(--mut);margin-top:2px}
  .tagrow{display:flex;gap:4px;align-items:center;margin-top:6px;flex-wrap:wrap}
  .chip{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--soft);color:var(--txt)}
  .nat{font-size:9.5px;font-weight:700;padding:1px 8px;border-radius:5px;color:#fff}
  .pn{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:5px}
  .dgrid{display:grid;gap:5px;min-width:max-content}
  .dband{font-size:10.5px;font-weight:700;color:#fff;border-radius:7px;padding:6px 10px;display:flex;align-items:center;gap:7px}
  .dweek{font-size:9.5px;letter-spacing:.4px;font-weight:700;color:var(--mut);text-transform:uppercase;text-align:center;align-self:center}
  .dlane{background:var(--soft);border-radius:8px;display:flex;align-items:center;padding:0 11px;font-size:11.5px;font-weight:700;color:var(--ink);position:sticky;left:0;z-index:2}
  .dcell{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--rag-na);border-radius:7px;padding:7px 9px;cursor:default;overflow:hidden;display:flex;flex-direction:column;justify-content:center;position:relative;transition:border-color .14s,box-shadow .14s}
  .dcell:hover{border-color:var(--accent);box-shadow:var(--sh)}
  .dcell .dn{font-size:11px;font-weight:700;color:var(--ink);line-height:1.2;padding-right:13px}
  .dcell .dm{font-size:9px;color:var(--mut);margin-top:2px}
  .dcell .ppn{display:inline-block;margin-top:4px;font-size:8.5px;font-weight:700;padding:0 6px;border-radius:5px}
  .dmile{background:var(--navy-fill);color:#fff;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:10px;font-weight:700;text-align:center;padding:6px;writing-mode:vertical-rl;transform:rotate(180deg)}
  .swsub{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .swhint{font-size:10.5px;color:var(--mut)}
  .swg{display:grid;gap:8px;min-width:720px;align-items:stretch}
  .swcorner{position:sticky;left:0;top:0;z-index:4;background:var(--bg)}
  .swch{position:sticky;top:0;z-index:3;background:var(--navy-fill);color:#fff;font-size:11px;font-weight:700;padding:8px 12px;border-radius:8px;display:flex;flex-direction:column;gap:4px}
  .swchn{width:17px;height:17px;border-radius:50%;background:#fff;color:var(--navy);font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .swcht{flex:1;min-width:0;line-height:1.2}
  .swchc{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.72);background:rgba(255,255,255,.14);border-radius:999px;padding:1px 7px;flex:none}
  .swlane{position:sticky;left:0;z-index:2;background:var(--soft);border-radius:8px;display:flex;align-items:center;gap:7px;padding:0 12px;font-size:11.5px;font-weight:800;color:var(--ink);min-height:44px}
  .swcell{display:flex;flex-direction:column;gap:6px;padding:2px;min-height:40px}
  .swcell.swempty{background:var(--soft);border-radius:8px;opacity:.45;min-height:0}
  .swact{font-size:8px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;padding:3px 2px 0}
  .swt{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--rag-na);border-radius:8px;padding:7px 10px;cursor:default;position:relative;transition:border-color .14s,box-shadow .14s}
  .swt:hover{border-color:var(--accent);box-shadow:var(--sh)}
  .swt .swn{font-size:11px;font-weight:700;color:var(--ink);line-height:1.28;padding-right:15px}
  .swt .swm{font-size:9px;color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .swgo{position:absolute;top:6px;right:7px;color:var(--mut);opacity:.35;transition:.14s;line-height:0;pointer-events:none}
  .swt:hover .swgo,.dcell:hover .swgo{opacity:1;color:var(--accent)}
  .swt .swp{font-size:8.5px;font-weight:700;padding:0 6px;border-radius:5px;background:rgba(210,100,90,.14);color:#C2483D}
  .swchtop{display:flex;align-items:center;gap:8px}
  .swchsub{font-size:9px;font-weight:600;color:rgba(255,255,255,.74);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .swchsub b{color:#fff;font-weight:800}
  .swchsub .warn{color:#F3B8B0;font-weight:800}
  .swlane{cursor:pointer}
  .swlane:hover{background:var(--slate-10)}
  .swcaret{font-size:8px;color:var(--mut);flex:none;width:8px;transition:transform .15s}
  .swln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .swlsum{font-size:8.5px;font-weight:700;color:var(--mut);flex:none}
  .swrowsum{display:flex;align-items:center;gap:10px;padding:0 13px;font-size:10px;color:var(--mut);background:var(--soft);border-radius:8px;cursor:pointer}
  .swrowsum b{color:var(--ink);font-weight:800}
  .swrowsum .warn{color:var(--rag-red);font-weight:800}
  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:10px;font-size:clamp(9.5px,0.75vw,12px);color:var(--mut)}
  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legend{display:flex;gap:7px;flex-wrap:wrap}
  .lp{font-size:0.95em;font-weight:600;padding:0.2em 0.85em;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
  .lp i{width:9px;height:9px;border-radius:3px;display:inline-block}
  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600}
  .cov{margin-top:10px;font-size:10.5px;color:#B07A1E;background:rgba(212,154,58,.10);border:1px solid rgba(212,154,58,.28);border-radius:8px;padding:7px 12px;line-height:1.4}
  .nbwrap{margin-bottom:14px}
  .nblabel{font-size:11.5px;font-weight:600;color:var(--txt);margin-bottom:5px}
  .natbar{display:flex;height:26px;border-radius:7px;overflow:hidden;font-size:10px;font-weight:700}
  .natbar>div{display:flex;align-items:center;justify-content:center;color:#fff;min-width:0}
  .natbar>div span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
  .atile{position:relative;border-radius:8px;border:1px solid var(--line);padding:7px 9px;height:100%;min-height:46px;cursor:default}
  .atile .afte{font-size:16px;font-weight:800;color:var(--ink);line-height:1}
  .atile .afte span{font-size:9px;font-weight:600;color:var(--mut)}
  .atile .acount{font-size:9.5px;color:var(--mut);margin:2px 0 6px}
  .amix{display:flex;height:5px;border-radius:3px;overflow:hidden}
  .pdot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--rag-red)}
  .lanetot,.phasetot{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--navy)}
  #pm[data-t="dark"] .lanetot,#pm[data-t="dark"] .phasetot{color:var(--ink)}
  .phlabel{display:flex;align-items:center;font-size:9.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
  .pcard{background:var(--soft);border-radius:10px;padding:8px 11px;display:flex;flex-direction:column;justify-content:center}
  .pcn{font-size:11px;font-weight:700;color:var(--ink);line-height:1.2}
  .pcm{font-size:10px;color:var(--mut);margin-top:3px}
  .ribbon2{display:flex;gap:5px;margin-bottom:15px}
  .chev2{flex:1;min-width:0;color:var(--ink)}
  .chev2 .c2h{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .chev2 .c2n{width:17px;height:17px;border-radius:50%;background:var(--navy-fill);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .chev2 .c2t{font-size:12px;font-weight:700;line-height:1.18}
  .chev2 .c2m{font-size:10px;font-weight:600;color:var(--mut);margin-bottom:7px}
  .chev2 .c2a{display:flex;gap:3px;flex-wrap:wrap}
  .ochip{font-size:8.5px;font-weight:600;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
  .pcols{display:grid;gap:13px;align-items:start;padding-right:18px}
  .pcol{display:flex;flex-direction:column;gap:9px}
  .pcolh{display:flex;flex-direction:column;justify-content:center;gap:2px;height:54px;background:var(--navy-fill)}
  .pchev{position:relative;background:var(--bg);padding:3px}
  .pchh{display:flex;align-items:center;gap:7px;margin-bottom:4px}
  .pchn{width:18px;height:18px;border-radius:50%;background:#fff;color:var(--navy);font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .pcht{font-size:12px;font-weight:700;color:#fff;line-height:1.15;padding-right:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pchm{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.74);padding-right:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
  .pcha{display:flex;gap:3px;flex-wrap:wrap}
  .phead{display:flex;flex-direction:column;gap:4px}
  .pcap{font-size:10px;font-weight:600;color:var(--mut);padding:0 4px 0 2px;white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:6px}
  .pcolh .cc{font-size:9.5px;font-weight:700;color:var(--rag-red);white-space:nowrap}
  .prow{display:flex;align-items:flex-start;gap:5px;padding:3px 9px;border-bottom:1px solid var(--line);cursor:default}
  .prow:hover{background:var(--slate-10)}
  .prow .pi{font-size:8px;color:var(--mut);min-width:13px;padding-top:2px}
  .prow .pt{font-size:9.5px;line-height:1.25;flex:1;min-width:0;color:var(--ink)}
  .prow .owner{font-size:8px;font-weight:700;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis;flex:none}
  .prow .pbadge{font-size:8.5px;font-weight:700;color:#fff;background:var(--rag-red);border-radius:999px;min-width:14px;text-align:center;padding:0 3px;flex:none}
  .prow .fchip{font-size:8px;font-weight:700;color:var(--navy);background:var(--sky);border-radius:4px;padding:0 4px;white-space:nowrap;flex:none}
  .acard{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 16px 0 0;padding:10px 12px;height:112px;display:flex;flex-direction:column;overflow:hidden;position:relative;transition:border-color .14s,box-shadow .14s,transform .14s}
  .acn{font-size:12px;font-weight:700;color:var(--ink);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:16px}
  .acm{font-size:10px;color:var(--mut);margin:4px 0 7px}
  .aca{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden;margin-top:auto}
  .ochip2{font-size:8.5px;font-weight:600;color:var(--txt);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 7px;white-space:nowrap}
  .acard .amix{margin-top:6px}
  #pinwrap{position:fixed;inset:0;background:rgba(11,23,45,.32);z-index:80;display:none;align-items:center;justify-content:center;padding:24px}
  #pinwrap.on{display:flex}
  #pin{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);max-width:860px;width:100%;max-height:82vh;overflow:auto;padding:18px 22px}
  #pin .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  #pin .pnm{font-size:15px;font-weight:800;color:var(--ink);line-height:1.2}
  #pin .px{cursor:pointer;color:var(--mut);font-size:20px;line-height:1;border:none;background:none;padding:0 2px}
  #pin .psub{font-size:11px;color:var(--mut);margin:3px 0 8px}
  #pin .pkick{font-size:8.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--green);margin-bottom:2px}
  #pin .pt{padding:8px 0;border-top:1px solid var(--line)}
  #pin .pthead{padding:0 0 6px;border-top:none;position:sticky;top:0;background:var(--card);z-index:1;box-shadow:0 1px 0 var(--line)}
  #pin .pth{display:grid;grid-template-columns:1fr auto;align-items:center;gap:11px}
  #pin .hc{font-size:8.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
  #pin .hce{justify-self:end}
  #pin .ptn{font-size:12px;font-weight:700;color:var(--ink);line-height:1.3;min-width:0}
  #pin .ptown{font-size:9.5px;font-weight:700;color:var(--mut);white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center}
  #pin .ptnone{color:var(--line);font-weight:700}
  #pin .ptp{font-size:8.5px;font-weight:800;color:#fff;background:var(--rag-red);border-radius:999px;padding:2px 0;min-width:22px;text-align:center;justify-self:end}
  #pin .ptp0{font-size:12px;color:var(--line);justify-self:end;width:100%;text-align:center}
  #pin .pains{margin:7px 0 3px 0;padding-left:8px}
  #pin .ptcar{font-size:10px;color:var(--mut);width:16px;text-align:center;transition:color .12s}
  #pin .pth.exp{border-radius:7px;transition:background .12s}
  #pin .pth.exp:hover{background:var(--soft)}
  #pin .pth.exp:hover .ptn,#pin .pth.open .ptn{color:var(--accent)}
  #pin .pkhint{font-style:italic;color:var(--mut)}
  #pin .ptgrp{margin:15px 0 0}
  #pin .ptgh{display:flex;align-items:center;gap:7px;padding:5px 0 6px;border-bottom:1px solid var(--line)}
  #pin .ptgn{font-size:11.5px;font-weight:700;color:var(--ink)}
  #pin .ptgm{font-size:10px;color:var(--mut);font-weight:500}
  #pin .ptp.pexp{display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding:2px 9px 2px 7px;min-width:0}
  #pin .pcar{font-size:8px;line-height:1;opacity:.9}
  #pin .pth.exp:hover .ptp.pexp{background:#b9463d}
  #pin .plegend .lp.pexp{display:inline-flex;align-items:center;gap:4px;padding:1px 7px}
  #pin .tmpanel{border:1px solid var(--line);border-left:3px solid var(--rag-na);border-radius:10px;padding:11px 13px;margin-top:10px}
  #pin .tmh{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}

      return (DATA.sources||[]).filter(function(x){return !x.imported;})
        .map(function(x){return {key:x.id, label:(x.label||x.id)+(x.role&&(x.label||'').indexOf(x.role)<0?' · '+x.role:'')};});
    }
    function sourceField(id, cur){          // cur = the record's existing sourceId (may be an imported code)
      var F=friendlySrc(), o='<option value="">— not set —</option>';
      if(SRC_DEFAULT) o+='<option value="__default" selected>'+esc(SRC_DEFAULT.label)+' (last used)</option>';
      if(cur && !F.some(function(x){return x.key===cur;})){
        var c=(DATA.sources||[]).filter(function(x){return x.id===cur;})[0];
        o+='<option value="'+esc(cur)+'"'+(SRC_DEFAULT?'':' selected')+'>'+esc((c&&c.label)||cur)+' (current)</option>';
      }
      o+=opts(F, (!SRC_DEFAULT&&cur)?cur:'', null);
      o+='<option value="__new">+ new person / interview…</option>';
      return '<div class="f"><label>Source</label>'+
        '<select id="'+id+'">'+o+'</select>'+
        '<div id="'+id+'_new" class="hidden srcnew">'+
          '<input id="'+id+'_person" placeholder="Who told you? e.g. Anne Vereecken">'+
          '<input id="'+id+'_role" placeholder="Their role, e.g. CMI Lead">'+
        '</div>'+
        '<div class="hint">Say who told you. Import codes are kept on existing pains but not listed here.</div></div>';
    }
    function wireSource(id){
      var d=edp.querySelector('#'+id), n=edp.querySelector('#'+id+'_new');
      if(!d||!n) return;
      d.onchange=function(){ var isnew=d.value==='__new'; n.classList.toggle('hidden', !isnew);
        if(isnew){ var pp=edp.querySelector('#'+id+'_person'); if(pp) pp.focus(); } };
    }
    function readSource(id){                 // -> a payload the record can carry, or null. Remembers the last pick.
      var d=edp.querySelector('#'+id); if(!d) return null;
      var mem=null, out=null;
      if(d.value==='__default'){ out = SRC_DEFAULT ? srcPayload(SRC_DEFAULT) : null; mem=SRC_DEFAULT; }
      else if(d.value==='__new'){
        var person=(edp.querySelector('#'+id+'_person')||{}).value, role=(edp.querySelector('#'+id+'_role')||{}).value;
        person=(person||'').trim(); role=(role||'').trim();
        if(person){ mem={person:person, role:role, label:person+(role?' · '+role:'')}; out=srcPayload(mem); }
      }
      else if(d.value){                        // an existing friendly source, or the record's own code
        out={sourceId:d.value};
        var x=(DATA.sources||[]).filter(function(z){return z.id===d.value;})[0];
        mem={id:d.value, label:(x&&x.label)||d.value, person:x&&x.person, role:x&&x.role};
      }
      if(mem) SRC_DEFAULT=mem;                 // pre-fills the next source field this session
      return out;
    }
    function srcPayload(o){ return o.id ? {sourceId:o.id}
        : {sourceLabel:o.label, sourcePerson:o.person||null, sourceRole:o.role||null, sourceKind:'interview'}; }
    function applySrc(rec, p){ if(!p) return;
      if(p.sourceId) rec.sourceId=p.sourceId;
      else { rec.sourceLabel=p.sourceLabel; rec.sourcePerson=p.sourcePerson; rec.sourceRole=p.sourceRole; rec.sourceKind=p.sourceKind; } }

  /* ---- local view updates. A PREVIEW - the authoritative projection is redone on apply. ---- */
  function taskById(id){ return (DATA.hl.tasks||[]).filter(function(t){return t.id===id;})[0]; }

  // A task belongs to an ACTIVITY, and the activity is what sits in a phase. So "move a task to
  // another phase" really means "re-home it under an activity that lives there". There is no such
  // thing as moving a task to a bare phase - we must know which activity receives it, and only the
  // consultant can say. Hence the picker when the phase has more than one candidate.
  function actsInPhase(phaseName, laneName){
    var all=(DATA.hl.activities||[]).filter(function(a){return a.phase===phaseName;});
    var mine=all.filter(function(a){return (a.lanes||[]).indexOf(laneName)>=0;});
    return {mine:mine, all:all};
  }

  function moveTask(id, laneName, phaseName){
    var t=taskById(id); if(!t) return;
    var lane = laneName || t.lane;
    var phase = phaseName || t.stage;
    if(t.lane===lane && t.stage===phase) return;

    if(phase===t.stage){ applyMove(t, lane, null); return; }          // same phase: actor only

    var c=actsInPhase(phase, lane);
    var cand = c.mine.length ? c.mine : c.all;
    if(!cand.length){
      wmsg('"'+phase+'" has no activity yet - create one before moving work into it.');
      return;
    }
    if(cand.length===1){ applyMove(t, lane, cand[0]); return; }
    pickActivity(t, lane, phase, c);                                   // ambiguous -> ask
  }

  function applyMove(t, lane, act){
    if((DATA.hl.lanes||[]).indexOf(lane)<0) DATA.hl.lanes.push(lane);  // a brand-new lane
    var ch={};
    if(t.lane!==lane){ t.lane=lane; ch.actorName=lane; }
    if(act && act.activityId!==t.activityId){
      t.activityId=act.activityId; t.activity=act.name; t.stage=act.phase;
      ch.activityId=act.activityId;      // an EXISTING id, straight from the baseline - never minted here
    }
    if(!Object.keys(ch).length) return;
    // The FTE transfer between allocations is done by apply_delta, in Python, where the baseline is.
    pushOp({op:'update', coll:'tasks', id:t.id, changes:ch});
    reboot();
  }

  function pickActivity(t, lane, phase, c){
    var w=document.getElementById('apick'); if(!w) return;
    var h='<div class="apk-h">'+(t.__newTask?'Add a step to':'Move <b>'+esc(t.name)+'</b> to')+
          ' <b>'+esc(phase)+'</b></div>'+
          '<div class="apk-s">Which activity does it belong to? A task has no phase of its own — '+
          'it lives inside an activity, and the activity is what sits in a phase.</div>';
    function row(a,own){
      return '<button class="apk-r" data-act="'+esc(a.activityId)+'">'+
             '<span class="apk-n">'+esc(a.name)+'</span>'+
             '<span class="apk-m">'+(own?'already done by '+esc(lane):'<i>'+esc(lane)+' joins as a participant</i>')+'</span></button>';
    }
    if(c.mine.length) h+='<div class="apk-g">'+c.mine.map(function(a){return row(a,true);}).join('')+'</div>';
    var others=c.all.filter(function(a){return c.mine.indexOf(a)<0;});
    if(others.length) h+='<div class="apk-lbl">Other activities in this phase</div><div class="apk-g">'+
                         others.map(function(a){return row(a,false);}).join('')+'</div>';
    h+='<button class="apk-x" id="apk-cancel">Cancel</button>';
    w.innerHTML=h; w.classList.add('on');
    w.querySelectorAll('.apk-r').forEach(function(b){
      b.onclick=function(){
        var a=(DATA.hl.activities||[]).filter(function(x){return x.activityId===b.getAttribute('data-act');})[0];
        w.classList.remove('on');
        if(!a) return;
        if(t.__newTask) newTaskPanel(a, lane);      // the picker also homes a NEW step
        else applyMove(t, lane, a);
      };
    });
    document.getElementById('apk-cancel').onclick=function(){ w.classList.remove('on'); };
  }

  function editActivity(a,ch){
    a.name=ch.name;
    (a.tasks||[]).forEach(function(t){ t.nature=ch.nature; });
    (DATA.hl.tasks||[]).forEach(function(t){ if(t.activityId===a.activityId){ t.activity=ch.name; t.nature=ch.nature; } });
    pushOp({op:'update', coll:'activities', id:a.activityId, changes:{name:ch.name, nature:ch.nature}});
    reboot();
  }
  function reorderPhase(from,to){
    var P=DATA.hl.phases||[]; if(from===to||from<0||to<0||from>=P.length||to>=P.length) return;
    var nm=P.splice(from,1)[0]; P.splice(to,0,nm);
    // the phase list in DATA.phases carries the IDs the baseline needs
    (DATA.phases||[]).sort(function(x,y){ return P.indexOf(x.name)-P.indexOf(y.name); });
    (DATA.phases||[]).forEach(function(ph,i){
      var o=i+1;
      if(ph.order!==o){ ph.order=o; pushOp({op:'update', coll:'phases', id:ph.id, changes:{order:o}}); }
    });
    (DATA.hl.activities||[]).sort(function(x,y){ return P.indexOf(x.phase)-P.indexOf(y.phase); });
    reboot();
  }
  function reorderLane(from,to){
    var L=DATA.hl.lanes||[]; if(from===to||from<0||to<0||from>=L.length||to>=L.length) return;
    var nm=L.splice(from,1)[0]; L.splice(to,0,nm);
    (DATA.actors||[]).forEach(function(a){
      var i=L.indexOf(a.name);
      if(i>=0 && a.order!==i){ a.order=i; pushOp({op:'update', coll:'actors', id:a.id, changes:{order:i}}); }
    });
    reboot();
  }
  function retireTask(id){
    DATA.hl.tasks=(DATA.hl.tasks||[]).filter(function(t){return t.id!==id;});
    (DATA.hl.activities||[]).forEach(function(a){
      a.tasks=(a.tasks||[]).filter(function(t){return t.id!==id;});
      a.taskCount=a.tasks.length; a.pain=a.tasks.reduce(function(s,t){return s+(t.pains||[]).length;},0);
    });
    pushOp({op:'update', coll:'tasks', id:id, changes:{retired:true}});
    reboot();
  }

  function reboot(){
    A=DATA.hl.tasks||[]; ACTS=DATA.hl.activities||[]; HL=DATA.hl;
    (DATA.hl.activities||[]).forEach(function(a){
      a.lanes=[]; (a.tasks||[]).forEach(function(t){ if(t.lane&&a.lanes.indexOf(t.lane)<0) a.lanes.push(t.lane); });
    });
    render();
  }

  function enhanceSelects(root){
    (root||document).querySelectorAll('select:not([data-enh])').forEach(function(sel){
      sel.setAttribute('data-enh','1');
      var wrap=document.createElement('div'); wrap.className='cselwrap';
      sel.parentNode.insertBefore(wrap, sel); wrap.appendChild(sel);
      var trg=document.createElement('button'); trg.type='button'; trg.className='cseltrg';

      function dot(o){ var d=o.getAttribute('data-dot'); return d?'<span class="cdot '+d+'"></span>':''; }
      function tag(o){ var t=o.getAttribute('data-tag'); return t?'<span class="ctag">'+esc(t)+'</span>':''; }
      function row(o){ return '<div class="cselopt'+(o.selected?' sel':'')+'" data-i="'+o.index+'">'+
        '<span class="clab">'+dot(o)+esc(o.textContent)+'</span>'+(o.selected?CHKS:tag(o))+'</div>'; }
      function draw(){
        var o=sel.options[sel.selectedIndex];
        trg.innerHTML='<span class="clab">'+(o?dot(o)+esc(o.textContent):'')+'</span>'+CHEVS;

            Array.prototype.forEach.call(c.children,function(x){ h+=row(x); }); } });

        menu.querySelectorAll('.cselopt').forEach(function(r){ r.onclick=function(e){ e.stopPropagation();
          sel.selectedIndex=+r.getAttribute('data-i'); sel.dispatchEvent(new Event('change',{bubbles:true}));
          wrap.classList.remove('on'); draw(); }; });
      }
      trg.onclick=function(e){ e.stopPropagation();
        var isOpen=wrap.classList.contains('on');
        document.querySelectorAll('.cselwrap.on').forEach(function(w){ w.classList.remove('on'); });

            menu.classList.toggle('up', (er.bottom-tr.bottom)<200 && (tr.top-er.top)>(er.bottom-tr.bottom)); } } };

  window.addEventListener('keydown',function(e){if(e.key==='Escape')closeEd();});
/*</EDIT>*/

  function render(){var vi=document.getElementById('vinner');vi.innerHTML='';vi.appendChild(VIEWS[cur]());setLegend();requestAnimationFrame(fitView);setTimeout(fitView,60);}
  function seg(id,attr,cb){var box=document.getElementById(id);box.querySelectorAll('button').forEach(function(b){b.onclick=function(){box.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');cb(b.getAttribute(attr));};});}
  seg('views','data-v',function(v){cur=v;render();});
  seg('theme','data-s',function(t){pm.setAttribute('data-t',t);render();});
  document.getElementById('pinwrap').onclick=function(e){if(e.target===this)closePin();};
  window.addEventListener('keydown',function(e){if(e.key==='Escape')closePin();});
  window.addEventListener('resize',fitView);
  render();
/*<EDIT>*/
  (function(){
    var g=document.getElementById('wgear'), pop=document.getElementById('wpop'), b=document.getElementById('wsave');
    function setEditing(on){
      ON = !!on;
      pm.classList.toggle('editing', ON);
      if(g){
        g.classList.toggle('unlocked', ON);
        g.setAttribute('aria-pressed', ON ? 'true' : 'false');
        g.innerHTML = ON ? UNLOCK_SVG : LOCK_SVG;
        g.title = ON ? 'Editing unlocked - click to lock' : 'Locked - click to edit';
      }
      wsave();
      var _t=document.getElementById('title');
      if(_t)_t.onclick = ON ? function(){openTitle();} : null;
      render();            // attach or detach every drag/click/+ hook to match the new state
    }
    window.__setEditing = setEditing;
    if(g){
      g.onclick=function(e){ e.stopPropagation(); setEditing(!ON); };  // the gear IS the lock
    }
    if(pop){
      pop.onclick=function(e){ e.stopPropagation(); };
    }
    if(b) b.onclick=exportDelta;
    setEditing(false);     // LOCKED on load - no accidental changes
  })();
/*</EDIT>*/
})();
</script>
</body></html>
