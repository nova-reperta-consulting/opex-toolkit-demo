  /* ── THE PROCESS TWIN ──────────────────────────────────────────────────────────────────────
     The working copy IS the twin: the whole value chain on one full-screen map you zoom and pan,
     in the Constellation's look, arranged as a process map (who does it x key process) or as a
     service blueprint (what the customer sees x journey stage). The slides are the condensed
     version of the same baseline; "Preview the slides" shows them, and they are what the client
     build carries. The shell (NRCanvas, spliced in from assets/canvas-shell.html by render_map.py)
     is shared and instrument-agnostic; what follows is this instrument's two models, its edit
     panels and the frame around them. Every edit goes through the same functions as the slide
     tabs, so the same delta comes out. */
  function cvKey(t){ return t.id||('new:'+t.name); }
  function cvAct(key){ return (DATA.hl.activities||[]).filter(function(t){ return cvKey(t)===key; })[0]; }
  function cvLane(rowId){ return String(rowId).replace(/^ln:/,''); }
  function cvMag(p){ var m=p&&p.magnitude; if(!m||m.value==null) return '';
    return typeof magText==='function'?magText(p):(m.value+' '+(m.unit||'')); }
  function pmCanvasModel(D){
    var hl=D.hl||{}, rows=hl.activities||[], cols=hl.processes||[];
    var blocks=hl.activityBlocks||[], lanes=(hl.lanes||[]).slice();
    var actors={}; (D.actors||[]).forEach(function(a){ actors[a.name]=a; });
    var m={columns:[], rows:[], cells:{}, cards:{}, groups:{}, links:[],
           levels:['Key processes','Activity blocks','Activities'],
           words:{item:['activity','activities'], alert:['pain point','pain points'], unit:'FTE'},
           cornerTitle:'Who does it', cornerSub:'Key process →', addRowLabel:'Add a lane',
           run:{title:'Run your end-to-end process'},
           filters:[{label:'Everything', flag:null}, {label:'Pain points', flag:'pain'},
                    {label:'Hand-offs', flag:'handoff'}, {label:'Not linked yet', flag:'unlinked'}]};
    var colId={};
    cols.forEach(function(name,i){
      colId[name]='kp'+i;
      var acts=rows.filter(function(t){ return t.stage===name; });
      var f=0, fe=false, p=0; acts.forEach(function(t){ if(typeof t.fte==='number'){ f+=t.fte; fe=true; } p+=(t.pains||[]).length; });
      m.columns.push({id:'kp'+i, tag:'KEY PROCESS '+(i+1), label:name,
        sub:acts.length+' '+(acts.length===1?'activity':'activities')+(fe?' · '+rn(f)+' FTE':'')+
            (p?' · '+p+' pain point'+(p>1?'s':''):'')});
    });
    blocks.forEach(function(b){ m.groups[b.blockId]={title:b.name}; });
    /* outside parties a block names as participants, with no activity of their own here: they get
       a lane that says where they are involved, so the map shows everyone the work passes */
    var involved={};
    (hl.involved||[]).forEach(function(x){ if(lanes.indexOf(x.lane)<0){ lanes.push(x.lane); }
      (involved[x.lane]=involved[x.lane]||[]).push(x); });
    var byKey={}, byId={}; rows.forEach(function(t){ byKey[cvKey(t)]=t; if(t.id) byId[t.id]=t; });
    var linked={};
    rows.forEach(function(t){ (t.next||[]).forEach(function(n){
      var to=n.to?n.to:(n.toName?'new:'+n.toName:null); if(!to||!byKey[to]) return;
      var pains=(t.pains||[]).filter(function(p){ return p.handoffTo&&p.handoffTo===n.to; }).length;
      m.links.push({from:cvKey(t), to:to, sometimes:!!n.sometimes, note:n.note||'', alerts:pains});
      linked[cvKey(t)]=linked[to]=1; }); });
    lanes.forEach(function(l){
      var a=actors[l]||{}, list=rows.filter(function(t){ return t.lane===l; });
      var f=0, fe=false; list.forEach(function(t){ if(typeof t.fte==='number'){ f+=t.fte; fe=true; } });
      var kind=a.kind||((involved[l]||[])[0]||{}).kind;
      m.rows.push({id:'ln:'+l, label:l, icon:kind==='team'||!kind?'team':'external', accent:laneColor(l),
        sub:(kind==='external'?'External · ':kind==='internal'?'Internal · ':'')+
            (list.length?list.length+' '+(list.length===1?'activity':'activities')+(fe?' · '+rn(f)+' FTE':''):'involved, no activities mapped'),
        kind:'cards', fixed:(hl.lanes||[]).indexOf(l)<0});
      (involved[l]||[]).forEach(function(x){ var k='ln:'+l+'|'+colId[x.phase];
        if(!m.cells[k]) m.cells[k]={cards:[]};
        m.cells[k].note=(m.cells[k].note?m.cells[k].note+' · ':'Involved in: ')+x.block; });
    });
    rows.forEach(function(t){
      var key=cvKey(t), k='ln:'+t.lane+'|'+colId[t.stage]; if(!m.cells[k]) m.cells[k]={cards:[]};
      m.cells[k].cards.push(key);
      var pains=t.pains||[], flags=[], tags=[];
      if(pains.length) flags.push('pain');
      if(m.links.length&&!linked[key]) flags.push('unlinked');
      if(t.system) tags.push({text:t.system, kind:'sys'});
      if(typeof t.fte==='number') tags.push({text:rn(t.fte)+' FTE', kind:''});
      if(pains.length) tags.push({text:pains.length===1?(cvMag(pains[0])||'1 pain point'):pains.length+' pain points', kind:'pain'});
      if(!t.id) tags.push({text:'not sent yet', kind:'warn'});
      m.cards[key]={title:t.name, accent:laneColor(t.lane), flags:flags, tags:tags,
        group:t.blockId, owner:t.actorId||t.lane, weight:typeof t.fte==='number'?t.fte:undefined,
        alerts:pains.length};
    });
    m.links.forEach(function(l){ var a=byKey[l.from], b=byKey[l.to];
      if(a&&b&&(a.actorId||a.lane)!==(b.actorId||b.lane))
        [l.from,l.to].forEach(function(id){ var f=m.cards[id].flags; if(f.indexOf('handoff')<0) f.push('handoff'); }); });
    if(!m.links.length) m.filters=m.filters.filter(function(f){ return f.flag!=='handoff'&&f.flag!=='unlinked'; });
    return m;
  }

  /* ---- links: drawn on the canvas, sent as the activity's whole `next` list ---- */
  function cvSendNext(t){
    pushOp({op:'update', coll:'activities', id:t.id, changes:{next:(t.next||[]).map(function(n){
      var o=n.to?{to:n.to}:{toName:n.toName}; if(n.sometimes) o.sometimes=true; if(n.note) o.note=n.note; return o; })}});
  }
  function cvAddLink(fromKey, toKey){
    var a=cvAct(fromKey), b=cvAct(toKey); if(!a||!b) return;
    if(!a.id){ wmsg('Send this change to Claude first, so "'+a.name+'" has an ID - then draw the link from it.'); return; }
    var exists=(a.next||[]).some(function(n){ return (n.to&&n.to===b.id)||(!b.id&&n.toName===b.name); });
    if(exists){ toast('"'+a.name+'" already leads to "'+b.name+'".'); return; }
    a.next=(a.next||[]).concat([b.id?{to:b.id}:{toName:b.name}]);
    cvSendNext(a); reboot();
    toast((a.lane!==b.lane?'Hand-off':'Link')+' added: '+a.name+' → '+b.name);
  }
  function cvOpenLink(l){
    if(!ON||!edp||!l) return;
    var a=cvAct(l.from), b=cvAct(l.to); if(!a||!b) return;
    var n=(a.next||[]).filter(function(x){ return (x.to&&x.to===b.id)||(!x.to&&x.toName===b.name); })[0]; if(!n) return;
    var ho=a.lane!==b.lane;
    var pains=(a.pains||[]).filter(function(p){ return p.handoffTo&&p.handoffTo===b.id; });
    var body='<div class="grp"><h5>'+(ho?'The hand-off':'The link')+'</h5>'+
      '<div class="hint">'+(ho?'<b>'+esc(a.lane)+'</b> passes the work to <b>'+esc(b.lane)+'</b>.':'The same team carries on.')+'</div>'+
      '<label class="f" style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="lk_some"'+(n.sometimes?' checked':'')+
      ' style="width:auto"> Only sometimes - a branch, not every case</label>'+
      fld('Note','lk_note',n.note||'','What passes between them, if it is worth saying')+'</div>';
    if(ho) body+='<div class="grp"><h5>Pain points on this hand-off</h5>'+
      (pains.length?pains.map(function(p){ return '<div class="pn2">'+esc(p.theme)+(cvMag(p)?' <b>'+esc(cvMag(p))+'</b>':'')+'</div>'; }).join('')
                   :'<div class="hint">None yet. Waiting, re-keying and things lost between teams sit here.</div>')+
      (b.id?'<button class="wbtn" id="lk_pain" style="margin-top:6px">+ Add a pain point on this hand-off</button>':'')+'</div>';
    panelShell({label:ho?'Hand-off':'Link',cls:''}, a.name+' → '+b.name, esc(a.lane)+(ho?' → '+esc(b.lane):''), body,
      '<button class="wbtn" id="lk_del" style="color:var(--rag-red-text)">Remove link</button><span class="sp"></span>'+
      '<button class="wbtn" id="lk_x">Cancel</button><button class="wbtn pri" id="lk_ok">Apply</button>');
    edp.querySelector('#lk_x').onclick=closeEd;
    edp.querySelector('#lk_ok').onclick=function(){
      n.sometimes=edp.querySelector('#lk_some').checked; if(!n.sometimes) delete n.sometimes;
      n.note=edp.querySelector('#lk_note').value.trim(); if(!n.note) delete n.note;
      cvSendNext(a); closeEd(); reboot(); };
    edp.querySelector('#lk_del').onclick=function(){
      a.next=(a.next||[]).filter(function(x){ return x!==n; });
      cvSendNext(a); closeEd(); reboot(); toast('Link removed.'); };
    var bp=edp.querySelector('#lk_pain'); if(bp) bp.onclick=function(){ cvHandoffPain(a,b); };
  }
  function cvHandoffPain(a,b){
    var body='<div class="grp"><h5>What goes wrong between the two</h5>'+
      fld('Short title','hp_theme','','e.g. The notification waits a day before claims picks it up')+
      fldT('Description','hp_desc','','What actually happens at the hand-off and why it hurts')+'</div>'+
      '<div class="grp"><h5>How big is it?</h5>'+magField(null)+'</div>'+
      '<div class="grp"><h5>Where it lands</h5>'+
      sel('Dimension','hp_dim',V.dimensions,'proc','— which lens does this feed? —')+sourceField('hp_src',null)+'</div>';
    panelShell({label:'Pain point',cls:'pain'}, 'A pain on the hand-off', esc(a.name)+' → '+esc(b.name), body,
      '<span class="sp"></span><button class="wbtn" id="hp_x">Cancel</button><button class="wbtn pri" id="hp_ok">Add pain point</button>');
    wireSource('hp_src');
    edp.querySelector('#hp_x').onclick=closeEd;
    edp.querySelector('#hp_ok').onclick=function(){
      var th=edp.querySelector('#hp_theme').value.trim(); if(!th){ wmsg('A pain point needs a short title.'); return; }
      addPain(a.id,{theme:th, description:edp.querySelector('#hp_desc').value, magnitude:readMag(),
                    dimension:edp.querySelector('#hp_dim').value||null, source:readSource('hp_src'), handoffTo:b.id});
      closeEd(); };
  }
  /* ---- lanes ---- */
  function cvAddLane(){
    if(!ON||!edp) return;
    var free=(DATA.actors||[]).filter(function(x){ return (DATA.hl.lanes||[]).indexOf(x.name)<0; });
    var body='<div class="grp"><h5>Who joins the map</h5>'+
      (free.length?'<div class="f"><label>Someone already in the baseline</label><select id="al_pick"><option value="">— pick —</option>'+
        free.map(function(x){ return '<option value="'+esc(x.name)+'">'+esc(x.name)+'</option>'; }).join('')+'</select></div>':'')+
      fld('Or a new team or party','al_new','','e.g. Legal')+
      sel('What they are','al_kind',[{key:'team',label:'A team we map (carries FTE)'},{key:'internal',label:'Another internal group'},
                                      {key:'external',label:'Outside the company'}],'team',null)+
      '<div class="hint">A lane stays on the map once it does some work: add its first activity with + in one of its cells.</div></div>';
    panelShell({label:'Lane',cls:'new'}, 'Add a lane', '', body,
      '<span class="sp"></span><button class="wbtn" id="al_x">Cancel</button><button class="wbtn pri" id="al_ok">Add lane</button>');
    edp.querySelector('#al_x').onclick=closeEd;
    edp.querySelector('#al_ok').onclick=function(){
      var pk=edp.querySelector('#al_pick'), nm=(pk&&pk.value)||edp.querySelector('#al_new').value.trim();
      if(!nm){ wmsg('Pick someone or type a name.'); return; }
      var ex=(DATA.actors||[]).filter(function(x){ return x.name.toLowerCase()===nm.toLowerCase(); })[0];
      if(!ex){ var kind=edp.querySelector('#al_kind').value||'team';
        DATA.actors=(DATA.actors||[]).concat([{name:nm, kind:kind, inMap:true}]);
        pushOp({op:'add', coll:'actors', record:{name:nm, kind:kind}}); }
      else nm=ex.name;
      if(DATA.hl.lanes.indexOf(nm)<0) DATA.hl.lanes.push(nm);
      closeEd(); reboot(); };
  }
  var CVHOOKS={
    onCard:function(k){ var t=cvAct(k); if(!t) return; if(!t.id){ wmsg('This activity is not sent yet - send your changes to Claude, then edit it.'); return; } openEd(t); },
    onAdd:function(rowId,colId){ var i=+String(colId).slice(2); addTask(cvLane(rowId), (DATA.hl.processes||[])[i]); },
    onMoveRow:function(rowId,step){ var L=DATA.hl.lanes||[], i=L.indexOf(cvLane(rowId));
      if(i<0){ wmsg('This lane is only on the map because a block names it as involved. Give it an activity first.'); return; }
      reorderLane(i, i+step); },
    onAddRow:cvAddLane, onLink:cvAddLink, onLinkClick:cvOpenLink,
    detail:function(k){ var t=cvAct(k); if(!t) return null;
      var nx=(t.next||[]).map(function(n){ var b=n.to?taskById(n.to):cvAct('new:'+n.toName);
        return {k:(b&&b.lane!==t.lane?'Hand-off to '+b.lane:'Next')+(n.sometimes?' (sometimes)':''), v:b?b.name:(n.to||n.toName)}; });
      return {kind:'Activity', title:t.name, id:t.id||'',
        rows:[{k:'Who',v:t.lane},{k:'Key process',v:t.stage},{k:'Activity block',v:t.activity||''},
              {k:'FTE',v:typeof t.fte==='number'?rn(t.fte)+' FTE':'not quantified'},{k:'System',v:t.system||'—'}],
        notesTitle:'Pain points', notesEmpty:'None captured here.',
        notes:(t.pains||[]).map(function(p){ return {body:p.theme, tone:'negative', strong:cvMag(p),
          meta:p.handoffTo?'on the hand-off to '+((taskById(p.handoffTo)||{}).name||p.handoffTo):''}; }),
        lists:[{title:'What comes next', items:nx, empty:'Nothing linked yet.'},
               {title:'Tasks', items:(t.tasks||[]).map(function(k,i){ return {k:String(i+1), v:k.name}; }), empty:'Not broken down.'}]}; },
    runInfo:function(k){ var t=cvAct(k); if(!t) return {};
      return {pains:(t.pains||[]).filter(function(p){ return !p.handoffTo; }).map(function(p){
        return 'Pain point: '+p.theme+(cvMag(p)?' ('+cvMag(p)+')':''); })}; }
  };

  /* ── THE BLUEPRINT ARRANGEMENT ───────────────────────────────────────────────────────────────
     The same activities, laid out by journey stage and by what the customer sees of them. A
     blueprint is the process map with the customer axis added, so the cards, the links and the
     run are the very same ones; only the rows and columns change. Stage, visibility and channel
     live on the activity in the baseline. */
  var VIS=[{key:'customer-action',label:'The customer does it'},{key:'frontstage',label:'Our work the customer sees'},
           {key:'backstage',label:'Our work the customer does not see'},{key:'support',label:'Other teams and systems behind it'}];
  var CHANNELS=[{key:'phone',label:'Phone'},{key:'email',label:'Email'},{key:'letter',label:'Letter'},{key:'portal',label:'Portal'},
                {key:'app',label:'App'},{key:'sms',label:'SMS'},{key:'chat',label:'Chat'},{key:'in-person',label:'In person'}];
  var FEEL=[{key:'positive',label:'It goes well for them'},{key:'neutral',label:'Neither here nor there'},{key:'negative',label:'It goes badly for them'}];
  function lbl(list,k){ var x=list.filter(function(o){ return o.key===k; })[0]; return x?x.label:''; }
  function stagesOf(D){ return ((D.journey||{}).stages||[]).slice().sort(function(a,b){ return (a.order||0)-(b.order||0); }); }
  function actorOf(name){ return (DATA.actors||[]).filter(function(a){ return a.name===name; })[0]||{}; }
  function bpCanvasModel(D){
    var hl=D.hl||{}, rows=hl.activities||[], ST=stagesOf(D), blocks=hl.activityBlocks||[];
    var base=pmCanvasModel(D);                       /* the cards, groups and links are the process map's own */
    var m={columns:[], rows:[], cells:{}, cards:base.cards, groups:base.groups, links:base.links,
           levels:['Journey stages','Activity blocks','Steps'],
           words:base.words, cornerTitle:'What the customer sees', cornerSub:'Journey stage →',
           run:base.run, jumpWords:['Journey stages','Rows'], outerLinks:'hover'};
    var off=rows.some(function(t){ return !t.journeyStageId||!ST.some(function(x){ return x.id===t.journeyStageId; }); });
    ST.forEach(function(st,i){
      var n=rows.filter(function(t){ return t.journeyStageId===st.id; }).length;
      m.columns.push({id:st.id, tag:'STAGE '+(i+1), label:st.name, sub:st.want||(n+' step'+(n===1?'':'s'))});
    });
    if(off) m.columns.push({id:'__off', kind:'off', label:'Not on the journey', sub:'No stage given yet'});
    if(ST.some(function(st){ return st.sentiment; })){
      m.rows.push({id:'feel', kind:'track', icon:'feel', label:'How the customer feels', sub:'At this stage, in their words'});
      ST.forEach(function(st){ if(st.sentiment) m.cells['feel|'+st.id]={track:{tone:st.sentiment, label:st.sentimentNote||''}}; });
    }
    var R=[['customer-action','The customer','What they do','journey',null,'var(--accent)'],
           ['frontstage','Frontstage','Our work they see','front','line of interaction','var(--rag-green)'],
           ['backstage','Backstage','Our work they never see','back','line of visibility','var(--steel)'],
           ['support','Support','Other teams and systems','support',null,'var(--rag-na)'],
           ['','Not classified','Nobody has been asked yet','back',null,'var(--rag-amber)']];
    R.forEach(function(r){
      var list=rows.filter(function(t){ return (t.visibility||'')===r[0]; });
      if(!list.length&&!r[0]) return;
      var rid='vis:'+(r[0]||'none');
      m.rows.push({id:rid, label:r[1], sub:r[2], icon:r[3], divider:r[4], accent:r[5], kind:'cards', count:list.length});
      list.forEach(function(t){
        var c=ST.some(function(x){ return x.id===t.journeyStageId; })?t.journeyStageId:'__off';
        var k=rid+'|'+c; if(!m.cells[k]) m.cells[k]={cards:[]}; m.cells[k].cards.push(cvKey(t));
      });
    });
    rows.forEach(function(t){ var c=m.cards[cvKey(t)]; if(!c) return;
      var tags=(c.tags||[]).slice();
      if(t.channel) tags.unshift({text:lbl(CHANNELS,t.channel)||t.channel, kind:'ch'});
      /* no FTE on the blueprint's face: the process map and the MAE answer "how much effort", and
         two places saying it is how two numbers come to disagree */
      tags=tags.filter(function(x){ return !/ FTE$/.test(x.text)||x.kind==='pain'; });
      m.cards[cvKey(t)]=Object.assign({}, c, {meta:t.lane, tags:tags, weight:undefined,
        flags:(c.flags||[]).concat(!t.journeyStageId?['offjourney']:[],
              ((t.visibility==='customer-action'||t.visibility==='frontstage')&&!t.channel)?['nochannel']:[],
              !t.visibility?['unclassified']:[])}); });
    m.filters=[{label:'Everything', flag:null},{label:'Pain points', flag:'pain'},{label:'Hand-offs', flag:'handoff'},
               {label:'Not on the journey', flag:'offjourney'},{label:'No channel yet', flag:'nochannel'},
               {label:'Not classified', flag:'unclassified'}];
    return m;
  }
  function bpStep(k){
    var t=cvAct(k); if(!t||!ON||!edp) return;
    var ST=stagesOf(DATA);
    var body='<div class="grp"><h5>Where the customer meets it</h5>'+
      '<div class="f"><label>Journey stage</label><select id="bp_st"><option value="">— not on the journey —</option>'+
        ST.map(function(x){ return '<option value="'+esc(x.id)+'"'+(x.id===t.journeyStageId?' selected':'')+'>'+esc(x.name)+'</option>'; }).join('')+'</select></div>'+
      sel('What the customer sees of it','bp_vis',VIS,t.visibility||null,'— not asked yet —')+
      sel('Channel','bp_ch',CHANNELS,t.channel||null,'— none —')+
      '<div class="hint">Only the customer\'s own steps and the ones they see have a channel. A step marked "The customer does it" is done by the customer.</div></div>';
    panelShell({label:'Step',cls:''}, t.name, esc(t.lane)+' · '+esc(t.activity||''), body,
      (t.id?'<button class="wbtn" id="bp_full">Open the full activity</button>':'')+'<span class="sp"></span>'+
      '<button class="wbtn" id="bp_x">Cancel</button><button class="wbtn pri" id="bp_ok">Apply</button>');
    edp.querySelector('#bp_x').onclick=closeEd;
    var full=edp.querySelector('#bp_full'); if(full) full.onclick=function(){ openEd(t); };
    edp.querySelector('#bp_ok').onclick=function(){
      var st=edp.querySelector('#bp_st').value||null, vis=edp.querySelector('#bp_vis').value||null, ch=edp.querySelector('#bp_ch').value||null;
      var cust=actorOf(t.lane).kind==='customer';
      if(vis==='customer-action'&&!cust){ wmsg('Only the customer does a step marked "The customer does it". '+t.lane+' does this one: pick what the customer sees of it instead.'); return; }
      if(cust&&vis&&vis!=='customer-action'){ wmsg('This step is done by the customer, so it can only be "The customer does it".'); return; }
      if(ch&&vis&&vis!=='customer-action'&&vis!=='frontstage'){ wmsg('The customer never sees this step, so it has no channel. Clear the channel or change what they see.'); return; }
      if(!t.id){ wmsg('Send this change to Claude first, so the step has an ID. Then place it on the journey.'); return; }
      var c={};
      if(st!==(t.journeyStageId||null)) c.journeyStageId=st;
      if(vis!==(t.visibility||null)) c.visibility=vis;
      if(ch!==(t.channel||null)) c.channel=ch;
      if(!Object.keys(c).length){ closeEd(); return; }
      Object.keys(c).forEach(function(x){ t[x]=c[x]; });
      pushOp({op:'update', coll:'activities', id:t.id, changes:c});
      closeEd(); reboot(); };
  }
  function bpStage(id){
    if(!ON||!edp) return;
    var st=stagesOf(DATA).filter(function(x){ return x.id===id; })[0];
    if(!st){ toast('This column holds the work no journey stage claims yet. Open a step to place it.'); return; }
    var body='<div class="grp"><h5>The stage</h5>'+fld('Name, in the customer\'s words','js_n',st.name,'e.g. I report the damage')+
      fld('What the customer wants here','js_w',st.want||'','e.g. I want to report it once')+
      sel('How it goes for them','js_s',FEEL,st.sentiment||null,'— not asked yet —')+
      fld('In their words','js_sn',st.sentimentNote||'','e.g. Tells the story, then tells it again')+'</div>';
    panelShell({label:'Journey stage',cls:''}, st.name, '', body,
      '<span class="sp"></span><button class="wbtn" id="js_x">Cancel</button><button class="wbtn pri" id="js_ok">Apply</button>');
    edp.querySelector('#js_x').onclick=closeEd;
    edp.querySelector('#js_ok').onclick=function(){
      var c={name:edp.querySelector('#js_n').value.trim(), want:edp.querySelector('#js_w').value.trim()||null,
             sentiment:edp.querySelector('#js_s').value||null, sentimentNote:edp.querySelector('#js_sn').value.trim()||null};
      if(!c.name){ wmsg('A journey stage needs a name.'); return; }
      if(c.sentimentNote&&!c.sentiment){ wmsg('Say whether it goes well or badly for them, not only how they put it.'); return; }
      Object.keys(c).forEach(function(k){ if(c[k]===(st[k]==null?null:st[k])) delete c[k]; });
      if(!Object.keys(c).length){ closeEd(); return; }
      if(String(st.id).indexOf('new:')===0){ wmsg('Send this change to Claude first, so the new stage has an ID.'); return; }
      Object.keys(c).forEach(function(k){ st[k]=c[k]; });
      pushOp({op:'update', coll:'journey', id:st.id, changes:c});
      closeEd(); reboot(); };
  }
  function bpAddStage(){
    if(!ON||!edp) return;
    var ST=stagesOf(DATA);
    panelShell({label:'Journey stage',cls:'new'}, 'Add a journey stage', '',
      '<div class="grp"><h5>The stage</h5>'+fld('Name, in the customer\'s words','ns_n','','e.g. I hear what happens next')+
      fld('What the customer wants here','ns_w','','')+'<div class="hint">It goes at the end of the journey. A step is placed on it once it has been sent to Claude.</div></div>',
      '<span class="sp"></span><button class="wbtn" id="ns_x">Cancel</button><button class="wbtn pri" id="ns_ok">Add stage</button>');
    edp.querySelector('#ns_x').onclick=closeEd;
    edp.querySelector('#ns_ok').onclick=function(){
      var n=edp.querySelector('#ns_n').value.trim(); if(!n){ wmsg('A journey stage needs a name.'); return; }
      var o=(ST.length?Math.max.apply(null,ST.map(function(x){ return x.order||0; })):0)+1, w=edp.querySelector('#ns_w').value.trim()||null;
      DATA.journey=DATA.journey||{stages:[]}; DATA.journey.stages.push({id:'new:'+n, name:n, order:o, want:w});
      pushOp({op:'add', coll:'journey', record:{name:n, order:o, want:w}});
      closeEd(); reboot(); };
  }
  function bpAdd(rowId, colId){
    if(!ON||!edp) return;
    var vis=String(rowId).replace(/^vis:/,''); if(vis==='none') vis='';
    var cust=(DATA.actors||[]).filter(function(a){ return a.kind==='customer'; })[0];
    var who=vis==='customer-action'&&cust?cust.name:null;
    var all=(DATA.actors||[]).filter(function(a){ return vis==='customer-action'?a.kind==='customer':a.kind!=='customer'; });
    if(vis==='customer-action'&&!all.length){ wmsg('There is no customer on this value chain yet. Add the customer as a lane on the process map first.'); return; }
    var blocks=(DATA.hl.activityBlocks||[]);
    /* the block most of this stage's work already belongs to is the likely home */
    var cnt={}, likely=null; (DATA.hl.activities||[]).forEach(function(t){ if(colId&&t.journeyStageId===colId) cnt[t.blockId]=(cnt[t.blockId]||0)+1; });
    Object.keys(cnt).forEach(function(k){ if(!likely||cnt[k]>cnt[likely]) likely=k; });
    var body='<div class="grp"><h5>The step</h5>'+fld('Name','na_n','','e.g. Send in the photos')+
      '<div class="f"><label>Done by</label><select id="na_who">'+actorOpts(all, who||((all[0]||{}).name))+'</select></div>'+
      '<div class="f"><label>Part of the activity block</label><select id="na_blk">'+blocks.map(function(b){
        return '<option value="'+esc(b.blockId)+'"'+(b.blockId===likely?' selected':'')+'>'+esc(b.name)+' ('+esc(b.phase)+')</option>'; }).join('')+'</select></div>'+
      '<div class="hint">It lands in this row and stage. Its key process is its activity block\'s.</div></div>';
    panelShell({label:'New step',cls:'new'}, 'Add a step', esc(lbl(VIS,vis)||'Not classified'), body,
      '<span class="sp"></span><button class="wbtn" id="na_x">Cancel</button><button class="wbtn pri" id="na_ok">Add step</button>');
    edp.querySelector('#na_x').onclick=closeEd;
    edp.querySelector('#na_ok').onclick=function(){
      var n=edp.querySelector('#na_n').value.trim(); if(!n){ wmsg('A step needs a name.'); return; }
      var lane=edp.querySelector('#na_who').value, b=blocks.filter(function(x){ return x.blockId===edp.querySelector('#na_blk').value; })[0];
      if(!b) return;
      var st=(colId&&colId!=='__off')?colId:null;
      if(st&&String(st).indexOf('new:')===0){ wmsg('Send the new stage to Claude first, so it has an ID.'); return; }
      var rec={name:n, blockId:b.blockId, actorName:lane};
      if(vis) rec.visibility=vis; if(st) rec.journeyStageId=st;
      DATA.hl.activities.push({id:null, name:n, lane:lane, actorId:(actorOf(lane).id||null), stage:b.phase, activity:b.name,
        blockId:b.blockId, visibility:vis||null, journeyStageId:st, system:'', fte:null, pains:[]});
      if((DATA.hl.lanes||[]).indexOf(lane)<0) DATA.hl.lanes.push(lane);
      pushOp({op:'add', coll:'activities', record:rec});
      closeEd(); reboot(); };
  }
  var BPHOOKS=Object.assign({}, CVHOOKS, {onCard:bpStep, onColumn:bpStage, onAdd:bpAdd,
    canAdd:function(r){ return String(r).indexOf('vis:')===0; }, onMoveRow:null, onAddRow:null});

  /* ── THE FRAME ───────────────────────────────────────────────────────────────────────────── */
  var TWIN={on:false, arr:'pm', host:null, homes:[]};
  function twinModel(){
    var hasJ=stagesOf(DATA).length>0;
    if(!hasJ) TWIN.arr='pm';
    var m=TWIN.arr==='bp'?bpCanvasModel(DATA):pmCanvasModel(DATA);
    if(TWIN.arr==='pm') m.jumpWords=['Key processes','Teams'];
    m.arrangements=hasJ?[{id:'pm',label:'Process map'},{id:'bp',label:'Service blueprint'}]:[];
    m.arrangement=TWIN.arr;
    return m;
  }
  function twinChrome(){
    var side=[{title:'For the slides', actions:[
      {label:'Action title', hint:'The title the slides carry', onClick:function(){ if(!ON){ toast('Unlock to edit the action title.'); return; } openTitle(); }},
      {label:'Preview the slides', hint:'The condensed version the client gets', onClick:function(){ twinShow(false); }}]}];
    if(TWIN.arr==='bp'&&ON) side.unshift({title:'The journey', actions:[{label:'+ Add a journey stage', onClick:bpAddStage}]});
    return {title:DATA.teamName||'Process twin', eyebrow:'Process twin · '+(DATA.context||'OpEx'),
      side:side, onSlot:function(slot){ TWIN.slot=slot; twinDock(true); }};
  }
  /* the lock and the send line belong to the twin while it is on screen, to the slides otherwise */
  function twinDock(intoTwin){
    var g=document.querySelector('.wgrp'), st=document.getElementById('nrstrip');
    if(!TWIN.homes.length){ [g,st].forEach(function(el){ if(el) TWIN.homes.push({el:el, parent:el.parentNode, next:el.nextSibling}); }); }
    TWIN.homes.forEach(function(h){
      if(intoTwin&&TWIN.slot) TWIN.slot.appendChild(h.el);
      else if(!intoTwin) h.parent.insertBefore(h.el, h.next&&h.next.parentNode===h.parent?h.next:null);
    });
  }
  function twinDraw(refit){
    if(!TWIN.on) return;
    TWIN.host.classList.toggle('ed', !!ON);           /* the send line shows while editing, as on the slides */
    NRCanvas.mount({frame:'twin', host:TWIN.host, model:twinModel(), editing:ON, chrome:twinChrome(),
                    hooks:Object.assign({}, TWIN.arr==='bp'?BPHOOKS:CVHOOKS, {onArrange:function(a){ TWIN.arr=a; twinDraw(true); }})});
    if(refit) NRCanvas.redraw(null, {refit:true});
  }
  function twinShow(on){
    TWIN.on=!!on;
    document.body.classList.toggle('nr-twin', TWIN.on);
    var back=document.getElementById('twinback'); if(back) back.style.display=TWIN.on?'none':'';
    twinDock(TWIN.on);
    if(TWIN.on){ NRCanvas.show(true); twinDraw(); }
    else { NRCanvas.show(false); render(); if(window.fitChrome) requestAnimationFrame(window.fitChrome); }
  }
  /* every edit re-renders the slide tabs (render), and the twin with them */
  VIEWHOOK=function(){ if(TWIN.on) twinDraw(); return false; };
  if(EDIT&&typeof NRCanvas!=='undefined'){
    TWIN.host=document.createElement('div'); TWIN.host.id='twinhost'; document.body.appendChild(TWIN.host);
    var bk=document.createElement('button'); bk.id='twinback'; bk.type='button'; bk.textContent='Back to the twin';
    bk.style.display='none'; bk.onclick=function(){ twinShow(true); }; document.body.appendChild(bk);
    TWIN.on=true; document.body.classList.add('nr-twin');
  }


/*</EDIT>*/
  function render(){var vi=document.getElementById('vinner');if(VIEWHOOK&&VIEWHOOK(cur,vi))return;vi.innerHTML='';vi.appendChild(VIEWS[cur]());setLegend();requestAnimationFrame(fitView);setTimeout(fitView,60);}
  function seg(id,attr,cb){var box=document.getElementById(id);box.querySelectorAll('button').forEach(function(b){b.onclick=function(){box.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');cb(b.getAttribute(attr));};});}
  seg('views','data-v',function(v){cur=v;render();});
  seg('theme','data-s',function(t){pm.setAttribute('data-t',t);render();});
  document.getElementById('pinwrap').onclick=function(e){if(e.target===this)closePin();};
  window.addEventListener('keydown',function(e){if(e.key==='Escape')closePin();});
  window.addEventListener('resize',fitView);
  render();
/*<EDIT>*/
  (function(){
    var g=document.getElementById('wgear'), pop=document.getElementById('wpop'), b=document.getElementById('wsave');
    function setEditing(on){
      ON = !!on;
      pm.classList.toggle('editing', ON);
      if(g){
        g.classList.toggle('unlocked', ON);
        g.setAttribute('aria-pressed', ON ? 'true' : 'false');
        g.innerHTML = ON ? UNLOCK_SVG : LOCK_SVG;
        g.title = ON ? 'Editing unlocked - click to lock' : 'Locked - click to edit';
      }
      wsave();
      var _t=document.getElementById('title');
      if(_t)_t.onclick = ON ? function(){openTitle();} : null;
      render();            // attach or detach every drag/click/+ hook to match the new state
      if(window.fitChrome) requestAnimationFrame(window.fitChrome);   // the edit strip came or went
    }
    window.__setEditing = setEditing;
    if(g){
      g.onclick=function(e){ e.stopPropagation(); setEditing(!ON); };  // the gear IS the lock
    }
    if(pop){
      pop.onclick=function(e){ e.stopPropagation(); };
    }
    if(b) b.onclick=exportDelta;
    if(b){                 // undo and discard sit beside the send button, and only show while there is something unsent
      var bu=document.createElement('button'); bu.id='wundo'; bu.type='button'; bu.textContent='Undo last';
      bu.title='Take back your last unsent change';
      var bd=document.createElement('button'); bd.id='wdiscard'; bd.type='button'; bd.textContent='Discard all';
      bd.title='Throw away every unsent change';
      b.parentNode.insertBefore(bu,b); b.parentNode.insertBefore(bd,b);
      bu.onclick=function(e){ e.stopPropagation(); nrHistRestore(false); };
      bd.onclick=function(e){ e.stopPropagation(); var k=nrHistCount();
        nrArm(bd,'Discard '+k+' change'+(k>1?'s':'')+'?',function(){ nrHistRestore(true); }); };
      window.nrHistBar=wsave;
    }
    nrHistStart(0,null);   // what "Discard all" goes back to
    setEditing(false);     // LOCKED on load - no accidental changes
  })();
/*</EDIT>*/
})();
</script>
<script>
/* ── fitChrome() — the chrome stacks when it does not fit ────────────────────
   Measures the one-row layout and adds .stacked to the artifact root when any of
   six things is true: the two groups are closer than 12px · a control runs past
   either edge · a label has been squeezed narrower than its own text · the
   toprow wraps · the toprow comes within 6px of the action title · the viewport
   is at or below 760px (the floor). Exposed as window.fitChrome() so a render
   pass can call it after it changes a label. ── */
(function(){
  var busy=false,lastW=-1;
  function root(){return document.querySelector('#art,#pm,#pw');}
  function skip(e){
    if(!e) return true;
    if(e.id==='wpop'||(e.closest&&e.closest('#wpop'))) return true;
    var cs=getComputedStyle(e);
    if(cs.visibility==='hidden'||cs.display==='none') return true;
    return false;
  }
  function fitChrome(){
    if(busy) return; busy=true;
    try{
      var R=root(); if(!R) return;
      var tr=R.querySelector('.toprow'); if(!tr) return;
      R.classList.remove('stacked');
      void tr.offsetWidth;                                  /* force the reflow we measure */
      var need=window.innerWidth<=760, i, r, e;
      var trb=tr.getBoundingClientRect();
      /* 1. the two groups are closer than 12px */
      var tags=R.querySelector('.tags'), ctrls=R.querySelector('.ctrls');
      if(!need&&tags&&ctrls&&!skip(tags)&&!skip(ctrls)){
        var a=tags.getBoundingClientRect(), b=ctrls.getBoundingClientRect();
        if(b.left-a.right<12) need=true;
      }
      /* 2. a control runs past either edge */
      if(!need){
        var kids=tr.querySelectorAll('.nr-pill,.nr-track,.seg,.wgrp,button,#wnote');
        for(i=0;i<kids.length;i++){
          e=kids[i]; if(skip(e)) continue;
          r=e.getBoundingClientRect(); if(!r.width&&!r.height) continue;
          if(r.right>trb.right+0.5||r.left<trb.left-0.5){need=true;break;}
        }
      }
      /* 3. a label has been squeezed narrower than its own text */
      if(!need){
        var ls=tr.querySelectorAll('.nr-pill b,.nr-track,.seg button,button,#wnote,span');
        for(i=0;i<ls.length;i++){
          e=ls[i]; if(skip(e)) continue;
          if(!e.textContent||!e.textContent.trim()) continue;
          if(e.scrollWidth>e.clientWidth+1){need=true;break;}
        }
      }
      /* 4. the toprow wraps — a floating row that wraps grows downwards into the
         title without pushing anything down */
      if(!need){
        var tall=0,ch=tr.children;
        for(i=0;i<ch.length;i++){var h=ch[i].getBoundingClientRect().height;if(h>tall)tall=h;}
        if(trb.height>tall+2) need=true;
      }
      /* 5. the toprow sits on, or within 6px of, the action title */
      if(!need){
        var t=R.querySelector('.nr-strip'); if(!t||skip(t)) t=R.querySelector('h1');
        if(t&&!skip(t)){var tb=t.getBoundingClientRect(); if(tb.top-trb.bottom<6) need=true;}
      }
      if(need) R.classList.add('stacked');
      /* --padl is read AFTER the class lands: the class itself changes the padding */
      R.style.setProperty('--padl',(parseFloat(getComputedStyle(R).paddingLeft)||0)+'px');
    } finally { busy=false; }
  }
  window.fitChrome=fitChrome;
  function kick(){requestAnimationFrame(fitChrome);}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',kick); else kick();
  window.addEventListener('load',kick);
  window.addEventListener('resize',function(){lastW=-1;kick();});
  if(window.ResizeObserver){
    var ro=new ResizeObserver(function(en){
      var w=en&&en[0]?Math.round(en[0].contentRect.width):-1;
      if(w===lastW) return;                                 /* stacking must not re-trigger us */
      lastW=w; kick();
    });
    var r0=root(); if(r0) ro.observe(r0);
  }
})();
</script>
<script id="nr-topbar-js">
/* patch_topbar.py: one theme switch and the way home, the same in every instrument.
   Theme: the choice is kept under the cockpit's key, nr_dark, so every page of an
   engagement opens the same way. Home: a page that carries
   <meta name="nr-home" content="index.html"> (the engagement artifact adds it) gets
   "< Cockpit /" in front of its section tag. */
(function(){
  var K='nr_dark', box=document.getElementById('theme')||document.getElementById('tseg');
  if(box){
    box.querySelectorAll('button').forEach(function(b){ var d=b.getAttribute('data-s')==='dark';
      b.title=d?'Dark mode':'Light mode'; b.setAttribute('aria-label',b.title);
      b.addEventListener('click',function(){ try{ localStorage.setItem(K,d?'1':'0'); }catch(e){} }); });
    var v=null; try{ v=localStorage.getItem(K); }catch(e){}
    var dk=box.querySelector('button[data-s="dark"]');
    if(v==='1'&&dk&&!dk.classList.contains('on')) dk.click();
  }
  var m=document.querySelector('meta[name="nr-home"]'), lens=document.getElementById('lens')||document.querySelector('.toprow .nr-track');
  if(m&&lens&&!document.querySelector('.nr-crumb')){
    var c=document.createElement('div'); c.className='nr-track nr-crumb';
    var a=document.createElement('a'); a.className='nr-home'; a.href=m.getAttribute('content')||'index.html';
    a.textContent='\u2039 '+(m.getAttribute('data-label')||'Cockpit'); a.title='Back to the engagement cockpit';
    /* opened in a window of the findings dashboard (a frame of our own page): go back in that page, not in the frame */
    try{ if(window.parent!==window&&window.parent.document) a.target='_parent'; }catch(e){}
    var s=document.createElement('span'); s.className='nr-sep'; s.textContent='/';
    lens.parentNode.insertBefore(c,lens); c.appendChild(a); c.appendChild(s); c.appendChild(lens);
    if(window.fitChrome) requestAnimationFrame(window.fitChrome);
  }
})();
</script>

   This artifact normally scales its whole body down so the page fits one screen.
   On a phone that turns 13px type into 4px. Below 760px the scaling is switched
   off and the page simply flows and scrolls at its real size. Desktop is
   untouched — every rule here lives inside the media query. */
@media (max-width:760px){

  .tags{flex-wrap:wrap!important;gap:8px!important;margin-left:-34px!important}
  .ctrls{flex-wrap:wrap!important;gap:8px!important;flex:1 1 100%!important}
  #ft{position:static!important;flex-wrap:wrap!important;row-gap:6px!important;margin-top:14px!important}
  h1{font-size:19px!important;max-width:none!important}
  .grid,.classic,.cols-grid{grid-template-columns:1fr!important}
  table{min-width:0!important}

}
</style>
<style>/* READ-MODE TYPE FLOOR — nothing under 11px once the page stops scaling */

@media (max-width:760px){
  #ft{font-size:11px!important}
