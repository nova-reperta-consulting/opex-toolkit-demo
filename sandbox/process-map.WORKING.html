  }
  function handoffs(){ var n=0; (M.links||[]).forEach(function(l){ if(isHandoff(l)) n++; }); return n; }
  function isHandoff(l){ var a=(M.cards||{})[l.from], b=(M.cards||{})[l.to];
    return !!(a&&b&&a.owner&&b.owner&&a.owner!==b.owner); }

  /* ── the grid, inside the zoomed world. No rail, no heads: those are drawn outside ─────────── */
  function cardHtml(card){
    return '<div class="nc-card'+(passes(card)?'':' nomatch')+
      '" data-card="'+esc(card.id)+'"'+(card.accent?' style="border-left:3px solid '+card.accent+';--lc:'+card.accent+'"':'')+'>'+
      '<b>'+esc(card.title)+'</b>'+
      (card.meta?'<span class="who">'+esc(card.meta)+'</span>':'')+
      ((card.tags||[]).length?'<div class="tags">'+card.tags.map(function(t){
        return '<span class="nc-tag '+esc(t.kind||'')+'">'+esc(t.text)+'</span>';}).join('')+'</div>':'')+
      (H.onLink?'<span class="nc-hd" data-hd="'+esc(card.id)+'" title="Drag to the activity that comes next"></span>':'')+
      '</div>';
  }
  function trackCell(row,col,i){
    var c=cell(row.id,col.id).track;
    var dim=PICKING&&!onSlide('c',col.id);
    if(!c) return '<div class="nc-track'+(col.kind==='off'?' off':'')+(dim?' dim':'')+'" data-r="'+esc(row.id)+'" data-c="'+esc(col.id)+'"></div>';
    var y=TONEY[c.tone]!=null?TONEY[c.tone]:28, col2=TONE[c.tone]||'var(--rag-na)';
    var prev=(M.columns[i-1]&&cell(row.id,M.columns[i-1].id).track)||null;
    var next=(M.columns[i+1]&&cell(row.id,M.columns[i+1].id).track)||null;
    var py=prev?(TONEY[prev.tone]!=null?TONEY[prev.tone]:28):y;
    var ny=next?(TONEY[next.tone]!=null?TONEY[next.tone]:28):y;
    var a=(py+y)/2, b=(ny+y)/2;
    return '<div class="nc-track'+(col.kind==='off'?' off':'')+(dim?' dim':'')+'" data-r="'+esc(row.id)+'" data-c="'+esc(col.id)+'">'+
      '<svg viewBox="0 0 100 56" preserveAspectRatio="none">'+
        '<path d="M0 '+a+' C25 '+a+' 25 '+y+' 50 '+y+' C75 '+y+' 75 '+b+' 100 '+b+'" fill="none" '+
        'stroke="'+col2+'" stroke-width="1.8" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>'+
      '<span class="nc-dot" style="top:'+y+'px;background:'+col2+'"></span>'+
      (c.label?'<div class="nc-tlab"><b>'+esc(c.label)+'</b></div>':'')+'</div>';
  }
  var STACK=null;                /* cards in one stack before it wraps into a second column. Chosen
                                    once, so that the whole map is about the shape of the screen */
  function pickStack(){
    var sc=HOST.querySelector('.nc-scroll'), aim=Math.max(0.6,(sc.clientWidth-RAILW)/Math.max(200,sc.clientHeight-HEADH));
    var best=6, bestd=1e9, grouped=hasGroups();
    for(var st=3; st<=8; st++){
      var W=0, Ht=0;
      (M.columns||[]).forEach(function(c){ var cw=COLW;
        (M.rows||[]).forEach(function(r){ var runs={}, order=[];
          cardsOf(r.id,c.id).forEach(function(card){ var g=grouped?(card.group||card.id):'_'; if(!runs[g]){runs[g]=0;order.push(g);} runs[g]++; });
          var w=order.reduce(function(a,g){ return a+Math.ceil(runs[g]/st)*244+18; },30); if(w>cw) cw=w; });
        W+=cw; });
      (M.rows||[]).forEach(function(r){ var rh=60;
        if(r.kind==='track'){ Ht+=96; return; }
        (M.columns||[]).forEach(function(c){ var runs={};
          cardsOf(r.id,c.id).forEach(function(card){ var g=grouped?(card.group||card.id):'_'; runs[g]=(runs[g]||0)+1; });
          Object.keys(runs).forEach(function(g){ var n=runs[g], per=Math.ceil(n/Math.ceil(n/st)); rh=Math.max(rh, per*66+40); }); });
        Ht+=rh; });
      var d=Math.abs(Math.log((W/Math.max(1,Ht))/aim));
      if(d<bestd-0.05){ bestd=d; best=st; }
    }
    return best;
  }
  function stacks(list, key){
    var runs=[], cur=null, grouped=hasGroups();
    list.forEach(function(card){ var g=grouped?(card.group||('_'+card.id)):'_all';
      if(cur&&cur.g===g) cur.items.push(card); else { cur={g:g,items:[card]}; runs.push(cur); } });
    return runs.map(function(run){
      var gi=grouped?(M.groups||{})[run.g]:null, n=run.items.length, k=Math.ceil(n/STACK), per=Math.ceil(n/k), subs='';
      for(var i=0;i<k;i++) subs+='<div class="nc-sub">'+run.items.slice(i*per,(i+1)*per).map(cardHtml).join('')+'</div>';
      return '<div class="nc-stack" data-st="'+esc(key+'#'+run.g)+'">'+
        (gi?'<span class="nc-sl" title="'+esc(gi.title)+'">'+esc(gi.title)+'</span>':'')+
        (k>1?'<div class="nc-subs">'+subs+'</div>':run.items.map(cardHtml).join(''))+'</div>';
    }).join('');
  }
  function grid(){
    var cols=M.columns||[], rows=M.rows||[], h='';
    rows.forEach(function(r,ri){
      if(r.divider) h+='<div class="nc-div" data-div="'+esc(r.id)+'"><i></i></div>';
      cols.forEach(function(c,i){
        var dim=PICKING&&(!onSlide('c',c.id)||!onSlide('r',r.id));
        if(r.kind==='track'){ h+=CLOSED[r.id]
          ? '<div class="nc-cell empty'+(dim?' dim':'')+'" data-r="'+esc(r.id)+'" data-c="'+esc(c.id)+'"></div>' : trackCell(r,c,i); return; }
        var list=cardsOf(r.id,c.id);
        if(CLOSED[r.id]){
          h+='<div class="nc-cell'+(list.length?'':' empty')+(dim?' dim':'')+'" data-r="'+esc(r.id)+'" data-c="'+esc(c.id)+'">'+
             (list.length?'<span class="nc-closed">'+list.length+' '+word('item',list.length)+'</span>':'')+'</div>';
          return; }
        var plus=(EDITING&&H.onAdd&&(!H.canAdd||H.canAdd(r.id,c.id)))
          ? '<button class="nc-plus" data-add="'+esc(r.id)+'|'+esc(c.id)+'" title="Add">+</button>' : '';
        h+='<div class="nc-cell'+(c.kind==='off'?' off':'')+(list.length?'':' empty')+(dim?' dim':'')+
           '" style="--ci:'+i+';--ri:'+ri+'" data-r="'+esc(r.id)+'" data-c="'+esc(c.id)+'">'+
           (list.length?stacks(list,r.id+'|'+c.id):(cell(r.id,c.id).note?'<div class="nc-ghost">'+esc(cell(r.id,c.id).note)+'</div>':''))+plus+'</div>';
      });
    });
    return h;
  }

  /* ── measuring: where every row, column, cell and card landed, in world units ───────────────
     offsetLeft/offsetTop ignore transforms, so this is the same at any zoom. */
  function offs(el, stop){ var x=0,y=0; while(el&&el!==stop){ x+=el.offsetLeft; y+=el.offsetTop; el=el.offsetParent; }
    return {x:x,y:y}; }
  function measure(){
    var world=HOST.querySelector('.nc-world'), grid=HOST.querySelector('.nc-grid');
    var g={rows:{},cols:{},cells:{},cards:{},divs:{},W:grid.offsetWidth,H:grid.offsetHeight};
    grid.querySelectorAll('[data-r][data-c]').forEach(function(el){
      var o=offs(el,world), r=el.getAttribute('data-r'), c=el.getAttribute('data-c');
      var b={x:o.x,y:o.y,w:el.offsetWidth,h:el.offsetHeight};
      g.cells[r+'|'+c]=b;
      if(!g.rows[r]) g.rows[r]={y:b.y,h:b.h};
      if(!g.cols[c]) g.cols[c]={x:b.x,w:b.w};
    });
    grid.querySelectorAll('.nc-card').forEach(function(el){
      var o=offs(el,world), cl=el.closest('[data-r][data-c]');
      g.cards[el.getAttribute('data-card')]={x:o.x,y:o.y,w:el.offsetWidth,h:el.offsetHeight,
        cell:cl.getAttribute('data-r')+'|'+cl.getAttribute('data-c')};
    });
    g.stacks={};
    grid.querySelectorAll('.nc-stack').forEach(function(el){ var o=offs(el,world);
      g.stacks[el.getAttribute('data-st')]={x:o.x,y:o.y,w:el.offsetWidth,h:el.offsetHeight}; });
    grid.querySelectorAll('.nc-div').forEach(function(el){ g.divs[el.getAttribute('data-div')]=offs(el,world).y; });
    G=g;
  }

  /* ── the two outer levels ─────────────────────────────────────────────────────────────────── */
  function sumUp(list){ var w=0,hasW=false,a=0,m=0;
    list.forEach(function(c){ if(typeof c.weight==='number'){ w+=c.weight; hasW=true; }
      a+=(c.alerts||0); if(passes(c)) m++; });
    return {w:w,hasW:hasW,a:a,n:list.length,m:m}; }
  function alertPill(a){ return a?'<span class="nc-pill">'+a+' '+word('alert',a)+'</span>':''; }
  function overlays(){
    var o1='', o2='', mx=0;
    (M.rows||[]).forEach(function(r){ (M.columns||[]).forEach(function(c){
      var s=sumUp(cardsOf(r.id,c.id)); if(s.w>mx) mx=s.w; }); });
    (M.rows||[]).forEach(function(r){
      if(r.kind==='track'||CLOSED[r.id]) return;
      (M.columns||[]).forEach(function(c){
        var list=cardsOf(r.id,c.id), b=G.cells[r.id+'|'+c.id]; if(!list.length||!b) return;
        var s=sumUp(list), pad=6;
        var tint=s.hasW&&mx? 'rgba(110,177,209,'+(0.10+0.42*s.w/mx).toFixed(2)+')' : 'var(--accent-10)';
        o1+='<div class="nc-tile" data-zoom="'+esc(r.id+'|'+c.id)+'" data-key="'+esc(r.id+'|'+c.id)+'" data-w="'+(b.w-2*pad)+'" data-h="'+(b.h-2*pad)+'" style="--ci:'+(M.columns||[]).indexOf(c)+';left:'+(b.x+pad)+'px;top:'+(b.y+pad)+
          'px;width:'+(b.w-2*pad)+'px;height:'+(b.h-2*pad)+'px;background:'+tint+'">'+
          (s.hasW?'<span class="w">'+rn(s.w)+' '+esc(unit())+'</span>':'<span class="w">'+s.n+'</span>')+
          '<span class="c">'+(s.hasW?s.n+' ':'')+word('item',s.n)+(FILTER?' · '+s.m+' match':'')+'</span>'+alertPill(s.a)+'</div>';
        /* the middle level: one box per group, over that group's stack in this cell */
        if(!hasGroups()) return;
        var runs=[], cur=null;
        list.forEach(function(card){ var gid=card.group||('_'+card.id);
          if(cur&&cur.g===gid) cur.items.push(card); else { cur={g:gid,items:[card]}; runs.push(cur); } });
        runs.forEach(function(run){
          var sb=G.stacks[r.id+'|'+c.id+'#'+run.g]; if(!sb) return;
          var gs=sumUp(run.items), gi=(M.groups||{})[run.g];
          var title=gi?gi.title:run.items[0].title;
          o2+='<div class="nc-grp" data-zoomcard="'+esc(run.items[0].id)+'" data-key="'+esc(r.id+'|'+c.id+'#'+run.g)+'" data-w="'+(sb.w+8)+'" data-h="'+(sb.h+8)+'" style="left:'+(sb.x-4)+'px;top:'+(sb.y-4)+
            'px;width:'+(sb.w+8)+'px;height:'+(sb.h+8)+'px">'+
            '<b>'+esc(title)+'</b>'+(gi?'<span>'+gs.n+' '+word('item',gs.n)+(gs.hasW?' · '+rn(gs.w)+' '+esc(unit()):'')+
            (FILTER?' · '+gs.m+' match':'')+'</span>':'')+alertPill(gs.a)+'</div>';
        });
      });
    });
    HOST.querySelector('.nc-ov1').innerHTML=o1;
    HOST.querySelector('.nc-ov2').innerHTML=o2;
  }

  /* ── the links. Drawn once per level from the card links, so the hand-offs you see zoomed out
        are exactly the sum of the ones underneath ──────────────────────────────────────────── */
  function boxOf(id, lv){
    var cb=G.cards[id]; if(!cb) return null;
    if(lv===3) return {k:id,x:cb.x,y:cb.y,w:cb.w,h:cb.h,cell:cb.cell};
    if(lv===1){ var b=G.cells[cb.cell]; return {k:cb.cell,x:b.x+6,y:b.y+6,w:b.w-12,h:b.h-12,cell:cb.cell}; }
    var g=(M.cards[id]||{}).group||('_'+id), sb=G.stacks[cb.cell+'#'+g];
    if(!sb) return {k:id,x:cb.x,y:cb.y,w:cb.w,h:cb.h,cell:cb.cell};
    return {k:cb.cell+'#'+g,x:sb.x-4,y:sb.y-4,w:sb.w+8,h:sb.h+8,cell:cb.cell};
  }
  function curve(a,b){
    var ay=a.y+a.h/2, by=b.y+b.h/2, dy=Math.abs(by-ay);
    if(Math.abs(a.x-b.x)<2){ var bx=Math.min(70,18+dy*0.25);
      return 'M'+a.x+' '+ay+'C'+(a.x-bx)+' '+ay+' '+(b.x-bx)+' '+by+' '+(b.x-1)+' '+by; }
    if(b.x>a.x){ var x1=a.x+a.w, x2=b.x-1, k=Math.max(30,(x2-x1)*0.5);
      return 'M'+x1+' '+ay+'C'+(x1+k)+' '+ay+' '+(x2-k)+' '+by+' '+x2+' '+by; }
    return 'M'+(a.x+a.w/2)+' '+(a.y+a.h)+'C'+(a.x+a.w/2)+' '+(a.y+a.h+60)+' '+(b.x+b.w/2)+' '+(b.y-60)+' '+(b.x+b.w/2)+' '+(b.y-1);
  }
  function route(a,b){
    var ay=a.y+a.h/2, by=b.y+b.h/2, g=7;
    if(Math.abs(a.x-b.x)<2){                                     /* same column: down the left gutter */
      return 'M'+a.x+' '+ay+'H'+(a.x-g)+'V'+by+'H'+(b.x-1);
    }
    if(b.x>a.x){                                                  /* forward: through the gap between columns */
      var mx=b.x-g-1;
      return 'M'+(a.x+a.w)+' '+ay+'H'+mx+'V'+by+'H'+(b.x-1);
    }
    var my=Math.max(a.y+a.h,b.y+b.h)+10;                           /* backward: under both */
    return 'M'+a.x+' '+ay+'H'+(a.x-g)+'V'+my+'H'+(b.x-g)+'V'+by+'H'+(b.x-1);
  }
  function linksSvg(){
    var L=M.links||[]; if(!L.length&&!(EDITING&&H.onLink)) return '';
    var out='<defs>'+['s','h'].map(function(k){
      return '<marker id="ncm'+k+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.6" markerHeight="3.6" markerUnits="strokeWidth" orient="auto">'+
             '<path d="M0 0L10 5L0 10z" fill="var(--lk,var(--steel))"/></marker>';}).join('')+'</defs>';
    [1,2,3].forEach(function(lv){
      if(lv===2&&!hasGroups()){ out+='<g class="g2"></g>'; return; }
      var seen={}, parts='';
      L.forEach(function(l,i){
        if(LINKMODE==='handoffs'&&!isHandoff(l)) return;
        var a=boxOf(l.from,lv), b=boxOf(l.to,lv); if(!a||!b||a.k===b.k) return;
        var ho=isHandoff(l), key=a.k+'>'+b.k;
        if(lv<3){ if(seen[key]){ seen[key].n++; if(ho) seen[key].ho=true; return; } seen[key]={n:1,ho:ho}; }
        var d=lv===3?route(a,b):curve(a,b);
        parts+='<path class="l'+(ho?' ho':'')+(l.alerts?' pn':'')+(l.sometimes&&lv===3?' some':'')+'" data-f="'+esc(l.from)+'" data-t="'+esc(l.to)+
               '" data-k="'+esc(key)+'" data-i="'+i+'" d="'+d+'" marker-end="url(#ncm'+(ho?'h':'s')+')"/>'+
               (l.sometimes?'':'<path class="fl'+(ho?' ho':'')+(l.alerts?' pn':'')+'" data-f="'+esc(l.from)+'" data-t="'+esc(l.to)+'" data-k="'+esc(key)+'" d="'+d+'"/>');
        if(lv===3&&EDITING&&H.onLinkClick) parts+='<path class="hit" data-li="'+i+'" d="'+d+'"><title>'+
               esc((M.cards[l.from]||{}).title)+' → '+esc((M.cards[l.to]||{}).title)+'</title></path>';
      });
      if(lv<3) parts=parts.replace(/data-k="([^"]*)"/g,function(m0,k){ var x=seen[k.replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"')];
        return m0+(x&&x.n>1?' style="stroke-width:calc('+Math.min(3.2,1.4+x.n*0.45).toFixed(1)+'px*var(--inv))"':''); });
      out+='<g class="g'+lv+'">'+parts+'</g>';
    });
    OUTER=(out.match(/class="g1">([\s\S]*?)<\/g>/)||['',''])[1].split('<path class="l').length-1;
    return out+'<path class="tmp" id="nctmp" d="" style="display:none"/>';
  }

  /* ── the rail and the heads: positioned from the measured geometry and the view ─────────── */
  function railHtml(){
    var h='';
    (M.rows||[]).forEach(function(row,i){
      var g=G.rows[row.id]; if(!g) return;
      if(row.divider&&G.divs[row.id]!=null)
        h+='<div class="nc-divl" data-divy="'+G.divs[row.id]+'">'+esc(row.divider)+'</div>';
      var dim=PICKING&&!onSlide('r',row.id);
      var mv=(EDITING&&H.onMoveRow&&row.kind!=='track'&&!row.fixed)?'<span class="nc-mv">'+
          '<button data-mv="'+esc(row.id)+'|-1" title="Move up" aria-label="Move up"'+(i?'':' disabled')+'>&#9650;</button>'+
          '<button data-mv="'+esc(row.id)+'|1" title="Move down" aria-label="Move down">&#9660;</button></span>':'';
      h+='<div class="nc-rail'+(row.accent?' acc':'')+(CLOSED[row.id]?' closed':'')+(dim?' dim':'')+
        '" data-row="'+esc(row.id)+'" data-ry="'+g.y+'" data-rh="'+g.h+'"'+(row.accent?' style="--rc:'+row.accent+'"':'')+'>'+
        mv+icon(row.icon)+'<span class="nm"><b>'+esc(row.label)+'</b>'+(row.sub?'<em>'+esc(row.sub)+'</em>':'')+'</span>'+
        (row.count!=null?'<span class="cnt">'+row.count+'</span>':'')+CHEV+
        '<span class="nc-pk'+(onSlide('r',row.id)?' on':'')+'" data-pk="r:'+esc(row.id)+'">'+TICK+'</span></div>';
    });
    if(EDITING&&H.onAddRow) h+='<button class="nc-addrow" data-ry="'+G.H+'">+ '+esc(M.addRowLabel||'Add a row')+'</button>';
    return h;
  }
  function headHtml(){
    return (M.columns||[]).map(function(c){
      var g=G.cols[c.id]; if(!g) return '';
      var dim=PICKING&&!onSlide('c',c.id);
      return '<div class="nc-colh'+(c.kind==='off'?' off':'')+(dim?' dim':'')+'" data-col="'+esc(c.id)+
        '" data-cx="'+g.x+'" data-cw="'+g.w+'" title="'+esc(c.label)+'">'+
        (c.tag?'<span class="t">'+esc(c.tag)+'</span>':'')+'<b>'+esc(c.label)+'</b>'+
        (c.sub?'<em>'+esc(c.sub)+'</em>':'')+
        '<span class="nc-pk'+(onSlide('c',c.id)?' on':'')+'" data-pk="c:'+esc(c.id)+'">'+TICK+'</span></div>';
    }).join('');
  }

  /* ── the view ─────────────────────────────────────────────────────────────────────────────── */
  function vp(){ var sc=HOST.querySelector('.nc-scroll');
    return {w:Math.max(80,sc.clientWidth-RAILW), h:Math.max(80,sc.clientHeight-HEADH)}; }
  function levelFor(s){ if(s>=0.78) return 3; if(s>=0.4&&hasGroups()) return 2; return s>=0.7&&!hasGroups()?3:1; }
  function place(){
    if(!G||!V) return;
    var world=HOST.querySelector('.nc-world'), s=V.s;
    world.style.transform='translate('+V.tx+'px,'+V.ty+'px) scale('+s+')';
    world.style.setProperty('--inv',(1/s).toFixed(4));
    var lv=levelFor(s);
    if(lv!==LV){ LV=lv; }
    var sc=HOST.querySelector('.nc-scroll');
    sc.classList.remove('nc-lv1','nc-lv2','nc-lv3'); sc.classList.add('nc-lv'+LV);
    HOST.querySelectorAll('.nc-rail').forEach(function(el){
      var y=+el.getAttribute('data-ry'), h=+el.getAttribute('data-rh');
      var top=V.ty+y*s, hh=h*s;
      el.style.top=top+'px'; el.style.height=Math.max(0,hh)+'px';
      el.classList.toggle('thin', hh<54);
      el.style.display=(top>sc.clientHeight||top+hh<-4||hh<9)?'none':'flex';
    });
    HOST.querySelectorAll('.nc-divl').forEach(function(el){
      var top=V.ty+(+el.getAttribute('data-divy'))*s-10; el.style.top=top+'px';
      el.style.display=(top<-20||top>sc.clientHeight)?'none':'block'; });
    var ar=HOST.querySelector('.nc-addrow');
    if(ar) ar.style.top=(V.ty+(+ar.getAttribute('data-ry'))*s+10)+'px';
    HOST.querySelectorAll('.nc-colh').forEach(function(el){
      var x=+el.getAttribute('data-cx'), w=+el.getAttribute('data-cw');
      el.style.left=(V.tx+x*s)+'px'; el.style.width=(w*s)+'px';
      el.classList.toggle('narrow', w*s<150);
    });
    if(LV<3) HOST.querySelectorAll(LV===1?'.nc-tile':'.nc-grp').forEach(function(el){
      var hs=(+el.getAttribute('data-h'))*s, ws=(+el.getAttribute('data-w'))*s;
      el.classList.toggle('xs', hs<40||ws<56); el.classList.toggle('sm', hs<72||ws<120); });
    var cb=HOST.querySelector('#ncall-links'); if(cb) cb.style.display=((OUTER>24||M.outerLinks==='hover')&&LV<3)?'':'none';
    var lb=HOST.querySelector('.nc-hint');
    if(lb) lb.innerHTML='Showing <b>'+esc(levelName(LV===2&&!hasGroups()?3:LV))+'</b> · '+Math.round(s*100)+'%'+
      ' &nbsp;·&nbsp; drag to move · '+(navigator.platform&&/Mac/.test(navigator.platform)?'⌘':'Ctrl')+' + scroll to zoom';
    var cl=HOST.querySelector('.nc-clip'), gs=26*s; while(gs<14) gs*=2; while(gs>52) gs/=2;
    cl.style.backgroundSize=gs+'px '+gs+'px'; cl.style.backgroundPosition=(V.tx%gs)+'px '+(V.ty%gs)+'px';
  }
  function clamp(){
    var p=vp(), s=V.s, W=G.W*s, Hh=G.H*s, m=60;
    V.tx=Math.min(m, Math.max(p.w-W-m, V.tx)); if(W<p.w) V.tx=Math.min(Math.max(V.tx,0), p.w-W);
    V.ty=Math.min(m, Math.max(p.h-Hh-m, V.ty)); if(Hh<p.h) V.ty=Math.min(Math.max(V.ty,0), p.h-Hh);
  }
  /* the camera glides between views when motion is on: centre and zoom are interpolated in
     log-space, so a zoom feels like flying in rather than a picture being stretched */
  function animTo(t, ms){
    if(ANIM){ cancelAnimationFrame(ANIM.raf); ANIM=null; }
    if(!MOTION||!V){ V=t; clamp(); place(); return; }
    var p=vp(), a={s:V.s, cx:(p.w/2-V.tx)/V.s, cy:(p.h/2-V.ty)/V.s},
        b={s:t.s, cx:(p.w/2-t.tx)/t.s, cy:(p.h/2-t.ty)/t.s}, t0=performance.now(), D=ms||560;
    function ease(x){ return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
    function step(now){
      var k=Math.min(1,(now-t0)/D), e=ease(k);
      var s=Math.exp(Math.log(a.s)+(Math.log(b.s)-Math.log(a.s))*e);
      var cx=a.cx+(b.cx-a.cx)*e, cy=a.cy+(b.cy-a.cy)*e;
      V={s:s, tx:p.w/2-cx*s, ty:p.h/2-cy*s}; place();
      if(k<1) ANIM={raf:requestAnimationFrame(step)}; else { ANIM=null; V=t; clamp(); place(); }
    }
    ANIM={raf:requestAnimationFrame(step)};
  }
  function stopAnim(){ if(ANIM){ cancelAnimationFrame(ANIM.raf); ANIM=null; } }
  function zoomAt(ns, ax, ay){
    ns=Math.max(ZMIN,Math.min(ZMAX,ns));
    var p=vp(); if(ax==null){ ax=p.w/2; ay=p.h/2; }
    V.tx=ax-(ax-V.tx)*ns/V.s; V.ty=ay-(ay-V.ty)*ns/V.s; V.s=ns; clamp(); place();
  }
  function fitView(){
    var p=vp(), s=Math.max(ZMIN,Math.min(1, (p.w-24)/G.W, (p.h-24)/G.H));
    return {s:s, tx:Math.max(12,(p.w-G.W*s)/2), ty:12};
  }
  function fit(animate){
    if(!G) return;
    if(animate&&V) animTo(fitView()); else { V=fitView(); place(); }
  }
  function rectView(b, minS, maxS){
    var p=vp(), s=Math.min(maxS||ZMAX, Math.max(minS||0, Math.min((p.w-60)/b.w, (p.h-60)/b.h)));
    var t={s:s, tx:p.w/2-(b.x+b.w/2)*s, ty:p.h/2-(b.y+b.h/2)*s};
    var keep=V; V=t; clamp(); t=V; V=keep; return t;
  }
  function zoomToRect(b, minS, maxS){ animTo(rectView(b, minS, maxS)); }
  function focusCard(id, ms){
    if(!G||!G.cards[id]) return; var b=G.cards[id];
    var s=Math.max(0.95, Math.min(1.1, V?V.s:1)), p=vp();
    var t={s:s, tx:p.w/2-(b.x+b.w/2)*s, ty:p.h/2-(b.y+b.h/2)*s};
    var keep=V; V=t; clamp(); t=V; V=keep||t; animTo(t, ms);
  }

  function zoomStep(f){
    var p=vp(), ns=Math.max(ZMIN,Math.min(ZMAX,V.s*f)), ax=p.w/2, ay=p.h/2;
    var t={s:ns, tx:ax-(ax-V.tx)*ns/V.s, ty:ay-(ay-V.ty)*ns/V.s};
    var keep=V; V=t; clamp(); t=V; V=keep; animTo(t, 360);
  }
  function setMotion(v){
    MOTION=!!v; try{ localStorage.setItem('nr_motion', MOTION?'1':'0'); }catch(_){}
    if(!HOST) return;
    HOST.querySelector('.nc-scroll').classList.toggle('nc-motion', MOTION);
    paintBar(); bind(); linkMode(); place();
  }

  /* ── RUN YOUR END-TO-END PROCESS ────────────────────────────────────────────────────────────
     A walk along the links: from the first activity nothing leads into, along the usual path
     (an "only sometimes" link is named, not taken), then whatever runs alongside it. The camera
     follows the work, a hand-off says who passed it on, and the pain points are read out where
     they sit. It reads the same links the map draws, so it can never tell a different story. */
  function rowOf(id){ var cb=G&&G.cards[id]; if(!cb) return null; var rid=cb.cell.split('|')[0];
    return (M.rows||[]).filter(function(r){ return r.id===rid; })[0]||null; }
  function runSteps(){
    var L=M.links||[], out={}, inn={}, order=[], pos={};
    L.forEach(function(l){ if(!M.cards[l.from]||!M.cards[l.to]) return;
      (out[l.from]=out[l.from]||[]).push(l); inn[l.to]=(inn[l.to]||0)+1; });
    (M.columns||[]).forEach(function(c){ (M.rows||[]).forEach(function(r){
      ((cell(r.id,c.id).cards)||[]).forEach(function(id){ pos[id]=order.length; order.push(id); }); }); });
    var seen={}, steps=[];
    function walk(id, via, aside){
      var first=true;
      while(id&&!seen[id]){
        seen[id]=1;
        var st={id:id, via:via, aside:aside&&first, branches:[]}; steps.push(st); first=false;
        var nx=(out[id]||[]).filter(function(l){ return !seen[l.to]; });
        var main=nx.filter(function(l){ return !l.sometimes; });
        var pick=(main.length?main:[]).sort(function(a,b){ return pos[a.to]-pos[b.to]; })[0];
        st.branches=(out[id]||[]).filter(function(l){ return l.sometimes; });
        if(!pick) break; via=pick; id=pick.to;
      }
    }
    var starts=order.filter(function(id){ return out[id]&&!inn[id]; });
    if(!starts.length){ var f=order.filter(function(id){ return out[id]; })[0]; if(f) starts=[f]; }
    starts.forEach(function(id,i){ walk(id,null,i>0); });
    for(var i=0;i<steps.length;i++) (out[steps[i].id]||[]).forEach(function(l){
      if(!l.sometimes&&!seen[l.to]) walk(l.to,l,true); });
    return steps;
  }
  function runButton(){
    var n=(M.links||[]).length?runSteps().length:0;
    var R=M.run||{}, sub=R.sub||('Follow the work from the first '+word('item',1)+' to the last, '+n+' moves across the map');
    if(TWIN){ var sr=HOST.querySelector('.nc-siderun');
      sr.innerHTML=n<2?'':'<button class="nc-runbtn"><span class="ic2">&#9654;</span><span><b>'+
        esc(R.title||'Run your end-to-end process')+'</b><small>'+esc(sub)+'</small></span></button>';
      return; }
    if(n<2) return;
    var c=HOST.querySelector('.nc-corner');
    c.classList.add('run');
    c.innerHTML='<button class="nc-runbtn" title="'+esc(R.sub||('Follow the work from the first '+word('item',1)+' to the last, '+n+' moves across the map'))+'">'+
      '<span class="ic2">&#9654;</span><b>'+esc(R.title||'Run your end-to-end process')+'</b></button>';
  }
  function runStart(){
    var steps=runSteps(); if(steps.length<2) return;
    closeDetail();
    RUN={steps:steps, i:0, playing:true, timer:null};
    HOST.querySelector('.nc-scroll').classList.add('nc-running');
    runGo(0);
  }
  function runStop(){
    if(!RUN) return; clearTimeout(RUN.timer); RUN=null;
    var sc=HOST.querySelector('.nc-scroll'); sc.classList.remove('nc-running');
    HOST.querySelectorAll('.nc-card.now,.nc-card.seen').forEach(function(c){ c.classList.remove('now','seen'); });
    HOST.querySelectorAll('.nc-lk path.run,.nc-lk path.runnow').forEach(function(p){ p.classList.remove('run','runnow'); });
  }
  function runPlay(on){
    if(!RUN) return; RUN.playing=!!on; clearTimeout(RUN.timer);
    var b=HOST.querySelector('[data-run="play"]'); if(b) b.textContent=on?'Pause':'Play';
    if(on){ if(RUN.i>=RUN.steps.length) runGo(0); else RUN.timer=setTimeout(function(){ runGo(RUN.i+1); }, 2900); }
  }
  function runPaint(){
    var R=RUN, steps=R.steps, i=R.i, done=i>=steps.length;
    HOST.querySelectorAll('.nc-card').forEach(function(c){ c.classList.remove('now','seen'); });
    HOST.querySelectorAll('.nc-lk path.run,.nc-lk path.runnow').forEach(function(p){ p.classList.remove('run','runnow'); });
    var lit={};
    steps.forEach(function(st,k){ if(k>i&&!done) return;
      var el=HOST.querySelector('.nc-card[data-card="'+cssq(st.id)+'"]');
      if(el) el.classList.add(k===i?'now':'seen');
      if(st.via) lit[(M.links||[]).indexOf(st.via)]=(k===i?'runnow':'run'); });
    HOST.querySelectorAll('.nc-lk .g3 path.l').forEach(function(p){
      var c=lit[+p.getAttribute('data-i')]; if(!c) return; p.classList.add('run');
      if(c==='runnow'){ try{ p.style.setProperty('--len', Math.ceil(p.getTotalLength())); }catch(_){}
        p.classList.add('runnow'); } });
  }
  function cssq(x){ return String(x).replace(/["\\]/g,'\\$&'); }
  function runGo(i){
    if(!RUN) return; var steps=RUN.steps; clearTimeout(RUN.timer);
    RUN.i=Math.max(0,Math.min(steps.length,i));
    var done=RUN.i>=steps.length, tour=HOST.querySelector('.nc-tour');
    var sn=tour.querySelector('.sn'), tx=tour.querySelector('.tx');
    tour.querySelector('.bar2 i').style.width=(100*Math.min(RUN.i+1,steps.length)/steps.length)+'%';
    if(done){
      var teams={}, ho=0, al=0, w=0, hw=false;
      steps.forEach(function(st){ var c=M.cards[st.id]; var r=rowOf(st.id); if(r) teams[r.id]=1;
        if(st.via&&isHandoff(st.via)) ho++; al+=(c.alerts||0); if(typeof c.weight==='number'){ w+=c.weight; hw=true; } });
      var nt=Object.keys(teams).length;
      sn.textContent='END';
      tx.innerHTML='<b>End to end: '+steps.length+' '+word('item',steps.length)+', '+nt+' team'+(nt===1?'':'s')+
        ', '+ho+' hand-off'+(ho===1?'':'s')+'</b><span class="who">'+(hw?rn(w)+' '+esc(unit())+' of work on the way · ':'')+
        al+' '+word('alert',al)+' along the path</span>';
      runPaint(); animTo(fitView(), 900); runPlay(false);
      var pb=HOST.querySelector('[data-run="play"]'); if(pb) pb.textContent='Replay';
      return;
    }
    var st=steps[RUN.i], c=M.cards[st.id]||{}, r=rowOf(st.id);
    sn.textContent=('0'+(RUN.i+1)).slice(-2)+' / '+('0'+steps.length).slice(-2);
    var info=H.runInfo?H.runInfo(st.id)||{}:{};
    var who=(c.meta||(r?r.label:''))+(typeof c.weight==='number'?' · '+rn(c.weight)+' '+unit():'');
    var line='';
    if(st.aside) line+='Runs alongside the main flow · ';
    if(st.via&&isHandoff(st.via)){ var fc=M.cards[st.via.from]||{}, fr=rowOf(st.via.from);
      line+='<span class="ho">Hand-off from '+esc(fc.meta||(fr?fr.label:'another team'))+'</span> · '; }
    var pains=(info.pains||[]).map(function(p){ return '<span class="pn">'+esc(p)+'</span>'; }).join('');
    var br=st.branches.map(function(l){ return '<span class="who">Only sometimes: goes on to '+esc((M.cards[l.to]||{}).title)+'</span>'; }).join('');
    tx.innerHTML='<b>'+esc(c.title)+'</b><span class="who">'+line+esc(who)+'</span>'+pains+br;
    runPaint(); focusCard(st.id, 700);
    if(RUN.playing){ var pb2=HOST.querySelector('[data-run="play"]'); if(pb2) pb2.textContent='Pause';
      RUN.timer=setTimeout(function(){ runGo(RUN.i+1); }, 2900+(pains?900:0)); }
  }

  /* ── drawing ──────────────────────────────────────────────────────────────────────────────── */
  function draw(){
    var cols=M.columns||[];
    paintBar();
    var sc=HOST.querySelector('.nc-scroll');
    HOST.classList.toggle('nc-light', LIGHT);
    sc.classList.toggle('nc-editing',EDITING); sc.classList.toggle('nc-canlink',!!H.onLink);
    var grid=HOST.querySelector('.nc-grid');
    grid.style.gridTemplateColumns='repeat('+cols.length+',minmax('+COLW+'px,max-content))';
    if(!STACK||!V) STACK=pickStack();
    grid.innerHTML=grid_safe();
    measure();
    overlays();
    var lk=HOST.querySelector('.nc-lk');
    lk.setAttribute('width',G.W); lk.setAttribute('height',G.H); lk.innerHTML=linksSvg();
    HOST.querySelector('.nc-railov').innerHTML=railHtml();
    HOST.querySelector('.nc-headov').innerHTML=headHtml();
    HOST.querySelector('.nc-corner').innerHTML=(M.cornerTitle?'<b>'+esc(M.cornerTitle)+'</b>':'')+
          (M.cornerSub?'<span>'+esc(M.cornerSub)+'</span>':'');
    HOST.querySelector('.nc-corner').classList.remove('run');
    var first=!V;
    if(!V) fit(); else { clamp(); place(); }
    sc.classList.toggle('nc-motion', MOTION);
    if(first&&MOTION&&!ENTERED){ ENTERED=true; sc.classList.add('nc-enter');
      setTimeout(function(){ sc.classList.remove('nc-enter'); }, 1900); }
    linkMode();
    runButton();
    if(RUN) runPaint();
    bind();
    pickbar();
  }
  /* a few connections are always drawn; past two dozen, zoomed out, they are drawn for the box
     you point at - the rest is a tangle that says nothing - and a chip shows them all */
  function linkMode(){
    var busy=OUTER>24||M.outerLinks==='hover', all=SHOWALL==null?!busy:SHOWALL, b=HOST.querySelector('#ncall-links');
    HOST.querySelector('.nc-scroll').classList.toggle('nc-hoverlinks', !all);
    if(b){ b.style.display=(busy&&LV<3)?'':'none'; b.classList.toggle('on',all);
      b.textContent=all?'All connections shown':'Show all connections';
      b.onclick=function(){ SHOWALL=!all; linkMode(); }; }
  }
  function grid_safe(){ try{ return grid(); }catch(e){ console.error(e); return ''; } }

  function bind(){
    HOST.querySelectorAll('.nc-chip[data-flag]').forEach(function(b){
      b.onclick=function(){ FILTER=b.getAttribute('data-flag')||null; draw(); };});
    var mo=HOST.querySelector('#ncmotion');
    if(mo) mo.onclick=function(){ setMotion(!MOTION); };
    HOST.querySelectorAll('[data-thm]').forEach(function(b){
      b.onclick=function(){ setTheme(b.getAttribute('data-thm')==='light'); };});
  }
  function setTheme(v){
    LIGHT=!!v; try{ localStorage.setItem('nr_theme', LIGHT?'light':'dark'); }catch(_){}
    if(!HOST) return;
    HOST.classList.toggle('nc-light', LIGHT); paintBar(); bind(); linkMode();
  }

  /* one set of listeners per host, wired at mount: the grid inside is redrawn, the frame is not */
  function wire(){
    var sc=HOST.querySelector('.nc-scroll');
    function local(e){ var r=HOST.querySelector('.nc-clip').getBoundingClientRect();
      return {x:e.clientX-r.left, y:e.clientY-r.top}; }
    function worldPt(e){ var p=local(e); return {x:(p.x-V.tx)/V.s, y:(p.y-V.ty)/V.s}; }

    sc.addEventListener('pointerdown',function(e){
      if(e.button!==0) return;
      var hd=e.target.closest('.nc-hd');
      if(hd&&EDITING&&H.onLink){ e.preventDefault(); e.stopPropagation();
        LINKDRAG={from:hd.getAttribute('data-hd')}; sc.setPointerCapture(e.pointerId); return; }
      if(e.target.closest('button,.nc-pk,input,select,textarea,a,.nc-tour,.nc-zoomctl')) return;
      stopAnim(); DRAG={x:e.clientX,y:e.clientY,tx:V.tx,ty:V.ty,id:e.pointerId}; MOVED=false;
    });
    sc.addEventListener('pointermove',function(e){
      if(LINKDRAG){
        var a=G.cards[LINKDRAG.from], p=worldPt(e), t=HOST.querySelector('#nctmp');
        if(a&&t){ t.style.display=''; t.setAttribute('d','M'+(a.x+a.w)+' '+(a.y+a.h/2)+'L'+p.x+' '+p.y); }
        HOST.querySelectorAll('.droptarget').forEach(function(x){x.classList.remove('droptarget');});
        var el=document.elementFromPoint(e.clientX,e.clientY), c=el&&el.closest('.nc-card');
        if(c&&c.getAttribute('data-card')!==LINKDRAG.from) c.classList.add('droptarget');
        return; }
      if(!DRAG) return;
      var dx=e.clientX-DRAG.x, dy=e.clientY-DRAG.y;
      if(!MOVED&&Math.abs(dx)+Math.abs(dy)>4){ MOVED=true; sc.classList.add('grabbing');
        try{ sc.setPointerCapture(DRAG.id); }catch(_){} }
      if(MOVED){ V.tx=DRAG.tx+dx; V.ty=DRAG.ty+dy; clamp(); place(); }
    });
    function end(e){
      if(LINKDRAG){
        var el=document.elementFromPoint(e.clientX,e.clientY), c=el&&el.closest('.nc-card'), from=LINKDRAG.from;
        LINKDRAG=null; var t=HOST.querySelector('#nctmp'); if(t) t.style.display='none';
        HOST.querySelectorAll('.droptarget').forEach(function(x){x.classList.remove('droptarget');});
        MOVED=false;
        if(c&&c.getAttribute('data-card')!==from) H.onLink(from, c.getAttribute('data-card'));
        return; }
      DRAG=null; sc.classList.remove('grabbing');
    }
    sc.addEventListener('pointerup',end); sc.addEventListener('pointercancel',end);
    sc.addEventListener('wheel',function(e){
      e.preventDefault(); stopAnim();
      if(e.ctrlKey||e.metaKey){ var p=local(e); zoomAt(V.s*Math.pow(1.0018,-e.deltaY), p.x, p.y); }
      else { V.tx-=e.deltaX; V.ty-=e.deltaY; clamp(); place(); }
    },{passive:false});
    sc.addEventListener('dblclick',function(e){
      if(e.target.closest('.nc-card,button,.nc-rail,.nc-colh')) return;
      var p=local(e); zoomAt(V.s*1.6, p.x, p.y); });
    sc.addEventListener('mouseover',function(e){
      var bx=e.target.closest('.nc-tile,.nc-grp');
      if(bx&&LV<3){ var key=bx.getAttribute('data-key'), any2=false;
        HOST.querySelectorAll('.nc-lk .g'+LV+' path.l,.nc-lk .g'+LV+' path.fl').forEach(function(p){
          var k=p.getAttribute('data-k')||'', hot=k.indexOf(key+'>')===0||k.slice(-(key.length+1))==='>'+key;
          p.classList.toggle('hot',hot); if(hot) any2=true; });
        sc.classList.toggle('nc-focus',any2); return; }
      var c=e.target.closest('.nc-card'); if(!c||LV!==3) return;
      var id=c.getAttribute('data-card'), any=false;
      HOST.querySelectorAll('.nc-lk .g3 path.l,.nc-lk .g3 path.fl').forEach(function(p){
        var hot=p.getAttribute('data-f')===id||p.getAttribute('data-t')===id; p.classList.toggle('hot',hot); if(hot) any=true; });
      sc.classList.toggle('nc-focus',any);
    });
    sc.addEventListener('mouseout',function(e){
      var c=e.target.closest('.nc-card,.nc-tile,.nc-grp'); if(!c) return;
      if(e.relatedTarget&&c.contains(e.relatedTarget)) return;
      sc.classList.remove('nc-focus'); });

    /* clicks: one delegate, because the grid is redrawn on every edit */
    HOST.addEventListener('click',function(e){
      var t=e.target;
      var zc=t.closest('[data-zc]');
      if(zc){ var z=zc.getAttribute('data-zc');
        if(z==='fit') fit(true); else zoomStep(z==='in'?1.4:1/1.4); return; }
      var rb=t.closest('[data-run]');
      if(rb){ var a=rb.getAttribute('data-run');
        if(a==='next') runGo(RUN.i+1); else if(a==='prev') runGo(RUN.i-1);
        else if(a==='play') runPlay(!RUN.playing); else runStop(); return; }

  function closeDetail(){

  /* ── the slide picker ─────────────────────────────────────────────────────────────────────── */
  function pickbar(){
    var el=document.getElementById('ncbar'); if(!el) return;
    var s=M.slide||{rows:[],cols:[]};
    var n=0;
    (M.rows||[]).forEach(function(r){ if(s.rows.indexOf(r.id)<0) return;
      (M.columns||[]).forEach(function(c){ if(s.cols.indexOf(c.id)<0) return;
        n+=cardsOf(r.id,c.id).length; }); });
    var total=Object.keys(M.cards||{}).length;

      return '<span class="warn">'+w+'</span>';}).join('');

  function preview(){

  /* ── undo and discard for UNSENT changes (editable-deliverable.md, "Undo and discard") ──

  var NRH={base:null, steps:[], restoring:false};
  function nrClone(o){ return JSON.parse(JSON.stringify(o)); }
  function nrHistStart(n,km){ NRH.base={n:n||0, km:km==null?null:km, data:nrClone(DATA)}; NRH.steps=[]; }
  function nrHistTop(){ return NRH.steps.length?NRH.steps[NRH.steps.length-1]:NRH.base; }
  function nrHistStep(n, km, label){
    if(NRH.restoring||!NRH.base) return;
    var t=nrHistTop(); km=km==null?null:km;

  /* ---- local view updates. A PREVIEW - the authoritative projection is redone on apply. ---- */
  function taskById(id){ return (DATA.hl.activities||[]).filter(function(t){return t.id===id;})[0]; }

  // An activity belongs to an ACTIVITY BLOCK, and the block is what sits in a key process. So "move it to
  // another phase" really means "re-home it under an activity that lives there". There is no such
  // a bare key process is not enough - we must know which block receives it, and only the
  // consultant can say. Hence the picker when the phase has more than one candidate.
  function actsInPhase(phaseName, laneName){
    var all=(DATA.hl.activityBlocks||[]).filter(function(a){return a.phase===phaseName;});
    var mine=all.filter(function(a){return (a.lanes||[]).indexOf(laneName)>=0;});
    return {mine:mine, all:all};
  }

  function moveTask(id, laneName, phaseName){
    var t=taskById(id); if(!t) return;
    var lane = laneName || t.lane;
    var phase = phaseName || t.stage;
    if(t.lane===lane && t.stage===phase) return;

    if(phase===t.stage){ applyMove(t, lane, null); return; }          // same phase: actor only

    var c=actsInPhase(phase, lane);
    var cand = c.mine.length ? c.mine : c.all;
    if(!cand.length){
      wmsg('"'+phase+'" has no activity yet - create one before moving work into it.');
      return;
    }
    if(cand.length===1){ applyMove(t, lane, cand[0]); return; }
    pickActivity(t, lane, phase, c);                                   // ambiguous -> ask
  }

  function applyMove(t, lane, act){
    if((DATA.hl.lanes||[]).indexOf(lane)<0) DATA.hl.lanes.push(lane);  // a brand-new lane
    var ch={};
    if(t.lane!==lane){ t.lane=lane; ch.actorName=lane; }
    if(act && act.blockId!==t.blockId){
      t.blockId=act.blockId; t.activity=act.name; t.stage=act.phase;
      ch.blockId=act.blockId;      // an EXISTING id, straight from the baseline - never minted here
    }
    if(!Object.keys(ch).length) return;
    // The FTE transfer between allocations is done by apply_delta, in Python, where the baseline is.
    pushOp({op:'update', coll:'activities', id:t.id, changes:ch});
    reboot();
  }

  function pickActivity(t, lane, phase, c){
    var w=document.getElementById('apick'); if(!w) return;
    var h='<div class="apk-h">'+(t.__newTask?'Add a step to':'Move <b>'+esc(t.name)+'</b> to')+
          ' <b>'+esc(phase)+'</b></div>'+
          '<div class="apk-s">Which activity block does it belong to? An activity has no key process of its own — '+
          'it lives inside an activity, and the activity is what sits in a phase.</div>';
    function row(a,own){
      return '<button class="apk-r" data-act="'+esc(a.blockId)+'">'+
             '<span class="apk-n">'+esc(a.name)+'</span>'+
             '<span class="apk-m">'+(own?'already done by '+esc(lane):'<i>'+esc(lane)+' joins as a participant</i>')+'</span></button>';
    }
    if(c.mine.length) h+='<div class="apk-g">'+c.mine.map(function(a){return row(a,true);}).join('')+'</div>';
    var others=c.all.filter(function(a){return c.mine.indexOf(a)<0;});
    if(others.length) h+='<div class="apk-lbl">Other activities in this phase</div><div class="apk-g">'+
                         others.map(function(a){return row(a,false);}).join('')+'</div>';
    h+='<button class="apk-x" id="apk-cancel">Cancel</button>';

        w.classList.remove('on');

        else applyMove(t, lane, a);

  }
  function editTask(id, ch){
    var t=taskById(id); if(!t) return;
    if('name' in ch) t.name=ch.name;
    if('system' in ch) t.system=ch.system;
    if('fte' in ch) t.fte = (ch.fte===''||ch.fte==null)?null:+ch.fte;

    reboot();

  function addPain(id, p){

             magnitude:p.magnitude||null, dimension:p.dimension||null};
    if(p.handoffTo) rec.handoffTo=p.handoffTo;    // a pain that sits on the hand-off to that activity

  function nextBlockId(ph,id){
    var L=(DATA.hl.activityBlocks||[]).filter(function(b){return b.phase===ph;});
    var i=L.map(function(b){return b.blockId;}).indexOf(id);
    return (i>=0&&i+1<L.length)?L[i+1].blockId:null; }
  /* Moving a block moves everything that hangs off it, on every tab: an activity has no key
     process of its own, it inherits its block's, so its swimlane cell, its pain points and its
     timeline cell all go with it. The delta carries the block's new key process and the new order
     of the blocks there; apply_delta writes both, and every projection sorts blocks the same way
     (baseline_io.block_order), so the MAE and the other views follow. */
  function moveBlock(id, ph, beforeId){
    var B=DATA.hl.activityBlocks||[], b=B.filter(function(x){return x.blockId===id;})[0];
    if(!b||beforeId===id) return;
    var P=DATA.hl.processes||[], toPh=(DATA.processes||[]).filter(function(x){return x.name===ph;})[0];
    if(!toPh){ wmsg('"'+ph+'" is not in the baseline yet. Send the change that adds it first, then move blocks into it.'); return; }
    var before=B.filter(function(x){return x.phase===ph;}).map(function(x){return x.blockId;});
    var L=B.filter(function(x){return x.phase===ph && x.blockId!==id;});
    var at=beforeId?L.map(function(x){return x.blockId;}).indexOf(beforeId):-1;
    if(at<0) L.push(b); else L.splice(at,0,b);
    var moved=b.phase!==ph;
    if(!moved && L.map(function(x){return x.blockId;}).join('|')===before.join('|')) return;   // dropped where it was
    if(moved){
      var mine={}; (b.activities||[]).forEach(function(t){ mine[t.id]=1; });
      b.phase=ph;
      (DATA.hl.activities||[]).forEach(function(t){ if(t.blockId===id) t.stage=ph; });
      (b.activities||[]).forEach(function(t){ t.stage=ph; });
      ((DATA.detail||{}).cells||[]).forEach(function(c){ if(mine[c.activityId]) c.phase=ph; });
      pushOp({op:'update', coll:'activityBlocks', id:id, changes:{processId:toPh.id}});
    }
    L.forEach(function(x,i){ var o=i+1;
      if(x.order!==o){ x.order=o; if(x.blockId) pushOp({op:'update', coll:'activityBlocks', id:x.blockId, changes:{order:o}}); } });
    // the page's own lists in the new order, so every tab redraws the same way
    var nb=[]; P.forEach(function(p){ (p===ph?L:B.filter(function(x){return x.phase===p;})).forEach(function(x){ nb.push(x); }); });
    B.forEach(function(x){ if(nb.indexOf(x)<0) nb.push(x); });
    DATA.hl.activityBlocks=nb;
    var bi={}; nb.forEach(function(x,i){ bi[x.blockId]=i; });
    (DATA.hl.activities||[]).sort(function(x,y){
      var d=P.indexOf(x.stage)-P.indexOf(y.stage); if(d) return d;
      d=(bi[x.blockId]==null?999:bi[x.blockId])-(bi[y.blockId]==null?999:bi[y.blockId]); if(d) return d;
      return (x.order==null?999:x.order)-(y.order==null?999:y.order); });
    reboot();
    wmsg(moved?('"'+b.name+'" moved to '+ph+', with its activities.'):('"'+b.name+'" reordered within '+ph+'.'));
  }
  function reorderPhase(from,to){
    var P=DATA.hl.processes||[]; if(from===to||from<0||to<0||from>=P.length||to>=P.length) return;
    var nm=P.splice(from,1)[0]; P.splice(to,0,nm);
    // the phase list in DATA.processes carries the IDs the baseline needs
    (DATA.processes||[]).sort(function(x,y){ return P.indexOf(x.name)-P.indexOf(y.name); });
    (DATA.processes||[]).forEach(function(ph,i){
      var o=i+1;
      if(ph.order!==o){ ph.order=o; pushOp({op:'update', coll:'processes', id:ph.id, changes:{order:o}}); }
    });
    (DATA.hl.activityBlocks||[]).sort(function(x,y){ return P.indexOf(x.phase)-P.indexOf(y.phase); });
    reboot();
  }
  function reorderLane(from,to){
    var L=DATA.hl.lanes||[]; if(from===to||from<0||to<0||from>=L.length||to>=L.length) return;
    var nm=L.splice(from,1)[0]; L.splice(to,0,nm);
    (DATA.actors||[]).forEach(function(a){
      var i=L.indexOf(a.name);
      if(i>=0 && a.order!==i){ a.order=i; pushOp({op:'update', coll:'actors', id:a.id, changes:{order:i}}); }
    });
    reboot();
  }
  function retireTask(id){

    });

    reboot();
  }

    var laneOpts=actorOpts(all, t.lane);
    var phOpts=(DATA.hl.processes||[]).map(function(ph){
      return '<option value="'+esc(ph)+'"'+(ph===t.stage?' selected':'')+'>'+esc(ph)+'</option>';}).join('');

      return Object.keys(seen).sort().map(function(k){return {key:k,label:k};});
