<!doctype html>
<!-- ============================================================================
  RACI DIAGNOSTIC — editable artifact (house standard, editable-deliverable.md).
  ONE source with edit fences. The build step strips ... and
  ... blocks to produce TEMPLATE.html (client, 0 edit
  refs — the file you SEND). Kept whole, this is TEMPLATE.WORKING.html (editable,
  NEVER sent) — used both for the live workshop capture and any later touch-up.
  Locked by default. Unlock to click a cell (role x activity) and edit its
  R/A/C/I letters + note in the sidebar, click the title to edit the action
  title, or add a process / activity / role. Anti-pattern flags (no accountable,
  split accountability, no responsible, bottleneck consulted) recompute live
  from the same rule engine in both the matrix hover and the Findings section.
  Export produces the full updated capture, handed back to Claude — RACI owns
  its own data outright (no shared baseline), so there is no delta/gate step.
  Brand chrome inlined from templates/brand.css + editable-deliverable.md.
============================================================================ -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RACI diagnostic</title>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}
  #art{--navy:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;
      --slate-10:rgba(54,65,86,.09);--navy-10:rgba(11,35,71,.10);--green-10:rgba(28,122,74,.10);--accent-10:rgba(110,177,209,.14);
      --rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;
      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;--navy-fill:#0B2347;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:22px 40px 12px 98px}
  #art[data-t="dark"]{--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--navy-fill:#243246;--accent:#8FC7E8}
  body:has(#art[data-t="dark"]){--page:#0E1620}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;
          gap:14px 18px;flex-wrap:wrap;margin:0 0 18px -98px;flex:none}
  .tags{display:flex;align-items:center;gap:11px;min-width:0;flex-wrap:wrap;row-gap:8px}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)}
  .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:var(--t-micro);letter-spacing:.8px;
            padding:9px 16px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
  /* The process filter, on the canonical .nr-select component (brand.css). Copied, not
     re-invented: if a widget recurs it belongs in the brand layer. */
  .selwrap{position:relative}
  .nr-select{box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:8px;
             padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);
             font:inherit;font-size:var(--t-micro);font-weight:700;color:var(--ink);cursor:pointer;
             text-align:left;min-width:168px;max-width:34vw}
  .nr-select:hover{border-color:var(--accent)}
  .nr-select.on,.nr-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-10)}
  .nr-select .lab{display:block;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .nr-select .chev{color:var(--mut);flex:none;display:flex}
  .nr-select .chev svg{width:13px;height:13px;display:block}
  .nr-select-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:100%;z-index:40;
                  background:var(--card);border:1px solid var(--line);border-radius:10px;
                  box-shadow:0 16px 34px -16px rgba(11,35,71,.5);padding:4px;max-height:250px;overflow:auto}
  .nr-select-menu[hidden]{display:none}
  .nr-select-grp{font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
                 color:var(--mut);padding:9px 10px 4px}
  .nr-select-opt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;
                 border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--ink);white-space:nowrap}
  .nr-select-opt:hover{background:var(--slate-10)}
  .nr-select-opt.sel{background:var(--accent-10)}
  .nr-select-opt .tag{font-size:11px;color:var(--mut);flex:none}
  #art[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  .ctrls{display:flex;gap:9px;flex:0 1 auto;align-items:center;flex-wrap:wrap;row-gap:8px;justify-content:flex-end}
  /* Responsive type scale. Every size on the face is a clamp, not a fixed px, so the artifact
     holds together from a 720px pane to a 1920px screen. Pattern: clamp(floor, vw-based, ceiling).
     h1 additionally runs through fitTitle(), which caps the action title at TWO lines. */
  #art{--t-h1:clamp(17px,1.55vw,28px); --t-sub:clamp(12px,1.05vw,16px);
       --t-body:clamp(11.5px,1.02vw,15.5px); --t-row:clamp(11px,.95vw,13.5px);
       --t-cell:clamp(10px,.86vw,12.5px); --t-head:clamp(8.5px,.72vw,12px);
       --t-micro:clamp(8.5px,.7vw,11.5px)}
  h1{font-size:var(--t-h1);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.22;margin:0;max-width:1300px;
     overflow-wrap:break-word}
  #art[data-t="dark"] h1{color:#EAEFF5}
  h1 .hl{color:var(--green)}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 16px}
  .subt{font-size:15px;font-weight:600;color:var(--accent)}
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:24px}
  .proc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .proc-hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .proc-hdr .nm{font-size:14.5px;font-weight:700;color:var(--navy)}
  #art[data-t="dark"] .proc-hdr .nm{color:#EAEFF5}
  .score{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px}
  .score.good{background:rgba(47,143,107,.12);color:var(--rag-green)}
  .score.fair{background:rgba(212,154,58,.16);color:#B97F22}
  .score.weak{background:rgba(210,100,90,.13);color:#C2483C}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:flex;align-items:center;gap:6px;background:var(--slate-10);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--ink)}
  .chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .chip.good .dot{background:var(--rag-green)}
  .chip.fair .dot{background:var(--rag-amber)}
  .chip.weak .dot{background:var(--rag-red)}
  .chip.nc{opacity:.6;border:1px dashed var(--steel);background:transparent}
  table{border-collapse:collapse;width:100%}
  table.mtx-table{table-layout:fixed;border-collapse:separate;border-spacing:0}
  /* Heat map. The grid IS the picture: every cell is filled and colour encodes the LETTER, so
     ownership reads as a pattern instead of as pills hunted on white. The anti-pattern is
     deliberately NOT in the cell colour: two scales on one grid fight each other and destroy
     the pattern. It gets its own column, in words. */
  th.rot{vertical-align:bottom;padding:0;position:relative}
  th.rot > div{position:absolute;left:0;right:0;bottom:7px;display:flex;justify-content:center}
  th.rot > div > span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;
                      font-size:var(--t-head);font-weight:700;color:var(--navy);letter-spacing:.2px}
  #art[data-t="dark"] th.rot > div > span{color:#EAEFF5}
  .mtx-cell{padding:0 2px}
  .celwrap{position:relative;height:26px;display:flex;width:100%;align-items:center;justify-content:center;
           border-radius:4px;font-size:var(--t-cell);font-weight:800;letter-spacing:.3px;margin:1.5px 0}
  /* currentColor, so the dot reads on a navy fill and on a pale one without a second rule */
  .celwrap.noted::after{content:'';position:absolute;top:3px;right:3px;width:4px;height:4px;
                        border-radius:50%;background:currentColor;opacity:.65}
  .L-A{background:var(--navy-fill);color:#fff}
  .L-R{background:var(--green);color:#fff}
  .L-C{background:var(--sky);color:#0B2347}
  .L-I{background:#EDF2F7;color:var(--mut)}
  .L-none{background:#FBFCFD;color:#D4DAE3;border:1px solid #F0F3F7}
  #art[data-t="dark"] .L-A{background:var(--accent);color:#0B2347}
  #art[data-t="dark"] .L-C{background:rgba(110,177,209,.34);color:#EAEFF5}
  #art[data-t="dark"] .L-I{background:rgba(255,255,255,.07);color:#94A1B2}
  #art[data-t="dark"] .L-none{background:rgba(255,255,255,.02);color:#3A4756;border-color:rgba(255,255,255,.05)}
  .vd{font-size:var(--t-micro);font-weight:700;padding:4px 9px;border-radius:999px;
      display:inline-block;white-space:nowrap}
  .vd.good{background:#E6F2EB;color:#1C6A44}
  .vd.weak{background:#FBE9E7;color:#A93B30}
  .vd.fair{background:#FCF2DE;color:#8A5F17}
  .vd.nc{background:#EEF1F5;color:#7A838F}
  .vd.acc{background:#EAEEF4;color:#3C5375}
  .vd.over{border:1px dashed currentColor}
  .vd.over::after{content:'*';margin-left:3px;font-weight:800;opacity:.75}
  #art[data-t="dark"] .vd.acc{background:rgba(255,255,255,.06);color:#B9C7DA;border-color:#44566E}
  #art.editing .vd{cursor:pointer}
  #art.editing .vd:hover{outline:2px solid var(--accent);outline-offset:2px}
  .fentry.acc .fdot{background:#7991AD}
  .chip.acc{background:#EAEEF4;color:#3C5375}
  .thresh{display:flex;align-items:center;gap:7px;font-size:var(--t-micro);font-weight:700;color:var(--txt)}
  .thresh input{width:52px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;
                background:var(--card);color:var(--ink);font:inherit;font-size:var(--t-micro);text-align:center}
  .tnote{font-size:var(--t-micro);color:var(--mut);margin-top:9px}
  #ed .who{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 14px}
  #ed .whorow{display:flex;gap:9px;align-items:flex-start;padding:5px 0}
  #ed .whorow+.whorow{border-top:1px solid var(--line)}
  #ed .wl{flex:none;display:flex;gap:3px}
  #ed .wn{font-size:12.5px;color:var(--ink);line-height:1.35}
  #ed .wn em{display:block;font-style:normal;font-size:11.5px;color:var(--mut);margin-top:2px}
  #art[data-t="dark"] .vd.good{background:rgba(46,160,101,.2);color:#7FD1A4}
  #art[data-t="dark"] .vd.weak{background:rgba(194,72,60,.22);color:#F0A79E}
  #art[data-t="dark"] .vd.fair{background:rgba(212,154,58,.22);color:#F4D9A3}
  #art[data-t="dark"] .vd.nc{background:rgba(255,255,255,.07);color:#94A1B2}
  .loadlbl{font-size:var(--t-head);letter-spacing:.3px;text-transform:uppercase;color:var(--mut);
           font-weight:700;padding-top:10px}
  th{text-align:left;font-size:var(--t-head);letter-spacing:.3px;text-transform:uppercase;color:var(--mut);font-weight:700;
     white-space:normal;overflow-wrap:anywhere;hyphens:auto;line-height:1.16;vertical-align:bottom;
     padding:0 6px 9px 0;border-bottom:2px solid var(--line)}
  th.rc{text-align:center}
  th.col-act,td.col-act{width:250px}
  td{font-size:15px;color:var(--txt);padding:10px 6px 10px 0;border-bottom:1px solid var(--line);vertical-align:middle}
  td b{color:var(--ink)}
  .mtx-proc td{background:var(--navy-10);color:var(--navy);font-weight:700;font-size:13.5px;padding:8px 10px;border-bottom:none}
  #art[data-t="dark"] .mtx-proc td{color:#EAEFF5;background:rgba(255,255,255,.06)}
  .mtx-act{display:flex;align-items:flex-start;gap:8px;line-height:1.4}
  .mtx-act span.flagdot{margin-top:5px}
  .mtx-act .actname{flex:1 1 auto;min-width:0}
  .flagdot{width:9px;height:9px;border-radius:50%;flex:none}
  .flagdot.good{background:var(--rag-green)}
  .flagdot.fair{background:var(--rag-amber)}
  .flagdot.weak{background:var(--rag-red)}
  .flagdot.nc{background:var(--steel)}
  .letter{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:5px;background:var(--slate-10);color:var(--ink);margin:0 2px}
  .letter.dash{color:var(--mut);background:transparent;font-weight:400}
  .letter.r{background:rgba(110,177,209,.22);color:#1D6E8F}
  .letter.a{background:var(--navy);color:#fff}
  .letter.c{background:rgba(212,154,58,.20);color:#8A5F17}
  .letter.i{background:var(--slate-10);color:var(--slate)}
  #art[data-t="dark"] .letter.r{background:rgba(110,177,209,.22);color:#A9D5E6}
  #art[data-t="dark"] .letter.a{background:var(--accent);color:#0B2347}
  #art[data-t="dark"] .letter.c{background:rgba(212,154,58,.24);color:#F4D9A3}
  #art[data-t="dark"] .letter.i{background:rgba(255,255,255,.08);color:#C4CEDA}
  .lkey{display:flex;gap:8px;align-items:center;margin:0 0 12px}
  .lkey span{font-size:10.5px;color:var(--mut)}
  .findings{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 24px 22px;box-shadow:var(--sh)}
  .findings h3{font-size:15px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:0 0 16px}
  .fproc{margin-bottom:18px}
  .fproc:last-of-type{margin-bottom:0}
  .fproc .pname{font-size:15.5px;font-weight:700;color:var(--navy);margin-bottom:9px}
  #art[data-t="dark"] .fproc .pname{color:#EAEFF5}
  .fentry{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;line-height:1.55;padding:7px 0;margin-left:18px}
  .fentry .fdot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:7px}
  .fentry.good .fdot{background:var(--rag-green)}
  .fentry.weak .fdot{background:var(--rag-red)}
  .fentry.fair .fdot{background:var(--rag-amber)}
  .fentry.nc .fdot{background:var(--steel)}
  .fentry b{color:var(--ink)}
  .fentry .ftxt{color:var(--txt)}
  .fclear{font-size:14px;color:var(--mut);padding:2px 0}
  /* Findings: process box and rating on the left, activities and insights on the right.
     No card and no group headings; the table's own rules do the grouping. */
  .ftab{width:100%;border-collapse:collapse;table-layout:fixed}
  .ftab th{text-align:left;font-size:var(--t-head);font-weight:800;letter-spacing:.9px;
           text-transform:uppercase;color:var(--mut);padding:0 14px 8px 0;
           border-bottom:2px solid var(--line)}
  .ftab td{padding:15px 14px 15px 0;vertical-align:top;border-top:2px solid var(--line)}
  .ftab tbody tr:first-child td{border-top:0}
  .pbox{border-radius:9px;padding:11px 12px;font-size:var(--t-row);font-weight:800;line-height:1.25}
  .pbox.good{background:#EAF3EE;color:#1C6A44}.pbox.fair{background:#FBF3E3;color:#8A5F17}
  .pbox.weak{background:#FAECEA;color:#A93B30}.pbox.nc{background:#EEF1F5;color:#5A6472}
  #art[data-t="dark"] .pbox.good{background:rgba(46,160,101,.18);color:#7FD1A4}
  #art[data-t="dark"] .pbox.fair{background:rgba(212,154,58,.18);color:#F4D9A3}
  #art[data-t="dark"] .pbox.weak{background:rgba(194,72,60,.20);color:#F0A79E}
  #art[data-t="dark"] .pbox.nc{background:rgba(255,255,255,.07);color:#B9C7DA}
  .pct{font-size:calc(var(--t-h1) * .72);font-weight:800;letter-spacing:-1px;line-height:1}
  .pct.good{color:#1C7A4A}.pct.fair{color:#C98A25}.pct.weak{color:#C2483C}.pct.nc{color:var(--mut)}
  .pctl{font-size:var(--t-head);font-weight:800;letter-spacing:.7px;text-transform:uppercase;
        color:var(--mut);margin-top:3px}
  .pctn{font-size:var(--t-micro);color:var(--mut);margin-top:7px;line-height:1.35}
  .al{list-style:none;margin:0;padding:0}
  .al .vd{margin-left:8px}
  .al .an{font-weight:700;color:var(--ink)}
  /* .fentry is the edit layer's hook and is styled display:flex for the list form used by the
     "Across the scope" block. On a list item that flex swallows the marker and the pill wrap. */
  li.fentry{display:list-item;gap:0;align-items:initial;margin-left:0;
            font-size:var(--t-row);line-height:1.4;padding:5px 0}
  li.fentry+li.fentry{margin-top:5px}
  .ins{list-style:disc;margin:0;padding-left:18px}
  .ins li{font-size:var(--t-row);line-height:1.45;color:var(--ink);padding:2px 0}
  .ins li.sp{margin-top:13px}
  .ins li.ev{list-style:none;margin-left:-18px}
  .evb{border-left:2px solid var(--line);padding-left:11px;margin-top:4px}
  .fgen{margin-top:18px}
  .fgen h4{font-size:var(--t-micro);font-weight:800;letter-spacing:.8px;text-transform:uppercase;
           color:var(--mut);margin:0 0 6px}
  .fmiss{color:var(--mut);font-style:italic}
  .fgen{margin-top:16px}
  .fgen h4{font-size:var(--t-micro);font-weight:800;letter-spacing:.8px;text-transform:uppercase;
           color:var(--mut);margin:0 0 6px}
  .fev{margin:6px 0 0 0;border-left:2px solid var(--line);padding-left:11px}
  .fevrow{font-size:var(--t-row);color:var(--txt);line-height:1.45;padding:2px 0}
  .fevr{display:inline-block;font-weight:700;color:var(--navy);margin-right:7px}
  #art[data-t="dark"] .fevr{color:#EAEFF5}
  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:12px;font-size:11px;color:var(--mut)}
  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legend{display:flex;gap:7px}
  .lp{font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:999px}
  .conf{font-size:9.5px;letter-spacing:.5px;font-weight:600}
  
  
</style></head>
<body>
<div id="art" data-t="light">
  <div class="nr-rail"></div>

};
/* ========================================================= */
(function(){
  /* Hoisted OUTSIDE the edit fences. The client build strips the edit layer wholesale, and the
     shared render code below still has to run there, so anything it touches is declared here.
     LAYER = "the edit layer is present in this build". ON = "editing is unlocked right now".
     bindCells is a no-op the edit layer redefines; the later function declaration wins in the
     working build and is simply absent from the client one. */
  var LAYER=false, ON=false;
  function bindCells(){}
  

  function esc(t){return String(t==null?'':t).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]||c;});}
  function hl(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1</span>');}

  var C_DEFAULT=3;
  function cThreshold(){
    var n=Number(DATA.cThreshold);
    return (isFinite(n)&&n>0)?Math.round(n):C_DEFAULT;
  }
  function cellsWith(a,letter){return (a.cells||[]).filter(function(c){return (c.letters||[]).indexOf(letter)>-1;});}

  function detectFlags(a){
    if(a.notCovered) return {flags:['not-covered'], text:'Not covered. No role has been captured for this activity yet.'};
    var As=cellsWith(a,'A'), Rs=cellsWith(a,'R'), Cs=cellsWith(a,'C');
    var flags=[];
    if(As.length===0) flags.push('no-a');
    if(As.length>1) flags.push('split-a');
    if(Rs.length===0) flags.push('no-r');
    if(Cs.length>cThreshold()) flags.push('bottleneck-c');
    var text;
    if(flags.indexOf('no-a')>-1) text='No one accountable for this activity.';
    else if(flags.indexOf('split-a')>-1) text=As.map(function(c){return c.role;}).join(' and ')+' are both marked accountable.';
    else if(flags.indexOf('no-r')>-1) text='Someone owns this, but nobody is marked as doing the work.';
    else if(flags.indexOf('bottleneck-c')>-1) text=Cs.length+' roles consulted, above the agreed threshold of '+cThreshold()+', likely a bottleneck for a routine activity.';
    else text='One accountable owner, and the work is staffed.';
    return {flags:flags, text:text};
  }
  function severity(flags){
    if(flags.indexOf('not-covered')>-1) return 'nc';
    if(flags.indexOf('no-a')>-1 || flags.indexOf('no-r')>-1 || flags.indexOf('split-a')>-1) return 'weak';
    if(flags.indexOf('bottleneck-c')>-1) return 'fair';
    return 'good';
  }
  function processScore(p){
    var acts=(p.activities||[]).filter(function(a){return !a.notCovered;});
    if(!acts.length) return null;
    var clear=acts.filter(function(a){
      var o=ov(a);
      if(o) return o.state==='clear';
      return detectFlags(a).flags.length===0;
    }).length;
    return Math.round(100*clear/acts.length);
  }
  function scoreTier(pct){if(pct==null)return 'nc';if(pct>=75)return 'good';if(pct>=45)return 'fair';return 'weak';}
  function cellFor(a,role){return (a.cells||[]).filter(function(c){return c.role===role;})[0]||null;}
  var LETTER_LABEL={R:'Responsible',A:'Accountable',C:'Consulted',I:'Informed'};

  // A verdict in words for the row. The pill colour is the same severity the findings use, so
  // the two surfaces cannot disagree, and the word means the reader never consults a legend.
  var VERDICT={'no-a':'no accountable','split-a':'split accountability','no-r':'no responsible',
               'bottleneck-c':'bottleneck consulted','not-covered':'not covered'};
  function verdictOf(a){
    var f=detectFlags(a).flags;
    for(var k=0;k<f.length;k++) if(VERDICT[f[k]]) return VERDICT[f[k]];
    return 'clear';
  }
  var STATES=['clear','split-a','no-a','no-r','bottleneck-c'];
  var STATE_LABEL={'clear':'clear','split-a':'split accountability','no-a':'no accountable',
                   'no-r':'no responsible','bottleneck-c':'bottleneck consulted'};
  var STATE_SEV={'clear':'good','split-a':'weak','no-a':'weak','no-r':'weak','bottleneck-c':'fair'};
  function ov(a){
    var o=a&&a.verdict;
    if(o && typeof o==='object' && STATES.indexOf(o.state)>-1 &&
       typeof o.reason==='string' && o.reason.trim()) return o;
    return null;
  }
  function isAccepted(a){ var o=ov(a); return !!(o && o.state==='clear'); }
  // What the pill says and how it is coloured. An acknowledged flag keeps its own words and
  // gains ", by design", so nobody can mistake it for a clean row.
  function verdictView(a){
    var d=detectFlags(a), sev=severity(d.flags), label=verdictOf(a), o=ov(a);
    if(!o) return {sev:sev, label:label, title:d.text, over:false};
    var rule='The rule says: '+d.text;
    if(o.state==='clear'){
      // the flag stands, the team confirmed it is deliberate
      return {sev:'acc', over:true,
              label:(d.flags.length?label+', by design':'clear, confirmed'),
              title:o.reason+'  |  '+rule};
    }
    // a problem the arithmetic cannot see, asserted by the consultant
    return {sev:STATE_SEV[o.state]||'weak', over:true, label:STATE_LABEL[o.state],
            title:o.reason+'  |  '+rule};
  }
  // Rotate the role labels only when there are enough of them to pay for the vertical band.
  // Below the threshold a rotated header burns ~120px of height and saves nothing.
  var ROT_FROM=8;

  function renderMatrix(){
    var roles=DATA.roles||[], rot=roles.length>=ROT_FROM;
    // The rotated band has to be as tall as the LONGEST label or the ends get cut off. Derived,
    // not fixed: a fixed 126px silently clipped "Subject matter expert" at thirteen roles.
    var maxLen=0; roles.forEach(function(r){maxLen=Math.max(maxLen,String(r).length);});
    var bandH=Math.min(230,Math.max(96,Math.round(26+maxLen*6.9)));
    var span=roles.length+2;
    var html='<table class="mtx-table">'+
      '<colgroup><col style="width:30%">'+roles.map(function(){return '<col>';}).join('')+'<col style="width:15%"></colgroup>'+
      '<thead>'+
'<tr><th class="col-act">Process / activity</th>'+
      roles.map(function(r){
        return rot ? '<th class="rc rot" style="height:'+bandH+'px"><div><span>'+esc(r)+'</span></div></th>'
                   : '<th class="rc" style="text-align:center">'+esc(r)+'</th>';
      }).join('')+
      '<th class="col-vd">Verdict</th></tr></thead><tbody>';
    procList().forEach(function(e){
      var p=e.p, pi=e.pi;
      html+='<tr class="mtx-proc"><td colspan="'+span+'">'+esc(p.name)+'</td></tr>';
      (p.activities||[]).forEach(function(a,ai){
        var d=detectFlags(a), sev=severity(d.flags);
        html+='<tr><td class="col-act"><div class="mtx-act"><span class="actname">'+esc(a.name)+'</span></div></td>';
        roles.forEach(function(r){
          var c=cellFor(a,r);
          var letters=c&&c.letters&&c.letters.length ? c.letters : null;
          var title=c&&c.note?esc(c.note):'';
          // the fill takes the strongest letter present: accountable outranks responsible,
          // which outranks consulted, so a cell reads as its most senior involvement
          var prim=letters ? (letters.indexOf('A')>-1?'A':(letters.indexOf('R')>-1?'R':(letters.indexOf('C')>-1?'C':'I'))) : null;
          html+='<td class="mtx-cell"'+(title?' title="'+title+'"':'')+'><span class="celwrap L-'+(prim||'none')+(title?' noted':'')+'" data-pi="'+pi+'" data-ai="'+ai+'" data-role="'+esc(r)+'">'+
            (letters ? esc(letters.join('')) : '·')+'</span></td>';
        });
        var vv=verdictView(a);
        html+='<td><span class="vd '+vv.sev+(vv.over?' over':'')+'" data-pi="'+pi+'" data-ai="'+ai+
              '" title="'+esc(vv.title)+'">'+esc(vv.label)+'</span></td></tr>';
      });
    });
    // How many activities each role is accountable for. A dark cell is a role carrying the scope.
    html+='<tr><td class="loadlbl">Accountable for</td>';
    roles.forEach(function(r){
      var n=0;
      procList().forEach(function(e){(e.p.activities||[]).forEach(function(a){
        var c=cellFor(a,r); if(c&&(c.letters||[]).indexOf('A')>-1) n++;});});
      html+='<td style="padding-top:10px"><span class="celwrap '+(n>=4?'L-A':(n?'L-I':'L-none'))+'">'+(n||'·')+'</span></td>';
    });
    html+='<td></td></tr>';
    html+='</tbody></table>';
    html+='<div class="tnote">Bottleneck flagged above '+cThreshold()+
          ' consulted roles on one activity. A verdict marked * was set by the consultant rather than '+
          'by the letters; hover it to see what the rule said.</div>';
    // The findings used to be appended here. Stacked under a fifteen-row matrix they made the
    // view 1743px of content in a 643px frame, so it could never fit and always scrolled, with
    // the table sliced mid-row. They are their own view now.
    return html;
  }

  // The findings read as a table, not a list: one row per finding, ordered worst first, with the
  // friction in plain words rather than the rule's wording. The macro-process is a column, not a
  // heading, because grouping by process tells you where a problem sits and nothing about it.
  var curProc='all';
  function procList(){
    var out=[];
    (DATA.processes||[]).forEach(function(p,pi){
      if(curProc==='all'||String(pi)===curProc) out.push({p:p,pi:pi});
    });
    return out;
  }

  var VORDER=['no-a','no-r','split-a','bottleneck-c','not-covered','clear'];

  // The Findings view: one row per macro-process. The left two columns are the summary the
  // Scorecard tab used to be, the right two are the detail. The friction bullets ARE the
  // insights, so there is no separate insights block: that was the same content twice.
  function fricList(a){
    var f=a && a.friction;
    if(Array.isArray(f)) return f.map(function(x){return String(x||'').trim();}).filter(Boolean);
    if(typeof f==='string' && f.trim()) return [f.trim()];
    return [];
  }
  function renderFindings(){
    var html='<table class="ftab"><thead><tr>'+
      '<th style="width:15%"></th><th style="width:10%">Rating</th>'+
      '<th style="width:30%">Activity</th><th>Insights</th></tr></thead><tbody>';
    var any=false;
    procList().forEach(function(e){
      var p=e.p, pi=e.pi, rows=[];
      (p.activities||[]).forEach(function(a,ai){
        var d=detectFlags(a), o=ov(a), vv=verdictView(a);
        if(d.flags.length>0 || (o && o.state!=='clear'))
          rows.push({kind:'auto', a:a, ai:ai, vv:vv, state:(o?o.state:(d.flags[0]||'clear')),
                     rule:d.text, reason:(o?o.reason:null),
                     notes:(a.cells||[]).filter(function(c){return c.note&&String(c.note).trim();})});
        (DATA.manualFindings||[]).filter(function(m){return m.activityId===a.id;}).forEach(function(m){
          rows.push({kind:'manual', a:a, ai:ai, m:m, state:'zz',
                     vv:{sev:(m.severity||'weak'), label:'consultant note', over:false}});
        });
      });
      rows.sort(function(x,y){
        var ix=VORDER.indexOf(x.state), iy=VORDER.indexOf(y.state);
        if(ix<0) ix=98; if(iy<0) iy=98; return ix-iy;
      });
      if(rows.length) any=true;
      var pct=processScore(p), tier=scoreTier(pct);
      html+='<tr class="fgrow">'+
        '<td><div class="pbox '+tier+'">'+esc(p.name)+'</div></td>'+
        '<td><div class="pct '+tier+'">'+(pct==null?'n/a':pct+'%')+'</div>'+
        '<div class="pctl">clear</div>'+
        '<div class="pctn">'+((p.activities||[]).length)+' activities'+
          (rows.length?', '+rows.length+' flagged':'')+'</div></td>';

      if(!rows.length){
        html+='<td colspan="2"><div class="fclear">Nothing flagged here.</div></td></tr>';
        return;
      }
      // activities, each carrying its own verdict
      html+='<td><ul class="al">'+rows.map(function(r){
        return '<li class="fentry '+(r.vv.sev==='nc'?'nc':r.vv.sev)+'" data-aid="'+esc(r.a.id)+'"'+
               (r.kind==='manual'?' data-fid="'+esc(r.m.id)+'"':'')+'>'+
               '<span class="an">'+esc(r.a.name)+'</span>'+
               '<span class="vd '+(r.vv.sev==='nc'?'nc':r.vv.sev)+(r.vv.over?' over':'')+
                 '" data-pi="'+pi+'" data-ai="'+r.ai+'">'+esc(r.vv.label)+'</span></li>';
      }).join('')+'</ul></td>';
      // the insights, aligned to the activities above them
      html+='<td><ul class="ins">'+rows.map(function(r,i){
        var bits='';
        if(r.kind==='manual'){
          bits='<li'+(i?' class="sp"':'')+'>'+esc(r.m.text)+'</li>';
        } else {
          var fl=fricList(r.a);
          if(!fl.length) fl=['<MISSING>'];
          bits=fl.map(function(t,j){
            return '<li'+((j===0&&i)?' class="sp"':'')+'>'+
                   (t==='<MISSING>'?'<span class="fmiss">'+esc(r.reason||r.rule)+'</span>':esc(t))+'</li>';
          }).join('');
          if(r.notes.length) bits+='<li class="ev"><div class="evb">'+r.notes.map(function(n){
            return '<div class="fevrow"><span class="fevr">'+esc(n.role)+'</span>'+esc(n.note)+'</div>';
          }).join('')+'</div></li>';
        }
        return bits;
      }).join('')+'</ul></td></tr>';
    });
    html+='</tbody></table>';
    var general=(DATA.manualFindings||[]).filter(function(m){return !m.activityId;});
    if(general.length){
      html+='<div class="fgen"><h4>Across the scope</h4>'+general.map(function(m){
        return '<div class="fentry '+(m.severity==='nc'?'nc':m.severity)+'" data-fid="'+esc(m.id)+'">'+
               '<span class="fdot"></span><span class="ftxt">'+esc(m.text)+'</span></div>';
      }).join('')+'</div>';
    }
    if(!any && !general.length)
      html+='<div class="fclear">No accountability gaps, split ownership or bottlenecks flagged in '+
            (curProc==='all'?'this scope':'this macro-process')+'.</div>';
    
    return html;
  }

  var VIEWS={matrix:renderMatrix,findings:renderFindings},cur='matrix';
  function paintHeader(){
  document.getElementById('ctx').textContent=DATA.context||'OPEX QUICKSCAN';
  document.getElementById('lens').textContent=DATA.lens||'RACI DIAGNOSTIC';
  document.getElementById('title').innerHTML=hl(DATA.keyMessage||'');
  document.getElementById('subt').textContent=DATA.teamName||'';
  document.getElementById('src').innerHTML=DATA.source?('<b style="color:var(--txt)">Source:</b> '+esc(DATA.source)):'';
  }
  paintHeader();
  document.getElementById('lg').innerHTML='<b style="color:var(--txt);margin-right:4px">Legend:</b>'+
    [['A','Accountable'],['R','Responsible'],['C','Consulted'],['I','Informed'],['none','Not involved']]
      .map(function(k){
        return '<span class="lp" style="background:transparent;padding-left:0">'+
          '<span class="celwrap L-'+k[0]+'" style="display:inline-flex;width:22px;height:15px;'+
          'margin-right:6px;vertical-align:-3px;font-size:9px">'+(k[0]==='none'?'':k[0])+'</span>'+k[1]+'</span>';
      }).join('');
  function fitView(){var v=document.getElementById('view'),vi=document.getElementById('vinner');var ah=v.clientHeight;if(!ah)return;
    vi.style.transform='none';
    // Legibility floor: never shrink below this scale. If content is still taller than the
    // frame at the floor, let #view scroll instead of shrinking text further.
    var FLOOR=0.75, lo=FLOOR, hi=1.12, best=FLOOR;
    for(var k=0;k<12;k++){var s=(lo+hi)/2;vi.style.width=(100/s)+'%';if(vi.scrollHeight*s<=ah-10){best=s;lo=s;}else{hi=s;}}
    vi.style.width=(100/best)+'%';vi.style.transform='scale('+best+')';
    v.style.overflowY=(vi.scrollHeight*best>ah-10)?'auto':'hidden';}
  var TITLE_MAX_LINES=2, TITLE_FLOOR=12;
  function fitTitle(){
    var h=document.getElementById('title'); if(!h) return;
    var cs=getComputedStyle(h), lh=parseFloat(cs.lineHeight);
    if(!lh||isNaN(lh)) return;
    h.style.fontSize='';                                  // back to the clamp, then shrink from there
    var size=parseFloat(getComputedStyle(h).fontSize), max=size;
    while(h.getBoundingClientRect().height > lh*TITLE_MAX_LINES + 1 && size > TITLE_FLOOR){
      size-=0.5; h.style.fontSize=size+'px';
      lh=parseFloat(getComputedStyle(h).lineHeight);
    }
    if(h.getBoundingClientRect().height > lh*TITLE_MAX_LINES + 1){
      // Floor reached and still three lines. Shrinking further would make the one sentence the
      // client actually reads illegible, so leave it and tell the author to cut the title.
      if(window.console&&console.warn) console.warn(
        'RACI: the action title needs '+Math.ceil(h.getBoundingClientRect().height/lh)+
        ' lines at the '+TITLE_FLOOR+'px floor. Cap is '+TITLE_MAX_LINES+'. Shorten keyMessage.');
    }
  }
  function render(){document.getElementById('vinner').innerHTML=VIEWS[cur]();bindCells();
    requestAnimationFrame(function(){fitTitle();fitView();});setTimeout(function(){fitTitle();fitView();},60);}
  function seg(id,attr,cb){var box=document.getElementById(id);box.querySelectorAll('button').forEach(function(b){b.onclick=function(){box.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');cb(b.getAttribute(attr));};});}
  (function initProcFilter(){
    var btn=document.getElementById('procsel'), menu=document.getElementById('procmenu');
    if(!btn||!menu) return;
    var ps=DATA.processes||[];
    function labelFor(v){
      if(v==='all') return 'All processes ('+ps.length+')';
      var p=ps[+v]; return p?p.name:'All processes';
    }
    function paint(){
      btn.querySelector('.lab').textContent=labelFor(curProc);
      menu.innerHTML='<div class="nr-select-grp">Scope</div>'+
        ['all'].concat(ps.map(function(_,i){return String(i);})).map(function(v){
          var n = v==='all' ? (DATA.processes||[]).reduce(function(t,p){return t+(p.activities||[]).length;},0)
                            : ((ps[+v].activities)||[]).length;
          return '<div class="nr-select-opt'+(v===curProc?' sel':'')+'" role="option" data-v="'+v+'">'+
                 '<span class="lab">'+esc(labelFor(v))+'</span>'+
                 '<span class="tag">'+n+' activit'+(n===1?'y':'ies')+'</span></div>';
        }).join('');
      menu.querySelectorAll('.nr-select-opt').forEach(function(o){
        o.onclick=function(){ curProc=o.getAttribute('data-v'); close();
          btn.querySelector('.lab').textContent=labelFor(curProc); render(); };
      });
    }
    function open_(){ paint(); menu.hidden=false; btn.classList.add('on'); btn.setAttribute('aria-expanded','true'); }
    function close(){ menu.hidden=true; btn.classList.remove('on'); btn.setAttribute('aria-expanded','false'); }
    btn.onclick=function(e){ e.stopPropagation(); menu.hidden ? open_() : close(); };
    document.addEventListener('click',function(e){ if(!menu.hidden && !menu.contains(e.target)) close(); });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
    paint();
  })();
  seg('views','data-v',function(v){cur=v;render();});
  seg('theme','data-s',function(t){document.getElementById('art').setAttribute('data-t',t);render();});
  window.addEventListener('resize',function(){fitTitle();fitView();});

  

  render();
})();
</script>
