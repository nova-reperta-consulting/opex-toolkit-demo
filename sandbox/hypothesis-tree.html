<!doctype html>
<!-- ============================================================================
  HYPOTHESIS TREE  |  assets/TEMPLATE.html
  Built ON diagnostic-skill-builder/templates/artifact-shell-editable.html: the chrome, the
  seg views, the lock, the sidebar, the .nr-select dropdowns, the action-title editor and the
  monotonic fit are the canonical ones. Only the DATA block, the three view renderers and the
  sidebar fields belong to this instrument.

  TWO FILES: scripts/render_hypothesis_tree.py strips every fenced region to build the client
  hypothesis-tree.html (the file you SEND) and keeps them for hypothesis-tree.WORKING.html
  (editable, NEVER sent).
============================================================================ -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hypothesis tree</title>
<style>
/* Type scale — one place, not case by case. Every size below 12px is a token; the
   whole small end lifts on a narrow screen so nothing drops under 11px on a phone. */
:root{
  --fs-65:6.5px; --fs-7:7px; --fs-75:7.5px; --fs-8:8px; --fs-85:8.5px; --fs-9:9px;
  --fs-95:9.5px; --fs-10:10px; --fs-105:10.5px; --fs-11:11px; --fs-115:11.5px;
}
@media (max-width:760px){
  :root{
    --fs-65:11px; --fs-7:11px; --fs-75:11px; --fs-8:11px; --fs-85:11px; --fs-9:11px;
    --fs-95:11px; --fs-10:11.5px; --fs-105:12px; --fs-11:12px; --fs-115:12.5px;
  }
}
</style>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}
  /* ===== BRAND THEME (inlined from templates/brand.css) ===== */
  #art{--navy:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;
      --slate-10:rgba(54,65,86,.09);--navy-10:rgba(11,35,71,.10);--green-10:rgba(28,122,74,.10);--accent-10:rgba(110,177,209,.13);
      --rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;--rag-green-text:#2F8F6B;--rag-amber-text:#B97F22;--rag-red-text:#C2483D;--rag-na-text:#6B7480;--tint-green:rgba(47,143,107,.12);--tint-amber:rgba(212,154,58,.16);--tint-red:rgba(210,100,90,.13);--tint-na:rgba(154,164,176,.16);--navy-fill:#0B2347;
      --dv-2:#2E5C8A;
      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #art[data-t="dark"]{--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--navy-fill:#243246;--accent:#8FC7E8;--steel:#93A9C4;--rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;--rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;--tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);--dv-2:#5A9BD5;--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}
  body:has(#art[data-t="dark"]){--page:#0E1620}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:3}
  .tags{display:flex;align-items:center;gap:11px;min-width:0}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)}
  .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:var(--fs-115);letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #art[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  /* the zoom stepper, same component as the org baseline's tree */
  .zoombox{display:flex;align-items:center;background:var(--slate-10);border-radius:999px;padding:3px;gap:1px}
  .zoombox button{font-size:13px;font-weight:700;color:var(--mut);width:26px;height:26px;border-radius:999px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;border:0;background:none;cursor:pointer}
  .zoombox button:hover{background:var(--card);color:var(--ink)}
  .zoombox button.wide{width:auto;padding:0 10px;font-size:var(--fs-11);font-weight:600}
  .zoombox .zlvl{font-size:var(--fs-11);font-weight:700;color:var(--txt);min-width:40px;text-align:center;letter-spacing:-.2px}
  #view.grabbable{cursor:grab}
  #view.grabbing{cursor:grabbing}
  #view.grabbing .node{pointer-events:none}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  .ctrls{display:flex;gap:9px;flex:none}
  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0 0 16px;max-width:1300px}
  #art[data-t="dark"] h1{color:#EAEFF5}
  h1 .hl{color:var(--green)}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 16px}
  .subt{font-size:15px;font-weight:600;color:var(--accent);max-width:1300px;line-height:1.4}
  .subt .dec{display:block;font-size:.82em;font-weight:600;color:var(--mut);margin-top:3px}
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:24px}
  table{border-collapse:collapse;width:100%}
  th{text-align:left;font-size:var(--fs-105);letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:700;padding:0 20px 9px 0;border-bottom:2px solid var(--line)}
  td{font-size:13px;color:var(--txt);padding:11px 20px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
  td b{color:var(--ink)}
  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:12px;font-size:clamp(9.5px,0.75vw,12px);color:var(--mut)}
  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legend{display:flex;gap:7px}
  .lp{font-size:0.95em;font-weight:600;padding:0.2em 0.85em;border-radius:999px}
  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600;white-space:nowrap;flex:none}

  /* ── the tree: levels left to right, one row per lowest-level hypothesis ── */
  .twrap{position:relative;width:100%}
  .tgrid{display:grid;position:relative;z-index:1;width:100%}
  .node.l0{background:var(--navy);--nr-tc:var(--sky);background-image:linear-gradient(color-mix(in srgb,var(--nr-tc) 11%,transparent),color-mix(in srgb,var(--nr-tc) 11%,transparent))}
  .node.l0 .txt{font-size:14px;line-height:1.35}
  .node.l0 .dec{margin-top:7px;font-size:var(--fs-115);font-weight:600;color:var(--sky);line-height:1.4}
  svg.wires{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:visible}
  .band{grid-column:1/-1;border-bottom:1px solid var(--line);pointer-events:none}
  .hcell{padding:0 14px 9px 0;font-size:var(--fs-105);letter-spacing:.6px;text-transform:uppercase;color:var(--mut);
    font-weight:700;white-space:nowrap;border-bottom:2px solid var(--line)}
  .nops{position:absolute;top:4px;right:4px;display:none;gap:3px;z-index:5}
  #art.editing .node .nops{display:flex}
  .nops button{width:17px;height:17px;padding:0;line-height:1;font-size:12.5px;font-weight:700;cursor:pointer;
    border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;border-radius:5px;
    display:flex;align-items:center;justify-content:center}
  .nops button:hover{background:#fff;color:var(--navy);border-color:#fff}
  .nops button.rm:hover{background:var(--rag-red);color:#fff;border-color:var(--rag-red)}
  /* the lowest two levels are light cards, so the controls invert */
  .node.l3 .nops button,.node.l4 .nops button{border-color:var(--line);background:var(--card);color:var(--mut)}
  .node.l3 .nops button:hover,.node.l4 .nops button:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
  .node.l3 .nops button.rm:hover,.node.l4 .nops button.rm:hover{background:var(--rag-red);border-color:var(--rag-red)}
  .node{align-self:center;position:relative;z-index:2;margin:5px 0;background:var(--navy-fill);color:#fff;
    border-radius:10px;padding:9px 12px;--nr-tc:var(--accent);background-image:linear-gradient(color-mix(in srgb,var(--nr-tc) 11%,transparent),color-mix(in srgb,var(--nr-tc) 11%,transparent))}
  .node.l2{background:var(--navy2);--nr-tc:var(--green)}
  .node.l3,.node.l4{background:var(--card);color:var(--ink);border:1px solid var(--line);--nr-tc:var(--dv-2);background-image:linear-gradient(color-mix(in srgb,var(--nr-tc) 11%,transparent),color-mix(in srgb,var(--nr-tc) 11%,transparent))}
  .node .lv{font-size:var(--fs-95);letter-spacing:.6px;text-transform:uppercase;opacity:.62;margin-bottom:3px;
    display:flex;align-items:center;gap:6px}
  .node .txt{font-size:13px;line-height:1.35;font-weight:600}
  .roll{margin-top:7px;display:flex;align-items:center;gap:7px}
  .roll .bar{flex:1;height:5px;border-radius:3px;overflow:hidden;display:flex;background:#ffffff2e;min-width:40px}
  .node.l3 .roll .bar,.node.l4 .roll .bar{background:var(--line)}
  .roll .bar i{display:block;height:100%}
  .roll .lbl{font-size:var(--fs-95);opacity:.82;white-space:nowrap}
  .mcell{align-self:center;padding:9px 14px 9px 0;font-size:12.5px;color:var(--txt);line-height:1.45;position:relative;z-index:2}
  .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:var(--fs-11);
    font-weight:700;white-space:nowrap;color:#fff}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:#ffffff9c}
  .p-open{background:var(--rag-na)} .p-prog{background:var(--dv-2)} .p-conf{background:var(--rag-green)}
  .p-part{background:var(--rag-amber)} .p-rej{background:var(--rag-red)} .p-park{background:var(--mut)}
  .prio{font-size:var(--fs-11);font-weight:700;letter-spacing:.3px}
  .prio.High{color:var(--rag-red-text)} .prio.Medium{color:var(--rag-amber-text)} .prio.Low{color:var(--mut)}
  .tchip{display:inline-block;background:var(--navy-10);color:var(--navy);font-weight:600;font-size:var(--fs-115);padding:3px 9px;border-radius:9px}
  #art[data-t="dark"] .tchip{background:#2A3744;color:var(--ink)}
  .tscope{display:block;font-size:var(--fs-11);color:var(--mut);margin-top:3px}
  .dim{color:var(--mut);font-style:italic}

  /* ── the test plan: one block per analysis ── */
  .plan{border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--sh);margin:0 0 14px;overflow:hidden}
  .plan>header{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--slate-10)}
  .plan>header .nm{flex:1;min-width:0;font-weight:700;color:var(--ink);font-size:14.5px}
  .plan>header .nm small{display:block;font-weight:700;color:var(--mut);font-size:var(--fs-95);letter-spacing:.6px;text-transform:uppercase;margin-bottom:2px}
  .plan table{font-size:13px}
  .plan td{padding:10px 18px;border-top:1px solid var(--line);border-bottom:0}
  .plan tr:first-child td{border-top:0}
  .plan td.pr{width:90px} .plan td.st{width:160px;white-space:nowrap}
  .plan td .settles{display:block;font-size:var(--fs-115);color:var(--mut);margin-top:2px}
  /* the test plan: one flat table, the analysis a chip rather than a group header */
  .plantbl td{padding:11px 18px 11px 0}
  .plantbl td.an{width:190px}
  .plantbl td.an .sc{display:block;font-size:var(--fs-105);color:var(--mut);margin-top:4px;line-height:1.4}
  .plantbl td.hy{font-size:13px;font-weight:600;color:var(--ink)}
  .plantbl td.hy .se{display:block;font-size:var(--fs-115);font-weight:400;color:var(--mut);margin-top:3px;line-height:1.45}
  .plantbl td.dn{width:24%;font-size:12px;color:var(--txt)}
  .plantbl td.pr{width:82px} .plantbl td.st{width:150px;white-space:nowrap}
  .tchip.out{background:var(--accent-10);color:var(--navy)}
  .tchip.none{background:var(--tint-amber);color:var(--rag-amber-text)}
  .tchip.cust{background:var(--navy);color:#fff}
  #art[data-t="dark"] .tchip.cust{background:var(--sky);color:var(--navy)}
  .tchip.env{opacity:.62}
  .tchip .vt{font-style:normal;font-size:var(--fs-9);font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    margin-left:6px;opacity:.72}
  #ed .fgrp[hidden]{display:none}
  #ed .fsub{font-size:var(--fs-10);font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);
    margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
  /* where we stand: the central hypothesis, then one block per dimension */
    box-shadow:var(--sh);padding:14px 18px;margin:0 0 16px}
  .fine{font-size:var(--fs-11);color:var(--mut);margin:16px 0 0;line-height:1.5}
  .unassigned{border-color:var(--rag-amber)}
  .unassigned>header{background:var(--tint-amber)}
  .note{display:flex;gap:12px;align-items:flex-start;background:var(--slate-10);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 16px;font-size:13px;line-height:1.5;--nr-tc:var(--accent);background-image:linear-gradient(color-mix(in srgb,var(--nr-tc) 11%,transparent),color-mix(in srgb,var(--nr-tc) 11%,transparent))}
  .note.warn{background:var(--tint-amber);border-color:var(--rag-amber)}
  .note b{display:block;margin-bottom:2px;color:var(--ink)}

  /* ── coverage ── */
  .kpis{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:12px 18px;min-width:124px}
  .kpi .v{font-size:24px;font-weight:700;color:var(--ink);line-height:1.1}
  .kpi .v small{font-size:var(--fs-11);font-weight:600;color:var(--mut)}
  .kpi .k{font-size:var(--fs-10);font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin-top:4px}
  .sect{font-size:var(--fs-105);font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
  ul.gaps{margin:0;padding-left:18px;font-size:12.5px;color:var(--mut);line-height:1.6}
  ul.gaps li{margin:0 0 3px}
  .distbar{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--line);margin:0 0 8px}
  .distbar i{display:flex;align-items:center;justify-content:center;color:#fff;font-size:var(--fs-11);font-weight:700}
  .cov{display:flex;align-items:center;gap:8px}
  .cov .t{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;max-width:120px}
  .cov .t i{display:block;height:100%;background:var(--green)}
  
  /* ── responsive chrome: on a narrow screen the absolute toprow would collide, so drop it
     into normal flow and let it wrap (applies to every artifact that uses this chrome) ── */
  @media (max-width:760px){
    #art,#pm{padding:14px 18px 10px 42px}
    .nr-rail{width:24px}
  }

  /* ── responsive chrome ──────────────────────────────────────────────────────
     The toprow stacks when it does not fit, and the switch is DETECTED, not
     guessed: fitChrome() below measures the one-row layout and adds .stacked to
     the artifact root. Never hard-code a breakpoint for the chrome — see
     brand-guide.html, "Responsive chrome". Stacked order is brand row, then
     navigation, then working controls: where am I, what am I looking at, what
     can I change. ── */
  #art.stacked .toprow,#pm.stacked .toprow,#pw.stacked .toprow{
    position:static;top:auto;left:auto;right:auto;margin:0 0 12px;
    display:flex;flex-wrap:wrap;justify-content:flex-start;align-items:center;gap:10px 12px}
  #art.stacked .tags,#pm.stacked .tags,#pw.stacked .tags{display:contents}
  /* only the brand pill bleeds out onto the navy rail — that is why it is
     border-radius:0 9px 9px 0. The negative margin is given back as padding, so
     its right edge does not move and no sibling shifts. */
  #art.stacked .nr-pill,#pm.stacked .nr-pill,#pw.stacked .nr-pill{
    order:1;margin-left:calc(-1 * var(--padl,0px));padding-left:calc(14px + var(--padl,0px))}
  /* no text in an artifact is ever cut to make it fit: the lens badge wraps, it
     does not ellipsise. An instrument that truncates it looks fine to a gate and
     wrong to a client. */
  #art.stacked .nr-track,#pm.stacked .nr-track,#pw.stacked .nr-track{
    order:2;max-width:none;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
  #art.stacked .ctrls,#pm.stacked .ctrls,#pw.stacked .ctrls{
    order:3;flex:1 1 100%;display:flex;flex-wrap:wrap;justify-content:flex-start;gap:8px}
  /* a shell whose view switch sits straight in the toprow, with no .ctrls group */
  #art.stacked .toprow>.seg,#pm.stacked .toprow>.seg,#pw.stacked .toprow>.seg{order:3;flex:1 1 100%}
  #art.stacked .seg,#pm.stacked .seg,#pw.stacked .seg{flex-wrap:wrap;max-width:100%}
  #art.stacked .wgrp,#pm.stacked .wgrp,#pw.stacked .wgrp{
    order:4;flex:1 1 100%;flex-wrap:wrap;gap:8px}
  #art.stacked #save,#art.stacked #lock,#pm.stacked #save,#pm.stacked #lock,
  #pw.stacked #save,#pw.stacked #lock{order:4}
  /* the narrow-screen media query keeps only what it was really for: padding and
     rail width on a phone. Chrome layout is no longer its business. */
  @media (max-width:760px){
    #art.stacked,#pm.stacked,#pw.stacked{padding:14px 18px 10px 42px}
    #art.stacked .nr-rail,#pm.stacked .nr-rail,#pw.stacked .nr-rail{width:24px}
  }
</style><style id="nr-finish">
/* == THE DECK FINISH (patch_finish.py) == one look across the toolkit: the same base size as a deck
   in the same window, the quiet subtitle, light grey cards for ideas, icons from the house set.
   Written with an html prefix so it wins over the template's own rules wherever they sit. */
html{--srf:#F7F9FB;--srf-line:#E4E9EF;--sh-soft:0 1px 2px rgba(16,24,40,.05);--subt:#5E718B}
html [data-t="dark"]{--srf:#1E2937;--srf-line:#2C3947;--sh-soft:0 1px 2px rgba(0,0,0,.35);--subt:#9FB1C8}
html .subt{font-size:max(15px,calc(var(--nr-t,14px) * 1.22));font-weight:400;color:var(--subt)}
/* the title follows the deck where the deck's title is the larger one (a window above about 1615 x 909);
   below that every instrument keeps its own title, including the ones that shrink it to fit */
@media (min-width:1615px) and (min-height:909px){html h1{font-size:calc(var(--nr-t,15.14px) * 1.85)}}
html :is(.card,.kpi,#pw .tcard,.plan,.findings,.acard,.t-dept .nc,.t-team.in .nc,.blk.boxed,.conc-so,.node.l3){background:var(--srf);border-color:var(--srf-line);border-radius:14px;box-shadow:var(--sh-soft)}
/* the templates paint their dark cards from #art[data-t="dark"] rules; the finish wins over those */
html [data-t="dark"]:is(#art,#pw,#pm) :is(.card,.kpi,#pw .tcard,.plan,.findings,.acard,.t-dept .nc,.t-team.in .nc,.blk.boxed,.conc-so,.node.l3){background:var(--srf);border-color:var(--srf-line)}
html :is(.blk.boxed,.conc-so){border:1px solid var(--srf-line)}
html .ic{width:1.2em;height:1.2em;fill:var(--navy);flex:none;vertical-align:-.24em;margin-right:.4em}
html [data-t="dark"] .ic{fill:#93A9C4}
@media print{html{--sh-soft:0 0 0 transparent}}
</style>
<script id="nr-finish-js">
/* == ONE TYPE SIZE PER WINDOW (patch_finish.py) == the deck's base size for this window, published
   on <html> before any fit runs, and nrZ() for the fit caps. Never below the instrument's own 14px. */
(function(){
  function deck(){var W=window.innerWidth||1600,H=window.innerHeight||900;
    return Math.max(11,Math.min(20,H/60,(W-138)/97.5));}
  function ui(){return Math.max(14,deck());}

<style>

  .nrsrc-it a,.nrsrc-how a{color:var(--accent-text,#1F5FA8);font-size:12px;text-decoration:none}
  .nrsrc-o{display:inline-block;font-size:var(--fs-105);font-weight:650;border-radius:10px;padding:0 7px;margin-left:4px;vertical-align:1px}

  [data-t="dark"] .nrsrc-it a,[data-t="dark"] .nrsrc-how a{color:#9CC4F2}

    font:500 13px/1.4 -apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;color:var(--ink,#15243A);background:var(--card,#fff);box-shadow:0 14px 34px -10px rgba(11,35,71,.28);
    opacity:0;transform:translateY(6px) scale(.97);transition:opacity .28s ease,transform .32s cubic-bezier(.2,.9,.25,1.15);pointer-events:none}
  .nrsrc-hint.on{opacity:1;transform:none;pointer-events:auto}
  .nrsrc-hint .nrsrc-ic{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin:0 1px;vertical-align:-2px;border-radius:50%;border:1px solid currentColor;font:italic 700 10px/1 Georgia,serif}

<script>
(function(){
  var GROUPS=[['interviews','Interviews'],['observations','Observations'],['documents','Documents'],['data','Data'],['external','External sources'],['internal','Internal discussions']];
  var NOUN={interviews:['interview','interviews'],observations:['observation','observations'],documents:['document','documents'],data:['data extract','data extracts'],external:['external source','external sources']};
  var SPECS={}, pop=null, cur=null;
  function P(){ try{ return (typeof DATA!=='undefined'&&DATA&&DATA.sourcePanel)||null; }catch(e){ return null; } }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function low(t){ t=String(t||''); return /^[A-Z][a-z]*(?=[\s,.;:-]|$)/.test(t)?t.charAt(0).toLowerCase()+t.slice(1):t; }   /* EventHub stays EventHub */
  function plain(t){ return String(t||'').replace(/\*\*/g,'').replace(/<[^>]+>/g,''); }
  function working(){ var p=P(); return !!(p&&p.build==='working'); }
  function root(){ return document.querySelector('#art,#pm,#pw')||document.body; }
  function href(e){ var p=P(); if(e.url) return e.url; if(e.file&&p&&p.rootRel!=null) return (p.rootRel?p.rootRel+'/':'')+e.file.split('/').map(encodeURIComponent).join('/'); return ''; }
  function badge(s){ if(s.badge==null&&s.score==null) return '';
    var r=s.rag||'na', txt=s.badge!=null?s.badge:(s.score+' out of 5');
    return '<span class="nrsrc-sc" style="color:var(--rag-'+r+'-text);background:var(--tint-'+r+')">'+esc(txt)+'</span>'; }
  /* every source an item rests on: an analysis gives its method and what it was built from */
  function expand(ids){ var p=P(), S=p.src, pool=[], how=[], seen={};
    (function walk(list,top){ (list||[]).forEach(function(k){ var e=S[k]; if(!e||seen[k]) return; seen[k]=1;
      if(e.group==='analysis'){ how.push({k:k,e:e}); walk(e.builtFrom,false); } else pool.push({k:k,e:e}); }); })(ids,true);
    return {pool:pool,how:how}; }
  function summary(pool){ var n={}, one={}; pool.forEach(function(x){ var g=x.e.group; if(g==='internal') return; n[g]=(n[g]||0)+1; one[g]=x.e; });
    var parts=[]; ['interviews','observations','documents','data','external'].forEach(function(g){ if(!n[g]) return;
      if(n[g]===1&&(g==='documents'||g==='data')) parts.push('the '+low(one[g].label)); else parts.push(n[g]+' '+NOUN[g][n[g]===1?0:1]); });
    if(!parts.length) return '';
    return 'Based on '+(parts.length>1?parts.slice(0,-1).join(', ')+' and '+parts[parts.length-1]:parts[0])+'.'; }
  function who(e){ var w=working(); if(w&&e.people&&e.label.indexOf(e.people.split(/[;,]/)[0].trim())<0) return e.people; return ''; }
  function item(x){ var e=x.e, w=working(), h=w?href(e):(e.url||'');
    return '<div class="nrsrc-it">'+esc(e.label)+(who(e)?' <span class="nrsrc-d">· '+esc(who(e))+'</span>':'')+(e.date?' <span class="nrsrc-d">· '+esc(e.date)+'</span>':'')+
      (w&&e.group==='external'&&e.origins&&e.origins.length?e.origins.map(function(o){return o==='thirdparty'||o==='internet'?'<span class="nrsrc-o '+o+'">'+(o==='thirdparty'?'Third party':'Internet')+'</span>':'';}).join(''):'')+
      (w?' <span class="nrsrc-id">'+esc(x.k)+'</span>':'')+(h?' <a href="'+esc(h)+'" target="_blank" rel="noopener">open</a>':'')+'</div>'; }
  function body(s){ var p=P(), w=working(), ids=s.ids||[], h='';
    h+='<div class="nrsrc-hx"><div class="nrsrc-ey"><span>'+esc(s.eyebrow||'')+'</span>'+badge(s)+'</div>'+
       '<button type="button" class="nrsrc-x" aria-label="Close">&times;</button></div><div class="nrsrc-bd">';
    if(!ids.length){ return h+'<div class="nrsrc-warn">No source yet. Unlock the page and pick one where you score it. Without a source this score cannot go into the client build.</div></div>'; }
    var x=expand(ids), sm=summary(x.pool);
    if(sm) h+='<p class="nrsrc-sum">'+esc(sm)+'</p>';

    {key:"benchmark",            label:"Benchmark or desk research", group:"Outside the toolkit", settles:"an outside reference point"}
  ];
  var INSTRUMENTS=(DATA.catalogue&&DATA.catalogue.length)?DATA.catalogue:FALLBACK;

  /* The eight shapes a designed analysis takes. They are not a menu to pick from: each one says what
     the spec has to pin down, which is what makes a custom analysis commissionable rather than a wish. */
  var ARCHETYPES=[
    {key:"",            label:"Pick the shape of the analysis", q:""},
    {key:"sample-code", label:"Sample and code",            q:"How often does it happen, and what kind is it? Pin down the frame, the sample, the coding scheme agreed before coding starts, and who settles a disagreement."},
    {key:"segment",     label:"Segment and compare",        q:"Is it everywhere, or concentrated? Pin down the measure, the split, the period, and the difference you would call material."},
    {key:"decompose",   label:"Decompose a number",         q:"Where does the total come from? Pin down the source, the bridge steps in order, the residual you accept, and the period compared."},
    {key:"trace",       label:"Trace the unit end to end",  q:"Where does the work stop, and for how long? Pin down the unit, how many are traced and how chosen, every timestamp and its source, and what counts as waiting."},
    {key:"observe",     label:"Observe in place",           q:"What happens where no system records it? Pin down what is observed and against which standard, the checklist fixed before the first visit, and the sites, days and times."},
    {key:"reconcile",   label:"Reconcile two sources",      q:"Which number is right, and how big is the gap? Pin down the two sources and their owners, the key they join on, the period, and how each difference is classified."},
    {key:"elicit",      label:"Elicit and aggregate",       q:"What is the picture where no data exists? Pin down who is asked and why they are the right population, the fixed question set, how answers aggregate, and what you will not claim from self-report."},
    {key:"model",       label:"Model the what-if",          q:"How big would this be if it were true? Pin down three to five drivers, every assumption with its source, a range rather than a point, and the input the answer is most sensitive to."},
    {key:"other",       label:"Other, and the method carries it", q:"None of the eight fits. The method field then has to carry the whole design, step by step, because nothing else will."}
  ];
  function ARCH(k){for(var i=0;i<ARCHETYPES.length;i++)if(ARCHETYPES[i].key===k)return ARCHETYPES[i];return null;}
  var KINDS=[{key:"standard",label:"A standard instrument"},
             {key:"variant", label:"A standard instrument, run differently"},
             {key:"custom",  label:"An analysis we design"}];
  /* an archetype of "other" means the eight shapes did not fit, so the method has to carry the design */
  function methodSteps(t){return String(t||"").split(/\u00b7|;|\n/).map(function(x){return x.trim();})
    .filter(function(x){return x.length>3;}).length;}
  /* a designed analysis is admissible only when every one of these is filled */
  var CUSTOM_FIELDS=[["name","a name for the analysis"],["archetype","an archetype"],["unit","the unit of analysis"],
    ["population","the population and sample"],["source","where the raw material comes from"],["method","the method"],
    ["output","the exhibit it produces"],["effort","the effort it takes"],
    ["whyNotStandard","why no standard instrument reaches this"]];

  function INSTR(k){if(!k)return null;for(var i=0;i<INSTRUMENTS.length;i++)if(INSTRUMENTS[i].key===k)return INSTRUMENTS[i];return null;}
  /* An analysis is a house instrument, a house instrument run differently, or one we design.
     kind is absent on older captures, so a bare instrument key still reads as standard. */
  function tKind(n){var t=n.test||{};return t.kind||(t.instrument?"standard":"");}
  function anName(n){var t=n.test||{};
    if(t.kind==="custom") return (t.custom&&t.custom.name)||"(unnamed analysis)";
    var i=INSTR(t.instrument); return i?i.label:"";}
  function anSub(n){var t=n.test||{};
    if(t.kind==="custom"){var a=ARCH((t.custom||{}).archetype);
      return (a&&a.key?a.label:"no archetype")+(t.scope?" \u00b7 "+t.scope:"");}
    if(t.kind==="variant") return t.variantNote||"run differently";
    return t.scope||"";}
  function anCls(n){var t=n.test||{},k=tKind(n);
    if(!k) return "none";
    if(k==="custom") return "cust";
    var i=INSTR(t.instrument); if(!i) return "none";
    return (i.group==="Outside the toolkit"?"out":"")+(i.status==="envisioned"?" env":"");}
  function anChip(n){var k=tKind(n);
    if(!k) return '<span class="tchip none">Not yet assigned</span>';
    return '<span class="tchip '+anCls(n)+'">'+esc(anName(n))+
      (k==="variant"?'<i class="vt">variant</i>':'')+
      (k==="custom"?'<i class="vt">designed</i>':'')+'</span>';}

  /* A deterministic starting point, not a recommendation: it reads the words the consultant
     used and offers the instrument that usually settles that kind of claim. Template fill,
     never AI. Claude proposes properly during the session. */
  /* ---------- helpers ---------- */
  function esc(t){return String(t==null?'':t).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function hl(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1</span>');}
  var uid=1; function nid(){return "n"+(uid++);}
  function isLeaf(n){return !n.children||!n.children.length;}
  function walk(ns,lv,fn,par){(ns||[]).forEach(function(n){fn(n,lv,par||null);walk(n.children,lv+1,fn,n);});}
  function flat(){var out=[];walk(DATA.children,1,function(n,lv,p){out.push({n:n,lv:lv,p:p});});return out;}
  function leaves(n){return isLeaf(n)?[n]:n.children.reduce(function(a,c){return a.concat(leaves(c));},[]);}
  function allLeaves(){return DATA.children.reduce(function(a,c){return a.concat(leaves(c));},[]);}
  function maxDepth(){var m=1;walk(DATA.children,1,function(n,lv){if(lv>m)m=lv;});return Math.max(3,m);}
  function findNode(id){var r=null;walk(DATA.children,1,function(n){if(n.id===id)r=n;});return r;}
  function levelOf(id){var r=1;walk(DATA.children,1,function(n,lv){if(n.id===id)r=lv;});return r;}

  /* every coverage figure is computed over the hypotheses in play. reference.md section 13:
     Parked leaves the denominator, so parking neither flatters nor dents coverage. */
  function inPlay(ns){return ns.filter(function(l){return l.status!=="Parked";});}

  /* roll-up: a parent status is DERIVED from its leaf descendants, never entered */
  function rollup(n){
    var ls=inPlay(leaves(n));
    if(!ls.length) return {label:"Parked",counts:{},total:0};
    var c={};ls.forEach(function(l){c[l.status]=(c[l.status]||0)+1;});
    var ks=Object.keys(c),label;
    if(ks.length===1) label=ks[0];
    else if(c["Confirmed"]||c["Partially confirmed"]||c["Rejected"]) label="Partially confirmed";
    else if(c["In progress"]) label="In progress";
    else label="To investigate";
    return {label:label,counts:c,total:ls.length};
  }

  /* ---------- MECE: a property of a sibling set, not of the tree ---------- */
  function siblingSets(){
    var sets=[{parent:null,key:"__root__",level:0,text:DATA.problem.statement,children:DATA.children}];
    walk(DATA.children,1,function(n,lv){ if(n.children&&n.children.length)
      sets.push({parent:n,key:n.id,level:lv,text:n.text,children:n.children}); });
    return sets;
  }
  function setOf(n){var ss=siblingSets();for(var i=0;i<ss.length;i++)if(ss[i].parent===n)return ss[i];return null;}
  function meceOf(set){var h=set.parent||DATA.problem;if(!h.mece)h.mece={me:"",ce:"",note:"",technique:"",basis:""};return h.mece;}
  function meceState(set){var m=meceOf(set);if(!m.me||!m.ce)return "Not challenged";
    return (m.me==="no"||m.ce==="no")?"Gaps found":"Holds";}

  /* structure only, no judgement. Passing every flag means the set is well formed, NOT that
     it is MECE. reference.md section 11 draws that line. */
  var STOP={};("the a an and or of to in for on with is are not by our we do does no that this than as at from into per across within their its it be been has have").split(" ").forEach(function(w){STOP[w]=1;});
  function toks(t){return String(t||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(function(w){return w.length>3&&!STOP[w];});}
  function jaccard(a,b){
    var A={},B={},i=0,u=0;
    a.forEach(function(x){A[x]=1;}); b.forEach(function(x){B[x]=1;});
    Object.keys(A).forEach(function(k){u++;if(B[k])i++;});
    Object.keys(B).forEach(function(k){if(!A[k])u++;});
    return u?i/u:0;
  }
  function subDepth(n){return isLeaf(n)?0:1+Math.max.apply(null,n.children.map(subDepth));}
  function setFlags(set){
    var f=[],k=set.children,n=k.length,i,j;
    if(n===1) f.push({sev:"warn",t:"Only one child, so this is a restatement rather than a cut. Split it, or collapse it into the parent."});
    if(n>7)   f.push({sev:"warn",t:n+" children. A cut this wide is rarely mutually exclusive, so group them into three to five branches."});
    for(i=0;i<n;i++) for(j=i+1;j<n;j++){
      var a=k[i].text||"",b=k[j].text||"";
      if(!a||!b) continue;
      if(a.trim().toLowerCase()===b.trim().toLowerCase()) f.push({sev:"warn",t:"Children "+(i+1)+" and "+(j+1)+" are identical."});
      else if(jaccard(toks(a),toks(b))>=0.45) f.push({sev:"warn",t:"Children "+(i+1)+" and "+(j+1)+" share most of their wording, so they probably overlap."});
    }
    var d=k.map(subDepth);
    if(n>1&&Math.max.apply(null,d)-Math.min.apply(null,d)>=2)
      f.push({sev:"info",t:"Siblings sit at very different altitudes. One branch is decomposed two levels further than another."});
    k.forEach(function(c,idx){
      var w=String(c.text||"").trim().split(/\s+/).filter(Boolean).length;
      if(!c.text) f.push({sev:"warn",t:"Child "+(idx+1)+" has no text yet."});
      else if(w<5) f.push({sev:"info",t:"Child "+(idx+1)+" reads as a label, not a testable statement."});
      if(isLeaf(c)){
        if(!c.dataNeeded) f.push({sev:"info",t:"Child "+(idx+1)+" has no data need, so it is not yet testable."});
        if(!(c.test||{}).instrument) f.push({sev:"info",t:"Child "+(idx+1)+" has no analysis behind it. Nothing planned would settle it."});
        if(VERDICTS.indexOf(c.status)>=0&&!c.findings) f.push({sev:"warn",t:"Child "+(idx+1)+" carries a verdict with no findings."});
      }
    });
    return f;
  }

  /* ---------- VIEW 1: the tree ---------- */
  var COLS=[{key:"status",label:"Status",w:150},{key:"priority",label:"Priority",w:86},
            {key:"test",label:"How we test it",w:210,flex:1},{key:"findings",label:"What we found",w:250,flex:2}];
  /* NODE_W[0] is the central hypothesis; the two text columns take the slack so the
     grid spans the frame instead of leaving a third of the page empty */
  var NODE_W=[300,240,250,260,250],GUT=32;
  function colTpl(c){return c.flex?("minmax("+c.w+"px,"+c.flex+"fr)"):(c.w+"px");}
  function testCell(n){
    if(!tKind(n)) return '<span class="dim">not yet assigned</span>';
    var sub=anSub(n);
    return anChip(n)+(sub?'<span class="tscope">'+esc(sub)+'</span>':'');
  }
  function renderTree(){
    var depth=maxDepth(),tpl=[NODE_W[0]+"px"],l;
    for(l=1;l<=depth;l++){ tpl.push(GUT+"px"); tpl.push(NODE_W[Math.min(l,4)]+"px"); }
    tpl.push("18px");
    COLS.forEach(function(c){tpl.push(colTpl(c));});
    function gcol(lv){return 1+lv*2;}
    var metaStart=3+depth*2;
    var row=2,placed=[];
    (function assign(ns,lv){ ns.forEach(function(n){ var span=Math.max(1,leaves(n).length),start=row;
      if(isLeaf(n)) row+=1; else assign(n.children,lv+1);
      placed.push({n:n,lv:lv,start:start,span:span}); }); })(DATA.children,1);
    var total=Math.max(1,row-2),h="";
    h+='<div class="hcell" style="grid-column:1;grid-row:1">L0 · Central hypothesis</div>';
    for(l=1;l<=depth;l++){
      h+='<div class="hcell" style="grid-column:'+gcol(l)+';grid-row:1">'+(l===1?"L1 · Dimension":"L"+l)+'</div>';

    COLS.forEach(function(c,i){h+='<div class="hcell" style="grid-column:'+(metaStart+i)+';grid-row:1">'+c.label+'</div>';});
    for(var r=0;r<total;r++) h+='<div class="band" style="grid-row:'+(r+2)+'"></div>';
    /* L0: the central hypothesis, one box spanning every row, the thing the tree breaks down */
    h+='<div class="node l0" data-id="__L0" style="grid-column:1;grid-row:2/span '+total+'">'+
       '<div class="lv"><span>L0 · '+DATA.children.length+' dimension'+(DATA.children.length===1?'':'s')+'</span></div>'+
       '<div class="txt">'+esc(DATA.problem.statement||"(no central hypothesis yet)")+'</div>'+
       (DATA.problem.subline?'<div class="dec">'+esc(DATA.problem.subline)+'</div>':'')+
       
       '</div>';
    placed.forEach(function(p){
      var n=p.n,leaf=isLeaf(n),roll=leaf?null:rollup(n),inner="",flag="";
      
      inner+='<div class="lv">'+flag+'<span>L'+p.lv+(leaf?"":" · "+leaves(n).length+" sub")+'</span></div>';
      inner+='<div class="txt">'+esc(n.text||"(untitled)")+'</div>';
      
      if(roll&&roll.total){
        var segs=STATUSES.filter(function(s){return roll.counts[s.k];}).map(function(s){
          return '<i style="background:var('+s.v+');width:'+(roll.counts[s.k]/roll.total*100)+'%"></i>';}).join("");
        inner+='<div class="roll"><div class="bar">'+segs+'</div><span class="lbl">'+roll.label+'</span></div>';
      }
      h+='<div class="node l'+Math.min(p.lv,4)+'" data-id="'+n.id+'" style="grid-column:'+gcol(p.lv)+
         ';grid-row:'+p.start+'/span '+p.span+'">'+inner+'</div>';
    });
    placed.filter(function(p){return isLeaf(p.n);}).forEach(function(p){
      COLS.forEach(function(c,i){
        var n=p.n,v;
        if(c.key==="status") v='<span class="pill '+S(n.status).c+'">'+n.status+'</span>';
        else if(c.key==="priority") v=n.priority?'<span class="prio '+n.priority+'">'+n.priority+'</span>':'';
        else if(c.key==="test") v=testCell(n);
        else v=n[c.key]?esc(n[c.key]):'';
        /* a finding that cites shows its sources (an empty list: a red ! in the working copy) */
        if(c.key==="findings"&&window.NRSRC) v+=NRSRC.item(n,n.text||'Finding',{k:'hyp:'+n.id,optional:true});
        h+='<div class="mcell'+(c.key==="findings"?' nrsrc-row':'')+'" style="grid-column:'+(metaStart+i)+';grid-row:'+p.start+'">'+v+'</div>';
      });
    });
    return '<div class="twrap"><svg class="wires" id="wires"></svg><div class="tgrid" id="tgrid" style="grid-template-columns:'+tpl.join(" ")+'">'+h+'</div></div>';
  }
  function drawWires(){
    var wrap=document.querySelector(".twrap"),grid=document.getElementById("tgrid"),svg=document.getElementById("wires");
    if(!wrap||!grid||!svg) return;
    svg.setAttribute("width",wrap.scrollWidth);svg.setAttribute("height",wrap.scrollHeight);
    svg.setAttribute("viewBox","0 0 "+wrap.scrollWidth+" "+wrap.scrollHeight);
    /* LAYOUT units, not client rects: the frame is scaled by the fit and the zoom, so a
       getBoundingClientRect delta is s times too large and the wires drift off the nodes.
       offsetLeft/offsetTop ignore the transform, and the svg viewBox is in the same units. */
    function rect(id){var el=grid.querySelector('.node[data-id="'+id+'"]');if(!el)return null;
      var ox=grid.offsetLeft,oy=grid.offsetTop;
      return {l:el.offsetLeft+ox,r:el.offsetLeft+ox+el.offsetWidth,cy:el.offsetTop+oy+el.offsetHeight/2};}
    /* the token lives on #art, so read it from #art: getComputedStyle(documentElement) returns
       nothing here and silently falls back to a light-mode grey */
    var stroke=getComputedStyle(document.getElementById("art")).getPropertyValue("--line").trim()||"#E1E6EE";
    var p="";
    (function(){
      var pr=rect("__L0"); if(!pr) return;
      var kids=DATA.children.map(function(c){return rect(c.id);}).filter(Boolean);
      if(!kids.length) return;
      var mid=pr.r+GUT/2;
      p+="M"+pr.r+","+pr.cy+" H"+mid+" ";
      var top=Math.min.apply(null,kids.map(function(k){return k.cy;})),bot=Math.max.apply(null,kids.map(function(k){return k.cy;}));
      p+="M"+mid+","+top+" V"+bot+" ";
      kids.forEach(function(k){p+="M"+mid+","+k.cy+" H"+k.l+" ";});
    })();
    walk(DATA.children,1,function(n){
      if(isLeaf(n)) return;
      var pr=rect(n.id); if(!pr) return;
      var kids=n.children.map(function(c){return rect(c.id);}).filter(Boolean);
      if(!kids.length) return;
      var mid=pr.r+GUT/2;
      p+="M"+pr.r+","+pr.cy+" H"+mid+" ";
      var top=Math.min.apply(null,kids.map(function(k){return k.cy;})),bot=Math.max.apply(null,kids.map(function(k){return k.cy;}));
      p+="M"+mid+","+top+" V"+bot+" ";
      kids.forEach(function(k){p+="M"+mid+","+k.cy+" H"+k.l+" ";});
    });

  }

  /* ---------- VIEW 2: the test plan ---------- */
  /* One flat row per hypothesis. No grouping and no spanning cell: the analysis is a
     chip in its own column, which repeats, and the order is the order to run them in.
     The data column is the point of the view — it is the extract to request. */
  function planRows(){
    var P={High:0,Medium:1,Low:2,"":3};
    return inPlay(allLeaves()).slice().sort(function(a,b){
      var d=P[a.priority]-P[b.priority]; if(d) return d;
      return (anName(a)||"zz").localeCompare(anName(b)||"zz");});
  }
  function renderPlan(){
    var rows=planRows().map(function(n){
      var t=n.test||{};
      var sub=anSub(n);
      return '<tr><td class="an">'+anChip(n)+(sub?'<span class="sc">'+esc(sub)+'</span>':'')+'</td>'+
        '<td class="hy">'+esc(n.text||"(untitled)")+
          (t.settles?'<span class="se">Settles it by: '+esc(t.settles)+'</span>':'')+'</td>'+
        '<td class="dn">'+(n.dataNeeded?esc(n.dataNeeded):'<span class="dim">not stated</span>')+'</td>'+
        '<td class="pr">'+(n.priority?'<span class="prio '+n.priority+'">'+n.priority+'</span>':'')+'</td>'+
        '<td class="st"><span class="pill '+S(n.status).c+'">'+n.status+'</span></td></tr>';
    }).join("");
    return '<table data-stretch class="plantbl"><thead><tr><th>Analysis</th><th>Hypothesis</th>'+
      '<th>What we need to run it</th><th>Priority</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }

  /* ---------- VIEW 3: coverage ---------- */
  /* ---------- the payload, normalised so a partial capture still renders ---------- */
  function normalise(n){
    n.id=n.id||nid();
    ["text","status","priority","rationale","dataNeeded","findings","statusAt","statusBy"].forEach(function(k){if(n[k]==null)n[k]="";});
    if(!n.status) n.status="To investigate";
    if(!n.test||typeof n.test!=="object") n.test={};
    ["instrument","scope","teamId","settles","kind","variantNote"].forEach(function(k){if(n.test[k]==null)n.test[k]="";});
    if(!n.test.kind&&n.test.instrument) n.test.kind="standard";
    if(!n.test.custom||typeof n.test.custom!=="object") n.test.custom={};
    CUSTOM_FIELDS.forEach(function(f){if(n.test.custom[f[0]]==null)n.test.custom[f[0]]="";});
    if(n.mece&&typeof n.mece==="object"){["technique","basis"].forEach(function(k){if(n.mece[k]==null)n.mece[k]="";});}
    n.children=Array.isArray(n.children)?n.children:[];
    n.children.forEach(normalise);
  }
  if(!DATA.problem) DATA.problem={statement:"",subline:"",mece:{me:"",ce:"",note:"",technique:"",basis:""}};
  if(!DATA.problem.mece) DATA.problem.mece={me:"",ce:"",note:"",technique:"",basis:""};
  ["technique","basis"].forEach(function(k){if(DATA.problem.mece[k]==null)DATA.problem.mece[k]="";});
  DATA.children=DATA.children||[];
  DATA.children.forEach(normalise);
  (function(){var m=0;walk(DATA.children,1,function(n){var k=parseInt(String(n.id).replace(/\D/g,""),10);if(k>m)m=k;});uid=m+1;})();

  /* ---------- chrome, the canonical shell ---------- */
  var VIEWS={tree:renderTree,plan:renderPlan},cur="tree";
  document.getElementById('ctx').textContent=DATA.context||'OPEX QUICKSCAN';
  document.getElementById('lens').textContent=DATA.lens||'CROSS-CUTTING · HYPOTHESIS TREE';
  document.getElementById('title').innerHTML=hl(DATA.keyMessage||'');
  document.getElementById('src').innerHTML=DATA.source?('<b style="color:var(--txt)">Source:</b> '+esc(DATA.source)):'';
  /* the problem statement is the L0 node in the tree, so nothing is painted under the title */
  function paintFoot(){
    var inUse={};allLeaves().forEach(function(l){inUse[l.status]=1;});
    flat().forEach(function(x){if(!isLeaf(x.n))inUse[rollup(x.n).label]=1;});
    document.getElementById('lg').innerHTML='<b style="color:var(--txt);margin-right:4px">Legend:</b>'+
      STATUSES.filter(function(s){return inUse[s.k];}).map(function(s){
        return '<span class="lp" style="background:rgba(0,0,0,.04);color:var('+s.v+')">● '+s.k+'</span>';}).join("");
  }
  // Monotonic binary-search fit: largest scale whose content still fits the frame. Cannot overshoot.
  /* FIT is the scale at which the whole view fits the frame, and #vinner is widened to
     100/FIT% so that after scaling it lands exactly on the frame's width. Z multiplies it,
     so Fit is Z=1 and zooming in overflows a frame you can then drag. */
  var FIT=1,Z=1,PX=0,PY=0,ZMIN=0.4,ZMAX=3;
  function fitView(){var v=document.getElementById('view'),vi=document.getElementById('vinner');var ah=v.clientHeight;if(!ah)return;
    var st=vi.querySelector('[data-stretch]'); if(st)st.style.height='';
    vi.style.transform='none';var lo=0.25,hi=1.12*nrZ(),best=0.25;
    /* Height alone is not the constraint. The meta columns carry a min width, so in a frame
       narrower than that minimum the grid overflows its own container and the last column is
       CLIPPED rather than scrolled - which is why a scrollWidth check on the document never saw it.
       A candidate scale is accepted only when the content fits in both directions. */
    for(var k=0;k<12;k++){var s=(lo+hi)/2;vi.style.width=(100/s)+'%';

<script>
/* ── fitChrome() — the chrome stacks when it does not fit ────────────────────
   Measures the one-row layout and adds .stacked to the artifact root when any of
   six things is true: the two groups are closer than 12px · a control runs past
   either edge · a label has been squeezed narrower than its own text · the
   toprow wraps · the toprow comes within 6px of the action title · the viewport
   is at or below 760px (the floor). Exposed as window.fitChrome() so a render
   pass can call it after it changes a label. ── */
(function(){
  var busy=false,lastW=-1;
  function root(){return document.querySelector('#art,#pm,#pw');}
  function skip(e){
    if(!e) return true;
    if(e.id==='wpop'||(e.closest&&e.closest('#wpop'))) return true;
    var cs=getComputedStyle(e);
    if(cs.visibility==='hidden'||cs.display==='none') return true;
    return false;
  }
  function fitChrome(){
    if(busy) return; busy=true;
    try{
      var R=root(); if(!R) return;
      var tr=R.querySelector('.toprow'); if(!tr) return;
      R.classList.remove('stacked');
      void tr.offsetWidth;                                  /* force the reflow we measure */
      var need=window.innerWidth<=760, i, r, e;
      var trb=tr.getBoundingClientRect();
      /* 1. the two groups are closer than 12px */
      var tags=R.querySelector('.tags'), ctrls=R.querySelector('.ctrls');
      if(!need&&tags&&ctrls&&!skip(tags)&&!skip(ctrls)){
        var a=tags.getBoundingClientRect(), b=ctrls.getBoundingClientRect();
        if(b.left-a.right<12) need=true;
      }
      /* 2. a control runs past either edge */
      if(!need){
        var kids=tr.querySelectorAll('.nr-pill,.nr-track,.seg,.wgrp,button,#wnote');
        for(i=0;i<kids.length;i++){
          e=kids[i]; if(skip(e)) continue;
          r=e.getBoundingClientRect(); if(!r.width&&!r.height) continue;
          if(r.right>trb.right+0.5||r.left<trb.left-0.5){need=true;break;}
        }
      }
      /* 3. a label has been squeezed narrower than its own text */
      if(!need){
        var ls=tr.querySelectorAll('.nr-pill b,.nr-track,.seg button,button,#wnote,span');
        for(i=0;i<ls.length;i++){
          e=ls[i]; if(skip(e)) continue;
          if(!e.textContent||!e.textContent.trim()) continue;
          if(e.scrollWidth>e.clientWidth+1){need=true;break;}
        }
      }
      /* 4. the toprow wraps — a floating row that wraps grows downwards into the
         title without pushing anything down */
      if(!need){
        var tall=0,ch=tr.children;
        for(i=0;i<ch.length;i++){var h=ch[i].getBoundingClientRect().height;if(h>tall)tall=h;}
        if(trb.height>tall+2) need=true;
      }
      /* 5. the toprow sits on, or within 6px of, the action title */
      if(!need){
        var t=R.querySelector('.nr-strip'); if(!t||skip(t)) t=R.querySelector('h1');
        if(t&&!skip(t)){var tb=t.getBoundingClientRect(); if(tb.top-trb.bottom<6) need=true;}
      }
      if(need) R.classList.add('stacked');
      /* --padl is read AFTER the class lands: the class itself changes the padding */
      R.style.setProperty('--padl',(parseFloat(getComputedStyle(R).paddingLeft)||0)+'px');
    } finally { busy=false; }
  }
  window.fitChrome=fitChrome;
  function kick(){requestAnimationFrame(fitChrome);}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',kick); else kick();
  window.addEventListener('load',kick);
  window.addEventListener('resize',function(){lastW=-1;kick();});
  if(window.ResizeObserver){
    var ro=new ResizeObserver(function(en){
      var w=en&&en[0]?Math.round(en[0].contentRect.width):-1;
      if(w===lastW) return;                                 /* stacking must not re-trigger us */
      lastW=w; kick();
    });
    var r0=root(); if(r0) ro.observe(r0);
  }
})();
</script>
