<!doctype html>
<!-- ============================================================================
  ORG BASELINE — interactive org-tree artifact (org-baseline instrument)
  Chrome = the canonical editable artifact shell (artifact-shell-editable.html):
  navy rail, NR pill + track chip, action-title h1, subrow, view/theme segs,
  source+legend footer. Only the view body (the org tree) is instrument-specific.
  render_org.py emits TWO builds: the client org-baseline.html (edit fences
  stripped, zero editor references; the only file you SEND) and
  org-baseline.WORKING.html (lock-by-default editing; exports a names-based delta
  for apply_org_delta.py). The browser never mints a persisted ID and never
  writes the capture. Only the /* DATA */ block changes per engagement.
============================================================================ -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Org Baseline · Nova Reperta</title>
<style>
/* Type scale — one place, not case by case. Every size below 12px is a token; the
   whole small end lifts on a narrow screen so nothing drops under 11px on a phone. */
:root{
  --fs-65:6.5px; --fs-7:7px; --fs-75:7.5px; --fs-8:8px; --fs-85:8.5px; --fs-9:9px;
  --fs-95:9.5px; --fs-10:10px; --fs-105:10.5px; --fs-11:11px; --fs-115:11.5px;
}
@media (max-width:760px){
  :root{
    --fs-65:11px; --fs-7:11px; --fs-75:11px; --fs-8:11px; --fs-85:11px; --fs-9:11px;
    --fs-95:11px; --fs-10:11.5px; --fs-105:12px; --fs-11:12px; --fs-115:12.5px;
  }
}
</style>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}
  /* ===== BRAND THEME (inlined from assets/brand.css — canonical values) ===== */
  #art{--navy:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;
      --slate-10:rgba(54,65,86,.09);--navy-10:rgba(11,35,71,.10);--green-10:rgba(28,122,74,.10);--accent-10:rgba(110,177,209,.13);
      --rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;--rag-green-text:#2F8F6B;--rag-amber-text:#B97F22;--rag-red-text:#C2483D;--rag-na-text:#6B7480;--tint-green:rgba(47,143,107,.12);--tint-amber:rgba(212,154,58,.16);--tint-red:rgba(210,100,90,.13);--tint-na:rgba(154,164,176,.16);--navy-fill:#0B2347;--green-text:var(--green);
      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #art[data-t="dark"]{--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--navy-fill:#243246;--accent:#8FC7E8;--steel:#93A9C4;--rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;--rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;--tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);--green-text:#5FBF94;--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}
  body:has(#art[data-t="dark"]){--page:#0E1620}
  button{font-family:inherit;cursor:pointer;border:0;background:transparent}
  input,textarea,select{font-family:inherit;outline:none}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:3}
  .tags{display:flex;align-items:center;gap:11px;min-width:0}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)}
  .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:var(--fs-115);letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #art[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  .ctrls{display:flex;gap:9px;flex:none}
  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0;max-width:1300px}
  #art[data-t="dark"] h1{color:#EAEFF5}
  h1 .hl{color:var(--green)}
  h1 .km-empty{color:var(--mut);font-style:italic;font-weight:600;font-size:.75em}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 16px}
  .subt{font-size:15px;font-weight:600;color:var(--accent)}
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #canvas{position:absolute;inset:0;overflow:hidden}
  /* ===== ORG TREE (instrument-specific view body) ===== */
  .tree-wrap{display:flex;justify-content:center;min-width:max-content;position:relative;padding:14px 0 16px}
  .lines-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .tn{display:flex;flex-direction:column;align-items:center}
  .tn-children{display:flex;gap:10px;align-items:flex-start;padding-top:30px}
  .nc{border-radius:10px;padding:9px 13px;position:relative;min-width:140px;max-width:215px;
    transition:transform .1s,box-shadow .1s,outline-color .13s;border:2px solid transparent}
  .nc.sel{border-color:var(--accent)!important;box-shadow:0 0 0 3px rgba(110,177,209,.22)}
  .t-company .nc{background:var(--accent);min-width:180px}
  .t-company .n-name{font-size:14px;font-weight:700;color:var(--navy)}
  .t-company .n-fte{font-size:12px;color:var(--navy2);margin-top:3px}
  .t-company .n-sub{font-size:var(--fs-10);color:var(--slate);margin-top:4px;letter-spacing:.4px}
  .t-dept .nc{background:var(--card);border-color:var(--line)!important;box-shadow:var(--sh);--nr-tc:var(--navy);background-image:linear-gradient(color-mix(in srgb,var(--nr-tc) 11%,transparent),color-mix(in srgb,var(--nr-tc) 11%,transparent));border-radius:7px}
  .t-dept .n-name{font-size:12.5px;font-weight:700;color:var(--navy)}
  .t-dept .n-fte{font-size:var(--fs-11);color:var(--txt);margin-top:2px}
  .t-team.in .nc{background:var(--card);border-color:var(--line);box-shadow:var(--sh)}
  .t-team.out .nc{background:var(--slate-10);border-color:var(--line)}
  .t-team .n-name{font-size:12px;font-weight:700;color:var(--navy)}
  .t-team.out .n-name{color:var(--mut)}
  .t-team .n-fte{font-size:var(--fs-11);color:var(--txt);margin-top:2px}
  .t-team .n-desc{font-size:var(--fs-10);color:var(--mut);font-style:italic;margin-top:5px;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .n-mgr{display:flex;align-items:center;gap:5px;margin-top:4px}
  .t-team .n-mgr{font-size:var(--fs-10);color:var(--steel)}
  .t-team .n-pills{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
  .t-sub.in .nc{background:var(--green-10);border-color:rgba(28,122,74,.2)}
  .t-sub.out .nc{background:var(--slate-10);border-color:var(--line)}
  .t-sub .n-name{font-size:var(--fs-11);font-weight:700;color:var(--navy)}
  .t-sub.out .n-name{color:var(--mut)}
  .t-sub .n-fte{font-size:var(--fs-105);color:var(--txt);margin-top:2px}
  .t-sub .n-desc{font-size:var(--fs-95);color:var(--mut);font-style:italic;margin-top:4px;line-height:1.35}
  .t-sub .n-mgr{font-size:var(--fs-95);color:var(--steel);margin-top:3px;gap:4px}
  .t-ssub.in .nc{background:var(--accent-10);border-color:rgba(110,177,209,.3)}
  .t-ssub.out .nc{background:var(--slate-10);border-color:var(--line)}
  .t-ssub .n-name{font-size:var(--fs-105);font-weight:700;color:var(--navy)}
  .t-ssub.out .n-name{color:var(--mut)}
  .t-ssub .n-fte{font-size:var(--fs-10);color:var(--txt);margin-top:2px}
  .t-ssub .n-desc{font-size:var(--fs-9);color:var(--mut);font-style:italic;margin-top:4px;line-height:1.3}
  .t-ssub .n-mgr{font-size:var(--fs-9);color:var(--steel);margin-top:3px;gap:3px}
  .t-ssub .mgr-name{font-size:var(--fs-9)}
  .mgr-name{font-size:var(--fs-10);color:var(--steel)}
  .t-company .mgr-name{color:var(--navy2);font-size:var(--fs-105)}
  #art[data-t="dark"] .t-company .mgr-name{color:var(--txt)}
  .t-sub .mgr-name{font-size:var(--fs-95)}
  #art[data-t="dark"] .t-company .nc{background:var(--navy-fill)}
  #art[data-t="dark"] .t-company .n-name{color:var(--ink)}
  #art[data-t="dark"] .t-company .n-fte{color:var(--txt)}
  #art[data-t="dark"] .t-company .n-sub{color:var(--mut)}
  #art[data-t="dark"] .stat-n.g{color:var(--green-text)!important}
  #art[data-t="dark"] .t-dept .n-name,#art[data-t="dark"] .t-team .n-name,
  #art[data-t="dark"] .t-sub .n-name,#art[data-t="dark"] .t-ssub .n-name{color:#EAEFF5}
  .sc-badge{position:absolute;top:-8px;right:8px;font-size:var(--fs-85);font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:999px}
  .sc-in{background:var(--green);color:#fff}
  .sc-out{background:var(--mut);color:#fff}
  .ep{font-size:var(--fs-9);font-weight:600;padding:2px 6px;border-radius:999px}
  .ep-ext{background:rgba(110,177,209,.18);color:#2E5C8A}
  .ep-vac{background:var(--tint-amber);color:var(--rag-amber-text)}
  .ep-sick{background:var(--tint-red);color:var(--rag-red-text)}
  .ep-stu{background:var(--tint-na);color:var(--rag-na-text)}
  #art[data-t="dark"] .ep-ext{color:#A9D5E6}
  .n-scope-row{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
  .sc-in-sm{font-size:var(--fs-95);font-weight:700;background:var(--tint-green);color:var(--green-text);padding:2px 7px;border-radius:999px}
  .sc-out-sm{font-size:var(--fs-95);font-weight:700;background:var(--tint-na);color:var(--rag-na-text);padding:2px 7px;border-radius:999px}
  .compact .n-desc,.compact .n-mgr,.compact .n-pills,.compact .n-sub,.compact .n-scope-row{display:none}
  .compact .nc{min-width:110px;max-width:150px;padding:8px 11px}
  .compact .sc-badge{font-size:var(--fs-8);padding:1px 5px;right:6px}
  /* ===== TREE VIEWPORT: pan / zoom / collapse ===== */
  #canvas.grabbable{cursor:grab}
  #canvas.grabbing{cursor:grabbing}
  #canvas.grabbing .nc{pointer-events:none}
  .zoombox{display:flex;align-items:center;background:var(--slate-10);border-radius:999px;padding:3px;gap:1px}
  .zoombox button{font-size:13px;font-weight:700;color:var(--mut);width:26px;height:26px;border-radius:999px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center}
  .zoombox button:hover{background:var(--card);color:var(--ink)}
  .zoombox button.wide{width:auto;padding:0 10px;font-size:var(--fs-11);font-weight:600}
  .zoombox .zlvl{font-size:var(--fs-11);font-weight:700;color:var(--txt);min-width:38px;text-align:center;letter-spacing:-.2px}
  .zoombox.tight #z-fit{color:var(--rag-amber-text);position:relative}
  .zoombox.tight #z-fit::after{content:'';position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--rag-amber)}
  .tog{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;
    background:var(--card);border:1.5px solid var(--line);color:var(--mut);font-size:var(--fs-11);font-weight:800;line-height:1;
    display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:0 2px 5px rgba(20,30,50,.10);padding:0}
  .tog:hover{border-color:var(--navy);color:var(--navy)}
  .tog .cnt{font-size:var(--fs-9);font-weight:800}
  .tn.collapsed>.tn-children{display:none}
  /* ===== MATRIX VIEW ===== */
  .matrix-mode{min-width:unset!important;width:100%;padding:0}
  .matrix-wrap{width:100%;background:var(--card)}
  .mtbl{width:100%;border-collapse:collapse;font-size:13px}
  .mtbl th{text-align:left;font-size:var(--fs-105);letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:700;
    padding:0 16px 9px 0;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--card);position:sticky;top:0;z-index:2}
  .mtbl th:nth-child(4),.mtbl th:nth-child(5){text-align:right}
  .mtbl td{font-size:13px;color:var(--txt);padding:9px 16px 9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
  .mtbl tbody tr:hover td{background:var(--slate-10)}
  .mtbl .tot-row td{font-weight:700;color:var(--navy);border-bottom:0;border-top:2px solid var(--navy)}
  #art[data-t="dark"] .mtbl .tot-row td{color:#EAEFF5}
  .t-name{font-weight:700;color:var(--navy);font-size:13px;line-height:1.3}
  #art[data-t="dark"] .t-name{color:#EAEFF5}
  .t-desc{font-size:var(--fs-105);color:var(--mut);font-style:italic;margin-top:2px;line-height:1.35}
  .d-badge{background:var(--slate-10);color:var(--slate);font-size:var(--fs-105);font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap;display:inline-block}
  #art[data-t="dark"] .d-badge{color:#C4CEDA}
  .fte-row{display:flex;align-items:center;gap:8px}
  .fte-n{font-size:13px;font-weight:700;color:var(--navy);min-width:36px;text-align:right}
  #art[data-t="dark"] .fte-n{color:#EAEFF5}
  .fte-bar{height:5px;background:var(--line);border-radius:3px;flex:1;min-width:50px}
  .fte-bar-f{height:100%;background:var(--green);border-radius:3px;transition:width .3s}
  .fte-bar-f.out{background:var(--mut)}
  .m-sc-in{background:var(--tint-green);color:var(--green-text);font-size:var(--fs-10);font-weight:700;padding:3px 9px;border-radius:4px;display:inline-block}
  .m-sc-out{background:var(--slate-10);color:var(--mut);font-size:var(--fs-10);font-weight:700;padding:3px 9px;border-radius:4px;display:inline-block}
  .m-indent-1{padding-left:28px!important}
  .m-indent-2{padding-left:44px!important}
  /* ===== SUMMARY ROW (computed) ===== */
  .sumrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:10px 0 4px;transition:opacity .15s,filter .15s}
  .stat{display:flex;flex-direction:column}
  .stat-n{font-size:17px;font-weight:800;color:var(--navy);line-height:1}
  #art[data-t="dark"] .stat-n{color:#EAEFF5}
  .stat-n.g{color:var(--green)!important}
  .stat-n.warn{color:var(--rag-amber)!important}
  .stat-l{font-size:var(--fs-95);color:var(--mut);margin-top:2px;letter-spacing:.2px}
  .sdiv{width:1px;height:28px;background:var(--line)}
  /* ===== FOOTER ===== */
  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:8px;font-size:clamp(9.5px,0.75vw,12px);color:var(--mut)}
  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legend{display:flex;gap:7px;align-items:center}
  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600}
  
  /* responsive chrome: on a narrow screen the absolute toprow would collide, so drop it
     into normal flow and let it wrap (same rule as every artifact on this chrome) */
  @media (max-width:760px){
    #art{padding:14px 18px 10px 42px}
    .nr-rail{width:24px}
  }

  /* ── responsive chrome ──────────────────────────────────────────────────────
     The toprow stacks when it does not fit, and the switch is DETECTED, not
     guessed: fitChrome() below measures the one-row layout and adds .stacked to
     the artifact root. Never hard-code a breakpoint for the chrome — see
     brand-guide.html, "Responsive chrome". Stacked order is brand row, then
     navigation, then working controls: where am I, what am I looking at, what
     can I change. ── */
  #art.stacked .toprow,#pm.stacked .toprow,#pw.stacked .toprow{
    position:static;top:auto;left:auto;right:auto;margin:0 0 12px;
    display:flex;flex-wrap:wrap;justify-content:flex-start;align-items:center;gap:10px 12px}
  #art.stacked .tags,#pm.stacked .tags,#pw.stacked .tags{display:contents}
  /* only the brand pill bleeds out onto the navy rail — that is why it is
     border-radius:0 9px 9px 0. The negative margin is given back as padding, so
     its right edge does not move and no sibling shifts. */
  #art.stacked .nr-pill,#pm.stacked .nr-pill,#pw.stacked .nr-pill{
    order:1;margin-left:calc(-1 * var(--padl,0px));padding-left:calc(14px + var(--padl,0px))}
  /* no text in an artifact is ever cut to make it fit: the lens badge wraps, it
     does not ellipsise. An instrument that truncates it looks fine to a gate and
     wrong to a client. */
  #art.stacked .nr-track,#pm.stacked .nr-track,#pw.stacked .nr-track{
    order:2;max-width:none;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
  #art.stacked .ctrls,#pm.stacked .ctrls,#pw.stacked .ctrls{
    order:3;flex:1 1 100%;display:flex;flex-wrap:wrap;justify-content:flex-start;gap:8px}
  /* a shell whose view switch sits straight in the toprow, with no .ctrls group */
  #art.stacked .toprow>.seg,#pm.stacked .toprow>.seg,#pw.stacked .toprow>.seg{order:3;flex:1 1 100%}
  #art.stacked .seg,#pm.stacked .seg,#pw.stacked .seg{flex-wrap:wrap;max-width:100%}
  #art.stacked .wgrp,#pm.stacked .wgrp,#pw.stacked .wgrp{
    order:4;flex:1 1 100%;flex-wrap:wrap;gap:8px}
  #art.stacked #save,#art.stacked #lock,#pm.stacked #save,#pm.stacked #lock,
  #pw.stacked #save,#pw.stacked #lock{order:4}
  /* the narrow-screen media query keeps only what it was really for: padding and
     rail width on a phone. Chrome layout is no longer its business. */
  @media (max-width:760px){
    #art.stacked,#pm.stacked,#pw.stacked{padding:14px 18px 10px 42px}
    #art.stacked .nr-rail,#pm.stacked .nr-rail,#pw.stacked .nr-rail{width:24px}
  }
</style><style id="nr-finish">
/* == THE DECK FINISH (patch_finish.py) == one look across the toolkit: the same base size as a deck
   in the same window, the quiet subtitle, light grey cards for ideas, icons from the house set.
   Written with an html prefix so it wins over the template's own rules wherever they sit. */
html{--srf:#F7F9FB;--srf-line:#E4E9EF;--sh-soft:0 1px 2px rgba(16,24,40,.05);--subt:#5E718B}
html [data-t="dark"]{--srf:#1E2937;--srf-line:#2C3947;--sh-soft:0 1px 2px rgba(0,0,0,.35);--subt:#9FB1C8}
html .subt{font-size:max(15px,calc(var(--nr-t,14px) * 1.22));font-weight:400;color:var(--subt)}
/* the title follows the deck where the deck's title is the larger one (a window above about 1615 x 909);
   below that every instrument keeps its own title, including the ones that shrink it to fit */
@media (min-width:1615px) and (min-height:909px){html h1{font-size:calc(var(--nr-t,15.14px) * 1.85)}}
html :is(.card,.kpi,#pw .tcard,.plan,.findings,.acard,.blk.boxed,.conc-so,.node.l3){background:var(--srf);border-color:var(--srf-line);border-radius:14px;box-shadow:var(--sh-soft)}
/* the templates paint their dark cards from #art[data-t="dark"] rules; the finish wins over those */
html [data-t="dark"]:is(#art,#pw,#pm) :is(.card,.kpi,#pw .tcard,.plan,.findings,.acard,.blk.boxed,.conc-so,.node.l3){background:var(--srf);border-color:var(--srf-line)}
html :is(.blk.boxed,.conc-so){border:1px solid var(--srf-line)}
html .ic{width:1.2em;height:1.2em;fill:var(--navy);flex:none;vertical-align:-.24em;margin-right:.4em}
html [data-t="dark"] .ic{fill:#93A9C4}
@media print{html{--sh-soft:0 0 0 transparent}}

<style id="org-look">

<style>

    font:500 13px/1.4 -apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;color:var(--ink,#15243A);background:var(--card,#fff);box-shadow:0 14px 34px -10px rgba(11,35,71,.28);

<script>
(function(){
  var GROUPS=[['interviews','Interviews'],['observations','Observations'],['documents','Documents'],['data','Data'],['external','External sources'],['internal','Internal discussions']];
  var NOUN={interviews:['interview','interviews'],observations:['observation','observations'],documents:['document','documents'],data:['data extract','data extracts'],external:['external source','external sources']};
  var SPECS={}, pop=null, cur=null;
  function P(){ try{ return (typeof DATA!=='undefined'&&DATA&&DATA.sourcePanel)||null; }catch(e){ return null; } }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function low(t){ t=String(t||''); return /^[A-Z][a-z]*(?=[\s,.;:-]|$)/.test(t)?t.charAt(0).toLowerCase()+t.slice(1):t; }   /* EventHub stays EventHub */
  function plain(t){ return String(t||'').replace(/\*\*/g,'').replace(/<[^>]+>/g,''); }
  function working(){ var p=P(); return !!(p&&p.build==='working'); }
  function root(){ return document.querySelector('#art,#pm,#pw')||document.body; }
  function href(e){ var p=P(); if(e.url) return e.url; if(e.file&&p&&p.rootRel!=null) return (p.rootRel?p.rootRel+'/':'')+e.file.split('/').map(encodeURIComponent).join('/'); return ''; }
  function badge(s){ if(s.badge==null&&s.score==null) return '';
    var r=s.rag||'na', txt=s.badge!=null?s.badge:(s.score+' out of 5');
    return '<span class="nrsrc-sc" style="color:var(--rag-'+r+'-text);background:var(--tint-'+r+')">'+esc(txt)+'</span>'; }
  /* every source an item rests on: an analysis gives its method and what it was built from */
  function expand(ids){ var p=P(), S=p.src, pool=[], how=[], seen={};
    (function walk(list,top){ (list||[]).forEach(function(k){ var e=S[k]; if(!e||seen[k]) return; seen[k]=1;
      if(e.group==='analysis'){ how.push({k:k,e:e}); walk(e.builtFrom,false); } else pool.push({k:k,e:e}); }); })(ids,true);
    return {pool:pool,how:how}; }
  function summary(pool){ var n={}, one={}; pool.forEach(function(x){ var g=x.e.group; if(g==='internal') return; n[g]=(n[g]||0)+1; one[g]=x.e; });
    var parts=[]; ['interviews','observations','documents','data','external'].forEach(function(g){ if(!n[g]) return;
      if(n[g]===1&&(g==='documents'||g==='data')) parts.push('the '+low(one[g].label)); else parts.push(n[g]+' '+NOUN[g][n[g]===1?0:1]); });
    if(!parts.length) return '';
    return 'Based on '+(parts.length>1?parts.slice(0,-1).join(', ')+' and '+parts[parts.length-1]:parts[0])+'.'; }
  function who(e){ var w=working(); if(w&&e.people&&e.label.indexOf(e.people.split(/[;,]/)[0].trim())<0) return e.people; return ''; }
  function item(x){ var e=x.e, w=working(), h=w?href(e):(e.url||'');
    return '<div class="nrsrc-it">'+esc(e.label)+(who(e)?' <span class="nrsrc-d">· '+esc(who(e))+'</span>':'')+(e.date?' <span class="nrsrc-d">· '+esc(e.date)+'</span>':'')+
      (w&&e.group==='external'&&e.origins&&e.origins.length?e.origins.map(function(o){return o==='thirdparty'||o==='internet'?'<span class="nrsrc-o '+o+'">'+(o==='thirdparty'?'Third party':'Internet')+'</span>':'';}).join(''):'')+
      (w?' <span class="nrsrc-id">'+esc(x.k)+'</span>':'')+(h?' <a href="'+esc(h)+'" target="_blank" rel="noopener">open</a>':'')+'</div>'; }
  function body(s){ var p=P(), w=working(), ids=s.ids||[], h='';
    h+='<div class="nrsrc-hx"><div class="nrsrc-ey"><span>'+esc(s.eyebrow||'')+'</span>'+badge(s)+'</div>'+
       '<button type="button" class="nrsrc-x" aria-label="Close">&times;</button></div><div class="nrsrc-bd">';

  })(root,0);
  return{fte_inscope:fi,hc_inscope:hi,fte_total:ft,hc_total:ht,
    teams_inscope:ti,teams_total:tt,avg_team_size:ti?fiTeams/ti:0,

/* ---- viewport: fit, zoom and pan --------------------------------------
   Auto-fit alone made a real client org unreadable: a wide tree scaled to
   ~15% with no way back in. The fit is now CLAMPED at FITMIN and the frame
   is pannable (drag, two-finger swipe) and zoomable (ctrl/⌘+wheel, buttons),
   so the tree is navigated rather than shrunk. Nothing here is edit-only —
   the client build gets the same navigation.                              */
var PZ={s:1,x:0,y:0,fit:1,W:0,H:0,manual:false};
var ZMIN=0.2,ZMAX=2.5,FITMIN=0.5;
function clampPZ(){
  var canvas=document.getElementById('canvas');
  if(!canvas)return;
  var aW=canvas.clientWidth,aH=canvas.clientHeight;
  var sw=PZ.W*PZ.s,sh=PZ.H*PZ.s;
  var mx=Math.max(0,(sw-aW)/2)+90,my=Math.max(0,sh-aH)+90;
  PZ.x=Math.max(-mx,Math.min(mx,PZ.x));
  PZ.y=Math.max(-my,Math.min(90,PZ.y));
}
function applyPZ(){
  var tw=document.getElementById('tw');
  if(!tw||view==='matrix')return;
  clampPZ();
  tw.style.transformOrigin='top center';
  tw.style.transform='translate('+PZ.x.toFixed(1)+'px,'+PZ.y.toFixed(1)+'px) scale('+PZ.s.toFixed(4)+')';
  var l=document.getElementById('z-lvl');
  if(l)l.textContent=Math.round(PZ.s*100)+'%';
  /* say so when the whole tree cannot be shown legibly, instead of silently shrinking */
  var zf=document.getElementById('z-fit'),zb=document.getElementById('zbox');
  if(zf&&zb){
    var tight=PZ.fit<FITMIN-0.001;
    zb.classList.toggle('tight',tight);
    zf.title=tight
      ?'The whole tree does not fit legibly at this size — drag to pan, or collapse branches'
      :'Fit the whole tree in the frame';
  }
  drawLines();
}
function zoomTo(s,ax,ay){
  var canvas=document.getElementById('canvas');
  var aW=canvas.clientWidth,cx=aW/2;
  var s2=Math.max(ZMIN,Math.min(ZMAX,s));
  if(ax==null){ax=cx;ay=Math.min(canvas.clientHeight/2,120);}
  var ex=(ax-cx-PZ.x)/PZ.s+cx, ey=(ay-PZ.y)/PZ.s;
  PZ.x=ax-cx-(ex-cx)*s2; PZ.y=ay-ey*s2; PZ.s=s2; PZ.manual=true;
  applyPZ();
}
/* keep=true on a re-render so an edit never throws away the consultant's viewport.
   FITSEQ: two fits can be in flight at once (init renders twice). The old code let
   the LATER rAF measure after the earlier one had already restored width:100%, so it
   read the frame width as the tree width and "fitted" to ~99% — the tree was never
   actually scaled, just clipped. Measure inside the rAF, and let only the newest win. */
var FITSEQ=0;
function fitTree(keep){
  if(view==='matrix')return;
  var my=++FITSEQ;
  var canvas=document.getElementById('canvas'),tw=document.getElementById('tw');
  requestAnimationFrame(function(){
    if(my!==FITSEQ)return;
    tw.style.transform='';tw.style.width='max-content';tw.style.minWidth='max-content';
    var aW=canvas.clientWidth-16,aH=canvas.clientHeight-16;
    var tW=tw.offsetWidth,tH=tw.offsetHeight;   /* same tick as the style write — forces reflow */
    tw.style.width='100%';tw.style.minWidth='unset';
    if(!aW||!tW){renderSum();return;}
    PZ.W=tW;PZ.H=tH;
    PZ.fit=Math.min(nrZ(),aW/tW,aH/tH);
    if(!(keep&&PZ.manual)){
      /* never shrink below FITMIN — an unreadable tree is not a fitted tree */
      PZ.s=Math.max(FITMIN,PZ.fit);PZ.x=0;PZ.y=0;PZ.manual=false;
    }
    applyPZ();
    renderSum();
    setTimeout(drawLines,20);
  });
}
/* collapse/expand every branch below the root */
function collapseAll(on){
  (function w(n,d){
    if(d>0&&(n.children||[]).length)n.__collapsed=!!on;
    (n.children||[]).forEach(function(c){w(c,d+1);});
  })(T,0);
  if(T)T.__collapsed=false;
  render();
}
function bindViewport(){
  var canvas=document.getElementById('canvas');
  canvas.classList.add('grabbable');
  /* two-finger swipe / wheel pans; ctrl or ⌘ + wheel zooms about the pointer */
  canvas.addEventListener('wheel',function(e){
    if(view==='matrix')return;
    e.preventDefault();
    if(e.ctrlKey||e.metaKey){
      var r=canvas.getBoundingClientRect();
      zoomTo(PZ.s*(e.deltaY<0?1.12:1/1.12),e.clientX-r.left,e.clientY-r.top);
    }else{
      PZ.x-=e.deltaX;PZ.y-=e.deltaY;PZ.manual=true;applyPZ();
    }
  },{passive:false});
  var down=null;
  canvas.addEventListener('pointerdown',function(e){
    if(view==='matrix'||e.button!==0)return;
    down={x:e.clientX,y:e.clientY,px:PZ.x,py:PZ.y,moved:false};
    PANNED=false;
  });
  canvas.addEventListener('pointermove',function(e){
    if(!down)return;
    var dx=e.clientX-down.x,dy=e.clientY-down.y;
    if(!down.moved&&Math.abs(dx)+Math.abs(dy)<4)return;   /* let a real click through */
    if(!down.moved){down.moved=true;canvas.classList.add('grabbing');try{canvas.setPointerCapture(e.pointerId);}catch(_){}}
    PZ.x=down.px+dx;PZ.y=down.py+dy;PZ.manual=true;applyPZ();
  });
  function up(e){
    if(!down)return;
    PANNED=down.moved;
    canvas.classList.remove('grabbing');
    try{canvas.releasePointerCapture(e.pointerId);}catch(_){}
    down=null;
    setTimeout(function(){PANNED=false;},0);
  }
  canvas.addEventListener('pointerup',up);
  canvas.addEventListener('pointercancel',up);
  /* keyboard: arrows pan, +/- zoom, 0 refits — reachable without a trackpad */
  document.addEventListener('keydown',function(e){
    if(view==='matrix')return;
    var t=e.target;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
    var step=e.shiftKey?200:70;
    if(e.key==='ArrowLeft'){PZ.x+=step;}
    else if(e.key==='ArrowRight'){PZ.x-=step;}
    else if(e.key==='ArrowUp'){PZ.y+=step;}
    else if(e.key==='ArrowDown'){PZ.y-=step;}
    else if(e.key==='+'||e.key==='='){zoomTo(PZ.s*1.15);return;}
    else if(e.key==='-'||e.key==='_'){zoomTo(PZ.s/1.15);return;}
    else if(e.key==='0'){fitTree(false);return;}
    else return;
    e.preventDefault();PZ.manual=true;applyPZ();
  });
  var zi=document.getElementById('z-in'),zo=document.getElementById('z-out'),
      zf=document.getElementById('z-fit'),zc=document.getElementById('z-coll');
  if(zi)zi.onclick=function(){zoomTo(PZ.s*1.15);};
  if(zo)zo.onclick=function(){zoomTo(PZ.s/1.15);};
  if(zf)zf.onclick=function(){fitTree(false);};
  if(zc)zc.onclick=function(){
    var anyOpen=false;
    (function w(n,d){if(d>0&&(n.children||[]).length&&!n.__collapsed)anyOpen=true;(n.children||[]).forEach(function(c){w(c,d+1);});})(T,0);
    collapseAll(anyOpen);
    zc.textContent=anyOpen?'Expand all':'Collapse all';
  };
}

function renderSum(){

    '<div class="sdiv"></div>'+
    '<div class="stat"><span class="stat-n">'+f(s.fte_total)+'</span><span class="stat-l">Total FTE</span></div>'+
    '<div class="sdiv"></div>'+
    '<div class="stat"><span class="stat-n">'+s.teams_inscope+'</span><span class="stat-l">Teams in scope</span></div>'+
    '<div class="sdiv"></div>'+
    '<div class="stat"><span class="stat-n">'+f(s.avg_team_size)+'</span><span class="stat-l">Avg. team size</span></div>'+
    '<div class="sdiv"></div>'+
    '<div class="stat"><span class="stat-n">'+s.org_layers+'</span><span class="stat-l">Org. layers</span></div>'+
    inc+chip;
}

/* ---- view + theme (both builds) ---- */
function seg(id,attr,cb){

seg('vseg','data-v',function(v){view=v;render();});

window.addEventListener('resize',function(){clearTimeout(window.__rt);window.__rt=setTimeout(function(){fitTree(true);},120);});
document.getElementById('canvas').addEventListener('scroll',drawLines);
bindViewport();



/* ---- init (both builds) ---- */
T=DATA.org;
buildMap(T,null);
renderChrome();
render();

})();

<script>
/* ── fitChrome() — the chrome stacks when it does not fit ────────────────────
   Measures the one-row layout and adds .stacked to the artifact root when any of
   six things is true: the two groups are closer than 12px · a control runs past
   either edge · a label has been squeezed narrower than its own text · the
   toprow wraps · the toprow comes within 6px of the action title · the viewport
   is at or below 760px (the floor). Exposed as window.fitChrome() so a render
   pass can call it after it changes a label. ── */
(function(){
  var busy=false,lastW=-1;
  function root(){return document.querySelector('#art,#pm,#pw');}
  function skip(e){
    if(!e) return true;
    if(e.id==='wpop'||(e.closest&&e.closest('#wpop'))) return true;
    var cs=getComputedStyle(e);
    if(cs.visibility==='hidden'||cs.display==='none') return true;
    return false;
  }
  function fitChrome(){
    if(busy) return; busy=true;
    try{
      var R=root(); if(!R) return;

    el._nrAsk=now; el.classList.add('nr-asking'); setTimeout(function(){ if(el._nrAsk===now){ el._nrAsk=0; el.classList.remove('nr-asking'); } },5000);

<script id="nr-topbar-js">
/* patch_topbar.py: one theme switch and the way home, the same in every instrument.
   Theme: the choice is kept under the cockpit's key, nr_dark, so every page of an
   engagement opens the same way. Home: a page that carries
   <meta name="nr-home" content="index.html"> (the engagement artifact adds it) gets
   "< Cockpit /" in front of its section tag. */
(function(){
  var K='nr_dark', box=document.getElementById('theme')||document.getElementById('tseg');
  if(box){
    box.querySelectorAll('button').forEach(function(b){ var d=b.getAttribute('data-s')==='dark';
      b.title=d?'Dark mode':'Light mode'; b.setAttribute('aria-label',b.title);
      b.addEventListener('click',function(){ try{ localStorage.setItem(K,d?'1':'0'); }catch(e){} }); });
    var v=null; try{ v=localStorage.getItem(K); }catch(e){}
    var dk=box.querySelector('button[data-s="dark"]');
    if(v==='1'&&dk&&!dk.classList.contains('on')) dk.click();
  }
  var m=document.querySelector('meta[name="nr-home"]'), lens=document.getElementById('lens')||document.querySelector('.toprow .nr-track');
  if(m&&lens&&!document.querySelector('.nr-crumb')){
    var c=document.createElement('div'); c.className='nr-track nr-crumb';
    var a=document.createElement('a'); a.className='nr-home'; a.href=m.getAttribute('content')||'index.html';
    a.textContent='\u2039 '+(m.getAttribute('data-label')||'Cockpit'); a.title='Back to the engagement cockpit';
    /* opened in a window of the findings dashboard (a frame of our own page): go back in that page, not in the frame */
    try{ if(window.parent!==window&&window.parent.document) a.target='_parent'; }catch(e){}
    var s=document.createElement('span'); s.className='nr-sep'; s.textContent='/';
    lens.parentNode.insertBefore(c,lens); c.appendChild(a); c.appendChild(s); c.appendChild(lens);
    if(window.fitChrome) requestAnimationFrame(window.fitChrome);
  }
})();
</script>

/* ── READ MODE · narrow screens ──────────────────────────────────────────────
   This artifact normally scales its whole body down so the page fits one screen.

   off and the page simply flows and scrolls at its real size. Desktop is
   untouched — every rule here lives inside the media query. */

  html,body{height:auto!important;overflow:auto!important}

    overflow:visible!important;padding:12px 14px 22px 34px!important}

  .tags{flex-wrap:wrap!important;gap:8px!important;margin-left:-34px!important}
