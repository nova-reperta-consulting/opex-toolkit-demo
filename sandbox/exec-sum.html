<!doctype html>
<!-- ============================================================================
  EXECUTIVE SUMMARY  ·  exec-sum-synthesiser
  A text-based, one-slide executive summary: Situation, Complication, Resolution,
  Call to action, in that order. Bold lead sentence per block, indented supporting
  bullets beneath. No charts, no tiles: the evidence lives in the artifacts behind it.
  Two altitudes via data.altitude = "team" | "engagement".
  Replace ONLY the /* DATA */ block. Markup, CSS and JS are fixed.
  Brand tokens inlined from diagnostic-skill-builder/templates/brand.css. Logo inlined.
============================================================================ -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Executive summary</title>
<style>
/* Type scale — one place, not case by case. Every size below 12px is a token; the
   whole small end lifts on a narrow screen so nothing drops under 11px on a phone. */
:root{
  --fs-65:6.5px; --fs-7:7px; --fs-75:7.5px; --fs-8:8px; --fs-85:8.5px; --fs-9:9px;
  --fs-95:9.5px; --fs-10:10px; --fs-105:10.5px; --fs-11:11px; --fs-115:11.5px;
}
@media (max-width:760px){
  :root{
    --fs-65:11px; --fs-7:11px; --fs-75:11px; --fs-8:11px; --fs-85:11px; --fs-9:11px;
    --fs-95:11px; --fs-10:11.5px; --fs-105:12px; --fs-11:12px; --fs-115:12.5px;
  }
}
</style>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif}
  #art{--navy:#0B2347;--slate:#364156;--green:#1C7A4A;--accent:#6EB1D1;--navy2:#16315B;
      --rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;
      --rag-green-text:#2F8F6B;--rag-amber-text:#B97F22;--rag-red-text:#C2483D;--rag-na-text:#6B7480;
      --tint-green:rgba(47,143,107,.12);--tint-amber:rgba(212,154,58,.16);--tint-red:rgba(210,100,90,.13);--tint-na:rgba(154,164,176,.16);
      --navy-fill:#0B2347;--slate-10:rgba(54,65,86,.09);--navy-10:rgba(11,35,71,.10);--green-10:rgba(28,122,74,.10);
      --rule:#D7E0EC;
      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      --fs:1;width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #art[data-t="dark"]{--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;
      --navy-fill:#243246;--accent:#8FC7E8;--rule:#33414F;
      --rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;
      --rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;
      --tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);
      --sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}
  body:has(#art[data-t="dark"]){--page:#0E1620}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:3}
  .tags{display:flex;align-items:center;gap:11px}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)} .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:var(--fs-115);letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #art[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .ctrls{display:flex;align-items:center;gap:10px}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  h1{font-size:calc(clamp(19px,1.6vw,25px)*var(--fs));font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.2;margin:0 0 calc(3px*var(--fs))}
  #art[data-t="dark"] h1{color:#EAEFF5}
  .sub{font-size:calc(12px*var(--fs));color:var(--mut);margin:0 0 calc(12px*var(--fs))}
  #view{flex:1;min-height:0;position:relative;overflow:auto;padding-right:6px;display:flex;flex-direction:column}

  /* ---- the summary sheet ---- */
  .sheet{padding:calc(6px*var(--fs)) 4px calc(10px*var(--fs));max-width:1500px;flex:1 0 auto}
  .row{display:grid;grid-template-columns:1fr;gap:0;align-items:start;margin-bottom:calc(22px*var(--fs))}
  .row.labelled{grid-template-columns:112px 1fr;gap:18px}
  .row:last-child{margin-bottom:0}
  .lbl{font-size:var(--fs-11);font-weight:700;letter-spacing:.6px;color:var(--navy2);padding-top:2px;text-align:right}
  #art[data-t="dark"] .lbl{color:var(--accent)}
  .blk{max-width:1240px}
  .blk.boxed{background:var(--slate-10);border-radius:10px;padding:calc(16px*var(--fs)) calc(20px*var(--fs)) calc(17px*var(--fs));margin-top:2px}
  #art[data-t="dark"] .blk.boxed{background:rgba(148,161,178,.14)}

  ul{list-style:none;margin:0;padding:0}
  li{position:relative;padding-left:16px;line-height:1.5}
  .lead{font-size:calc(13.7px*var(--fs));font-weight:700;color:var(--ink);margin-bottom:calc(9px*var(--fs));padding-left:0}
  .l2{font-size:calc(12.7px*var(--fs));color:var(--txt);margin:calc(4px*var(--fs)) 0 calc(4px*var(--fs)) 4px;padding-left:calc(16px*var(--fs))}
  .l2::before{content:'';position:absolute;left:2px;top:.56em;width:5px;height:5px;border-radius:50%;background:var(--mut)}
  .n2{font-size:calc(12.8px*var(--fs));color:var(--txt);margin:calc(7px*var(--fs)) 0 calc(7px*var(--fs)) 4px;padding-left:calc(30px*var(--fs));line-height:1.5}
  .n2 .num{position:absolute;left:0;top:1px;width:calc(20px*var(--fs));height:calc(20px*var(--fs));border-radius:50%;
           background:var(--navy2);color:#fff;font-size:calc(10.5px*var(--fs));font-weight:700;
           display:flex;align-items:center;justify-content:center;letter-spacing:0}
  .n2 .t{color:var(--ink);font-weight:700}
  .blk.rec .n2 .num{background:var(--green)}
  #art[data-t="dark"] .n2 .num{background:var(--accent);color:#16202C}
  #art[data-t="dark"] .blk.rec .n2 .num{background:var(--rag-green);color:#12211A}
  li b{color:var(--ink);font-weight:700}
  .own{color:var(--mut);white-space:nowrap;font-size:.95em}
  .own::before{content:' · '}
  .meta{display:block;color:var(--mut);font-size:.92em;margin-top:2px}
  .lead .num{color:var(--green)}

  /* ---- evidence trace ---- */
  .block{margin-bottom:16px;max-width:1500px}
  .sec{margin:0 0 8px;font-size:var(--fs-11);font-weight:700;letter-spacing:.9px;color:var(--mut);text-transform:uppercase}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh)}
  table{width:100%;border-collapse:collapse;font-size:12.3px}
  th{text-align:left;font-size:var(--fs-105);letter-spacing:.7px;text-transform:uppercase;color:var(--mut);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--txt);vertical-align:top;line-height:1.42}
  tr:last-child td{border-bottom:none}
  td b{color:var(--ink)}
  .lever{font-size:var(--fs-105);font-weight:700;letter-spacing:.4px;padding:3px 9px;border-radius:999px;color:#fff;white-space:nowrap}
  .lv-process{background:#D08A3C} .lv-auto{background:#3D7FB8} .lv-acc{background:#6EB1D1} .lv-enh{background:#8B6FBF}
  #art[data-t="dark"] .lv-process{background:#E0A469} #art[data-t="dark"] .lv-auto{background:#6FA6D6}
  #art[data-t="dark"] .lv-acc{background:#8FC7E8} #art[data-t="dark"] .lv-enh{background:#A992D6}
  .rev{font-size:11.8px;color:var(--mut);line-height:1.5;padding:10px 14px}
  .miss{color:var(--rag-red-text)}
  #ft{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:var(--fs-11);color:var(--mut)}
  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600}
  .hide{display:none}
  @media (max-width:820px){
    #art{padding:14px 18px 10px 42px}
    .nr-rail{width:24px}
    .sheet{padding:14px 16px 16px;border-right-width:4px;border-bottom-width:4px}
    .row{grid-template-columns:1fr;gap:4px}
    .lbl{text-align:left}
  }

  /* ── responsive chrome ──────────────────────────────────────────────────────
     The toprow stacks when it does not fit, and the switch is DETECTED, not
     guessed: fitChrome() below measures the one-row layout and adds .stacked to
     the artifact root. Never hard-code a breakpoint for the chrome — see
     brand-guide.html, "Responsive chrome". Stacked order is brand row, then
     navigation, then working controls: where am I, what am I looking at, what
     can I change. ── */
  #art.stacked .toprow,#pm.stacked .toprow,#pw.stacked .toprow{
    position:static;top:auto;left:auto;right:auto;margin:0 0 12px;
    display:flex;flex-wrap:wrap;justify-content:flex-start;align-items:center;gap:10px 12px}
  #art.stacked .tags,#pm.stacked .tags,#pw.stacked .tags{display:contents}
  /* only the brand pill bleeds out onto the navy rail — that is why it is
     border-radius:0 9px 9px 0. The negative margin is given back as padding, so
     its right edge does not move and no sibling shifts. */
  #art.stacked .nr-pill,#pm.stacked .nr-pill,#pw.stacked .nr-pill{
    order:1;margin-left:calc(-1 * var(--padl,0px));padding-left:calc(14px + var(--padl,0px))}
  /* no text in an artifact is ever cut to make it fit: the lens badge wraps, it
     does not ellipsise. An instrument that truncates it looks fine to a gate and
     wrong to a client. */
  #art.stacked .nr-track,#pm.stacked .nr-track,#pw.stacked .nr-track{
    order:2;max-width:none;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
  #art.stacked .ctrls,#pm.stacked .ctrls,#pw.stacked .ctrls{
    order:3;flex:1 1 100%;display:flex;flex-wrap:wrap;justify-content:flex-start;gap:8px}
  /* a shell whose view switch sits straight in the toprow, with no .ctrls group */
  #art.stacked .toprow>.seg,#pm.stacked .toprow>.seg,#pw.stacked .toprow>.seg{order:3;flex:1 1 100%}
  #art.stacked .seg,#pm.stacked .seg,#pw.stacked .seg{flex-wrap:wrap;max-width:100%}
  #art.stacked .wgrp,#pm.stacked .wgrp,#pw.stacked .wgrp{
    order:4;flex:1 1 100%;flex-wrap:wrap;gap:8px}
  #art.stacked #save,#art.stacked #lock,#pm.stacked #save,#pm.stacked #lock,
  #pw.stacked #save,#pw.stacked #lock{order:4}
  /* the narrow-screen media query keeps only what it was really for: padding and
     rail width on a phone. Chrome layout is no longer its business. */
  @media (max-width:760px){
    #art.stacked,#pm.stacked,#pw.stacked{padding:14px 18px 10px 42px}
    #art.stacked .nr-rail,#pm.stacked .nr-rail,#pw.stacked .nr-rail{width:24px}
  }
</style><style id="nr-finish">
/* == THE DECK FINISH (patch_finish.py) == one look across the toolkit: the same base size as a deck
   in the same window, the quiet subtitle, light grey cards for ideas, icons from the house set.
   Written with an html prefix so it wins over the template's own rules wherever they sit. */
html{--srf:#F7F9FB;--srf-line:#E4E9EF;--sh-soft:0 1px 2px rgba(16,24,40,.05);--subt:#5E718B}
html [data-t="dark"]{--srf:#1E2937;--srf-line:#2C3947;--sh-soft:0 1px 2px rgba(0,0,0,.35);--subt:#9FB1C8}
html .subt{font-size:max(15px,calc(var(--nr-t,14px) * 1.22));font-weight:400;color:var(--subt)}
/* the title follows the deck where the deck's title is the larger one (a window above about 1615 x 909);
   below that every instrument keeps its own title, including the ones that shrink it to fit */
@media (min-width:1615px) and (min-height:909px){html h1{font-size:calc(var(--nr-t,15.14px) * 1.85)}}
html :is(.card,.kpi,#pw .tcard,.plan,.findings,.acard,.t-dept .nc,.t-team.in .nc,.blk.boxed,.conc-so,.node.l3){background:var(--srf);border-color:var(--srf-line);border-radius:14px;box-shadow:var(--sh-soft)}
/* the templates paint their dark cards from #art[data-t="dark"] rules; the finish wins over those */
html [data-t="dark"]:is(#art,#pw,#pm) :is(.card,.kpi,#pw .tcard,.plan,.findings,.acard,.t-dept .nc,.t-team.in .nc,.blk.boxed,.conc-so,.node.l3){background:var(--srf);border-color:var(--srf-line)}
html :is(.blk.boxed,.conc-so){border:1px solid var(--srf-line)}
html .ic{width:1.2em;height:1.2em;fill:var(--navy);flex:none;vertical-align:-.24em;margin-right:.4em}
html [data-t="dark"] .ic{fill:#93A9C4}
@media print{html{--sh-soft:0 0 0 transparent}}

<script>
(function(){
  var GROUPS=[['interviews','Interviews'],['observations','Observations'],['documents','Documents'],['data','Data'],['external','External sources'],['internal','Internal discussions']];
  var NOUN={interviews:['interview','interviews'],observations:['observation','observations'],documents:['document','documents'],data:['data extract','data extracts'],external:['external source','external sources']};
  var SPECS={}, pop=null, cur=null;
  function P(){ try{ return (typeof DATA!=='undefined'&&DATA&&DATA.sourcePanel)||null; }catch(e){ return null; } }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function low(t){ t=String(t||''); return /^[A-Z][a-z]*(?=[\s,.;:-]|$)/.test(t)?t.charAt(0).toLowerCase()+t.slice(1):t; }   /* EventHub stays EventHub */
  function plain(t){ return String(t||'').replace(/\*\*/g,'').replace(/<[^>]+>/g,''); }
  function working(){ var p=P(); return !!(p&&p.build==='working'); }
  function root(){ return document.querySelector('#art,#pm,#pw')||document.body; }
  function href(e){ var p=P(); if(e.url) return e.url; if(e.file&&p&&p.rootRel!=null) return (p.rootRel?p.rootRel+'/':'')+e.file.split('/').map(encodeURIComponent).join('/'); return ''; }
  function badge(s){ if(s.badge==null&&s.score==null) return '';
    var r=s.rag||'na', txt=s.badge!=null?s.badge:(s.score+' out of 5');
    return '<span class="nrsrc-sc" style="color:var(--rag-'+r+'-text);background:var(--tint-'+r+')">'+esc(txt)+'</span>'; }
  /* every source an item rests on: an analysis gives its method and what it was built from */
  function expand(ids){ var p=P(), S=p.src, pool=[], how=[], seen={};
    (function walk(list,top){ (list||[]).forEach(function(k){ var e=S[k]; if(!e||seen[k]) return; seen[k]=1;
      if(e.group==='analysis'){ how.push({k:k,e:e}); walk(e.builtFrom,false); } else pool.push({k:k,e:e}); }); })(ids,true);
    return {pool:pool,how:how}; }
  function summary(pool){ var n={}, one={}; pool.forEach(function(x){ var g=x.e.group; if(g==='internal') return; n[g]=(n[g]||0)+1; one[g]=x.e; });
    var parts=[]; ['interviews','observations','documents','data','external'].forEach(function(g){ if(!n[g]) return;
      if(n[g]===1&&(g==='documents'||g==='data')) parts.push('the '+low(one[g].label)); else parts.push(n[g]+' '+NOUN[g][n[g]===1?0:1]); });
    if(!parts.length) return '';
    return 'Based on '+(parts.length>1?parts.slice(0,-1).join(', ')+' and '+parts[parts.length-1]:parts[0])+'.'; }
  function who(e){ var w=working(); if(w&&e.people&&e.label.indexOf(e.people.split(/[;,]/)[0].trim())<0) return e.people; return ''; }
  function item(x){ var e=x.e, w=working(), h=w?href(e):(e.url||'');
    return '<div class="nrsrc-it">'+esc(e.label)+(who(e)?' <span class="nrsrc-d">· '+esc(who(e))+'</span>':'')+(e.date?' <span class="nrsrc-d">· '+esc(e.date)+'</span>':'')+
      (w&&e.group==='external'&&e.origins&&e.origins.length?e.origins.map(function(o){return o==='thirdparty'||o==='internet'?'<span class="nrsrc-o '+o+'">'+(o==='thirdparty'?'Third party':'Internet')+'</span>':'';}).join(''):'')+
      (w?' <span class="nrsrc-id">'+esc(x.k)+'</span>':'')+(h?' <a href="'+esc(h)+'" target="_blank" rel="noopener">open</a>':'')+'</div>'; }
  function body(s){ var p=P(), w=working(), ids=s.ids||[], h='';
    h+='<div class="nrsrc-hx"><div class="nrsrc-ey"><span>'+esc(s.eyebrow||'')+'</span>'+badge(s)+'</div>'+
       '<button type="button" class="nrsrc-x" aria-label="Close">&times;</button></div><div class="nrsrc-bd">';
    if(!ids.length){ return h+'<div class="nrsrc-warn">No source yet. Unlock the page and pick one where you score it. Without a source this score cannot go into the client build.</div></div>'; }
    var x=expand(ids), sm=summary(x.pool);
    if(sm) h+='<p class="nrsrc-sum">'+esc(sm)+'</p>';
    x.how.forEach(function(a){ var e=a.e; h+='<div class="nrsrc-how"><b>Method</b>'+esc(e.method||e.label)+(w?' <span class="nrsrc-id">'+esc(a.k)+'</span>'+(href(e)?' <a href="'+esc(href(e))+'" target="_blank" rel="noopener">open</a>':''):'')+'</div>'; });

(function(){
  var ORDER=[["situation","Situation"],["complication","Complication"],["resolution","Resolution"],["callToAction","Call to action"]];
  var LEV={process:["Process redesign","lv-process"],auto:["Automation","lv-auto"],acc:["AI Accelerate","lv-acc"],enh:["AI Enhance","lv-enh"]};
  function esc(t){return String(t==null?'':t).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function md(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}
  var D=DATA, alt=(D.altitude||'team'), B=D.blocks||{};
  document.getElementById('ctx').textContent=D.context||'OPEX QUICKSCAN';

  /* Two levels only: a bold lead, then its items. Anything deeper is promoted to an item.
     Situation reads as context (dashes); findings, moves and decisions are numbered so the
     reader can count them. */
  var NUMBERED={complication:1,resolution:1,callToAction:1};
  var NSI=0;
  /* the claim, as the panel's heading: its title, or its first words */
  function short(t){t=String(t||'').replace(/\*\*/g,'');if(t.length<=72)return t;var c=t.slice(0,72);return c.slice(0,Math.max(40,c.lastIndexOf(' ')))+'\u2026';}
  function bullets(list,numbered){
    var n=0;
    return (list||[]).map(function(b){
      /* an initiative carries its lever, how long it runs and who owns it, on its own line;
         a decision carries the initiatives it unlocks, its owner and its date */
      var bits=[];
      if(b.lever) bits.push(esc((LEV[b.lever]||[b.lever])[0]));
      if(b.covers&&b.covers.length) bits.push('Unlocks '+esc(b.covers.join(', ')));
      if(b.duration) bits.push(esc(b.duration));
      if(b.owner||b.by) bits.push(esc([b.owner,b.by].filter(Boolean).join(', ')));
      var meta=(b.lever||b.duration||(b.covers&&b.covers.length));
      var tail=bits.length?(meta?('<span class="meta">'+bits.join(' · ')+'</span>')
                                :('<span class="own">'+bits.join(', ')+'</span>')):'';
      var head=b.title?('<span class="t">'+md(b.title)+'.</span> '):'';
      /* the sources (i): what the claim cites itself, and what its evidence references cite */
      var cites=(b.sourceIds||[]).slice();(b.evidence||[]).forEach(function(e){if(e&&e.sourceId&&cites.indexOf(e.sourceId)<0)cites.push(e.sourceId);});
      var si=window.NRSRC?NRSRC.item(('sourceIds' in b)||cites.length?{sourceIds:cites,quote:b.quote}:{},short(b.title||b.text),{k:'claim:'+(++NSI),optional:true}):'';
      tail=si+tail;
      var extra=(b.sub||[]).map(function(s){return numbered?('<li class="n2"><span class="num">'+(++n)+'</span>'+md(s)+'</li>')
                                                          :('<li class="l2">'+md(s)+'</li>');}).join('');
      if(numbered) return '<li class="n2 nrsrc-row"><span class="num">'+(++n)+'</span>'+head+md(b.text)+tail+'</li>'+extra;
      return '<li class="l2 nrsrc-row">'+head+md(b.text)+tail+'</li>'+extra;
    }).join('');
  }
  var labelled=(D.showLabels===true);
  var rows=ORDER.map(function(pair){
    var k=pair[0], blk=B[k];
    if(!blk||(!blk.lead&&!(blk.bullets||[]).length)) return '';
    var boxed=(k==='callToAction')?' boxed':'';
    var rec=(k==='resolution')?' rec':'';
    var lead=blk.lead?('<li class="lead">'+md(blk.lead)+'</li>'):'';
    var label=labelled?('<div class="lbl">'+esc(pair[1])+'</div>'):'';
    return '<div class="row'+(labelled?' labelled':'')+'">'+label+
      '<div class="blk'+boxed+rec+'"><ul>'+lead+bullets(blk.bullets,!!NUMBERED[k])+'</ul></div></div>';
  }).join('');
  document.getElementById('v-summary').innerHTML='<div class="sheet">'+rows+'</div>';

  /* ---- evidence trace: every claim, and where it comes from ---- */
  var tr=[];
  ORDER.forEach(function(pair){
    var blk=B[pair[0]]; if(!blk) return;
    (blk.bullets||[]).forEach(function(b){
      var ev=b.evidence||[];
      if(!ev.length){ tr.push('<tr><td><b>'+esc(pair[1])+'</b></td><td>'+esc(b.text)+'</td><td colspan="2" class="miss">no evidence reference captured</td></tr>'); return; }
      ev.forEach(function(e,j){
        tr.push('<tr><td>'+(j===0?('<b>'+esc(pair[1])+'</b>'):'')+'</td><td>'+(j===0?esc(b.text):'')+'</td>'+
          '<td>'+esc(e.source||'')+'</td><td style="color:var(--mut)">'+esc(e.ref||'')+'</td></tr>');
      });
    });
  });
  var trBlock='<div class="block"><div class="sec">Every claim, and where it comes from</div><div class="card"><table>'+
    '<tr><th>Block</th><th>Claim</th><th>Source</th><th>Reference</th></tr>'+tr.join('')+'</table></div></div>';

  var recs=(D.recommendations||[]).map(function(r){
    var L=LEV[r.lever]||[r.lever||'',''];
    return '<tr><td><b>'+esc(r.move)+'</b>'+(r.precondition?('<br><span style="color:var(--mut)">First: '+esc(r.precondition)+'</span>'):'')+'</td>'+
      '<td><span class="lever '+L[1]+'">'+esc(L[0])+'</span></td><td>'+esc(r.horizon||'')+'</td>'+
      '<td>'+esc(r.decision||'')+(r.owner?('<br><span style="color:var(--mut)">'+esc(r.owner)+(r.by?(' · '+esc(r.by)):'')+'</span>'):'')+'</td></tr>';
  }).join('');
  var recBlock=recs?('<div class="block"><div class="sec">The moves behind the resolution</div><div class="card"><table>'+
    '<tr><th>Move</th><th>Lever</th><th>Horizon</th><th>Decision</th></tr>'+recs+'</table></div></div>'):'';

  var bs=(D.blindSpots||[]).map(function(b){
    return '<tr><td><b>'+esc(b.gap)+'</b></td><td>'+esc(b.changes||'')+'</td><td style="color:var(--mut)">'+esc(b.closeWith||'')+'</td></tr>';
  }).join('');
  var bsBlock=bs?('<div class="block"><div class="sec">Not assessed</div><div class="card"><table>'+
    '<tr><th>Gap</th><th>What it would change</th><th>Close it with</th></tr>'+bs+'</table></div></div>'):'';

  var rev=D.advisorReview?('<div class="block"><div class="sec">Advisor pass</div><div class="card rev"><b style="color:var(--txt)">Verdict:</b> '+
    esc(D.advisorReview.verdict||'')+(D.advisorReview.openMajors&&D.advisorReview.openMajors.length?('<br>Open, accepted: '+esc(D.advisorReview.openMajors.join(' · '))):'')+'</div></div>'):
    '<div class="block"><div class="sec">Advisor pass</div><div class="card rev">Not recorded. Run opex-advisor before this goes to a client.</div></div>';
  document.getElementById('v-trace').innerHTML=trBlock+recBlock+bsBlock+rev;

  /* One slide, always. Measure, then binary-search the type scale until the summary fits.
     Never scales up past 1: a short summary keeps the standard sizes and simply ends early. */
  var art=document.getElementById('art'), view=document.getElementById('view'), sheet=document.getElementById('v-summary');
  var FIT_MIN=0.62;
  function overflows(){ return sheet.scrollHeight > view.clientHeight + 1; }
  function setFs(v){ art.style.setProperty('--fs', v.toFixed(4)); }
  function fit(){
    if(sheet.classList.contains('hide')) return;      /* the trace view scrolls, it is not a slide */
    setFs(nrZ());
    if(!overflows()){ art.removeAttribute('data-fit'); return; }
    var lo=FIT_MIN, hi=nrZ(), mid;
    for(var i=0;i<14;i++){ mid=(lo+hi)/2; setFs(mid); if(overflows()) hi=mid; else lo=mid; }
    setFs(lo);
    if(overflows()){ art.setAttribute('data-fit','overflow');
      if(window.console&&console.warn) console.warn('exec-sum: content does not fit one slide even at the minimum scale ('+FIT_MIN+'). Cut it.'); }
    else art.setAttribute('data-fit',lo.toFixed(2));
  }
  var rt; window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(fit,120); });
  if(document.fonts&&document.fonts.ready&&document.fonts.ready.then) document.fonts.ready.then(fit);
  fit();

  function seg(id,attr,cb){var box=document.getElementById(id);box.querySelectorAll('button').forEach(function(b){b.onclick=function(){box.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');cb(b.getAttribute(attr));};});}
  seg('theme','data-s',function(t){document.getElementById('art').setAttribute('data-t',t);});
  seg('viewseg','data-v',function(v){
    document.getElementById('v-summary').classList.toggle('hide',v!=='summary');
    document.getElementById('v-trace').classList.toggle('hide',v!=='trace');
    if(v==='summary') fit();
  });
})();
</script>
<script>
/* ── fitChrome() — the chrome stacks when it does not fit ────────────────────
   Measures the one-row layout and adds .stacked to the artifact root when any of
   six things is true: the two groups are closer than 12px · a control runs past
   either edge · a label has been squeezed narrower than its own text · the
   toprow wraps · the toprow comes within 6px of the action title · the viewport
   is at or below 760px (the floor). Exposed as window.fitChrome() so a render
   pass can call it after it changes a label. ── */
(function(){
  var busy=false,lastW=-1;
  function root(){return document.querySelector('#art,#pm,#pw');}
  function skip(e){
    if(!e) return true;
    if(e.id==='wpop'||(e.closest&&e.closest('#wpop'))) return true;
    var cs=getComputedStyle(e);
    if(cs.visibility==='hidden'||cs.display==='none') return true;
    return false;
  }
  function fitChrome(){
    if(busy) return; busy=true;
    try{
      var R=root(); if(!R) return;
      var tr=R.querySelector('.toprow'); if(!tr) return;
      R.classList.remove('stacked');
      void tr.offsetWidth;                                  /* force the reflow we measure */
      var need=window.innerWidth<=760, i, r, e;
      var trb=tr.getBoundingClientRect();
      /* 1. the two groups are closer than 12px */
      var tags=R.querySelector('.tags'), ctrls=R.querySelector('.ctrls');
      if(!need&&tags&&ctrls&&!skip(tags)&&!skip(ctrls)){
        var a=tags.getBoundingClientRect(), b=ctrls.getBoundingClientRect();
        if(b.left-a.right<12) need=true;
      }
      /* 2. a control runs past either edge */
      if(!need){
        var kids=tr.querySelectorAll('.nr-pill,.nr-track,.seg,.wgrp,button,#wnote');
        for(i=0;i<kids.length;i++){
          e=kids[i]; if(skip(e)) continue;
          r=e.getBoundingClientRect(); if(!r.width&&!r.height) continue;
          if(r.right>trb.right+0.5||r.left<trb.left-0.5){need=true;break;}
        }
      }
      /* 3. a label has been squeezed narrower than its own text */
      if(!need){
        var ls=tr.querySelectorAll('.nr-pill b,.nr-track,.seg button,button,#wnote,span');
        for(i=0;i<ls.length;i++){
          e=ls[i]; if(skip(e)) continue;
          if(!e.textContent||!e.textContent.trim()) continue;
          if(e.scrollWidth>e.clientWidth+1){need=true;break;}
        }
      }
      /* 4. the toprow wraps — a floating row that wraps grows downwards into the
         title without pushing anything down */
      if(!need){
        var tall=0,ch=tr.children;
        for(i=0;i<ch.length;i++){var h=ch[i].getBoundingClientRect().height;if(h>tall)tall=h;}
        if(trb.height>tall+2) need=true;
      }
      /* 5. the toprow sits on, or within 6px of, the action title */
      if(!need){
        var t=R.querySelector('.nr-strip'); if(!t||skip(t)) t=R.querySelector('h1');
        if(t&&!skip(t)){var tb=t.getBoundingClientRect(); if(tb.top-trb.bottom<6) need=true;}
      }
      if(need) R.classList.add('stacked');
      /* --padl is read AFTER the class lands: the class itself changes the padding */
      R.style.setProperty('--padl',(parseFloat(getComputedStyle(R).paddingLeft)||0)+'px');
    } finally { busy=false; }
  }
  window.fitChrome=fitChrome;
  function kick(){requestAnimationFrame(fitChrome);}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',kick); else kick();
  window.addEventListener('load',kick);
  window.addEventListener('resize',function(){lastW=-1;kick();});
  if(window.ResizeObserver){
    var ro=new ResizeObserver(function(en){
      var w=en&&en[0]?Math.round(en[0].contentRect.width):-1;
      if(w===lastW) return;                                 /* stacking must not re-trigger us */
      lastW=w; kick();
    });
    var r0=root(); if(r0) ro.observe(r0);
  }
})();
</script>

/* patch_topbar.py: one theme switch and the way home, the same in every instrument.

<style>
/* ── READ MODE · narrow screens ──────────────────────────────────────────────
   This artifact normally scales its whole body down so the page fits one screen.
   On a phone that turns 13px type into 4px. Below 760px the scaling is switched
   off and the page simply flows and scrolls at its real size. Desktop is
   untouched — every rule here lives inside the media query. */
@media (max-width:760px){
  html,body{height:auto!important;overflow:auto!important}
  #art,#pw,#pm{height:auto!important;min-height:0!important;max-height:none!important;
    overflow:visible!important;padding:12px 14px 22px 34px!important}
  #view{height:auto!important;min-height:0!important;max-height:none!important;
    overflow:visible!important;flex:none!important;position:static!important}
  #vinner{position:static!important;transform:none!important;width:100%!important;
    padding-bottom:14px!important}
  .nr-rail{width:22px!important}
  .toprow{position:static!important;top:auto!important;right:auto!important;left:auto!important;
    margin:0 0 10px!important;flex-wrap:wrap!important;gap:8px 10px!important;justify-content:flex-start!important}
  .tags{flex-wrap:wrap!important;gap:8px!important;margin-left:-34px!important}
  .ctrls{flex-wrap:wrap!important;gap:8px!important;flex:1 1 100%!important}
  #ft{position:static!important;flex-wrap:wrap!important;row-gap:6px!important;margin-top:14px!important}
  h1{font-size:19px!important;max-width:none!important}
  .grid,.classic,.cols-grid{grid-template-columns:1fr!important}
  table{min-width:0!important}
  .tbl-wrap,.wrap-x{overflow-x:auto!important}
}
</style>
<style>/* READ-MODE TYPE FLOOR — nothing under 11px once the page stops scaling */

@media (max-width:760px){
  #ft{font-size:11px!important}
  .conf,.lp,.li,.nr-track,.nr-foot,.lbl,.note{font-size:11px!important}
  .inum,.chip,.inev,.num,.wf-num,.vnum{font-size:11px!important}
  #ft b,.legend b,.l b{font-size:11px!important}
  /* a row label truncated to '…' is worse than a wrapped one once the page flows */
  [style*="ellipsis"]{white-space:normal!important;text-overflow:clip!important;overflow:visible!important}
}
</style>
