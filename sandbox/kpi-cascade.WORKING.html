<!doctype html>
<!-- KPI cascade read-out (kpi-cascade-builder). Built on artifact-shell-editable.html: render_kpi_cascade.py
     fills /* DATA */ and strips the edit fences for the client build. Views: Tree, Levels, Meetings, Register. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KPI cascade</title>
<style>
/* Type scale — one place, not case by case. Every size below 12px is a token; the
   whole small end lifts on a narrow screen so nothing drops under 11px on a phone. */
:root{
  --fs-65:6.5px; --fs-7:7px; --fs-75:7.5px; --fs-8:8px; --fs-85:8.5px; --fs-9:9px;
  --fs-95:9.5px; --fs-10:10px; --fs-105:10.5px; --fs-11:11px; --fs-115:11.5px;
}
@media (max-width:760px){
  :root{
    --fs-65:11px; --fs-7:11px; --fs-75:11px; --fs-8:11px; --fs-85:11px; --fs-9:11px;
    --fs-95:11px; --fs-10:11.5px; --fs-105:12px; --fs-11:12px; --fs-115:12.5px;
  }
}
</style>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}
  /* ===== BRAND THEME (inlined from templates/brand.css) ===== */
  #art{--navy:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;
      --slate-10:rgba(54,65,86,.09);--navy-10:rgba(11,35,71,.10);--green-10:rgba(28,122,74,.10);
      --rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;--rag-green-text:#2F8F6B;--rag-amber-text:#B97F22;--rag-red-text:#C2483D;--rag-na-text:#6B7480;--tint-green:rgba(47,143,107,.12);--tint-amber:rgba(212,154,58,.16);--tint-red:rgba(210,100,90,.13);--tint-na:rgba(154,164,176,.16);--navy-fill:#0B2347;
      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #art[data-t="dark"]{--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--navy-fill:#243246;--accent:#8FC7E8;--steel:#93A9C4;--rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;--rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;--tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}
  body:has(#art[data-t="dark"]){--page:#0E1620}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:3}
  .tags{display:flex;align-items:center;gap:11px;min-width:0}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)}
  .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:var(--fs-115);letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #art[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  .ctrls{display:flex;gap:9px;flex:none}
  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0;max-width:1300px}
  #art[data-t="dark"] h1{color:#EAEFF5}
  h1 .hl{color:var(--green)}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 16px}
  .subt{font-size:15px;font-weight:600;color:var(--accent)}
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:24px}
  /* ── KPI cascade read-out: four views on one capture (reference.md §7) ── */
  #art{--conn:#B9C4D2;--obj:#0B2347;--drv:rgba(11,35,71,.07)}
  #art[data-t="dark"]{--conn:#4A5A6D;--obj:#2B4166;--drv:rgba(255,255,255,.06)}
  .tdot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
  .tdot.good{background:var(--rag-green)} .tdot.fair{background:var(--rag-amber)} .tdot.weak{background:var(--rag-red)}
  .kbox{display:flex;align-items:center;gap:9px;background:var(--srf,#F7F9FB);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px;color:var(--ink);line-height:1.3;min-height:34px}
  .kbox.prov{border-style:dashed;border-color:var(--steel)}
  .kbox.none{border:1px dashed var(--conn);background:transparent;color:var(--mut);font-size:13px}
  .kbox .kn{min-width:0}
  /* A · tree: objective → driver → KPI → input */
  .tob.th{padding:0 0 8px;border-bottom:2px solid var(--line)}
  .tob.th .h{background:none!important;border:0!important;color:var(--mut)!important;font-size:var(--fs-11)!important;font-weight:700!important;letter-spacing:.6px;text-transform:uppercase;padding-top:0!important;padding-bottom:0!important;min-height:0!important}
  .tob.th .cbox.h{color:var(--mut)}
  .tob.th .kids::before,.tob.th .kids2::before,.tob.th .kid2::before,.tob.th .kid2::after{display:none}
  .mission{display:flex;gap:12px;align-items:baseline;margin:0 0 14px;font-size:14px;color:var(--ink);line-height:1.4}
  .mission b{font-size:var(--fs-11);letter-spacing:.6px;text-transform:uppercase;color:var(--mut);flex:none}
  .tob{display:flex;flex-wrap:wrap;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
  .cbox{flex:0 0 12%;font-size:13px;font-weight:700;color:var(--txt);padding-right:12px;line-height:1.3}
  .tree.wc .obox{flex-basis:17%}
  .obox.miss{background:var(--srf,#F7F9FB);color:var(--mut);border:1.5px dotted var(--mut);font-weight:600}
  .kids.nolines::before{display:none}
  .addline{flex:0 0 100%;display:flex;align-items:center;padding:6px 0 0}
  .addline .obox.ghost,.addline .dbox.ghost{background:none;padding:0;border:0}
  .addline .kids::before,.addline .kids2::before{display:none}
  .addline.top{padding:12px 0 0;gap:0} .addline.top.end{justify-content:flex-end}
  .addline.top>.cbox{padding-right:12px}
  .obox{flex:0 0 19%;background:var(--obj);color:#fff;font-weight:700;font-size:14.5px;border-radius:10px;padding:10px 14px;line-height:1.3}
  .kids,.kids2{flex:1;position:relative;padding-left:28px;min-width:0}
  .kid,.kid2{position:relative}
  .kids>.kid::before,.kids2>.kid2::before{content:"";position:absolute;left:-14px;top:50%;width:14px;border-top:1.5px solid var(--conn)}
  .kids>.kid::after,.kids2>.kid2::after{content:"";position:absolute;left:-14px;top:0;bottom:0;border-left:1.5px solid var(--conn)}
  .kids>.kid:first-child::after,.kids2>.kid2:first-child::after{top:50%}
  .kids>.kid:last-child::after,.kids2>.kid2:last-child::after{bottom:50%}
  .kids>.kid:only-child::after,.kids2>.kid2:only-child::after{display:none}
  .kids::before,.kids2::before{content:"";position:absolute;left:0;top:50%;width:14px;border-top:1.5px solid var(--conn)}
  .dgroup{display:flex;align-items:center;padding:2px 0}
  .dbox{flex:0 0 28%;background:var(--drv);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.3}
  .dbox.empty{background:transparent;padding:0;height:0}
  .kid2{display:flex;align-items:center;gap:14px;padding:3px 0}
  .kid2>.kbox{flex:0 0 60%}
  .inp{flex:1;min-width:0;font-size:12.5px;color:var(--txt);line-height:1.35}
  .addk{font-size:12px;font-weight:700;border:1px dashed var(--accent);background:transparent;color:var(--accent);padding:6px 11px;border-radius:8px;cursor:pointer}
  /* B · cascade by review level: objective blocks on top, one box per level */
  .lv{display:grid;gap:0 14px;align-items:stretch}
  .lv .mbox{background:var(--srf,#F7F9FB);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:14px;color:var(--ink);line-height:1.4;text-align:center}
  .lv .top{background:var(--obj);color:#fff;border-radius:10px;padding:12px 12px;font-weight:700;font-size:14px;text-align:center;line-height:1.3;display:flex;flex-direction:column;justify-content:center}
  .lv .top small{display:block;font-weight:500;font-size:var(--fs-115);opacity:.75;margin-top:3px}
  .lv .rl{border-right:2px solid var(--line);padding:8px 12px 8px 0;display:flex;flex-direction:column;justify-content:center}
  .lv .rl b{font-size:14px;color:var(--ink)} .lv .rl span{font-size:12px;color:var(--mut);line-height:1.35;margin-top:3px}
  .lv .lbox{background:var(--srf,#F7F9FB);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink);line-height:1.35}
  .lv .lbox ul{margin:0;padding:0;list-style:none} .lv .lbox li{margin:2px 0 6px;display:flex;align-items:baseline} .lv .lbox li span{vertical-align:middle}
  .lv .lbox li .tdot{margin-right:9px;width:9px;height:9px;flex:none;transform:translateY(-1px)}
  .lv .lbox li.prov>span:last-child{border-bottom:1.5px dashed var(--steel)}
  .lv .lbox.nok{border:1.5px dashed var(--rag-red);background:var(--tint-red);color:var(--rag-red-text);font-weight:700;display:flex;align-items:center;justify-content:center;min-height:44px}
  .lv .arr{height:26px;display:flex;justify-content:center;align-items:center}
  .lv .arr i{display:block;width:2px;height:14px;background:var(--rag-amber);position:relative;margin-top:-6px}
  .lv .arr i::after{content:"";position:absolute;left:-5px;bottom:-9px;border:6px solid transparent;border-top-color:var(--rag-amber)}
  /* C · KPI by meeting */
  .mt th{text-align:center;padding:0 10px 9px;text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink);font-weight:700;line-height:1.25}
  .mt th small{display:block;font-size:var(--fs-11);font-weight:600;color:var(--mut);margin-top:2px}
  .mt th.l{text-align:left;padding-left:0} .mt th.grp{font-size:var(--fs-105);letter-spacing:.6px;text-transform:uppercase;color:var(--mut);border-bottom:none;padding-bottom:4px}
  .mt td{text-align:center;vertical-align:middle;padding:9px 10px}
  .mt td.l{text-align:left;padding-left:0}
  .mt td.ob{font-weight:700;color:var(--ink);vertical-align:top;padding-top:11px}
  .mt .kc{display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--ink);font-size:13.5px}
  .mt .ck{width:18px;height:18px;color:var(--navy)} #art[data-t="dark"] .mt .ck{color:#EAEFF5}
  .mt .nomt{font-size:var(--fs-11);font-weight:700;color:var(--rag-red-text);background:var(--tint-red);padding:2px 8px;border-radius:999px;white-space:nowrap}
  .mt tfoot td{font-weight:700;color:var(--ink);border-bottom:none;border-top:2px solid var(--line)}
  .mt tfoot td.zero{color:var(--rag-red-text)}
  /* D · register */
  .rg{table-layout:fixed;width:100%}
  .rg th{white-space:normal;padding-right:12px;vertical-align:bottom}
  .rg td{padding:8px 12px 8px 0;font-size:13px;line-height:1.4;vertical-align:top;overflow-wrap:anywhere}
  .rg td .sub{display:block;color:var(--mut);margin-top:2px} .rg .sm{white-space:nowrap}
  .rg td.ob{font-weight:700;color:var(--ink);font-size:13.5px;border-right:1px solid var(--line);padding-right:14px}
  .rg td.ob+td{padding-left:14px} .rg tr:not(.og) td:first-child{padding-left:14px}
  .rg tr.og td{border-top:2px solid var(--line)}
  .rg td.kn b{display:flex;align-items:baseline;gap:8px;font-size:14px} .rg td.kn b .tdot{transform:translateY(1px)}
  .rg td.kn>span{display:block;color:var(--mut);margin-top:3px;line-height:1.35}
  .rg .cpill{margin-left:4px;vertical-align:1px}
  #art{--cue:var(--navy)} #art[data-t="dark"]{--cue:#EAEFF5}
  .rg .tp{display:inline-block;font-size:var(--fs-115);font-weight:700;padding:1px 9px;border-radius:999px;border:1.5px solid var(--cue);color:var(--cue);line-height:1.35;background:transparent!important}
  .rg .tp.lagging{background:var(--cue)!important;color:#fff} #art[data-t="dark"] .rg .tp.lagging{color:#0B2347}
  .rg .tp.lean{border-style:dashed}
  .rg .lvl{display:flex;align-items:center;margin-top:5px;color:var(--mut)}
  .lad{display:inline-flex;gap:2px;margin-right:6px;flex:none} .lad i{width:5px;height:11px;border-radius:1px;background:var(--line)} .lad i.on{background:var(--cue)}
  .rg .src{display:flex;gap:6px;align-items:flex-start}
  svg.av{width:15px;height:15px;color:var(--cue);flex:none;margin-top:1px}
  .rg .nt{display:inline-block;margin-top:3px;font-size:var(--fs-115);color:var(--mut);border:1px dashed var(--mut);border-radius:6px;padding:0 6px;line-height:1.5}
  .rg .bl{color:var(--mut)} .rg .tg{font-weight:700;color:var(--ink)}
  .rg .ck{width:17px;height:17px;color:var(--cue)}
  .lp.cue{display:inline-flex;align-items:center;gap:6px;color:var(--txt);background:rgba(0,0,0,.04)} .lp.cue svg.av{margin:0}
  .rg tr.drop td{color:var(--mut)} .rg tr.drop .dn{text-decoration:line-through;font-weight:600}
  .sm{display:inline-flex;gap:3px} .sm i{font-style:normal;font-size:var(--fs-11);font-weight:700;width:19px;height:19px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:var(--tint-na);color:var(--rag-na-text)}
  .sm i.y{background:var(--tint-green);color:var(--rag-green-text)} .sm i.n{background:var(--tint-red);color:var(--rag-red-text)}
  .notes2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}
  .notes2 h4{margin:0 0 6px;font-size:var(--fs-11);letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
  .notes2 p{margin:0 0 5px;font-size:12.5px;color:var(--txt);line-height:1.45} .notes2 p b{color:var(--ink)}
  /* the target tree: change marks against today */
  .cpill{font-size:var(--fs-11);font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;margin-left:auto;flex:none}
  .cpill.new{background:var(--tint-green);color:var(--rag-green-text)}
  .cpill.chg{background:var(--tint-amber);color:var(--rag-amber-text)}
  .cpill.kept{background:var(--slate-10);color:var(--mut);font-weight:600}
  .cpill.drop{background:var(--tint-na);color:var(--rag-na-text)}
  .kbox.dropped{background:transparent;border:1px dashed var(--line);color:var(--mut)}
  .kbox.dropped .kn{text-decoration:line-through}

  /* the category as a pill inside the objective box (Gilles, 21 Oct 2026) */
  .obox{flex-basis:21%}
  .obox .catp{display:inline-block;font-size:var(--fs-105);font-weight:700;letter-spacing:.3px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;margin-bottom:5px}
  .obox .on{display:block}
  .obox.miss .catp{background:var(--tint-red);color:var(--rag-red-text)}
  .addline .obox.ghost{flex-basis:21%}
  table{border-collapse:collapse;width:100%}
  th{text-align:left;font-size:var(--fs-105);letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:700;padding:0 20px 9px 0;border-bottom:2px solid var(--line)}
  td{font-size:13px;color:var(--txt);padding:11px 20px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
  td b{color:var(--ink)}
  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:12px;font-size:clamp(9.5px,0.75vw,12px);color:var(--mut)}
  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legend{display:flex;gap:7px}
  .lp{font-size:0.95em;font-weight:600;padding:0.2em 0.85em;border-radius:999px}
  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600}
  /*<EDIT>*/
  #art.editing .card{cursor:pointer;transition:opacity .13s,filter .13s,box-shadow .13s,background-color .13s,border-color .13s,outline-color .13s}
  #art.editing .card:hover{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent);box-shadow:0 8px 20px -10px rgba(11,35,71,.4)}
  #art.editing .kbox:not(.none),#art.editing [data-id]{cursor:pointer}
  #art.editing .kbox:not(.none):hover,#art.editing .kc:hover,#art.editing td.kn:hover,#art.editing [data-obj]:hover,#art.editing [data-drv]:hover,#art.editing [data-cat]:hover,#art.editing [data-lvl]:hover,#art.editing [data-mt]:hover,#art.editing [data-addobj]:hover,#art.editing [data-mis]:hover,#art.editing .lbox li:hover{outline:2px solid var(--accent);outline-offset:2px;cursor:pointer}
  /* the two unlocked-state rules every instrument keeps: editable regions get the accent
     hover outline (above); locked regions carry .nr-locked and DIM, with a toast on click */
  #art.editing .nr-locked{opacity:.5;filter:saturate(.7);cursor:help;transition:opacity .15s,filter .15s,box-shadow .15s,background-color .15s,border-color .15s,outline-color .15s}
  #lock{width:34px;height:34px;border:1px solid var(--line);background:var(--card);border-radius:9px;color:var(--mut);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  #lock svg{width:17px;height:17px;display:block}
  #lock.unlocked{background:var(--rag-amber);border-color:var(--rag-amber);color:#fff}
  #save{font-size:12px;font-weight:700;border:1px solid var(--navy-fill);background:var(--navy-fill);color:#fff;padding:8px 13px;border-radius:9px;cursor:pointer;display:none}
  #save.show{display:inline-flex} #save:disabled{opacity:.45;cursor:default}
  #undo,#discard{font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;display:none}
  #undo.show,#discard.show{display:inline-flex} #undo:hover,#discard:hover{border-color:var(--accent)}
  #discard{color:var(--rag-red-text)} #discard.arm{background:var(--rag-red);border-color:var(--rag-red);color:#fff}
  /* the edit strip: while unlocked, the working controls sit in their own row under the
     chrome, so the top bar never changes width (editable-deliverable.md, "The edit strip") */
  .nr-strip{display:none;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 12px;padding:0 0 8px;min-height:34px;border-bottom:1px solid var(--line);color:var(--mut);font-size:12px;position:relative;z-index:60}
  #pm.editing .nr-strip,#art.editing .nr-strip{display:flex}
  .nr-strip>b{font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
  .nr-strip>b::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rag-amber)}
  .nr-strip>b::after{content:"\00B7";font-weight:400;color:var(--mut)}
  .nr-strip .sp{flex:1}
  .nr-strip .nr-strip-n,.nr-strip #wnote.wchip{background:none;padding:0;border-radius:0;font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:inherit}
  .nr-strip #wnote.wchip.bad{color:var(--rag-red-text)}
  /* undo and discard are text links; the send button is the one button */
  .nr-strip #wundo,.nr-strip #wdiscard,.nr-strip #undo,.nr-strip #discard{border:0;background:none;padding:2px;font-size:12px;font-weight:600;color:var(--mut);text-decoration:underline;text-underline-offset:3px}
  .nr-strip #wundo:hover,.nr-strip #wdiscard:hover,.nr-strip #undo:hover,.nr-strip #discard:hover{color:var(--ink)}
  .nr-strip #wdiscard.arm,.nr-strip #discard.arm{background:none;color:var(--rag-red-text);text-decoration:none;font-weight:800}
  .nr-strip #wsave,.nr-strip #save{padding:6px 13px;font-size:var(--fs-115)}

     guessed: fitChrome() below measures the one-row layout and adds .stacked to
     the artifact root. Never hard-code a breakpoint for the chrome — see
     brand-guide.html, "Responsive chrome". Stacked order is brand row, then
     navigation, then working controls: where am I, what am I looking at, what
     can I change. ── */
  #art.stacked .toprow,#pm.stacked .toprow,#pw.stacked .toprow{

  #art.stacked .nr-pill,#pm.stacked .nr-pill,#pw.stacked .nr-pill{

  #art.stacked .nr-track,#pm.stacked .nr-track,#pw.stacked .nr-track{

  #art.stacked .toprow>.seg,#pm.stacked .toprow>.seg,#pw.stacked .toprow>.seg{order:3;flex:1 1 100%}

  #art.stacked #save,#art.stacked #lock,#pm.stacked #save,#pm.stacked #lock,
  #pw.stacked #save,#pw.stacked #lock{order:4}

     rail width on a phone. Chrome layout is no longer its business. */
  @media (max-width:760px){
    #art.stacked,#pm.stacked,#pw.stacked{padding:14px 18px 10px 42px}
    #art.stacked .nr-rail,#pm.stacked .nr-rail,#pw.stacked .nr-rail{width:24px}
  }

(function(){
  var TIER={good:['Good','var(--rag-green)'],fair:['Fair','var(--rag-amber)'],weak:['Weak','var(--rag-red)']};
  /* the register fields completeness is counted on (reference.md §2): derived, never typed in */
  var FIELDS=['definition','formula','owner','source','frequencyMeasure','baseline','target','segmentation'];
  /* SMART as the house methodology words it (reference.md §2) */
  var SM=[['simple','S','Simple and specific'],['measurable','M','Measurable'],['achievable','A','Achievable and agreed'],['results','R','Results-oriented'],['timely','T','Timely']];
  var TYPE={lagging:'Lagging',leading:'Leading',lean:'Lean'};
  var AVAIL={available:'',partial:' (partly available)',aspirational:' (not in place yet)'};
  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function hl(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1</span>');}
  function filled(v){return v!=null&&String(v).trim()!=='';}
  function compl(n){return FIELDS.filter(function(f){return filled(n[f]);}).length/FIELDS.length;}
  function smartN(n){var s=n.smart||{};return SM.filter(function(x){return s[x[0]]===true;}).length;}
  function tier(n){var T=DATA.tiers||{},W=T.weak||{completeness:.4,smart:2},F=T.fair||{completeness:.75,smart:3},c=compl(n),s=smartN(n);
    if(c<W.completeness||s<=W.smart)return 'weak'; if(c<F.completeness||s<=F.smart)return 'fair'; return 'good';}
  function by(a,id){return (a||[]).filter(function(x){return x.id===id;})[0];}
  function NODES(){return DATA.nodes||[];}
  /* the target tree (moment "target"): every KPI is marked against today's capture, kept under DATA.today */
  var TARGET=DATA.moment==='target', TODAY=((DATA.today||{}).nodes)||[];
  var CHG=[['target','New target'],['definition','Redefined'],['formula','Redefined'],['levelId','Moved level'],['parentId','Moved level'],
    ['meetings','New meeting'],['driverId','Moved'],['objectiveId','Moved'],['owner','New owner'],['source','New source'],['type','Retyped']];
  function same(a,b){return JSON.stringify(a==null?null:a)===JSON.stringify(b==null?null:b);}
  function changeOf(n){ if(!TARGET) return null; var t=by(TODAY,n.id); if(!t) return {k:'new',label:'New'};
    var labs=[]; CHG.forEach(function(c){ if(!same(n[c[0]],t[c[0]])&&labs.indexOf(c[1])<0) labs.push(c[1]); });
    return labs.length?{k:'chg',label:labs.length===1?labs[0]:'Changed',what:labs}:{k:'kept',label:'Kept'}; }
  function DROPPED(){ return TARGET?TODAY.filter(function(t){return !by(NODES(),t.id);}):[]; }
  function cpill(c){ return c?'<span class="cpill '+c.k+'">'+esc(c.label)+'</span>':''; }
  function kpiBox(n,cls){var t=tier(n);
    return '<div class="kbox'+(n.provisional?' prov':'')+(cls?' '+cls:'')+'" data-id="'+esc(n.id)+'"><span class="tdot '+t+'"></span><span class="kn">'+esc(n.name)+'</span>'+cpill(changeOf(n))+'</div>';}
  function dropBox(t){ return '<div class="kid2"><div class="kbox dropped"><span class="kn">'+esc(t.name)+'</span><span class="cpill drop">Dropped</span></div><div class="inp"></div></div>'; }
  /* the house KPI categories (reference.md §0); DATA.categories is the checklist agreed for this team */
  var HOUSE_CATS=[['quality','Quality and risk'],['people','People'],['productivity','Productivity'],['customer','Customer satisfaction'],['improvement','Continuous improvement'],['finance','Finance']];
  function CATS(){return DATA.categories||[];}
  /* objectives in reading order: by category, then those without one */
  function OBJS(){ var C=CATS(), O=(DATA.objectives||[]).slice();
    if(!C.length) return O; var ci={}; C.forEach(function(c,i){ci[c.id]=i;});
    return O.map(function(o,i){return [o,i];}).sort(function(a,b){var x=ci[a[0].categoryId],y=ci[b[0].categoryId];x=x==null?99:x;y=y==null?99:y;return x-y||a[1]-b[1];}).map(function(p){return p[0];}); }
  function ED(k,id){ return ''/*<EDIT>*/+(ON?' data-'+k+'="'+esc(id)+'"':'')/*</EDIT>*/; }
  /* the add buttons sit in the column of the thing they add: a driver under the drivers, a KPI under the KPIs */
  function addLine(o){ return ''/*<EDIT>*/+(ON?'<div class="addline">'+'<div class="obox ghost"></div><div class="kids"><div class="dgroup"><div class="dbox ghost"><button class="addk" data-adddrv="'+esc(o.id)+'">+ Add driver</button></div><div class="kids2"><button class="addk" data-add="'+esc(o.id)+'">+ Add KPI</button></div></div></div></div>':'')/*</EDIT>*/; }
  function addTail(){ var h='';/*<EDIT>*/ if(ON){ var miss=HOUSE_CATS.filter(function(c){return !by(CATS(),c[0]);});
    var wc=CATS().length>0;
    h='<div class="addline top"><button class="addk" data-addobj="">+ Add main objective</button>'+(wc&&miss.length?'<button class="addk" data-addcat="1">+ Add category</button>':'')+'</div>'; } /*</EDIT>*/ return h; }
  /* A · the KPI tree: category → main objective → driver → KPI → input */
  function renderTree(){
    var withCat=CATS().length>0;
    var h='<div class="tree"><div class="tob th">'+'<div class="obox h">Main objective</div><div class="kids h"><div class="dgroup"><div class="dbox h">Driver</div>'+
      '<div class="kids2 h"><div class="kid2"><div class="kbox h">KPI</div><div class="inp h">Input</div></div></div></div></div></div>';
    var M=DATA.mission||{};
    if(M.text) h='<div class="mission"'+ED('mis','1')+'><b>Mission</b><span>'+esc(M.text)+'</span></div>'+h;
    /*<EDIT>*/ else if(ON) h='<div class="mission"'+ED('mis','1')+'><b>Mission</b><span style="color:var(--mut)">Not written down yet. Click to add it.</span></div>'+h; /*</EDIT>*/
    var shown={};
    function objRow(o){
      var ks=NODES().filter(function(n){return n.objectiveId===o.id;}), ds=(DATA.drivers||[]).filter(function(d){return d.objectiveId===o.id;});
      var groups=ds.map(function(d){return {d:d,ks:ks.filter(function(n){return n.driverId===d.id;})};});
      var loose=ks.filter(function(n){return !by(ds,n.driverId);}); if(loose.length||!groups.length) groups.push({d:null,ks:loose});
      var gap=(DATA.gaps||[]).filter(function(g){return g.objectiveId===o.id;})[0], c=by(CATS(),o.categoryId);
      var pill=withCat?'<span class="catp"'+(c?ED('cat',c.id):'')+'>'+(c?esc(c.name):'No category')+'</span>':'';
      var r='<div class="tob"><div class="obox"'+ED('obj',o.id)+'>'+pill+'<span class="on">'+esc(o.name)+'</span></div><div class="kids">';
      groups.forEach(function(g){
        r+='<div class="kid"><div class="dgroup">'+(g.d?'<div class="dbox"'+ED('drv',g.d.id)+'>'+esc(g.d.name)+'</div>':'<div class="dbox empty"></div>')+'<div class="kids2">';
        if(!g.ks.length) r+='<div class="kid2"><div class="kbox none">'+esc(gap&&!ks.length?gap.note:'No KPI yet')+'</div><div class="inp"></div></div>';
        g.ks.forEach(function(n){r+='<div class="kid2">'+kpiBox(n)+'<div class="inp">'+esc(n.source||'')+esc(AVAIL[n.dataAvailability]||'')+'</div></div>';});
        DROPPED().filter(function(t){return t.objectiveId===o.id&&(g.d?t.driverId===g.d.id:!by(ds,t.driverId));}).forEach(function(t){r+=dropBox(t);});
        r+='</div></div></div>';
      });
      return r+'</div>'+addLine(o)+'</div>';
    }
    var objs=OBJS();
    if(withCat){
      CATS().forEach(function(c){ var os=objs.filter(function(o){return o.categoryId===c.id;});
        if(os.length) os.forEach(function(o){h+=objRow(o);});
        else h+='<div class="tob"><div class="obox miss"'+ED('addobj',c.id)+'><span class="catp">'+esc(c.name)+'</span><span class="on">No objective</span></div><div class="kids nolines"></div></div>'; });
      objs.filter(function(o){return !by(CATS(),o.categoryId);}).forEach(function(o){h+=objRow(o);});
    } else objs.forEach(function(o){h+=objRow(o);});
    return h+'</div>'+addTail();
  }
  /* B · the cascade by review level, as the house deck draws it: the main objectives on top, one box per level */
  function renderLevels(){
    var L=DATA.levels||[], objs=OBJS();
    var cols='minmax(130px,12%) repeat('+Math.max(objs.length,1)+',minmax(0,1fr))';
    var h='<div class="lv" style="grid-template-columns:'+cols+'">', M=DATA.mission||{};
    if(M.text){ h+='<div class="rl"><b>Mission</b></div><div class="mbox"'+ED('mis','1')+' style="grid-column:span '+Math.max(objs.length,1)+'">'+esc(M.text)+'</div>'+
      '<div></div>'+objs.map(function(){return '<div class="arr"><i></i></div>';}).join(''); }
    h+='<div></div>';
    objs.forEach(function(o){var c=by(CATS(),o.categoryId);h+='<div class="top"'+ED('obj',o.id)+'>'+esc(o.name)+(c?'<small>'+esc(c.name)+'</small>':'')+'</div>';});
    h+='<div></div>'+objs.map(function(){return '<div class="arr"><i></i></div>';}).join('');
    var at=function(o,l){return NODES().filter(function(n){return n.objectiveId===o.id&&n.levelId===l.id;});};
    L.forEach(function(l,li){
      if(li>0){ h+='<div></div>'+objs.map(function(o){return '<div class="arr">'+(at(o,L[li-1]).length&&at(o,l).length?'<i></i>':'')+'</div>';}).join(''); }
      h+='<div class="rl"'+ED('lvl',l.id)+'><b>'+esc(l.name)+'</b>'+(l.participants?'<span>'+esc(l.participants)+'</span>':'')+'</div>';
      objs.forEach(function(o){ var ks=at(o,l);
        h+=ks.length?'<div class="lbox"><ul>'+ks.map(function(n){return '<li class="'+(n.provisional?'prov':'')+'" data-id="'+esc(n.id)+'"><span class="tdot '+tier(n)+'"></span><span>'+esc(n.name)+'</span></li>';}).join('')+'</ul></div>'
          :'<div class="lbox nok">No KPI</div>'; });
    });
    h+='</div>';
    /*<EDIT>*/ if(ON) h+='<div class="addline top"><button class="addk" data-addlvl="1">+ Add review level</button></div>'; /*</EDIT>*/
    return h;
  }
  var CK='<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  function renderMeetings(){

    var M=(DATA.meetings||[]).slice().sort(function(a,b){return (lvIdx[a.levelId]==null?99:lvIdx[a.levelId])-(lvIdx[b.levelId]==null?99:lvIdx[b.levelId]);});
    var h='<table class="mt" data-stretch><colgroup><col style="width:17%"><col style="width:27%"><col style="width:9%">'+M.map(function(){return '<col>';}).join('')+'</colgroup>'+
      '<thead><tr><th class="grp l" colspan="3"></th><th class="grp" colspan="'+M.length+'">Discussed in</th></tr>'+
      '<tr><th class="l">Main objective</th><th class="l">KPI</th><th class="l">Type</th>'+M.map(function(m){var l=by(L,m.levelId);return '<th'+ED('mt',m.id)+'>'+esc(m.name)+(l?'<small>'+esc(l.name)+'</small>':'')+'</th>';}).join('')+'</tr></thead><tbody>';
    OBJS().forEach(function(o){

<script>
/* ── fitChrome() — the chrome stacks when it does not fit ────────────────────
   Measures the one-row layout and adds .stacked to the artifact root when any of
   six things is true: the two groups are closer than 12px · a control runs past
   either edge · a label has been squeezed narrower than its own text · the
   toprow wraps · the toprow comes within 6px of the action title · the viewport
   is at or below 760px (the floor). Exposed as window.fitChrome() so a render
   pass can call it after it changes a label. ── */
(function(){
  var busy=false,lastW=-1;
  function root(){return document.querySelector('#art,#pm,#pw');}
  function skip(e){
    if(!e) return true;
    if(e.id==='wpop'||(e.closest&&e.closest('#wpop'))) return true;
    var cs=getComputedStyle(e);
    if(cs.visibility==='hidden'||cs.display==='none') return true;
    return false;
  }
  function fitChrome(){
    if(busy) return; busy=true;
    try{
      var R=root(); if(!R) return;
      var tr=R.querySelector('.toprow'); if(!tr) return;
      R.classList.remove('stacked');
      void tr.offsetWidth;                                  /* force the reflow we measure */
      var need=window.innerWidth<=760, i, r, e;
      var trb=tr.getBoundingClientRect();
      /* 1. the two groups are closer than 12px */
      var tags=R.querySelector('.tags'), ctrls=R.querySelector('.ctrls');
      if(!need&&tags&&ctrls&&!skip(tags)&&!skip(ctrls)){
        var a=tags.getBoundingClientRect(), b=ctrls.getBoundingClientRect();
        if(b.left-a.right<12) need=true;
      }
      /* 2. a control runs past either edge */
      if(!need){
        var kids=tr.querySelectorAll('.nr-pill,.nr-track,.seg,.wgrp,button,#wnote');
        for(i=0;i<kids.length;i++){
          e=kids[i]; if(skip(e)) continue;
          r=e.getBoundingClientRect(); if(!r.width&&!r.height) continue;
          if(r.right>trb.right+0.5||r.left<trb.left-0.5){need=true;break;}
        }
      }
      /* 3. a label has been squeezed narrower than its own text */
      if(!need){
        var ls=tr.querySelectorAll('.nr-pill b,.nr-track,.seg button,button,#wnote,span');
        for(i=0;i<ls.length;i++){
          e=ls[i]; if(skip(e)) continue;
          if(!e.textContent||!e.textContent.trim()) continue;
          if(e.scrollWidth>e.clientWidth+1){need=true;break;}
        }
      }
      /* 4. the toprow wraps — a floating row that wraps grows downwards into the
         title without pushing anything down */
      if(!need){
        var tall=0,ch=tr.children;
        for(i=0;i<ch.length;i++){var h=ch[i].getBoundingClientRect().height;if(h>tall)tall=h;}
        if(trb.height>tall+2) need=true;
      }
      /* 5. the toprow sits on, or within 6px of, the action title */
      if(!need){
        var t=R.querySelector('.nr-strip'); if(!t||skip(t)) t=R.querySelector('h1');
        if(t&&!skip(t)){var tb=t.getBoundingClientRect(); if(tb.top-trb.bottom<6) need=true;}
      }
      if(need) R.classList.add('stacked');
      /* --padl is read AFTER the class lands: the class itself changes the padding */
      R.style.setProperty('--padl',(parseFloat(getComputedStyle(R).paddingLeft)||0)+'px');
    } finally { busy=false; }
  }
  window.fitChrome=fitChrome;
  function kick(){requestAnimationFrame(fitChrome);}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',kick); else kick();
  window.addEventListener('load',kick);
  window.addEventListener('resize',function(){lastW=-1;kick();});
  if(window.ResizeObserver){
    var ro=new ResizeObserver(function(en){
      var w=en&&en[0]?Math.round(en[0].contentRect.width):-1;
      if(w===lastW) return;                                 /* stacking must not re-trigger us */
      lastW=w; kick();
    });
    var r0=root(); if(r0) ro.observe(r0);
  }
})();
</script>
<script id="nr-topbar-js">
/* patch_topbar.py: one theme switch and the way home, the same in every instrument.
   Theme: the choice is kept under the cockpit's key, nr_dark, so every page of an
   engagement opens the same way. Home: a page that carries
   <meta name="nr-home" content="index.html"> (the engagement artifact adds it) gets
   "< Cockpit /" in front of its section tag. */
(function(){
  var K='nr_dark', box=document.getElementById('theme')||document.getElementById('tseg');
  if(box){
    box.querySelectorAll('button').forEach(function(b){ var d=b.getAttribute('data-s')==='dark';
      b.title=d?'Dark mode':'Light mode'; b.setAttribute('aria-label',b.title);
      b.addEventListener('click',function(){ try{ localStorage.setItem(K,d?'1':'0'); }catch(e){} }); });
    var v=null; try{ v=localStorage.getItem(K); }catch(e){}
    var dk=box.querySelector('button[data-s="dark"]');
    if(v==='1'&&dk&&!dk.classList.contains('on')) dk.click();
  }
  var m=document.querySelector('meta[name="nr-home"]'), lens=document.getElementById('lens')||document.querySelector('.toprow .nr-track');
  if(m&&lens&&!document.querySelector('.nr-crumb')){
    var c=document.createElement('div'); c.className='nr-track nr-crumb';
    var a=document.createElement('a'); a.className='nr-home'; a.href=m.getAttribute('content')||'index.html';
    a.textContent='\u2039 '+(m.getAttribute('data-label')||'Cockpit'); a.title='Back to the engagement cockpit';
    /* opened in a window of the findings dashboard (a frame of our own page): go back in that page, not in the frame */
    try{ if(window.parent!==window&&window.parent.document) a.target='_parent'; }catch(e){}
    var s=document.createElement('span'); s.className='nr-sep'; s.textContent='/';
    lens.parentNode.insertBefore(c,lens); c.appendChild(a); c.appendChild(s); c.appendChild(lens);
    if(window.fitChrome) requestAnimationFrame(window.fitChrome);

})();

<script id="nr-glass-js">

      if((i<r||i>w-r)&&(j<r||j>h-r)){ var l=Math.sqrt(dx*dx+dy*dy)||1; dist=r-l; nx=dx/l; ny=dy/l; }

<style>

   This artifact normally scales its whole body down so the page fits one screen.
   On a phone that turns 13px type into 4px. Below 760px the scaling is switched
   off and the page simply flows and scrolls at its real size. Desktop is

<!-- NR-REFIT:BEGIN — fit again when the space changes (diagnostic-skill-builder/templates/refit-layer.html,
     put in by scripts/patch_refit.py). Every page fits its view on a window resize. The space a page has can
     also change without one: fonts that arrive late, the header stacking, a preview pane or iframe that grows
     after the first paint. Then the page used to keep its first fit until you switched tabs. This watches the
     view and the window, and replays the page's own resize handling once that space has really changed
     (a change in the page's content alone does not count). -->
<script>(function(){
  var last = '', t = 0;
  function box(){ var v = document.getElementById('view'); return (v ? v.clientWidth + 'x' + v.clientHeight + '/' : '') + innerWidth + 'x' + innerHeight; }
  function kick(){ var k = box(); if(k === last) return; last = k; window.dispatchEvent(new Event('resize')); }
  function soon(){ cancelAnimationFrame(t); t = requestAnimationFrame(kick); }
  function again(){ last = ''; soon(); }
  function watch(){ if(!window.ResizeObserver) return; var ro = new ResizeObserver(soon), v = document.getElementById('view');
    if(v) ro.observe(v); ro.observe(document.documentElement); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watch); else watch();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(again);
  window.addEventListener('load', again);
})();</script>
