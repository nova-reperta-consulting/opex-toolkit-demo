<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Process Map</title>
<style>
/* Type scale — one place, not case by case. Every size below 12px is a token; the
   whole small end lifts on a narrow screen so nothing drops under 11px on a phone. */
:root{
  --fs-65:6.5px; --fs-7:7px; --fs-75:7.5px; --fs-8:8px; --fs-85:8.5px; --fs-9:9px;
  --fs-95:9.5px; --fs-10:10px; --fs-105:10.5px; --fs-11:11px; --fs-115:11.5px;
}
@media (max-width:760px){
  :root{
    --fs-65:11px; --fs-7:11px; --fs-75:11px; --fs-8:11px; --fs-85:11px; --fs-9:11px;
    --fs-95:11px; --fs-10:11.5px; --fs-105:12px; --fs-11:12px; --fs-115:12.5px;
  }
}
</style>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}
  #pm{--navy:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;
      --slate-10:rgba(54,65,86,.09);--rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;--rag-green-text:#2F8F6B;--rag-amber-text:#B97F22;--rag-red-text:#C2483D;--rag-na-text:#6B7480;--tint-green:rgba(47,143,107,.12);--tint-amber:rgba(212,154,58,.16);--tint-red:rgba(210,100,90,.13);--tint-na:rgba(154,164,176,.16);--navy-fill:#0B2347;
      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;--soft:#F5F7FB;
      --lev-auto:#3B6FBF;--lev-aiacc:#1C7A4A;--lev-aienh:#6EB1D1;--lev-process:#2A4D8F;--lev-journey:#C0392B;--lev-lean:#145530;--lev-data:#B8620A;--lev-change:#6B4E9E;--lev-org:#1F6F66;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #pm[data-t="dark"]{--lev-auto:#6E9BDB;--lev-aiacc:#5FBF94;--lev-aienh:#8FC7E8;--lev-process:#7FA3DB;--lev-journey:#E8877C;--lev-lean:#5FA87F;--lev-data:#D9A05B;--lev-change:#A48CD1;--lev-org:#5FB5A9;--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--soft:#141E2A;--navy-fill:#243246;--navy2:#31517F;--accent:#8FC7E8;--steel:#93A9C4;--rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;--rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;--tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}
  body:has(#pm[data-t="dark"]){--page:#0E1620}
  #pm[data-t="dark"] .prow .pbadge,#pm[data-t="dark"] #pin .ptp,#pm[data-t="dark"] #pin .tchip.pn,#pm[data-t="dark"] #pin .plegend .lp,#pm[data-t="dark"] .pchpill{color:#16202C}
  
  #pm[data-t="dark"] #pin .tcb{background:rgba(0,0,0,.22)}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:70}
  /* stacking ladder (chevrons use inline z-index 1..N, so everything else must clear them):
     content 1-10 · sticky grid headers 2-4 · toprow+gear 70 · pin modal 80 · tooltip 85 · editor panel 90 */
  .tags{display:flex;align-items:center;gap:11px;min-width:0}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)}
  .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:var(--fs-115);letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #pm[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  .ctrls{display:flex;gap:9px;flex:none}
  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0;max-width:1300px}
  #pm[data-t="dark"] h1{color:#EAEFF5}
  h1 .hl{color:var(--green)}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 14px}
  .subt{font-size:13.5px;font-weight:600;color:var(--accent)}
  .kpis{display:flex;gap:10px;flex-wrap:wrap}
  .kpi{background:var(--soft);border-radius:12px;padding:7px 14px;min-width:96px}
  .kpi .l{font-size:var(--fs-105);color:var(--mut);font-weight:600}
  .kpi .n{font-size:20px;font-weight:800;color:var(--navy);line-height:1.05}
  #pm[data-t="dark"] .kpi .n{color:#EAEFF5}
  .kpi .n.hl{color:var(--green)} .kpi .n.warn{color:var(--rag-red)}
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:18px}
  #pm.scrollmode #view{overflow:auto}
  #pm.scrollmode #vinner{position:relative;transform:none!important;width:auto!important}

  .swim{display:grid;gap:7px;min-width:520px}
  .colh{font-size:var(--fs-10);letter-spacing:.5px;font-weight:700;color:var(--mut);text-transform:uppercase;text-align:center;padding:2px 0 3px}
  .lh{background:var(--soft);border-radius:9px;display:flex;align-items:center;padding:0 12px;font-size:12.5px;font-weight:800;color:var(--ink)}
  .cw{background:var(--soft);border-radius:9px;padding:3px}
  .cell{min-height:30px;height:100%;display:flex;flex-direction:column;gap:5px}
  .act{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--rag-na);border-radius:8px;padding:8px 10px;height:100%;cursor:default}
  .act .sn{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.22}
  .act .meta{font-size:var(--fs-10);color:var(--mut);margin-top:2px}
  .tagrow{display:flex;gap:4px;align-items:center;margin-top:6px;flex-wrap:wrap}
  .chip{font-size:var(--fs-95);font-weight:700;padding:1px 7px;border-radius:5px;background:var(--soft);color:var(--txt)}
  .nat{font-size:var(--fs-95);font-weight:700;padding:1px 8px;border-radius:5px;color:#fff;display:inline-block;white-space:nowrap}
  .pn{font-size:var(--fs-95);font-weight:700;padding:1px 7px;border-radius:5px}
  .dgrid{display:grid;gap:5px;min-width:max-content}
  .dband{font-size:var(--fs-105);font-weight:700;color:#fff;border-radius:7px;padding:6px 10px;display:flex;align-items:center;gap:7px}
  .dweek{font-size:var(--fs-95);letter-spacing:.4px;font-weight:700;color:var(--mut);text-transform:uppercase;text-align:center;align-self:center}
  .dlane{background:var(--soft);border-radius:8px;display:flex;align-items:center;padding:0 11px;font-size:var(--fs-115);font-weight:700;color:var(--ink);position:sticky;left:0;z-index:2}
  .dcell{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--rag-na);border-radius:7px;padding:7px 9px;cursor:default;overflow:hidden;display:flex;flex-direction:column;justify-content:center;position:relative;transition:border-color .14s,box-shadow .14s}
  .dcell:hover{border-color:var(--accent);box-shadow:var(--sh)}
  .dcell .dn{font-size:var(--fs-11);font-weight:700;color:var(--ink);line-height:1.2;padding-right:13px}
  .dcell .dm{font-size:var(--fs-9);color:var(--mut);margin-top:2px}
  .dcell .ppn{display:inline-block;margin-top:4px;font-size:var(--fs-85);font-weight:700;padding:0 6px;border-radius:5px}
  .dmile{background:var(--navy-fill);color:#fff;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:var(--fs-10);font-weight:700;text-align:center;padding:6px;writing-mode:vertical-rl;transform:rotate(180deg)}
  .swsub{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .swhint{font-size:var(--fs-105);color:var(--mut)}
  .swg{display:grid;gap:8px;min-width:720px;align-items:stretch}
  .swcorner{position:sticky;left:0;top:0;z-index:4;background:var(--bg)}
  .swch{position:sticky;top:0;z-index:3;background:var(--navy-fill);color:#fff;font-size:var(--fs-11);font-weight:700;padding:8px 12px;border-radius:8px;display:flex;flex-direction:column;gap:4px}
  .swchn{width:17px;height:17px;border-radius:50%;background:#fff;color:var(--navy);font-size:var(--fs-10);font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .swcht{flex:1;min-width:0;line-height:1.2}
  .swchc{font-size:var(--fs-95);font-weight:700;color:rgba(255,255,255,.72);background:rgba(255,255,255,.14);border-radius:999px;padding:1px 7px;flex:none}
  .swlane{position:sticky;left:0;z-index:2;background:var(--soft);border-radius:8px;display:flex;align-items:center;gap:7px;padding:0 12px;font-size:var(--fs-115);font-weight:800;color:var(--ink);min-height:44px}
  .swcell{display:flex;flex-direction:column;gap:6px;padding:2px;min-height:40px}
  .swcell.swempty{background:var(--soft);border-radius:8px;opacity:.45;min-height:0}
  .swact{font-size:var(--fs-8);font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;padding:3px 2px 0}
  .swt{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--rag-na);border-radius:8px;padding:7px 10px;cursor:default;position:relative;transition:border-color .14s,box-shadow .14s}
  .swt:hover{border-color:var(--accent);box-shadow:var(--sh)}
  .swt .swn{font-size:var(--fs-11);font-weight:700;color:var(--ink);line-height:1.28;padding-right:15px}
  .swt .swm{font-size:var(--fs-9);color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .swgo{position:absolute;top:6px;right:7px;color:var(--mut);opacity:.35;transition:.14s;line-height:0;pointer-events:none}
  .swt:hover .swgo,.dcell:hover .swgo{opacity:1;color:var(--accent)}
  .swt .swp{font-size:var(--fs-85);font-weight:700;padding:0 6px;border-radius:5px;background:rgba(210,100,90,.14);color:#C2483D}
  .swchtop{display:flex;align-items:center;gap:8px}
  .swchsub{font-size:var(--fs-9);font-weight:600;color:rgba(255,255,255,.74);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .swchsub b{color:#fff;font-weight:800}
  .swchsub .warn{color:#F3B8B0;font-weight:800}
  .swlane{cursor:pointer}
  .swlane:hover{background:var(--slate-10)}
  .swcaret{font-size:var(--fs-8);color:var(--mut);flex:none;width:8px;transition:transform .15s}
  .swln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .swlsum{font-size:var(--fs-85);font-weight:700;color:var(--mut);flex:none}
  .swrowsum{display:flex;align-items:center;gap:10px;padding:0 13px;font-size:var(--fs-10);color:var(--mut);background:var(--soft);border-radius:8px;cursor:pointer}
  .swrowsum b{color:var(--ink);font-weight:800}
  .swrowsum .warn{color:var(--rag-red);font-weight:800}
  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:10px;font-size:clamp(9.5px,0.75vw,12px);color:var(--mut)}
  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legend{display:flex;gap:7px;flex-wrap:wrap}
  .lp{font-size:0.95em;font-weight:600;padding:0.2em 0.85em;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
  .lp i{width:9px;height:9px;border-radius:3px;display:inline-block}
  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600}
  .cov{margin-top:10px;font-size:var(--fs-105);color:#B07A1E;background:rgba(212,154,58,.10);border:1px solid rgba(212,154,58,.28);border-radius:8px;padding:7px 12px;line-height:1.4}
  .nbwrap{margin-bottom:14px}
  .nblabel{font-size:var(--fs-115);font-weight:600;color:var(--txt);margin-bottom:5px}
  .natbar{display:flex;height:26px;border-radius:7px;overflow:hidden;font-size:var(--fs-10);font-weight:700}
  .natbar>div{display:flex;align-items:center;justify-content:center;color:#fff;min-width:0}
  .natbar>div span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
  .atile{position:relative;border-radius:8px;border:1px solid var(--line);padding:7px 9px;height:100%;min-height:46px;cursor:default}
  .atile .afte{font-size:16px;font-weight:800;color:var(--ink);line-height:1}
  .atile .afte span{font-size:var(--fs-9);font-weight:600;color:var(--mut)}
  .atile .acount{font-size:var(--fs-95);color:var(--mut);margin:2px 0 6px}
  .amix{display:flex;height:5px;border-radius:3px;overflow:hidden}
  .pdot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--rag-red)}
  .lanetot,.phasetot{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--navy)}
  #pm[data-t="dark"] .lanetot,#pm[data-t="dark"] .phasetot{color:var(--ink)}
  .phlabel{display:flex;align-items:center;font-size:var(--fs-95);font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
  .pcard{background:var(--soft);border-radius:10px;padding:8px 11px;display:flex;flex-direction:column;justify-content:center}
  .pcn{font-size:var(--fs-11);font-weight:700;color:var(--ink);line-height:1.2}
  .pcm{font-size:var(--fs-10);color:var(--mut);margin-top:3px}
  .ribbon2{display:flex;gap:5px;margin-bottom:15px}
  .chev2{flex:1;min-width:0;color:var(--ink)}
  .chev2 .c2h{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .chev2 .c2n{width:17px;height:17px;border-radius:50%;background:var(--navy-fill);color:#fff;font-size:var(--fs-10);font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .chev2 .c2t{font-size:12px;font-weight:700;line-height:1.18}
  .chev2 .c2m{font-size:var(--fs-10);font-weight:600;color:var(--mut);margin-bottom:7px}
  .chev2 .c2a{display:flex;gap:3px;flex-wrap:wrap}
  .ochip{font-size:var(--fs-85);font-weight:600;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
  .pcols{display:grid;gap:13px;align-items:start;padding-right:18px;overflow-x:auto}
  .pcol{display:flex;flex-direction:column;gap:9px}
  .pcolh{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:54px;padding-top:5px;padding-bottom:5px;background:var(--navy-fill)}
  .pchev{position:relative;background:var(--bg);padding:3px}
  .pchh{display:flex;align-items:center;gap:7px;margin-bottom:4px}
  .pchn{width:18px;height:18px;border-radius:50%;background:#fff;color:var(--navy);font-size:var(--fs-105);font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .pcht{font-size:clamp(10.5px,1vw,12px);font-weight:700;color:#fff;line-height:1.15;padding-right:16px;overflow-wrap:anywhere}
  .pchm{font-size:clamp(8.5px,0.79vw,9.5px);font-weight:600;color:rgba(255,255,255,.74);padding-right:14px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 5px}
  .pcha{display:flex;gap:3px;flex-wrap:wrap}
  .phead{display:flex;flex-direction:column;gap:4px}
  .pcap{font-size:clamp(9px,0.83vw,10px);font-weight:600;color:var(--mut);padding:0 4px 0 2px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
  .pcolh .cc{font-size:var(--fs-95);font-weight:700;color:var(--rag-red);white-space:nowrap}
  .prow{display:flex;align-items:flex-start;gap:5px;padding:3px 9px;border-bottom:1px solid var(--line);cursor:default}
  .prow:hover{background:var(--slate-10)}
  .prow .pi{font-size:var(--fs-8);color:var(--mut);min-width:13px;padding-top:2px}
  .prow .pt{font-size:var(--fs-95);line-height:1.25;flex:1;min-width:0;color:var(--ink)}
  .prow .owner{font-size:var(--fs-8);font-weight:700;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:0 4px;overflow-wrap:anywhere;flex:none}
  .prow .pbadge{font-size:var(--fs-85);font-weight:700;color:#fff;background:var(--rag-red);border-radius:999px;min-width:14px;text-align:center;padding:0 3px;flex:none}
  .prow .fchip{font-size:var(--fs-8);font-weight:700;color:var(--navy);background:var(--sky);border-radius:4px;padding:0 4px;white-space:nowrap;flex:none}
  .acard{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 16px 0 0;padding:10px 12px;min-height:112px;display:flex;flex-direction:column;overflow:hidden;position:relative;transition:border-color .14s,box-shadow .14s,transform .14s}
  .acn{font-size:clamp(10.5px,1vw,12px);font-weight:700;color:var(--ink);line-height:1.25;padding-right:16px;overflow-wrap:anywhere}
  .acm{font-size:var(--fs-10);color:var(--mut);margin:4px 0 7px}
  .aca{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden;margin-top:auto}
  .ochip2{font-size:var(--fs-85);font-weight:600;color:var(--txt);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 7px;white-space:nowrap}
  .acard .amix{margin-top:6px}
  #pinwrap{position:fixed;inset:0;background:rgba(11,23,45,.32);z-index:80;display:none;align-items:center;justify-content:center;padding:24px}
  #pinwrap.on{display:flex}
  #pin{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);max-width:860px;width:100%;max-height:82vh;overflow:auto;padding:18px 22px}
  #pin .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  #pin .pnm{font-size:15px;font-weight:800;color:var(--ink);line-height:1.2}
  #pin .px{cursor:pointer;color:var(--mut);font-size:20px;line-height:1;border:none;background:none;padding:0 2px}
  #pin .psub{font-size:var(--fs-11);color:var(--mut);margin:3px 0 8px}
  #pin .pkick{font-size:var(--fs-85);font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--green);margin-bottom:2px}
  #pin .pt{padding:8px 0;border-top:1px solid var(--line)}
  #pin .pthead{padding:0 0 6px;border-top:none;position:sticky;top:0;background:var(--card);z-index:1;box-shadow:0 1px 0 var(--line)}
  #pin .pth{display:grid;grid-template-columns:1fr auto;align-items:center;gap:11px}
  #pin .hc{font-size:var(--fs-85);font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
  #pin .hce{justify-self:end}
  #pin .ptn{font-size:12px;font-weight:700;color:var(--ink);line-height:1.3;min-width:0}
  #pin .ptown{font-size:var(--fs-95);font-weight:700;color:var(--mut);white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center}
  #pin .ptnone{color:var(--line);font-weight:700}
  #pin .ptp{font-size:var(--fs-85);font-weight:800;color:#fff;background:var(--rag-red);border-radius:999px;padding:2px 0;min-width:22px;text-align:center;justify-self:end}
  #pin .ptp0{font-size:12px;color:var(--line);justify-self:end;width:100%;text-align:center}

<script>
/* ── fitChrome() — the chrome stacks when it does not fit ────────────────────
   Measures the one-row layout and adds .stacked to the artifact root when any of
   six things is true: the two groups are closer than 12px · a control runs past
   either edge · a label has been squeezed narrower than its own text · the
   toprow wraps · the toprow comes within 6px of the action title · the viewport
   is at or below 760px (the floor). Exposed as window.fitChrome() so a render
   pass can call it after it changes a label. ── */
(function(){
  var busy=false,lastW=-1;
  function root(){return document.querySelector('#art,#pm,#pw');}
  function skip(e){
    if(!e) return true;
    if(e.id==='wpop'||(e.closest&&e.closest('#wpop'))) return true;
    var cs=getComputedStyle(e);
    if(cs.visibility==='hidden'||cs.display==='none') return true;
    return false;
  }
  function fitChrome(){
    if(busy) return; busy=true;
    try{
      var R=root(); if(!R) return;
      var tr=R.querySelector('.toprow'); if(!tr) return;
      R.classList.remove('stacked');
      void tr.offsetWidth;                                  /* force the reflow we measure */
      var need=window.innerWidth<=760, i, r, e;
      var trb=tr.getBoundingClientRect();
      /* 1. the two groups are closer than 12px */
      var tags=R.querySelector('.tags'), ctrls=R.querySelector('.ctrls');
      if(!need&&tags&&ctrls&&!skip(tags)&&!skip(ctrls)){
        var a=tags.getBoundingClientRect(), b=ctrls.getBoundingClientRect();
        if(b.left-a.right<12) need=true;
      }
      /* 2. a control runs past either edge */
      if(!need){
        var kids=tr.querySelectorAll('.nr-pill,.nr-track,.seg,.wgrp,button,#wnote');
        for(i=0;i<kids.length;i++){
          e=kids[i]; if(skip(e)) continue;
          r=e.getBoundingClientRect(); if(!r.width&&!r.height) continue;
          if(r.right>trb.right+0.5||r.left<trb.left-0.5){need=true;break;}
        }
      }
      /* 3. a label has been squeezed narrower than its own text */
      if(!need){
        var ls=tr.querySelectorAll('.nr-pill b,.nr-track,.seg button,button,#wnote,span');
        for(i=0;i<ls.length;i++){
          e=ls[i]; if(skip(e)) continue;
          if(!e.textContent||!e.textContent.trim()) continue;
          if(e.scrollWidth>e.clientWidth+1){need=true;break;}
        }
      }
      /* 4. the toprow wraps — a floating row that wraps grows downwards into the
         title without pushing anything down */
      if(!need){
        var tall=0,ch=tr.children;
        for(i=0;i<ch.length;i++){var h=ch[i].getBoundingClientRect().height;if(h>tall)tall=h;}
        if(trb.height>tall+2) need=true;
      }
      /* 5. the toprow sits on, or within 6px of, the action title */
      if(!need){
        var t=R.querySelector('.nr-strip'); if(!t||skip(t)) t=R.querySelector('h1');
        if(t&&!skip(t)){var tb=t.getBoundingClientRect(); if(tb.top-trb.bottom<6) need=true;}
      }
      if(need) R.classList.add('stacked');
      /* --padl is read AFTER the class lands: the class itself changes the padding */
      R.style.setProperty('--padl',(parseFloat(getComputedStyle(R).paddingLeft)||0)+'px');
    } finally { busy=false; }
  }
  window.fitChrome=fitChrome;
  function kick(){requestAnimationFrame(fitChrome);}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',kick); else kick();
  window.addEventListener('load',kick);
  window.addEventListener('resize',function(){lastW=-1;kick();});
  if(window.ResizeObserver){
    var ro=new ResizeObserver(function(en){
      var w=en&&en[0]?Math.round(en[0].contentRect.width):-1;
      if(w===lastW) return;                                 /* stacking must not re-trigger us */
      lastW=w; kick();
    });
    var r0=root(); if(r0) ro.observe(r0);
  }
})();
</script>
<script id="nr-topbar-js">
/* patch_topbar.py: one theme switch and the way home, the same in every instrument.
   Theme: the choice is kept under the cockpit's key, nr_dark, so every page of an
   engagement opens the same way. Home: a page that carries
   <meta name="nr-home" content="index.html"> (the engagement artifact adds it) gets
   "< Cockpit /" in front of its section tag. */
(function(){
  var K='nr_dark', box=document.getElementById('theme')||document.getElementById('tseg');
  if(box){
    box.querySelectorAll('button').forEach(function(b){ var d=b.getAttribute('data-s')==='dark';
      b.title=d?'Dark mode':'Light mode'; b.setAttribute('aria-label',b.title);
      b.addEventListener('click',function(){ try{ localStorage.setItem(K,d?'1':'0'); }catch(e){} }); });
    var v=null; try{ v=localStorage.getItem(K); }catch(e){}
    var dk=box.querySelector('button[data-s="dark"]');
    if(v==='1'&&dk&&!dk.classList.contains('on')) dk.click();
  }
  var m=document.querySelector('meta[name="nr-home"]'), lens=document.getElementById('lens')||document.querySelector('.toprow .nr-track');
  if(m&&lens&&!document.querySelector('.nr-crumb')){
    var c=document.createElement('div'); c.className='nr-track nr-crumb';
    var a=document.createElement('a'); a.className='nr-home'; a.href=m.getAttribute('content')||'index.html';
    a.textContent='\u2039 '+(m.getAttribute('data-label')||'Cockpit'); a.title='Back to the engagement cockpit';
    /* opened in a window of the findings dashboard (a frame of our own page): go back in that page, not in the frame */
    try{ if(window.parent!==window&&window.parent.document) a.target='_parent'; }catch(e){}
    var s=document.createElement('span'); s.className='nr-sep'; s.textContent='/';
    lens.parentNode.insertBefore(c,lens); c.appendChild(a); c.appendChild(s); c.appendChild(lens);
    if(window.fitChrome) requestAnimationFrame(window.fitChrome);
  }
})();
</script>
