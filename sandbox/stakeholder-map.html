<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stakeholder map</title>
<style>
/* Type scale — one place, not case by case. Every size below 12px is a token; the
   whole small end lifts on a narrow screen so nothing drops under 11px on a phone. */
:root{
  --fs-65:6.5px; --fs-7:7px; --fs-75:7.5px; --fs-8:8px; --fs-85:8.5px; --fs-9:9px;
  --fs-95:9.5px; --fs-10:10px; --fs-105:10.5px; --fs-11:11px; --fs-115:11.5px;
}
@media (max-width:760px){
  :root{
    --fs-65:11px; --fs-7:11px; --fs-75:11px; --fs-8:11px; --fs-85:11px; --fs-9:11px;
    --fs-95:11px; --fs-10:11.5px; --fs-105:12px; --fs-11:12px; --fs-115:12.5px;
  }
}
</style>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}
  /* ===== BRAND THEME (inlined from templates/brand.css) ===== */
  #art{--navy:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;
      --slate-10:rgba(54,65,86,.09);--navy-10:rgba(11,35,71,.10);--green-10:rgba(28,122,74,.10);
      --rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;--rag-green-text:#2F8F6B;--rag-amber-text:#B97F22;--rag-red-text:#C2483D;--rag-na-text:#6B7480;--tint-green:rgba(47,143,107,.12);--tint-amber:rgba(212,154,58,.16);--tint-red:rgba(210,100,90,.13);--tint-na:rgba(154,164,176,.16);--navy-fill:#0B2347;
      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #art[data-t="dark"]{--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--navy-fill:#243246;--accent:#8FC7E8;--steel:#93A9C4;--rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;--rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;--tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}
  body:has(#art[data-t="dark"]){--page:#0E1620}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:3}
  .tags{display:flex;align-items:center;gap:11px;min-width:0}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)}
  .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:var(--fs-115);letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #art[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  .ctrls{display:flex;gap:9px;flex:none}
  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0;max-width:1300px}
  #art[data-t="dark"] h1{color:#EAEFF5}
  h1 .hl{color:var(--green)}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 16px}
  .subt{font-size:15px;font-weight:600;color:var(--accent)}
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:24px}
  table{border-collapse:collapse;width:100%}
  th{text-align:left;font-size:var(--fs-105);letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:700;padding:0 20px 9px 0;border-bottom:2px solid var(--line)}
  td{font-size:13px;color:var(--txt);padding:11px 20px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
  td b{color:var(--ink)}
  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:12px;font-size:clamp(9.5px,0.75vw,12px);color:var(--mut)}
  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legend{display:flex;gap:7px}
  .lp{font-size:0.95em;font-weight:600;padding:0.2em 0.85em;border-radius:999px}
  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600}
  /* ── stakeholder map: the board, the rings and the engagement plan ── */
  #view{overflow-x:hidden;overflow-y:hidden}
  .chip{display:inline-block;font-size:var(--fs-8);font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:1px 4px;border-radius:4px;vertical-align:1px}
  .chip.two{background:var(--slate-10);color:var(--txt)} .chip.fb{background:var(--tint-amber);color:var(--rag-amber-text)}
  .tt{display:inline-block;font-size:var(--fs-95);font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:999px}
  .tt.deliver{background:#E3F1E9;color:#1F6B4E} .tt.support{background:#E4EDF6;color:#2C5A85} .tt.know{background:#EEF0F3;color:#5E6773}
  #art[data-t="dark"] .tt.deliver{background:rgba(95,191,148,.18);color:#8FD6B4} #art[data-t="dark"] .tt.support{background:rgba(143,199,232,.16);color:#A9D5E6} #art[data-t="dark"] .tt.know{background:rgba(148,161,178,.16);color:#C4CEDA}
  .av{flex:none;width:26px;height:26px;border-radius:50%;background:#E4EDF6;color:#2C5A85;font-size:var(--fs-10);font-weight:800;display:inline-flex;align-items:center;justify-content:center}
  #art[data-t="dark"] .av{background:rgba(143,199,232,.16);color:#A9D5E6}
  .num{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--navy-fill);color:#fff;font-size:var(--fs-115);font-weight:700;align-items:center;justify-content:center;flex:none}
  .none{font-size:12px;color:var(--mut);font-style:italic}
  /* the board */
  .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
  .col{background:var(--slate-10);border-radius:14px;padding:10px;min-width:0}
  .colh{display:flex;align-items:center;gap:8px} .colh .tt{font-size:var(--fs-11);padding:4px 11px} .colh .cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--mut)}
  .col .rule{margin:4px 2px 8px;font-size:var(--fs-11);color:var(--mut);line-height:1.4}
  .sk{background:var(--card);border:1px solid var(--line);border-radius:9px;margin-bottom:4px;box-shadow:0 1px 2px rgba(20,30,50,.04);transition:box-shadow .15s}
  .sk:hover{box-shadow:0 6px 18px -10px rgba(11,35,71,.35)}
  .skh{display:flex;align-items:center;gap:8px;padding:5px 9px;cursor:pointer}
  .cm{flex:1;min-width:0}
  .cn{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap} .cn b{font-size:12px;color:var(--ink)}
  .cr{font-size:var(--fs-105);color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grp{display:inline-block;margin-left:6px;font-size:var(--fs-95);font-weight:600;color:var(--txt);background:var(--slate-10);padding:0 6px;border-radius:999px}
  .chev{flex:none;display:inline-block;color:var(--mut);font-size:12px;transition:transform .15s}
  .sk.open .chev{transform:rotate(180deg)}
  .skb{display:none;border-top:1px solid var(--line);padding:4px 12px 12px}
  .sk.open .skb{display:block} .sk.open{box-shadow:0 10px 26px -14px rgba(11,35,71,.45)}
  .sec{margin-top:10px} .sec h5{margin:0 0 6px;font-size:var(--fs-10);font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
  .kv{font-size:12px;color:var(--txt);display:flex;gap:6px;margin-bottom:4px} .kv i{font-style:normal;color:var(--mut);flex:none;width:74px}
  .pln{border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-top:6px;font-size:12px} .pln.past{opacity:.6}
  .plh{display:flex;align-items:center;gap:6px} .plh b{font-size:12.5px;color:var(--navy)} #art[data-t="dark"] .plh b{color:#EAEFF5}
  .plh .num{width:18px;height:18px;font-size:var(--fs-10)} .plh .dt{font-size:var(--fs-11);font-weight:700;color:var(--accent)}
  .dn{font-size:var(--fs-95);font-weight:700;color:var(--rag-green-text);background:var(--tint-green);padding:1px 6px;border-radius:999px}
  .plw{color:var(--mut);margin:3px 0 2px} .plq{font-style:italic;color:var(--txt)} .pla{color:var(--ink);margin-top:2px}
  /* the rings */
  .rings{display:flex;justify-content:center}
  .onion{width:100%;max-width:900px;height:auto;display:block} .onion text{font-family:inherit}
  .onion .r-deliver{fill:#E6F0EA} .onion .r-support{fill:#EEF2F7} .onion .r-know{fill:#F7F8FA} .onion circle.ring{stroke:var(--line)}
  #art[data-t="dark"] .onion .r-deliver{fill:#1F3A30} #art[data-t="dark"] .onion .r-support{fill:#1E2B3B} #art[data-t="dark"] .onion .r-know{fill:#1A2430}
  .onion .rl1{font-size:var(--fs-10);font-weight:800;letter-spacing:.8px;fill:var(--mut);text-anchor:middle}
  .onion .gl{font-size:var(--fs-105);font-weight:800;letter-spacing:.5px;fill:var(--mut)}
  .onion .on{font-size:14px;font-weight:600;fill:var(--ink)} .onion .more{font-size:var(--fs-11);fill:var(--mut);font-style:italic}
  .onion .pd{fill:var(--navy-fill)}
  /* the engagement plan: one table on a timeline */
  table.v1{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
  .v1 col.c-n{width:44px} .v1 col.c-g{width:15%} .v1 col.c-w{width:18%} .v1 col.c-q{width:17%} .v1 col.c-a{width:22%} .v1 col.c-ny{width:14%} .v1 col.c-l{width:15%}
  .v1 thead th{position:sticky;top:0;z-index:2;background:var(--card);padding:0 14px 10px 0}
  .v1 td{padding:12px 16px 12px 0;line-height:1.45}
  .v1 td.rail{position:relative;padding:12px 0;border-bottom:0}
  .v1 td.rail:before{content:'';position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--line)}
  .v1 td.rail .num{position:relative;z-index:1;box-shadow:0 0 0 4px var(--card)}
  .v1 tr.ms td{border-bottom:0;padding:22px 0 8px;font-size:16px} .msr{display:flex;align-items:baseline} .v1 tr.ms b{color:var(--navy)} #art[data-t="dark"] .v1 tr.ms b{color:#EAEFF5}
  .v1 tr.ms td.rail i{position:absolute;left:5px;top:26px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--accent);z-index:1}
  .v1 tr.ms.done td.rail i{background:var(--rag-green);border-color:var(--rag-green)}
  .v1 tbody tr.ms:first-child td.rail:before{top:30px}
  .v1 .dt{font-size:12.5px;font-weight:700;color:var(--accent);margin-left:10px} .v1 .dn{font-size:var(--fs-105);padding:2px 8px;margin-left:8px}
  .v1 .n{margin-left:auto;font-size:var(--fs-115);color:var(--mut);font-weight:600}
  .v1 .gn{display:block;font-size:13.5px;color:var(--ink);margin-bottom:4px}
  .v1 .who{display:flex;gap:9px;align-items:flex-start} .v1 .who b{display:block;font-size:13px;color:var(--ink)} .v1 .who div span{display:block;font-size:12px;color:var(--mut)}
  .v1 td.q{font-style:italic;color:var(--ink)} .v1 td.q:before{content:'\201C';color:var(--accent);font-size:20px;font-weight:800;line-height:0;margin-right:2px;vertical-align:-5px;font-style:normal}
  .v1 td.a{color:var(--ink)}
  .ck{display:inline-flex;width:16px;height:16px;border-radius:50%;background:var(--tint-green);color:var(--rag-green-text);font-size:var(--fs-10);font-weight:800;align-items:center;justify-content:center;margin-right:7px;vertical-align:1px}
  .v1 tr.ln.done td:not(.rail){color:var(--mut)} .v1 tr.ln.done .num{background:#9AA8B8}
  .v1 tr.ln:hover td:not(.rail){background:rgba(110,177,209,.07)}
  @media (max-width:1100px){.board{grid-template-columns:minmax(0,1fr)}}
  
  /* ── responsive chrome: on a narrow screen the absolute toprow would collide, so drop it
     into normal flow and let it wrap (applies to every artifact that uses this chrome) ── */
  @media (max-width:760px){
    #art,#pm{padding:14px 18px 10px 42px}
    .nr-rail{width:24px}
  }

  /* ── responsive chrome ──────────────────────────────────────────────────────
     The toprow stacks when it does not fit, and the switch is DETECTED, not
     guessed: fitChrome() below measures the one-row layout and adds .stacked to
     the artifact root. Never hard-code a breakpoint for the chrome — see
     brand-guide.html, "Responsive chrome". Stacked order is brand row, then
     navigation, then working controls: where am I, what am I looking at, what
     can I change. ── */
  #art.stacked .toprow,#pm.stacked .toprow,#pw.stacked .toprow{
    position:static;top:auto;left:auto;right:auto;margin:0 0 12px;
    display:flex;flex-wrap:wrap;justify-content:flex-start;align-items:center;gap:10px 12px}
  #art.stacked .tags,#pm.stacked .tags,#pw.stacked .tags{display:contents}
  /* only the brand pill bleeds out onto the navy rail — that is why it is
     border-radius:0 9px 9px 0. The negative margin is given back as padding, so
     its right edge does not move and no sibling shifts. */
  #art.stacked .nr-pill,#pm.stacked .nr-pill,#pw.stacked .nr-pill{
    order:1;margin-left:calc(-1 * var(--padl,0px));padding-left:calc(14px + var(--padl,0px))}
  /* no text in an artifact is ever cut to make it fit: the lens badge wraps, it
     does not ellipsise. An instrument that truncates it looks fine to a gate and
     wrong to a client. */
  #art.stacked .nr-track,#pm.stacked .nr-track,#pw.stacked .nr-track{
    order:2;max-width:none;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
  #art.stacked .ctrls,#pm.stacked .ctrls,#pw.stacked .ctrls{
    order:3;flex:1 1 100%;display:flex;flex-wrap:wrap;justify-content:flex-start;gap:8px}
  /* a shell whose view switch sits straight in the toprow, with no .ctrls group */
  #art.stacked .toprow>.seg,#pm.stacked .toprow>.seg,#pw.stacked .toprow>.seg{order:3;flex:1 1 100%}
  #art.stacked .seg,#pm.stacked .seg,#pw.stacked .seg{flex-wrap:wrap;max-width:100%}
  #art.stacked .wgrp,#pm.stacked .wgrp,#pw.stacked .wgrp{
    order:4;flex:1 1 100%;flex-wrap:wrap;gap:8px}
  #art.stacked #save,#art.stacked #lock,#pm.stacked #save,#pm.stacked #lock,
  #pw.stacked #save,#pw.stacked #lock{order:4}
  /* the narrow-screen media query keeps only what it was really for: padding and
     rail width on a phone. Chrome layout is no longer its business. */
  @media (max-width:760px){
    #art.stacked,#pm.stacked,#pw.stacked{padding:14px 18px 10px 42px}
    #art.stacked .nr-rail,#pm.stacked .nr-rail,#pw.stacked .nr-rail{width:24px}
  }
</style><style id="nr-topbar">
  /* patch_topbar.py: one theme button and the way home. See the script of the same
     name at the end of the body. The doubled id outranks the stacked-chrome rules. */
  :is(#theme,#tseg):is(#theme,#tseg).seg{padding:3px}
  :is(#theme,#tseg):is(#theme,#tseg).seg>button.on{display:none}
  :is(#theme,#tseg):is(#theme,#tseg).seg>button{font-size:0;line-height:0;width:34px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center}
  :is(#theme,#tseg):is(#theme,#tseg).seg>button::before{content:"";width:16px;height:16px;background:currentColor;-webkit-mask:var(--nr-ico) center/16px 16px no-repeat;mask:var(--nr-ico) center/16px 16px no-repeat}
  :is(#theme,#tseg):is(#theme,#tseg).seg>button[data-s="dark"]{--nr-ico:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='black'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M12%203a6%206%200%200%200%209%209a9%209%200%201%201-9-9z'/%3E%3C/svg%3E")}
  :is(#theme,#tseg):is(#theme,#tseg).seg>button[data-s="light"]{--nr-ico:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='black'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Ccircle%20cx='12'%20cy='12'%20r='4'/%3E%3Cpath%20d='M12%202v2M12%2020v2M4.9%204.9l1.4%201.4M17.7%2017.7l1.4%201.4M2%2012h2M20%2012h2M4.9%2019.1l1.4-1.4M17.7%206.3l1.4-1.4'/%3E%3C/svg%3E")}
  .nr-crumb{display:inline-flex;align-items:center;gap:8px}
  .nr-crumb>.nr-track{background:transparent!important;padding:0!important;border-radius:0!important;color:inherit!important;margin:0!important}
  .nr-crumb .nr-home{color:inherit;opacity:.6;text-decoration:none;text-transform:uppercase;white-space:nowrap}
  .nr-crumb .nr-home:hover{opacity:1;text-decoration:underline}
  .nr-crumb .nr-sep{opacity:.4}
</style>
</head>
<body>
<div id="art" data-t="light">
  <div class="nr-rail"></div>

    font:500 13px/1.4 -apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;color:var(--ink,#15243A);background:var(--card,#fff);box-shadow:0 14px 34px -10px rgba(11,35,71,.28);
    opacity:0;transform:translateY(6px) scale(.97);transition:opacity .28s ease,transform .32s cubic-bezier(.2,.9,.25,1.15);pointer-events:none}

<script>
(function(){
  var GROUPS=[['interviews','Interviews'],['observations','Observations'],['documents','Documents'],['data','Data'],['external','External sources'],['internal','Internal discussions']];
  var NOUN={interviews:['interview','interviews'],observations:['observation','observations'],documents:['document','documents'],data:['data extract','data extracts'],external:['external source','external sources']};
  var SPECS={}, pop=null, cur=null;
  function P(){ try{ return (typeof DATA!=='undefined'&&DATA&&DATA.sourcePanel)||null; }catch(e){ return null; } }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function low(t){ t=String(t||''); return /^[A-Z][a-z]*(?=[\s,.;:-]|$)/.test(t)?t.charAt(0).toLowerCase()+t.slice(1):t; }   /* EventHub stays EventHub */
  function plain(t){ return String(t||'').replace(/\*\*/g,'').replace(/<[^>]+>/g,''); }
  function working(){ var p=P(); return !!(p&&p.build==='working'); }
  function root(){ return document.querySelector('#art,#pm,#pw')||document.body; }
  function href(e){ var p=P(); if(e.url) return e.url; if(e.file&&p&&p.rootRel!=null) return (p.rootRel?p.rootRel+'/':'')+e.file.split('/').map(encodeURIComponent).join('/'); return ''; }
  function badge(s){ if(s.badge==null&&s.score==null) return '';
    var r=s.rag||'na', txt=s.badge!=null?s.badge:(s.score+' out of 5');
    return '<span class="nrsrc-sc" style="color:var(--rag-'+r+'-text);background:var(--tint-'+r+')">'+esc(txt)+'</span>'; }
  /* every source an item rests on: an analysis gives its method and what it was built from */
  function expand(ids){ var p=P(), S=p.src, pool=[], how=[], seen={};
    (function walk(list,top){ (list||[]).forEach(function(k){ var e=S[k]; if(!e||seen[k]) return; seen[k]=1;
      if(e.group==='analysis'){ how.push({k:k,e:e}); walk(e.builtFrom,false); } else pool.push({k:k,e:e}); }); })(ids,true);
    return {pool:pool,how:how}; }
  function summary(pool){ var n={}, one={}; pool.forEach(function(x){ var g=x.e.group; if(g==='internal') return; n[g]=(n[g]||0)+1; one[g]=x.e; });
    var parts=[]; ['interviews','observations','documents','data','external'].forEach(function(g){ if(!n[g]) return;
      if(n[g]===1&&(g==='documents'||g==='data')) parts.push('the '+low(one[g].label)); else parts.push(n[g]+' '+NOUN[g][n[g]===1?0:1]); });
    if(!parts.length) return '';
    return 'Based on '+(parts.length>1?parts.slice(0,-1).join(', ')+' and '+parts[parts.length-1]:parts[0])+'.'; }
  function who(e){ var w=working(); if(w&&e.people&&e.label.indexOf(e.people.split(/[;,]/)[0].trim())<0) return e.people; return ''; }
  function item(x){ var e=x.e, w=working(), h=w?href(e):(e.url||'');
    return '<div class="nrsrc-it">'+esc(e.label)+(who(e)?' <span class="nrsrc-d">· '+esc(who(e))+'</span>':'')+(e.date?' <span class="nrsrc-d">· '+esc(e.date)+'</span>':'')+
      (w&&e.group==='external'&&e.origins&&e.origins.length?e.origins.map(function(o){return o==='thirdparty'||o==='internet'?'<span class="nrsrc-o '+o+'">'+(o==='thirdparty'?'Third party':'Internet')+'</span>':'';}).join(''):'')+
      (w?' <span class="nrsrc-id">'+esc(x.k)+'</span>':'')+(h?' <a href="'+esc(h)+'" target="_blank" rel="noopener">open</a>':'')+'</div>'; }
  function body(s){ var p=P(), w=working(), ids=s.ids||[], h='';
    h+='<div class="nrsrc-hx"><div class="nrsrc-ey"><span>'+esc(s.eyebrow||'')+'</span>'+badge(s)+'</div>'+
       '<button type="button" class="nrsrc-x" aria-label="Close">&times;</button></div><div class="nrsrc-bd">';
    if(!ids.length){ return h+'<div class="nrsrc-warn">No source yet. Unlock the page and pick one where you score it. Without a source this score cannot go into the client build.</div></div>'; }
    var x=expand(ids), sm=summary(x.pool);
    if(sm) h+='<p class="nrsrc-sum">'+esc(sm)+'</p>';
    x.how.forEach(function(a){ var e=a.e; h+='<div class="nrsrc-how"><b>Method</b>'+esc(e.method||e.label)+(w?' <span class="nrsrc-id">'+esc(a.k)+'</span>'+(href(e)?' <a href="'+esc(href(e))+'" target="_blank" rel="noopener">open</a>':''):'')+'</div>'; });

<script>
/* ── fitChrome() — the chrome stacks when it does not fit ────────────────────
   Measures the one-row layout and adds .stacked to the artifact root when any of
   six things is true: the two groups are closer than 12px · a control runs past
   either edge · a label has been squeezed narrower than its own text · the
   toprow wraps · the toprow comes within 6px of the action title · the viewport
   is at or below 760px (the floor). Exposed as window.fitChrome() so a render
   pass can call it after it changes a label. ── */
(function(){
  var busy=false,lastW=-1;
  function root(){return document.querySelector('#art,#pm,#pw');}
  function skip(e){
    if(!e) return true;
    if(e.id==='wpop'||(e.closest&&e.closest('#wpop'))) return true;
    var cs=getComputedStyle(e);
    if(cs.visibility==='hidden'||cs.display==='none') return true;
    return false;
  }
  function fitChrome(){
    if(busy) return; busy=true;
    try{
      var R=root(); if(!R) return;
      var tr=R.querySelector('.toprow'); if(!tr) return;
      R.classList.remove('stacked');
      void tr.offsetWidth;                                  /* force the reflow we measure */
      var need=window.innerWidth<=760, i, r, e;
      var trb=tr.getBoundingClientRect();
      /* 1. the two groups are closer than 12px */
      var tags=R.querySelector('.tags'), ctrls=R.querySelector('.ctrls');
      if(!need&&tags&&ctrls&&!skip(tags)&&!skip(ctrls)){
        var a=tags.getBoundingClientRect(), b=ctrls.getBoundingClientRect();
        if(b.left-a.right<12) need=true;
      }
      /* 2. a control runs past either edge */
      if(!need){
        var kids=tr.querySelectorAll('.nr-pill,.nr-track,.seg,.wgrp,button,#wnote');
        for(i=0;i<kids.length;i++){
          e=kids[i]; if(skip(e)) continue;
          r=e.getBoundingClientRect(); if(!r.width&&!r.height) continue;
          if(r.right>trb.right+0.5||r.left<trb.left-0.5){need=true;break;}
        }
      }
      /* 3. a label has been squeezed narrower than its own text */
      if(!need){
        var ls=tr.querySelectorAll('.nr-pill b,.nr-track,.seg button,button,#wnote,span');
        for(i=0;i<ls.length;i++){
          e=ls[i]; if(skip(e)) continue;
          if(!e.textContent||!e.textContent.trim()) continue;
          if(e.scrollWidth>e.clientWidth+1){need=true;break;}
        }
      }
      /* 4. the toprow wraps — a floating row that wraps grows downwards into the
         title without pushing anything down */
      if(!need){
        var tall=0,ch=tr.children;
        for(i=0;i<ch.length;i++){var h=ch[i].getBoundingClientRect().height;if(h>tall)tall=h;}
        if(trb.height>tall+2) need=true;
      }
      /* 5. the toprow sits on, or within 6px of, the action title */
      if(!need){
        var t=R.querySelector('.nr-strip'); if(!t||skip(t)) t=R.querySelector('h1');
        if(t&&!skip(t)){var tb=t.getBoundingClientRect(); if(tb.top-trb.bottom<6) need=true;}
      }
      if(need) R.classList.add('stacked');
      /* --padl is read AFTER the class lands: the class itself changes the padding */
      R.style.setProperty('--padl',(parseFloat(getComputedStyle(R).paddingLeft)||0)+'px');
    } finally { busy=false; }
  }
  window.fitChrome=fitChrome;
  function kick(){requestAnimationFrame(fitChrome);}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',kick); else kick();
  window.addEventListener('load',kick);
  window.addEventListener('resize',function(){lastW=-1;kick();});
  if(window.ResizeObserver){
    var ro=new ResizeObserver(function(en){
      var w=en&&en[0]?Math.round(en[0].contentRect.width):-1;
      if(w===lastW) return;                                 /* stacking must not re-trigger us */
      lastW=w; kick();
    });
    var r0=root(); if(r0) ro.observe(r0);
  }
})();
</script>

<style>/* READ-MODE TYPE FLOOR — nothing under 11px once the page stops scaling */

<!-- NR-REFIT:BEGIN — fit again when the space changes (diagnostic-skill-builder/templates/refit-layer.html,
     put in by scripts/patch_refit.py). Every page fits its view on a window resize. The space a page has can
     also change without one: fonts that arrive late, the header stacking, a preview pane or iframe that grows
     after the first paint. Then the page used to keep its first fit until you switched tabs. This watches the
     view and the window, and replays the page's own resize handling once that space has really changed
     (a change in the page's content alone does not count). -->
<script>(function(){
  var last = '', t = 0;
  function box(){ var v = document.getElementById('view'); return (v ? v.clientWidth + 'x' + v.clientHeight + '/' : '') + innerWidth + 'x' + innerHeight; }
  function kick(){ var k = box(); if(k === last) return; last = k; window.dispatchEvent(new Event('resize')); }
  function soon(){ cancelAnimationFrame(t); t = requestAnimationFrame(kick); }
  function again(){ last = ''; soon(); }
  function watch(){ if(!window.ResizeObserver) return; var ro = new ResizeObserver(soon), v = document.getElementById('view');
