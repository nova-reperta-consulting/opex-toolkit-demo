<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Performance Wheel</title>
<style>
/* Type scale — one place, not case by case. Every size below 12px is a token; the
   whole small end lifts on a narrow screen so nothing drops under 11px on a phone. */
:root{
  --fs-65:6.5px; --fs-7:7px; --fs-75:7.5px; --fs-8:8px; --fs-85:8.5px; --fs-9:9px;
  --fs-95:9.5px; --fs-10:10px; --fs-105:10.5px; --fs-11:11px; --fs-115:11.5px;
}
@media (max-width:760px){
  :root{
    --fs-65:11px; --fs-7:11px; --fs-75:11px; --fs-8:11px; --fs-85:11px; --fs-9:11px;
    --fs-95:11px; --fs-10:11.5px; --fs-105:12px; --fs-11:12px; --fs-115:12.5px;
  }
}
</style>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}
  /* ===== NR BRAND THEME (inlined from brand.css; swap for a client template) ===== */
  #pw{--navy:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;
      --slate-10:rgba(54,65,86,.09);--rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;--rag-green-text:#2F8F6B;--rag-amber-text:#B07A1E;--rag-red-text:#C2483D;--rag-na-text:#6B7480;--tint-green:rgba(47,143,107,.15);--tint-amber:rgba(212,154,58,.18);--tint-red:rgba(210,100,90,.16);--tint-na:rgba(154,164,176,.16);--navy-fill:#0B2347;--wheel-seg:var(--navy);--wheel-ring:#fff;--wheel-badge-bg:#fff;
      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #pw[data-t="dark"]{--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--navy-fill:#243246;--accent:#8FC7E8;--steel:#93A9C4;--rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;--rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;--tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);--wheel-seg:#2E5C8A;--wheel-ring:rgba(234,239,245,.28);--wheel-badge-bg:#EAEFF5;--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}
  body:has(#pw[data-t="dark"]){--page:#0E1620}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:3}
  .tags{display:flex;align-items:center;gap:11px;min-width:0}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)}
  .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:var(--fs-115);letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #pw[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  .ctrls{display:flex;gap:9px;flex:none}
  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0;max-width:1300px}
  #pw[data-t="dark"] h1{color:#EAEFF5}
  #pw[data-t="dark"] .nb,#pw[data-t="dark"] .lead-n{color:#16202C}
  h1 .hl{color:var(--green)}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 16px}
  .subt{font-size:15px;font-weight:600;color:var(--accent)}
  /* body / cards */
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:24px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;align-items:stretch}
  @media(max-width:1280px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
  .card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:20px 20px 18px;position:relative}
  .step{position:absolute;top:13px;left:14px;width:23px;height:23px;border-radius:50%;background:var(--slate-10);color:var(--mut);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .chd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:13px}
  .cnm{font-size:18px;font-weight:600;color:var(--ink);line-height:1.2}
  .cq{font-size:13px;color:var(--mut);line-height:1.35;margin-bottom:11px}
  .ladd{display:flex;gap:4px;margin:1px 0 15px}
  .lc{flex:1;height:7px;border-radius:4px}
  .subs{flex:1;display:flex;flex-direction:column;gap:16px}
  .sub-h{display:flex;align-items:center;gap:8px}
  .dot{flex:none;width:8px;height:8px;border-radius:50%}
  .sub-nm{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink);line-height:1.25}
  .sub-sc{flex:none;font-size:13.5px;font-weight:700}
  .ins{list-style:none;margin:5px 0 0;padding:0}
  .ins li{position:relative;padding-left:15px;font-size:14px;color:var(--txt);line-height:1.45;margin:4px 0}
  .ins li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--mut);opacity:.5}
  .na{font-size:13.5px;color:var(--mut);font-style:italic;margin:5px 0 0;line-height:1.4}
  /* coverage strip: what was not probed, shown under every view (never a silent blank) */
  .gapbar{margin-top:16px;border:1px dashed var(--line);border-radius:12px;background:var(--card);padding:11px 14px 12px}
  .gapbar b{font-size:12.5px;color:var(--ink);letter-spacing:.02em}
  .gapbar ul{list-style:none;margin:5px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 26px}
  .gapbar li{font-size:13px;color:var(--mut);line-height:1.45;position:relative;padding-left:12px}
  .gapbar li:before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--rag-na-text)}
  .lead-n{width:44px;height:44px;border-radius:50%;color:#fff;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .ribbon{display:flex;gap:0;margin-bottom:22px;overflow-x:auto}
  .chev{flex:1;min-width:150px;padding:13px 16px;margin-left:-10px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
  .chev:first-child{margin-left:0}
  .chev .ct{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;line-height:1.2}
  .chev .cq2{font-size:12px;color:var(--txt);line-height:1.32;opacity:.85}
  .nb{flex:none;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
  .chpill{align-self:flex-start;font-size:var(--fs-115);font-weight:600;padding:2px 10px;border-radius:999px;margin-top:3px}
  /* footer: source + legend bottom-left, trademark bottom-right */
  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:12px;font-size:clamp(9.5px,0.75vw,12px);color:var(--mut)}
  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  #ft .ov b{color:var(--ink)}
  .legend{display:flex;gap:7px}
  .lp{font-size:0.95em;font-weight:600;padding:0.2em 0.85em;border-radius:999px}
  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600}
  /* classic cyclic-arrow view */
  .classic{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,500px) minmax(0,1fr);gap:16px;align-items:start}
  .classic>svg{align-self:center}
  .cl-col{display:flex;flex-direction:column;gap:14px}
  .cl-h{display:flex;align-items:center;gap:8px;margin-bottom:1px}
  .cl-num{flex:none;display:inline-flex;width:19px;height:19px;border-radius:50%;background:var(--navy);color:#fff;font-size:var(--fs-11);font-weight:700;align-items:center;justify-content:center}
  #pw[data-t="dark"] .cl-num{background:var(--accent);color:var(--navy)}
  .cl-n{font-size:13.5px;font-weight:700;color:var(--navy)}
  #pw[data-t="dark"] .cl-n{color:#EAEFF5}
  .cl-q{font-size:var(--fs-115);font-style:italic;color:var(--mut);margin:0 0 4px 27px}
  .classic .ins{margin-left:27px}
  .classic .ladd{margin:3px 0 9px 27px;max-width:200px}
  .classic .ins li{font-size:12.5px;line-height:1.4}
  .classic .ins li::before{background:var(--bc,var(--mut));opacity:1;width:6px;height:6px;top:7px}
  @media(max-width:1100px){
    .classic{grid-template-columns:1fr 1fr;justify-items:start;gap:14px 26px}
    .classic>svg{grid-column:1/-1;order:-1;max-width:380px;justify-self:center;margin-bottom:4px}
  }
  @media(max-width:680px){
    .classic{grid-template-columns:1fr}
    .classic>svg{max-width:320px}
  }
  /* -- responsive chrome: on a narrow screen the absolute toprow would collide, so drop it
     into normal flow and let it wrap (applies to every artifact that uses this chrome) -- */
  @media (max-width:760px){
    #art,#pm,#pw{padding:14px 18px 10px 42px}
    .nr-rail{width:24px}
    .toprow{position:static;top:auto;right:auto;margin:0 0 12px;flex-wrap:wrap;justify-content:flex-start;gap:10px 12px}
    .tags{flex-wrap:wrap;gap:8px;margin-left:-42px}
    .ctrls{flex-wrap:wrap;gap:8px;flex:1 1 100%}
  }
  

</style></head>

<script>
const DATA = /* DATA */ {
  "context": "OPEX QUICKSCAN",
  "lens": "MGMT · PERFORMANCE WHEEL",
  "teamName": "Claims Handling",
  "source": "Team lead, two coordinators and four handlers across tenure levels, 3-4 Sep 2026",

(function(){
  var C={green:'var(--rag-green)',amber:'var(--rag-amber)',red:'var(--rag-red)',na:'var(--rag-na)'};
  var PILL={green:['var(--tint-green)','var(--rag-green-text)','Good'],amber:['var(--tint-amber)','var(--rag-amber-text)','Fair'],red:['var(--tint-red)','var(--rag-red-text)','Weak'],na:['var(--tint-na)','var(--rag-na-text)','n/a']};
  var SEQ=['vision','metrics','tracking','dialogues','consequences'];
  var QMAP={vision:'Is the mission & vision clear?',metrics:'Translated into metrics & targets?',tracking:'Do we measure & visualise them?',dialogues:'Do we discuss performance?',consequences:'Do we act, reward & recognise?'};
  function esc(t){return String(t==null?'':t).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function hl(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1</span>');}
  function mean(a){var f=a.filter(function(x){return x!=null;});return f.length?f.reduce(function(x,y){return x+y;},0)/f.length:null;}
  function fx(v){return v==null?'n/a':v.toFixed(1);}
  function segRag(s){return s==null?'na':(s<=2?'red':(s===3?'amber':'green'));}
  function aggRag(v){return v==null?'na':(v<2.5?'red':(v<3.5?'amber':'green'));}
  function verdict(v){return v==null?'n/a':v>=3.5?'Strong':v>=2.5?'Developing':v>=1.5?'Emerging':'At risk';}
  function tline(){return getComputedStyle(document.getElementById('pw')).getPropertyValue('--line').trim();}

  var byKey={}; DATA.aspects.forEach(function(a){byKey[a.key]=a;});
  var steps=SEQ.filter(function(k){return byKey[k];}).map(function(k,i){var a=byKey[k],v=mean(a.segments.map(function(x){return x.score;}));
    return {k:k,n:i+1,label:a.label,q:QMAP[k]||'',avg:v,rag:aggRag(v),segs:a.segments};});
  var overall=mean(DATA.aspects.reduce(function(acc,a){return acc.concat(a.segments.map(function(x){return x.score;}));},[]));

  function polar(cx,cy,r,d){var a=(d-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
  function sect(cx,cy,ri,ro,a0,a1){var p0=polar(cx,cy,ro,a0),p1=polar(cx,cy,ro,a1),p2=polar(cx,cy,ri,a1),p3=polar(cx,cy,ri,a0),la=(a1-a0)>180?1:0;
    return 'M'+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A'+ro+' '+ro+' 0 '+la+' 1 '+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' L'+p2[0].toFixed(1)+' '+p2[1].toFixed(1)+' A'+ri+' '+ri+' 0 '+la+' 0 '+p3[0].toFixed(1)+' '+p3[1].toFixed(1)+' Z';}
  function donut(active,color,size){var ri=16,ro=29,n=steps.length,slot=360/n,gp=7,g=tline(),s=[];
    steps.forEach(function(st,i){var a0=i*slot+gp/2,a1=(i+1)*slot-gp/2;s.push('<path d="'+sect(30,30,ri,ro,a0,a1)+'" fill="'+(i===active?color:g)+'"/>');});
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 60 60">'+s.join('')+'</svg>';}
  function ladder(st){var f=st.avg==null?0:Math.round(st.avg),c='';for(var i=1;i<=5;i++){c+='<span class="lc" style="background:'+(i<=f?C[st.rag]:'var(--slate-10)')+'"></span>';}return '<div class="ladd">'+c+'</div>';}
  function scoreTag(s){var r=segRag(s);return '<span class="sub-sc" style="color:'+C[r]+'">'+(s==null?'n/a':s+'/5')+'</span>';}
  function subItem(sg,quiet){var r=sg.rag||segRag(sg.score);
    var body=sg.score==null?(quiet?'':'<div class="na">Not assessed this round (to probe)</div>')
      :'<ul class="ins">'+(sg.points||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
    return '<div class="sub"><div class="sub-h"><span class="dot" style="background:'+C[r]+'"></span><span class="sub-nm">'+esc(sg.name)+'</span>'+scoreTag(sg.score)+'</div>'+body+'</div>';}
  function dimPill(st){var p=PILL[st.rag];return '<span class="chpill" style="background:'+p[0]+';color:'+p[1]+'">'+p[2]+(st.avg!=null?' · '+st.avg.toFixed(1)+'/5':'')+'</span>';}
  // a dimension nobody probed says so ONCE, not once per subdimension
  function allNa(st){return st.segs.length>0&&st.segs.every(function(x){return x.score==null;});}
  function naNote(st){return allNa(st)?'<div class="na">Not assessed this round.</div>':'';}
  function card(st,lead){return '<div class="card" data-ek="'+st.k+'"><div class="step">'+st.n+'</div>'+
    '<div class="chd">'+lead+'<div class="cnm">'+esc(st.label)+'</div>'+dimPill(st)+'</div>'+
    '<div class="cq">'+esc(st.q)+'</div>'+ladder(st)+naNote(st)+'<div class="subs">'+st.segs.map(function(sg){return subItem(sg,allNa(st));}).join('')+'</div></div>';}
  function renderCycle(){return '<div class="grid">'+steps.map(function(st){return card(st,donut(st.n-1,C[st.rag],60));}).join('')+'</div>';}
  function renderFlow(){var p,cp;
    var ribbon='<div class="ribbon">'+steps.map(function(st,i){p=PILL[st.rag];
      cp=i===0?'polygon(0 0,calc(100% - 15px) 0,100% 50%,calc(100% - 15px) 100%,0 100%)':'polygon(0 0,calc(100% - 15px) 0,100% 50%,calc(100% - 15px) 100%,0 100%,15px 50%)';
      return '<div class="chev" style="background:'+p[0]+';clip-path:'+cp+';padding-left:'+(i===0?'16':'26')+'px"><div class="ct"><span class="nb" style="background:'+C[st.rag]+'">'+st.n+'</span>'+esc(st.label)+'</div><div class="cq2">'+esc(st.q)+'</div><span class="chpill" style="background:'+p[0]+';color:'+p[1]+'">'+p[2]+'</span></div>';
    }).join('')+'</div>';
    var cards='<div class="grid">'+steps.map(function(st){return card(st,'<div class="lead-n" style="background:'+C[st.rag]+'">'+st.n+'</div>');}).join('')+'</div>';
    return ribbon+cards;}

  function clWrap(t){var w=String(t).split(' '),L=[],c='';w.forEach(function(x){if((c+' '+x).trim().length>13){L.push(c.trim());c=x;}else{c=(c+' '+x).trim();}});if(c)L.push(c);return L.slice(0,2);}
  function clPath(cx,cy,ri,ro,a0,a1,pa){var mid=(ri+ro)/2,o0=polar(cx,cy,ro,a0),o1=polar(cx,cy,ro,a1),i1=polar(cx,cy,ri,a1),i0=polar(cx,cy,ri,a0),tip=polar(cx,cy,mid,a1+pa),nt=polar(cx,cy,mid,a0+pa),la=(a1-a0)>180?1:0;function f(q){return q[0].toFixed(1)+' '+q[1].toFixed(1);}
    return 'M'+f(o0)+' A'+ro+' '+ro+' 0 '+la+' 1 '+f(o1)+' L'+f(tip)+' L'+f(i1)+' A'+ri+' '+ri+' 0 '+la+' 0 '+f(i0)+' L'+f(nt)+' Z';}
  function clText(x,y,lines,color,fs){var dy=lines.length>1?-2:4;return '<text class="cl-lbl" data-fs="'+fs+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" fill="'+color+'" font-size="'+fs+'" font-weight="700" text-anchor="middle">'+lines.map(function(t,i){return '<tspan x="'+x.toFixed(1)+'" dy="'+(i===0?dy:12.5)+'">'+esc(t)+'</tspan>';}).join('')+'</text>';}
  // A label is drawn horizontally inside a ring, so a long word runs off the band and turns
  // white-on-white ("Consequences & Recognition" did exactly that). Shrink each label until all
  // four corners of its box sit inside the annulus. Measured, not estimated, so it holds for any label.
  function fitClassicLabels(root){var svg=root.querySelector('.classic svg');if(!svg)return;
    var cx=+svg.getAttribute('data-cx'),cy=+svg.getAttribute('data-cy'),ri=+svg.getAttribute('data-ri'),ro=+svg.getAttribute('data-ro');
    if(!ro)return;
    Array.prototype.forEach.call(svg.querySelectorAll('text.cl-lbl'),function(t){
      var base=+t.getAttribute('data-fs')||10.5,sp=t.querySelectorAll('tspan'),n=sp.length;
      for(var fs=base;fs>=7;fs-=0.25){
        t.setAttribute('font-size',fs);
        var lead=12.5*fs/base,first=n>1?-2*fs/base:4*fs/base;
        for(var i=0;i<n;i++){sp[i].setAttribute('dy',i===0?first:lead);}
        var bb;try{bb=t.getBBox();}catch(e){return;}
        var pts=[[bb.x,bb.y],[bb.x+bb.width,bb.y],[bb.x,bb.y+bb.height],[bb.x+bb.width,bb.y+bb.height]],ok=true;
        for(var k=0;k<4;k++){var d=Math.sqrt(Math.pow(pts[k][0]-cx,2)+Math.pow(pts[k][1]-cy,2));if(d<ri||d>ro){ok=false;break;}}
        if(ok)return;
      }
    });
  }
  function clBadge(x,y,n,bg,fg){return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="12" fill="'+bg+'" stroke="var(--wheel-ring)" stroke-width="2"/><text x="'+x.toFixed(1)+'" y="'+(y+4.5).toFixed(1)+'" fill="'+fg+'" font-size="13" font-weight="700" text-anchor="middle">'+n+'</text>';}
  function renderClassic(){
    var cx=290,cy=280,ri=80,ro=156,pa=12,mid=(ri+ro)/2,n=steps.length,slot=360/n,start=-slot/2,g=[];
    steps.forEach(function(z,i){var fill=z.k==='vision'?'var(--green)':'var(--wheel-seg)';g.push('<path d="'+clPath(cx,cy,ri,ro,start+i*slot,start+(i+1)*slot,pa)+'" fill="'+fill+'" stroke="var(--wheel-ring)" stroke-width="3"/>');});
    steps.forEach(function(z,i){var ac=start+(i+0.5)*slot,lp=polar(cx,cy,mid,ac);g.push(clText(lp[0],lp[1],clWrap(z.label),'#fff',10.5));});
    steps.forEach(function(z,i){var bp=polar(cx,cy,mid,start+(i+0.8)*slot);g.push(clBadge(bp[0],bp[1],z.n,'var(--wheel-badge-bg)','var(--navy)'));});
    var ring='<svg viewBox="0 0 580 560" width="100%" data-cx="'+cx+'" data-cy="'+cy+'" data-ri="'+ri+'" data-ro="'+ro+'" style="max-width:520px;display:block;margin:0 auto">'+g.join('')+'</svg>';
    function blk(st){var pl=PILL[st.rag];return '<div class="cl-blk" data-ek="'+st.k+'"><div class="cl-h"><span class="cl-num">'+st.n+'</span><span class="cl-n">'+esc(st.label)+'</span><span class="chpill" style="background:'+pl[0]+';color:'+pl[1]+'">'+(st.avg!=null?st.avg.toFixed(1)+'/5':'n/a')+'</span></div><div class="cl-q">'+esc(st.q)+'</div>'+ladder(st)+'<ul class="ins">'+st.segs.map(function(sg){var nm='<b>'+esc(sg.name)+'</b>',r=sg.rag||segRag(sg.score),sc=sg.score==null?'<span style="color:var(--mut);font-style:italic">n/a</span>':'<span style="color:'+C[r]+';font-weight:700">'+sg.score+'/5</span>';return sg.score==null?'<li style="--bc:'+C[r]+'">'+nm+' '+sc+'</li>':'<li style="--bc:'+C[r]+'">'+nm+' '+sc+': '+esc((sg.points||[]).join(' '))+'</li>';}).join('')+'</ul></div>';}
    function col(keys){return '<div class="cl-col">'+keys.map(function(k){var st=null;steps.forEach(function(z){if(z.k===k)st=z;});return st?blk(st):'';}).join('')+'</div>';}
    return '<div class="classic">'+col(['vision','consequences','dialogues'])+ring+col(['metrics','tracking'])+'</div>';
  }
  // DATA.gaps is the coverage record. It used to be accepted and never drawn, so a
  // subdimension nobody probed vanished from the page. It renders under every view now.
  function renderGaps(){var g=(DATA.gaps||[]).filter(function(x){return x&&String(x).trim();});
    if(!g.length)return '';
    return '<div class="gapbar"><b>Still to probe</b><ul>'+g.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';}
  var VIEWS={cycle:renderCycle,flow:renderFlow,classic:renderClassic},cur='cycle';
  document.getElementById('ctx').textContent=DATA.context||'OPEX QUICKSCAN';
  document.getElementById('lens').textContent=DATA.lens||'PERFORMANCE WHEEL';
  document.getElementById('title').innerHTML=hl(DATA.keyMessage||'');
  document.getElementById('subt').textContent=DATA.teamName||'';
  document.getElementById('src').innerHTML=DATA.source?('<b style="color:var(--txt)">Source:</b> '+DATA.source):'';
  document.getElementById('lg').innerHTML='<b style="color:var(--txt);margin-right:4px">Legend:</b>'+['green','amber','red'].map(function(k){var p=PILL[k],lab={green:'Good 4–5',amber:'Fair 3',red:'Weak 1–2'}[k];return '<span class="lp" style="background:'+p[0]+';color:'+p[1]+'">● '+lab+'</span>';}).join('');

  function fitView(){var v=document.getElementById('view'),vi=document.getElementById('vinner');
    var ah=v.clientHeight;if(!ah)return;
    var st=vi.querySelector('[data-stretch]'); if(st)st.style.height='';
    vi.style.transform='none';
    // The width-trick (widen, then scale back) makes content height depend on the scale, which makes an
    // iterative fit oscillate and sometimes overshoot (bottom clips). H*s is monotonic in s, so binary-search
    // the LARGEST scale whose content still fits the frame height with a safety gap. Cannot overshoot.
    var lo=0.25,hi=1.12,best=0.25;
    for(var k=0;k<12;k++){
      var s=(lo+hi)/2;
      vi.style.width=(100/s)+'%';
      var H=vi.scrollHeight;
      if(H*s<=ah-10){best=s;lo=s;}else{hi=s;}
    }
    vi.style.width=(100/best)+'%';vi.style.transform='scale('+best+')';
    if(st){var free=(ah-10)/best-vi.scrollHeight; if(free>1)st.style.height=(st.offsetHeight+free)+'px';}}
  function render(){var vi=document.getElementById('vinner');vi.innerHTML=VIEWS[cur]()+renderGaps();if(cur==='classic')fitClassicLabels(vi);requestAnimationFrame(fitView);setTimeout(fitView,60);}
  function seg(id,attr,cb){var box=document.getElementById(id);box.querySelectorAll('button').forEach(function(b){b.onclick=function(){box.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');cb(b.getAttribute(attr));};});}
  seg('views','data-v',function(v){cur=v;render();});
  seg('theme','data-s',function(t){document.getElementById('pw').setAttribute('data-t',t);render();});
  window.addEventListener('resize',fitView);

  render();
})();
</script>
<style>

}
</style>
<style>/* READ-MODE TYPE FLOOR — nothing under 11px once the page stops scaling */

@media (max-width:760px){
  #ft{font-size:11px!important}
