<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lean Maturity Assessment</title>
<style>
/* Type scale — one place, not case by case. Every size below 12px is a token; the
   whole small end lifts on a narrow screen so nothing drops under 11px on a phone. */
:root{
  --fs-65:6.5px; --fs-7:7px; --fs-75:7.5px; --fs-8:8px; --fs-85:8.5px; --fs-9:9px;
  --fs-95:9.5px; --fs-10:10px; --fs-105:10.5px; --fs-11:11px; --fs-115:11.5px;
}
@media (max-width:760px){
  :root{
    --fs-65:11px; --fs-7:11px; --fs-75:11px; --fs-8:11px; --fs-85:11px; --fs-9:11px;
    --fs-95:11px; --fs-10:11.5px; --fs-105:12px; --fs-11:12px; --fs-115:12.5px;
  }
}
</style>
<style>
  *{box-sizing:border-box}
  :root{--page:#FFF}
  html,body{margin:0;height:100vh;overflow:hidden}
  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}
  /* ===== BRAND THEME (inlined from templates/brand.css) ===== */
  #art{--navy:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;
      --slate-10:rgba(54,65,86,.09);--navy-10:rgba(11,35,71,.10);--green-10:rgba(28,122,74,.10);
      --rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;--rag-green-text:#2F8F6B;--rag-amber-text:#B97F22;--rag-red-text:#C2483D;--rag-na-text:#6B7480;--tint-green:rgba(47,143,107,.12);--tint-amber:rgba(212,154,58,.16);--tint-red:rgba(210,100,90,.13);--tint-na:rgba(154,164,176,.16);--navy-fill:#0B2347;
      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;
      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);
      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;
      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}
  #art[data-t="dark"]{--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--navy-fill:#243246;--accent:#8FC7E8;--steel:#93A9C4;--rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;--rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;--tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}
  body:has(#art[data-t="dark"]){--page:#0E1620}
  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}
  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:3}
  .tags{display:flex;align-items:center;gap:11px;min-width:0}
  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}
  .nr-pill img{height:21px;filter:brightness(0) invert(1)}
  .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}
  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:var(--fs-115);letter-spacing:.8px;padding:9px 16px;border-radius:8px}
  #art[data-t="dark"] .nr-track{background:#243246;color:#EAEFF5}
  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}
  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  .ctrls{display:flex;gap:9px;flex:none}
  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0;max-width:1300px}
  #art[data-t="dark"] h1{color:#EAEFF5}
  h1 .hl{color:var(--green)}
  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 16px}
  .subt{font-size:15px;font-weight:600;color:var(--accent)}
  #view{flex:1;min-height:0;position:relative;overflow:hidden}
  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:24px}
  /* ── LMA read-out (lma-builder): the house slide, as the OTE waterfall lays it out ──
     No boxes around the exhibit or the insights. Section heads with a steel rule. The page is
     filled: rows stretch to the frame height (fitView), type follows the deck size (--nr-ui). */
  select.tsel{font:inherit;font-size:12px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;max-width:280px}
  #vinner{font-size:var(--lui,14px)}
  .slide{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:2.6em;height:100%;align-items:stretch}
  .slide.full{grid-template-columns:minmax(0,1fr)}
  .slide.wide{grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:2.2em}
  .colx,.colins{min-width:0;display:flex;flex-direction:column;height:100%}
  .sech{margin:0 0 .9em;font-size:1.15em;font-weight:700;color:var(--ink);line-height:1.25;padding-bottom:.5em;border-bottom:1px solid var(--steel);flex:none}
  .sech small{font-weight:500;color:var(--mut);font-size:.8em;margin-left:.4em}
  .meta{font-size:.82em;color:var(--mut);margin:-.3em 0 .6em;flex:none}
  .grow{flex:1;min-height:0;display:flex;flex-direction:column}
  .empty{color:var(--mut);font-style:italic}
  /* insights, exactly the OTE's */
  .inswrap{display:flex;flex-direction:column;justify-content:space-between;gap:1.1em;flex:1}
  .ins{border-radius:8px}
  .ins .inh{display:flex;align-items:flex-start;gap:.65em;margin-bottom:.35em}
  .ins .inum{flex:none;width:1.6em;height:1.6em;border-radius:50%;background:var(--navy-fill);color:#fff;font-size:.84em;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-top:.15em}
  .ins .inh b{font-size:1.1em;font-weight:700;color:var(--ink);line-height:1.35}
  .ins .inh .sc{font-weight:700}
  .ins ul{margin:0;padding-left:2.9em;list-style:none}
  .ins li{position:relative;font-size:1em;color:var(--txt);line-height:1.5;margin-bottom:.3em}
  .ins li::before{content:"";position:absolute;left:-.9em;top:.6em;width:.33em;height:.33em;border-radius:50%;background:var(--mut)}
  .ins li b{color:var(--ink)}
  /* band tokens: Bronze/Silver/Gold keep their names, the house RAG carries the colour */
  .green{--rg:var(--rag-green);--rt:var(--rag-green-text);--tn:var(--tint-green)}
  .amber{--rg:var(--rag-amber);--rt:var(--rag-amber-text);--tn:var(--tint-amber)}
  .red{--rg:var(--rag-red);--rt:var(--rag-red-text);--tn:var(--tint-red)}
  .na{--rg:var(--rag-na);--rt:var(--rag-na-text);--tn:var(--tint-na)}
  .bt{color:var(--rt);font-weight:700}
  /* department overview: behaviours as rows, teams as columns, the department as a column of pills */
  .mxg{flex:1;min-height:0;display:grid;column-gap:.3em;row-gap:.25em;align-content:space-between;margin-top:.2em}
  .slide.many{grid-template-columns:minmax(0,2.6fr) minmax(0,1fr)}
  .tx-th{font-size:.9em;font-weight:800;color:var(--ink);text-align:center;line-height:1.25;padding:0 .2em .45em;border-bottom:2px solid var(--ink);align-self:end;text-wrap:balance}
  .tx-th:first-child{border-bottom:0}
  .many .tx-th{font-size:.76em;padding:0 0 .45em;hyphens:auto;-webkit-hyphens:auto}
  .tx-dh{grid-column:1 / -1;font-size:.82em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;padding:.55em 0 .1em}
  .tx-dh .inum{display:inline-flex;flex:none;width:1.45em;height:1.45em;border-radius:50%;background:var(--navy-fill);color:#fff;font-size:.9em;align-items:center;justify-content:center;margin-right:.45em;letter-spacing:0}
  .tx-bl{grid-column:1;font-size:.95em;color:var(--txt);display:flex;align-items:center;padding-left:2.1em;line-height:1.3;min-width:0}
  .tx-ov{font-weight:800;color:var(--ink);padding-left:0}
  .tx-rule{grid-column:1 / -1;height:1.5px;background:var(--ink);align-self:center;margin:.2em 0}
  .cell{display:flex;align-items:center;justify-content:center;height:1.9em;border-radius:6px;font-size:1em;font-weight:700;background:var(--tn);color:var(--rt);cursor:help}
  .cell.ov{font-weight:800;box-shadow:inset 0 0 0 1.5px var(--rg)}
  .cell.dep{background:var(--rt);color:var(--card);font-weight:800;box-shadow:none;border-radius:999px}
  /* key takeaways: six open blocks, no cards */
  .tkg{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:1.6em 2.4em}
  .tk{display:flex;flex-direction:column;border-top:1px solid var(--steel);padding-top:.9em}
  .tkh{display:flex;align-items:center;gap:.7em;margin-bottom:.5em}
  .tkico{flex:none;width:2.4em;height:2.4em;border-radius:.7em;background:var(--green-10);display:flex;align-items:center;justify-content:center}
  .tkico svg{width:1.35em;height:1.35em;stroke:var(--green);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  #art[data-t="dark"] .tkico svg{stroke:#5FBF94}
  .tkt{flex:1;min-width:0;font-size:1.1em;font-weight:700;color:var(--ink);line-height:1.3}
  .tk ul{margin:0;padding-left:1.1em;list-style:none}
  .tk li{position:relative;font-size:1em;color:var(--txt);line-height:1.5;margin-bottom:.35em}
  .tk li::before{content:"";position:absolute;left:-.9em;top:.6em;width:.33em;height:.33em;border-radius:50%;background:var(--mut)}
  .tk li b{color:var(--ink)}
  /* team deepdive: dimension | behaviour | track on the left, insights on the right */
  .ddg{flex:1;display:grid;grid-template-columns:7.2em minmax(9em,1fr) minmax(10em,1.35fr);gap:0 1.1em;align-content:stretch}
  .dimcell{display:flex;padding:.35em 0}
  .dimblk{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25em;text-align:center;border-radius:10px;background:var(--navy-fill);color:#fff;font-weight:700;padding:.5em}
  .dimblk .dn{display:inline-flex;align-items:center;gap:.4em;font-size:.95em}
  .dimblk .dn i{font-style:normal;display:inline-flex;width:1.45em;height:1.45em;border-radius:50%;background:#fff;color:var(--navy-fill);font-size:.8em;align-items:center;justify-content:center}
  .dimblk .dsc{font-size:1.25em;font-weight:800}
  .dimblk .dsc small{font-size:.6em;color:rgba(255,255,255,.7)}
  #art[data-t="dark"] .dimblk{background:#2E5C8A}
  #art[data-t="dark"] .dimblk .dn i{color:#2E5C8A}
  .bnm{display:flex;align-items:center;justify-content:flex-end;gap:.5em;text-align:right;font-size:.95em;font-weight:600;color:var(--ink);line-height:1.3;padding:.35em 0}
  .ctd{flex:none;font-size:.72em;font-weight:700;padding:.15em .55em;border-radius:999px;color:var(--rag-amber-text);box-shadow:inset 0 0 0 1px var(--rag-amber);white-space:nowrap}
  .bsc{display:flex;align-items:center;padding:.35em 0;cursor:help}
  .top{border-top:1px dashed var(--line);margin-top:.35em;padding-top:.7em}
  .trk{position:relative;display:block;width:100%;height:1.75em;border-radius:6px;background:var(--slate-10);overflow:hidden}
  .trk .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line);z-index:2}
  .trk .fill{z-index:3;position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;justify-content:flex-end;padding-right:.55em;font-size:.88em;font-weight:800;border-radius:6px 0 0 6px;background:var(--tn);color:var(--rt);box-shadow:inset -2px 0 0 var(--rg)}
  #art[data-t="dark"] .trk{background:rgba(255,255,255,.05)}
  #art[data-t="dark"] .trk .tick{background:rgba(255,255,255,.18)}
  .scale{padding-top:.5em}
  .trk.sc{height:1.45em;background:none;overflow:visible}
  .trk.sc .z{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:.72em;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;background:var(--tn);color:var(--rt);text-decoration:none}
  /* the bottom line of an exhibit, the place the OTE puts its formula: the headline figures */
  .sumrow{flex:none;display:flex;align-items:baseline;gap:2.2em;flex-wrap:wrap;margin-top:.9em;padding-top:.75em;border-top:1.5px solid var(--ink)}
  .sumrow .k{font-size:.85em;color:var(--mut);margin-right:.4em}
  .sumrow .v{font-size:1.45em;font-weight:800;color:var(--ink)}
  .sumrow .v small{font-size:.55em;color:var(--mut);font-weight:600;margin-left:.15em}
  .sumrow .v.hl{color:var(--green)} #art[data-t="dark"] .sumrow .v.hl{color:#5FBF94}
  .sumrow .note{margin-left:auto;font-size:.82em;color:var(--mut)}
  /* tool panels: four open columns that run the full height */
  .tg4{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2.2em}
  .tgp{display:flex;flex-direction:column;min-width:0}
  .tgph{display:flex;align-items:center;gap:.5em;padding-bottom:.55em;margin-bottom:.2em;border-bottom:2px solid var(--ink)}
  .tgph .inum{display:inline-flex;flex:none;width:1.45em;height:1.45em;border-radius:50%;background:var(--navy-fill);color:#fff;font-size:.8em;font-weight:800;align-items:center;justify-content:center}
  .tgph .hcnt{margin-left:auto;font-size:.9em;color:var(--mut);font-weight:600;white-space:nowrap}
  .tgph .hcnt b{color:var(--ink);font-size:1.15em;font-weight:800}
  .tgph .d{font-size:.95em;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
  .tgph .a{margin-left:auto;font-size:1.1em;font-weight:800;color:var(--ink)}
  .tgph .a small{font-size:.65em;color:var(--mut);font-weight:600}
  .pcount{font-size:.68em;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:.2em .6em;border-radius:999px;background:var(--tn);color:var(--rt);white-space:nowrap}
  .tgpb{flex:1;display:grid}
  .trow{display:flex;align-items:center;gap:.7em;min-height:2.3em;border-bottom:1px solid var(--line);cursor:help}
  .trow:last-child{border-bottom:none}
  .trow .tl{flex:0 0 44%;min-width:0;font-size:.92em;font-weight:600;color:var(--ink);line-height:1.25}
  .lad .trow .tl{flex:1}
  .trow.gone .tl{color:var(--rag-red-text)}
  .trow .tsc{flex:none;min-width:2.4em;text-align:right;font-size:.95em;font-weight:800;color:var(--rt)}
  .dt{position:relative;flex:1;height:.75em;border-radius:5px;background:var(--slate-10)}
  .dt .thr{position:absolute;top:-.25em;bottom:-.25em;width:1px;background:var(--line);z-index:1}
  #art[data-t="dark"] .dt .thr{background:rgba(255,255,255,.16)}
  .dt .rng{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--tn);z-index:2}
  #art[data-t="dark"] .dt .rng{background:var(--rg);opacity:.38}
  .dt .mk{position:absolute;top:50%;width:.85em;height:.85em;border-radius:50%;background:var(--rg);border:2px solid var(--card);transform:translate(-50%,-50%);z-index:3;box-shadow:0 1px 2px rgba(11,35,71,.28)}
  .ladd{display:inline-flex;gap:3px;align-items:center;flex:none}
  .ladd i{width:1.15em;height:.55em;border-radius:3px;background:var(--line)}
  .ladd i.on{background:var(--rg)}
  /* the hover card: what a level means, and why this team got its score */
  #tip{position:fixed;z-index:95;width:340px;max-width:calc(100vw - 24px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -18px rgba(11,35,71,.45);padding:12px 16px 0;font-size:13px;line-height:1.45;pointer-events:none;opacity:0;transition:opacity .1s}
  #tip{visibility:hidden;left:-9999px;top:0}
  #tip.on{opacity:1;visibility:visible}
  #tip .th{font-weight:800;font-size:13.5px;margin-bottom:6px;color:var(--ink)}
  #tip .tc{border-top:1px solid var(--line);padding-top:7px;margin-top:7px}
  #tip .tc:first-of-type{border-top:0;margin-top:0;padding-top:0}
  #tip .cn{font-weight:700;display:flex;justify-content:space-between;gap:10px}
  #tip .lv{display:grid;grid-template-columns:1.6em 1fr;gap:2px 6px;margin:4px 0 12px;color:var(--txt)}
  #tip .lv .n{font-weight:800;color:var(--mut);text-align:center;border-radius:4px}
  #tip .lv .on{background:var(--slate-10);font-weight:700;color:var(--ink);border-radius:4px}
  #tip .lv .n.on{color:var(--ink)}
  #tip .ans{color:var(--mut);font-size:var(--fs-115);margin-top:2px}
  #tip .tk2{font-size:var(--fs-105);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
  #tip .th2{display:flex;justify-content:space-between;gap:14px;align-items:baseline;font-size:14px;font-weight:800;margin:2px 0 8px}
  #tip .th2>span:last-child,#why h4>span:last-child{white-space:nowrap}
  #tip .tcl{border-top:1px solid var(--line);padding:6px 0 4px}
  #tip .cn2{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-weight:600}
  #tip .tft{border-top:1px solid var(--line);margin:0 -16px;padding:7px 16px 9px;font-size:var(--fs-115);color:var(--mut)}
  /* the "Why this score" panel: opens on click, in the client build too */
  #why{position:fixed;z-index:96;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--card);color:var(--ink);border-left:1px solid var(--line);box-shadow:-20px 0 40px -24px rgba(11,35,71,.45);display:flex;flex-direction:column;font-size:13px;line-height:1.45;transform:translateX(105%);transition:transform .18s ease}
  #why:not(.on){visibility:hidden;transition:transform .18s ease,visibility 0s .18s}
  #why.on{transform:none}
  #why .wh{position:relative;padding:18px 22px 14px;border-bottom:1px solid var(--line)}
  #why .wx{position:absolute;top:12px;right:14px;border:0;background:none;color:var(--mut);font-size:22px;line-height:1;cursor:pointer}
  #why .wk{font-size:var(--fs-105);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding-right:28px}
  #why h4{margin:4px 0 0;font-size:17px;font-weight:800;display:flex;justify-content:space-between;gap:14px;align-items:baseline}
  #why .wb{flex:1;overflow:auto;padding:4px 22px 18px}
  #why .wsec{padding:14px 0;border-bottom:1px solid var(--line)}
  #why .wch{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:800}
  #why .wsm{font-size:var(--fs-115);color:var(--mut);margin-top:2px}
  #why .wsm b{font-weight:700}
  #why .wstp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:10px 0 4px}
  #why .wstp div{border-radius:6px;padding:6px 7px;font-size:var(--fs-115);line-height:1.35;background:var(--slate-10);color:var(--mut)}
  #why .wstp div b{display:block;font-size:12px;margin-bottom:2px}
  #why .wstp div.on{background:var(--tn);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rg)}
  #why .wlab{font-size:var(--fs-105);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-top:12px}
  #why .wq{font-style:italic;color:var(--txt);margin-top:6px;padding-left:10px;border-left:2px solid var(--line)}
  /* footer legend */
  #ft .l{min-width:0}
  .legend{flex-wrap:wrap;align-items:center}
  .lp{background:var(--tn);color:var(--rt);display:inline-flex;align-items:center;gap:.45em}
  .lpd{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--rg)}
  .lx{display:inline-flex;align-items:center;gap:5px;margin-left:8px;color:var(--txt)}
  .lx .rngk{width:22px;height:8px;border-radius:4px;background:rgba(122,131,143,.25);display:inline-block}
  .lx .mkk{width:11px;height:11px;border-radius:50%;background:var(--mut);border:2px solid var(--card);display:inline-block}

     into normal flow and let it wrap (applies to every artifact that uses this chrome) ── */
  @media (max-width:760px){
    #art,#pm{padding:14px 18px 10px 42px}
    .nr-rail{width:24px}
  }

  /* ── responsive chrome ──────────────────────────────────────────────────────
     The toprow stacks when it does not fit, and the switch is DETECTED, not
     guessed: fitChrome() below measures the one-row layout and adds .stacked to
     the artifact root. Never hard-code a breakpoint for the chrome — see
     brand-guide.html, "Responsive chrome". Stacked order is brand row, then
     navigation, then working controls: where am I, what am I looking at, what
     can I change. ── */
  #art.stacked .toprow,#pm.stacked .toprow,#pw.stacked .toprow{
    position:static;top:auto;left:auto;right:auto;margin:0 0 12px;

     border-radius:0 9px 9px 0. The negative margin is given back as padding, so
     its right edge does not move and no sibling shifts. */
  #art.stacked .nr-pill,#pm.stacked .nr-pill,#pw.stacked .nr-pill{
    order:1;margin-left:calc(-1 * var(--padl,0px));padding-left:calc(14px + var(--padl,0px))}
  /* no text in an artifact is ever cut to make it fit: the lens badge wraps, it
     does not ellipsise. An instrument that truncates it looks fine to a gate and
     wrong to a client. */
  #art.stacked .nr-track,#pm.stacked .nr-track,#pw.stacked .nr-track{
    order:2;max-width:none;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
  #art.stacked .ctrls,#pm.stacked .ctrls,#pw.stacked .ctrls{

  @media (max-width:760px){

     deck size. Only when the content still does not fit is the whole view scaled down. */
  function fitView(){var v=document.getElementById('view'),vi=document.getElementById('vinner');var ah=v.clientHeight;if(!ah)return;
    var base=Math.max(13,Math.min(19,(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--nr-ui'))||14)));
    vi.style.transform='none';vi.style.width='100%';vi.style.height='auto';
    /* the natural height at a type size, measured with the stretch switched off */
    function nat(fs){vi.style.setProperty('--lui',fs+'px');return vi.scrollHeight;}
    var fs=base, cap=base*1.3, room=ah-6;
    if(nat(fs)<=room){ while(fs+0.5<=cap&&nat(fs+0.5)<=room) fs+=0.5; }
    else { while(fs>11&&nat(fs)>room) fs-=0.5; }
    nat(fs); vi.style.height=room+'px';
    if(vi.scrollHeight>ah-2){var lo=0.4,hi=1,best=0.4;
      for(var j=0;j<10;j++){var s=(lo+hi)/2;vi.style.width=(100/s)+'%';vi.style.height=(room/s)+'px';if(vi.scrollHeight*s<=ah-2){best=s;lo=s;}else{hi=s;}}
      vi.style.width=(100/best)+'%';vi.style.height=(room/best)+'px';vi.style.transform='scale('+best+')';}}
  /* the hover card */
  var tipEl=document.createElement('div'); tipEl.id='tip'; document.getElementById('art').appendChild(tipEl);
  var whyEl=document.createElement('div'); whyEl.id='why'; document.getElementById('art').appendChild(whyEl);
  document.addEventListener('click',function(e){var el=e.target.closest&&e.target.closest('[data-why]');
    if(el&&!document.getElementById('art').classList.contains('editing')){whyPanel(el.getAttribute('data-why'));return;}
    if(whyEl.classList.contains('on')&&!whyEl.contains(e.target)) whyEl.classList.remove('on');});
  document.addEventListener('keydown',function(e){if(e.key==='Escape') whyEl.classList.remove('on');});
  document.addEventListener('mouseover',function(e){var el=e.target.closest&&e.target.closest('[data-tip]');
    if(!el||!TIPS[el.getAttribute('data-tip')]){tipEl.classList.remove('on');return;}
    tipEl.innerHTML=TIPS[el.getAttribute('data-tip')];tipEl.classList.add('on');});
  document.addEventListener('mousemove',function(e){if(!tipEl.classList.contains('on'))return;
    var w=tipEl.offsetWidth,h=tipEl.offsetHeight,x=e.clientX+16,y=e.clientY+16;
    if(x+w>window.innerWidth-8)x=e.clientX-w-16; if(y+h>window.innerHeight-8)y=Math.max(8,window.innerHeight-h-8);
    tipEl.style.left=x+'px';tipEl.style.top=y+'px';});
  function render(){
    TIPS={}; tipN=0; WHY={}; whyN=0;
    var d=keyView()(); CUR=d;
    document.getElementById('ctx').textContent=DATA.context||'OPEX QUICKSCAN';
    document.getElementById('lens').textContent=d.chip;
    var km=d.path?getN(d.path[0],d.path[1]):'';
    document.getElementById('title').innerHTML=km?hl(km):'<span style="color:var(--mut);font-style:italic;font-weight:600">Action title to be written</span>';
    document.getElementById('subt').textContent=d.sub||'';
    var stamp=[DATA.dept.client,DATA.dept.date].filter(Boolean).join(' · ');
    document.getElementById('src').innerHTML=d.src?('<b style="color:var(--txt)">Source:</b> '+esc(d.src)+(stamp?' · '+esc(stamp):'')):'';
    var lg=LEG[d.legend]||[], extra=d.legend==='rng'?'<span class="lx"><i class="rngk"></i> range across teams</span><span class="lx"><i class="mkk"></i> department mean</span>':'';
    document.getElementById('lg').innerHTML=lg.length?('<b style="color:var(--txt);margin-right:4px">Legend:</b>'+lg.map(function(p){return '<span class="lp '+p[0]+'"><i class="lpd"></i>'+p[1]+'</span>';}).join('')+extra):'';
    document.getElementById('vinner').innerHTML=d.html;
    var t=st.scope==='team';
    document.getElementById('dview').style.display=t?'none':'flex';
    document.getElementById('teamSel').style.display=t?'inline-block':'none';
    document.getElementById('tview').style.display=t?'flex':'none';
    
    requestAnimationFrame(function(){fitView();if(window.fitChrome)window.fitChrome();}); setTimeout(fitView,60);}
  function seg(id,attr,cb){var box=document.getElementById(id);box.querySelectorAll('button').forEach(function(b){b.onclick=function(){box.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');cb(b.getAttribute(attr));};});}
  function setOn(id,val){document.querySelectorAll('#'+id+' button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-v')===val);});}
  var sel=document.getElementById('teamSel');
  sel.innerHTML=DATA.teams.map(function(t,i){return '<option value="'+i+'">'+esc(t.teamName)+'</option>';}).join('');
  sel.value=String(st.team);
  sel.onchange=function(e){st.team=+e.target.value;render();};
  seg('scope','data-v',function(v){st.scope=v;render();});
  seg('dview','data-v',function(v){st.dv=v;render();});
  seg('tview','data-v',function(v){st.tv=v;render();});
  seg('theme','data-s',function(v){document.getElementById('art').setAttribute('data-t',v);render();});
  setOn('scope',st.scope);
  window.addEventListener('resize',fitView);

  render();

})();
</script>
<script>
/* ── fitChrome() — the chrome stacks when it does not fit ────────────────────
   Measures the one-row layout and adds .stacked to the artifact root when any of
   six things is true: the two groups are closer than 12px · a control runs past
   either edge · a label has been squeezed narrower than its own text · the
   toprow wraps · the toprow comes within 6px of the action title · the viewport
   is at or below 760px (the floor). Exposed as window.fitChrome() so a render
   pass can call it after it changes a label. ── */
(function(){
  var busy=false,lastW=-1;
  function root(){return document.querySelector('#art,#pm,#pw');}
  function skip(e){
    if(!e) return true;
    if(e.id==='wpop'||(e.closest&&e.closest('#wpop'))) return true;
    var cs=getComputedStyle(e);
    if(cs.visibility==='hidden'||cs.display==='none') return true;
    return false;
  }
  function fitChrome(){
    if(busy) return; busy=true;
    try{
      var R=root(); if(!R) return;
      var tr=R.querySelector('.toprow'); if(!tr) return;
      R.classList.remove('stacked');
      void tr.offsetWidth;                                  /* force the reflow we measure */
      var need=window.innerWidth<=760, i, r, e;
      var trb=tr.getBoundingClientRect();
      /* 1. the two groups are closer than 12px */
      var tags=R.querySelector('.tags'), ctrls=R.querySelector('.ctrls');
      if(!need&&tags&&ctrls&&!skip(tags)&&!skip(ctrls)){
        var a=tags.getBoundingClientRect(), b=ctrls.getBoundingClientRect();
        if(b.left-a.right<12) need=true;
      }
      /* 2. a control runs past either edge */
      if(!need){
        var kids=tr.querySelectorAll('.nr-pill,.nr-track,.seg,.wgrp,button,#wnote');
        for(i=0;i<kids.length;i++){
          e=kids[i]; if(skip(e)) continue;
          r=e.getBoundingClientRect(); if(!r.width&&!r.height) continue;
          if(r.right>trb.right+0.5||r.left<trb.left-0.5){need=true;break;}
        }
      }
      /* 3. a label has been squeezed narrower than its own text */
      if(!need){
        var ls=tr.querySelectorAll('.nr-pill b,.nr-track,.seg button,button,#wnote,span');
        for(i=0;i<ls.length;i++){
          e=ls[i]; if(skip(e)) continue;
          if(!e.textContent||!e.textContent.trim()) continue;
          if(e.scrollWidth>e.clientWidth+1){need=true;break;}
        }
      }
      /* 4. the toprow wraps — a floating row that wraps grows downwards into the
         title without pushing anything down */
      if(!need){
        var tall=0,ch=tr.children;
        for(i=0;i<ch.length;i++){var h=ch[i].getBoundingClientRect().height;if(h>tall)tall=h;}
        if(trb.height>tall+2) need=true;
      }
      /* 5. the toprow sits on, or within 6px of, the action title */
      if(!need){
        var t=R.querySelector('.nr-strip'); if(!t||skip(t)) t=R.querySelector('h1');
        if(t&&!skip(t)){var tb=t.getBoundingClientRect(); if(tb.top-trb.bottom<6) need=true;}
      }
      if(need) R.classList.add('stacked');
      /* --padl is read AFTER the class lands: the class itself changes the padding */
      R.style.setProperty('--padl',(parseFloat(getComputedStyle(R).paddingLeft)||0)+'px');
    } finally { busy=false; }
  }
  window.fitChrome=fitChrome;
  function kick(){requestAnimationFrame(fitChrome);}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',kick); else kick();
  window.addEventListener('load',kick);
  window.addEventListener('resize',function(){lastW=-1;kick();});
  if(window.ResizeObserver){
    var ro=new ResizeObserver(function(en){
      var w=en&&en[0]?Math.round(en[0].contentRect.width):-1;
      if(w===lastW) return;                                 /* stacking must not re-trigger us */
      lastW=w; kick();
    });
    var r0=root(); if(r0) ro.observe(r0);
  }
})();
</script>
<script id="nr-topbar-js">
/* patch_topbar.py: one theme switch and the way home, the same in every instrument.
   Theme: the choice is kept under the cockpit's key, nr_dark, so every page of an
   engagement opens the same way. Home: a page that carries
   <meta name="nr-home" content="index.html"> (the engagement artifact adds it) gets
   "< Cockpit /" in front of its section tag. */
(function(){
  var K='nr_dark', box=document.getElementById('theme')||document.getElementById('tseg');
  if(box){
    box.querySelectorAll('button').forEach(function(b){ var d=b.getAttribute('data-s')==='dark';
      b.title=d?'Dark mode':'Light mode'; b.setAttribute('aria-label',b.title);
      b.addEventListener('click',function(){ try{ localStorage.setItem(K,d?'1':'0'); }catch(e){} }); });
    var v=null; try{ v=localStorage.getItem(K); }catch(e){}
    var dk=box.querySelector('button[data-s="dark"]');
    if(v==='1'&&dk&&!dk.classList.contains('on')) dk.click();
  }
  var m=document.querySelector('meta[name="nr-home"]'), lens=document.getElementById('lens')||document.querySelector('.toprow .nr-track');
  if(m&&lens&&!document.querySelector('.nr-crumb')){
    var c=document.createElement('div'); c.className='nr-track nr-crumb';
    var a=document.createElement('a'); a.className='nr-home'; a.href=m.getAttribute('content')||'index.html';
    a.textContent='\u2039 '+(m.getAttribute('data-label')||'Cockpit'); a.title='Back to the engagement cockpit';
    /* opened in a window of the findings dashboard (a frame of our own page): go back in that page, not in the frame */
    try{ if(window.parent!==window&&window.parent.document) a.target='_parent'; }catch(e){}
    var s=document.createElement('span'); s.className='nr-sep'; s.textContent='/';
    lens.parentNode.insertBefore(c,lens); c.appendChild(a); c.appendChild(s); c.appendChild(lens);
    if(window.fitChrome) requestAnimationFrame(window.fitChrome);
  }
})();
</script>
<style>
/* ── READ MODE · narrow screens ──────────────────────────────────────────────
   This artifact normally scales its whole body down so the page fits one screen.
   On a phone that turns 13px type into 4px. Below 760px the scaling is switched
   off and the page simply flows and scrolls at its real size. Desktop is
   untouched — every rule here lives inside the media query. */
@media (max-width:760px){
  html,body{height:auto!important;overflow:auto!important}
  #art,#pw,#pm{height:auto!important;min-height:0!important;max-height:none!important;
    overflow:visible!important;padding:12px 14px 22px 34px!important}
  #view{height:auto!important;min-height:0!important;max-height:none!important;
    overflow:visible!important;flex:none!important;position:static!important}
  #vinner{position:static!important;transform:none!important;width:100%!important;
    padding-bottom:14px!important}
  .nr-rail{width:22px!important}
  .toprow{position:static!important;top:auto!important;right:auto!important;left:auto!important;
    margin:0 0 10px!important;flex-wrap:wrap!important;gap:8px 10px!important;justify-content:flex-start!important}
  .tags{flex-wrap:wrap!important;gap:8px!important;margin-left:-34px!important}
  .ctrls{flex-wrap:wrap!important;gap:8px!important;flex:1 1 100%!important}
  #ft{position:static!important;flex-wrap:wrap!important;row-gap:6px!important;margin-top:14px!important}
  h1{font-size:19px!important;max-width:none!important}
  .grid,.classic,.cols-grid{grid-template-columns:1fr!important}
  table{min-width:0!important}
  .tbl-wrap,.wrap-x{overflow-x:auto!important}
}
</style>
<style>/* READ-MODE TYPE FLOOR — nothing under 11px once the page stops scaling */

@media (max-width:760px){
  #ft{font-size:11px!important}
  .conf,.lp,.li,.nr-track,.nr-foot,.lbl,.note{font-size:11px!important}
  .inum,.chip,.inev,.num,.wf-num,.vnum{font-size:11px!important}
  #ft b,.legend b,.l b{font-size:11px!important}
  /* a row label truncated to '…' is worse than a wrapped one once the page flows */
  [style*="ellipsis"]{white-space:normal!important;text-overflow:clip!important;overflow:visible!important}
}
</style>
