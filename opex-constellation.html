   note:'Sits above the three groups because it is how evidence gets in. As built it only writes to the inventory: the wheels, the barometer and the process map each carry their own capture flow. Five skills parsing interview notes is a duplication still to resolve.'});

n({id:'sub-inventory', label:'Establish the baseline', kind:'sub', team:'diag', status:'live', hub:'diag-hub',
   what:'The baseline: what the organisation does today. Value chains, processes, activities, tasks, and the FTE on each. Facts only, no judgement. Every dimension is measured against it.'});
n({id:'sub-lens', label:'Evidence per dimension', kind:'sub', team:'diag', status:'live', hub:'diag-hub',
   what:'The analyses that each go deep on one of the six dimensions. They deliver the evidence for that dimension, not the score. The colour of each star is the dimension.'});
n({id:'sub-conclude', label:'Conclude across dimensions', kind:'sub', team:'diag', status:'build', hub:'diag-hub',
   what:'Where the six dimensions come together: the maturity scores, the register of pain points, the register of opportunities, and the verdict per dimension.'});

n({id:'process-baseline', label:'Process Baseline', kind:'leaf', team:'diag', status:'live', sub:'sub-inventory', color:'#8FA8CE',
   skill:'process-baseline', stored:DPLUG+' · skills/process-baseline/', example:'',
   gist:'The database behind the diagnostic: actors, value chains, processes, phases, activities, tasks, and the FTE on each. You enter it once. The activity map, the process map, the heatmap and the business case all read from it, so the numbers always match.',
   note:'The old activity-register skill IS this one, renamed. It survives in the plugin only as a deprecated tombstone so a stale reference fails loudly.'});
n({id:'mae-builder', label:'MAE — Activity Map', kind:'leaf', team:'diag', status:'live', sub:'sub-inventory', color:'#8FA8CE',
   skill:'mae-builder', stored:DPLUG+' · skills/mae-builder/', example:'examples/northwind-claims__mae.html',
   gist:'The activity map of one team. Per activity: the tasks in it, the FTE it takes and the share of the team that is, what drives the volume, which systems are used, and where time is lost. Built in interviews with the team lead. It describes today only; the lever comes later.',
   note:'It sets an inefficiency level with the business — a judgement. It sits here because its output attaches to the inventory, not to a dimension.'});
n({id:'org-baseline-builder', label:'Org Baseline', kind:'leaf', team:'diag', status:'live', sub:'sub-inventory', color:'#8FA8CE',
   skill:'org-baseline-builder', stored:DPLUG+' · skills/org-baseline-builder/', example:'',
   gist:'The org chart with numbers on it. Every unit and team, who reports to whom, FTE and headcount per team, how much of it is in scope, how much of a manager’s time goes to managing, and what each team delivers.'});
n({id:'ote-waterfall-builder', label:'OTE Waterfall', kind:'leaf', team:'diag', status:'live', sub:'sub-inventory', color:'#8FA8CE',
   skill:'ote-waterfall-builder', stored:DPLUG+' · skills/ote-waterfall-builder/', example:'',
   gist:'Shows where the time you pay for goes. Start from contracted time, take off absence to get available time, then management, training and meetings, then the time lost to peaks you cannot staff for (rigidity) and to people working at different levels (variability), then the waste in the process. What is left is value-adding time. As a share of available time, that is the OTE.'});

n({id:'process-map-builder', label:'Process Map', kind:'leaf', team:'diag', status:'live', sub:'sub-lens', lens:'proc',
   skill:'process-map-builder', stored:DPLUG+' · skills/process-map-builder/', example:'examples/northwind-claims-proc__process-map.html',
   gist:'The swimlane of one process. Phases across the top, actors down the side, every step in the order it happens. Per step it also shows the FTE, whether it is a candidate for automation, AI or redesign, and the pain points people mentioned with a number attached.'});
n({id:'kano-analyser', label:'KANO Analysis', kind:'leaf', team:'diag', status:'env', sub:'sub-lens', lens:'cust',
   skill:'kano-analyser', stored:NONE, example:'', gist:'Splits what the service delivers into three: what customers expect as standard, what they judge you on, and what would surprise them positively. Shows where to invest and where you are doing more than anyone notices.'});
n({id:'service-blueprint', label:'Service Blueprint', kind:'leaf', team:'diag', status:'live', sub:'sub-lens', lens:'cust',
   skill:'service-blueprint-builder', stored:DPLUG+' · skills/service-blueprint-builder/', example:'',
   gist:'Draws one service end to end in lanes: what the customer does and sees above the line of visibility, what we do below it, and the systems that carry it. The columns are the stages of the customer journey. Built from the same baseline as the process map, so the two cannot disagree about a step.',
   note:'One instrument, run on whichever state you are describing — Design runs the same skill on the target service. Being rebuilt from the personal-library skill so it reads the process baseline instead of inventing its own steps. Spec: Service-Blueprint-tool-spec.md.'});
n({id:'voc-nps-analyser', label:'NPS & Complaints', kind:'leaf', team:'diag', status:'env', sub:'sub-lens', lens:'cust',
   skill:'voc-nps-analyser', stored:NONE, example:'', gist:'Brings satisfaction scores, NPS and the complaints log together into one read on the customer dimension: what customers score you on, which complaints repeat, and what that says about the process behind them.'});
n({id:'performance-wheel-builder', label:'Performance Wheel', kind:'leaf', team:'diag', status:'live', sub:'sub-lens', lens:'mgmt',
   skill:'performance-wheel-builder', stored:DPLUG+' · skills/performance-wheel-builder/', example:'examples/northwind-claims-mgmt__performance-wheel.html',
   gist:'Assesses how the team is managed, in five parts: mission and vision, metrics and objectives, performance tracking, performance dialogues, and consequences and recognition. Each part has two or three subdimensions, each scored 1 to 5 against a fixed rubric, based on interviews with the manager and the team. Shown as a wheel.'});
n({id:'skills-wheel-builder', label:'Skills Wheel', kind:'leaf', team:'diag', status:'live', sub:'sub-lens', lens:'mgmt',
   skill:'skills-wheel-builder', stored:DPLUG+' · skills/skills-wheel-builder/', example:'examples/northwind-claims-mgmt__skills-wheel.html',
   gist:'The same wheel, but for competence: target skill level, roles and skill definitions, development plans, onboarding and coaching, standards and knowledge sharing, and how skills link to recognition. Scored 1 to 5 per subdimension. Interviewed across newcomers and long-tenured people, not just the manager.'});
n({id:'kpi-cascade-builder', label:'KPI Cascade', kind:'leaf', team:'diag', status:'env', sub:'sub-lens', lens:'mgmt',
   skill:'kpi-cascade-builder', stored:NONE, example:'',
   gist:'Follows a performance indicator down through the organisation: what the company steers on, what that becomes for the department, for the team, and for one person. Shows where the chain breaks, where a level invents its own measure, and where nothing arrives at all.',
   note:'The slot is reserved in methodology.json before the skill exists, so it is built into the contract rather than alongside it. Type and label are provisional; the id, the skill name, the artifactKind and the file path are not.'});
n({id:'wilo-analyser', label:'WILO Analysis', kind:'leaf', team:'diag', status:'env', sub:'sub-lens', lens:'mgmt',
   skill:'wilo-analyser', stored:NONE, example:'', gist:'Compares how a manager actually spends the week against what the role asks for: leading the team, doing the team’s work, meetings, admin. Shows the gap.'});
n({id:'data-maturity-builder', label:'Data Maturity', kind:'leaf', team:'diag', status:'live', sub:'sub-lens', lens:'data',
   skill:'data-maturity-builder', stored:DPLUG+' · skills/data-maturity-builder/', example:'',
   gist:'Scores the data points a team works on, not the team: can you get at it, is it structured, complete, right, current, and does anyone own it. Each one takes its weakest criterion, each process takes its weakest data point, so what the team hears is how much of its work AI can run on today and what it would take to unblock the rest.'});
n({id:'team-barometer-builder', label:'Team Barometer', kind:'leaf', team:'diag', status:'live', sub:'sub-lens', lens:'mind',
   skill:'team-barometer-builder', stored:DPLUG+' · skills/team-barometer-builder/', example:'examples/northwind-claims-mind__team-barometer.html',
   gist:'An anonymous survey of the team on work and role, atmosphere, workload, enablement and leadership. Everyone answers the same statements. The read-out shows the average, the share of positive answers and the spread per statement. It is what the team says, not what we judge.'});
n({id:'spans-and-layers', label:'Spans & Layers', kind:'leaf', team:'diag', status:'env', sub:'sub-lens', lens:'org',
   skill:'spans-and-layers', stored:NONE, example:'', gist:'Counts how many people each manager leads and how many management levels sit between the top of the scope and the front line. Compared with the org baseline and with what the work needs.'});
n({id:'raci-diagnostic-builder', label:'RACI Diagnostic', kind:'leaf', team:'diag', status:'live', sub:'sub-lens', lens:'org',
   skill:'raci-diagnostic-builder', stored:DPLUG+' \u00b7 skills/raci-diagnostic-builder/', example:'',
   gist:'Maps who is responsible, accountable, consulted and informed for every activity in an agreed process scope, across the roles that touch it. Filled in with the team in a workshop, on a board the consultant edits live. Flags the activities where nobody is accountable, where two people are, where nobody does the work, and where so many roles have to be consulted that nothing moves.',
   note:'It reads the organisation across roles, which is why it sits on the Organisation lens and not on Management Systems. Spans and Layers counts the structure vertically; this reads it horizontally.'});

n({id:'lma-builder', label:'Lean Maturity Scan', kind:'leaf', team:'diag', status:'build', sub:'sub-conclude', color:'#7C93BE',
   skill:'lma-builder', stored:NONE, example:'',
   gist:'Scores all six dimensions on their sub-axes, 1 to 5 per dimension. This is the only place a dimension score is set. The other analyses feed it with evidence.',
   note:'It does not overlap the verdict. methodology.json is explicit: authority = lma-scores-dimension.'});
n({id:'dimension-synthesis', label:'Dimension verdict', kind:'leaf', team:'diag', status:'live', sub:'sub-conclude', color:'#7C93BE',
   skill:'dimension-synthesis', stored:OPLUG+' · skills/dimension-synthesis/ (moving to diagnostic)', example:'',
   gist:'Writes the conclusion per dimension: what the score means in a few sentences, how confident we are given what was covered, and a flag when two analyses say different things.',
   note:'It does not compute the score — the Lean Maturity Scan does.'});
n({id:'inefficiency-register', label:'Pain Point Register', kind:'leaf', team:'diag', status:'build', sub:'sub-conclude', color:'#C79B5C',
   skill:'inefficiency-register-builder', stored:NONE, example:'',
   gist:'All quantified problems for a team in one list, across the six dimensions: what it is, where it happens, how it was measured, and what it costs.'});
n({id:'opportunity-register', label:'Opportunity Register', kind:'leaf', team:'diag', status:'live', sub:'sub-conclude', color:'#8FA8CE',
   skill:'ai-opportunity-heatmap', stored:OWN+' · ai-opportunity-heatmap/', example:'',
   gist:'All improvement opportunities for a team in one list, each with the lever it needs (AI acceleration, AI enhancement, standard automation or process redesign), the effort behind it today, and what it is worth. This is what goes to Design.',
   note:'The hand-off point to Design: the lever chosen here is what the future state has to deliver, and what Implementation later has to make real.'});

/* ── design ──────────────────────────────────────────────────────── */
n({id:'design-hub', label:'Design team', kind:'hub', team:'design', status:'live',
   cap:'vision → operating model',
   what:'Designs the future state. First the vision: where the operation is going and how the service will run. Then the operating model in detail, one component at a time: organisation, process, management systems, technology and data, and people.',
   note:'Design is how it should look on paper. Implementation is the same five components in practice — the two teams mirror each other lever for lever.',
   pack:'Standalone project skills — not yet packaged as a plugin'});

n({id:'ai-enabled-future-state', label:'Run the full package', kind:'leaf', team:'design', status:'live', sub:'design-hub', color:'#B487E8',
   skill:'ai-enabled-future-state', stored:OWN+' · ai-enabled-future-state/', example:'',
   gist:'Runs the five future-state visuals in one session: the North Star, the service blueprint, the human-agent model, the agent shortlist and the framework. Doing them together keeps them consistent.'});

n({id:'sub-vision', label:'Set the vision', kind:'sub', team:'design', status:'live', hub:'design-hub',
   what:'Stage one: where the operation is going and how the service will run to get there. The mission and vision plus the blueprint. The customer view sits here too, because the operating model has no customer component.'});
n({id:'sub-om', label:'Design the operating model', kind:'sub', team:'design', status:'env', hub:'design-hub',
   what:'Stage two: the operating model in detail, one component at a time. The five components match the diagnostic dimensions, so a finding leads straight to what has to change.'});

n({id:'north-star', label:'North Star & framework', kind:'leaf', team:'design', status:'live', sub:'sub-vision', color:'#B487E8',
   skill:'transformation-visuals-builder', stored:OWN+' · transformation-visuals-builder/', example:'',

n({id:'service-blueprint-design', label:'Service Blueprint', kind:'leaf', team:'design', status:'live', sub:'sub-vision', color:'#B487E8',
   skill:'service-blueprint-builder', stored:DPLUG+' · skills/service-blueprint-builder/', example:'',
   gist:'Shows how the work will run in the future state, in swimlanes: what the customer does, what happens front stage, what happens behind the scenes, which steps an agent takes over, and where a human decides.',

n({id:'om-org', label:'Organisation & roles', kind:'leaf', team:'design', status:'env', sub:'sub-om', lens:'org',
   skill:'om-organisation-designer', stored:NONE, example:'',
   gist:'Designs the target organisation: which teams, what each is accountable for, how many people per manager, how many layers, and how roles change once agents do part of the work.'});
n({id:'om-process', label:'Process & flow', kind:'leaf', team:'design', status:'env', sub:'sub-om', lens:'proc',
   skill:'om-process-designer', stored:NONE, example:'',
   gist:'Designs the new process: which steps go, which are automated, which are rebuilt, and what the end-to-end flow looks like next to the old one.'});
n({id:'om-mgmt', label:'Management systems', kind:'leaf', team:'design', status:'env', sub:'sub-om', lens:'mgmt',
   skill:'om-mgmt-designer', stored:NONE, example:'',

n({id:'om-tech', label:'Technology, tools & data', kind:'leaf', team:'design', status:'env', sub:'sub-om', lens:'data',
   skill:'om-tech-designer', stored:NONE, example:'',

n({id:'om-people', label:'People & skills', kind:'leaf', team:'design', status:'env', sub:'sub-om', lens:'mind',
   skill:'om-people-designer', stored:NONE, example:'',

   note:'Partly covered today: the human-agent model comes out of transformation-visuals-builder.'});

/* ── delivery ────────────────────────────────────────────────────── */
n({id:'deliv-hub', label:'Delivery team', kind:'hub', team:'deliv', status:'live',
   cap:'compose · check',
   what:'Builds the client communication that asks for a decision. The other teams produce their own analyses and visuals; Delivery turns them into one argument for the sponsor or the SteerCo, and checks the logic holds.',
   note:'Not the same job as Change. Delivery argues to the people who DECIDE, and its output is a decision. Change explains a decision already taken to the people who have to LIVE with it, and its output is behaviour. Different audience, different register, different craft — the storyline reviewer and the stakeholder map are not the same discipline.',
   pack:VPLUG+' 0.1.2'});

n({id:'sub-compose', label:'Compose the argument', kind:'sub', team:'deliv', status:'live', hub:'deliv-hub',
   what:'Four documents, one builder. The findings read-out, the SteerCo deck, the status update and the proposal each go to a different audience at a different moment, so each has its own storyline. The four stars below are those storylines, not four separate tools — html-slide-builder renders all of them.',
   note:'presentation-deck-builder is a second deck builder doing the same job as html-slide-builder. Same class of overlap as the two blueprints — they should converge.'});
n({id:'sub-check', label:'Check the logic', kind:'sub', team:'deliv', status:'live', hub:'deliv-hub',
   what:'Three checks before a deck goes out: does the story hold if you read only the titles, is every title a conclusion, and does each slide prove its own title.'});

n({id:'comm-reperta', label:'Findings read-out', kind:'leaf', team:'deliv', status:'live', sub:'sub-compose', color:'#4FC08D',
   skill:'html-slide-builder', stored:VPLUG+' · skills/html-slide-builder/', example:'',
   gist:'The read-out at the end of a quickscan: what we looked at, what we found, what it is worth in FTE and money, and what we recommend. The main deliverable.',

   note:'A storyline, not a separate tool: all four documents in this group are rendered by html-slide-builder. This one has its pattern written.'});
n({id:'comm-steerco', label:'SteerCo deck', kind:'leaf', team:'deliv', status:'build', sub:'sub-compose', color:'#4FC08D',
   skill:'html-slide-builder', stored:'Pattern in '+CPLUG+' · nr-deck-context', example:'',
   gist:'For the steering committee: where we stand against the plan, which decisions we need from them, and which risks need an answer. Short, and it asks rather than tells.',
   note:'In build means something different here than elsewhere on the map. The builder is live and you can produce this deck today — what is missing is the written storyline for this document type, so you compose the argument yourself rather than following a pattern.'});
n({id:'comm-status', label:'Status update', kind:'leaf', team:'deliv', status:'build', sub:'sub-compose', color:'#4FC08D',
   skill:'html-slide-builder', stored:'Pattern in '+CPLUG+' · nr-deck-context', example:'',
   gist:'The update between the big moments: what moved, what is blocked and who unblocks it, and what is next. Readable in two minutes without anyone presenting it.',
   note:'In build means something different here than elsewhere on the map. The builder is live and you can produce this update today — what is missing is the written storyline for this document type, so you compose the argument yourself rather than following a pattern.'});
n({id:'comm-proposal', label:'Proposal', kind:'leaf', team:'deliv', status:'live', sub:'sub-compose', color:'#4FC08D',
   skill:'html-slide-builder', stored:VPLUG+' · skills/html-slide-builder/', example:'',
   gist:'The document that wins the work: the client’s problem in their words, our approach, the team, the timing and the price.',
   note:'A storyline, not a separate tool: all four documents in this group are rendered by html-slide-builder. This one has its pattern written.'});

n({id:'storyline-reviewer', label:'Test the storyline', kind:'leaf', team:'deliv', status:'live', sub:'sub-check', color:'#4FC08D',
   skill:'storyline-reviewer', stored:VPLUG+' · skills/storyline-reviewer/', example:'',
   gist:'Reads only the titles, in order, and checks whether they tell the full story on their own: is a step missing, does the argument land.'});
n({id:'action-title-reviewer', label:'Sharpen the titles', kind:'leaf', team:'deliv', status:'live', sub:'sub-check', color:'#4FC08D',

n({id:'slide-content-reviewer', label:'Check each slide holds', kind:'leaf', team:'deliv', status:'live', sub:'sub-check', color:'#4FC08D',
   skill:'slide-content-reviewer', stored:VPLUG+' · skills/slide-content-reviewer/', example:'',

/* ── implementation ──────────────────────────────────────────────── */
n({id:'impl-hub', label:'Implementation team', kind:'hub', team:'impl', status:'env',
   cap:'levers → follow-up',
   what:'Makes the design real. It works through the same five components as the operating model, and then tracks whether they landed and whether the value came.',
   note:'Design is how it should look on paper; Implementation is how it looks in practice. Nothing here is built yet.',
   willHold:'Five lever implementations mirroring the operating model, plus roadmap and benefit tracking'});

n({id:'sub-levers', label:'Implement the levers', kind:'sub', team:'impl', status:'env', hub:'impl-hub',
   what:'One implementation per operating-model component, mirroring Design. Each keeps the colour of the dimension it came from, so a finding, its design and its implementation are the same colour throughout.'});
n({id:'sub-followup', label:'Follow up execution', kind:'sub', team:'impl', status:'env', hub:'impl-hub',
   what:'Did the levers land, in what order, and did the benefit come. Roadmap and benefit tracking are the same question at two levels.'});

n({id:'impl-org', label:'Organisation & roles', kind:'leaf', team:'impl', status:'env', sub:'sub-levers', lens:'org',

n({id:'impl-process', label:'Process & flow', kind:'leaf', team:'impl', status:'env', sub:'sub-levers', lens:'proc',
   skill:'impl-process', stored:NONE, example:'',
   gist:'Getting the new process into daily use: procedures, handovers, exception handling, and the switch from the old way without losing volume.'});
n({id:'impl-mgmt', label:'Management systems', kind:'leaf', team:'impl', status:'env', sub:'sub-levers', lens:'mgmt',
   skill:'impl-mgmt', stored:NONE, example:'',
   gist:'Getting the new KPIs, dialogues and capacity planning into daily use: the boards, the first cycles, and coaching the managers through them. This is what decides whether it sticks.'});
n({id:'impl-tech', label:'Technology, tools & data', kind:'leaf', team:'impl', status:'env', sub:'sub-levers', lens:'data',
   skill:'impl-tech', stored:NONE, example:'',
   gist:'Building and deploying the agents and tools from the design, with their guardrails and human checkpoints, plus the data work needed to make them reliable.'});
n({id:'impl-people', label:'People & skills', kind:'leaf', team:'impl', status:'env', sub:'sub-levers', lens:'mind',
   skill:'impl-people', stored:NONE, example:'',
   gist:'Reskilling the team, settling who does what between people and agents, and building the routines that make the new way normal.'});

n({id:'impl-roadmap', label:'Track the roadmap', kind:'leaf', team:'impl', status:'env', sub:'sub-followup', color:'#6FD3C6',
   skill:'impl-roadmap', stored:NONE, example:'',
   gist:'The plan over time: which waves run when, what depends on what, who owns what, and what is really finished.'});
n({id:'impl-benefit', label:'Track the benefit', kind:'leaf', team:'impl', status:'env', sub:'sub-followup', color:'#6FD3C6',

/* ── communication ───────────────────────────────────────────────── */
n({id:'comms-hub', label:'Change team', kind:'hub', team:'comms', status:'env',
   cap:'stakeholders · story · sessions',

n({id:'comms-map', label:'Map the stakeholders', kind:'leaf', team:'comms', status:'env', sub:'comms-hub', color:'#E8899E',

n({id:'comms-story', label:'Write the change story', kind:'leaf', team:'comms', status:'env', sub:'comms-hub', color:'#E8899E',
   skill:'change-narrative', stored:NONE, example:'',

n({id:'comms-drum', label:'Sustain the drumbeat', kind:'leaf', team:'comms', status:'env', sub:'comms-hub', color:'#E8899E',
   skill:'comms-plan', stored:NONE, example:'',
   gist:'The communication plan after the announcement: which channels, how often, who signs it, and how adoption is measured.'});

/* ── data substrate ──────────────────────────────────────────────── */
n({id:'engagement-context', label:'Engagement context', kind:'anchor', team:'dataL', status:'live',
   what:'Everything this engagement knows about itself: what was agreed and what is planned, what has been produced, what we have concluded and decided, and who the people are.',
   pack:'engagement.json · the engagement/2026.9 contract'});
n({id:'nr-methodology', label:'Methodology & instruments', kind:'anchor', team:'dataL', status:'live',
   what:'The NR method in a form the skills can read: the six dimensions, the outside-in scan, the re-engineering framework, the FTE rules and the deck standards. It also holds the list of every instrument and where it belongs.',
   note:'This is what makes the diagnostic groups exclusive, and where the four storyline patterns behind Delivery live.',
   pack:CPLUG+' 0.1.1 · data/methodology.json'});

/* ══ 2. LAYOUT ══════════════════════════════════════════════════════ */

var W=3640, H=1350;   /* the framing window. The store tier sits below it and is reached by opening an anchor, so the resting view is unchanged */
var XPAD=240;      /* left margin for the layer names */
var byId={}; N.forEach(function(d){ byId[d.id]=d; });

/* one execution rank: all six teams side by side. The canvas is wide, but
   level-of-detail keeps the zoomed-out view to teams only. */
var ROW  = {inter:118, orch:284, ring:424, team:600, sub:744, data:1250, src:1322};
var LROW = {a:834, b:992};

var FIXED = {
  'engagement-cockpit':[1760, ROW.inter],
  'engagement-manager':[1760, ROW.orch],

  'diag-hub'  :[594,  ROW.team],
  'design-hub':[1435, ROW.team],
  'deliv-hub' :[2050, ROW.team],
  'impl-hub'  :[2655, ROW.team],
  'comms-hub' :[3180, ROW.team],

  'evidence-capture'       :[404,  ROW.team],
  'ai-enabled-future-state':[1245, ROW.team],

  'sub-inventory':[200,  ROW.sub],
  'sub-lens'     :[572,  ROW.sub],
  'sub-conclude' :[1010, ROW.sub],
  'sub-vision'   :[1310, ROW.sub],
  'sub-om'       :[1560, ROW.sub],
  'sub-compose'  :[1900, ROW.sub],
  'sub-check'    :[2200, ROW.sub],
  'sub-levers'   :[2510, ROW.sub],
  'sub-followup' :[2800, ROW.sub],

  'engagement-context':[700,  ROW.data],
  'nr-methodology'    :[1500, ROW.data],
  'levers-usecases'   :[2300, ROW.data],
  'sector-market'     :[3140, ROW.data],
  'diagnostic-skill-builder':[1500, 1140]
};

var RINGORDER=['engagement-intake','hypothesis-tree','opex-advisor','exec-sum-synthesiser'];
(function(){
  var cx=1760, gap=280, k=RINGORDER.length;
  RINGORDER.forEach(function(id,i){
    if(byId[id]) FIXED[id]=[cx + (i-(k-1)/2)*gap, ROW.ring];
  });
})();

var SUBPOS = {
  'sub-inventory':{hub:'diag-hub'}, 'sub-lens':{hub:'diag-hub'}, 'sub-conclude':{hub:'diag-hub'},
  'sub-vision':{hub:'design-hub'}, 'sub-om':{hub:'design-hub'},
  'sub-compose':{hub:'deliv-hub'}, 'sub-check':{hub:'deliv-hub'},
  'sub-levers':{hub:'impl-hub'}, 'sub-followup':{hub:'impl-hub'}
};

var LEAFCFG = {};                /* every group is a column */
var groups={};
N.forEach(function(d){ if(d.kind==='leaf'){ (groups[d.sub]=groups[d.sub]||[]).push(d); } });

var LENSORDER=['proc','cust','mgmt','data','mind','org'];
/* column index and rank, not coordinates: the geometry is measured below */
var LENSSLOT={ proc:[0,'a'], cust:[1,'a'], mgmt:[2,'a'],
               data:[0,'b'], mind:[1,'b'], org:[2,'b'] };
var LENSGUT=60,        /* clear space between two dimension bands, the same everywhere */
    LENSMIDX=572;      /* the middle column sits under the group it hangs off */
var LENSCOLX=[];
var LENSGROUP=(function(){
  var by={}; (groups['sub-lens']||[]).forEach(function(d){ (by[d.lens]=by[d.lens]||[]).push(d); });
  return LENSORDER.filter(function(k){ return by[k]; }).map(function(k){ return {lens:k, items:by[k]}; });
})();
(function layoutLensGroups(){
  /* the band is drawn from g.x-24 to g.x+16+widest+14, so a column is 54 + its widest label */
  function bandW(g){
    var w=0; g.items.forEach(function(d){ w=Math.max(w, d.label.length*7.0); });
    return 54+w;
  }
  var colw=[0,0,0];
  LENSGROUP.forEach(function(g){ var c=LENSSLOT[g.lens][0]; colw[c]=Math.max(colw[c], bandW(g)); });

  /* pack outward from the middle column so the stem still lands on a column, and every
     pair of bands ends up the same distance apart whatever the labels say */
  var mid0 = LENSMIDX-24;
  LENSCOLX[1] = LENSMIDX;
  LENSCOLX[0] = (mid0 - LENSGUT - colw[0]) + 24;
  LENSCOLX[2] = (mid0 + colw[1] + LENSGUT) + 24;

  /* rank B clears the tallest column in rank A instead of sitting on a fixed line:
     band bottom + a gap + the height of the caption above the next band */
  var maxA=0;
  LENSGROUP.forEach(function(g){ if(LENSSLOT[g.lens][1]==='a') maxA=Math.max(maxA, g.items.length); });
  LROW.b = LROW.a + (maxA-1)*34 + 24 + 30 + 35;

  LENSGROUP.forEach(function(g){
    var slot=LENSSLOT[g.lens], x=LENSCOLX[slot[0]], y0=LROW[slot[1]];
    g.x=x; g.y=y0;
    g.items.forEach(function(d,i){
      d.x=x; d.y=y0 + i*34;
      d.ax=d.x; d.ay=d.y; d.parent='sub-lens'; d.side='r'; d.fixedPos=true;
    });
  });
})();

/* one column per group — rank A starts at LROW.a, rank B at COLB */
/* the baseline column clears the leftmost dimension band by the same gutter the bands keep
   between themselves. A lens group with one short label pulls its band left, and nothing else
   knew the baseline column was sitting there — the Process band ended up 4 units off the widest
   baseline label where every other gap on that row is LENSGUT. Only ever moves the column LEFT,
   and the caption in FIXED moves with it, so add a second Process instrument and it returns. */
var INVW=0; (groups['sub-inventory']||[]).forEach(function(d){ INVW=Math.max(INVW, d.label.length*7.0); });
var INVX=Math.min(200, (LENSCOLX[0]-24) - LENSGUT - 14 - INVW);
if(FIXED['sub-inventory']) FIXED['sub-inventory'][0]=INVX;

[['sub-inventory',INVX,LROW.a],['sub-conclude',1010,LROW.a],
 ['sub-vision',1310,LROW.a],['sub-om',1560,LROW.a],
 ['sub-compose',1900,LROW.a],['sub-check',2200,LROW.a],
 ['sub-levers',2510,LROW.a],['sub-followup',2800,LROW.a],
 ['comms-hub',3180,LROW.a]].forEach(function(c){
  (groups[c[0]]||[]).forEach(function(d,i){
    d.x=c[1]; d.y=c[2] + i*34;
    d.ax=d.x; d.ay=d.y; d.parent=c[0]; d.side='r'; d.fixedPos=true;
  });
});

/* one column of stores hanging under each anchor: the dots sit on a single spine,
   the names read outward, and the column mirrors at the right edge of the canvas */
var SRCSIDE={'sector-market':'l'};
(function layoutSources(){
  var by={};
  N.forEach(function(d){ if(d.kind==='src') (by[d.anchor]=by[d.anchor]||[]).push(d); });
  Object.keys(by).forEach(function(a){
    var p=FIXED[a]; if(!p) return;
    by[a].forEach(function(d,i){
      d.x=p[0]; d.y=ROW.src + i*32;
      d.ax=d.x; d.ay=d.y; d.parent=a; d.fixedPos=true;
      d.side=SRCSIDE[a]||'r';
    });
  });
})();

['evidence-capture','ai-enabled-future-state'].forEach(function(id){
  if(byId[id]){ byId[id].side='l'; byId[id].dock=true; }
});
N.forEach(function(d){
  if(d.kind==='src') return;
  if(FIXED[d.id]){ d.x=FIXED[d.id][0]; d.y=FIXED[d.id][1]; d.ax=d.x; d.ay=d.y;
                   if(d.kind==='leaf'){ d.fixedPos=true; if(!d.side) d.side='r'; if(!d.parent) d.parent=d.sub; } }
});

/* everything shifts right once, so the layer bands get a proper left gutter */
(function shift(){
  N.forEach(function(d){ d.x+=XPAD; d.ax+=XPAD; });
  if(typeof LENSGROUP!=='undefined') LENSGROUP.forEach(function(g){ g.x+=XPAD; });
  Object.keys(FIXED).forEach(function(k){ FIXED[k][0]+=XPAD; });
})();

(function relax(){
  var leaves=N.filter(function(d){return d.kind==='leaf' && !d.fixedPos;});
  var all=N.filter(function(d){return d.kind!=='anchor';});
  for(var it=0; it<130; it++){
    for(var i=0;i<leaves.length;i++){
      var a=leaves[i], fx=0, fy=0;
      for(var j=0;j<all.length;j++){
        var b=all[j]; if(b===a) continue;
        var dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy;
        var min = (b.kind==='leaf') ? 44 : 58;
        if(d2 < min*min && d2 > 0.01){
          var d=Math.sqrt(d2), push=(min-d)/d*0.5;
          fx+=dx*push; fy+=dy*push;
        }
      }
      fx += (a.ax-a.x)*0.24; fy += (a.ay-a.y)*0.24;
      a.x += fx*0.5; a.y += fy*0.5;
      a.x = Math.max(96, Math.min(W-96, a.x));
      a.y = Math.max(660, Math.min(1120, a.y));
    }
  }
  leaves.forEach(function(d){
    if(d.side==='l' && d.x < 220)   d.side='r';
    if(d.side==='r' && d.x > W-230) d.side='l';
  });
})();

/* ══ 3. EDGES ═══════════════════════════════════════════════════════ */
var EDGES=[];
function e(a,b,cls){ if(byId[a]&&byId[b]) EDGES.push({a:a,b:b,cls:cls||''}); }

e('engagement-cockpit','engagement-manager');
RINGORDER.forEach(function(id){ if(byId[id]) e('engagement-manager',id); });
['diag-hub','deliv-hub','design-hub','impl-hub','comms-hub'].forEach(function(h){ e('engagement-manager',h); });
Object.keys(SUBPOS).forEach(function(sb){ e(SUBPOS[sb].hub,sb); });
N.forEach(function(d){
  /* the dimension bands show membership on their own; edges through them only clutter */
  if(d.kind==='leaf' && d.sub && d.sub!=='sub-lens') e(d.sub,d.id);
});

N.forEach(function(d){ if(d.kind==='src' && d.anchor) e(d.anchor,d.id); });

/* meaningful flows across the tree, drawn faint, lit during the walkthrough */
e('sub-inventory','sub-lens','flow');
e('sub-lens','sub-conclude','flow');
e('sub-conclude','opex-advisor','flow');
e('opex-advisor','exec-sum-synthesiser','flow');
e('sub-conclude','design-hub','flow');
e('sub-vision','sub-om','flow');
e('sub-om','sub-levers','flow');
e('sub-levers','sub-followup','flow');
e('exec-sum-synthesiser','deliv-hub','flow');
e('comms-sessions','design-hub','flow');
e('comms-sessions','impl-hub','flow');

/* ══ 4. RENDER ══════════════════════════════════════════════════════ */
var svg=document.getElementById('map');
svg.setAttribute('viewBox','0 0 '+W+' '+H);      /* single source of truth: the layout */
var gStars=document.getElementById('lStars'),
    gReg=document.getElementById('lRegions'),
    gLayer=document.getElementById('lLayers'),
    gBand=document.getElementById('lBands'),
    gEdge=document.getElementById('lEdges'),
    gNode=document.getElementById('lNodes'),
    gLabel=document.getElementById('lLabels'),
    vp=document.getElementById('viewport');
var NS='http://www.w3.org/2000/svg';
function el(t,attrs){ var x=document.createElementNS(NS,t); for(var k in attrs) x.setAttribute(k,attrs[k]); return x; }

/* starfield — deterministic */
(function stars(){
  var s=20250904;
  function rnd(){ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }
  var f=document.createDocumentFragment();
  for(var i=0;i<150;i++){
    var c=el('circle',{cx:(rnd()*W).toFixed(1),cy:(rnd()*H).toFixed(1),r:(0.5+rnd()*1.5).toFixed(2),class:'star'});
    c.setAttribute('opacity',(0.12+rnd()*0.3).toFixed(2));
    f.appendChild(c);
  }
  gStars.appendChild(f);
})();

/* region labels */
var LAYERS=[
  {t:'Interaction',   s:'what the consultant touches',   y:ROW.inter, rule:190},
  {t:'Orchestration', s:'plans · dispatches · judges',   y:ROW.orch,  rule:466},
  {t:'Execution',     s:'the five teams doing the work', y:ROW.team,  rule:1164},
  {t:'Data',          s:'read by every team',            y:ROW.data,  rule:null}
];
var pinned=[];                       /* text that must keep its size when you zoom in */

LAYERS.forEach(function(L){
  if(L.rule) gLayer.appendChild(el('path',{d:'M44 '+L.rule+' H'+(W-44),class:'layeredge'}));
  var g=el('g',{}); g.__x=XPAD-40; g.__y=L.y;
  var t1=el('text',{x:0,y:0,'text-anchor':'end',class:'layername'}); t1.textContent=L.t;
  var t2=el('text',{x:0,y:17,'text-anchor':'end',class:'layersub'}); t2.textContent=L.s;
  g.appendChild(t1); g.appendChild(t2);
  gLayer.appendChild(g); pinned.push(g);
});

/* edges: parent-to-child as a soft vertical S, so the hierarchy reads top-down */
var edgeEls={};
EDGES.forEach(function(ed){
  var a=byId[ed.a], b=byId[ed.b], d;
  if(ed.cls==='flow'){
    var my=Math.max(a.y,b.y)+70;
    d='M'+a.x.toFixed(1)+' '+a.y.toFixed(1)+' Q'+((a.x+b.x)/2).toFixed(1)+' '+my.toFixed(1)+' '+b.x.toFixed(1)+' '+b.y.toFixed(1);
  }else if(a.kind==='hub' && b.y <= a.y+24){
    /* a utility docked beside its team: one short horizontal link */
    d='M'+a.x.toFixed(1)+' '+a.y.toFixed(1)+' H'+b.x.toFixed(1);
  }else if(a.kind==='hub'){
    /* orthogonal fan-out: down past the team caption, across, then straight down
       into the group. A vertical approach crosses a group name at one point
       instead of sweeping through the whole word. */
    /* the path starts BELOW the team name and its sub-line, never behind them */
    var sy=a.y+68, dx=b.x-a.x, dir=dx<0?-1:1, cr=Math.min(16,Math.abs(dx)/2);
    if(Math.abs(dx)<2){
      d='M'+a.x.toFixed(1)+' '+sy.toFixed(1)+' V'+b.y.toFixed(1);
    }else{
      d='M'+a.x.toFixed(1)+' '+(sy-cr).toFixed(1)+
        ' Q'+a.x.toFixed(1)+' '+sy.toFixed(1)+', '+(a.x+dir*cr).toFixed(1)+' '+sy.toFixed(1)+
        ' H'+(b.x-dir*cr).toFixed(1)+
        ' Q'+b.x.toFixed(1)+' '+sy.toFixed(1)+', '+b.x.toFixed(1)+' '+(sy+cr).toFixed(1)+
        ' V'+b.y.toFixed(1);
    }
  }else{
    var my2=(a.y+b.y)/2;
    d='M'+a.x.toFixed(1)+' '+a.y.toFixed(1)+
      ' C'+a.x.toFixed(1)+' '+my2.toFixed(1)+', '+b.x.toFixed(1)+' '+my2.toFixed(1)+', '+b.x.toFixed(1)+' '+b.y.toFixed(1);
  }
  var kb=byId[ed.b].kind;
  var depth = (kb==='leaf'||kb==='src') ? ' d2' : (kb==='sub' ? ' d1' : (kb==='ring' ? ' d0' : ''));
  var pth=el('path',{d:d,class:'edge '+ed.cls+(ed.cls?'':depth)});
  gEdge.appendChild(pth);
  edgeEls[ed.a+'|'+ed.b]=pth; ed.el=pth;
});

/* one stem from the lens sub-hub to the block of dimension bands */
(function lensStem(){
  var p=FIXED['sub-lens']; if(!p) return;
  var xs=[];
  LENSGROUP.forEach(function(g){ if(xs.indexOf(g.x)<0) xs.push(g.x); });
  if(!xs.length) return;
  xs.sort(function(a,b){ return a-b; });
  gEdge.appendChild(el('path',{d:'M'+p[0]+' '+(p[1]+14)+' V'+(LROW.a-46),class:'edge d2'}));
  gEdge.appendChild(el('path',{d:'M'+xs[0]+' '+(LROW.a-46)+' H'+xs[xs.length-1],class:'edge d2'}));
  xs.forEach(function(x){

  if(!xs.length) return;

var neighbours={}, kidsOf={}, parentOf={};
EDGES.forEach(function(ed){
  (neighbours[ed.a]=neighbours[ed.a]||[]).push(ed.b);
  (neighbours[ed.b]=neighbours[ed.b]||[]).push(ed.a);
});
/* the hierarchy comes from the model, not from what happens to be drawn — the
   dimension bands show membership without an edge, and they still belong */
function link(parent,child){
  if(!byId[parent]||!byId[child]) return;
  (kidsOf[parent]=kidsOf[parent]||[]).push(child);
  parentOf[child]=parent;
  if((neighbours[parent]||[]).indexOf(child)<0){
    (neighbours[parent]=neighbours[parent]||[]).push(child);
    (neighbours[child]=neighbours[child]||[]).push(parent);
  }
}
link('engagement-cockpit','engagement-manager');
RINGORDER.forEach(function(id){ link('engagement-manager',id); });
['diag-hub','design-hub','deliv-hub','impl-hub','comms-hub'].forEach(function(h){ link('engagement-manager',h); });
Object.keys(SUBPOS).forEach(function(sb){ link(SUBPOS[sb].hub, sb); });
N.forEach(function(d){ if(d.kind==='leaf' && d.sub) link(d.sub, d.id); });
N.forEach(function(d){ if(d.kind==='src' && d.anchor) link(d.anchor, d.id); });

/* what a star should show you when you open it: everything hanging off it, or —
   for something with nothing under it — the family it belongs to */
function focusSet(id){

    kids.forEach(function(c){
      set[c]=1;
      (kidsOf[c]||[]).forEach(function(g){ set[g]=1; });
    });
  }else{
    var p=parentOf[id];
    if(p){ set[p]=1; (kidsOf[p]||[]).forEach(function(sib){ set[sib]=1; }); }
  }

}

    mark(d,'peek', false);
    if(d.el) d.el.classList.remove('peek');
    mark(d,'faded', !ids[d.id]);
    mark(d,'reveal', !!ids[d.id]);          /* what you opened is visible at any zoom */

    ed.el.classList.toggle('hot',!!hot);
    ed.el.classList.toggle('dim',!hot);
  });
}
/* the SECTION a star belongs to. Pointing at one instrument should lift the whole
   group it sits in — its band, its siblings, the group name and the team above it —
   rather than only the star and whatever happens to touch it. */
var lensMembers={};
N.forEach(function(d){
  if(d.kind==='leaf' && d.lens && d.parent==='sub-lens')
    (lensMembers[d.lens]=lensMembers[d.lens]||[]).push(d.id);
});
var HUBS=['diag-hub','design-hub','deliv-hub','impl-hub','comms-hub'];

  var d=byId[id], set={};

  add(id);
  if(d.kind==='leaf'){
    if(d.parent==='sub-lens' && d.lens && lensMembers[d.lens]){
      lensMembers[d.lens].forEach(add); add('sub-lens'); add('diag-hub');
    }else{
      var p=d.sub; add(p); addKids(p);

    }

    addKids(id); add((SUBPOS[id]||{}).hub);
    if(id==='sub-lens') Object.keys(lensMembers).forEach(function(k){ lensMembers[k].forEach(add); });
  }else if(d.kind==='hub'){
    addKids(id);
    (kidsOf[id]||[]).forEach(addKids);
  }else if(d.kind==='ring'){

  }else if(d.kind==='core'){

  }else if(d.kind==='cockpit'){

/* A reveal cascades outward from the star you opened: groups first, then the

var staggerTimer=null;

    var t1=40+i*50; setDelay(byId[c], t1); last=Math.max(last,t1);

       force it back into view and turn the wide shot into spaghetti */
    mark(d,'softfade', !keep[d.id] && vis);
    /* but inside the section you are pointing at, bring the hidden stars up as bare
       dots: you see what is under the hood without the names arriving yet */
    var peek = !!keep[d.id] && !vis && d.id!==id;
    mark(d,'peek', peek);
    if(peek) anyPeek=true;
    if(peek && d.parent==='sub-lens') peeking=true;
  });
  gBand.classList.toggle('peek', peeking);
  peeking = anyPeek;
  EDGES.forEach(function(ed){
    var hot = !!(keep[ed.a] && keep[ed.b]) && !ed.cls;
    ed.el.classList.toggle('hot',hot);
    ed.el.classList.toggle('dim',!hot);
    /* while peeking, draw the links to the previewed stars too, so the shape of the
       team reads rather than a scatter of loose dots */
    ed.el.classList.toggle('peek', hot && peeking &&
      (byId[ed.b].el.classList.contains('peek') || byId[ed.a].el.classList.contains('peek')));
  });
  var d=byId[id];
  var lens = d.parent==='sub-lens' ? d.lens : null;
  /* the six dimension bands recede too, unless the lifted section is one of them
     or is the whole 'evidence per dimension' group */
  bandsLit(lens, !lens && !keep['sub-lens']);
}

var panel=document.getElementById('panel');
var sel=null, preFocus=null;
function select(id){
  var d=byId[id]; if(!d) return;
  if(!sel) preFocus={k:view.k,x:view.x,y:view.y};      /* so closing it steps back out */
  if(sel) mark(byId[sel],'sel',false);
  sel=id; mark(d,'sel',true);
  var fam=focusSet(id);
  gBand.classList.remove('peek');
  EDGES.forEach(function(ed){ ed.el.classList.remove('peek'); });
  stagger(id, fam);
  litSet(fam);
  bandsLit(d.parent==='sub-lens' ? d.lens : null);
  focusBox(fam);
  renderPanel(d);
  panel.classList.add('open');
  document.querySelector('.app').classList.add('panelopen');
  setPanelShift(true); apply(true);
}
function deselect(){
  var was=sel;
  clearDelays();
  if(sel){ mark(byId[sel],'sel',false); sel=null; }
  panel.classList.remove('open');
  document.querySelector('.app').classList.remove('panelopen');
  setPanelShift(false);
  if(!tour.on) highlight(null);
  if(was && preFocus){ view.k=preFocus.k; view.x=preFocus.x; view.y=preFocus.y; }
  preFocus=null;
  apply(true);
}
document.getElementById('panelClose').onclick=deselect;
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'){ if(closeExample()) return; if(tour.on) endTour(); else deselect(); }
  if(tour.on && ev.key==='ArrowRight') step(tour.i+1);
  if(tour.on && ev.key==='ArrowLeft')  step(tour.i-1);
});

var STATUS_LABEL={live:'Live today',build:'In build',env:'Envisioned'};
/* a store is not a tool: the question asked of it is whether anything can read it */
var SOURCE_LABEL={live:'Connected',build:'Being connected',env:'Not connected'};
function renderPanel(d){
  var st=document.getElementById('pStatus');
  st.className='pill '+d.status; st.textContent=(d.kind==='src'?SOURCE_LABEL:STATUS_LABEL)[d.status];
  document.getElementById('pTeam').textContent =
    TEAMS[d.team].name + (d.lens ? ' · ' + LENS[d.lens].label + ' lens' : '');
  document.getElementById('pTitle').textContent=d.label;
  var idl=document.getElementById('pId');
  idl.textContent = d.skill ? '' : ((d.kind==='leaf'||d.kind==='ring') ? d.id : (d.kind==='src' ? '' : (d.file||'')));
  idl.style.display = idl.textContent ? 'block' : 'none';

  var b=document.getElementById('pBody'); b.innerHTML='';
  function field(k,v,mono){
    var f=document.createElement('div'); f.className='field';
    var kk=document.createElement('span'); kk.className='k'; kk.textContent=k;
    var vv=document.createElement('span'); vv.className='v'+(mono?' mono':''); vv.textContent=v;
    f.appendChild(kk); f.appendChild(vv); b.appendChild(f);
  }
  function rule(){ b.appendChild(document.createElement('hr')); }
  function pathField(k,v){
    var f=document.createElement('div'); f.className='field';
    var kk=document.createElement('span'); kk.className='k'; kk.textContent=k;
    var row=document.createElement('span'); row.className='pathrow';
    var vv=document.createElement('span'); vv.className='v mono'; vv.textContent=v;
    var cp=document.createElement('button'); cp.className='copy'; cp.type='button';
    cp.textContent='copy'; cp.setAttribute('aria-label','Copy '+k+' path');
    cp.onclick=function(){ copyText(v, cp); };
    row.appendChild(vv); row.appendChild(cp);
    f.appendChild(kk); f.appendChild(row); b.appendChild(f);
  }

  /* a look at the document itself, not a summary of it */
  function skillPeek(d){
    var sk=SKILLS[d.skill];
    if(!sk){
      /* an envisioned star has no skill to look at; a live one that is missing is a real gap */
      if(d.status!=='env'){
        rule();
        field('A look at the skill', (d.stored||'').indexOf(NONE)>=0
          ? 'Not built yet, so there is no SKILL.md to show.'
          : 'Lives in the personal skill library, not in the marketplace, so there is no SKILL.md here to show.');
      }
      return;
    }
    rule();
    var f=document.createElement('div'); f.className='field';
    var kk=document.createElement('span'); kk.className='k'; kk.textContent='A look at the skill';
    f.appendChild(kk);

    var pk=document.createElement('div'); pk.className='peek';
    var pre=document.createElement('pre'); pre.textContent=sk.opening;
    pk.appendChild(pre); f.appendChild(pk);

    var foot=document.createElement('div'); foot.className='peekfoot';
    foot.textContent='top of SKILL.md · '+sk.lines+' lines in full';
    f.appendChild(foot);

    b.appendChild(f);
  }

  /* how you actually run it: install, have ready, say this */
  function startBlock(d){
    var st=START[d.id]; if(!st) return;
    rule();
    var f=document.createElement('div'); f.className='field';
    var kk=document.createElement('span'); kk.className='k'; kk.textContent='How to start it';
    f.appendChild(kk);

    var card=document.createElement('div'); card.className='sgd-card';
    function step(num,key,val){
      var r=document.createElement('div'); r.className='sgd-step';
      var nm=document.createElement('span'); nm.className='sgd-num'; nm.textContent=num;
      var bd=document.createElement('div'); bd.className='sgd-body';
      var sk=document.createElement('div'); sk.className='sgd-k'; sk.textContent=key;
      var sv=document.createElement('div'); sv.className='sgd-v'; sv.textContent=val;
      bd.appendChild(sk); bd.appendChild(sv);
      r.appendChild(nm); r.appendChild(bd); card.appendChild(r);
      return bd;
    }
    step('1','Install', installLine(d));
    step('2','Have ready', st.need);

    var say=document.createElement('div'); say.className='sgd-step';
    var n3=document.createElement('span'); n3.className='sgd-num'; n3.textContent='3';
    var b3=document.createElement('div'); b3.className='sgd-body';
    var k3=document.createElement('div'); k3.className='sgd-k'; k3.textContent='Say this';
    var q=document.createElement('div'); q.className='sgd-say'; q.textContent=st.say;
    var ft=document.createElement('div'); ft.className='sgd-foot';
    var cp=document.createElement('button'); cp.className='copy'; cp.type='button';
    cp.textContent='copy the prompt'; cp.setAttribute('aria-label','Copy the kick-off prompt');
    cp.onclick=function(){ copyText(st.say, cp); };
    ft.appendChild(cp);
    b3.appendChild(k3); b3.appendChild(q); b3.appendChild(ft);
    say.appendChild(n3); say.appendChild(b3); card.appendChild(say);

    f.appendChild(card); b.appendChild(f);
  }

  var p=document.createElement('p'); p.textContent=(d.gist||d.what||''); b.appendChild(p);

  if(d.kind==='src'){
    rule();
    if(d.status==='env') field('Where it would live', d.file, true);
    else pathField('Where it lives', d.file);
    if(d.readBy) field('Read by', d.readBy);
    if(d.note){ rule(); field('Worth knowing', d.note); }
    return;
  }

  if(d.skill){
    startBlock(d);
    /* diagnostic instrument: the skill behind the tool, where it lives, a worked example */
    rule();
    field('Skill', d.skill, true);
    if((d.stored||'').indexOf('/')>=0) pathField('Stored in', d.stored);
    else field('Stored in', d.stored, true);
    if(EXAMPLES[d.skill]){
      var f=document.createElement('div'); f.className='field';
      var kk=document.createElement('span'); kk.className='k'; kk.textContent='Worked example';
      var btn=document.createElement('button'); btn.className='exbtn'; btn.type='button';
      btn.innerHTML='Open the example <span class="arw">▸</span>';
      btn.onclick=function(){ openExample(d.skill, d.label, d.example); };
      var pth=document.createElement('span'); pth.className='v mono'; pth.style.marginTop='6px';
      pth.textContent=d.example||'';
      f.appendChild(kk); f.appendChild(btn); if(d.example) f.appendChild(pth);
      b.appendChild(f);
    }
    else if(d.example) pathField('Example', d.example);
    else field('Worked example', d.status==='live' ? 'None on file yet' : 'Nothing to show — not built yet');
    skillPeek(d);
    if(d.reads||d.writes){
      rule();
      if(d.reads)  field('Reads',  d.reads,  true);
      if(d.writes) field('Writes', d.writes, true);
    }
    if(d.gist && d.what && d.what!==d.gist){ rule(); field('In more detail', d.what); }
    if(d.note) field('Worth knowing', d.note);
    return;
  }

  if(d.kind==='anchor'){
    var mine=N.filter(function(x){ return x.kind==='src' && x.anchor===d.id; });
    if(mine.length){
      var c={live:0,build:0,env:0};
      mine.forEach(function(x){ c[x.status]++; });
      var parts=[];
      if(c.live)  parts.push(c.live+' connected');
      if(c.build) parts.push(c.build+' being connected');
      if(c.env)   parts.push(c.env+' not connected');
      rule(); field('Sources', parts.join(' · '));
    }
  }

  if(d.willHold){ rule(); field('What would live here', d.willHold); }
  if(d.note){ rule(); field('Worth knowing', d.note); }
  if(d.reads||d.writes){
    rule();
    if(d.reads)  field('Reads',  d.reads,  true);
    if(d.writes) field('Writes', d.writes, true);
  }
  if(d.pack){ rule(); field('Packaged in', d.pack, true); }
}

function copyText(t, btn){
  var done=function(){ var o=btn.textContent; btn.textContent='copied'; btn.classList.add('ok');
    setTimeout(function(){ btn.textContent=o; btn.classList.remove('ok'); },1400); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done,function(){ fallback(); });
  } else { fallback(); }
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); done(); }catch(e){}
    document.body.removeChild(ta);
  }
}

var tour={on:false,i:0};
var tourEl=document.getElementById('tour');
var dotsEl=document.getElementById('tDots');
STEPS.forEach(function(){ dotsEl.appendChild(document.createElement('i')); });

function step(i){
  if(i<0) i=0;
  if(i>=STEPS.length) { endTour(); return; }
  tour.i=i;
  var s=STEPS[i];
  document.getElementById('tStep').textContent=('0'+(i+1)).slice(-2)+' / '+('0'+STEPS.length).slice(-2);
  document.getElementById('tTitle').textContent=s.t;
  document.getElementById('tDesc').textContent=s.d;
  Array.prototype.forEach.call(dotsEl.children,function(dot,j){ dot.classList.toggle('on',j===i); });
  document.getElementById('tNext').textContent = (i===STEPS.length-1) ? 'Finish' : 'Next';

  var lit={}; s.nodes.forEach(function(id){ lit[id]=1; });
  svg.classList.remove('lod2r');
  var xs=[],ys=[];
  N.forEach(function(d){
    var on=!!lit[d.id];
    mark(d,'faded',!on);
    mark(d,'tourlit',on);
    mark(d,'reveal',on);
    if(on && d.parent==='sub-lens') svg.classList.add('lod2r');
    if(on){ xs.push(d.x); ys.push(d.y); }
  });
  EDGES.forEach(function(ed){
    var hot = lit[ed.a] && lit[ed.b];
    ed.el.classList.toggle('hot',!!hot);
    ed.el.classList.toggle('dim',!hot);
  });
  if(xs.length){
    var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
    var y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
    var pad=170;
    var k=Math.min(W/(x1-x0+pad*2), H/(y1-y0+pad*2));
    k=Math.max(0.95, Math.min(s.k, k));
    focusOn((x0+x1)/2,(y0+y1)/2,k);
  }
}
function startTour(){
  tour.on=true; deselect(); tourEl.classList.add('on');
  step(0);
}
function endTour(){
  tour.on=false; tourEl.classList.remove('on');
  N.forEach(function(d){ mark(d,'faded',false); mark(d,'tourlit',false); mark(d,'reveal',false); });
  svg.classList.remove('lod2r');
  EDGES.forEach(function(ed){ ed.el.classList.remove('hot','dim'); });
  applyFilter(); fit();
}
(function focusMode(){
  addEventListener('keydown',function(e){ if(e.key==='Tab') document.body.classList.add('kbd'); },true);
  addEventListener('pointerdown',function(){ document.body.classList.remove('kbd'); },true);
})();

(function railFold(){
  var app=document.querySelector('.app'), btn=document.getElementById('railToggle');
  btn.onclick=function(){
    var hidden=app.classList.toggle('norail');
    btn.setAttribute('aria-expanded', String(!hidden));
    btn.setAttribute('aria-label', hidden ? 'Show the sidebar' : 'Hide the sidebar');
    setTimeout(function(){ measureContent(); if(!sel && !tour.on) fit(true); }, 330);
  };
})();

document.getElementById('tourStart').onclick=startTour;
document.getElementById('tNext').onclick=function(){ step(tour.i+1); };
document.getElementById('tPrev').onclick=function(){ step(tour.i-1); };
document.getElementById('tExit').onclick=endTour;
