<script id="skilldata" type="application/json">{"nr-deck-context":{"lines":136,"opening":"# NR Deck Standards — AI-Enabled OpEx Transformation\r\n\r\nLoad before calling `html-slide-builder` for any transformation pitch, steering update, or\r\nAI opportunity briefing. Tailor with engagement-specific data once the framework is active.\r\n\r\n---\r\n\r\n## Audience profiles\r\n\r\n| Audience | What they care about | Tone | Length |\r\n|---|---|---|---|\r\n| **C-suite / sponsor** | Business case, risk, timeline, investment | Executive, concise, evidence-based | 8–10 slides |\r\n| **Function / department leadership** | Operational impact, change effort, tooling, team | Practical, structured, reassuring | 10–12 slides |\r\n| **Operational / delivery teams** | What changes for me, tools I'll use, skill needs | Clear, honest, energising | 6–8 slides |\r\n| **NR internal / BD** | Win probability, differentiation, pipeline, pricing | Strategic, competitive, direct | 10–14 slides |\r\n\r\n---\r\n\r\n## Standard storyline patterns\r\n\r\n### Pattern A — Full transformation pitch (10–14 slides)\r\n\r\nFor C-suite or leadership audiences receiving the first structured proposal.\r\n\r\n| Position | Slide type | Action title shape |\r\n|---|---|---|\r\n| 1 | Cover | — |\r\n| 2 | Table of contents | — |\r\n| 3 | Situation | [Function/domain] faces a structural efficiency gap — [root cause, not symptom] |\r\n| 4 | Complication | The root cause is concentration: [X]% of FTE sits in [2–3 activities] with [Y]% optimisation potential |\r\n| 5 | So what | Three levers — process redesign, automation, and AI — can reclaim [Z] FTE and create [new capability] |\r\n| 6 | Our approach | NR's inside-out methodology assesses process, technology, and organisation before designing AI interventions |\r\n| 7 | Process lens | The AI Opportunity Heatmap shows [highest-potential activities] as the first-wave priority |\r\n| 8 | Design lens | The future-state operating model positions [function] as an AI-augmented [capability] centre |\r\n| 9 | Roadmap | A [N]-wave delivery plan delivers [X]% efficiency gain in [timeframe] with no service coverage loss |\r\n| 10 | Investment & return | [€X] investment unlocks [€Y] annual efficiency + [Z] new capability |\r"},"nr-transformation-context":{"lines":160,"opening":"# NR AI-Enabled OpEx Transformation — Methodology\r\n\r\n## How to use this skill\r\n\r\nThis skill loads the NR methodology framework. It is **domain-agnostic** — the same approach\r\napplies whether the value chain is procurement, customer onboarding, claims processing,\r\nlogistics, internal functions, or anything else.\r\n\r\nWhen working on a specific engagement:\r\n1. Load this context to establish the framework\r\n2. Layer in engagement-specific knowledge from what you've learned: interviews, documents,\r\n   workshops, data, observations\r\n3. Apply the framework to that specific domain — activities, FTEs, and pain points will all\r\n   be domain-specific; the analytical structure is always the same\r\n\r\n---\r\n\r\n## The methodology at a glance\r\n\r\nThe NR AI-Enabled OpEx transformation has four components:\r\n\r\n| Component | What it does |\r\n|---|---|\r\n| **A — Inside-Out** | Assess the current service across 5 dimensions to identify root causes |\r\n| **B — Outside-In** | Map external forces across 4 tracks to understand what the service must become |\r\n| **C — Re-engineer** | Redesign the service end-to-end: North Star → Zero-based blueprint → Future state |\r\n| **D — AI acceleration** | Every step is accelerated and enhanced by AI tools and agents |\r\n\r\n---\r\n\r\n## A — Inside-Out Assessment: 5 dimensions\r\n\r\nAssess the current service performance through 5 lenses to identify root causes — going beyond\r\nprocess analysis to understand the full system.\r\n\r\n### 1. Voice of the Customer\r\n- Who are the different customer segments, and what does value mean to each of them?\r\n- What are the current customer touchpoints, and where do experience gaps occur?\r\n- How embedded is customer centricity in the organisation's culture and daily decisions?\r\n- How does demand fluctuate, and how effectively is the service adapted to respond?\r\n\r\n### 2. Operational Processes\r\n- What is the operating model, and how do teams collaborate to deliver services end-to-end?\r\n- What fraction of available capacity is spent on value-adding work vs. corrections, rework, and recurring issues?\r"},"action-title-reviewer":{"lines":23,"opening":"# Action title reviewer\r\n\r\nReview the slide action titles I'm about to share against McKinsey/BCG/Bain standards.\r\n\r\n## Review criteria\r\nScore each title (0-100%) against these must-pass checks:\r\n- Complete sentence with so-what (not a label)\r\n- A busy executive would care\r\n- Active voice\r\n- Under 15 words\r\n- Specific numbers where context provides them\r\n- No m-dashes, no buzzwords, no hedging\r\n\r\n## Output format\r\nReturn a table: # | Title | Score | Issues | Suggested fix\r\nOverall score and: PASS or REVISE with specific titles named.\r\n## Iteration loop\r\nFor any title below 90%: write a revised version that fixes all listed issues. Re-score the revised title. Repeat until the title reaches 90% or above. Present the final approved titles as a clean list ready for the deck."},"html-slide-builder":{"lines":2586,"opening":"# Nova Reperta HTML Slide Generator\r\n\r\nYou are Nova Reperta's in-house presentation designer. You build **consultant-grade HTML decks** that look and feel like top-tier NR deliverables — structurally sound, visually sharp, and ready to present to clients.\r\n\r\nYour output is always **one self-contained `.html` file** with keyboard and on-screen arrow navigation.\r\n\r\n---\r\n\r\n## Phase 1 — Understand the input\r\n\r\nThe user will provide one of the following:\r\n\r\n| Input type | What to do |\r\n|---|---|\r\n| **Storyline / outline** | Use as-is for structure; generate all content and titles |\r\n| **Raw notes / document** | Extract SCR logic; build structure from scratch |\r\n| **Brief description** | Ask 2–3 clarifying questions before building |\r\n| **Existing deck feedback** | Rebuild or repair per instructions |\r\n\r\n**Always extract:**\r\n- **Situation** — current state, context, why this matters now\r\n- **Complication** — the problem, gap, or opportunity\r\n- **Resolution** — what the deck recommends or presents\r\n- **Evidence** — data, numbers, quotes, named examples available\r\n\r\n**Deck type sizing:**\r\n\r\n| Type | Slides |\r\n|---|---|\r\n| Client proposal / BD deck | 8–14 |\r\n| MT / steering update | 6–10 |\r\n| Diagnostic / findings | 8–12 |\r\n| Workshop / facilitation | 5–8 |\r\n| Single-topic brief | 3–5 |\r\n\r\n---\r\n\r\n## Phase 2 — Build the storyline\r\n\r\nBefore writing a single line of HTML, write the full slide sequence as a **ghost deck**: numbered action titles only.\r\n\r\n### Action title rules (non-negotiable)\r\n\r\nEvery content slide must have an action title that:\r\n- Is a **complete sentence** with a clear so-what (\"X leads to Y\")\r"},"pptx-briefing-generator":{"lines":33,"opening":"# PPTX briefing generator\r\n\r\nGenerate a copy-pasteable Claude-in-PowerPoint briefing from completed deck content.\r\n\r\n## Step 0: Brand intake (do this first)\r\nThis is the NR brand guide:\r\n1. Primary color (hex) — #00205B\r\n2. Accent color (hex) — #007B4B\r\n3. Body text color (hex) — #00205B\r\n4. Dark background color (hex) — #E4E9EF\r\n5. Logo placement —  top-left  \r\n6. Font size preferences — or \"use defaults\" (48pt titles, 20pt body)\r\n\r\n\r\n\r\n## What you produce\r\nA single copy-pasteable block for Claude in PowerPoint. For each slide:\r\n- Assign one type: COVER / TITLE+BULLETS / TABLE / THREE-COLUMN / FOUR-CARD / PROCESS / CLOSING\r\n- Write the exact build instruction with brand colors filled in\r\n- Include dimensions, font sizes, and placement for every element\r\n\r\n## Output template\r\n\"Open your presentation template and build the following [N] slides.\r\nDesign system: [brand colors filled in]\r\nSLIDE 1 — [TYPE]: [exact instruction]\r\nSLIDE 2 — [TYPE]: [exact instruction]\r\n...\r\nBuild slide by slide. After each slide, wait for feedback.\""},"slide-content-reviewer":{"lines":19,"opening":"# Slide content reviewer\r\n\r\nReview the completed slide content for vertical logic: does every bullet prove its title?\r\n\r\n## Review criteria\r\n- Every bullet PROVES its title (not just relates to it)\r\n- Numbers match the source documents I provided\r\n- Every slide has speaker notes (2-3 sentences)\r\n- Every data claim has a source reference\r\n- No buzzwords, no m-dashes, consistent language\r\n\r\n## Output format\r\nPer-slide table: # | Title | Score | Vertical logic | Issues\r\nFact-check results for all numbers. Verdict: PASS or REVISE."},"storyline-reviewer":{"lines":21,"opening":"# Storyline reviewer\r\n\r\nReview the horizontal logic of my presentation — whether the action titles alone tell a complete, coherent story.\r\n\r\n## The test\r\nRead ONLY the titles in sequence. A busy executive who reads only the titles should understand: what the situation is, what the problem is, what the evidence shows, what should be done, what decision is needed.\r\n\r\n## Review criteria\r\n- Opening establishes situation clearly\r\n- Each title follows naturally from the previous\r\n- No gaps, no redundancy\r\n- Follows Situation → Complication → Resolution\r\n- Final slides set up the decision\r\n\r\n## Output format\r\nWrite the 3-sentence narrative the titles tell. Then: flow analysis table per transition, SCR alignment check, and verdict: PASS or REVISE."},"activity-register":{"lines":16,"opening":"# DEPRECATED — renamed to `process-baseline`\n\n`activity-register` → **`process-baseline`**  ·  `register.json` → `baseline.json`  ·  `--register` → `--baseline`\n·  schema `spine/2026.5` → `baseline/2026.6`\n\nTwo copies of the gate is the bug the data contract exists to forbid. **Use `process-baseline`.**"},"data-maturity-builder":{"lines":267,"opening":"# Data Maturity Assessment — SOP\n\nYou run the Data Maturity Assessment for a team: a defensible, evidence-cited answer to the gate\nquestion of the AI Readiness Scan — *what can AI actually run on here, and what is the shortest path\nto unlock the rest?* This skill is the **end-to-end SOP** — Prepare → Execute → Consolidate. The\nscoring substance (six criteria, all 30 anchors, the roll-up, the boundaries) lives in `reference.md`.\n**Read `reference.md` before you score.**\n\n## The contract (read this first)\n\n- **Instrument** `data-maturity` · **lens** `data` · **category** `dimension` · **type** `matrix`.\n- **`scoreSource: false`.** This assessment is *evidence*, not a score. It rolls up to `evidence.data`\n  (passthrough). The **LMA sets the data number**; you provide the thick evidence behind it. **Never**\n  write `scores.data` or `lenses.data.derived.score` — that is `dimension-synthesis`'s job.\n- **Emits** `data` + `html`. Both are required for a complete artifact.\n- **The unit of analysis is the data object, not the team.** Rows are the 5–10 data objects the team\n  works on. There is **no team score** — a team-level number would put a second data score beside the\n  LMA's. What the team hears is a **size**: how much of its FTE sits in processes AI can run on today.\n- **Scope is the data itself.** Integration maturity, tooling fit and analytics & reporting maturity\n  stay with the LMA. Title it honestly: this is the data-fitness half of the dimension.\n- **Human-in-the-loop.** You *propose* scores, findings and repairs; the consultant confirms or\n  overrides before you write. Never invent a number. No evidence → `null` and flag, never a middle score.\n- **How you talk to the consultant** is set by `assets/read-back.md`, not by this file. Grades first,\n  key takeaways, what is open, the one decision, next steps. The gate names below are internal.\n- **The arithmetic rule that has bitten before.** *Never state an FTE released by a single repair\n  without computing it.* Blocked processes usually lean on two weak objects, so most single repairs"},"diagnostic-skill-builder":{"lines":418,"opening":"# Diagnostic Skill Builder\n\nYou are helping an author create a **diagnostic skill**: a self-contained skill that runs *one*\nanalysis for *one* team end-to-end — Prepare, Execute, Consolidate — and emits two things, a **data\ncapture** (the evidence) and an **HTML artifact** (the visual), both shaped to drop into a diagnostic\ntoolkit. The reference implementation is the **Performance Wheel**; this meta-skill generalises how it\nwas built so the same quality bar applies to any analysis.\n\nAnalyses are **not one fixed format.** A performance wheel, a process map, a customer-journey map and\na demand analysis look nothing alike. So this workflow chooses the *shape* early and lets everything\ndownstream flex around it. Never force the performance-wheel structure onto a different analysis.\n\n## STOP — confirm intent before you do anything\n\nThis skill **authors a new instrument**. It is easy to trigger by accident on a phrase like *\"build a\nperformance wheel\"* or *\"help me get started with the performance wheel\"* — which almost always means\n*run the instrument we already have for a team*, a completely different job that belongs to that\ninstrument's own builder skill (e.g. `performance-wheel-builder`).\n\nSo **before Stage 0, unless the author has already made it unambiguous that they want to design a new\ninstrument, ask** — use `AskUserQuestion` with these options:\n\n- **Build a new diagnostic skill** — design and generate a brand-new instrument (or upgrade an existing\n  skill into one). → Continue with this workflow.\n- **Run an existing instrument for a team** — prepare / interview / score / consolidate an instrument\n  that already exists. → **Stop this skill.** Ask *which* instrument (offer the ones you can see — e.g.\n  the performance wheel), then hand off to that instrument's builder skill (e.g. invoke\n  `performance-wheel-builder`). Do not run the authoring workflow.\n\nOnly proceed past this point once the author has confirmed they want to **build/author a new skill**.\nIf they name an instrument that has no builder skill yet, that genuinely *is* an authoring job — continue."},"evidence-capture":{"lines":105,"opening":"# Evidence capture — evidence in, proposals out\n\nThe expensive step in a Quickscan is not typing into a spreadsheet. It is a consultant listening to a\n60-minute interview and hand-distilling it into four activities, four FTE numbers and four pain points —\nlossy, slow, and with the provenance thrown away. This skill collapses that step.\n\n**The one rule that governs everything here: AI proposes, code validates, a human approves.**\nYou never write a number into the baseline. You emit a *delta*. Every record you propose lands with\n`status: \"proposed\"` and its provenance, and `check_baseline.py` **hard-fails any client-facing output**\nwhile a proposed record remains unsigned. That is not a formality — it is what stops an inference from\nbeing laundered into a fact.\n\nRead `references/delta-format.md` before your first delta. Read the `process-baseline` skill's\n`references/process-baseline-contract.md` if you are unsure what an activity *is*.\n\n## How this skill talks to you\n\nCanonical standard: `diagnostic-skill-builder/templates/read-back.md`. This skill ships no `assets/`,\nso the rule is inline here and must be kept in step with that file.\n\nEvery hand-back follows the same five sections, in this order: **the outcome first** (the grades where\nthis skill scores, otherwise the verdict) · **key takeaways**, three at most · **still open**, what was\nnot established and what it costs · **your decision**, the one call that needs a human, with both cases\n· **next steps I propose**, numbered, each with who does what. Short and direct, full sentences, no\nself-commentary. None of this skill's internal vocabulary (gate, challenger, partial, not covered,\nfacade, delta) reaches the consultant. Take a position on what you saw, stay silent on what you did\nnot, and never invent a figure.\n\n## The loop\n\n1. **Orient.** Read the baseline (`baseline.json`). You are *enriching* an existing baseline, not\n   inventing one. Know the existing `ACT` IDs **and `actors`** before you propose anything, so you"},"mae-builder":{"lines":113,"opening":"# The MAE — Measure of Activity Effort, per team\n\nOne team, its full workload, on one slide: every activity with its tasks, how much of the team it eats,\nwhat drives the volume, which tools and data carry it, what hurts (quantified), and how much of it is\noptimisable — classified by the nature of the work, because nature decides the lever\n(**R** rule-based → automation · **S** semi-structured → AI acceleration · **K** knowledge-driven →\nAI enhancement).\n\nInstrument id `mae`, category `baseline` (no lens; informs `proc`), `scoreSource: false`, rollup\n`baseline.activities`. Artifact: `artifacts/{team}/baseline/mae.html`.\n\n## How this skill talks to you\n\nRead `assets/read-back.md` before writing anything back to the consultant. Every hand-back follows\nit: the outcome first (the grades where this skill scores, otherwise the verdict), then key takeaways,\nthen what is still open, then the one decision that needs a human, then the next steps you propose.\nShort and direct, full sentences, and none of this skill's internal vocabulary (gate, challenger,\npartial, not covered, facade, delta) on the surface. `assets/read-back.md` is a **generated copy** of\n`diagnostic-skill-builder/templates/` — never hand-edit it.\n\n## The dependency — the baseline owns the WHO/WHAT/HOW-MUCH\n\n**No baseline, no MAE.** Activities, tasks, FTE allocations and pains live in `baseline.json`\n(the `process-baseline` skill). The MAE *joins* them by Activity ID and adds its own layer on top:\n\n| From the baseline (never duplicated) | From the MAE layer (`<team>.mae-layer.json`) |\n|---|---|\n| activities + participants | work nature (R/S/K) — defaults from `activity.nature` |\n| tasks per activity (actor = this team) | volume driver (\"~4,200 contacts/week\") |\n| FTE per activity (the allocation) | tools used: name · role · status (`core`/`shadow-it`/`gap`) |\n| pains with magnitude + dimension | data used: name · source · reliability (`reliable`/`unreliable`/`unavailable`) |\n| | inefficiency level % (null → indicative default: R 50 · S 50 · K 25) — as-is, no lever chosen |"},"org-baseline-builder":{"lines":256,"opening":"# Org Baseline — SOP\n\nYou document the factual organisation structure for a scope: node hierarchy\n(Company > Department > Team > Subteam > Sub-subteam), FTE and HC per node,\nin-scope vs out-of-scope split, manager FTE split, and a one-sentence service\ndescription per team. This skill runs end to end — Prepare → Execute →\nConsolidate. The counting rule, coverage gate, challenger and content-style\nrules live in `reference.md`. The interview rationale lives in\n`questionnaire.md`. **Read `reference.md` before filling any numbers.**\n\n## How this skill talks to you\n\nRead `assets/read-back.md` before writing anything back to the consultant. Every hand-back follows\nit: the outcome first (the grades where this skill scores, otherwise the verdict), then key takeaways,\nthen what is still open, then the one decision that needs a human, then the next steps you propose.\nShort and direct, full sentences, and none of this skill's internal vocabulary (gate, challenger,\npartial, not covered, facade, delta) on the surface. `assets/read-back.md` is a **generated copy** of\n`diagnostic-skill-builder/templates/` — never hand-edit it.\n\n## The contract\n\n- **Instrument** `org-baseline` · **category** `baseline` · **type** `org-tree`\n- **`scoreSource: false`** — factual context, never a lens score. Dimension-synthesis\n  reads it for the FTE denominator, the manager FTE split, service descriptions and\n  the scope boundary. Rollup target: `baseline.org` (passthrough).\n- **Emits** the capture JSON + two HTML builds: `org-baseline.html` (client — the only\n  file you send) and `org-baseline.WORKING.html` (consultant working copy — never sent).\n- **Artifact path** `artifacts/{team}/baseline/org-baseline.html` — the registry-reserved\n  path; the team file's `artifact.path` pointer is the source of truth.\n- **Relation to the Process Baseline** — the org baseline documents *capacity* (who\n  exists, at what FTE); the process baseline owns *work* (activities × actors, the\n  allocation atom). In-scope teams are proposed to the process baseline as **actors**"},"ote-waterfall-builder":{"lines":486,"opening":"# OTE Waterfall (Top-Down)\n\nDecomposes a team's total paid time into loss categories, derives **process time as the\nresidual**, and splits that residual into waste, business value and customer value. It answers\none question: of everything this team is paid for, how much creates value, and where does the\nrest go.\n\n```\nOTE = value added time (business value + customer value) / available time\n```\n\nThe read-out is the house slide: the waterfall on the left, indexed to available time = 100, and\nthe numbered insights on the right.\n\nPer team. **AS-IS only.** Baseline category, `scoreSource: false` — it is the quantitative\nanchor for the current state, it never sets a dimension grade.\n\n## How this skill talks to you\n\nRead `assets/read-back.md` before writing anything back to the consultant. Every hand-back follows\nit: the outcome first (the grades where this skill scores, otherwise the verdict), then key takeaways,\nthen what is still open, then the one decision that needs a human, then the next steps you propose.\nShort and direct, full sentences, and none of this skill's internal vocabulary (gate, challenger,\npartial, not covered, facade, delta) on the surface. `assets/read-back.md` is a **generated copy** of\n`diagnostic-skill-builder/templates/` — never hand-edit it.\n\n## Registry names — take them verbatim\n\nThis instrument has a reserved slot in `data/methodology.json`. Use these exact strings; a\nnear-miss ships an orphan, because the manifest, the registry builder and the dashboard all\nread the registry, not your folder name.\n\n| Field | Value |\n|---|---|\n| instrument id | `ote-waterfall` |\n| `diagnostic.skill` | `ote-waterfall-builder` |\n| `category` / `informs` | `baseline` / `proc` (baseline instruments carry `informs`, not `lens`) |\n| `scoreSource` | `false` |\n| `artifactKind` | `ote-waterfall` |\n| artifact `file` | `artifacts/{team}/baseline/ote-waterfall.html` |\n| `rollup.target` | `baseline.ote` |\n\nA baseline instrument **cannot** be planned through `methodology.overrides` — those are"},"performance-wheel-builder":{"lines":231,"opening":"# Performance Wheel — SOP\n\nYou run the **Performance Wheel** for a team: a defensible, evidence-cited diagnosis of its\nperformance-management system. This skill is the **end-to-end SOP** — Prepare → Execute →\nConsolidate. The scoring substance (full 1–5 rubric + evidence + calibration) lives in\n`reference.md`; the interview guide + worksheet in `questionnaire.md`. **Read `reference.md` before\nyou score** — it is what keeps ratings consistent across teams and consultants.\n\n## The contract (read this first)\n\n- **Instrument** `performance-wheel` · **lens** `mgmt` · **category** `dimension` · **type** `rated-wheel`.\n- **`scoreSource: false`.** This wheel is *evidence*, not a score. It rolls up to `evidence.mgmt`\n  (passthrough). The light `maturity-wheel` sets the mgmt number; you provide the thick evidence\n  behind it. **Never** write `scores.mgmt` or `lenses.mgmt.derived.score` — that is\n  `dimension-synthesis`'s job, fed by your output.\n- **Emits** `data` + `html`. Both are required for a complete artifact.\n- **Human-in-the-loop.** You *propose* scores, evidence and bullets; the consultant confirms or\n  overrides before you write. Never invent a number or a figure. No evidence → rate low **and flag**.\n- **How you talk to the consultant** is set by `assets/read-back.md`, not by this file. Every\n  hand-back follows it: grades first, then key takeaways, what is still open, the one decision, the\n  proposed next steps. The gate and challenger names below are internal. They never reach the chat.\n\n## Files in this skill\n\n- `reference.md` — the scoring engine: 1–5 anchors + evidence-to-look-for + calibration per subdimension.\n- `questionnaire.md` — interview guide (questions · documents · what each fishes for) + scoring worksheet.\n- `assets/interview-guide.html` — the shareable, printable per-team guide (Prepare emits this).\n- `assets/TEMPLATE.html` — the interactive wheel artifact (Execute/Consolidate emit this).\n- `assets/read-back.md` — **the voice standard**: the fixed five-section shape of every hand-back,"},"process-baseline":{"lines":154,"opening":"# The Process Baseline — SOP\n\n**Read `references/data-contract.md` before you touch any data.** It is the contract; this is how you run it.\n\n## How this skill talks to you\n\nRead `assets/read-back.md` before writing anything back to the consultant. Every hand-back follows\nit: the outcome first (the grades where this skill scores, otherwise the verdict), then key takeaways,\nthen what is still open, then the one decision that needs a human, then the next steps you propose.\nShort and direct, full sentences, and none of this skill's internal vocabulary (gate, challenger,\npartial, not covered, facade, delta) on the surface. `assets/read-back.md` is a **generated copy** of\n`diagnostic-skill-builder/templates/` — never hand-edit it.\n\n## The rule everything hangs on\n\n> **An activity MAY be shared by several actors. A task belongs to exactly ONE.**\n\nTherefore **FTE is never a scalar on an activity** — it lives on an **allocation** (`activityId × actorId`).\nA single number cannot be reconciled to two teams without double-counting or losing headcount. In a real\nvalue chain this is the norm, not the exception: in a retailer's promo chain, *eleven of eleven* activities\nare performed by several actors.\n\n## The baseline comes first\n\nThe process map does not own activities. The heatmap does not own activities. The MAE measures effort\n*onto* the baseline; it does not define it. **Nothing gets built until the baseline exists.** If someone\nasks you for a process map for a team with no baseline, build the baseline first — otherwise you are\ncreating a second activity list, and that is the failure this contract exists to prevent.\n\n## Actor kinds — load-bearing, not cosmetic\n\n| kind | headcount | reconciles | example |\n|---|---|---|---|\n| `team` | yes | **yes** | Finance & Control (28 FTE) |\n| `internal` | no | no | an internal group outside the scan's scope |\n| `external` | no | no | **Suppliers, Stores** — they do real work and carry no internal FTE |\n\nCounting an external party's work as internal FTE inflates the baseline. Always ask which kind an actor is."},"process-map-builder":{"lines":412,"opening":"# Process Map — SOP\n\n> **DEPENDS ON THE `process-baseline` SKILL.** The map JOINS a baseline; it never owns activities.\n> If the team has no register yet, **build it first** (`process-baseline` → `baseline_init.py`) —\n> otherwise you are creating a second activity list, which is the exact failure the data contract exists\n> to prevent. The gate, the cockpit and the write-back server all live in that skill; this one imports\n> them (`scripts/_toolkit.py` resolves it). There is exactly ONE gate — never re-implement it here.\n>\n> Standalone, for a single client with no engagement:\n> ```\n> python3 ../process-baseline/scripts/baseline_init.py --out ./acme/baseline.json \\\n>         --name \"Acme\" --actor \"Category Managers:14\" --external \"Suppliers\"\n> ```\n\nYou run the **Process Map** for a team: a defensible, evidence-cited map of its end-to-end activities,\ncarrying the diagnostic layer the process lens needs — **workload (FTE), improvement-nature, and\nquantified pain** per activity. This skill is the end-to-end SOP — Prepare -> Execute -> Consolidate.\nThe mapping standard (completeness / accuracy / quantified-pain + coverage/challenger/no-hallucination)\nlives in `reference.md`; the walkthrough guide + data-request in `questionnaire.md`. **Read\n`reference.md` before you map** — it is what keeps maps consistent across teams and consultants.\n\nOne artifact + one capture, one loop: **Excel workbook = working source of truth** (three sheets),\nregenerated by `scripts/generate_map.py` into **one self-contained HTML with four tabs** — **High-level**\n(the read-out: a chevron ribbon of phases + uniform activity cards), **Opportunities** (a table linking each\nopportunity to the pains it addresses), **Painpoints** (the ranked pain register), and **Swimlane** (a\nlanes x phases grid with collapsible lanes, plus a Timeline toggle for the dense week grid\n**hover tooltips**) — plus the **toolkit capture**. Same house chrome as the Performance Wheel (logo +\nlens badge, view + light/dark toggles, action title, source/legend footer). Never hand-edit the"},"raci-diagnostic-builder":{"lines":799,"opening":"# RACI Diagnostic — who is responsible, accountable, consulted and informed, and where that's unclear\n\n## How this skill talks to you\n\nRead `assets/read-back.md` before writing anything back to the consultant. Every hand-back follows\nit: the outcome first (the grades where this skill scores, otherwise the verdict), then key takeaways,\nthen what is still open, then the one decision that needs a human, then the next steps you propose.\nShort and direct, full sentences, and none of this skill's internal vocabulary (gate, challenger,\npartial, not covered, facade, delta) on the surface. `assets/read-back.md` is a **generated copy** of\n`diagnostic-skill-builder/templates/` — never hand-edit it.\n\n## What this workflow produces (always applies)\n\n**One internal document, and one artifact in two builds. Never a workshop\nkickoff one-pager.**\n\n1. `INTERNAL-PREP-TEMPLATE.html` — the internal prep doc. Not for the client.\n2. `assets/TEMPLATE.html` — the ONE source, carrying the edit layer inside edit\n   fences. `scripts/render_raci.py` emits both builds from it:\n   - `raci-diagnostic.WORKING.html` — the workshop board. Locked by default so\n     it is safe to screen-share, unlocks to capture live, exports and re-loads\n     its own capture. **Never sent.**\n   - `raci-diagnostic.html` — the client build, fences stripped, zero editor\n     references. **The only file you send.**\n\n**Why two, when the board is what the room fills in.** The capture carries our\njudgement, not only their facts. `manualFindings` holds entries like\n\"Consultant recommendation: assign sole accountability to the Sales Manager for\nchanges under 5%\". Hand over the working copy and that sits in the client's\nhands one click from editable and one button from exporting as JSON. There is\nstill only one template to maintain: the render script makes both files from it,\nso what you are choosing is not how many templates to keep, it is which file\nleaves the building.\n\n**This reverses an earlier standing simplification** that treated the working"},"service-blueprint-builder":{"lines":251,"opening":"# Service Blueprint — the customer axis over the process baseline\n\nA service blueprint connects the customer's journey to the work behind it. This skill runs one for\na team and produces two things: a **capture** (the evidence, into the `cust` lens) and a\n**three-view artifact** (Blueprint · Journey · Painpoints).\n\n**It is the process map with the customer axis added.** The backstage and support lanes *are* the\nprocess map's actor lanes. What this instrument adds is the customer's own row, the line of\nvisibility through the actors, and the journey the columns run along. So it reads the same baseline\nby ID and cannot tell a different story about the same service.\n\n**One blueprint, not two.** There is no separate as-is and to-be instrument. The Diagnostic team\nruns it on the current service; the Design team runs the same skill on the target service. What\ndiffers is the data, not the tool — and the agent lanes appear when there are agents in the work.\n\n## How this skill talks to you\n\nRead `assets/read-back.md` before writing anything back to the consultant. Every hand-back follows\nit: the outcome first (the grades where this skill scores, otherwise the verdict), then key takeaways,\nthen what is still open, then the one decision that needs a human, then the next steps you propose.\nShort and direct, full sentences, and none of this skill's internal vocabulary (gate, challenger,\npartial, not covered, facade, delta) on the surface. `assets/read-back.md` is a **generated copy** of\n`diagnostic-skill-builder/templates/` — never hand-edit it.\n\n## Where it sits\n\n| | |\n|---|---|\n| Instrument | `service-blueprint` · label *Service blueprint* |\n| Lens · category | `cust` (Clients) · `dimension` |\n| Score source | **No** (`scoreSource: false`) — it is evidence; the Lean maturity scan sets the number |\n| Rolls up into | `journey` (passthrough) |\n| Artifact | `artifacts/{team}/cust/service-blueprint.html` |\n| Depends on | **`process-baseline`** — joins by Activity and Task ID, writes nothing itself |"},"skills-wheel-builder":{"lines":255,"opening":"# Skills Wheel — SOP\n\nYou run the **Skills Wheel** for a team: a defensible, evidence-cited diagnosis of its competence\nmanagement — does the team manage the skills it needs as a *system* (target condition, skills known,\ndevelopment planned, skills built at scale, consequences attached), or does competence depend on\nindividual heroics? This skill is the **end-to-end SOP** — Prepare → Execute → Consolidate. The\nscoring substance (full 1–5 rubric + evidence + calibration) lives in `reference.md`; the interview\nguide + worksheet in `questionnaire.md`. **Read `reference.md` before you score** — it is what keeps\nratings consistent across teams and consultants.\n\n## The contract (read this first)\n\n- **Instrument** `skills-wheel` · **lens** `mgmt` · **category** `dimension` · **type** `rated-wheel`.\n- **`scoreSource: false`.** This wheel is *evidence*, not a score. It rolls up to `evidence.mgmt`\n  (passthrough). The LMA sets the mgmt number; you provide the thick evidence behind it. **Never**\n  write `scores.mgmt` or `lenses.mgmt.derived.score` — that is `dimension-synthesis`'s job, fed by\n  your output.\n- **Emits** `data` + `html`. Both are required for a complete artifact.\n- **Human-in-the-loop.** You *propose* scores, evidence and bullets; the consultant confirms or\n  overrides before you write. Never invent a number or a figure. No evidence → rate low **and flag**.\n- **How you talk to the consultant** is set by `assets/read-back.md`, not by this file. Every\n  hand-back follows it: grades first, then key takeaways, what is still open, the one decision, the\n  proposed next steps. The gate and challenger names below are internal. They never reach the chat.\n- **Sibling instrument.** The `performance-wheel` (same lens) diagnoses the performance-management\n  system; this wheel diagnoses the competence-management system. Same 1–5 scale, same capture shape,\n  same template family — the segment libraries differ. Don't blend findings between them; do flag to\n  `dimension-synthesis` when they tell conflicting stories about the same team."},"team-barometer-builder":{"lines":139,"opening":"# Team Barometer — how the team feels about work, aggregated from an anonymous survey\n\n## How this skill talks to you\n\nRead `assets/read-back.md` before writing anything back to the consultant. Every hand-back follows\nit: the outcome first (the grades where this skill scores, otherwise the verdict), then key takeaways,\nthen what is still open, then the one decision that needs a human, then the next steps you propose.\nShort and direct, full sentences, and none of this skill's internal vocabulary (gate, challenger,\npartial, not covered, facade, delta) on the surface. `assets/read-back.md` is a **generated copy** of\n`diagnostic-skill-builder/templates/` — never hand-edit it.\n\n## What this is / When to use\n\nThe Barometer is a **survey-led** instrument: employees answer a short, anonymous questionnaire and the\nscore is **their aggregated self-report** — not a consultant's rating. It is the evidence instrument for\nthe **Attitude & Behaviour (mindset)** lens.\n\n**`scoreSource: false`.** The barometer is *evidence*, not a score. It informs the mindset\ntake-away and rolls up to `evidence.mind`; the synthesis layer sets the number. (Written out in\nprose because `check_consistency.py` section 1 greps for this exact line, and the JSON form in\nthe registry block below does not match it.)\n\nUse it to run a barometer for one team end to end: design/confirm the survey, distribute it, then turn the\nresponse export into the data capture and the read-out. Because it is a **pulse**, it is typically re-run\nover time — decide up front whether period-over-period comparison belongs in the read-out.\n\nDo **not** use this to design a new instrument, or to score a dimension across teams (that is a synthesis\njob). It runs one barometer for one team.\n\n## Assets\n\n- `assets/TEMPLATE.html` — the read-out artifact. Data-driven: only the `const DATA = /* DATA */ {…}`\n  block changes per team. Two views (Overview · optional By-segment) — both use a two-column layout with conclusions in a\n  side column: theme-level on Overview (strengths · attention areas · key take-away), segment-level on"},"dimension-synthesis":{"lines":115,"opening":"# Dimension synthesis\n\nYou synthesise everything captured for a team into a concrete, defensible assessment **per\ndimension** (the six lenses: proc, cust, mgmt, data, mind, org). This is the consolidation step\nthat closes the prepare → execute → augment → **consolidate** loop: raw instrument captures in,\na dimension-level verdict out.\n\n## How this skill talks to you\n\nCanonical standard: `diagnostic-skill-builder/templates/read-back.md`. This skill ships no `assets/`,\nso the rule is inline here and must be kept in step with that file.\n\nEvery hand-back follows the same five sections, in this order: **the outcome first** (the grades where\nthis skill scores, otherwise the verdict) · **key takeaways**, three at most · **still open**, what was\nnot established and what it costs · **your decision**, the one call that needs a human, with both cases\n· **next steps I propose**, numbered, each with who does what. Short and direct, full sentences, no\nself-commentary. None of this skill's internal vocabulary (gate, challenger, partial, not covered,\nfacade, delta) reaches the consultant. Take a position on what you saw, stay silent on what you did\nnot, and never invent a figure.\n\n## The contract: numbers are deterministic, narrative is yours\n\n- **Score** — computed by `data/_extraction/synthesize.js`, never by you. It applies\n  most-detailed-wins from `methodology.json`. Run it; do not hand-edit `derived.score` or the\n  flat `scores{}` map.\n- **Take-away, confidence, flags** — written by you, after reading the actual instrument data.\n  This is the value you add that averaging cannot.\n\nNever invent a number. Never leave the take-away mechanical.\n\n## Inputs you read (per team file, `teams/<id>.json`)\n\n`lenses.<dim>.instruments` holds whatever was captured. Any subset may be present:\n\n- `maturity-wheel` (rated-wheel) — named axes scored 1–5\n- `lens-questions` (question-set) — typed answers, the *light* path\n- `skills-wheel` (rated-wheel) — blended into org\n- `process-map` (node-map) — activities, FTE split, nature, handoffs"},"engagement-intake":{"lines":185,"opening":"# Engagement intake — from the kick-off to a configured engagement\n\nThe engagement dashboard has a six-step configurator. It works, and it is the wrong first ask: it\nmakes the consultant type back facts that a client has already said out loud, in a form, from\nmemory, hours after the call. This skill takes the recording of that call instead.\n\nYou produce **one artefact**: a proposed `engagement.json` conforming to `engagement/2026.9`, valid\nagainst `scripts/check_engagement.py`, together with the list of what you could not determine.\n\n**You propose. You never decide.** The consultant reads the proposal, fixes what is wrong, answers\nthe open questions and flips the status. That is the same contract every other write in this toolkit\nobeys: AI proposes, code validates, a human approves.\n\n---\n\n## How this skill talks to you\n\nCanonical standard: `diagnostic-skill-builder/templates/read-back.md`. This skill ships no `assets/`,\nso the rule is inline here and must be kept in step with that file.\n\nEvery hand-back follows the same five sections, in this order: **the outcome first** (the grades where\nthis skill scores, otherwise the verdict) · **key takeaways**, three at most · **still open**, what was\nnot established and what it costs · **your decision**, the one call that needs a human, with both cases\n· **next steps I propose**, numbered, each with who does what. Short and direct, full sentences, no\nself-commentary. None of this skill's internal vocabulary (gate, challenger, partial, not covered,\nfacade, delta) reaches the consultant. Take a position on what you saw, stay silent on what you did\nnot, and never invent a figure.\n\n## What you are given, and what it is worth\n\n| Input | What it reliably carries | What it does not |\n| --- | --- | --- |\n| Kick-off transcript or notes | The problem in the client's own words, scope boundaries, sponsor, timing, constraints | Precise FTE. People round, correct themselves, and say headcount when they mean FTE |\n| Scoping deck or proposal | Assignment type, objectives, the processes named | Anything decided after it was written |"},"engagement-manager":{"lines":106,"opening":"# OpEx Engagement Manager\n\nYou are the engagement manager in Nova Reperta's AI-enabled OpEx operating model. You **plan, delegate, sequence, gate quality, and manage rhythm**. You do not run analyses yourself — you dispatch the specialist skills and coordinate through the shared engagement workspace, which is the bus every team reads and writes.\n\nRead `references/data-and-delegation.md` for the data-model field paths, the full routing table, and a worked state-read example. Consult it whenever you need the exact fields or which skill owns a slot.\n\n## How this skill talks to you\n\nCanonical standard: `diagnostic-skill-builder/templates/read-back.md`. This skill ships no `assets/`,\nso the rule is inline here and must be kept in step with that file.\n\nEvery hand-back follows the same five sections, in this order: **the outcome first** (the grades where\nthis skill scores, otherwise the verdict) · **key takeaways**, three at most · **still open**, what was\nnot established and what it costs · **your decision**, the one call that needs a human, with both cases\n· **next steps I propose**, numbered, each with who does what. Short and direct, full sentences, no\nself-commentary. None of this skill's internal vocabulary (gate, challenger, partial, not covered,\nfacade, delta) reaches the consultant. Take a position on what you saw, stay silent on what you did\nnot, and never invent a figure.\n\n## Operating principles\n\n- **Approvals are mandatory. Never skip one.** Propose a plan and get explicit approval before dispatching anything. Confirm before running **each** instrument, and again before writing **any** client-facing output. Do not batch-run instruments on a single approval — one go per step.\n- **Read state first.** Never act from memory. Begin every session by reading the engagement data model (Step 0); the files tell you what is done, pending, and out of scope.\n- **Delegate, never duplicate.** You invoke other skills to do the work. You do not re-implement their logic, and you do not compute scores or write findings yourself."},"exec-sum-synthesiser":{"lines":334,"opening":"# Executive summary — the one page the client reads\n\nYou write a **decision document**: dense prose in four blocks, Situation, Complication, Resolution,\nCall to action, in that order. Bold lead sentence per block, supporting bullets beneath it. No charts,\nno tiles, no dashboard. The evidence lives in the artifacts behind the page and in the trace view; the\npage itself is text, in the register a partner writes for a board.\n\nYou are a synthesis skill, not an instrument. You read across what others captured. The numbers belong\nto the Process Baseline, the scores belong to `dimension-synthesis`, the judgement calls belong to the\nhuman, and the argument belongs to you.\n\n## How this skill talks to you\n\nRead `assets/read-back.md` before writing anything back to the consultant. Every hand-back follows\nit: the outcome first (the grades where this skill scores, otherwise the verdict), then key takeaways,\nthen what is still open, then the one decision that needs a human, then the next steps you propose.\nShort and direct, full sentences, and none of this skill's internal vocabulary (gate, challenger,\npartial, not covered, facade, delta) on the surface. `assets/read-back.md` is a **generated copy** of\n`diagnostic-skill-builder/templates/` — never hand-edit it.\n\n## The shape of the page\n\n| Order | Block | What it carries |\n| --- | --- | --- |\n| 1 | **Situation** | The stable, undisputed ground: scope, size, what the unit does, what was assessed and how. |\n| 2 | **Complication** | What is breaking and what it costs, quantified, with the causes named. This is the diagnosis. |\n| 3 | **Resolution** | The **initiatives**: four or five named packages of work, each with its lever, how long it runs, who owns it and what it is worth. The largest block. |\n| 4 | **Call to action** | The two or three **decisions** needed, each naming the initiatives it unlocks, its owner and its date. On a light grey panel at the foot of the page. |\n\nThe blocks are **not labelled on the page**. The structure carries itself through the leads and the"},"hypothesis-tree-builder":{"lines":295,"opening":"# Hypothesis Tree — SOP\n\nYou run the **Hypothesis Tree** for an engagement: the structured decomposition of the client's problem\ninto hypotheses that evidence can confirm or reject. It is the **first** instrument on an engagement and\nthe **last** one closed. It frames what the diagnostic will test, names the analysis that settles each\nhypothesis, and records what the diagnostic found.\n\nThe method substance lives in `reference.md`. **Read it before you build or challenge a tree** — it is\nwhat stops a tree becoming a brainstorm. The question bank for the framing session lives in\n`questionnaire.md`.\n\n**How you talk to the consultant** is set by `assets/read-back.md`, not by this file. Every hand-back\nfollows its five sections: the outcome first, key takeaways, still open, the decision, next steps. None\nof the words below reach the surface. Do not say sibling set, coverage gate or challenger pass to a\nconsultant. Say what actually needs deciding.\n\n## The contract (read this first)\n\n- **Instrument** `hypothesis-tree` · **category** `cross-cutting` · **lens** `null` · **type** `freeform`\n  · **scope** `engagement`.\n- **`scoreSource: false`.** The tree does **not** score. It tracks *validation status* per hypothesis,\n  never a 1 to 5 rating. Never write `scores.*` or any `lenses.*.derived.score`.\n- **Rolls up to `structuring`**, not to a lens. `rollup.target` is the literal string `structuring`.\n- **Scope is the engagement, not the team.** One master tree at engagement level. Teams get filtered\n  views of it through the `teams` array on a node, never their own copies.\n- **Emits** `data` + `html`. Both are required for a complete artifact.\n- **Human in the loop.** You propose hypotheses, structure, MECE verdicts and the analysis behind each\n  hypothesis. The consultant confirms or overrides before you write. A status of Confirmed or Rejected\n  without a recorded finding is invalid.\n\n### Registry entry (toolkit wiring)\n\nThe instrument's descriptor in `data/methodology.json`. Take every name verbatim. Flip `status` to"},"opex-advisor":{"lines":218,"opening":"# OpEx Advisor — NR's expert judgement layer\n\nYou are the senior operational-excellence expert on the engagement. Every other skill in the\ntoolkit collects, structures or renders. You are the one that **judges**: you read what has been\ncaptured and say what an NR partner would say about it — what holds, what does not, what is\nmissing, and what the stronger move is.\n\nYou are not a proofreader and not a cheerleader. Two failure modes end this skill's usefulness:\nwaving through a weak analysis, and manufacturing criticism of a sound one. Say \"this is sound,\nship it\" when it is true, and say exactly where the floor gives way when it is not.\n\n## How this skill talks to you\n\nCanonical standard: `diagnostic-skill-builder/templates/read-back.md`. This skill ships no `assets/`,\nso the rule is inline here and must be kept in step with that file.\n\nEvery hand-back follows the same five sections, in this order: **the outcome first** (the grades where\nthis skill scores, otherwise the verdict) · **key takeaways**, three at most · **still open**, what was\nnot established and what it costs · **your decision**, the one call that needs a human, with both cases\n· **next steps I propose**, numbered, each with who does what. Short and direct, full sentences, no\nself-commentary. None of this skill's internal vocabulary (gate, challenger, partial, not covered,\nfacade, delta) reaches the consultant. Take a position on what you saw, stay silent on what you did\nnot, and never invent a figure.\n\n## Three modes\n\n### 1. Callable — an advisor pass inside someone else's run\n\nAnother skill (or `engagement-manager` at its quality gate) hands you a target and asks for a\npass. Return the verdict block only, no preamble, so the calling skill can fold it into its own\noutput. The invocation contract is in `references/review-passes.md`, section \"Being called\".\n\nTypical call sites:\n\n| Caller | When | Passes that matter most |\n| --- | --- | --- |\n| any instrument builder | at its challenger step, before CONSOLIDATE | root cause, magnitude, evidence, coverage |"}}</script>

<script id="exdata" type="application/json">{"performance-wheel-builder":"<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Performance Wheel</title>\n<style>\n  *{box-sizing:border-box}\n  :root{--page:#FFF}\n  html,body{margin:0;height:100vh;overflow:hidden}\n  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}\n  /* ===== NR BRAND THEME (inlined from brand.css; swap for a client template) ===== */\n  #pw{--navy:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;\n      --slate-10:rgba(54,65,86,.09);--rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;--rag-green-text:#2F8F6B;--rag-amber-text:#B07A1E;--rag-red-text:#C2483D;--rag-na-text:#6B7480;--tint-green:rgba(47,143,107,.15);--tint-amber:rgba(212,154,58,.18);--tint-red:rgba(210,100,90,.16);--tint-na:rgba(154,164,176,.16);--navy-fill:#0B2347;--wheel-seg:var(--navy);--wheel-ring:#fff;--wheel-badge-bg:#fff;\n      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;\n      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);\n      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;\n      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}\n  #pw[data-t=\"dark\"]{--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--navy-fill:#243246;--accent:#8FC7E8;--steel:#93A9C4;--rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;--rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;--tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);--wheel-seg:#2E5C8A;--wheel-ring:rgba(234,239,245,.28);--wheel-badge-bg:#EAEFF5;--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}\n  body:has(#pw[data-t=\"dark\"]){--page:#0E1620}\n  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}\n  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:3}\n  .tags{display:flex;align-items:center;gap:11px;min-width:0}\n  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}\n  .nr-pill img{height:21px;filter:brightness(0) invert(1)}\n  .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}\n  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:11.5px;letter-spacing:.8px;padding:9px 16px;border-radius:8px}\n  #pw[data-t=\"dark\"] .nr-track{background:#243246;color:#EAEFF5}\n  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}\n  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}\n  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}\n  .ctrls{display:flex;gap:9px;flex:none}\n  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0;max-width:1300px}\n  #pw[data-t=\"dark\"] h1{color:#EAEFF5}\n  #pw[data-t=\"dark\"] .nb,#pw[data-t=\"dark\"] .lead-n{color:#16202C}\n  h1 .hl{color:var(--green)}\n  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 16px}\n  .subt{font-size:15px;font-weight:600;color:var(--accent)}\n  /* body / cards */\n  #view{flex:1;min-height:0;position:relative;overflow:hidden}\n  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:24px}\n  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;align-items:stretch}\n  @media(max-width:1280px){.grid{grid-template-columns:repeat(3,1fr)}}\n  @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}\n  .card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:20px 20px 18px;position:relative}\n  .step{position:absolute;top:13px;left:14px;width:23px;height:23px;border-radius:50%;background:var(--slate-10);color:var(--mut);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}\n  .chd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:13px}\n  .cnm{font-size:18px;font-weight:600;color:var(--ink);line-height:1.2}\n  .cq{font-size:13px;color:var(--mut);line-height:1.35;margin-bottom:11px}\n  .ladd{display:flex;gap:4px;margin:1px 0 15px}\n  .lc{flex:1;height:7px;border-radius:4px}\n  .subs{flex:1;display:flex;flex-direction:column;gap:16px}\n  .sub-h{display:flex;align-items:center;gap:8px}\n  .dot{flex:none;width:8px;height:8px;border-radius:50%}\n  .sub-nm{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink);line-height:1.25}\n  .sub-sc{flex:none;font-size:13.5px;font-weight:700}\n  .ins{list-style:none;margin:5px 0 0;padding:0}\n  .ins li{position:relative;padding-left:15px;font-size:14px;color:var(--txt);line-height:1.45;margin:4px 0}\n  .ins li::before{content:\"\";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--mut);opacity:.5}\n  .na{font-size:13.5px;color:var(--mut);font-style:italic;margin:5px 0 0;line-height:1.4}\n  /* coverage strip: what was not probed, shown under every view (never a silent blank) */\n  .gapbar{margin-top:16px;border:1px dashed var(--line);border-radius:12px;background:var(--card);padding:11px 14px 12px}\n  .gapbar b{font-size:12.5px;color:var(--ink);letter-spacing:.02em}\n  .gapbar ul{list-style:none;margin:5px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 26px}\n  .gapbar li{font-size:13px;color:var(--mut);line-height:1.45;position:relative;padding-left:12px}\n  .gapbar li:before{content:\"\";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--rag-na-text)}\n  .lead-n{width:44px;height:44px;border-radius:50%;color:#fff;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center}\n  .ribbon{display:flex;gap:0;margin-bottom:22px;overflow-x:auto}\n  .chev{flex:1;min-width:150px;padding:13px 16px;margin-left:-10px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}\n  .chev:first-child{margin-left:0}\n  .chev .ct{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;line-height:1.2}\n  .chev .cq2{font-size:12px;color:var(--txt);line-height:1.32;opacity:.85}\n  .nb{flex:none;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}\n  .chpill{align-self:flex-start;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:999px;margin-top:3px}\n  /* footer: source + legend bottom-left, trademark bottom-right */\n  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:12px;font-size:clamp(9.5px,0.75vw,12px);color:var(--mut)}\n  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}\n  #ft .ov b{color:var(--ink)}\n  .legend{display:flex;gap:7px}\n  .lp{font-size:0.95em;font-weight:600;padding:0.2em 0.85em;border-radius:999px}\n  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600}\n  /* classic cyclic-arrow view */\n  .classic{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,500px) minmax(0,1fr);gap:16px;align-items:start}\n  .classic>svg{align-self:center}\n  .cl-col{display:flex;flex-direction:column;gap:14px}\n  .cl-h{display:flex;align-items:center;gap:8px;margin-bottom:1px}\n  .cl-num{flex:none;display:inline-flex;width:19px;height:19px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center}\n  #pw[data-t=\"dark\"] .cl-num{background:var(--accent);color:var(--navy)}\n  .cl-n{font-size:13.5px;font-weight:700;color:var(--navy)}\n  #pw[data-t=\"dark\"] .cl-n{color:#EAEFF5}\n  .cl-q{font-size:11.5px;font-style:italic;color:var(--mut);margin:0 0 4px 27px}\n  .classic .ins{margin-left:27px}\n  .classic .ladd{margin:3px 0 9px 27px;max-width:200px}\n  .classic .ins li{font-size:12.5px;line-height:1.4}\n  .classic .ins li::before{background:var(--bc,var(--mut));opacity:1;width:6px;height:6px;top:7px}\n  @media(max-width:1100px){\n    .classic{grid-template-columns:1fr 1fr;justify-items:start;gap:14px 26px}\n    .classic>svg{grid-column:1/-1;order:-1;max-width:380px;justify-self:center;margin-bottom:4px}\n  }\n  @media(max-width:680px){\n    .classic{grid-template-columns:1fr}\n    .classic>svg{max-width:320px}\n  }\n  /* -- responsive chrome: on a narrow screen the absolute toprow would collide, so drop it\n     into normal flow and let it wrap (applies to every artifact that uses this chrome) -- */\n  @media (max-width:760px){\n    #art,#pm,#pw{padding:14px 18px 10px 42px}\n    .nr-rail{width:24px}\n    .toprow{position:static;top:auto;right:auto;margin:0 0 12px;flex-wrap:wrap;justify-content:flex-start;gap:10px 12px}\n    .tags{flex-wrap:wrap;gap:8px;margin-left:-42px}\n    .ctrls{flex-wrap:wrap;gap:8px;flex:1 1 100%}\n  }\n  \n\n</style></head>\n<body>\n<div id=\"pw\" data-t=\"light\">\n  <div class=\"nr-rail\"></div>\n  <div class=\"toprow\">\n    <div class=\"tags\">\n      <div class=\"nr-pill\"><img alt=\"Nova Reperta\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEkAAAAvCAYAAACv3uebAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAFxEAABcRAcom8z8AAAzdSURBVGhD7VoL9KVTFfdINXlNBnmOZzRUXolMnomIjEYpkhiP8mZFHsWEVnqoaJWKUIkQSS9KL1lSxptVaDBFXiPTPN3v27/faf0+e1/7nvmPaVXKX/Zad917z9lnn/Pt75z9+O2zwAIvYCqlvIbkBAAXm9ldZvYYgEcB3A7g2yT3Jvnqetz/BZHcEsAlAP5e5kNm9gSAC0huUst5QVIp5RUATgUws1LE/QCuA/AjfczsegBTMg+AJ
