<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpEx Constellation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#060B16;
  --ground-2:#0A1120;
  --surface:#0C1526;
  --surface-2:#111C31;
  --hairline:#1B2A47;
  --hairline-soft:#152239;

  --ink:#E8EEF9;
  --ink-2:#93A4C4;
  --ink-3:#57678A;

  --live:#4E86F7;
  --deliv:#4FC08D;
  --build:#E5A03C;
  --env:#3E4C6B;

  --proc:#5B8CE8;
  --cust:#F0736A;
  --mgmt:#47B37C;
  --data:#E5A03C;
  --mind:#A98BE0;
  --org:#3FC4B4;
  --spine:#8FA8CE;

  --sans:'Hanken Grotesk','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;

  --rail:268px;
  --panel:352px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--live);outline-offset:2px;border-radius:3px}
/* a star keeps DOM focus after a click, which left the focus ring stuck around it.
   Show the ring only while the map is being driven from the keyboard. */
.node:focus,.node:focus-visible{outline:none}
body.kbd .node:focus{outline:2px solid var(--live);outline-offset:3px}

/* ─── shell ─────────────────────────────────────────────────────── */
.app{
  position:relative;
  height:100dvh;
  min-height:600px;
  display:grid;
  grid-template-columns:var(--rail) 1fr;
  grid-template-rows:auto 1fr;
  transition:grid-template-columns .3s cubic-bezier(.4,0,.2,1);
  background:
    radial-gradient(900px 620px at 22% 62%, rgba(46,86,168,.16), transparent 68%),
    radial-gradient(760px 520px at 79% 55%, rgba(32,120,102,.13), transparent 70%),
    radial-gradient(1100px 700px at 50% 18%, rgba(38,66,140,.20), transparent 72%),
    var(--ground);
}

/* ─── topbar ────────────────────────────────────────────────────── */
.topbar{
  grid-column:1 / -1;
  display:flex;align-items:center;justify-content:space-between;gap:28px;
  padding:9px 20px;
  border-bottom:1px solid var(--hairline-soft);
  background:linear-gradient(180deg,rgba(6,11,22,.92),rgba(6,11,22,.55));
  backdrop-filter:blur(6px);
  z-index:6;
}
.railtoggle{
  position:absolute;left:14px;top:14px;z-index:4;width:30px;height:30px;border-radius:8px;
  border:1px solid var(--hairline);display:grid;place-items:center;color:var(--ink-3);
  background:rgba(12,21,38,.7);backdrop-filter:blur(6px);transition:.16s;
}
.railtoggle:hover{border-color:#2E4674;color:var(--ink);background:rgba(78,134,247,.10)}
.rt-ic{font-size:17px;line-height:1;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.app.norail .rt-ic{transform:rotate(180deg)}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{
  margin:0;font-size:16px;font-weight:600;letter-spacing:.2px;white-space:nowrap;
}
.brand .eyebrow{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.legend{display:flex;gap:15px;align-items:center;flex-shrink:0}
.lg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);white-space:nowrap}
.lgdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.lgdot.live{background:var(--live);box-shadow:0 0 9px rgba(78,134,247,.85)}
.lgdot.build{background:transparent;border:1.5px solid var(--build)}
.lgdot.env{background:transparent;border:1.5px dashed var(--env)}

/* ─── rail ──────────────────────────────────────────────────────── */
.rail{
  border-right:1px solid var(--hairline-soft);
  padding:18px 18px 20px;
  overflow-y:auto;
  scrollbar-width:none;-ms-overflow-style:none;
  display:flex;flex-direction:column;gap:22px;
  background:linear-gradient(180deg,rgba(10,17,32,.55),rgba(6,11,22,.2));
  z-index:5;
}
.rail h2{
  margin:0 0 10px;font-family:var(--mono);font-size:10px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--hairline);border-radius:999px;padding:4px 11px;
  font-size:11.5px;color:var(--ink-2);transition:.16s;
  display:flex;align-items:center;gap:6px;
}
.chip:hover{border-color:#2C4370;color:var(--ink)}
.chip[aria-pressed="true"]{background:rgba(78,134,247,.14);border-color:rgba(78,134,247,.55);color:var(--ink)}
.chip .sw{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}

.counts{display:flex;flex-direction:column;gap:7px}
.crow{display:flex;align-items:baseline;gap:9px;font-size:12px;color:var(--ink-2)}
.crow b{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--ink);min-width:26px;text-align:right;font-variant-numeric:tabular-nums}
.crow .bar{flex:1;height:3px;border-radius:2px;background:var(--hairline);overflow:hidden}
.crow .bar i{display:block;height:100%;border-radius:2px}

.tourbtn{
  width:100%;border:1px solid rgba(78,134,247,.5);border-radius:8px;
  padding:11px 12px;text-align:left;background:rgba(78,134,247,.10);
  display:flex;align-items:center;gap:10px;transition:.16s;
}
.tourbtn:hover{background:rgba(78,134,247,.19)}
.tourbtn .tb-ic{
  width:24px;height:24px;border-radius:50%;flex:0 0 auto;
  border:1px solid rgba(78,134,247,.6);display:grid;place-items:center;
  color:var(--live);font-size:9px;
}
.tourbtn b{display:block;font-size:12.5px;font-weight:600}
.tourbtn span{display:block;font-size:11px;color:var(--ink-2);line-height:1.35}

.rail::-webkit-scrollbar,.panel-bd::-webkit-scrollbar{width:0;height:0;display:none}
.panel-bd{scrollbar-width:none;-ms-overflow-style:none}

/* ─── stage ─────────────────────────────────────────────────────── */
.app.norail{--rail:0px}
.app.norail .rail{opacity:0;pointer-events:none;overflow:hidden;border-right:0;
  padding-left:0;padding-right:0;transition:opacity .2s}
.stage{position:relative;overflow:hidden}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#viewport{will-change:transform}
/* markers and labels counter-scale as you zoom; they must glide with the map,
   not snap to their new size while the map is still moving */
.node,#lLabels>g,#lRegions>g{transition:transform 0s, opacity .24s ease var(--sd,0s)}
svg.tq .node,svg.tq #lLabels>g,svg.tq #lRegions>g{transition:transform .13s linear, opacity .24s ease var(--sd,0s)}
svg.ts .node,svg.ts #lLabels>g,svg.ts #lRegions>g{transition:transform .58s cubic-bezier(.4,0,.2,1), opacity .3s ease var(--sd,0s)}
#map.dragging{cursor:grabbing}

.zoomctl{
  position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:1px;
  border:1px solid var(--hairline);border-radius:8px;overflow:hidden;
  background:rgba(12,21,38,.86);backdrop-filter:blur(6px);z-index:3;
}
.zoomctl button{width:34px;height:32px;display:grid;place-items:center;font-size:14px;color:var(--ink-2);transition:.14s}
.zoomctl button:hover{background:rgba(78,134,247,.16);color:var(--ink)}
.zoomctl button + button{border-top:1px solid var(--hairline-soft)}
.app.panelopen .zoomctl{right:calc(var(--panel) + 16px)}
.zoomctl{transition:right .34s cubic-bezier(.4,0,.2,1)}
.zoomctl .fit{font-size:10px;font-family:var(--mono);letter-spacing:.04em}

.hint{
  position:absolute;left:16px;bottom:16px;font-size:11px;color:var(--ink-3);
  font-family:var(--mono);letter-spacing:.03em;pointer-events:none;z-index:3;
}

/* ─── svg map ───────────────────────────────────────────────────── */
.region{
  font-size:14px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;
  fill:#31456E;pointer-events:none;
}
.region.lit{fill:#3E5788}
.layeredge{stroke:#16233C;stroke-width:1;stroke-dasharray:2 8;fill:none;vector-effect:non-scaling-stroke}
.layername{font-size:14px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;
  fill:#8FA6D4;pointer-events:none}
.layersub{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  fill:#5F719A;pointer-events:none}
.band{fill:currentColor;fill-opacity:.055;stroke:currentColor;stroke-opacity:.26;stroke-width:1;
  stroke-dasharray:3 5;rx:14;pointer-events:none;transition:fill-opacity .22s,stroke-opacity .22s}
.bandcap{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  fill:currentColor;fill-opacity:.85;pointer-events:none}
.bus{stroke:#182742;stroke-width:1}
.hubcap{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  fill:#4A5C82;pointer-events:none;
}
.region-sub{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.20em;text-transform:uppercase;
  fill:#1F2E4C;pointer-events:none;
}

.star{fill:#4A5C82}
.edge{fill:none;stroke:#1E2F4E;stroke-width:1;transition:stroke .22s,opacity .22s}
.edge,.bus,.layerline{vector-effect:non-scaling-stroke}
.edge.filament{stroke:#16233C;stroke-dasharray:3 7}
.edge.flow{stroke:#1A2B48;stroke-dasharray:4 6;opacity:.75}
.edge.hot{stroke:var(--live);opacity:1}
.edge.dim{opacity:.22}

.node{cursor:pointer}
.node .halo{fill:currentColor;opacity:0;transition:opacity .2s}
.node:hover .halo,.node.sel .halo,.node.hov .halo{opacity:.13}
.node .core{transform-box:fill-box;transform-origin:center;
  transition:transform .22s cubic-bezier(.3,0,.2,1), opacity .2s}
.node:hover .core,.node.hov .core{transform:scale(1.09)}
.node.sel .core{transform:scale(1.06)}

/* one quiet ring out of the star you point at — it plays once and stops, rather than
   pulsing away in the corner of your eye */
.node .ripple{fill:none;stroke:currentColor;stroke-width:1.1;opacity:0;pointer-events:none;
  transform-box:fill-box;transform-origin:center;vector-effect:non-scaling-stroke}
.node:hover .ripple,.node.hov .ripple{animation:ripple .72s cubic-bezier(.2,.6,.3,1) 1}
@keyframes ripple{
  0%{opacity:.34;transform:scale(1)}
  100%{opacity:0;transform:scale(2.1)}
}

/* peek: hovering a team (or a group) brings up the stars sitting under it so you can
   see what is there, but holds their names back until you actually open it */
#lNodes .node.peek{opacity:.72!important;pointer-events:none}
#lLabels .node.peek{opacity:0!important}
#lNodes .node.peek .ripple{animation:none}
.edge.peek{opacity:.5!important}
#lBands.peek{opacity:.62!important;transition:opacity .3s ease .18s}
#lBands.peek .bandcap{opacity:0;transition:opacity .18s}

/* hovering anything lifts the whole section it belongs to and lets the rest recede.
   !important because the level-of-detail and reveal rules are more specific and would
   otherwise pin an opened star back to full opacity. */
.node.softfade{opacity:.2!important}
.node.softfade .ripple{animation:none}
.band.lit{fill-opacity:.15;stroke-opacity:.62}
.band.dull{fill-opacity:.015;stroke-opacity:.09}
.bandcap{transition:fill-opacity .22s}
.lit .bandcap{fill-opacity:1}
.dull .bandcap{fill-opacity:.28}
.node .lbl{
  font-size:12.5px;font-weight:500;fill:var(--ink-2);
  transition:opacity .22s, fill .18s;
}
.node text{cursor:pointer}
.node .hit{fill:transparent;stroke:none}

/* Level of detail. At rest you see the six teams; groups appear as you zoom in,
   instruments after that. Anything you have opened is revealed regardless. */
.node.sub,.node.leaf,.node.ring{opacity:0;pointer-events:none;transition:opacity .32s ease var(--sd,0s)}
svg.lod1 .node.sub,svg.lod1 .node.ring,
svg.lod2 .node.sub,svg.lod2 .node.ring,svg.lod2 .node.leaf,
.node.sub.reveal,.node.leaf.reveal,.node.ring.reveal{opacity:1;pointer-events:auto}
#lBands{opacity:0;transition:opacity .3s ease var(--sd,0s)}
svg.lod2 #lBands,svg.lod2r #lBands{opacity:1}
.edge.d1,.edge.d2{opacity:0;transition:opacity .3s}
svg.lod1 .edge.d1,svg.lod2 .edge.d1,svg.lod2 .edge.d2{opacity:1}
.edge.d0{opacity:0;transition:opacity .32s ease}
svg.lod1 .edge.d0,svg.lod2 .edge.d0{opacity:1}
.node.faded{opacity:.12}
.node .lblhit{fill:transparent;stroke:none}
.node.leaf .lblhit{pointer-events:none}
svg:not(.lod2) .node.leaf:not(.reveal) .lbl{opacity:0}
svg.detail .node.leaf .lblhit,
.node.leaf:hover .lblhit,.node.leaf.sel .lblhit,.node.leaf.hov .lblhit{pointer-events:auto}
.node:hover .lbl,.node.sel .lbl,.node.hov .lbl{fill:var(--ink)}
.node.leaf .lbl{opacity:0;pointer-events:none}
svg.detail .node.leaf .lbl{opacity:1;pointer-events:auto}
.node.leaf:hover .lbl,.node.leaf.sel .lbl,.node.leaf.hov .lbl{opacity:1;pointer-events:auto}
.node .hublbl{
  font-size:15.5px;font-weight:600;fill:var(--ink);letter-spacing:.01em;
}
/* halo: the label is stroked with the page ground before it is filled, so any
   edge running behind it is knocked out around the glyphs rather than through them */
.node .hublbl,.node .hubcap,.node .sublbl,.node .lbl,.bandcap,.region-sub{
  paint-order:stroke fill;stroke:#070C18;stroke-linejoin:round;stroke-opacity:.92;
}
.node .hublbl{stroke-width:5px}
.node .hubcap,.node .sublbl{stroke-width:4px}
.node .lbl{stroke-width:3.4px}
.bandcap,.region-sub{stroke-width:3px}
.node .sublbl{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  fill:var(--ink-2);
}
.node.faded .lbl,.node.faded .hublbl,.node.faded .sublbl,
svg.detail .node.leaf.faded .lbl{opacity:0}
.node.tourlit .core{filter:url(#glowStrong)}

.anchor .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;fill:#47587C}
.anchor:hover .lbl{fill:var(--ink-2)}

/* the concrete stores under each anchor. Same level-of-detail behaviour as an
   instrument: dots at mid zoom, names once you are in, everything on reveal. */
.node.src{opacity:0;pointer-events:none;transition:opacity .32s ease var(--sd,0s)}
svg.lod2 .node.src,.node.src.reveal{opacity:1;pointer-events:auto}
.node.src .lbl{font-size:11.5px;fill:var(--ink-3);opacity:0;pointer-events:none}
svg.detail .node.src .lbl{opacity:1;pointer-events:auto}
.node.src .lblhit{pointer-events:none}
svg.detail .node.src .lblhit,
.node.src:hover .lblhit,.node.src.sel .lblhit,.node.src.hov .lblhit{pointer-events:auto}
.node.src:hover .lbl,.node.src.sel .lbl,.node.src.hov .lbl{fill:var(--ink);opacity:1}
.node.src.faded .lbl{opacity:0}
.srcspine{stroke:#182742;stroke-width:1;fill:none;vector-effect:non-scaling-stroke}

/* the starfield sits still: it is the ground the map is drawn on, not an effect */

/* a peek at the skill: the top of SKILL.md as it is actually written */
.peek{border:1px solid var(--hairline);border-radius:8px;background:#080E1B;
  max-height:340px;overflow:auto}
.peekfoot{margin-top:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3)}
.peek::-webkit-scrollbar{width:0;height:0;display:none}
.peek{scrollbar-width:none;-ms-overflow-style:none}
.peek pre{margin:0;padding:11px 12px;font-family:var(--mono);font-size:10px;line-height:1.62;
  color:#8FA2C4;white-space:pre-wrap;word-break:break-word}

/* how to start it — install, have ready, say this */
.sgd-card{border:1px solid var(--hairline);border-radius:10px;background:var(--ground-2);
  padding:13px 13px 12px;display:flex;flex-direction:column;gap:12px}
.sgd-step{display:flex;gap:10px;align-items:flex-start}
.sgd-num{flex:0 0 auto;width:17px;height:17px;border-radius:50%;border:1px solid #2E4674;
  color:#79A6FF;font-family:var(--mono);font-size:9.5px;display:flex;align-items:center;
  justify-content:center;margin-top:1px}
.sgd-body{flex:1;min-width:0}
.sgd-k{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.sgd-v{font-size:12px;line-height:1.5;color:#B3C1DA;margin-top:3px}
.sgd-say{margin-top:5px;border:1px solid rgba(78,134,247,.40);border-radius:7px;
  background:rgba(78,134,247,.08);padding:9px 10px;font-size:12px;line-height:1.55;color:#C7D6F0}
.sgd-foot{display:flex;justify-content:flex-end;margin-top:7px}

/* ─── panel ─────────────────────────────────────────────────────── */
.panel{
  position:absolute;top:0;right:0;bottom:0;width:var(--panel);
  background:linear-gradient(180deg,#0D1728,#0A1220);
  border-left:1px solid var(--hairline);
  transform:translateX(101%);transition:transform .34s cubic-bezier(.4,0,.2,1);
  z-index:8;display:flex;flex-direction:column;
}
.panel.open{transform:none}
.panel-hd{padding:18px 20px 14px;border-bottom:1px solid var(--hairline-soft);position:relative}
.panel-hd .close{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3);font-size:15px}
.panel-hd .close:hover{background:var(--surface-2);color:var(--ink)}
.panel-hd .kicker{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.panel-hd h3{margin:0;font-size:17px;font-weight:600;line-height:1.25;padding-right:26px;text-wrap:balance}
.panel-hd .id{
  display:block;margin-top:7px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  letter-spacing:.02em;word-break:break-all;
}
.pill{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;
}
.pill.live{color:#79A6FF;background:rgba(78,134,247,.13)}
.pill.build{color:#E5A03C;background:rgba(229,160,60,.10)}
.pill.env{color:#6B7C9E;border-style:dashed}
.teamtag{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}

.panel-bd{padding:16px 20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.panel-bd p{margin:0;font-size:13px;line-height:1.6;color:#C3CEE3}
.field{display:flex;flex-direction:column;gap:5px}
.field .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.field .v{font-size:12.5px;line-height:1.5;color:#B3C1DA}
.field .v.mono{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.pathrow{display:flex;align-items:flex-start;gap:8px}
.pathrow .v{flex:1;min-width:0;word-break:break-all}
.copy{
  flex:0 0 auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.10em;text-transform:uppercase;
  border:1px solid var(--hairline);border-radius:5px;padding:2px 7px;color:var(--ink-3);transition:.14s;
}
.copy:hover{border-color:#2E4674;color:var(--ink-2);background:rgba(78,134,247,.10)}
.copy.ok{color:#79A6FF;border-color:rgba(78,134,247,.55)}
.panel-bd hr{border:none;border-top:1px solid var(--hairline-soft);margin:0}

/* ─── worked example viewer ─────────────────────────────────────── */
.exmodal{
  position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  background:rgba(4,8,16,.93);backdrop-filter:blur(4px);
}
.exmodal[hidden]{display:none}
.ex-bar{
  display:flex;align-items:center;gap:14px;padding:12px 16px;flex:0 0 auto;
  border-bottom:1px solid var(--hairline);background:var(--surface);
}
.ex-bar b{font-size:14px;font-weight:600}
.ex-path{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-close{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
  color:var(--ink-2);font-size:15px;border:1px solid var(--hairline);flex:0 0 auto}
.ex-close:hover{background:var(--surface-2);color:var(--ink)}
.exmodal iframe{flex:1;width:100%;border:0;background:#fff}

.exbtn{
  display:inline-flex;align-items:center;gap:8px;align-self:flex-start;
  border:1px solid rgba(78,134,247,.55);border-radius:8px;padding:8px 13px;
  background:rgba(78,134,247,.13);color:#9CBEFF;font-size:12.5px;font-weight:600;transition:.16s;
}
.exbtn:hover{background:rgba(78,134,247,.22)}

/* ─── tour ──────────────────────────────────────────────────────── */
.tour{
  position:absolute;left:calc(var(--rail) + 24px);right:24px;bottom:24px;
  border:1px solid rgba(78,134,247,.34);border-radius:12px;
  background:rgba(9,16,29,.93);backdrop-filter:blur(10px);

.tour .step-tx b{display:block;font-size:13.5px;font-weight:600;margin-bottom:2px}

.tour .dots{display:flex;gap:5px;flex:0 0 auto}

.tour .nav{display:flex;gap:6px;flex:0 0 auto}
.tour .nav button{

}
.tour .nav button:hover{border-color:#2E4674;color:var(--ink);background:rgba(78,134,247,.10)}
.tour .nav button.primary{border-color:rgba(78,134,247,.55);color:#9CBEFF;background:rgba(78,134,247,.14)}

@media (max-width:1080px){

          <b>Play an engagement</b>

        </span>
      </button>

  </aside>

  <div class="stage">
    <button class="railtoggle" id="railToggle" aria-label="Hide the sidebar" aria-expanded="true">

          <feGaussianBlur stdDeviation="8" result="b"/>

          <stop offset="0%" stop-color="#8FB6FF"/>
          <stop offset="55%" stop-color="#4E86F7"/>
          <stop offset="100%" stop-color="#20447F"/>

        <g id="lLayers"></g>
        <g id="lStars"></g>
        <g id="lRegions"></g>
        <g id="lBands"></g>
        <g id="lEdges"></g>

    <div class="zoomctl">

      <button id="zOut" title="Zoom out" aria-label="Zoom out">−</button>
