mB99tU6tJNcueP9auDGLmcd35UD6cx/lYQ/6ejJjXtNfrwXCrcxMylTO2G0AkLn0fER9r6SH62DtJMc8xZ8IixLl9jHS6GCQzzNOdCPsPolR1dwtAO3VzLucoQ6rO/lMSW/Rygz8IsSB9Rr/wcS5txQy6GnOwAAAABJRU5ErkJggg==\"><b id=\"ctx\">OPEX QUICKSCAN</b></div>\n      <div class=\"nr-track\" id=\"lens\">PERFORMANCE WHEEL</div>\n          \n    </div>\n    <div class=\"ctrls\">\n      <div class=\"seg\" id=\"views\"><button data-v=\"cycle\" class=\"on\">Cycle</button><button data-v=\"flow\">Flow</button><button data-v=\"classic\">Classic</button></div>\n      <div class=\"seg\" id=\"theme\"><button data-s=\"light\" class=\"on\">Light</button><button data-s=\"dark\">Dark</button></div>\n    </div>\n  </div>\n  <h1 id=\"title\"></h1>\n  <div class=\"subrow\"><div class=\"subt\" id=\"subt\"></div></div>\n  <div id=\"view\"><div id=\"vinner\"></div></div>\n  \n  <div id=\"ft\">\n    <div class=\"l\"><span id=\"src\"></span><div class=\"legend\" id=\"lg\"></div></div>\n    <span class=\"conf\">Sample data · Northwind Assurance is fictional</span>\n  </div>\n</div>\n\n<script>\nconst DATA = /* DATA */ {\n  \"context\": \"OPEX QUICKSCAN\",\n  \"lens\": \"MGMT · PERFORMANCE WHEEL\",\n  \"teamName\": \"Claims Handling\",\n  \"source\": \"Team lead, two coordinators and four handlers across tenure levels, 3-4 Sep 2026\",\n  \"keyMessage\": \"Claims Handling measures a great deal and steers on almost none of it: the data arrives daily and is trusted, but it is read after the fact rather than used to decide the day.\",\n  \"aspects\": [\n    {\n      \"key\": \"vision\",\n      \"label\": \"Mission & Vision\",\n      \"segments\": [\n        {\n          \"name\": \"Strategy clarity\",\n          \"score\": 3,\n          \"rag\": \"amber\",\n          \"points\": [\n            \"The team lead and the two coordinators describe the same priority: settle simple claims within five working days and keep the complex ones moving.\",\n            \"Handlers describe their job as clearing the queue. None of the four interviewed connected their work to a service promise made to the customer.\"\n          ],\n          \"evidence\": \"Team lead interview, 3 Sep 2026, and four handler interviews across tenure levels.\"\n        },\n        {\n          \"name\": \"Line of sight\",\n          \"score\": 2,\n          \"rag\": \"red\",\n          \"points\": [\n            \"The department objectives are published once a year on the intranet and are not referred to again.\",\n            \"Asked what good looks like this quarter, three of four handlers answered with a volume figure they had heard in passing.\"\n          ],\n          \"evidence\": \"Four handler interviews, 3-4 Sep 2026.\"\n        }\n      ]\n    },\n    {\n      \"key\": \"metrics\",\n      \"label\": \"Metrics & Objectives\",\n      \"segments\": [\n        {\n          \"name\": \"Metric relevance\",\n          \"score\": 3,\n          \"rag\": \"amber\",\n          \"points\": [\n            \"Volume, ageing and settlement time are tracked per claim type and are the right three to watch.\",\n            \"Rework is not measured at all, though the coordinators estimate a fifth of files come back at least once.\"\n          ],\n          \"evidence\": \"Coordinator interview, 4 Sep 2026; claims system report pack reviewed in session.\"\n        },\n        {\n          \"name\": \"Target setting\",\n          \"score\": 2,\n          \"rag\": \"red\",\n          \"points\": [\n            \"Targets are set for the team as a whole and carried over from last year without being re-argued.\",\n            \"The five-day settlement target has been missed every month this year and has not been revisited.\"\n          ],\n          \"evidence\": \"Monthly report pack, Jan-Aug 2026, reviewed with the team lead.\"\n        },\n        {\n          \"name\": \"Cascade to individuals\",\n          \"score\": 2,\n          \"rag\": \"red\",\n          \"points\": [\n            \"No handler has an individual objective tied to a team metric.\",\n            \"Two handlers said they would welcome one, and both assumed it already existed somewhere.\"\n          ],\n          \"evidence\": \"Handler interviews, 3-4 Sep 2026.\"\n        }\n      ]\n    },\n    {\n      \"key\": \"tracking\",\n      \"label\": \"Performance Tracking\",\n      \"segments\": [\n        {\n          \"name\": \"Visual management\",\n          \"score\": 3,\n          \"rag\": \"amber\",\n          \"points\": [\n            \"A dashboard screen in the team area shows yesterday's intake and the open queue by age.\",\n            \"It is not referred to in any meeting, and the coordinators could not say who owns it.\"\n          ],\n          \"evidence\": \"Observed in the team area, 3 Sep 2026; coordinator interview same day.\"\n        },\n        {\n          \"name\": \"Data timeliness\",\n          \"score\": 4,\n          \"rag\": \"green\",\n          \"points\": [\n            \"The claims system refreshes overnight and the numbers were trusted by everyone interviewed.\",\n            \"No one keeps a private spreadsheet to correct the official figures, which is unusual and worth protecting.\"\n          ],\n          \"evidence\": \"Team lead and coordinator interviews, 3-4 Sep 2026.\"\n        },\n        {\n          \"name\": \"Workload visibility\",\n          \"score\": 2,\n          \"rag\": \"red\",\n          \"points\": [\n            \"Work is allocated by pulling from a shared queue, so nobody can see who is carrying what.\",\n            \"The team lead reallocates only when a handler asks for help, which the two newest handlers said they avoid doing.\"\n          ],\n          \"evidence\": \"Handler interviews across tenure, 3-4 Sep 2026.\"\n        }\n      ]\n    },\n    {\n      \"key\": \"dialogues\",\n      \"label\": \"Performance Dialogues\",\n      \"segments\": [\n        {\n          \"name\": \"Team routine\",\n          \"score\": 2,\n          \"rag\": \"red\",\n          \"points\": [\n            \"There is no standing team meeting. Information moves by email and by walking over.\",\n            \"A daily stand-up was tried in 2025 and dropped after six weeks because it ran long and decided nothing.\"\n          ],\n          \"evidence\": \"Team lead interview, 3 Sep 2026.\"\n        },\n        {\n          \"name\": \"One-to-ones\",\n          \"score\": 3,\n          \"rag\": \"amber\",\n          \"points\": [\n            \"The team lead holds a monthly one-to-one with each handler and they are valued.\",\n            \"They cover workload and wellbeing, and rarely the handler's own numbers, because those are not available per person.\"\n          ],\n          \"evidence\": \"Team lead interview and four handler interviews, 3-4 Sep 2026.\"\n        },\n        {\n          \"name\": \"Escalation\",\n          \"score\": 3,\n          \"rag\": \"amber\",\n          \"points\": [\n            \"Complex claims have a clear escalation route to the technical referent and it works.\",\n            \"There is no equivalent route for a capacity problem, so a backlog builds until it is visible in the monthly pack.\"\n          ],\n          \"evidence\": \"Coordinator interview, 4 Sep 2026.\"\n        }\n      ]\n    },\n    {\n      \"key\": \"consequences\",\n      \"label\": \"Consequences & Recognition\",\n      \"segments\": [\n        {\n          \"name\": \"Follow-through on actions\",\n          \"score\": 2,\n          \"rag\": \"red\",\n          \"points\": [\n            \"Actions from the monthly review are recorded in the meeting notes and not tracked afterwards.\",\n            \"Of eleven actions logged since April, the team lead could confirm three as closed.\"\n          ],\n          \"evidence\": \"Meeting notes Apr-Aug 2026, walked through with the team lead.\"\n        },\n        {\n          \"name\": \"Recognition\",\n          \"score\": 3,\n          \"rag\": \"amber\",\n          \"points\": [\n            \"Good work is acknowledged warmly and in person, and handlers said so unprompted.\",\n            \"It is entirely informal, so it reaches whoever is nearest the team lead that week.\"\n          ],\n          \"evidence\": \"Handler interviews, 3-4 Sep 2026.\"\n        },\n        {\n          \"name\": \"Development link\",\n          \"score\": 2,\n          \"rag\": \"red\",\n          \"points\": [\n            \"Training is offered when a handler asks, and the budget was underspent last year.\",\n            \"Nothing connects a development conversation to what the numbers say about a handler's work.\"\n          ],\n          \"evidence\": \"Team lead interview, 3 Sep 2026.\"\n        }\n      ]\n    }\n  ],\n  \"gaps\": []\n};\n(function(){\n  var C={green:'var(--rag-green)',amber:'var(--rag-amber)',red:'var(--rag-red)',na:'var(--rag-na)'};\n  var PILL={green:['var(--tint-green)','var(--rag-green-text)','Good'],amber:['var(--tint-amber)','var(--rag-amber-text)','Fair'],red:['var(--tint-red)','var(--rag-red-text)','Weak'],na:['var(--tint-na)','var(--rag-na-text)','n/a']};\n  var SEQ=['vision','metrics','tracking','dialogues','consequences'];\n  var QMAP={vision:'Is the mission & vision clear?',metrics:'Translated into metrics & targets?',tracking:'Do we measure & visualise them?',dialogues:'Do we discuss performance?',consequences:'Do we act, reward & recognise?'};\n  function esc(t){return String(t==null?'':t).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}\n  function hl(t){return esc(t).replace(/\\*\\*(.+?)\\*\\*/g,'<span class=\"hl\">$1</span>');}\n  function mean(a){var f=a.filter(function(x){return x!=null;});return f.length?f.reduce(function(x,y){return x+y;},0)/f.length:null;}\n  function fx(v){return v==null?'n/a':v.toFixed(1);}\n  function segRag(s){return s==null?'na':(s<=2?'red':(s===3?'amber':'green'));}\n  function aggRag(v){return v==null?'na':(v<2.5?'red':(v<3.5?'amber':'green'));}\n  function verdict(v){return v==null?'n/a':v>=3.5?'Strong':v>=2.5?'Developing':v>=1.5?'Emerging':'At risk';}\n  function tline(){return getComputedStyle(document.getElementById('pw')).getPropertyValue('--line').trim();}\n\n  var byKey={}; DATA.aspects.forEach(function(a){byKey[a.key]=a;});\n  var steps=SEQ.filter(function(k){return byKey[k];}).map(function(k,i){var a=byKey[k],v=mean(a.segments.map(function(x){return x.score;}));\n    return {k:k,n:i+1,label:a.label,q:QMAP[k]||'',avg:v,rag:aggRag(v),segs:a.segments};});\n  var overall=mean(DATA.aspects.reduce(function(acc,a){return acc.concat(a.segments.map(function(x){return x.score;}));},[]));\n\n  function polar(cx,cy,r,d){var a=(d-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}\n  function sect(cx,cy,ri,ro,a0,a1){var p0=polar(cx,cy,ro,a0),p1=polar(cx,cy,ro,a1),p2=polar(cx,cy,ri,a1),p3=polar(cx,cy,ri,a0),la=(a1-a0)>180?1:0;\n    return 'M'+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A'+ro+' '+ro+' 0 '+la+' 1 '+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' L'+p2[0].toFixed(1)+' '+p2[1].toFixed(1)+' A'+ri+' '+ri+' 0 '+la+' 0 '+p3[0].toFixed(1)+' '+p3[1].toFixed(1)+' Z';}\n  function donut(active,color,size){var ri=16,ro=29,n=steps.length,slot=360/n,gp=7,g=tline(),s=[];\n    steps.forEach(function(st,i){var a0=i*slot+gp/2,a1=(i+1)*slot-gp/2;s.push('<path d=\"'+sect(30,30,ri,ro,a0,a1)+'\" fill=\"'+(i===active?color:g)+'\"/>');});\n    return '<svg width=\"'+size+'\" height=\"'+size+'\" viewBox=\"0 0 60 60\">'+s.join('')+'</svg>';}\n  function ladder(st){var f=st.avg==null?0:Math.round(st.avg),c='';for(var i=1;i<=5;i++){c+='<span class=\"lc\" style=\"background:'+(i<=f?C[st.rag]:'var(--slate-10)')+'\"></span>';}return '<div class=\"ladd\">'+c+'</div>';}\n  function scoreTag(s){var r=segRag(s);return '<span class=\"sub-sc\" style=\"color:'+C[r]+'\">'+(s==null?'n/a':s+'/5')+'</span>';}\n  function subItem(sg,quiet){var r=sg.rag||segRag(sg.score);\n    var body=sg.score==null?(quiet?'':'<div class=\"na\">Not assessed this round (to probe)</div>')\n      :'<ul class=\"ins\">'+(sg.points||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';\n    return '<div class=\"sub\"><div class=\"sub-h\"><span class=\"dot\" style=\"background:'+C[r]+'\"></span><span class=\"sub-nm\">'+esc(sg.name)+'</span>'+scoreTag(sg.score)+'</div>'+body+'</div>';}\n  function dimPill(st){var p=PILL[st.rag];return '<span class=\"chpill\" style=\"background:'+p[0]+';color:'+p[1]+'\">'+p[2]+(st.avg!=null?' · '+st.avg.toFixed(1)+'/5':'')+'</span>';}\n  // a dimension nobody probed says so ONCE, not once per subdimension\n  function allNa(st){return st.segs.length>0&&st.segs.every(function(x){return x.score==null;});}\n  function naNote(st){return allNa(st)?'<div class=\"na\">Not assessed this round.</div>':'';}\n  function card(st,lead){return '<div class=\"card\" data-ek=\"'+st.k+'\"><div class=\"step\">'+st.n+'</div>'+\n    '<div class=\"chd\">'+lead+'<div class=\"cnm\">'+esc(st.label)+'</div>'+dimPill(st)+'</div>'+\n    '<div class=\"cq\">'+esc(st.q)+'</div>'+ladder(st)+naNote(st)+'<div class=\"subs\">'+st.segs.map(function(sg){return subItem(sg,allNa(st));}).join('')+'</div></div>';}\n  function renderCycle(){return '<div class=\"grid\">'+steps.map(function(st){return card(st,donut(st.n-1,C[st.rag],60));}).join('')+'</div>';}\n  function renderFlow(){var p,cp;\n    var ribbon='<div class=\"ribbon\">'+steps.map(function(st,i){p=PILL[st.rag];\n      cp=i===0?'polygon(0 0,calc(100% - 15px) 0,100% 50%,calc(100% - 15px) 100%,0 100%)':'polygon(0 0,calc(100% - 15px) 0,100% 50%,calc(100% - 15px) 100%,0 100%,15px 50%)';\n      return '<div class=\"chev\" style=\"background:'+p[0]+';clip-path:'+cp+';padding-left:'+(i===0?'16':'26')+'px\"><div class=\"ct\"><span class=\"nb\" style=\"background:'+C[st.rag]+'\">'+st.n+'</span>'+esc(st.label)+'</div><div class=\"cq2\">'+esc(st.q)+'</div><span class=\"chpill\" style=\"background:'+p[0]+';color:'+p[1]+'\">'+p[2]+'</span></div>';\n    }).join('')+'</div>';\n    var cards='<div class=\"grid\">'+steps.map(function(st){return card(st,'<div class=\"lead-n\" style=\"background:'+C[st.rag]+'\">'+st.n+'</div>');}).join('')+'</div>';\n    return ribbon+cards;}\n\n  function clWrap(t){var w=String(t).split(' '),L=[],c='';w.forEach(function(x){if((c+' '+x).trim().length>13){L.push(c.trim());c=x;}else{c=(c+' '+x).trim();}});if(c)L.push(c);return L.slice(0,2);}\n  function clPath(cx,cy,ri,ro,a0,a1,pa){var mid=(ri+ro)/2,o0=polar(cx,cy,ro,a0),o1=polar(cx,cy,ro,a1),i1=polar(cx,cy,ri,a1),i0=polar(cx,cy,ri,a0),tip=polar(cx,cy,mid,a1+pa),nt=polar(cx,cy,mid,a0+pa),la=(a1-a0)>180?1:0;function f(q){return q[0].toFixed(1)+' '+q[1].toFixed(1);}\n    return 'M'+f(o0)+' A'+ro+' '+ro+' 0 '+la+' 1 '+f(o1)+' L'+f(tip)+' L'+f(i1)+' A'+ri+' '+ri+' 0 '+la+' 0 '+f(i0)+' L'+f(nt)+' Z';}\n  function clText(x,y,lines,color,fs){var dy=lines.length>1?-2:4;return '<text class=\"cl-lbl\" data-fs=\"'+fs+'\" x=\"'+x.toFixed(1)+'\" y=\"'+y.toFixed(1)+'\" fill=\"'+color+'\" font-size=\"'+fs+'\" font-weight=\"700\" text-anchor=\"middle\">'+lines.map(function(t,i){return '<tspan x=\"'+x.toFixed(1)+'\" dy=\"'+(i===0?dy:12.5)+'\">'+esc(t)+'</tspan>';}).join('')+'</text>';}\n  // A label is drawn horizontally inside a ring, so a long word runs off the band and turns\n  // white-on-white (\"Consequences & Recognition\" did exactly that). Shrink each label until all\n  // four corners of its box sit inside the annulus. Measured, not estimated, so it holds for any label.\n  function fitClassicLabels(root){var svg=root.querySelector('.classic svg');if(!svg)return;\n    var cx=+svg.getAttribute('data-cx'),cy=+svg.getAttribute('data-cy'),ri=+svg.getAttribute('data-ri'),ro=+svg.getAttribute('data-ro');\n    if(!ro)return;\n    Array.prototype.forEach.call(svg.querySelectorAll('text.cl-lbl'),function(t){\n      var base=+t.getAttribute('data-fs')||10.5,sp=t.querySelectorAll('tspan'),n=sp.length;\n      for(var fs=base;fs>=7;fs-=0.25){\n        t.setAttribute('font-size',fs);\n        var lead=12.5*fs/base,first=n>1?-2*fs/base:4*fs/base;\n        for(var i=0;i<n;i++){sp[i].setAttribute('dy',i===0?first:lead);}\n        var bb;try{bb=t.getBBox();}catch(e){return;}\n        var pts=[[bb.x,bb.y],[bb.x+bb.width,bb.y],[bb.x,bb.y+bb.height],[bb.x+bb.width,bb.y+bb.height]],ok=true;\n        for(var k=0;k<4;k++){var d=Math.sqrt(Math.pow(pts[k][0]-cx,2)+Math.pow(pts[k][1]-cy,2));if(d<ri||d>ro){ok=false;break;}}\n        if(ok)return;\n      }\n    });\n  }\n  function clBadge(x,y,n,bg,fg){return '<circle cx=\"'+x.toFixed(1)+'\" cy=\"'+y.toFixed(1)+'\" r=\"12\" fill=\"'+bg+'\" stroke=\"var(--wheel-ring)\" stroke-width=\"2\"/><text x=\"'+x.toFixed(1)+'\" y=\"'+(y+4.5).toFixed(1)+'\" fill=\"'+fg+'\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">'+n+'</text>';}\n  function renderClassic(){\n    var cx=290,cy=280,ri=80,ro=156,pa=12,mid=(ri+ro)/2,n=steps.length,slot=360/n,start=-slot/2,g=[];\n    steps.forEach(function(z,i){var fill=z.k==='vision'?'var(--green)':'var(--wheel-seg)';g.push('<path d=\"'+clPath(cx,cy,ri,ro,start+i*slot,start+(i+1)*slot,pa)+'\" fill=\"'+fill+'\" stroke=\"var(--wheel-ring)\" stroke-width=\"3\"/>');});\n    steps.forEach(function(z,i){var ac=start+(i+0.5)*slot,lp=polar(cx,cy,mid,ac);g.push(clText(lp[0],lp[1],clWrap(z.label),'#fff',10.5));});\n    steps.forEach(function(z,i){var bp=polar(cx,cy,mid,start+(i+0.8)*slot);g.push(clBadge(bp[0],bp[1],z.n,'var(--wheel-badge-bg)','var(--navy)'));});\n    var ring='<svg viewBox=\"0 0 580 560\" width=\"100%\" data-cx=\"'+cx+'\" data-cy=\"'+cy+'\" data-ri=\"'+ri+'\" data-ro=\"'+ro+'\" style=\"max-width:520px;display:block;margin:0 auto\">'+g.join('')+'</svg>';\n    function blk(st){var pl=PILL[st.rag];return '<div class=\"cl-blk\" data-ek=\"'+st.k+'\"><div class=\"cl-h\"><span class=\"cl-num\">'+st.n+'</span><span class=\"cl-n\">'+esc(st.label)+'</span><span class=\"chpill\" style=\"background:'+pl[0]+';color:'+pl[1]+'\">'+(st.avg!=null?st.avg.toFixed(1)+'/5':'n/a')+'</span></div><div class=\"cl-q\">'+esc(st.q)+'</div>'+ladder(st)+'<ul class=\"ins\">'+st.segs.map(function(sg){var nm='<b>'+esc(sg.name)+'</b>',r=sg.rag||segRag(sg.score),sc=sg.score==null?'<span style=\"color:var(--mut);font-style:italic\">n/a</span>':'<span style=\"color:'+C[r]+';font-weight:700\">'+sg.score+'/5</span>';return sg.score==null?'<li style=\"--bc:'+C[r]+'\">'+nm+' '+sc+'</li>':'<li style=\"--bc:'+C[r]+'\">'+nm+' '+sc+': '+esc((sg.points||[]).join(' '))+'</li>';}).join('')+'</ul></div>';}\n    function col(keys){return '<div class=\"cl-col\">'+keys.map(function(k){var st=null;steps.forEach(function(z){if(z.k===k)st=z;});return st?blk(st):'';}).join('')+'</div>';}\n    return '<div class=\"classic\">'+col(['vision','consequences','dialogues'])+ring+col(['metrics','tracking'])+'</div>';\n  }\n  // DATA.gaps is the coverage record. It used to be accepted and never drawn, so a\n  // subdimension nobody probed vanished from the page. It renders under every view now.\n  function renderGaps(){var g=(DATA.gaps||[]).filter(function(x){return x&&String(x).trim();});\n    if(!g.length)return '';\n    return '<div class=\"gapbar\"><b>Still to probe</b><ul>'+g.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';}\n  var VIEWS={cycle:renderCycle,flow:renderFlow,classic:renderClassic},cur='cycle';\n  document.getElementById('ctx').textContent=DATA.context||'OPEX QUICKSCAN';\n  document.getElementById('lens').textContent=DATA.lens||'PERFORMANCE WHEEL';\n  document.getElementById('title').innerHTML=hl(DATA.keyMessage||'');\n  document.getElementById('subt').textContent=DATA.teamName||'';\n  document.getElementById('src').innerHTML=DATA.source?('<b style=\"color:var(--txt)\">Source:</b> '+DATA.source):'';\n  document.getElementById('lg').innerHTML='<b style=\"color:var(--txt);margin-right:4px\">Legend:</b>'+['green','amber','red'].map(function(k){var p=PILL[k],lab={green:'Good 4–5',amber:'Fair 3',red:'Weak 1–2'}[k];return '<span class=\"lp\" style=\"background:'+p[0]+';color:'+p[1]+'\">● '+lab+'</span>';}).join('');\n\n  function fitView(){var v=document.getElementById('view'),vi=document.getElementById('vinner');\n    var ah=v.clientHeight;if(!ah)return;\n    var st=vi.querySelector('[data-stretch]'); if(st)st.style.height='';\n    vi.style.transform='none';\n    // The width-trick (widen, then scale back) makes content height depend on the scale, which makes an\n    // iterative fit oscillate and sometimes overshoot (bottom clips). H*s is monotonic in s, so binary-search\n    // the LARGEST scale whose content still fits the frame height with a safety gap. Cannot overshoot.\n    var lo=0.25,hi=1.12,best=0.25;\n    for(var k=0;k<12;k++){\n      var s=(lo+hi)/2;\n      vi.style.width=(100/s)+'%';\n      var H=vi.scrollHeight;\n      if(H*s<=ah-10){best=s;lo=s;}else{hi=s;}\n    }\n    vi.style.width=(100/best)+'%';vi.style.transform='scale('+best+')';\n    if(st){var free=(ah-10)/best-vi.scrollHeight; if(free>1)st.style.height=(st.offsetHeight+free)+'px';}}\n  function render(){var vi=document.getElementById('vinner');vi.innerHTML=VIEWS[cur]()+renderGaps();if(cur==='classic')fitClassicLabels(vi);requestAnimationFrame(fitView);setTimeout(fitView,60);}\n  function seg(id,attr,cb){var box=document.getElementById(id);box.querySelectorAll('button').forEach(function(b){b.onclick=function(){box.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');cb(b.getAttribute(attr));};});}\n  seg('views','data-v',function(v){cur=v;render();});\n  seg('theme','data-s',function(t){document.getElementById('pw').setAttribute('data-t',t);render();});\n  window.addEventListener('resize',fitView);\n\n  render();\n})();\n<\/script>\n</body></html>\n","skills-wheel-builder":"<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Skills Wheel</title>\n<style>\n  *{box-sizing:border-box}\n  :root{--page:#FFF}\n  html,body{margin:0;height:100vh;overflow:hidden}\n  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}\n  /* ===== NR BRAND THEME (inlined from brand.css; swap for a client template) ===== */\n  #pw{--navy:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;\n      --slate-10:rgba(54,65,86,.09);--rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;--rag-green-text:#2F8F6B;--rag-amber-text:#B07A1E;--rag-red-text:#C2483D;--rag-na-text:#6B7480;--tint-green:rgba(47,143,107,.15);--tint-amber:rgba(212,154,58,.18);--tint-red:rgba(210,100,90,.16);--tint-na:rgba(154,164,176,.16);--navy-fill:#0B2347;--wheel-seg:var(--navy);--wheel-ring:#fff;--wheel-badge-bg:#fff;\n      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;\n      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);\n      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;\n      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}\n  #pw[data-t=\"dark\"]{--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A1B2;--line:#2A3744;--navy-fill:#243246;--accent:#8FC7E8;--steel:#93A9C4;--rag-green:#5FBF94;--rag-amber:#E8B96A;--rag-red:#F0968C;--rag-na:#9AA8B8;--rag-green-text:#5FBF94;--rag-amber-text:#E8B96A;--rag-red-text:#F0968C;--rag-na-text:#9AA8B8;--tint-green:rgba(95,191,148,.15);--tint-amber:rgba(232,185,106,.15);--tint-red:rgba(240,150,140,.14);--tint-na:rgba(148,161,178,.15);--wheel-seg:#2E5C8A;--wheel-ring:rgba(234,239,245,.28);--wheel-badge-bg:#EAEFF5;--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -24px rgba(0,0,0,.6)}\n  body:has(#pw[data-t=\"dark\"]){--page:#0E1620}\n  .nr-rail{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--navy-fill)}\n  .toprow{position:absolute;top:22px;left:0;right:40px;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:3}\n  .tags{display:flex;align-items:center;gap:11px;min-width:0}\n  .nr-pill{display:inline-flex;align-items:center;gap:11px;background:var(--green);padding:10px 22px 10px 14px;border-radius:0 9px 9px 0}\n  .nr-pill img{height:21px;filter:brightness(0) invert(1)}\n  .nr-pill b{color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px}\n  .nr-track{background:#E3E8EF;color:var(--navy);font-weight:700;font-size:11.5px;letter-spacing:.8px;padding:9px 16px;border-radius:8px}\n  #pw[data-t=\"dark\"] .nr-track{background:#243246;color:#EAEFF5}\n  .seg{display:flex;background:var(--slate-10);border-radius:999px;padding:3px}\n  .seg button{font-size:12px;font-weight:600;border:none;background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;cursor:pointer}\n  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}\n  .ctrls{display:flex;gap:9px;flex:none}\n  h1{font-size:clamp(20px,1.85vw,28px);font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.24;margin:0;max-width:1300px}\n  #pw[data-t=\"dark\"] h1{color:#EAEFF5}\n  #pw[data-t=\"dark\"] .nb,#pw[data-t=\"dark\"] .lead-n{color:#16202C}\n  h1 .hl{color:var(--green)}\n  .subrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 16px}\n  .subt{font-size:15px;font-weight:600;color:var(--accent)}\n  /* body / cards */\n  #view{flex:1;min-height:0;position:relative;overflow:hidden}\n  #vinner{position:absolute;top:0;left:0;width:100%;transform-origin:top left;padding-bottom:24px}\n  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;align-items:stretch}\n  @media(max-width:1280px){.grid{grid-template-columns:repeat(3,1fr)}}\n  @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}\n  .card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:20px 20px 18px;position:relative}\n  .step{position:absolute;top:13px;left:14px;width:23px;height:23px;border-radius:50%;background:var(--slate-10);color:var(--mut);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}\n  .chd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:13px}\n  .cnm{font-size:18px;font-weight:600;color:var(--ink);line-height:1.2}\n  .cq{font-size:13px;color:var(--mut);line-height:1.35;margin-bottom:11px}\n  .ladd{display:flex;gap:4px;margin:1px 0 15px}\n  .lc{flex:1;height:7px;border-radius:4px}\n  .subs{flex:1;display:flex;flex-direction:column;gap:16px}\n  .sub-h{display:flex;align-items:center;gap:8px}\n  .dot{flex:none;width:8px;height:8px;border-radius:50%}\n  .sub-nm{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink);line-height:1.25}\n  .sub-sc{flex:none;font-size:13.5px;font-weight:700}\n  .ins{list-style:none;margin:5px 0 0;padding:0}\n  .ins li{position:relative;padding-left:15px;font-size:14px;color:var(--txt);line-height:1.45;margin:4px 0}\n  .ins li::before{content:\"\";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--mut);opacity:.5}\n  .na{font-size:13.5px;color:var(--mut);font-style:italic;margin:5px 0 0;line-height:1.4}\n  /* coverage strip: what was not probed, shown under every view (never a silent blank) */\n  .gapbar{margin-top:16px;border:1px dashed var(--line);border-radius:12px;background:var(--card);padding:11px 14px 12px}\n  .gapbar b{font-size:12.5px;color:var(--ink);letter-spacing:.02em}\n  .gapbar ul{list-style:none;margin:5px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 26px}\n  .gapbar li{font-size:13px;color:var(--mut);line-height:1.45;position:relative;padding-left:12px}\n  .gapbar li:before{content:\"\";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--rag-na-text)}\n  .lead-n{width:44px;height:44px;border-radius:50%;color:#fff;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center}\n  .ribbon{display:flex;gap:0;margin-bottom:22px;overflow-x:auto}\n  .chev{flex:1;min-width:150px;padding:13px 16px;margin-left:-10px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}\n  .chev:first-child{margin-left:0}\n  .chev .ct{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;line-height:1.2}\n  .chev .cq2{font-size:12px;color:var(--txt);line-height:1.32;opacity:.85}\n  .nb{flex:none;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}\n  .chpill{align-self:flex-start;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:999px;margin-top:3px}\n  /* footer: source + legend bottom-left, trademark bottom-right */\n  #ft{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:12px;font-size:clamp(9.5px,0.75vw,12px);color:var(--mut)}\n  #ft .l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}\n  #ft .ov b{color:var(--ink)}\n  .legend{display:flex;gap:7px}\n  .lp{font-size:0.95em;font-weight:600;padding:0.2em 0.85em;border-radius:999px}\n  .conf{font-size:0.88em;letter-spacing:.5px;font-weight:600}\n  /* classic cyclic-arrow view */\n  .classic{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,500px) minmax(0,1fr);gap:16px;align-items:start}\n  .classic>svg{align-self:center}\n  .cl-col{display:flex;flex-direction:column;gap:14px}\n  .cl-h{display:flex;align-items:center;gap:8px;margin-bottom:1px}\n  .cl-num{flex:none;display:inline-flex;width:19px;height:19px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center}\n  #pw[data-t=\"dark\"] .cl-num{background:var(--accent);color:var(--navy)}\n  .cl-n{font-size:13.5px;font-weight:700;color:var(--navy)}\n  #pw[data-t=\"dark\"] .cl-n{color:#EAEFF5}\n  .cl-q{font-size:11.5px;font-style:italic;color:var(--mut);margin:0 0 4px 27px}\n  .classic .ins{margin-left:27px}\n  .classic .ladd{margin:3px 0 9px 27px;max-width:200px}\n  .classic .ins li{font-size:12.5px;line-height:1.4}\n  .classic .ins li::before{background:var(--bc,var(--mut));opacity:1;width:6px;height:6px;top:7px}\n  @media(max-width:1100px){\n    .classic{grid-template-columns:1fr 1fr;justify-items:start;gap:14px 26px}\n    .classic>svg{grid-column:1/-1;order:-1;max-width:380px;justify-self:center;margin-bottom:4px}\n  }\n  @media(max-width:680px){\n    .classic{grid-template-columns:1fr}\n    .classic>svg{max-width:320px}\n  }\n  /* -- responsive chrome: on a narrow screen the absolute toprow would collide, so drop it\n     into normal flow and let it wrap (applies to every artifact that uses this chrome) -- */\n  @media (max-width:760px){\n    #art,#pm,#pw{padding:14px 18px 10px 42px}\n    .nr-rail{width:24px}\n    .toprow{position:static;top:auto;right:auto;margin:0 0 12px;flex-wrap:wrap;justify-content:flex-start;gap:10px 12px}\n    .tags{flex-wrap:wrap;gap:8px;margin-left:-42px}\n    .ctrls{flex-wrap:wrap;gap:8px;flex:1 1 100%}\n  }\n  \n\n</style></head>\n<body>\n<div id=\"pw\" data-t=\"light\">\n  <div class=\"nr-rail\"></div>\n  <div class=\"toprow\">\n    <div class=\"tags\">\n      <div class=\"nr-pill\"><img alt=\"Nova Reperta\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEkAAAAvCAYAAACv3uebAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAFxEAABcRAcom8z8AAAzdSURBVGhD7VoL9KVTFfdINXlNBnmOZzRUXolMnomIjEYpkhiP8mZFHsWEVnqoaJWKUIkQSS9KL1lSxptVaDBFXiPTPN3v27/faf0+e1/7nvmPaVXKX/Zad917z9lnn/Pt75z9+O2zwAIvYCqlvIbkBAAXm9ldZvYYgEcB3A7g2yT3Jvnqetz/BZHcEsAlAP5e5kNm9gSAC0huUst5QVIp5RUATgUws1LE/QCuA/AjfczsegBTMg+AJ0keX0p5aS33BUOllFcCuKh68O+b2ftIrlHzk1zLzPYG8JNqzNdLKYvV/MOe9PYBXJge9H4z2+Of2RUkR5jZvmb21zT+nFLKwjXvsKZSysR4QDO7heS6qW9hktuR/CiALwI408yOJ7l1KWXB4GuaZiMAdyU5R/UnGO5EclMA0/3B/iSPlvpkwK8GMCsePkhjAPwgG+xSihT1F5c1leTr+hMNVyqlLBLHDEBLcrfoI/leAE9UinkwHyuRmT3Stu0uMU5HL/Gf059suFIpZf3wZAC+V0pZSO1t224DYEZ6WLn4t5Ic0+v11iW5I4BLk6KebJpmY42dNGmSFH+Ntz9KcqV63mFFJI9yJ g\" id=\"views\"><button data-v=\"cycle\" class=\"on\">Cycle</button><button data-v=\"flow\">Flow</button><button data-v=\"classic\">Classic</button></div>\n      <div class=\"seg\" id=\"theme\"><button data-s=\"light\" class=\"on\">Light</button><button data-s=\"dark\">Dark</button></div>\n    </div>\n  </div>\n  <h1 id=\"title\"></h1>\n  <div class=\"subrow\"><div class=\"subt\" id=\"subt\"></div></div>\n  <div id=\"view\"><div id=\"vinner\"></div></div>\n  \n  <div id=\"ft\">\n    <div class=\"l\"><span id=\"src\"></span><div class=\"legend\" id=\"lg\"></div></div>\n    <span class=\"conf\">Sample data · Northwind Assurance is fictional</span>\n  </div>\n</div>\n\n<script>\nconst DATA = /* DATA */ {\n  \"context\": \"OPEX QUICKSCAN\",\n  \"lens\": \"MGMT · SKILLS WHEEL\",\n  \"teamName\": \"Claims Handling\",\n  \"source\": \"Team lead, technical referent, two coordinators and four handlers across tenure levels, 3-4 Sep 2026\",\n  \"keyMessage\": \"Claims Handling has more technical skill than it can see: the knowledge is real and generously shared, but none of it is defined, recorded or planned, so it moves only where people happen to sit and stops when someone leaves.\",\n  \"aspects\": [\n    {\n      \"key\": \"target\",\n      \"label\": \"Mission & Target Condition\",\n      \"segments\": [\n        {\n          \"name\": \"Target skill ambition\",\n          \"score\": 2,\n          \"rag\": \"red\",\n          \"points\": [\n            \"No statement exists of what a fully skilled claims handler should be able to do.\",\n            \"The team lead described the ambition as 'everyone able to take any file', which no document supports.\"\n          ],\n          \"evidence\": \"Team lead interview, 3 Sep 2026; no competence document found in the team drive\"\n        },\n        {\n          \"name\": \"Shopfloor translation\",\n          \"score\": 2,\n          \"rag\": \"red\",\n          \"points\": [\n            \"Handlers were not able to say what skill level they are working towards.\",\n            \"Two of the four assumed the answer was 'the next grade', which is a pay band, not a skill.\"\n          ],\n          \"evidence\": \"Four handler interviews across tenure, 3-4 Sep 2026\"\n        }\n      ]\n    },\n    {\n      \"key\": \"roles\",\n      \"label\": \"Roles & Skills\",\n      \"segments\": [\n        {\n          \"name\": \"Role & competence definitions\",\n          \"score\": 3,\n          \"rag\": \"amber\",\n          \"points\": [\n            \"Three roles are distinguished in practice: handler, technical referent and coordinator.\",\n            \"Only the coordinator role has a written description, and it dates from a 2021 reorganisation.\"\n          ],\n          \"evidence\": \"HR role library, reviewed 4 Sep 2026; coordinator interview\"\n        },\n        {\n          \"name\": \"Skill matrix & tracking\",\n          \"score\": 2,\n          \"rag\": \"red\",\n          \"points\": [\n            \"No skill matrix exists for the team.\",\n            \"Who can handle which claim type lives in the coordinators' heads, and both said allocation depends on that.\"\n          ],\n          \"evidence\": \"Coordinator interview, 4 Sep 2026\"\n        }\n      ]\n    },\n    {\n      \"key\": \"objectives\",\n      \"label\": \"Objectives & Development Plans\",\n      \"segments\": [\n        {\n          \"name\": \"Development objectives (SMART)\",\n          \"score\": 2,\n          \"rag\": \"red\",\n          \"points\": [\n            \"Development goals are set once a year in the appraisal and are written as intentions rather than outcomes.\",\n            \"Three of four handlers could not recall their current goal without opening the form.\"\n          ],\n          \"evidence\": \"Handler interviews, 3-4 Sep 2026; two appraisal forms reviewed with consent\"\n        },\n        {\n          \"name\": \"Development & training plans\",\n          \"score\": 3,\n          \"rag\": \"amber\",\n          \"points\": [\n            \"A catalogue of technical courses exists and handlers can book from it themselves.\",\n            \"There is no plan per person, so what gets booked follows interest rather than a gap.\"\n          ],\n          \"evidence\": \"Learning catalogue reviewed, 4 Sep 2026; team lead interview\"\n        },\n        {\n          \"name\": \"Follow-up rhythm\",\n          \"score\": 2,\n          \"rag\": \"red\",\n          \"points\": [\n            \"Development is revisited at the annual appraisal and not in the monthly one-to-one.\",\n            \"The team lead said she would rather discuss it more often but has no prompt to do so.\"\n          ],\n          \"evidence\": \"Team lead interview, 3 Sep 2026\"\n        }\n      ]\n    },\n    {\n      \"key\": \"building\",\n      \"label\": \"Skill Building & Review\",\n      \"segments\": [\n        {\n          \"name\": \"Onboarding & time-to-operational\",\n          \"score\": 3,\n          \"rag\": \"amber\",\n          \"points\": [\n            \"New handlers sit beside an experienced colleague for their first weeks and everyone rated this highly.\",\n            \"Nobody could say how long it should take to become independent, so nobody knows whether ten weeks is good.\"\n          ],\n          \"evidence\": \"Two newcomer interviews (under 12 months), 4 Sep 2026\"\n        },\n        {\n          \"name\": \"Coaching & training model\",\n          \"score\": 3,\n          \"rag\": \"amber\",\n          \"points\": [\n            \"The technical referent coaches on complex files and is generous with time.\",\n            \"It is entirely pull-based: a handler who does not ask is not coached, and the newest two said they hesitate.\"\n          ],\n          \"evidence\": \"Technical referent and newcomer interviews, 4 Sep 2026\"\n        },\n        {\n          \"name\": \"Standards & best-practice sharing\",\n          \"score\": 2,\n          \"rag\": \"red\",\n          \"points\": [\n            \"There is no forum where handlers compare how they treat a case type.\",\n            \"Two handlers described different rules for the same fraud-indicator threshold, and both were confident.\"\n          ],\n          \"evidence\": \"Handler interviews, 3-4 Sep 2026\"\n        }\n      ]\n    },\n    {\n      \"key\": \"consequences\",\n      \"label\": \"Consequences & Recognition\",\n      \"segments\": [\n        {\n          \"name\": \"Skill–performance link\",\n          \"score\": 2,\n          \"rag\": \"red\",\n          \"points\": [\n            \"Nothing connects a handler's skill profile to what their work shows, because neither is recorded per person.\",\n            \"The appraisal rating is set from the team lead's overall impression.\"\n          ],\n          \"evidence\": \"Team lead interview, 3 Sep 2026\"\n        },\n        {\n          \"name\": \"Recognition & career paths\",\n          \"score\": 3,\n          \"rag\": \"amber\",\n          \"points\": [\n            \"The step from handler to technical referent is real, visible and respected in the team.\",\n            \"It is the only step. Handlers not aiming at it described their horizon as 'the same job, better at it'.\"\n          ],\n          \"evidence\": \"Handler interviews across tenure, 3-4 Sep 2026\"\n        }\n      ]\n    }\n  ],\n  \"gaps\": [\n    \"Roles & Skills · What claim types can each handler take today, and who decides?\",\n    \"Skill Building & Review · How long should it take a newcomer to work independently?\"\n  ]\n};\n(function(){\n  var C={green:'var(--rag-green)',amber:'var(--rag-amber)',red:'var(--rag-red)',na:'var(--rag-na)'};\n  var PILL={green:['var(--tint-green)','var(--rag-green-text)','Good'],amber:['var(--tint-amber)','var(--rag-amber-text)','Fair'],red:['var(--tint-red)','var(--rag-red-text)','Weak'],na:['var(--tint-na)','var(--rag-na-text)','n/a']};\n  var SEQ=['target','roles','objectives','building','consequences'];\n  var QMAP={target:'Is there a target skill condition?',roles:'Do we know required & actual skills?',objectives:'Does everyone have a development plan?',building:'How are skills built & shared?',consequences:'Do skills count & get rewarded?'};\n  function esc(t){return String(t==null?'':t).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}\n  function hl(t){return esc(t).replace(/\\*\\*(.+?)\\*\\*/g,'<span class=\"hl\">$1</span>');}\n  function mean(a){var f=a.filter(function(x){return x!=null;});return f.length?f.reduce(function(x,y){return x+y;},0)/f.length:null;}\n  function fx(v){return v==null?'n/a':v.toFixed(1);}\n  function segRag(s){return s==null?'na':(s<=2?'red':(s===3?'amber':'green'));}\n  function aggRag(v){return v==null?'na':(v<2.5?'red':(v<3.5?'amber':'green'));}\n  function verdict(v){return v==null?'n/a':v>=3.5?'Strong':v>=2.5?'Developing':v>=1.5?'Emerging':'At risk';}\n  function tline(){return getComputedStyle(document.getElementById('pw')).getPropertyValue('--line').trim();}\n\n  var byKey={}; DATA.aspects.forEach(function(a){byKey[a.key]=a;});\n  var steps=SEQ.filter(function(k){return byKey[k];}).map(function(k,i){var a=byKey[k],v=mean(a.segments.map(function(x){return x.score;}));\n    return {k:k,n:i+1,label:a.label,q:QMAP[k]||'',avg:v,rag:aggRag(v),segs:a.segments};});\n  var overall=mean(DATA.aspects.reduce(function(acc,a){return acc.concat(a.segments.map(function(x){return x.score;}));},[]));\n\n  function polar(cx,cy,r,d){var a=(d-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}\n  function sect(cx,cy,ri,ro,a0,a1){var p0=polar(cx,cy,ro,a0),p1=polar(cx,cy,ro,a1),p2=polar(cx,cy,ri,a1),p3=polar(cx,cy,ri,a0),la=(a1-a0)>180?1:0;\n    return 'M'+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A'+ro+' '+ro+' 0 '+la+' 1 '+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' L'+p2[0].toFixed(1)+' '+p2[1].toFixed(1)+' A'+ri+' '+ri+' 0 '+la+' 0 '+p3[0].toFixed(1)+' '+p3[1].toFixed(1)+' Z';}\n  function donut(active,color,size){var ri=16,ro=29,n=steps.length,slot=360/n,gp=7,g=tline(),s=[];\n    steps.forEach(function(st,i){var a0=i*slot+gp/2,a1=(i+1)*slot-gp/2;s.push('<path d=\"'+sect(30,30,ri,ro,a0,a1)+'\" fill=\"'+(i===active?color:g)+'\"/>');});\n    return '<svg width=\"'+size+'\" height=\"'+size+'\" viewBox=\"0 0 60 60\">'+s.join('')+'</svg>';}\n  function ladder(st){var f=st.avg==null?0:Math.round(st.avg),c='';for(var i=1;i<=5;i++){c+='<span class=\"lc\" style=\"background:'+(i<=f?C[st.rag]:'var(--slate-10)')+'\"></span>';}return '<div class=\"ladd\">'+c+'</div>';}\n  function scoreTag(s){var r=segRag(s);return '<span class=\"sub-sc\" style=\"color:'+C[r]+'\">'+(s==null?'n/a':s+'/5')+'</span>';}\n  function subItem(sg,quiet){var r=sg.rag||segRag(sg.score);\n    var body=sg.score==null?(quiet?'':'<div class=\"na\">Not assessed this round (to probe)</div>')\n      :'<ul class=\"ins\">'+(sg.points||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';\n    return '<div class=\"sub\"><div class=\"sub-h\"><span class=\"dot\" style=\"background:'+C[r]+'\"></span><span class=\"sub-nm\">'+esc(sg.name)+'</span>'+scoreTag(sg.score)+'</div>'+body+'</div>';}\n  function dimPill(st){var p=PILL[st.rag];return '<span class=\"chpill\" style=\"background:'+p[0]+';color:'+p[1]+'\">'+p[2]+(st.avg!=null?' · '+st.avg.toFixed(1)+'/5':'')+'</span>';}\n  // a dimension nobody probed says so ONCE, not once per subdimension\n  function allNa(st){return st.segs.length>0&&st.segs.every(function(x){return x.score==null;});}\n  function naNote(st){return allNa(st)?'<div class=\"na\">Not assessed this round.</div>':'';}\n  function card(st,lead){return '<div class=\"card\" data-ek=\"'+st.k+'\"><div class=\"step\">'+st.n+'</div>'+\n    '<div class=\"chd\">'+lead+'<div class=\"cnm\">'+esc(st.label)+'</div>'+dimPill(st)+'</div>'+\n    '<div class=\"cq\">'+esc(st.q)+'</div>'+ladder(st)+naNote(st)+'<div class=\"subs\">'+st.segs.map(function(sg){return subItem(sg,allNa(st));}).join('')+'</div></div>';}\n  function renderCycle(){return '<div class=\"grid\">'+steps.map(function(st){return card(st,donut(st.n-1,C[st.rag],60));}).join('')+'</div>';}\n  function renderFlow(){var p,cp;\n    var ribbon='<div class=\"ribbon\">'+steps.map(function(st,i){p=PILL[st.rag];\n      cp=i===0?'polygon(0 0,calc(100% - 15px) 0,100% 50%,calc(100% - 15px) 100%,0 100%)':'polygon(0 0,calc(100% - 15px) 0,100% 50%,calc(100% - 15px) 100%,0 100%,15px 50%)';\n      return '<div class=\"chev\" style=\"background:'+p[0]+';clip-path:'+cp+';padding-left:'+(i===0?'16':'26')+'px\"><div class=\"ct\"><span class=\"nb\" style=\"background:'+C[st.rag]+'\">'+st.n+'</span>'+esc(st.label)+'</div><div class=\"cq2\">'+esc(st.q)+'</div><span class=\"chpill\" style=\"background:'+p[0]+';color:'+p[1]+'\">'+p[2]+'</span></div>';\n    }).join('')+'</div>';\n    var cards='<div class=\"grid\">'+steps.map(function(st){return card(st,'<div class=\"lead-n\" style=\"background:'+C[st.rag]+'\">'+st.n+'</div>');}).join('')+'</div>';\n    return ribbon+cards;}\n\n  function clWrap(t){var w=String(t).split(' '),L=[],c='';w.forEach(function(x){if((c+' '+x).trim().length>13){L.push(c.trim());c=x;}else{c=(c+' '+x).trim();}});if(c)L.push(c);return L.slice(0,3);}\n  function clPath(cx,cy,ri,ro,a0,a1,pa){var mid=(ri+ro)/2,o0=polar(cx,cy,ro,a0),o1=polar(cx,cy,ro,a1),i1=polar(cx,cy,ri,a1),i0=polar(cx,cy,ri,a0),tip=polar(cx,cy,mid,a1+pa),nt=polar(cx,cy,mid,a0+pa),la=(a1-a0)>180?1:0;function f(q){return q[0].toFixed(1)+' '+q[1].toFixed(1);}\n    return 'M'+f(o0)+' A'+ro+' '+ro+' 0 '+la+' 1 '+f(o1)+' L'+f(tip)+' L'+f(i1)+' A'+ri+' '+ri+' 0 '+la+' 0 '+f(i0)+' L'+f(nt)+' Z';}\n  function clText(x,y,lines,color,fs){var dy=lines.length>2?-8:lines.length>1?-2:4;return '<text x=\"'+x.toFixed(1)+'\" y=\"'+y.toFixed(1)+'\" fill=\"'+color+'\" font-size=\"'+fs+'\" font-weight=\"700\" text-anchor=\"middle\">'+lines.map(function(t,i){return '<tspan x=\"'+x.toFixed(1)+'\" dy=\"'+(i===0?dy:12.5)+'\">'+esc(t)+'</tspan>';}).join('')+'</text>';}\n  function clBadge(x,y,n,bg,fg){return '<circle cx=\"'+x.toFixed(1)+'\" cy=\"'+y.toFixed(1)+'\" r=\"12\" fill=\"'+bg+'\" stroke=\"var(--wheel-ring)\" stroke-width=\"2\"/><text x=\"'+x.toFixed(1)+'\" y=\"'+(y+4.5).toFixed(1)+'\" fill=\"'+fg+'\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">'+n+'</text>';}\n  function renderClassic(){\n    var cx=290,cy=280,ri=80,ro=156,pa=12,mid=(ri+ro)/2,n=steps.length,slot=360/n,start=-slot/2,g=[];\n    steps.forEach(function(z,i){var fill=z.k==='target'?'var(--green)':'var(--wheel-seg)';g.push('<path d=\"'+clPath(cx,cy,ri,ro,start+i*slot,start+(i+1)*slot,pa)+'\" fill=\"'+fill+'\" stroke=\"var(--wheel-ring)\" stroke-width=\"3\"/>');});\n    steps.forEach(function(z,i){var ac=start+(i+0.5)*slot,lp=polar(cx,cy,mid,ac);g.push(clText(lp[0],lp[1],clWrap(z.label),'#fff',10.5));});\n    steps.forEach(function(z,i){var bp=polar(cx,cy,mid,start+(i+0.8)*slot);g.push(clBadge(bp[0],bp[1],z.n,'var(--wheel-badge-bg)','var(--navy)'));});\n    var ring='<svg viewBox=\"0 0 580 560\" width=\"100%\" style=\"max-width:520px;display:block;margin:0 auto\">'+g.join('')+'</svg>';\n    function blk(st){var pl=PILL[st.rag];return '<div class=\"cl-blk\" data-ek=\"'+st.k+'\"><div class=\"cl-h\"><span class=\"cl-num\">'+st.n+'</span><span class=\"cl-n\">'+esc(st.label)+'</span><span class=\"chpill\" style=\"background:'+pl[0]+';color:'+pl[1]+'\">'+(st.avg!=null?st.avg.toFixed(1)+'/5':'n/a')+'</span></div><div class=\"cl-q\">'+esc(st.q)+'</div>'+ladder(st)+'<ul class=\"ins\">'+st.segs.map(function(sg){var nm='<b>'+esc(sg.name)+'</b>',r=sg.rag||segRag(sg.score),sc=sg.score==null?'<span style=\"color:var(--mut);font-style:italic\">n/a</span>':'<span style=\"color:'+C[r]+';font-weight:700\">'+sg.score+'/5</span>';return sg.score==null?'<li style=\"--bc:'+C[r]+'\">'+nm+' '+sc+'</li>':'<li style=\"--bc:'+C[r]+'\">'+nm+' '+sc+': '+esc((sg.points||[]).join(' '))+'</li>';}).join('')+'</ul></div>';}\n    function col(keys){return '<div class=\"cl-col\">'+keys.map(function(k){var st=null;steps.forEach(function(z){if(z.k===k)st=z;});return st?blk(st):'';}).join('')+'</div>';}\n    return '<div class=\"classic\">'+col(['target','consequences','building'])+ring+col(['roles','objectives'])+'</div>';\n  }\n  // DATA.gaps is the coverage record. It used to be accepted and never drawn, so a\n  // subdimension nobody probed vanished from the page. It renders under every view now.\n  function renderGaps(){var g=(DATA.gaps||[]).filter(function(x){return x&&String(x).trim();});\n    if(!g.length)return '';\n    return '<div class=\"gapbar\"><b>Still to probe</b><ul>'+g.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';}\n  var VIEWS={cycle:renderCycle,flow:renderFlow,classic:renderClassic},cur='cycle';\n  document.getElementById('ctx').textContent=DATA.context||'OPEX QUICKSCAN';\n  document.getElementById('lens').textContent=DATA.lens||'SKILLS WHEEL';\n  document.getElementById('title').innerHTML=hl(DATA.keyMessage||'');\n  document.getElementById('subt').textContent=DATA.teamName||'';\n  document.getElementById('src').innerHTML=DATA.source?('<b style=\"color:var(--txt)\">Source:</b> '+DATA.source):'';\n  document.getElementById('lg').innerHTML='<b style=\"color:var(--txt);margin-right:4px\">Legend:</b>'+['green','amber','red'].map(function(k){var p=PILL[k],lab={green:'Good 4–5',amber:'Fair 3',red:'Weak 1–2'}[k];return '<span class=\"lp\" style=\"background:'+p[0]+';color:'+p[1]+'\">● '+lab+'</span>';}).join('');\n\n  function fitView(){var v=document.getElementById('view'),vi=document.getElementById('vinner');\n    var ah=v.clientHeight;if(!ah)return;\n    var st=vi.querySelector('[data-stretch]'); if(st)st.style.height='';\n    vi.style.transform='none';\n    // The width-trick (widen, then scale back) makes content height depend on the scale, which makes an\n    // iterative fit oscillate and sometimes overshoot (bottom clips). H*s is monotonic in s, so binary-search\n    // the LARGEST scale whose content still fits the frame height with a safety gap. Cannot overshoot.\n    var lo=0.25,hi=1.12,best=0.25;\n    for(var k=0;k<12;k++){\n      var s=(lo+hi)/2;\n      vi.style.width=(100/s)+'%';\n      var H=vi.scrollHeight;\n      if(H*s<=ah-10){best=s;lo=s;}else{hi=s;}\n    }\n    vi.style.width=(100/best)+'%';vi.style.transform='scale('+best+')';\n    if(st){var free=(ah-10)/best-vi.scrollHeight; if(free>1)st.style.height=(st.offsetHeight+free)+'px';}}\n  function render(){document.getElementById('vinner').innerHTML=VIEWS[cur]()+renderGaps();requestAnimationFrame(fitView);setTimeout(fitView,60);}\n  function seg(id,attr,cb){var box=document.getElementById(id);box.querySelectorAll('button').forEach(function(b){b.onclick=function(){box.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');cb(b.getAttribute(attr));};});}\n  seg('views','data-v',function(v){cur=v;render();});\n  seg('theme','data-s',function(t){document.getElementById('pw').setAttribute('data-t',t);render();});\n  window.addEventListener('resize',fitView);\n\n  render();\n})();\n<\/script>\n</body></html>\n","team-barometer-builder":"<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Team Barometer — read-out</title>\n<style>\n  *{box-sizing:border-box}\n  :root{--page:#FFF}\n  html,body{margin:0;height:100vh;overflow:hidden}\n  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}\n  /* ===== NR BRAND THEME (inlined from brand.css; swap for a client template) ===== */\n  #pw{--navy:#0B2347;--navy-fill:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;\n      --slate-10:rgba(54,65,86,.09);--rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;\n      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FF ment.createElement('span');hint.className='swhint';\n    bar.appendChild(sg);bar.appendChild(hint);\n    var body=document.createElement('div');\n    function draw(){body.innerHTML='';body.appendChild(detMode==='timeline'?renderTimeline():renderPhaseGrid());\n      hint.innerHTML = (EDIT && EDITHINT(detMode)) ||\n        (detMode==='phase' ? 'Tasks grouped by phase and lane \\u2014 click a task for detail'\n                           : 'Full time grid \\u2014 scroll to follow the calendar');\n\n      }\n    sg.querySelectorAll('button').forEach(function(b){b.onclick=function(){detMode=b.getAttribute('data-s');sg.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');draw();};});\n    host.appendChild(bar);host.appendChild(body);draw();\n    return host;\n  }\n  var NATHEX={automate:'#2E5C8A','ai-accelerate':'#1C7A4A','ai-enhance':'#6EB1D1',redesign:'#D49A3A',keep:'#7991AD'};\n  function hexA(h,a){var n=parseInt(h.slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a.toFixed(2)+')';}\n  function phaseIdx(ph){return (HL.phases||[]).indexOf(ph);}\n  var NATK=['automate','ai-accelerate','ai-enhance','redesign','keep'];\n  function renderOpportunity(){\n    var host=document.createElement('div');\n    if(!A.filter(function(t){return t.nature;}).length){host.innerHTML='<div class=\"cov\" style=\"color:var(--txt);background:var(--soft);border-color:var(--line)\">No improvement opportunities captured yet.</div>';\n\n      return host;}\n    var useFte=hasFte;function val(t){return useFte?(typeof t.fte==='number'?t.fte:0):1;}\n    var byNat={};NATK.forEach(function(k){byNat[k]=0;});A.forEach(function(t){if(t.nature&&byNat.hasOwnProperty(t.nature))byNat[t.nature]+=val(t);});\n    var tot=0;NATK.forEach(function(k){tot+=byNat[k];});var autov=byNat.automate+byNat['ai-accelerate'];var pct=tot?Math.round(100*autov/tot):0;\n    var head=document.createElement('div');head.className='nbwrap';\n    head.innerHTML='<div class=\"nblabel\">'+(useFte?rn(autov)+' FTE ('+pct+'%) is automatable or AI-acceleratable':pct+'% of tagged tasks are automate or AI-accelerate')+'</div><div class=\"natbar\">'+NATK.map(function(k){return byNat[k]?'<div style=\"width:'+(100*byNat[k]/tot)+'%;background:'+NAT[k][0]+((k==='ai-enhance'||k==='keep')?';color:#0B2347':'')+'\"><span>'+NAT[k][1]+' '+rn(byNat[k])+(useFte?' FTE':'')+'</span></div>':'';}).join('')+'</div>';\n    host.appendChild(head);\n    var ops=A.filter(function(t){return t.nature&&t.nature!=='keep';});\n    ops.sort(function(a,b){var d=val(b)-val(a);if(d)return d;return (b.pains||[]).length-(a.pains||[]).length;});\n    var nAddr=0;ops.forEach(function(t){nAddr+=(t.pains||[]).length;});\n\n    var lab=document.createElement('div');lab.className='nblabel';lab.style.margin='16px 0 7px';\n    lab.innerHTML='Improvement opportunities and the pain points they address — <b>'+ops.length+'</b> opportunit'+(ops.length===1?'y':'ies')+' addressing <span style=\"color:var(--rag-red);font-weight:800\">'+nAddr+'</span> pain point'+(nAddr===1?'':'s');\n    host.appendChild(lab);\n    var tbl=document.createElement('div');tbl.className='otbl';\n    var html='<div class=\"orow ohd\"><span>Opportunity</span><span>Improvement</span><span>Phase</span><span>Owner</span><span style=\"text-align:right\">'+(useFte?'FTE':'')+'</span><span>Pain points addressed</span></div>';\n    ops.forEach(function(t){\n      var pains=(t.pains||[]);\n      var pc=pains.length?pains.map(function(p){return '<div class=\"opain\"><b>'+esc(p.theme)+'</b>'+(magStr(p)?' <span class=\"om\">'+esc(magStr(p))+'</span>':' <span class=\"onomag\">to quantify</span>')+'</div>';}).join('')\n                         :'<div class=\"onopain\">No pain documented — confirm the opportunity is real</div>';\n      html+='<div class=\"orow\" data-task=\"'+esc(t.id||'')+'\">'+\n        '<span><div class=\"otn\">'+esc(t.name)+'</div>'+(t.system?'<div class=\"osys\">'+esc(t.system)+'</div>':'')+'</span>'+\n        '<span><span class=\"nat\" style=\"background:'+NAT[t.nature][0]+((t.nature==='ai-enhance'||t.nature==='keep')?';color:#0B2347':'')+'\">'+NAT[t.nature][1]+'</span></span>'+\n        '<span class=\"oc\">'+esc(t.stage||'')+'</span>'+\n        '<span class=\"oc\"><span class=\"ownerdot\" style=\"background:'+laneColor(t.lane)+'\"></span>'+esc(t.lane||'')+'</span>'+\n        '<span class=\"ofte\">'+((useFte&&typeof t.fte==='number')?rn(t.fte):'')+'</span>'+\n        '<span>'+pc+'</span></div>';\n    });\n    tbl.innerHTML=html;\n\n    host.appendChild(tbl);\n    var gaps=A.filter(function(t){return !t.nature&&(t.pains||[]).length;});\n    if(gaps.length){var gp=0;gaps.forEach(function(t){gp+=(t.pains||[]).length;});\n      var gd=document.createElement('div');gd.className='cov';gd.style.marginTop='14px';\n      gd.innerHTML='<b>&#9888; '+gp+' pain point'+(gp===1?'':'s')+' on '+gaps.length+' task'+(gaps.length===1?'':'s')+' not yet linked to an improvement:</b> '+gaps.slice(0,8).map(function(t){return esc(t.name);}).join('  &middot;  ')+(gaps.length>8?'  &middot;  +'+(gaps.length-8)+' more':'');\n      host.appendChild(gd);}\n    return host;\n  }\n  function renderPains(){\n    var host=document.createElement('div');var rows=[];\n    A.forEach(function(t){(t.pains||[]).forEach(function(p){rows.push({theme:p.theme,mag:magStr(p),src:p.sourceId,task:t.name,owner:t.lane,phase:t.stage,_t:t,_p:p});});});\n    var quant=rows.filter(function(r){return r.mag;}).length;\n    var head=document.createElement('div');head.style.margin='0 0 10px';\n    head.innerHTML='<div class=\"nblabel\">'+rows.length+' pain points &middot; <span style=\"color:var(--rag-green)\">'+quant+' quantified</span> &middot; <span style=\"color:var(--rag-red)\">'+(rows.length-quant)+' missing a magnitude</span></div>';\n    host.appendChild(head);\n\n    var mode='phase';\n    var seg=document.createElement('div');seg.className='seg';seg.style.cssText='margin-bottom:10px;width:max-content';\n    seg.innerHTML='<button class=\"on\" data-s=\"phase\">By phase</button><button data-s=\"gap\">Unquantified first</button>';\n    var tbl=document.createElement('div');tbl.className='pregtbl';\n    function paint(){var r2=rows.slice();if(mode==='gap')r2.sort(function(a,b){return (a.mag?1:0)-(b.mag?1:0);});else r2.sort(function(a,b){return phaseIdx(a.phase)-phaseIdx(b.phase);});\n      tbl.innerHTML='<div class=\"preg preh\"><span>Pain</span><span>Magnitude</span><span>Task</span><span>Owner</span><span>Phase</span></div>'+r2.map(function(r,i){return '<div class=\"preg'+(r.mag?'':' nomag')+'\" data-row=\"'+i+'\"><span class=\"prt\">'+esc(r.theme)+'</span><span class=\"prm\">'+(r.mag?esc(r.mag):'<span style=\"color:var(--rag-red)\">to quantify</span>')+'</span><span class=\"prc\">'+esc(r.task)+'</span><span class=\"prc prow2\"><span class=\"ownerdot\" style=\"background:'+laneColor(r.owner)+'\"></span>'+esc(r.owner)+'</span><span class=\"prc\">'+esc(r.phase)+'</span></div>';}).join('');\n\n    }\n    seg.querySelectorAll('button').forEach(function(b){b.onclick=function(){seg.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');mode=b.getAttribute('data-s');paint();};});\n    paint();host.appendChild(seg);host.appendChild(tbl);return host;\n  }\n  var VIEWS={highlevel:renderHighlevel,opportunity:renderOpportunity,pains:renderPains,detail:renderDetail},cur='highlevel';\n  document.getElementById('ctx').textContent=DATA.context||'OPEX QUICKSCAN';\n  document.getElementById('lens').textContent=DATA.lens||'PROCESS MAP';\n  document.getElementById('title').innerHTML=hl(DATA.keyMessage||'');\n  document.getElementById('subt').textContent=DATA.teamName||'';\n  document.getElementById('kpis').innerHTML='';\n  function kpi(l,n,cls){return '<div class=\"kpi\"><div class=\"l\">'+esc(l)+'</div><div class=\"n '+cls+'\">'+esc(n)+'</div></div>';}\n  document.getElementById('src').innerHTML=DATA.source?('<b style=\"color:var(--txt)\">Source:</b> '+esc(DATA.source)):'';\n  function setLegend(){var el=document.getElementById('lg');\n    if(hasFte&&(cur==='opportunity'||cur==='detail')){el.innerHTML='<b style=\"color:var(--txt);margin-right:2px\">Improvement:</b>'+Object.keys(NAT).map(function(k){return '<span class=\"lp\" style=\"background:var(--soft);color:var(--txt)\"><i style=\"background:'+NAT[k][0]+'\"></i>'+NAT[k][1]+'</span>';}).join('');}\n    else{el.innerHTML='<span class=\"lp\" style=\"background:var(--soft);color:var(--mut)\">Owners coloured by lane &middot; click an activity to open its tasks</span>';}}\n  function fitView(){var vi=document.getElementById('vinner');pm.classList.add('scrollmode');vi.style.transform='none';vi.style.width='auto';}\n  var EDIT=false;   // client read-out: the whole edit layer is STRIPPED; this keeps the hooks inert\n  var EDITCARD=function(){};\n  var EDITHINT=function(){return '';};\n  var PGRIP=function(){return '';};\n  var LGRIP=function(){return '';};\n  var ON=false;   // editing ACTIVE? The working copy loads LOCKED so nothing changes by accident.\n\n\n  function render(){var vi=document.getElementById('vinner');vi.innerHTML='';vi.appendChild(VIEWS[cur]());setLegend();requestAnimationFrame(fitView);setTimeout(fitView,60);}\n  function seg(id,attr,cb){var box=document.getElementById(id);box.querySelectorAll('button').forEach(function(b){b.onclick=function(){box.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');cb(b.getAttribute(attr));};});}\n  seg('views','data-v',function(v){cur=v;render();});\n  seg('theme','data-s',function(t){pm.setAttribute('data-t',t);render();});\n  document.getElementById('pinwrap').onclick=function(e){if(e.target===this)closePin();};\n  window.addEventListener('keydown',function(e){if(e.key==='Escape')closePin();});\n  window.addEventListener('resize',fitView);\n  render();\n\n})();\n<\/script>\n</body></html>\n","mae-builder":"<!doctype html>\n<!-- ============================================================================\n  MAE TEMPLATE · team-level activity map (joins the process baseline by Activity ID).\n  Built on the editable artifact shell: render_mae.py emits TWO builds - the client\n  mae.html (editing layer stripped at build time, zero editor references) and\n  mae.WORKING.html (lock-by-default in-place editing; exports one delta that\n  apply_mae_delta.py routes: layer fields to mae-layer.json, FTE through the one\n  gate + changelog, baseline records to apply_delta.py for review).\n============================================================================ -->\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>MAE — Team activity map</title>\n<style>\n  *{box-sizing:border-box}\n  :root{--page:#FFF}\n  html,body{margin:0;height:100vh;overflow:hidden}\n  body{background:var(--page);font-family:'Aptos','Segoe UI',system-ui,sans-serif;transition:background .25s}\n  /* ===== BRAND THEME (inlined from templates/brand.css) ===== */\n  #art{--navy:#0B2347;--slate:#364156;--steel:#7991AD;--green:#1C7A4A;--accent:#6EB1D1;--sky:#A9D5E6;--navy2:#16315B;\n      --slate-10:rgba(54,65,86,.09);--navy-10:rgba(11,35,71,.10);--green-10:rgba(28,122,74,.10);\n      --rag-green:#2F8F6B;--rag-amber:#D49A3A;--rag-red:#D2645A;--rag-na:#9AA4B0;--tint-green:rgba(47,143,107,.13);--tint-amber:rgba(212,154,58,.16);--tint-red:rgba(210,100,90,.13);--tint-na:rgba(154,164,176,.16);--navy-fill:#0B2347;--ball-track:rgba(54,65,86,.09);\n      --ink:#15243A;--txt:#46505C;--mut:#7A838F;--line:#E1E6EE;--card:#FFF;--bg:#FFF;\n      --sh:0 1px 2px rgba(20,30,50,.04),0 14px 32px -24px rgba(20,30,50,.30);\n      width:100%;max-width:2200px;margin:0 auto;height:100vh;overflow:hidden;position:relative;\n      display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:76px 40px 12px 98px}\n  #art[data-t=\"dark\"]{--bg:#16202C;--card:#1E2937;--ink:#EAEFF5;--txt:#C4CEDA;--mut:#94A  var(--line)\">'+esc(a.name)+'</b>'+tasks+'</td>'+\n    '<td>'+(a.nature?'<span class=\"nat '+a.nature+'\">'+a.nature+'</span>':'<span class=\"nat na\">?</span>')+'</td>'+\n    '<td class=\"wl\"><b>'+n1(a.fte||0)+'</b><div class=\"wbar\"><i style=\"width:'+Math.min((a.fte||0)/hc*100/0.4,100)+'%\"></i></div><span class=\"pctt\">'+Math.round((a.fte||0)/hc*100)+'% of team</span></td>'+\n    '<td>'+(a.volumeDriver?esc(a.volumeDriver):'<span class=\"toprobe\">to probe</span>')+'</td>'+\n    '<td style=\"min-width:150px\">'+tools+'</td><td style=\"min-width:150px\">'+dat+'</td><td style=\"min-width:140px\">'+inf+'</td>'+\n    '<td><div class=\"opt'+(a.pct==null?' ind':'')+'\" data-oid=\"'+a.id+'\">'+ball(p)+'<div><span class=\"op\">'+p+'%</span>'+(a.pct==null?'<span style=\"font-size:9.5px;color:var(--mut)\"> indicative</span>':'')+'<br><span class=\"of\">~'+n1((a.fte||0)*p/100)+' FTE</span></div></div></td></tr>';}\n  function natOf(a){return a.nature||null;}\n  function renderPrio(){\n    var NATL={R:'R · rule-based',S:'S · semi-structured',K:'K · knowledge-driven'};\n    var acts=DATA.activities.slice().sort(function(x,y){return (y.fte||0)*eff(y)-(x.fte||0)*eff(x);});\n    var vb=document.getElementById('view');\n    var availW=vb.clientWidth||1600, availH=(vb.clientHeight||760)-48;\n    var W=980, H=Math.max(430,Math.min(1100,Math.round(W*availH/(availW*0.585))));\n    var L=70,B=64,T=34,R=28;\n    var ftes=DATA.activities.map(function(a){return a.fte||0;});\n    var maxF=Math.max.apply(null,ftes.concat([1]))*1.15;\n    var minF=Math.max(0,Math.min.apply(null,ftes.concat([maxF]))*0.6);\n    var maxE=Math.max.apply(null,DATA.activities.map(function(a){return eff(a);}).concat([25]));\n    var xMax=Math.min(100,Math.max(50,Math.ceil((maxE+12)/25)*25));\n    function X(p){return L+(p/xMax)*(W-L-R);} function Y(f){return H-B-((f-minF)/(maxF-minF))*(H-T-B);}\n    var midF=(minF+maxF)/2,midY=Y(midF),midX=xMax/2;\n    var g='<rect x=\"'+X(midX)+'\" y=\"'+T+'\" width=\"'+(W-R-X(midX))+'\" height=\"'+(midY-T)+'\" fill=\"var(--green)\" opacity=\".07\"/>'+\n      '<rect x=\"'+X(midX)+'\" y=\"'+midY+'\" width=\"'+(W-R-X(midX))+'\" height=\"'+(H-B-midY)+'\" fill=\"var(--green)\" opacity=\".035\"/>'+\n      '<line x1=\"'+L+'\" y1=\"'+T+'\" x2=\"'+L+'\" y2=\"'+(H-B)+'\" stroke=\"var(--line)\" stroke-width=\"2\"/>'+\n      '<line x1=\"'+L+'\" y1=\"'+(H-B)+'\" x2=\"'+(W-R)+'\" y2=\"'+(H-B)+'\" stroke=\"var(--line)\" stroke-width=\"2\"/>'+\n      '<line x1=\"'+X(midX)+'\" y1=\"'+T+'\" x2=\"'+X(midX)+'\" y2=\"'+(H-B)+'\" stroke=\"var(--line)\" stroke-dasharray=\"6 6\"/>'+\n      '<line x1=\"'+L+'\" y1=\"'+midY+'\" x2=\"'+(W-R)+'\" y2=\"'+midY+'\" stroke=\"var(--line)\" stroke-dasharray=\"6 6\"/>'+\n      '<text x=\"'+(W-R-10)+'\" y=\"'+(T+20)+'\" text-anchor=\"end\" class=\"qlab\" fill=\"var(--green)\">biggest value pools</text>'+\n      '<text x=\"'+(L+10)+'\" y=\"'+(T+20)+'\" class=\"qlab\" fill=\"var(--mut)\">large — little inefficiency found</text>'+\n      '<text x=\"'+(W-R-10)+'\" y=\"'+(H-B-12)+'\" text-anchor=\"end\" class=\"qlab\" fill=\"var(--steel)\">small but inefficient</text>'+\n      '<text x=\"'+(L+10)+'\" y=\"'+(H-B-12)+'\" class=\"qlab\" fill=\"var(--mut)\">small pools</text>'+\n      '<text x=\"'+(W-R)+'\" y=\"'+(H-14)+'\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--mut)\">INEFFICIENCY LEVEL →</text>'+\n      '<text x=\"'+(L-10)+'\" y=\"'+(T-14)+'\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"700\" fill=\"var(--mut)\">FTE ↑</text>';\n    [1,2,3,4].forEach(function(q){var p=Math.round(xMax*q/4);g+='<text x=\"'+X(p)+'\" y=\"'+(H-B+22)+'\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--mut)\">'+p+'%</text>';});\n    [minF,midF,maxF].forEach(function(f){g+='<text x=\"'+(L-10)+'\" y=\"'+(Y(f)+4)+'\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--mut)\">'+n1(f)+'</text>';});\n    var placed=[];\n    acts.forEach(function(a,i){var p=eff(a),f=a.fte||0,imp=f*p/100;\n      var r=11+Math.sqrt(imp)*8.5; if(r>44)r=44;\n      var cx=X(p),cy=Y(f);\n      var below=placed.some(function(q){return Math.abs(q.x-cx)<150&&Math.abs(q.y-cy)<(q.r+r+52)&&q.y<=cy;});\n      placed.push({x:cx,y:cy,r:r});\n      var y1=below?cy+r+22:cy-r-20, y2=below?cy+r+38:cy-r-5;\n      g+='<circle data-oid=\"'+a.id+'\" cx=\"'+cx+'\" cy=\"'+cy+'\" r=\"'+r+'\" fill=\"var(--green)\" fill-opacity=\"'+(0.16+0.5*p/100).toFixed(2)+'\" stroke=\"var(--green)\" stroke-width=\"2\"><title>'+esc(a.name)+' · '+n1(f)+' FTE · '+p+'% inefficient → ~'+n1(imp)+' FTE pool</title></circle>'+\n      '<text x=\"'+cx+'\" y=\"'+(cy+6)+'\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"800\" fill=\"var(--green)\">'+(i+1)+'</text>'+\n      '<text x=\"'+cx+'\" y=\"'+y1+'\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--ink)\" stroke=\"var(--card)\" stroke-width=\"4\" style=\"paint-order:stroke\">'+esc(a.name.length>28?a.name.slice(0,26)+'…':a.name)+'</text>'+\n      '<text x=\"'+cx+'\" y=\"'+y2+'\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--txt)\" stroke=\"var(--card)\" stroke-width=\"4\" style=\"paint-order:stroke\">'+n1(f)+' FTE · '+p+'% → ~'+n1(imp)+' FTE</text>';});\n    var side='<div class=\"pside\"><div class=\"colh\">Value pools — by inefficient FTE</div>'+acts.map(function(a,i){\n      var p=eff(a),imp=(a.fte||0)*p/100;\n      var i0=(a.ineff&&a.ineff[0])||null;\n      var pain=i0?('<span class=\"ilab\" style=\"font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);font-weight:800;margin-right:5px\">'+esc(i0.label)+'</span>'+(i0.quant?'<span class=\"vpill\">'+esc(i0.value||'')+'</span>':'<span class=\"nq\">not quantified</span>')+(i0.rootCause?'<span style=\"display:block;color:var(--ink);font-weight:600;margin-top:2px\">'+esc(i0.rootCause)+'</span>':'')):'';\n      return '<div class=\"pcard\"><span class=\"prank\">'+(i+1)+'</span><div><b>'+esc(a.name)+'</b>'+\n      '<div class=\"psub\">'+n1(a.fte||0)+' FTE × '+p+'% → <span class=\"imp\">~'+n1(imp)+' FTE</span>'+(a.nature?' · '+NATL[a.nature]:'')+(a.pct==null?' · <i>indicative</i>':'')+'</div>'+\n      (pain?'<div class=\"ppain\">'+pain+'</div>':'')+'</div></div>';}).join('')+'</div>';\n    return '<div class=\"vcols\"><div class=\"prio\"><svg viewBox=\"0 0 '+W+' '+H+'\">'+g+'</svg></div>'+side+'</div>';}\n  function renderTools(){\n    var TH={core:['Healthy','var(--rag-green)','var(--tint-green)',1],\n            'shadow-it':['Shadow IT','var(--tAmb)','var(--tint-amber)',2],\n            gap:['Missing','var(--tRed)','var(--tint-red)',3]};\n    var DH={reliable:['Reliable','var(--rag-green)','var(--tint-green)',1],\n            unreliable:['Unreliable','var(--tAmb)','var(--tint-amber)',2],\n            unavailable:['Unavailable','var(--tRed)','var(--tint-red)',3]};\n    function agg(field,keyName,rankMap,extraKey){\n      var m={},order=[];\n      DATA.activities.forEach(function(a){(a[field]||[]).forEach(function(x){\n        var nm=x.name; if(!m[nm]){m[nm]={name:nm,extra:{},acts:[],fte:0,worst:null,rank:0};order.push(nm);}\n        var e=m[nm];\n        if(x[extraKey])e.extra[x[extraKey]]=1;\n        if(e.acts.indexOf(a.name)<0){e.acts.push(a.name);e.fte+=(a.fte||0);e.ids=e.ids||[];e.ids.push(a.id);}\n        var st=x[keyName],r=(rankMap[st]||[0,0,0,0])[3];\n        if(r>e.rank){e.rank=r;e.worst=st;}});});\n      return order.map(function(k){return m[k];});}\n    function card(e,rankMap,kindWord){\n      var h=rankMap[e.worst]||['?','var(--rag-na)','var(--slate-10)',0];\n      return '<div class=\"hcard\" data-ids=\"'+e.ids.join(',')+'\" style=\"border-left-color:'+h[1]+'\">'+\n      '<div class=\"hh\"><b>'+esc(e.name)+'</b><span class=\"hb\" style=\"background:'+h[2]+';color:'+h[1]+'\">'+h[0]+'</span></div>'+\n      '<div class=\"hsub\">'+esc(Object.keys(e.extra).join(' · ')||kindWord)+'</div>'+\n      '<div class=\"hexp\"><b>'+n1(e.fte)+' FTE</b> touched · '+e.acts.length+' activit'+(e.acts.length===1?'y':'ies')+'</div>'+\n      '<div class=\"hacts\">'+esc(e.acts.join(' · '))+'</div></div>';}\n    var tools=agg('tools','status',TH,'role');\n    var data=agg('data','reliability',DH,'source');\n    return '<div class=\"hcsec\"><div class=\"colh\">Tooling — '+tools.length+' asset'+(tools.length===1?'':'s')+'</div><div class=\"hcgrid\">'+\n      tools.map(function(e){return card(e,TH,'tool');}).join('')+'</div></div>'+\n      '<div class=\"hcsec\"><div class=\"colh\">Data — '+data.length+' item'+(data.length===1?'':'s')+' · worst observed reliability</div><div class=\"hcgrid\">'+\n      data.map(function(e){return card(e,DH,'data');}).join('')+'</div></div>';}\n  function renderMatrix(){\n    var tot=DATA.activities.reduce(function(s,a){return s+(a.fte||0);},0);\n    return (\n    '<table class=\"mx2\"><thead><tr><th>Activity</th><th>Nature</th><th>Workload (FTE)</th><th>Volume driver</th><th>Tools used</th><th>Data used</th><th>Inefficiencies</th><th>Inefficiency level</th></tr></thead><tbody>'+\n    DATA.activities.map(row).join('')+\n    '<tr class=\"total\"><td>Total</td><td></td><td>'+n1(tot)+' FTE</td><td colspan=\"4\" style=\"color:var(--mut);font-weight:400\">'+DATA.activities.length+' activities mapped · '+n1(DATA.headcount)+' FTE in scope</td><td style=\"color:var(--green)\">~'+n1(impact())+' FTE inefficiency identified</td></tr>'+\n    '</tbody></table>');}\n  var VIEWS={matrix:renderMatrix,prio:renderPrio,tools:renderTools},cur='matrix';\n  function render(){document.getElementById('vinner').innerHTML=VIEWS[cur]();\n    \n    requestAnimationFrame(fitView);setTimeout(fitView,60);}\n  document.getElementById('ctx').textContent=DATA.context||'OPEX QUICKSCAN';\n  document.getElementById('lens').textContent=DATA.lens||'BASELINE · MAE';\n  document.getElementById('title').innerHTML=hl(DATA.keyMessage||'');\n  document.getElementById('subt').textContent=(DATA.teamName||'')+(DATA.generatedAt?' · '+DATA.generatedAt:'');\n  document.getElementById('src').innerHTML=(DATA.source?('<b style=\"color:var(--txt)\">Source:</b> '+esc(DATA.source)):'')+(DATA.baselineVersion?' <span style=\"opacity:.75\">· baseline '+esc(String(DATA.baselineVersion).slice(0,8))+'</span>':'');\n  document.getElementById('lg').innerHTML=\n    '<span class=\"lgrp\"><b>Nature</b><span class=\"lp\" style=\"background:rgba(110,177,209,.18);color:var(--tR)\">R rule-based</span><span class=\"lp\" style=\"background:var(--green-10);color:var(--tS)\">S semi-structured</span><span class=\"lp\" style=\"background:rgba(127,119,221,.16);color:var(--tK)\">K knowledge-driven</span></span>'+\n    '<span class=\"lgrp\"><b>Inefficiency</b><span class=\"li\">'+ball(50)+'share of the activity’s effort that is inefficient today · indicative until set with the business</span></span>';\n  function fitView(){var v=document.getElementById('view'),vi=document.getElementById('vinner');var ah=v.clientHeight;if(!ah)return;\n    var tb=vi.querySelector('table.mx2'); if(tb)tb.style.height='';\n    vi.style.transform='none';var lo=0.25,hi=1.12,best=0.25;\n    for(var k=0;k<12;k++){var s=(lo+hi)/2;vi.style.width=(100/s)+'%';if(vi.scrollHeight*s<=ah-10){best=s;lo=s;}else{hi=s;}}\n    vi.style.width=(100/best)+'%';vi.style.transform='scale('+best+')';\n    if(tb){var free=(ah-10)/best-vi.scrollHeight; if(free>1)tb.style.height=(tb.offsetHeight+free)+'px';}}\n  function seg(id,attr,cb){var box=document.getElementById(id);if(!box)return;box.querySelectorAll('button').forEach(function(b){b.onclick=function(){box.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');cb(b.getAttribute(attr));};});}\n  seg('views','data-v',function(v){cur=v;render();});\n  seg('theme','data-s',function(t){document.getElementById('art').setAttribute('data-t',t);render();});\n  window.addEventListener('resize',function(){if(cur==='prio')render();else fitView();});\n\n  render();\n\n})();\n<\/script>\n</body></html>\n"}</script>
